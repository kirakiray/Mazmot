  <script>
    import { getStorage } from "/nos/storage/main.js";
    import { get, init } from "/nos/fs/main.js";
    import { DirHandle } from "/nos/fs/handle/dir.js";
    import toast from "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js";
    import confirm from "/gh/ofajs/senti-ui@latest/packages/dialog/confirm.js";
    import {
      openedWindows,
      readOpenedFromLS,
      isWindowAlive,
      startAppStatusWatcher,
      markOpened,
      clearOpened,
      focusIfOpened,
    } from "./home/app-status.js";
    import { getRunUrl } from "/mz/app-runner.js";
    import {
      ensureUser,
      generateAppId,
      publishApp,
      unpublishApp,
      buildOfficialRunUrl,
    } from "/mz/share-mgr.js";
    import { syncOfficialAppState } from "./lib/official-app-state.js";
    import {
      loadOfficialAppMeta,
      compareVersions,
      installOfficialApp,
    } from "./home/official-app-writer.js";

    const storage = getStorage("mazmot");

    async function loadApps() {
      const apps = (await storage.getItem("apps")) || [];
      // 从 localStorage 恢复已打开路径快照
      const lsOpened = new Set(readOpenedFromLS());
      // 当前用户的 userId，用于判定「自己开发的应用」
      let currentUserId = "";
      try {
        const currentUser = await ensureUser();
        currentUserId = (currentUser && currentUser.userId) || "";
      } catch (err) {
        console.warn("获取当前用户失败：", err);
      }
      const results = await Promise.all(
        apps.map(async (app) => {
          let manifest = null;
          // 根据 source 类型构造 handle：
          // - virtual / official：通过 init(namespace) 重新拿到虚拟根目录
          // - local（或旧数据）：通过 new DirHandle 包裹原生句柄
          let handle = null;
          // 虚拟目录：目录名 = dirName 去掉 namespace 前缀；缺省时回退到 app.name
          const isVirtualLike =
            app.source === "virtual" || app.source === "official";
          const namespaceForApp = app.namespace || "mazmot-apps";
          const namespacePrefix = namespaceForApp + "/";
          let virtualDirName = "";
          if (isVirtualLike) {
            if (app.dirName && app.dirName.startsWith(namespacePrefix)) {
              virtualDirName = app.dirName.slice(namespacePrefix.length);
            } else if (app.dirName) {
              virtualDirName = app.dirName;
            } else {
              virtualDirName = app.name;
            }
          }
          try {
            if (isVirtualLike) {
              const rootDir = await init(namespaceForApp);
              handle = await rootDir.get(virtualDirName, { create: "dir" });
            } else if (app.handle) {
              handle = new DirHandle(app.handle);
            }
          } catch (err) {
            console.warn(`初始化 ${app.name} 的句柄失败：`, err);
          }

          try {
            // 优先尝试从 client/app.json 获取，如果不存在则尝试根目录（兼容旧应用）
            if (handle) {
              let jsonFile = null;
              try {
                const clientDir = await handle.get("client");
                jsonFile = await clientDir.get("app.json");
              } catch (e) {
                jsonFile = await handle.get("app.json");
              }

              if (jsonFile) {
                manifest = await jsonFile.json();
              }
            }
          } catch (err) {
            console.warn(`读取 ${app.name} 的配置失败：`, err);
          }

          return {
            icon: (manifest && manifest.icon) || "📦",
            name:
              (manifest && (manifest.displayName || manifest.name)) || app.name,
            desc: (manifest && manifest.description) || app.desc || "",
            dirName:
              app.dirName ||
              (app.source === "virtual"
                ? `${app.namespace || "mazmot-apps"}/${app.name}`
                : app.name) ||
              "",
            version: (manifest && manifest.version) || "0.1.0",
            _handle: handle,
            source: app.source || "local",
            namespace: app.namespace || "",
            virtualDirName,
            _recordName: app.name,
            appId: app.appId || "",
            officialId: app.officialId || "",
            latestVersion: "",
            hasUpdate: false,
            offline: false,
            updating: false,
            updateStatus: "",
            // 自己开发的应用：appId 后缀为当前用户的 userId
            isMine:
              !!currentUserId &&
              !!app.appId &&
              app.appId.endsWith("-" + currentUserId),
            opened: isWindowAlive(app.name) || lsOpened.has(app.name),
            autoShare: !!app.autoShare,
            autoShareUrl: "",
            autoShareState: app.autoShare ? "pending" : "idle",
            autoShareStatus: app.autoShare ? "等待发布..." : "已关闭",
            autoSharePermissionError: false,
          };
        }),
      );
      return results;
    }

    export default async () => {
      const initialApps = await loadApps();

      return {
        data: {
          dialogOpen: false,
          marketDialogOpen: false,
          appList: initialApps,
          shareDialogOpen: false,
          shareUrl: "",
        },
        attached() {
          // 启动广播监听 + 定时探测
          this._stopWatcher = startAppStatusWatcher({
            onAlive: (name) => {
              const target = this.appList.find((a) => a._recordName === name);
              if (target && !target.opened) target.opened = true;
            },
            onBye: (name) => {
              const target = this.appList.find((a) => a._recordName === name);
              if (target && target.opened) target.opened = false;
            },
            onTick: (aliveNames) => {
              this.appList.forEach((app) => {
                const alive = aliveNames.has(app._recordName);
                if (app.opened !== alive) app.opened = alive;
              });
            },
          });
          // 首次进入页面时，为所有已开启分享的应用发布一次
          this._runAutoShareAll();
          // 检查官方应用是否有新版本
          this._checkOfficialUpdates();
        },
        detached() {
          if (this._stopWatcher) {
            this._stopWatcher();
            this._stopWatcher = null;
          }
        },
        proto: {
          handleAdd() {
            this.dialogOpen = true;
          },

          _markOpened(app, win) {
            markOpened(app._recordName, win);
            const target = this.appList.find(
              (a) => a._recordName === app._recordName,
            );
            if (target) target.opened = true;
          },

          // 新标签页打开（点击按钮版本，阻止冒泡）
          handleOpenTab(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            return this.handleOpen(app);
          },

          // 新标签页打开
          async handleOpen(app) {
            if (!app || !app._handle) {
              toast({ message: "无法打开：缺少应用句柄", color: "error" });
              return;
            }
            if (focusIfOpened(app._recordName)) return;

            let url;
            try {
              url = await getRunUrl(app);
            } catch (err) {
              toast({
                message: "无法生成运行地址：" + (err.message || err),
                color: "error",
              });
              return;
            }

            const win = window.open(url, `mazmot-app-${app._recordName}`);
            if (win) this._markOpened(app, win);
          },

          // 小窗口打开（尽量像原生应用）
          async handleOpenWindow(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app._handle) {
              toast({ message: "无法打开：缺少应用句柄", color: "error" });
              return;
            }
            if (focusIfOpened(app._recordName)) return;

            let url;
            try {
              url = await getRunUrl(app);
            } catch (err) {
              toast({
                message: "无法生成运行地址：" + (err.message || err),
                color: "error",
              });
              return;
            }

            // 类原生应用窗口：无地址栏/工具栏/菜单栏；居中显示
            const width = 1024;
            const height = 720;
            const left = Math.max(
              0,
              Math.round((screen.availWidth - width) / 2),
            );
            const top = Math.max(
              0,
              Math.round((screen.availHeight - height) / 2),
            );
            const features = [
              `width=${width}`,
              `height=${height}`,
              `left=${left}`,
              `top=${top}`,
              "popup=yes",
              "resizable=yes",
              "scrollbars=yes",
              "toolbar=no",
              "menubar=no",
              "location=no",
              "status=no",
              "titlebar=no",
            ].join(",");

            const win = window.open(
              url,
              `mazmot-app-${app._recordName}`,
              features,
            );
            if (!win) {
              toast({
                message: "窗口被浏览器拦截，请允许弹出窗口",
                color: "error",
              });
              return;
            }
            this._markOpened(app, win);
          },

          async handleDialogClose() {
            this.dialogOpen = false;
            await this.refreshApps();
          },

          // 从添加应用弹窗切换到应用市场弹窗
          handleOpenMarket() {
            this.dialogOpen = false;
            this.marketDialogOpen = true;
          },

          // 应用市场关闭时刷新列表
          async handleMarketClose() {
            this.marketDialogOpen = false;
            await this.refreshApps();
          },
          async refreshApps() {
            const apps = await loadApps();
            this.appList.length = 0;
            apps.forEach((app) => this.appList.push(app));
            // 刷新后再对已开启分享的应用执行一次发布
            this._runAutoShareAll();
            // 刷新后重新检查官方应用更新
            this._checkOfficialUpdates();
          },

          // 遍历列表，把官方应用的本地版本与市场版本比对，标记是否可更新
          async _checkOfficialUpdates() {
            const officialApps = this.appList.filter(
              (app) => app.source === "official" && app.officialId,
            );
            for (const app of officialApps) {
              try {
                const meta = await loadOfficialAppMeta(app.officialId);
                if (!meta) {
                  // 官方应用已从市场下线
                  app.offline = true;
                  app.hasUpdate = false;
                  continue;
                }
                app.offline = false;
                if (!meta.version) continue;
                app.latestVersion = meta.version;
                app.hasUpdate = compareVersions(meta.version, app.version) > 0;
              } catch (err) {
                console.warn(`检查 ${app.name} 更新失败：`, err);
              }
            }
          },

          // 重新拉取官方应用源文件覆盖写入 client/，实现原地更新
          async handleUpdate(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app.officialId || !app._handle) {
              toast({ message: "无法更新：缺少应用信息", color: "error" });
              return;
            }
            if (app.updating) return;

            const ok = await confirm({
              title: "更新应用",
              message: `将「${app.name}」从 v${app.version} 更新到 v${app.latestVersion}。应用内保存的数据不受影响，但自定义修改过的源文件会被覆盖。`,
              yes: "更新",
              cancel: "取消",
            });
            if (!ok) return;

            app.updating = true;
            app.updateStatus = "准备更新...";
            try {
              await installOfficialApp({
                dirHandle: app._handle,
                appId: app.officialId,
                onProgress: ({ path, status }) => {
                  app.updateStatus =
                    status === "writing"
                      ? `正在写入 ${path} ...`
                      : `已写入 ${path}`;
                },
              });
              app.updateStatus = "";
              toast({
                message: `${app.name} 已更新到 v${app.latestVersion}`,
                color: "success",
              });
              await this.refreshApps();
            } catch (err) {
              console.error("更新失败：", err);
              app.updateStatus = "更新失败：" + (err.message || err);
              toast({
                message: "更新失败：" + (err.message || err),
                color: "error",
              });
            } finally {
              app.updating = false;
            }
          },

          // 遍历列表，对所有已开启 autoShare 的应用触发一次 publish
          _runAutoShareAll() {
            this.appList.forEach((app) => {
              if (app.autoShare) {
                // 不 await，避免阻塞列表渲染；错误会写回 app.autoShareState
                this.autoShareApp(app);
              }
            });
          },

          // 打开分享二维码弹窗（链接已由分享发布好）
          showShareQrCode(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app.autoShareUrl) {
              toast({ message: "分享链接尚未生成", color: "tertiary" });
              return;
            }
            this.shareUrl = app.autoShareUrl;
            this.shareDialogOpen = true;
          },

          // 切换某个应用的"分享"开关（change 后 st-switch 的 checked 属性已同步）
          async handleAutoShareToggle(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            const target = this.appList.find(
              (a) => a._recordName === app._recordName,
            );
            if (!target) return;

            const nextChecked = event.target.hasAttribute("checked");
            target.autoShare = nextChecked;
            await this._persistAppField(target._recordName, {
              autoShare: nextChecked,
            });

            if (!nextChecked) {
              // 关闭时撤销发布，让旧的分享链接失效。
              // 官方应用走 HTTP 链接、没发布 P2P payload，无需 unpublish。
              if (target.source !== "official") {
                unpublishApp(target).catch((err) =>
                  console.warn("撤销分享失败：", err),
                );
              }
              target.autoShareUrl = "";
              target.autoShareState = "idle";
              target.autoShareStatus = "已关闭";
              return;
            }

            await this.autoShareApp(target);
          },

          // 对单个已开启分享的应用执行发布，写回状态。
          // 官方应用走同源 HTTP 链接（?app=<officialId>），接收端直接拉取
          // /official-apps/，无需 P2P 分发、不依赖发布者在线。
          // 其余应用走 P2P：读取文件 → 打包 → publish → 生成 u/h 短链接。
          async autoShareApp(target) {
            if (!target) return;

            // 官方应用分支
            if (target.source === "official" && target.officialId) {
              target.autoShareState = "ready";
              target.autoShareStatus = "官方应用，对方可直接连接";
              target.autoShareUrl = buildOfficialRunUrl(
                location.origin,
                target.officialId,
              );
              return;
            }

            // P2P 分支
            if (!target._handle) {
              target.autoShareState = "error";
              target.autoShareStatus = "缺少目录句柄，无法发布";
              return;
            }
            target.autoShareState = "publishing";
            target.autoShareStatus = "发布中...";
            try {
              // 老数据补 appId
              let appId = target.appId;
              if (!appId) {
                appId = await generateAppId(target._recordName);
                await this._persistAppField(target._recordName, { appId });
                target.appId = appId;
              }
              const { shareUrl, payloadHash, fileHash } = await publishApp(target, {
                appId,
                onProgress: ({ text }) => {
                  if (text) target.autoShareStatus = text;
                },
              });
              target.autoShareUrl = shareUrl;
              target.autoShareState = "ready";
              target.autoShareStatus = "已发布，对方可直接连接";
              // 持久化 payloadHash 和 fileHash 到记录，供秒跳和撤销分享时使用
              if (payloadHash) {
                target.payloadHash = payloadHash;
                target.fileHash = fileHash || "";
                await this._persistAppField(target._recordName, {
                  payloadHash,
                  fileHash: fileHash || "",
                });
              }
            } catch (err) {
              console.error("分享失败：", err);
              target.autoShareState = "error";
              target.autoShareStatus =
                "发布失败：" + (err.message || String(err));
              target.autoSharePermissionError = /not allowed by the user agent or the platform/i.test(
                err.message || "",
              );
            }
          },

          // 重新获取目录句柄权限并重试分享
          async requestPermissionAndRetry(event, target) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!target || !target._handle) return;
            try {
              // 取出原生 FileSystemDirectoryHandle（DirHandle 包装在 _handle 属性上）
              const rawHandle = target._handle._handle || target._handle;
              if (!rawHandle || !rawHandle.requestPermission) {
                toast({ message: "当前浏览器不支持重新获取权限", color: "error" });
                return;
              }
              // 先查询权限状态，不 granted 则请求重新授权
              let state = await rawHandle.queryPermission({ mode: "readwrite" });
              if (state !== "granted") {
                state = await rawHandle.requestPermission({ mode: "readwrite" });
              }
              if (state === "granted") {
                target.autoSharePermissionError = false;
                await this.autoShareApp(target);
              } else {
                toast({ message: "权限未授予，请重试", color: "tertiary" });
              }
            } catch (err) {
              console.error("重新获取权限失败：", err);
              toast({
                message: "重新获取权限失败：" + (err.message || err),
                color: "error",
              });
            }
          },

          // 持久化更新一条 app 记录里的若干字段
          async _persistAppField(recordName, patch) {
            const apps = (await storage.getItem("apps")) || [];
            const item = apps.find((a) => a.name === recordName);
            if (!item) return;
            Object.assign(item, patch);
            await storage.setItem("apps", apps);
          },

          async copyAppId(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app.appId) return;
            try {
              await navigator.clipboard.writeText(app.appId);
              toast({ message: "应用 ID 已复制", color: "success" });
            } catch (err) {
              toast({
                message: "复制失败，请手动复制",
                color: "error",
              });
            }
          },

          async copyAutoShareUrl(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app.autoShareUrl) {
              toast({ message: "分享链接尚未生成", color: "tertiary" });
              return;
            }
            try {
              await navigator.clipboard.writeText(app.autoShareUrl);
              toast({ message: "分享链接已复制", color: "success" });
            } catch (err) {
              toast({
                message: "复制失败，请手动复制",
                color: "error",
              });
            }
          },

          async copyShareLink() {
            if (!this.shareUrl) return;
            try {
              await navigator.clipboard.writeText(this.shareUrl);
              toast({ message: "链接已复制", color: "success" });
            } catch (err) {
              toast({
                message: "复制失败，请手动复制",
                color: "error",
              });
            }
          },

          closeShareDialog() {
            this.shareDialogOpen = false;
          },

          async handleDelete(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }

            const ok = await confirm({
              title: "删除应用",
              message: `确定要从列表中删除应用「${app.name}」吗？该操作会从列表中移除，不会删除本地目录中的文件。`,
              yes: "删除",
              cancel: "取消",
            });
            if (!ok) return;

            try {
              // 删除前若已发布，先撤销发布让分享链接失效
              if (app.autoShareUrl) {
                try {
                  await unpublishApp(app);
                } catch (err) {
                  console.warn("撤销分享失败（可忽略）：", err);
                }
              }

              // 关闭对应打开的窗口 + 清理状态
              clearOpened(app._recordName);

              // 对于虚拟目录应用，从共享命名空间中移除该应用的子目录
              if (app.source === "virtual" && app._handle) {
                try {
                  await app._handle.remove();
                } catch (vErr) {
                  console.warn("清空虚拟目录失败（可忽略）：", vErr);
                }
              }

              const apps = (await storage.getItem("apps")) || [];
              const next = apps.filter(
                (a) => !(a.name === (app._recordName || app.name)),
              );
              await storage.setItem("apps", next);

              // 同步共享 stanz 状态，应用市场页面会自动收到通知
              await syncOfficialAppState();

              await this.refreshApps();
              toast({ message: "已删除", color: "success" });
            } catch (err) {
              console.error(err);
              toast({
                message: "删除失败：" + (err.message || err),
                color: "error",
              });
            }
          },
        },
        watch: {
          async dialogOpen(val) {
            if (!val) {
              await this.refreshApps();
            }
          },
          async marketDialogOpen(val) {
            if (!val) {
              await this.refreshApps();
            }
          },
        },
      };
    };
  </script>
</template>
