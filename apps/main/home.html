<template page>
  <style>
    :host {
      display: block;
      height: 100%;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }
    .header h2 {
      margin: 0;
      font-size: 20px;
    }
    .list-wrapper {
      padding: 0 16px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      height: 100%;
    }
    .item-title {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .item-name {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .app-item:hover {
      background-color: var(--md-sys-color-on-primary);
      border-radius: 12px;
    }
    .app-item:hover div {
      color: var(--md-sys-color-on-primary-container);
    }
    .empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.7;
    }

    .item-suffix {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .open-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface-variant);
      background-color: var(--md-sys-color-surface);
    }
    .source-badge[data-source="local"] {
      border-color: var(--md-sys-color-tertiary);
      color: var(--md-sys-color-tertiary);
    }
    .source-badge[data-source="virtual"] {
      border-color: var(--md-sys-color-secondary);
      color: var(--md-sys-color-secondary);
    }
    .version-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      margin-left: 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.4;
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface-variant);
      font-family: monospace;
      vertical-align: middle;
    }
    .mine-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 8px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      vertical-align: middle;
    }
    .mine-badge n-icon {
      font-size: 12px;
    }
    .official-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 8px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      vertical-align: middle;
    }
    .official-badge n-icon {
      font-size: 12px;
    }
    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 8px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      vertical-align: middle;
    }
    .offline-badge n-icon {
      font-size: 12px;
    }
    .update-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 8px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      vertical-align: middle;
    }
    .update-badge n-icon {
      font-size: 12px;
    }
    .update-status {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .share-qr {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 16px 0;
    }
    .share-qr m-ercode {
      width: 200px;
      height: 200px;
    }
    .share-qr-url {
      font-family: monospace;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      word-break: break-all;
      text-align: center;
      max-width: 100%;
    }
    .share-hint {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.75;
      margin-top: 12px;
      line-height: 1.5;
      text-align: center;
    }
    .sub-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px 8px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .sub-info-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sub-info-label {
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.7;
      min-width: 72px;
    }
    .sub-info-value {
      font-family: monospace;
      color: var(--md-sys-color-on-surface);
      word-break: break-all;
    }
    .app-id-value {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .auto-share-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .auto-share-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .auto-share-status {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.85;
    }
    .auto-share-status[data-state="error"] {
      color: var(--md-sys-color-error);
      opacity: 1;
    }
    .auto-share-status[data-state="ready"] {
      color: var(--md-sys-color-primary);
      opacity: 1;
    }

    .icon-btn {
      z-index: 3;
    }

    /* 设置弹窗：左侧导航 + 右侧内容 */
    .settings-body {
      display: flex;
      min-height: 240px;
      text-align: start;
    }
    .settings-nav {
      width: 160px;
      flex-shrink: 0;
      padding-right: 8px;
      border-right: 1px solid var(--md-sys-color-surface-variant);
    }
    .settings-nav st-list-item {
      border-radius: 12px;
    }
    .settings-nav st-list-item[active] {
      background-color: var(--md-sys-color-secondary-container);
    }
    .settings-content {
      flex: 1;
      min-width: 0;
      padding: 8px 4px 8px 20px;
    }
    .settings-field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 8px;
    }
    .dlg-settings::part(panel) {
      width: 100%;
      max-width: 800px; /* 与主内容容器 .container 一致 */
      min-height: 80vh;
    }

    /* 对话框面板宽度（st-dialog 面板在 shadow 内，用 ::part 定制） */
    .dlg-wide::part(panel) {
      width: min(800px, 100%);
    }
    .dlg-narrow::part(panel) {
      width: min(360px, 100%);
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/list/list.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/dialog/dialog.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/switch/switch.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/select/select.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/mz/comps/ercode/ercode.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <st-dialog
    class="dlg-wide"
    sync:open="dialogOpen"
    auto-close
    on:close-dialog="handleDialogClose"
    on:open-market="handleOpenMarket"
  >
    <h2 slot="headline">
      <locale-text><span lang="cn">添加应用</span><span lang="en">Add App</span></locale-text>
    </h2>
    <o-page src="./home/add-app.html" style="width: 100%"></o-page>
  </st-dialog>

  <st-dialog
    class="dlg-wide"
    sync:open="marketDialogOpen"
    auto-close
    on:close-dialog="handleMarketClose"
  >
    <h2 slot="headline">
      <locale-text><span lang="cn">应用市场</span><span lang="en">App Market</span></locale-text>
    </h2>
    <o-page
      src="./home/market.html"
      style="width: 100%; min-height: 80vh"
    ></o-page>
  </st-dialog>

  <st-dialog
    class="dlg-narrow"
    sync:open="shareDialogOpen"
    auto-close
  >
    <h2 slot="headline">
      <locale-text><span lang="cn">分享二维码</span><span lang="en">Share QR Code</span></locale-text>
    </h2>
    <div style="padding: 4px 0">
      <div class="share-qr">
        <o-if :value="shareUrl">
          <m-ercode :content="shareUrl"></m-ercode>
        </o-if>
        <span class="share-qr-url">{{shareUrl}}</span>
      </div>
      <div class="share-hint">
        <locale-text>
          <span lang="cn">对方扫码即可自动安装并进入应用。请保持本页面开启，关闭后对方将无法拉取。</span>
          <span lang="en">The other party can scan the code to install and open the app automatically. Keep this page open; once closed, they can no longer fetch the data.</span>
        </locale-text>
      </div>
    </div>
    <div slot="actions">
      <st-button on:click="copyShareLink">
        <n-icon icon="mdi:content-copy" slot="prefix"></n-icon>
        <locale-text><span lang="cn">复制链接</span><span lang="en">Copy Link</span></locale-text>
      </st-button>
      <st-button variant="text" on:click="closeShareDialog">
        <locale-text><span lang="cn">关闭</span><span lang="en">Close</span></locale-text>
      </st-button>
    </div>
  </st-dialog>

  <st-dialog
    class="dlg-settings"
    sync:open="settingsOpen"
    auto-close
  >
    <h2 slot="headline">
      <locale-text><span lang="cn">设置</span><span lang="en">Settings</span></locale-text>
    </h2>
    <div class="settings-body">
      <div class="settings-nav">
        <st-list>
          <st-list-item active>
            <n-icon icon="mdi:tune" slot="prefix"></n-icon>
            <locale-text><span lang="cn">常规</span><span lang="en">General</span></locale-text>
          </st-list-item>
        </st-list>
      </div>
      <div class="settings-content">
        <div class="settings-field-label">
          <locale-text><span lang="cn">语言</span><span lang="en">Language</span></locale-text>
        </div>
        <st-select
          attr:default-value="lang"
          style="width: 200px"
          on:change="handleLangChange"
        >
          <option value="cn">中文</option>
          <option value="en">English</option>
        </st-select>
      </div>
    </div>
  </st-dialog>

  <div class="container">
    <div class="header">
      <h2><locale-text><span lang="cn">应用列表</span><span lang="en">My Apps</span></locale-text></h2>
      <div style="display: flex; gap: 8px; align-items: center">
        <st-icon-button
          style="font-size: 13px"
          on:click="handleSettings"
          attr:title="t('settingsTitle')"
        >
          <n-icon icon="mdi:cog-outline"></n-icon>
        </st-icon-button>
        <st-button style="font-size: 13px" on:click="handleAdd">
          <n-icon icon="mdi:plus" slot="prefix"></n-icon>
          <locale-text><span lang="cn">添加应用</span><span lang="en">Add App</span></locale-text>
        </st-button>
      </div>
    </div>

    <div class="list-wrapper">
      <o-if :value="appList.length > 0">
        <st-list>
          <o-fill :value="appList" fill-key="appId">
            <st-list-item class="app-item" collapsible button>
              <span slot="prefix" style="font-size: 24px">{{$data.icon}}</span>
              <div class="item-title">
                <span class="item-name">{{$data.name}}</span>
                <span class="version-badge">v{{$data.version}}</span>
                <o-if :value="$data.isMine">
                  <span class="mine-badge" attr:title="$host.t('mineTitle')">
                    <n-icon icon="mdi:account-hard-hat"></n-icon>
                    <locale-text><span lang="cn">我开发的</span><span lang="en">Mine</span></locale-text>
                  </span>
                </o-if>
                <o-if :value="$data.source === 'official'">
                  <span class="official-badge" attr:title="$host.t('officialTitle')">
                    <n-icon icon="mdi:store-outline"></n-icon>
                    <locale-text><span lang="cn">官方应用</span><span lang="en">Official</span></locale-text>
                  </span>
                </o-if>
                <o-if :value="$data.offline">
                  <span class="offline-badge" attr:title="$host.t('offlineTitle')">
                    <n-icon icon="mdi:cloud-off-outline"></n-icon>
                    <locale-text><span lang="cn">已下线</span><span lang="en">Offline</span></locale-text>
                  </span>
                </o-if>
                <o-if :value="$data.hasUpdate">
                  <span class="update-badge" attr:title="$host.t('updateBadgeTitle')">
                    <n-icon icon="mdi:arrow-up-circle-outline"></n-icon>
                    <locale-text attr:data-v="$data.latestVersion">
                      <span lang="cn">可更新 v{v}</span>
                      <span lang="en">Update to v{v}</span>
                    </locale-text>
                  </span>
                </o-if>
              </div>
              <div secondary>{{$data.desc}}</div>

              <div slot="suffix" class="item-suffix">
                <o-if :value="$data.opened">
                  <span class="open-badge" attr:title="$host.t('openedTitle')">
                    <n-icon icon="mdi:circle-medium"></n-icon>
                    <locale-text><span lang="cn">已打开</span><span lang="en">Open</span></locale-text>
                  </span>
                </o-if>

                <st-icon-button
                  class="icon-btn tab-btn"
                  style="font-size: 13px"
                  on:click="$host.handleOpenTab($event, $data)"
                  attr:title="$host.t('openTabTitle')"
                >
                  <n-icon icon="mdi:tab-plus"></n-icon>
                </st-icon-button>

                <st-icon-button
                  class="icon-btn window-btn"
                  style="font-size: 13px"
                  on:click="$host.handleOpenWindow($event, $data)"
                  attr:title="$host.t('openWindowTitle')"
                >
                  <n-icon icon="mdi:open-in-new"></n-icon>
                </st-icon-button>
              </div>

              <st-list slot="sublist">
                <st-list-item>
                  <div class="sub-info">
                    <div class="sub-info-row">
                      <span class="sub-info-label"><locale-text><span lang="cn">应用来源：</span><span lang="en">Source:</span></locale-text></span>
                      <span
                        class="source-badge"
                        attr:data-source="$data.source"
                        attr:title="$host.t('sourceTitle')"
                      >
                        <o-if :value="$data.source === 'local'">
                          <n-icon icon="mdi:folder-outline"></n-icon>
                          <locale-text><span lang="cn">本地目录</span><span lang="en">Local Folder</span></locale-text>
                        </o-if>
                        <o-if :value="$data.source === 'virtual'">
                          <n-icon icon="mdi:database-outline"></n-icon>
                          <locale-text><span lang="cn">虚拟目录</span><span lang="en">Virtual Dir</span></locale-text>
                        </o-if>
                        <o-if :value="$data.source === 'official'">
                          <n-icon icon="mdi:store-outline"></n-icon>
                          <locale-text><span lang="cn">应用市场</span><span lang="en">App Market</span></locale-text>
                        </o-if>
                      </span>
                    </div>
                    <div class="sub-info-row">
                      <span class="sub-info-label"><locale-text><span lang="cn">目录名称：</span><span lang="en">Directory:</span></locale-text></span>
                      <span class="sub-info-value">{{$data.dirName}}</span>
                    </div>
                    <o-if :value="$data.appId">
                      <div class="sub-info-row">
                        <span class="sub-info-label"><locale-text><span lang="cn">应用 ID：</span><span lang="en">App ID:</span></locale-text></span>
                        <span
                          class="sub-info-value app-id-value"
                          attr:title="$data.appId"
                        >
                          {{$data.appId}}
                        </span>
                        <st-icon-button
                          class="icon-btn"
                          style="font-size: 13px"
                          on:click="$host.copyAppId($event, $data)"
                          attr:title="$host.t('copyAppIdTitle')"
                        >
                          <n-icon icon="mdi:content-copy"></n-icon>
                        </st-icon-button>
                      </div>
                    </o-if>
                    <div class="sub-info-row" style="margin: 0 0 4px">
                      <span class="sub-info-label"><locale-text><span lang="cn">分享：</span><span lang="en">Share:</span></locale-text></span>
                      <div class="auto-share-row" style="flex: 1; min-width: 0">
                        <div class="auto-share-header">
                          <st-switch
                            attr:checked="$data.autoShare"
                            on:change="$host.handleAutoShareToggle($event, $data)"
                          ></st-switch>
                          <span
                            class="auto-share-status"
                            attr:data-state="$data.autoShareState"
                          >
                            {{$data.autoShareStatus}}
                          </span>
                          <o-if :value="$data.autoSharePermissionError">
                            <st-button
                              variant="text"
                              style="font-size: 12px"
                              on:click="$host.requestPermissionAndRetry($event, $data)"
                            >
                              <n-icon icon="mdi:shield-refresh" slot="prefix"></n-icon>
                              <locale-text><span lang="cn">点击重新获取权限</span><span lang="en">Retry Permission</span></locale-text>
                            </st-button>
                          </o-if>
                        </div>
                      </div>
                    </div>
                    <o-if :value="$data.autoShare">
                      <div class="sub-info-row">
                        <span class="sub-info-label"><locale-text><span lang="cn">分享链接：</span><span lang="en">Share Link:</span></locale-text></span>
                        <span
                          class="sub-info-value app-id-value"
                          attr:title="$data.autoShareUrl"
                        >
                          <o-if :value="$data.autoShareUrl">
                            {{$data.autoShareUrl}}
                          </o-if>
                          <o-if :value="!$data.autoShareUrl">
                            <span style="opacity: 0.6">
                              {{$data.autoShareStatus || $host.t('waitingPublish')}}
                            </span>
                          </o-if>
                        </span>
                        <st-icon-button
                          class="icon-btn"
                          style="font-size: 13px"
                          attr:disabled="!$data.autoShareUrl"
                          on:click="$host.copyAutoShareUrl($event, $data)"
                          attr:title="$host.t('copyShareUrlTitle')"
                        >
                          <n-icon icon="mdi:content-copy"></n-icon>
                        </st-icon-button>
                        <st-icon-button
                          class="icon-btn"
                          style="font-size: 13px"
                          attr:disabled="!$data.autoShareUrl"
                          on:click="$host.showShareQrCode($event, $data)"
                          attr:title="$host.t('viewQrTitle')"
                        >
                          <n-icon icon="mdi:qrcode"></n-icon>
                        </st-icon-button>
                      </div>
                    </o-if>
                    <div class="sub-info-row">
                      <span class="sub-info-label"><locale-text><span lang="cn">操作：</span><span lang="en">Actions:</span></locale-text></span>
                      <div class="action-row">
                        <o-if :value="$data.offline">
                          <span class="update-status">
                            <locale-text>
                              <span lang="cn">该官方应用已从市场下线，无法更新</span>
                              <span lang="en">This official app has been removed from the market and cannot be updated</span>
                            </locale-text>
                          </span>
                        </o-if>
                        <o-if :value="$data.hasUpdate">
                          <st-button
                            style="font-size: 13px"
                            attr:disabled="$data.updating"
                            on:click="$host.handleUpdate($event, $data)"
                          >
                            <n-icon
                              icon="mdi:download-outline"
                              slot="prefix"
                            ></n-icon>
                            <locale-text attr:data-v="$data.latestVersion">
                              <span lang="cn">更新到 v{v}</span>
                              <span lang="en">Update to v{v}</span>
                            </locale-text>
                          </st-button>
                        </o-if>
                        <o-if :value="$data.updateStatus">
                          <span class="update-status">
                            {{$data.updateStatus}}
                          </span>
                        </o-if>
                        <st-button
                          variant="outlined"
                          color="error"
                          style="font-size: 13px"
                          attr:disabled="$data.updating"
                          on:click="$host.handleDelete($event, $data)"
                        >
                          <n-icon
                            icon="mdi:delete-outline"
                            slot="prefix"
                          ></n-icon>
                          <locale-text><span lang="cn">删除应用</span><span lang="en">Delete App</span></locale-text>
                        </st-button>
                      </div>
                    </div>
                  </div>
                </st-list-item>
              </st-list>
            </st-list-item>
          </o-fill>
        </st-list>
      </o-if>
      <o-if :value="appList.length === 0">
        <div class="empty">
          <locale-text>
            <span lang="cn">还没有应用，点击右上角「添加应用」开始创建吧。</span>
            <span lang="en">No apps yet. Click "Add App" in the top right to create one.</span>
          </locale-text>
        </div>
      </o-if>
    </div>
  </div>

  <script>
    import { getStorage } from "/nos/storage/main.js";
    import { get, init } from "/nos/fs/main.js";
    import { DirHandle } from "/nos/fs/handle/dir.js";
    import toast from "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js";
    import confirm from "/gh/ofajs/senti-ui@latest/packages/dialog/confirm.js";
    import {
      openedWindows,
      readOpenedFromLS,
      isWindowAlive,
      startAppStatusWatcher,
      markOpened,
      clearOpened,
      focusIfOpened,
    } from "./home/app-status.js";
    import { getRunUrl } from "/mz/app-runner.js";
    import {
      ensureUser,
      generateAppId,
      publishApp,
      unpublishApp,
      buildOfficialRunUrl,
    } from "/mz/share-mgr.js";
    import { syncOfficialAppState } from "./lib/official-app-state.js";
    import {
      loadOfficialAppMeta,
      compareVersions,
      installOfficialApp,
    } from "./home/official-app-writer.js";
    import {
      getLocaleText,
      getLang,
      setLang,
    } from "/nos/locale-text/get-locale-text.js";

    // 属性类文案（title 等）翻译表；模板正文文案用 <locale-text> 组件
    const L10N = {
      mineTitle: { cn: "由当前账号开发发布", en: "Developed by the current account" },
      officialTitle: { cn: "来自应用市场", en: "From the App Market" },
      offlineTitle: { cn: "该官方应用已从市场下线，无法更新", en: "This official app has been removed from the market and cannot be updated" },
      updateBadgeTitle: { cn: "应用市场有新版本可更新", en: "A newer version is available in the market" },
      openedTitle: { cn: "点击可切换到已打开的窗口", en: "Click to switch to the opened window" },
      openTabTitle: { cn: "在新标签页中打开", en: "Open in a new tab" },
      openWindowTitle: { cn: "在小窗口中打开（类原生应用）", en: "Open in a small window (native-like)" },
      sourceTitle: { cn: "应用来源", en: "App source" },
      copyAppIdTitle: { cn: "复制应用 ID", en: "Copy app ID" },
      copyShareUrlTitle: { cn: "复制分享链接", en: "Copy share link" },
      viewQrTitle: { cn: "查看二维码", en: "View QR code" },
      waitingPublish: { cn: "等待发布...", en: "Waiting to publish..." },
      settingsTitle: { cn: "设置", en: "Settings" },
    };

    const t = (key) => {
      const item = L10N[key];
      return item ? getLocaleText(item) : key;
    };

    const storage = getStorage("mazmot");

    async function loadApps() {
      const apps = (await storage.getItem("apps")) || [];
      // 从 localStorage 恢复已打开路径快照
      const lsOpened = new Set(readOpenedFromLS());
      // 当前用户的 userId，用于判定「自己开发的应用」
      let currentUserId = "";
      try {
        const currentUser = await ensureUser();
        currentUserId = (currentUser && currentUser.userId) || "";
      } catch (err) {
        console.warn("获取当前用户失败：", err);
      }
      const results = await Promise.all(
        apps.map(async (app) => {
          let manifest = null;
          // 根据 source 类型构造 handle：
          // - virtual / official：通过 init(namespace) 重新拿到虚拟根目录
          // - local（或旧数据）：通过 new DirHandle 包裹原生句柄
          let handle = null;
          // 虚拟目录：目录名 = dirName 去掉 namespace 前缀；缺省时回退到 app.name
          const isVirtualLike =
            app.source === "virtual" || app.source === "official";
          const namespaceForApp = app.namespace || "mazmot-apps";
          const namespacePrefix = namespaceForApp + "/";
          let virtualDirName = "";
          if (isVirtualLike) {
            if (app.dirName && app.dirName.startsWith(namespacePrefix)) {
              virtualDirName = app.dirName.slice(namespacePrefix.length);
            } else if (app.dirName) {
              virtualDirName = app.dirName;
            } else {
              virtualDirName = app.name;
            }
          }
          try {
            if (isVirtualLike) {
              const rootDir = await init(namespaceForApp);
              handle = await rootDir.get(virtualDirName, { create: "dir" });
            } else if (app.handle) {
              handle = new DirHandle(app.handle);
            }
          } catch (err) {
            console.warn(`初始化 ${app.name} 的句柄失败：`, err);
          }

          try {
            // 优先尝试从 client/app.json 获取，如果不存在则尝试根目录（兼容旧应用）
            if (handle) {
              let jsonFile = null;
              try {
                const clientDir = await handle.get("client");
                jsonFile = await clientDir.get("app.json");
              } catch (e) {
                jsonFile = await handle.get("app.json");
              }

              if (jsonFile) {
                manifest = await jsonFile.json();
              }
            }
          } catch (err) {
            console.warn(`读取 ${app.name} 的配置失败：`, err);
          }

          return {
            icon: (manifest && manifest.icon) || "📦",
            name:
              (manifest && (manifest.displayName || manifest.name)) || app.name,
            desc: (manifest && manifest.description) || app.desc || "",
            dirName:
              app.dirName ||
              (app.source === "virtual"
                ? `${app.namespace || "mazmot-apps"}/${app.name}`
                : app.name) ||
              "",
            version: (manifest && manifest.version) || "0.1.0",
            _handle: handle,
            source: app.source || "local",
            namespace: app.namespace || "",
            virtualDirName,
            _recordName: app.name,
            appId: app.appId || "",
            officialId: app.officialId || "",
            latestVersion: "",
            hasUpdate: false,
            offline: false,
            updating: false,
            updateStatus: "",
            // 自己开发的应用：appId 后缀为当前用户的 userId
            isMine:
              !!currentUserId &&
              !!app.appId &&
              app.appId.endsWith("-" + currentUserId),
            opened: isWindowAlive(app.name) || lsOpened.has(app.name),
            autoShare: !!app.autoShare,
            autoShareUrl: "",
            autoShareState: app.autoShare ? "pending" : "idle",
            autoShareStatus: app.autoShare
              ? t("waitingPublish")
              : getLocaleText({ cn: "已关闭", en: "Off" }),
            autoSharePermissionError: false,
          };
        }),
      );
      return results;
    }

    export default async () => {
      return {
        data: {
          dialogOpen: false,
          marketDialogOpen: false,
          appList: [],
          shareDialogOpen: false,
          shareUrl: "",
          settingsOpen: false,
          lang: getLang(),
        },
        async attached() {
          // 不能把含 _handle 的应用列表放进 data 默认值：ofa.js 注册时会
          // 对 data 做深拷贝（deepCopyData），DirHandle 类实例会被拆成丢失
          // 原型的普通对象；注册后再赋值走 stanz set 陷阱，_ 前缀 key 原样
          // 存入，句柄不会被破坏。因此这里先加载列表。
          const apps = await loadApps();
          apps.forEach((app) => this.appList.push(app));

          // 启动广播监听 + 定时探测
          this._stopWatcher = startAppStatusWatcher({
            onAlive: (name) => {
              const target = this.appList.find((a) => a._recordName === name);
              if (target && !target.opened) target.opened = true;
            },
            onBye: (name) => {
              const target = this.appList.find((a) => a._recordName === name);
              if (target && target.opened) target.opened = false;
            },
            onTick: (aliveNames) => {
              this.appList.forEach((app) => {
                const alive = aliveNames.has(app._recordName);
                if (app.opened !== alive) app.opened = alive;
              });
            },
          });
          // 首次进入页面时，为所有已开启分享的应用发布一次
          this._runAutoShareAll();
          // 检查官方应用是否有新版本
          this._checkOfficialUpdates();
        },
        detached() {
          if (this._stopWatcher) {
            this._stopWatcher();
            this._stopWatcher = null;
          }
        },
        proto: {
          handleAdd() {
            this.dialogOpen = true;
          },

          // 打开设置弹窗
          handleSettings() {
            this.settingsOpen = true;
          },

          // 设置里的语言下拉切换；setLang 会让 <locale-text> 立即刷新，
          // 重载页面让 attr:title 与运行时生成的状态文案同步更新
          handleLangChange(event) {
            const next = event.target.value;
            if (!next || next === getLang()) return;
            setLang(next);
            localStorage.setItem("lang", next);
            location.reload();
          },

          t(key) {
            return t(key);
          },

          _markOpened(app, win) {
            markOpened(app._recordName, win);
            const target = this.appList.find(
              (a) => a._recordName === app._recordName,
            );
            if (target) target.opened = true;
          },

          // 新标签页打开（点击按钮版本，阻止冒泡）
          handleOpenTab(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            return this.handleOpen(app);
          },

          // 新标签页打开
          async handleOpen(app) {
            if (!app || !app._handle) {
              toast({
                message: getLocaleText({
                  cn: "无法打开：缺少应用句柄",
                  en: "Cannot open: app handle missing",
                }),
                color: "error",
              });
              return;
            }
            if (focusIfOpened(app._recordName)) return;

            let url;
            try {
              url = await getRunUrl(app);
            } catch (err) {
              toast({
                message: getLocaleText(
                  {
                    cn: "无法生成运行地址：{msg}",
                    en: "Failed to build run URL: {msg}",
                  },
                  { msg: err.message || err },
                ),
                color: "error",
              });
              return;
            }

            const win = window.open(url, `mazmot-app-${app._recordName}`);
            if (win) this._markOpened(app, win);
          },

          // 小窗口打开（尽量像原生应用）
          async handleOpenWindow(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app._handle) {
              toast({
                message: getLocaleText({
                  cn: "无法打开：缺少应用句柄",
                  en: "Cannot open: app handle missing",
                }),
                color: "error",
              });
              return;
            }
            if (focusIfOpened(app._recordName)) return;

            let url;
            try {
              url = await getRunUrl(app);
            } catch (err) {
              toast({
                message: getLocaleText(
                  {
                    cn: "无法生成运行地址：{msg}",
                    en: "Failed to build run URL: {msg}",
                  },
                  { msg: err.message || err },
                ),
                color: "error",
              });
              return;
            }

            // 类原生应用窗口：无地址栏/工具栏/菜单栏；居中显示
            const width = 1024;
            const height = 720;
            const left = Math.max(
              0,
              Math.round((screen.availWidth - width) / 2),
            );
            const top = Math.max(
              0,
              Math.round((screen.availHeight - height) / 2),
            );
            const features = [
              `width=${width}`,
              `height=${height}`,
              `left=${left}`,
              `top=${top}`,
              "popup=yes",
              "resizable=yes",
              "scrollbars=yes",
              "toolbar=no",
              "menubar=no",
              "location=no",
              "status=no",
              "titlebar=no",
            ].join(",");

            const win = window.open(
              url,
              `mazmot-app-${app._recordName}`,
              features,
            );
            if (!win) {
              toast({
                message: getLocaleText({
                  cn: "窗口被浏览器拦截，请允许弹出窗口",
                  en: "The window was blocked by the browser. Please allow pop-ups.",
                }),
                color: "error",
              });
              return;
            }
            this._markOpened(app, win);
          },

          async handleDialogClose() {
            this.dialogOpen = false;
            await this.refreshApps();
          },

          // 从添加应用弹窗切换到应用市场弹窗
          handleOpenMarket() {
            this.dialogOpen = false;
            this.marketDialogOpen = true;
          },

          // 应用市场关闭时刷新列表
          async handleMarketClose() {
            this.marketDialogOpen = false;
            await this.refreshApps();
          },
          async refreshApps() {
            const apps = await loadApps();
            this.appList.length = 0;
            apps.forEach((app) => this.appList.push(app));
            // 刷新后再对已开启分享的应用执行一次发布
            this._runAutoShareAll();
            // 刷新后重新检查官方应用更新
            this._checkOfficialUpdates();
          },

          // 遍历列表，把官方应用的本地版本与市场版本比对，标记是否可更新
          async _checkOfficialUpdates() {
            const officialApps = this.appList.filter(
              (app) => app.source === "official" && app.officialId,
            );
            for (const app of officialApps) {
              try {
                const meta = await loadOfficialAppMeta(app.officialId);
                if (!meta) {
                  // 官方应用已从市场下线
                  app.offline = true;
                  app.hasUpdate = false;
                  continue;
                }
                app.offline = false;
                if (!meta.version) continue;
                app.latestVersion = meta.version;
                app.hasUpdate = compareVersions(meta.version, app.version) > 0;
              } catch (err) {
                console.warn(`检查 ${app.name} 更新失败：`, err);
              }
            }
          },

          // 重新拉取官方应用源文件覆盖写入 client/，实现原地更新
          async handleUpdate(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app.officialId || !app._handle) {
              toast({
                message: getLocaleText({
                  cn: "无法更新：缺少应用信息",
                  en: "Cannot update: app info missing",
                }),
                color: "error",
              });
              return;
            }
            if (app.updating) return;

            const ok = await confirm({
              title: getLocaleText({ cn: "更新应用", en: "Update App" }),
              message: getLocaleText(
                {
                  cn: "将「{name}」从 v{from} 更新到 v{to}。应用内保存的数据不受影响，但自定义修改过的源文件会被覆盖。",
                  en: "Update \"{name}\" from v{from} to v{to}. Data saved inside the app is unaffected, but locally modified source files will be overwritten.",
                },
                { name: app.name, from: app.version, to: app.latestVersion },
              ),
              yes: getLocaleText({ cn: "更新", en: "Update" }),
              cancel: getLocaleText({ cn: "取消", en: "Cancel" }),
            });
            if (!ok) return;

            app.updating = true;
            app.updateStatus = getLocaleText({
              cn: "准备更新...",
              en: "Preparing update...",
            });
            try {
              await installOfficialApp({
                dirHandle: app._handle,
                appId: app.officialId,
                onProgress: ({ path, status }) => {
                  app.updateStatus = getLocaleText(
                    status === "writing"
                      ? { cn: "正在写入 {path} ...", en: "Writing {path} ..." }
                      : { cn: "已写入 {path}", en: "Written {path}" },
                    { path },
                  );
                },
              });
              app.updateStatus = "";
              toast({
                message: getLocaleText(
                  {
                    cn: "{name} 已更新到 v{v}",
                    en: "{name} updated to v{v}",
                  },
                  { name: app.name, v: app.latestVersion },
                ),
                color: "success",
              });
              await this.refreshApps();
            } catch (err) {
              console.error("更新失败：", err);
              app.updateStatus = getLocaleText(
                { cn: "更新失败：{msg}", en: "Update failed: {msg}" },
                { msg: err.message || err },
              );
              toast({
                message: app.updateStatus,
                color: "error",
              });
            } finally {
              app.updating = false;
            }
          },

          // 遍历列表，对所有已开启 autoShare 的应用触发一次 publish
          _runAutoShareAll() {
            this.appList.forEach((app) => {
              if (app.autoShare) {
                // 不 await，避免阻塞列表渲染；错误会写回 app.autoShareState
                this.autoShareApp(app);
              }
            });
          },

          // 打开分享二维码弹窗（链接已由分享发布好）
          showShareQrCode(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app.autoShareUrl) {
              toast({
                message: getLocaleText({
                  cn: "分享链接尚未生成",
                  en: "Share link not ready yet",
                }),
                color: "tertiary",
              });
              return;
            }
            this.shareUrl = app.autoShareUrl;
            this.shareDialogOpen = true;
          },

          // 切换某个应用的"分享"开关（change 后 st-switch 的 checked 属性已同步）
          async handleAutoShareToggle(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            const target = this.appList.find(
              (a) => a._recordName === app._recordName,
            );
            if (!target) return;

            const nextChecked = event.target.hasAttribute("checked");
            target.autoShare = nextChecked;
            await this._persistAppField(target._recordName, {
              autoShare: nextChecked,
            });

            if (!nextChecked) {
              // 关闭时撤销发布，让旧的分享链接失效。
              // 官方应用走 HTTP 链接、没发布 P2P payload，无需 unpublish。
              if (target.source !== "official") {
                unpublishApp(target).catch((err) =>
                  console.warn("撤销分享失败：", err),
                );
              }
              target.autoShareUrl = "";
              target.autoShareState = "idle";
              target.autoShareStatus = getLocaleText({
                cn: "已关闭",
                en: "Off",
              });
              return;
            }

            await this.autoShareApp(target);
          },

          // 对单个已开启分享的应用执行发布，写回状态。
          // 官方应用走同源 HTTP 链接（?app=<officialId>），接收端直接拉取
          // /official-apps/，无需 P2P 分发、不依赖发布者在线。
          // 其余应用走 P2P：读取文件 → 打包 → publish → 生成 u/h 短链接。
          async autoShareApp(target) {
            if (!target) return;

            // 官方应用分支
            if (target.source === "official" && target.officialId) {
              target.autoShareState = "ready";
              target.autoShareStatus = getLocaleText({
                cn: "官方应用，对方可直接连接",
                en: "Official app, others can connect directly",
              });
              target.autoShareUrl = buildOfficialRunUrl(
                location.origin,
                target.officialId,
              );
              return;
            }

            // P2P 分支
            if (!target._handle) {
              target.autoShareState = "error";
              target.autoShareStatus = getLocaleText({
                cn: "缺少目录句柄，无法发布",
                en: "Directory handle missing, cannot publish",
              });
              return;
            }
            target.autoShareState = "publishing";
            target.autoShareStatus = getLocaleText({
              cn: "发布中...",
              en: "Publishing...",
            });
            try {
              // 老数据补 appId
              let appId = target.appId;
              if (!appId) {
                appId = await generateAppId(target._recordName);
                await this._persistAppField(target._recordName, { appId });
                target.appId = appId;
              }
              const { shareUrl, payloadHash, fileHash } = await publishApp(target, {
                appId,
                onProgress: ({ text }) => {
                  if (text) target.autoShareStatus = text;
                },
              });
              target.autoShareUrl = shareUrl;
              target.autoShareState = "ready";
              target.autoShareStatus = getLocaleText({
                cn: "已发布，对方可直接连接",
                en: "Published, others can connect directly",
              });
              // 持久化 payloadHash 和 fileHash 到记录，供秒跳和撤销分享时使用
              if (payloadHash) {
                target.payloadHash = payloadHash;
                target.fileHash = fileHash || "";
                await this._persistAppField(target._recordName, {
                  payloadHash,
                  fileHash: fileHash || "",
                });
              }
            } catch (err) {
              console.error("分享失败：", err);
              target.autoShareState = "error";
              target.autoShareStatus = getLocaleText(
                { cn: "发布失败：{msg}", en: "Publish failed: {msg}" },
                { msg: err.message || String(err) },
              );
              target.autoSharePermissionError = /not allowed by the user agent or the platform/i.test(
                err.message || "",
              );
            }
          },

          // 重新获取目录句柄权限并重试分享
          async requestPermissionAndRetry(event, target) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!target || !target._handle) return;
            try {
              // 取出原生 FileSystemDirectoryHandle（DirHandle 包装在 _handle 属性上）
              const rawHandle = target._handle._handle || target._handle;
              if (!rawHandle || !rawHandle.requestPermission) {
                toast({
                  message: getLocaleText({
                    cn: "当前浏览器不支持重新获取权限",
                    en: "This browser does not support re-requesting permission",
                  }),
                  color: "error",
                });
                return;
              }
              // 先查询权限状态，不 granted 则请求重新授权
              let state = await rawHandle.queryPermission({ mode: "readwrite" });
              if (state !== "granted") {
                state = await rawHandle.requestPermission({ mode: "readwrite" });
              }
              if (state === "granted") {
                target.autoSharePermissionError = false;
                await this.autoShareApp(target);
              } else {
                toast({
                  message: getLocaleText({
                    cn: "权限未授予，请重试",
                    en: "Permission not granted, please retry",
                  }),
                  color: "tertiary",
                });
              }
            } catch (err) {
              console.error("重新获取权限失败：", err);
              toast({
                message: getLocaleText(
                  {
                    cn: "重新获取权限失败：{msg}",
                    en: "Failed to re-request permission: {msg}",
                  },
                  { msg: err.message || err },
                ),
                color: "error",
              });
            }
          },

          // 持久化更新一条 app 记录里的若干字段
          async _persistAppField(recordName, patch) {
            const apps = (await storage.getItem("apps")) || [];
            const item = apps.find((a) => a.name === recordName);
            if (!item) return;
            Object.assign(item, patch);
            await storage.setItem("apps", apps);
          },

          async copyAppId(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app.appId) return;
            try {
              await navigator.clipboard.writeText(app.appId);
              toast({
                message: getLocaleText({
                  cn: "应用 ID 已复制",
                  en: "App ID copied",
                }),
                color: "success",
              });
            } catch (err) {
              toast({
                message: getLocaleText({
                  cn: "复制失败，请手动复制",
                  en: "Copy failed, please copy manually",
                }),
                color: "error",
              });
            }
          },

          async copyAutoShareUrl(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }
            if (!app || !app.autoShareUrl) {
              toast({
                message: getLocaleText({
                  cn: "分享链接尚未生成",
                  en: "Share link not ready yet",
                }),
                color: "tertiary",
              });
              return;
            }
            try {
              await navigator.clipboard.writeText(app.autoShareUrl);
              toast({
                message: getLocaleText({
                  cn: "分享链接已复制",
                  en: "Share link copied",
                }),
                color: "success",
              });
            } catch (err) {
              toast({
                message: getLocaleText({
                  cn: "复制失败，请手动复制",
                  en: "Copy failed, please copy manually",
                }),
                color: "error",
              });
            }
          },

          async copyShareLink() {
            if (!this.shareUrl) return;
            try {
              await navigator.clipboard.writeText(this.shareUrl);
              toast({
                message: getLocaleText({ cn: "链接已复制", en: "Link copied" }),
                color: "success",
              });
            } catch (err) {
              toast({
                message: getLocaleText({
                  cn: "复制失败，请手动复制",
                  en: "Copy failed, please copy manually",
                }),
                color: "error",
              });
            }
          },

          closeShareDialog() {
            this.shareDialogOpen = false;
          },

          async handleDelete(event, app) {
            if (event) {
              event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
            }

            const ok = await confirm({
              title: getLocaleText({ cn: "删除应用", en: "Delete App" }),
              message: getLocaleText(
                {
                  cn: "确定要从列表中删除应用「{name}」吗？该操作会从列表中移除，不会删除本地目录中的文件。",
                  en: "Remove \"{name}\" from the list? Files in the local directory will not be deleted.",
                },
                { name: app.name },
              ),
              yes: getLocaleText({ cn: "删除", en: "Delete" }),
              cancel: getLocaleText({ cn: "取消", en: "Cancel" }),
            });
            if (!ok) return;

            try {
              // 删除前若已发布，先撤销发布让分享链接失效
              if (app.autoShareUrl) {
                try {
                  await unpublishApp(app);
                } catch (err) {
                  console.warn("撤销分享失败（可忽略）：", err);
                }
              }

              // 关闭对应打开的窗口 + 清理状态
              clearOpened(app._recordName);

              // 对于虚拟目录应用，从共享命名空间中移除该应用的子目录
              if (app.source === "virtual" && app._handle) {
                try {
                  await app._handle.remove();
                } catch (vErr) {
                  console.warn("清空虚拟目录失败（可忽略）：", vErr);
                }
              }

              const apps = (await storage.getItem("apps")) || [];
              const next = apps.filter(
                (a) => !(a.name === (app._recordName || app.name)),
              );
              await storage.setItem("apps", next);

              // 同步共享 stanz 状态，应用市场页面会自动收到通知
              await syncOfficialAppState();

              await this.refreshApps();
              toast({
                message: getLocaleText({ cn: "已删除", en: "Deleted" }),
                color: "success",
              });
            } catch (err) {
              console.error(err);
              toast({
                message: getLocaleText(
                  { cn: "删除失败：{msg}", en: "Delete failed: {msg}" },
                  { msg: err.message || err },
                ),
                color: "error",
              });
            }
          },
        },
        watch: {
          async dialogOpen(val) {
            if (!val) {
              await this.refreshApps();
            }
          },
          async marketDialogOpen(val) {
            if (!val) {
              await this.refreshApps();
            }
          },
        },
      };
    };
  </script>
</template>
