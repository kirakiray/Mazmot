<template page>

  <!-- 发起方模式（host）-->
  <o-if :value="role === 'host'">

      <div class="status-text">
        {{hostStatus}}

        </o-if>

      <o-if :value="!connected">

    <!-- 还没有接收方连进来：显示分享链接输入框 + 复制按钮 -->

            type="text"

            on:click="selectLinkInput($event)"
          />
          <button
            class="copy-btn"
            on:click="handleCopyLink"
            attr:disabled="generating || !shareUrl"
          >
            {{generating ? '生成中' : '复制'}}
          </button>
        </div>
        <div class="gen-status">{{genStatus}}</div>
        <div class="my-id">你的ID：{{myUserId}}</div>
        <div class="tip">
          进入应用后会自动生成通信链接并展示在上方输入框。把链接分享给对方，对方打开后会以接收方身份与你建立点对点连接。随后双方像打乒乓球一样轮流填格：你先填第 1 格，对方收到后填第 2 格，你再填第 3 格……每次收到对方内容 1 秒后才填入自己那一格，按顺序填满 10×10 表格（底色区分是谁填的），满后自动清空循环。
          <br />注意：你需要保持此应用打开，对方才能连接到你。
        </div>

    <!-- 已连接：显示 10x10 表格，按顺序填入（底色区分自己/对方） -->
    <o-if :value="connected">
      <o-fill class="grid-box" :value="cells">
        <div class="cell" attr:side="$data.side">{{$data.emoji}}</div>

  <!-- 接收方模式（customer）-->
  <o-if :value="role === 'customer'">
    <div class="header">
      <h2>🏓 应用间通信演示（接收方）</h2>
      <div class="status-text">
        {{customerStatus}}
        <o-if :value="connected">
          <span class="link-badge" attr:type="peerOnline ? (myLinkType === 'rtc' ? 'rtc' : myLinkType ? 'relay' : 'offline') : 'offline'">{{peerOnline ? (myLinkType === 'rtc' ? 'WebRTC 直连' : myLinkType ? '服务器中转' : '连接中...') : '对方离线'}}</span>
        </o-if>
      </div>
    </div>
    <o-fill class="grid-box" :value="cells">
      <div class="cell" attr:side="$data.side">{{$data.emoji}}</div>
    </o-fill>

      <span>↑ 你 {{selfCount}}</span>

  </o-if>

  <!-- 加载中 -->
  <o-if :value="role === 'loading'">
    <div class="center-area">
      <div class="gen-status">正在初始化...</div>
    </div>
  </o-if>

  <script>
    export default async ({ load }) => {
      // 发起方与接收方必须使用同一个 namespace 才能互相发现
      // 这里直接沿用项目默认命名空间 "default"（与 lib/share-mgr.js 一致）
      const NAMESPACE = "default";
      const SERVICE_ID = "ping-pong";
      const REPLY_DELAY = 1000; // 收到对方内容后，延迟 1 秒再填入自己的
      // 对话内容候选 emoji（每次发送随机选一个）
      const EMOJIS = [
        "😀", "😂", "🥰", "😎", "🤔", "😴", "🤯", "🥳",
        "😺", "🐶", "🦊", "🐼", "🐨", "🦁", "🐮", "🐸",
        "🍎", "🍌", "🍉", "🍇", "🍓", "🍑", "🥑", "🍍",
        "⚽", "🏀", "🎮", "🎸", "🚀", "🌈", "⭐", "🔥",
        "💖", "🎉", "🎁", "🍀", "🌸", "🍦", "🍕", "🍣",
      ];

      // 角色判断：URL 带 host 参数 → 接收方模式
      const sp = new URLSearchParams(location.search);
      const hostUserId = sp.get("host") || "";
      const isCustomer = !!hostUserId;

      return {
        data: {
          role: "loading",
          myUserId: "",
          hostUserId,
          connected: false, // 发起方是否已与接收方建立连接
          // 10x10 表格：100 个格子，每项 { emoji, side: "" | "self" | "peer" }
          // 按到达顺序从左上到右下依次填入（行优先：idx 0~9 第一行，10~19 第二行……）
          // 格子底色按 side 区分：self=primary-container，peer=secondary-container
          cells: Array.from({ length: 100 }, () => ({ emoji: "", side: "" })),
          cellCursor: 0, // 下一个要填入的格子索引（0~99）
          selfCount: 0, // 自己已填入的 emoji 数（仅用于统计）
          peerCount: 0, // 对方已填入的 emoji 数（仅用于统计）
          // 发起方状态
          hostStatus: "",
          generating: false,
          genStatus: "",
          shareUrl: "",
          // 接收方状态
          customerStatus: "正在连接发起方...",
          // 连接方式与对端在线状态（双方共用）
          myLinkType: "", // "" / "rtc" / "relay"
          peerOnline: true, // 对端是否在线（默认 true，事件触发后再修正）
          peerUserId: "", // 对端 userId，用于事件匹配
        },

        proto: {
          // ===== 工具：从 EMOJIS 中随机挑一个 =====
          randomEmoji() {
            return EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
          },

          // ===== 跳转到握手服务器查看页（发起方等待连接时可用）=====
          goToServers() {
            this.goto("./servers.html");
          },

          // ===== 从 sendToService 返回值或 via 字段更新本地连接方式 =====
          setLinkTypeFromVia(via) {
            // NoneOS Core: via="rtc" 表示 WebRTC 直连，via="server" 表示服务器中转
            const next = via === "rtc" ? "rtc" : via ? "relay" : "";
            if (next && next !== this.myLinkType) {
              this.myLinkType = next;
            }
          },

          // ===== 在 10x10 表格中按顺序填入一个 emoji 方块 =====
          // 不管谁发的，都填到下一个空格（cellCursor），底色按 side 区分
          // 满 100 格后自动清空循环
          fillCell(emoji, side) {
            if (this.cellCursor >= 100) {
              this.resetCells();
            }
            const idx = this.cellCursor;
            this.cells.splice(idx, 1, { emoji: emoji || "", side });
            this.cellCursor++;
            if (side === "self") {
              this.selfCount++;
            } else {
              this.peerCount++;
            }
          },

          // ===== 清空整个表格 =====
          resetCells() {
            for (let i = 0; i < 100; i++) {
              this.cells.splice(i, 1, { emoji: "", side: "" });
            }
            this.cellCursor = 0;
            this.selfCount = 0;
            this.peerCount = 0;
          },

          // ===== 回合制核心：收到对方内容后，延迟 REPLY_DELAY 毫秒再发送自己的 =====
          // 这样填格顺序严格为：host 第1格 → customer 第2格 → host 第3格 …
          scheduleNextSend() {
            if (this._stopped) return;
            if (this._timer) clearTimeout(this._timer);
            this._timer = setTimeout(() => {
              this._timer = null;
              if (this._stopped) return;
              if (this.role === "host") {
                this.sendNextPing();
              } else {
                this.sendNextPong();
              }
            }, REPLY_DELAY);
          },

          // ===== 发起方：发一条 ping + 随机 emoji，发送成功后填入自己的格子 =====
          async sendNextPing() {
            if (this._stopped || !this._customerRemote) return;
            const emoji = this.randomEmoji();
            try {
              const results = await this._customerRemote.sendToService(
                SERVICE_ID,
                { kind: "ping", emoji },
              );
              this.applySendResults(results);
              this.fillCell(emoji, "self");
            } catch (err) {
              console.error("发送 ping 失败：", err);
            }
          },

          // ===== 接收方：发一条 pong + 随机 emoji，发送成功后填入自己的格子 =====
          async sendNextPong() {
            if (this._stopped || !this._remoteUser) return;
            const emoji = this.randomEmoji();
            try {
              const results = await this._remoteUser.sendToService(
                SERVICE_ID,
                { kind: "pong", emoji },
              );
              this.applySendResults(results);
              this.fillCell(emoji, "self");
            } catch (err) {
              console.error("发送 pong 失败：", err);
            }
          },

          // ===== 根据 sendToService 的返回结果更新连接方式 / 检测对端在线状态 =====
          applySendResults(results) {
            if (!Array.isArray(results) || results.length === 0) return;
            const okResult = results.find((r) => r && r.status === "ok");
            if (okResult) {
              if (okResult.via) this.setLinkTypeFromVia(okResult.via);
              if (!this.peerOnline) this.markPeerOnline(true);
            } else {
              // 所有结果均未送达：可能是 offline / no_receiver / discovery_failed / error
              const offline = results.some(
                (r) =>
                  r &&
                  (r.status === "offline" ||
                    r.status === "error" ||
                    r.status === "discovery_failed"),
              );
              if (offline && this.peerOnline) this.markPeerOnline(false);
            }
          },

          // ===== 标记对端上线 / 下线（仅更新徽章状态，不再推日志）=====
          markPeerOnline(online) {
            if (this.peerOnline === online) return;
            this.peerOnline = online;
          },

          // ===== 发起方初始化 =====
          initHost() {
            this.role = "host";
            this.hostStatus = "正在自动生成连接...";

            const self = this;
            this._svc = this._user.registerService(SERVICE_ID, {
              onMessage(data, ctx) {
                // 第一条消息到达时记录对端，并立即发第一个 ping（填第 1 格）
                if (!self._customerUserId) {
                  self._customerUserId = ctx.fromUserId;
                  self._customerRemote = ctx.remoteUser;
                  self.peerUserId = ctx.fromUserId;
                  self.hostStatus = "接收方已连接，正在轮流填格";
                  self.connected = true;
                  self.bindPeerEvents();
                  // 立即发第一个，开启回合制循环
                  self.sendNextPing();
                  return;
                }
                // 之后每收到对方 pong → 填对方格 → 延迟 1 秒后自己再发
                const emoji = (data && data.emoji) || "";
                self.fillCell(emoji, "peer");
                if (!self.peerOnline) self.markPeerOnline(true);
                self.scheduleNextSend();
              },
            });

            // 后台自动生成连接链接（不阻塞服务注册）
            // 注意：浏览器剪贴板 API 要求用户手势，自动调用可能无法写入剪贴板，
            // 因此生成后只展示链接，复制动作仍由用户点击「复制」按钮完成。
            this.generateLink().catch((err) => {
              console.error("自动生成链接失败：", err);
            });
          },

          // ===== 接收方初始化 =====
          async initCustomer() {
            this.role = "customer";

            // 先注册服务，接收发起方发来的 ping
            const self = this;
            this._svc = this._user.registerService(SERVICE_ID, {
              onMessage(data, ctx) {
                // 收到 host 的 ping → 填对方格 → 延迟 1 秒后自己再发 pong
                const emoji = (data && data.emoji) || "";
                self.fillCell(emoji, "peer");
                if (!self.peerOnline) self.markPeerOnline(true);
                self.scheduleNextSend();
              },
            });

            // 连接发起方
            try {
              this.customerStatus = "正在连接发起方...";
              const remote = await this._user.connectUser(this.hostUserId);
              this._remoteUser = remote;
              this.peerUserId = this.hostUserId;

              const online = await this._user.isRemoteUserOnline(
                this.hostUserId,
              );
              if (online) {
                this.customerStatus = "已连接，正在轮流填格";
                this.connected = true;
                this.bindPeerEvents();
                // 发送就绪信号，触发 host 填第 1 格（本端不填格）
                try {
                  await this._remoteUser.sendToService(SERVICE_ID, {
                    kind: "ready",
                  });
                } catch (err) {
                  console.error("发送就绪信号失败：", err);
                }
              } else {
                this.customerStatus = "发起方不在线，请稍后再试";
                this.peerOnline = false;
              }
            } catch (err) {
              console.error("连接发起方失败：", err);
              this.customerStatus = "连接失败：" + (err.message || err);
            }
          },

          // ===== 绑定对端上线 / 下线事件（双方共用）=====
          bindPeerEvents() {
            if (this._eventsBound || !this._user || !this.peerUserId) return;
            const self = this;
            const peerId = this.peerUserId;

            this._unbindConnected = this._user.bind(
              "remote_user_connected",
              (event) => {
                const detail = (event && event.detail) || {};
                if (detail.userId === peerId) {
                  // 主动 connect 成功或对端重新发消息过来都会触发
                  if (!self.peerOnline) self.markPeerOnline(true);
                }
              },
            );

            this._unbindDisconnected = this._user.bind(
              "remote_user_disconnected",
              (event) => {
                const detail = (event && event.detail) || {};
                if (detail.userId === peerId) {
                  // 仅在并非主动断开时提示下线
                  if (self.peerOnline) self.markPeerOnline(false);
                }
              },
            );

            // 监听 RTT 更新，实时刷新连接方式
            this._unbindRtt = this._user.bind("rtt_update", (event) => {
              const detail = (event && event.detail) || {};
              if (detail.userId === peerId && detail.via) {
                self.setLinkTypeFromVia(detail.via);
              }
            });

            // 监听 WebRTC 连接状态：RTC 协商成功后立即把徽章切到 rtc
            // NoneOS Core 会在后台静默升级，state === "connected" 即 DataChannel 已 open
            this._unbindRtcState = this._user.bind("rtc_state", (event) => {
              const detail = (event && event.detail) || {};
              if (detail.userId !== peerId) return;
              if (detail.state === "connected") {
                self.setLinkTypeFromVia("rtc");
                if (!self.peerOnline) self.markPeerOnline(true);
              } else if (
                detail.state === "disconnected" ||
                detail.state === "failed" ||
                detail.state === "closed"
              ) {
                // RTC 断开时回退到服务器中转显示，不直接判定对端下线
                //（下线由 sendToService 返回 offline / remote_user_disconnected 判定）
                if (self.myLinkType === "rtc") self.myLinkType = "relay";
              }
            });

            this._eventsBound = true;
          },

          // ===== 生成通信链接（发起方专用）=====
          async generateLink() {
            this.generating = true;
            this.genStatus = "准备中...";

            try {
              const self = this.parseSelfIdentity();
              if (!self) {
                throw new Error("无法识别当前应用的目录路径");
              }

              this.genStatus = "加载依赖...";
              const [fsMod, storageMod, shareMgr] = await Promise.all([
                load("/nos/fs/main.js"),
                load("/nos/storage/main.js"),
                load("/lib/share-mgr.js"),
              ]);
              const { init } = fsMod;
              const storage = storageMod.getStorage("mazmot");
              const { publishApp, generateAppId } = shareMgr;

              const apps = (await storage.getItem("apps")) || [];
              const { dirName } = self;
              const record =
                apps.find(
                  (a) =>
                    a.name === dirName || a.virtualDirName === dirName,
                ) ||
                apps.find((a) =>
                  a.dirName ? a.dirName.endsWith("/" + dirName) : false,
                ) ||
                null;

              this.genStatus = "获取应用目录...";
              const rootDir = await init(self.namespace);
              const handle = await rootDir.get(dirName);

              let appId = (record && record.appId) || "";
              if (!appId) {
                appId = await generateAppId(dirName);
                if (record) {
                  record.appId = appId;
                  await storage.setItem("apps", apps);
                }
              }

              const app = {
                _handle: handle,
                _recordName: dirName,
                name: (record && record.name) || "Mazmot Ping-Pong",
                version: (record && record.version) || "0.1.0",
                desc: (record && record.desc) || "",
                icon: (record && record.icon) || "🏓",
                appId,
              };

              // 关键：把发起方的 userId 作为 host 参数带到链接里
              this.genStatus = "发布到分享网络...";
              const { shareUrl, payloadHash } = await publishApp(app, {
                appId,
                appParams: { host: this.myUserId },
                onProgress: ({ text }) => {
                  if (text) this.genStatus = text;
                },
              });

              if (record && payloadHash) {
                record.payloadHash = payloadHash;
                await storage.setItem("apps", apps);
              }

              this.shareUrl = shareUrl;
              this.genStatus = "链接已生成，点击「复制」按钮分享给对方";
            } catch (err) {
              console.error("生成通信链接失败：", err);
              this.genStatus = "失败：" + (err.message || err);
            } finally {
              this.generating = false;
            }
          },

          // ===== 复制按钮点击：把已生成的链接复制到剪贴板 =====
          async handleCopyLink() {
            if (this.generating || !this.shareUrl) return;
            await this.copyToClipboard(this.shareUrl);
            this.genStatus = "已复制到剪贴板";
          },

          // ===== 点击链接输入框时全选，方便手动复制 =====
          selectLinkInput(event) {
            const el = event && event.target;
            if (el && typeof el.select === "function") {
              try {
                el.select();
              } catch (_) {}
            }
          },

          // ===== 工具方法 =====
          parseSelfIdentity() {
            const m = location.pathname.match(
              /^\/\$(.+?)\/(.+?)\/client\/index\.html$/,
            );
            if (!m) return null;
            return { namespace: m[1], dirName: m[2] };
          },

          async copyToClipboard(text) {
            try {
              if (
                navigator.clipboard &&
                navigator.clipboard.writeText
              ) {
                await navigator.clipboard.writeText(text);
              } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
              }
            } catch (_) {
              // 忽略复制失败
            }
          },
        },

        // ===== 生命周期 =====
        async ready() {
          try {
            const { getUser } = await load("/nos/user/main.js");
            const user = await getUser(NAMESPACE);
            this._user = user; // 非响应式对象，必须用 _ 前缀
            this.myUserId = user.userId;

            if (isCustomer) {
              await this.initCustomer();
            } else {
              await this.initHost();
            }
          } catch (err) {
            console.error("初始化失败：", err);
            this.role = "host";
            this.hostStatus = "初始化失败：" + (err.message || err);
          }
        },

        detached() {
          this._stopped = true; // 终止回合制循环
          if (this._timer) {
            clearTimeout(this._timer);
            this._timer = null;
          }
          // 解绑对端事件监听
          [
            this._unbindConnected,
            this._unbindDisconnected,
            this._unbindRtt,
            this._unbindRtcState,
          ].forEach((fn) => {
            if (typeof fn === "function") {
              try {
                fn();
              } catch (_) {}
            }
          });
          this._eventsBound = false;
          if (this._svc) {
            try {
              this._svc.unregister();
            } catch (_) {}
          }
        },
      };
    };
  </script>
</template>
