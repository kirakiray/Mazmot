  <script>
    export default async ({ load }) => {
      // 房间方与加入方必须使用同一个 namespace 才能互相发现
      // 沿用项目默认命名空间 "default"（与 lib/share-mgr.js 一致）
      const NAMESPACE = "default";
      const SERVICE_ID = "tic-tac-toe";

      // 八条获胜线（行 / 列 / 对角）
      const WIN_LINES = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      // 角色判断：URL 带 host 参数 → 加入方模式
      const sp = new URLSearchParams(location.search);
      const hostUserId = sp.get("host") || "";
      const isCustomer = !!hostUserId;

      // ===== 可靠投递层（ACK + 超时重发 + msgId 去重 + 串行队列）=====
      // 参考 noneos-core-docs/references/reliable-messaging.md
      const ACK_TIMEOUT = 3000; // 单次等待 ACK 的毫秒数
      const MAX_RETRY = 3; // 最大重发次数
      const SEEN_TTL = 5 * 60 * 1000; // 去重记录保留 5 分钟

      const pendingAcks = new Map(); // msgId -> { resolve, reject, timer, tries }
      const seenIds = new Map(); // msgId -> 首次接收时间戳
      const sendQueues = new Map(); // 队列 key -> 尾部 Promise（串行链）
      let msgSeq = 0;

      /** 把发送操作排入对应目标的串行队列（前一条 ACK 后才发下一条） */
      function enqueue(key, task) {
        const prev = sendQueues.get(key) ?? Promise.resolve();
        const next = prev.then(task, task);
        sendQueues.set(key, next);
        next.finally(() => {
          if (sendQueues.get(key) === next) sendQueues.delete(key);
        });
        return next;
      }

      /** 收到 ACK 时结算对应的 pending 发送 */
      function resolveAck(msgId) {
        const entry = pendingAcks.get(msgId);
        if (!entry) return; // 迟到的重复 ACK，忽略
        clearTimeout(entry.timer);
        pendingAcks.delete(msgId);
        entry.resolve();
      }

      /** 清理过期的去重记录 */
      function pruneSeen() {
        const deadline = Date.now() - SEEN_TTL;
        for (const [id, ts] of seenIds) {
          if (ts < deadline) seenIds.delete(id);
        }
      }

      return {
        data: {
          role: "loading",
          myUserId: "",
          hostUserId,
          connected: false, // 是否已建立对战连接
          // 棋盘：长度 9，元素为 "" / "X" / "O"
          board: ["", "", "", "", "", "", "", "", ""],
          // 当前回合 "X" / "O"
          currentTurn: "X",
          // 对局结果：null / "X" / "O" / "draw"
          result: null,
          // 我方棋子标记
          myMark: "",
          // 比分
          scoreX: 0,
          scoreO: 0,
          rounds: 0,
          // 房间方状态
          hostStatus: "",
          generating: false,
          genStatus: "",
          shareUrl: "",
          // 加入方状态
          customerStatus: "正在连接房间方...",
          // 连接方式与对端在线状态（双方共用）
          myLinkType: "", // "" / "rtc" / "relay"
          peerOnline: true, // 对端是否在线（默认 true，事件触发后再修正）
          peerUserId: "", // 对端 userId，用于事件匹配
        },

        proto: {
          // ===== 计算属性：结果文案 =====
          get resultText() {
            if (!this.result) return "";
            if (this.result === "draw") return "平局！";
            const isMine = this.result === this.myMark;
            return isMine ? "你赢了 🎉" : "你输了 😅";
          },

          // ===== 计算属性：比分文案 =====
          get scoreText() {
            return `${this.scoreX} : ${this.scoreO}`;
          },

          // ===== 从 sendToService 返回值或 via 字段更新本地连接方式 =====
          setLinkTypeFromVia(via) {
            // NoneOS Core: via="rtc" 表示 WebRTC 直连，其余非空 via 视为服务器中转
            const next = via === "rtc" ? "rtc" : via ? "relay" : "";
            if (next && next !== this.myLinkType) {
              this.myLinkType = next;
            }
          },

          // ===== 根据 sendToService 的返回结果更新连接方式 / 对端在线状态 =====
          applySendResults(results) {
            if (!Array.isArray(results) || results.length === 0) return;
            const okResult = results.find((r) => r && r.status === "ok");
            if (okResult) {
              if (okResult.via) this.setLinkTypeFromVia(okResult.via);
              if (!this.peerOnline) this.peerOnline = true;
            } else {
              // 所有结果均未送达：可能是 offline / no_receiver / discovery_failed / error
              const offline = results.some(
                (r) =>
                  r &&
                  (r.status === "offline" ||
                    r.status === "error" ||
                    r.status === "discovery_failed"),
              );
              if (offline && this.peerOnline) this.peerOnline = false;
            }
          },

          // ===== 绑定对端上线 / 下线 / RTT / RTC 状态事件（双方共用）=====
          bindPeerEvents() {
            if (this._eventsBound || !this._user || !this.peerUserId) return;
            const self = this;
            const peerId = this.peerUserId;

            this._unbindConnected = this._user.bind(
              "remote_user_connected",
              (event) => {
                const detail = (event && event.detail) || {};
                if (detail.userId === peerId) {
                  if (!self.peerOnline) self.peerOnline = true;
                }
              },
            );

            this._unbindDisconnected = this._user.bind(
              "remote_user_disconnected",
              (event) => {
                const detail = (event && event.detail) || {};
                if (detail.userId === peerId) {
                  if (self.peerOnline) self.peerOnline = false;
                }
              },
            );

            // 监听 RTT 更新，实时刷新连接方式
            this._unbindRtt = this._user.bind("rtt_update", (event) => {
              const detail = (event && event.detail) || {};
              if (detail.userId === peerId && detail.via) {
                self.setLinkTypeFromVia(detail.via);
              }
            });

            // 监听 WebRTC 连接状态：RTC 协商成功后立即把徽章切到 rtc
            this._unbindRtcState = this._user.bind("rtc_state", (event) => {
              const detail = (event && event.detail) || {};
              if (detail.userId !== peerId) return;
              if (detail.state === "connected") {
                self.setLinkTypeFromVia("rtc");
                if (!self.peerOnline) self.peerOnline = true;
              } else if (
                detail.state === "disconnected" ||
                detail.state === "failed" ||
                detail.state === "closed"
              ) {
                // RTC 断开时回退到服务器中转显示，不直接判定对端下线
                if (self.myLinkType === "rtc") self.myLinkType = "relay";
              }
            });

            this._eventsBound = true;
          },

          // ===== 获取当前发送目标（房间方发给 customer，加入方发给 host）=====
          getRemote() {
            if (this.role === "host") return this._customerRemote;
            if (this.role === "customer") return this._remoteUser;
            return null;
          },

          // ===== 可靠发送：msgId + 等 ACK + 超时重发 + 串行队列 =====
          // payload 是业务数据（{ kind, ... }），外部无需关心信封。
          // ACK 到达时 resolve；重试 MAX_RETRY 次后仍无 ACK 则 reject。
          sendReliable(payload) {
            const remote = this.getRemote();
            if (!remote) return Promise.reject(new Error("无可用连接"));

            const msgId = `m-${Date.now()}-${++msgSeq}`;
            const key = remote.userId ?? "peer";

            return enqueue(key, () =>
              new Promise((resolve, reject) => {
                const entry = { resolve, reject, timer: null, tries: 0 };
                pendingAcks.set(msgId, entry);

                const attempt = async () => {
                  entry.tries++;
                  if (entry.tries > MAX_RETRY) {
                    pendingAcks.delete(msgId);
                    reject(
                      new Error(`ACK 超时（重试 ${MAX_RETRY} 次后放弃）`),
                    );
                    return;
                  }

                  const results = await remote.sendToService(
                    SERVICE_ID,
                    { msgId, kind: "data", payload },
                    { waitForService: ACK_TIMEOUT },
                  );

                  // 利用返回值更新连接状态 / 对端在线指示
                  this.applySendResults(results);

                  // 无论 ok 与否都设超时等 ACK；ACK 到达后 clearTimeout
                  entry.timer = setTimeout(attempt, ACK_TIMEOUT);
                };

                attempt();
              }),
            );
          },

          // ===== 判断某格是否可落子 =====
          canPlaceAt(index) {
            // 已结束或未连接：全部不可点
            if (!this.connected || this.result) return false;
            // 只有自己的回合 + 空格可点
            if (this.currentTurn !== this.myMark) return false;
            return this.board[index] === "";
          },

          // ===== 判断某格是否属于获胜线（用于高亮）=====
          isWinCell(index) {
            return !!this.winLine && this.winLine.indexOf(index) !== -1;
          },

          // ===== 我方落子（UI 触发）=====
          async placeAt(index) {
            if (!this.canPlaceAt(index)) return;
            const mark = this.myMark;

            // 本地先落子
            this.board[index] = mark;
            this.applyAfterMove(mark);
            // 棋盘变更后，ofa.js 会自动重新渲染

            // 可靠同步给对端（带 ACK + 超时重发，防止通道切换时静默丢失）
            try {
              await this.sendReliable({ kind: "move", index, mark });
            } catch (err) {
              console.error("同步落子失败：", err.message || err);
            }
          },

          // ===== 落子后统一处理：切换回合 + 判定胜负 =====
          applyAfterMove(placedMark) {
            // 判定胜负
            const winner = this.checkWinner();
            if (winner) {
              this.finishGame(winner);
              return;
            }
            // 平局
            if (this.board.every((c) => c !== "")) {
              this.finishGame("draw");
              return;
            }
            // 切换回合
            this.currentTurn = placedMark === "X" ? "O" : "X";
          },

          // ===== 检查是否有胜者，返回 "X"/"O"/null，同时记录获胜线 =====
          checkWinner() {
            for (const line of WIN_LINES) {
              const [a, b, c] = line;
              const v = this.board[a];
              if (v && v === this.board[b] && v === this.board[c]) {
                this.winLine = line;
                return v;
              }
            }
            this.winLine = null;
            return null;
          },

          // ===== 结束当前对局 =====
          finishGame(result) {
            this.result = result;
            if (result === "X") this.scoreX++;
            else if (result === "O") this.scoreO++;
            this.rounds++;
          },

          // ===== 接收对端落子消息 =====
          onRemoteMove(data) {
            const { index, mark } = data || {};
            if (typeof index !== "number" || index < 0 || index > 8) return;
            if (mark !== "X" && mark !== "O") return;
            if (this.board[index] !== "") return; // 防重复落子

            // 收到对端消息说明对端在线
            if (!this.peerOnline) this.peerOnline = true;

            this.board[index] = mark;
            this.applyAfterMove(mark);
          },

          // ===== 接收对端重开请求 =====
          onRemoteRestart() {
            this.resetBoard();
            // 若发起方请求重开，我方直接就绪
          },

          // ===== 重置棋盘 =====
          resetBoard() {
            this.board = ["", "", "", "", "", "", "", "", ""];
            this.currentTurn = "X"; // X 永远先手
            this.result = null;
            this._winLine = null;
          },

          // ===== 点击「再来一局」：通知对端并重置 =====
          async requestRestart() {
            this.resetBoard();
            try {
              await this.sendReliable({ kind: "restart" });
            } catch (err) {
              console.error("通知重开失败：", err.message || err);
            }
          },

          // ===== 房间方初始化 =====
          initHost() {
            this.role = "host";
            this.myMark = "X"; // 房间方执 X 先手
            this.hostStatus = "正在自动生成连接...";

            const self = this;
            this._svc = this._user.registerService(SERVICE_ID, {
              onMessage(data, ctx) {
                // 第一条消息到达时记录对端
                if (!self._customerUserId) {
                  self._customerUserId = ctx.fromUserId;
                  self._customerRemote = ctx.remoteUser;
                  self.peerUserId = ctx.fromUserId;
                  self.hostStatus = "对手已加入，开始对战";
                  self.connected = true;
                  self.bindPeerEvents();
                }
                self.handleIncoming(data, ctx);
              },
            });

            // 后台自动生成对战链接（不阻塞服务注册）
            // 注意：浏览器剪贴板 API 要求用户手势，自动调用可能无法写入剪贴板，
            // 因此生成后只展示链接，复制动作仍由用户点击「复制」按钮完成。
            this.generateLink().catch((err) => {
              console.error("自动生成链接失败：", err);
            });
          },

          // ===== 加入方初始化 =====
          async initCustomer() {
            this.role = "customer";
            this.myMark = "O"; // 加入方执 O 后手

            const self = this;
            this._svc = this._user.registerService(SERVICE_ID, {
              onMessage(data, ctx) {
                self.handleIncoming(data, ctx);
              },
            });

            try {
              this.customerStatus = "正在连接房间方...";
              const remote = await this._user.connectUser(this.hostUserId);
              this._remoteUser = remote;
              this.peerUserId = this.hostUserId;

              const online = await this._user.isRemoteUserOnline(
                this.hostUserId,
              );
              if (online) {
                this.customerStatus = "已连接，开始对战";
                this.connected = true;
                this.bindPeerEvents();
                // 主动发一条 hello 让房间方知道自己已加入（可靠投递）
                try {
                  await this.sendReliable({
                    kind: "hello",
                    mark: this.myMark,
                  });
                } catch (err) {
                  console.error("发送就绪信号失败：", err.message || err);
                }
              } else {
                this.customerStatus = "房间方不在线，请稍后再试";
                this.peerOnline = false;
              }
            } catch (err) {
              console.error("连接房间方失败：", err);
              this.customerStatus = "连接失败：" + (err.message || err);
            }
          },

          // ===== 统一处理收到的消息（可靠投递信封拆包）=====
          handleIncoming(data, ctx) {
            if (!data || !data.msgId) return; // 不符合协议的消息忽略

            // 1. ACK 分支：结算本端等待中的发送
            if (data.kind === "ack") {
              resolveAck(data.msgId);
              return;
            }

            // 2. 无论是否重复，都先回 ACK
            //    （重复消息说明上次 ACK 丢了，必须再回，否则对端会一直重发）
            if (ctx && ctx.remoteUser && ctx.fromSessionId) {
              ctx.remoteUser
                .sendToService(
                  SERVICE_ID,
                  { msgId: data.msgId, kind: "ack" },
                  { sessionId: ctx.fromSessionId },
                )
                .catch(() => {});
            }

            // 3. 按 msgId 去重，重发导致的重复消息只处理一次
            if (seenIds.has(data.msgId)) return;
            seenIds.set(data.msgId, Date.now());
            pruneSeen();

            // 4. 拆信封，执行业务逻辑
            if (data.kind === "data" && data.payload) {
              const { kind } = data.payload;
              if (kind === "move") {
                this.onRemoteMove(data.payload);
              } else if (kind === "restart") {
                this.onRemoteRestart();
              } else if (kind === "hello") {
                // 加入方上线通知，房间方无需特殊处理
              }
            }
          },

          // ===== 生成对战链接（房间方专用）=====
          async generateLink() {
            this.generating = true;
            this.genStatus = "准备中...";

            try {
              const self = this.parseSelfIdentity();
              if (!self) {
                throw new Error("无法识别当前应用的目录路径");
              }

              this.genStatus = "加载依赖...";
              const [fsMod, storageMod, shareMgr] = await Promise.all([
                load("/nos/fs/main.js"),
                load("/nos/storage/main.js"),
                load("/mz/share-mgr.js"),
              ]);
              const { init } = fsMod;
              const storage = storageMod.getStorage("mazmot");
              const { publishApp, generateAppId } = shareMgr;

              const apps = (await storage.getItem("apps")) || [];
              const { dirName } = self;
              const record =
                apps.find(
                  (a) =>
                    a.name === dirName || a.virtualDirName === dirName,
                ) ||
                apps.find((a) =>
                  a.dirName ? a.dirName.endsWith("/" + dirName) : false,
                ) ||
                null;

              this.genStatus = "获取应用目录...";
              const rootDir = await init(self.namespace);
              const handle = await rootDir.get(dirName);

              let appId = (record && record.appId) || "";
              if (!appId) {
                appId = await generateAppId(dirName);
                if (record) {
                  record.appId = appId;
                  await storage.setItem("apps", apps);
                }
              }

              const app = {
                _handle: handle,
                _recordName: dirName,
                name: (record && record.name) || "Mazmot Tic-Tac-Toe",
                version: (record && record.version) || "0.1.0",
                desc: (record && record.desc) || "",
                icon: (record && record.icon) || "🎮",
                appId,
              };

              // 关键：把房间方的 userId 作为 host 参数带到链接里
              this.genStatus = "发布到分享网络...";
              const { shareUrl, payloadHash } = await publishApp(app, {
                appId,
                appParams: { host: this.myUserId },
                onProgress: ({ text }) => {
                  if (text) this.genStatus = text;
                },
              });

              if (record && payloadHash) {
                record.payloadHash = payloadHash;
                await storage.setItem("apps", apps);
              }

              await this.copyToClipboard(shareUrl);
              this.shareUrl = shareUrl;
              this.genStatus = "链接已复制到剪贴板，快去邀请对手吧！";
            } catch (err) {
              console.error("生成对战链接失败：", err);
              this.genStatus = "失败：" + (err.message || err);
            } finally {
              this.generating = false;
            }
          },

          // ===== 复制按钮点击：已有链接直接复制，否则先生成 =====
          async handleCopyLink() {
            if (this.generating) return;
            if (this.shareUrl) {
              await this.copyToClipboard(this.shareUrl);
              this.genStatus = "已复制到剪贴板";
              return;
            }
            await this.generateLink();
          },

          // ===== 点击链接输入框时全选 =====
          selectLinkInput(event) {
            const el = event && event.target;
            if (el && typeof el.select === "function") {
              try {
                el.select();
              } catch (_) {}
            }
          },

          // ===== 工具方法 =====
          parseSelfIdentity() {
            const m = location.pathname.match(
              /^\/\$(.+?)\/(.+?)\/client\/index\.html$/,
            );
            if (!m) return null;
            return { namespace: m[1], dirName: m[2] };
          },

          async copyToClipboard(text) {
            try {
              if (
                navigator.clipboard &&
                navigator.clipboard.writeText
              ) {
                await navigator.clipboard.writeText(text);
              } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
              }
            } catch (_) {
              // 忽略复制失败
            }
          },
        },

        // ===== 生命周期 =====
        async ready() {
          try {
            const { getUser } = await load("/nos/user/main.js");
            const user = await getUser(NAMESPACE);
            this._user = user; // 非响应式对象，必须用 _ 前缀
            this.myUserId = user.userId;

            if (isCustomer) {
              await this.initCustomer();
            } else {
              await this.initHost();
            }
          } catch (err) {
            console.error("初始化失败：", err);
            this.role = "host";
            this.hostStatus = "初始化失败：" + (err.message || err);
          }
        },

        detached() {
          // 清理可靠投递层的定时器与队列
          for (const entry of pendingAcks.values()) {
            clearTimeout(entry.timer);
          }
          pendingAcks.clear();
          sendQueues.clear();

          // 解绑对端事件监听
          [
            this._unbindConnected,
            this._unbindDisconnected,
            this._unbindRtt,
            this._unbindRtcState,
          ].forEach((fn) => {
            if (typeof fn === "function") {
              try {
                fn();
              } catch (_) {}
            }
          });
          this._eventsBound = false;
          if (this._svc) {
            try {
              this._svc.unregister();
            } catch (_) {}
          }
        },
      };
    };
  </script>
</template>
