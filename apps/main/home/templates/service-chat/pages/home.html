<template page>
  <style>
    :host {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--md-sys-color-surface);
    }

    /* ===== 顶部标题栏 ===== */
    .header {
      padding: 14px 20px;
      background: var(--md-sys-color-surface-container);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      text-align: center;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .header h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      letter-spacing: 0.3px;
    }
    .header .status-text {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 4px;
    }

    /* ===== 消息区域 ===== */
    .msg-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-box::-webkit-scrollbar {
      width: 6px;
    }
    .msg-box::-webkit-scrollbar-thumb {
      background: var(--md-sys-color-outline);
      border-radius: 3px;
    }
    .msg-box::-webkit-scrollbar-track {
      background: transparent;
    }
    .msg {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      animation: msgIn 0.18s ease-out;
    }
    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .msg[type="sent"] {
      align-self: flex-end;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-bottom-right-radius: 4px;
    }
    .msg[type="received"] {
      align-self: flex-start;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-bottom-left-radius: 4px;
    }

    /* ===== 居中区域（服务商等待界面）===== */
    .center-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
    }
    .link-bar {
      display: flex;
      align-items: stretch;
      gap: 8px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 12px;
    }
    .link-bar input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 24px;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }
    .link-bar input:focus {
      border-color: var(--md-sys-color-primary);
    }
    .copy-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 24px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }
    .copy-btn:hover:not(:disabled) {
      opacity: 0.9;
    }
    .copy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .gen-status {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 8px;
      min-height: 18px;
    }
    .my-id {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 20px;
      padding: 6px 12px;
      background: var(--md-sys-color-surface-container);
      border-radius: 8px;
      word-break: break-all;
      max-width: 320px;
    }
    .tip {
      margin-top: 16px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--md-sys-color-on-tertiary-container);
      background: var(--md-sys-color-tertiary-container);
      border-radius: 12px;
      max-width: 360px;
      text-align: left;
    }

    /* ===== 底部输入栏 ===== */
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container);
      flex-shrink: 0;
    }
    .input-bar input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 24px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input-bar input:focus {
      border-color: var(--md-sys-color-primary);
    }
    .input-bar input::placeholder {
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.7;
    }
    .input-bar button {
      padding: 12px 22px;
      border: none;
      border-radius: 24px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }
    .input-bar button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== 空状态提示 ===== */
    .empty-hint {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13px;
      text-align: center;
      margin-top: 40px;
      opacity: 0.8;
    }
  </style>

  <!-- 服务商模式 -->
  <o-if :value="role === 'host'">
    <div class="header">
      <h2>💬 Mazmot Service Chat（服务商）</h2>
      <div class="status-text">{{hostStatus}}</div>
    </div>

    <!-- 还没有客户连进来：显示分享链接输入框 + 复制按钮 -->
    <o-if :value="messages.length === 0">
      <div class="center-area">
        <div class="link-bar">
          <input
            type="text"
            readonly
            :value="shareUrl"
            attr:placeholder="generating ? '正在生成链接...' : '点击右侧按钮生成聊天链接'"
            on:click="selectLinkInput($event)"
          />
          <button
            class="copy-btn"
            on:click="handleCopyLink"
            attr:disabled="generating"
          >
            {{generating ? '生成中' : (shareUrl ? '复制' : '生成链接')}}
          </button>
        </div>
        <div class="gen-status">{{genStatus}}</div>
        <div class="my-id">你的ID：{{myUserId}}</div>
        <div class="tip">
          点击「生成链接」会生成聊天链接并自动复制到剪贴板；再次点击「复制」可重新复制。把链接分享给别人，对方打开后会以客户身份与你聊天。
          <br />注意：你需要保持此应用打开，对方才能连接到你。
        </div>
      </div>
    </o-if>

    <!-- 有客户发来消息：切换为聊天界面 -->
    <o-if :value="messages.length > 0">
      <div id="msg-box" class="msg-box">
        <o-fill :value="messages">
          <div class="msg" attr:type="$data.type">{{$data.text}}</div>
        </o-fill>
      </div>
      <div class="input-bar">
        <input type="text" sync:value="inputText" placeholder="输入消息..." on:keydown="onInputKeydown($event)" />
        <button on:click="sendMessage" attr:disabled="!inputText.trim()">发送</button>
      </div>
    </o-if>
  </o-if>

  <!-- 客户模式 -->
  <o-if :value="role === 'customer'">
    <div class="header">
      <h2>💬 在线客服</h2>
      <div class="status-text">{{customerStatus}}</div>
    </div>
    <div id="msg-box" class="msg-box">
      <o-fill :value="messages">
        <div class="msg" attr:type="$data.type">{{$data.text}}</div>
      </o-fill>
      <o-if :value="messages.length === 0">
        <div class="empty-hint">{{customerStatus}}</div>
      </o-if>
    </div>
    <div class="input-bar">
      <input type="text" sync:value="inputText" placeholder="输入消息..." on:keydown="onInputKeydown($event)" />
      <button on:click="sendMessage" attr:disabled="!inputText.trim()">发送</button>
    </div>
  </o-if>

  <!-- 加载中 -->
  <o-if :value="role === 'loading'">
    <div class="center-area">
      <div class="gen-status">正在初始化...</div>
    </div>
  </o-if>

  <script>
    export default async ({ load }) => {
      // 服务商和客户必须使用同一个 namespace 才能互相发现
      // 这里直接沿用项目默认命名空间 "mazmot"（与 apps/main/lib/share-mgr.js 一致）
      const NAMESPACE = "mazmot";
      const SERVICE_ID = "chat";

      // 角色判断：URL 带 host 参数 → 客户模式
      const sp = new URLSearchParams(location.search);
      const hostUserId = sp.get("host") || "";
      const isCustomer = !!hostUserId;

      return {
        data: {
          role: "loading",
          myUserId: "",
          hostUserId,
          messages: [],
          inputText: "",
          // 服务商状态
          hostStatus: "",
          generating: false,
          genStatus: "",
          shareUrl: "",
          // 客户状态
          customerStatus: "正在连接服务商...",
        },

        proto: {
          // ===== 发送消息 =====
          async sendMessage() {
            const text = (this.inputText || "").trim();
            if (!text) return;

            try {
              if (this.role === "customer" && this._remoteUser) {
                const results = await this._remoteUser.sendToService(
                  SERVICE_ID,
                  { text },
                  { waitForService: 3000 },
                );
                const delivered = results.some((r) => r.status === "ok");
                if (!delivered) {
                  const st = (results[0] && results[0].status) || "unknown";
                  if (st === "offline") {
                    this.customerStatus = "服务商不在线";
                  } else if (st === "no_receiver") {
                    this.customerStatus = "服务商未就绪，请稍候";
                  } else {
                    this.customerStatus = "消息未送达：" + st;
                  }
                  return;
                }
              } else if (this.role === "host" && this._customerRemote) {
                await this._customerRemote.sendToService(SERVICE_ID, {
                  text,
                });
              } else {
                return; // 没有连接对象，静默忽略
              }

              this.messages.push({ text, type: "sent" });
              this.inputText = "";
              this.scrollToBottom();
            } catch (err) {
              console.error("发送失败：", err);
            }
          },

          onInputKeydown(event) {
            if (event.key === "Enter") {
              this.sendMessage();
            }
          },

          // ===== 服务商初始化 =====
          async initHost() {
            this.role = "host";
            this.hostStatus = "等待客户连接...";

            const self = this;
            this._svc = this._user.registerService(SERVICE_ID, {
              onMessage(data, ctx) {
                // 记录第一个发来消息的客户
                if (!self._customerUserId) {
                  self._customerUserId = ctx.fromUserId;
                  self._customerRemote = ctx.remoteUser;
                  self.hostStatus = "客户已连接";
                }
                const text = (data && data.text) || String(data);
                self.messages.push({ text, type: "received" });
                self.scrollToBottom();
              },
            });
          },

          // ===== 客户初始化 =====
          async initCustomer() {
            this.role = "customer";

            // 先注册服务，接收服务商的回复
            const self = this;
            this._svc = this._user.registerService(SERVICE_ID, {
              onMessage(data, ctx) {
                const text = (data && data.text) || String(data);
                self.messages.push({ text, type: "received" });
                self.scrollToBottom();
              },
            });

            // 连接服务商
            try {
              this.customerStatus = "正在连接服务商...";
              const remote = await this._user.connectUser(this.hostUserId);
              this._remoteUser = remote;

              const online = await this._user.isRemoteUserOnline(
                this.hostUserId,
              );
              if (online) {
                this.customerStatus = "已连接，可以开始聊天";
              } else {
                this.customerStatus = "服务商不在线，请稍后再试";
              }
            } catch (err) {
              console.error("连接服务商失败：", err);
              this.customerStatus = "连接失败：" + (err.message || err);
            }
          },

          // ===== 生成聊天链接（服务商专用）=====
          async generateChatLink() {
            this.generating = true;
            this.genStatus = "准备中...";

            try {
              const self = this.parseSelfIdentity();
              if (!self) {
                throw new Error("无法识别当前应用的目录路径");
              }

              this.genStatus = "加载依赖...";
              const [fsMod, cacheMod, shareMgr] = await Promise.all([
                load("/nos/fs/main.js"),
                load(
                  "https://cdn.jsdelivr.net/gh/kirakiray/ever-cache/src/main.min.js",
                ),
                load("/apps/main/lib/share-mgr.js"),
              ]);
              const { init } = fsMod;
              const { storage } = cacheMod;
              const { publishApp, generateAppId } = shareMgr;

              const apps = (await storage.apps) || [];
              const { dirName } = self;
              const record =
                apps.find(
                  (a) =>
                    a.name === dirName || a.virtualDirName === dirName,
                ) ||
                apps.find((a) =>
                  a.dirName ? a.dirName.endsWith("/" + dirName) : false,
                ) ||
                null;

              this.genStatus = "获取应用目录...";
              const rootDir = await init(self.namespace);
              const handle = await rootDir.get(dirName);

              let appId = (record && record.appId) || "";
              if (!appId) {
                appId = await generateAppId(dirName);
                if (record) {
                  record.appId = appId;
                  await storage.setItem("apps", apps);
                }
              }

              const app = {
                _handle: handle,
                _recordName: dirName,
                name: (record && record.name) || "Mazmot Service Chat",
                version: (record && record.version) || "0.1.0",
                desc: (record && record.desc) || "",
                icon: (record && record.icon) || "💬",
                appId,
              };

              // 关键：把服务商的 userId 作为 host 参数带到链接里
              this.genStatus = "发布到分享网络...";
              const { shareUrl, payloadHash } = await publishApp(app, {
                appId,
                appParams: { host: this.myUserId },
                onProgress: ({ text }) => {
                  if (text) this.genStatus = text;
                },
              });

              if (record && payloadHash) {
                record.payloadHash = payloadHash;
                await storage.setItem("apps", apps);
              }

              // 复制到剪贴板
              await this.copyToClipboard(shareUrl);
              this.shareUrl = shareUrl;
              this.genStatus = "链接已复制到剪贴板，快去分享吧！";
            } catch (err) {
              console.error("生成聊天链接失败：", err);
              this.genStatus = "失败：" + (err.message || err);
            } finally {
              this.generating = false;
            }
          },

          // ===== 复制按钮点击：已有链接直接复制，否则先生成 =====
          async handleCopyLink() {
            if (this.generating) return;
            if (this.shareUrl) {
              await this.copyToClipboard(this.shareUrl);
              this.genStatus = "已复制到剪贴板";
              return;
            }
            await this.generateChatLink();
          },

          // ===== 点击链接输入框时全选，方便手动复制 =====
          selectLinkInput(event) {
            const el = event && event.target;
            if (el && typeof el.select === "function") {
              try {
                el.select();
              } catch (_) {}
            }
          },

          // ===== 工具方法 =====
          parseSelfIdentity() {
            const m = location.pathname.match(
              /^\/\$(.+?)\/(.+?)\/client\/index\.html$/,
            );
            if (!m) return null;
            return { namespace: m[1], dirName: m[2] };
          },

          async copyToClipboard(text) {
            try {
              if (
                navigator.clipboard &&
                navigator.clipboard.writeText
              ) {
                await navigator.clipboard.writeText(text);
              } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
              }
            } catch (_) {
              // 忽略复制失败
            }
          },

          scrollToBottom() {
            setTimeout(() => {
              const box = this.shadow.$("#msg-box");
              if (box) box.ele.scrollTop = box.ele.scrollHeight;
            }, 50);
          },
        },

        // ===== 生命周期 =====
        async ready() {
          try {
            const { getUser } = await load("/nos/user/main.js");
            const user = await getUser(NAMESPACE);
            this._user = user; // 非响应式对象，必须用 _ 前缀
            this.myUserId = user.userId;

            if (isCustomer) {
              await this.initCustomer();
            } else {
              await this.initHost();
            }
          } catch (err) {
            console.error("初始化失败：", err);
            this.role = "host";
            this.hostStatus = "初始化失败：" + (err.message || err);
          }
        },

        detached() {
          if (this._svc) {
            try {
              this._svc.unregister();
            } catch (_) {}
          }
        },
      };
    };
  </script>
</template>
