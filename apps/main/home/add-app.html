<template page>
  <style>
    :host {
      display: block;
    }
    .section {
      margin-bottom: 24px;
      padding: 0 16px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 4px;
    }

      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.7;
      margin-top: 12px;
      line-height: 1.5;
    }
    .section-header {
      padding-bottom: 4px;
      border-bottom: 1px solid var(--md-sys-color-surface-variant);
      margin-bottom: 12px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* 步骤导航条 */
    .steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 16px 12px;
      margin-bottom: 4px;
    }
    .step {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .step[active],
    .step[done] {
      color: var(--md-sys-color-primary);
      opacity: 1;
    }
    .step-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface-variant);

      font-size: 11px;
      line-height: 1;
      transition: all 0.2s;

      font-size: 12px;

      color: var(--md-sys-color-on-primary);

    .step-label {
      font-size: 12px;

      background-color: var(--md-sys-color-primary);
    }

    /* 表单 */

      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 6px;
    }

    .form-field st-textarea {
      width: 100%;

      color: var(--md-sys-color-error);

      margin-top: 6px;

    }

    }

    /* 模板选择 */
    .template-label {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 6px;
    }
    .template-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .template-card {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--md-sys-color-surface-variant);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      background-color: var(--md-sys-color-surface);
    }
    .template-card:hover {
      border-color: var(--md-sys-color-primary);
    }
    .template-card[active] {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-primary-container);
    }
    .template-card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 2px;
    }
    .template-card[active] .template-card-name {
      color: var(--md-sys-color-on-primary-container);
    }
    .template-card-desc {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.4;
    }
    .template-loading {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 12px;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .template-loading n-icon {
      font-size: 18px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px;
      border-top: 1px solid var(--md-sys-color-surface-variant);
      margin-top: 12px;
    }

    /* 写入进度条 */
    .progress-wrap {
      padding: 8px 0 16px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: var(--md-sys-color-surface-variant);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background-color: var(--md-sys-color-primary);
      transition: width 0.2s;
    }
    .progress-text {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
    }
    .file-list {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      background-color: var(--md-sys-color-surface-variant);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .file-item {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      padding: 3px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
    }
    .file-item[status="done"] {
      color: var(--md-sys-color-primary);
    }
    .success-block {
      text-align: center;
      padding: 16px;
      color: var(--md-sys-color-primary);
    }
    .success-block n-icon {
      font-size: 48px;
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/textarea/textarea.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <!-- 步骤导航条 -->
  <div class="steps">
    <div class="step" attr:active="step === 1" attr:done="step > 1">
      <div class="step-circle">
        <x-if :value="step > 1">
          <n-icon icon="mdi:check"></n-icon>
        </x-if>
        <x-if :value="step <= 1">1</x-if>

      <div class="step-label"><locale-text><span lang="cn">选择应用来源</span><span lang="en">Choose Source</span></locale-text></div>

    <div class="step" attr:active="step === 2" attr:done="step > 2">
      <div class="step-circle">
        <x-if :value="step > 2">
          <n-icon icon="mdi:check"></n-icon>
        </x-if>
        <x-if :value="step <= 2">2</x-if>
      </div>
      <div class="step-label"><locale-text><span lang="cn">应用信息</span><span lang="en">App Info</span></locale-text></div>
    </div>
    <div class="step-line" attr:done="step > 2"></div>
    <div class="step" attr:active="step === 3">
      <div class="step-circle">3</div>
      <div class="step-label"><locale-text><span lang="cn">初始化文件</span><span lang="en">Init Files</span></locale-text></div>
    </div>
  </div>

    <!-- Step 1: 选择应用来源 -->
  <o-if :value="step === 1">
    <!-- 应用市场 -->
    <div class="section">
      <div class="section-header">
        <div class="section-title"><locale-text><span lang="cn">应用市场</span><span lang="en">App Market</span></locale-text></div>
      </div>
      <st-button color="primary" variant="outlined" on:click="openMarket">
        <locale-text><span lang="cn">浏览市场</span><span lang="en">Browse Market</span></locale-text>
      </st-button>
      <div class="section-desc"><locale-text><span lang="cn">浏览官方收录的应用，一键安装。</span><span lang="en">Browse officially featured apps and install in one click.</span></locale-text></div>
    </div>

    <!-- 开发应用 -->
    <div class="section">
      <div class="section-header">
        <div class="section-title"><locale-text><span lang="cn">创建或导入应用</span><span lang="en">Create or Import App</span></locale-text></div>
      </div>
      <div class="btn-group">
        <st-button color="primary" variant="outlined" on:click="chooseVirtual">
          <locale-text><span lang="cn">虚拟目录</span><span lang="en">Virtual Dir</span></locale-text>
        </st-button>
        <st-button

          variant="outlined"
          on:click="chooseLocal"

        </st-button>
      </div>
      <div class="section-desc">
        <locale-text>
          <span lang="cn">虚拟目录基于 NoneOS 虚拟文件系统，数据存储在浏览器内；本地目录则挂载你电脑上的真实文件夹。</span>
          <span lang="en">A virtual directory is based on the NoneOS virtual file system and stored in the browser; a local folder mounts a real folder on your computer.</span>
        </locale-text>
      </div>
      <o-if :value="!supportLocalDir">
        <div
          class="section-desc"
          style="color: var(--md-sys-color-error); opacity: 1"
        >
          <locale-text>
            <span lang="cn">当前浏览器不支持 showDirectoryPicker API，无法选择本地目录，建议使用 Chrome 或基于 Chromium 的浏览器。</span>
            <span lang="en">This browser does not support the showDirectoryPicker API, so a local folder cannot be selected. Chrome or a Chromium-based browser is recommended.</span>
          </locale-text>
        </div>
      </o-if>
    </div>

    <!-- 外源下载 -->
    <div class="section">
      <div class="section-header">
        <div class="section-title"><locale-text><span lang="cn">外源下载</span><span lang="en">External Source</span></locale-text></div>
      </div>
      <div
        style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap"
      >
        <div style="flex: 1 0 320px">
          <label class="form-label"><locale-text><span lang="cn">应用包地址</span><span lang="en">App package URL</span></locale-text></label>
          <st-input
            placeholder="https://example.com/app.zip"
            disabled
            style="width: 100%"
          ></st-input>
        </div>
        <st-button variant="outlined" disabled>
          <locale-text><span lang="cn">安装</span><span lang="en">Install</span></locale-text>
        </st-button>
      </div>
      <div style="margin-top: 12px">
        <st-button variant="outlined" disabled>
          <locale-text><span lang="cn">选择安装包</span><span lang="en">Choose Package</span></locale-text>
        </st-button>
      </div>
      <div class="section-desc">
        <locale-text>
          <span lang="cn">通过外部 URL 自动下载安装，或选择本地开发的 ZIP 安装包。</span>
          <span lang="en">Install automatically from an external URL, or choose a locally developed ZIP package.</span>
        </locale-text>
      </div>

  <!-- Step 2: 应用名称与描述 -->
  <o-if :value="step === 2">
    <div class="section">
      <div class="selected-info">
        <o-if :value="source === 'local'">
          <div>
            <locale-text>
              <span lang="cn">已选择本地目录：</span>
              <span lang="en">Selected local folder: </span>
            </locale-text>
            <strong>{{selectedDirName}}</strong>
          </div>
        </o-if>
        <o-if :value="source === 'virtual'">
          <div>
            <locale-text>
              <span lang="cn">已选择：<strong>虚拟目录</strong>（数据将保存在浏览器内）</span>
              <span lang="en">Selected: <strong>virtual directory</strong> (data will be stored in the browser)</span>
            </locale-text>
          </div>
        </o-if>
      </div>

      <div class="form-field">
        <label class="form-label"><locale-text><span lang="cn">应用名称 *</span><span lang="en">App Name *</span></locale-text></label>
        <st-input
          sync:value="appName"
          attr:placeholder="t('namePlaceholder')"
          on:input="onNameInput"
        ></st-input>
        <div class="field-error">{{nameError}}</div>
      </div>

      <div class="form-field">
        <label class="form-label"><locale-text><span lang="cn">应用描述</span><span lang="en">Description</span></locale-text></label>
        <st-textarea
          sync:value="appDesc"
          attr:placeholder="t('descPlaceholder')"
          rows="3"
        ></st-textarea>
      </div>

      <div class="form-field">
        <div class="template-label"><locale-text><span lang="cn">选择模板 *</span><span lang="en">Choose Template *</span></locale-text></div>
        <div class="template-list">
          <o-if :value="templatesLoading">
            <div class="template-loading">
              <n-icon icon="mdi:loading"></n-icon>
              <span><locale-text><span lang="cn">加载模板中...</span><span lang="en">Loading templates...</span></locale-text></span>
            </div>
          </o-if>
          <o-if :value="!templatesLoading">
            <o-fill :value="templates">
              <div
                class="template-card"
                attr:active="$data.id === $host.templateId"
                on:click="$host.selectTemplate($data.id)"
              >
                <div class="template-card-name">{{$data.name}}</div>
                <o-if :value="$data.desc">
                  <div class="template-card-desc">{{$data.desc}}</div>
                </o-if>
              </div>
            </o-fill>
          </o-if>
        </div>
      </div>

      <div class="section-desc">
        <locale-text>
          <span lang="cn">应用名称只能包含字母、数字、下划线（_）和连字符（-），不能包含空格或特殊字符，且不能与已有的应用重复。</span>
          <span lang="en">The app name may only contain letters, digits, underscores (_) and hyphens (-), with no spaces or special characters, and must not duplicate an existing app.</span>
        </locale-text>
      </div>
    </div>

    <div class="footer">
      <st-button variant="text" on:click="backToStep1"><locale-text><span lang="cn">上一步</span><span lang="en">Back</span></locale-text></st-button>
      <st-button
        color="primary"
        on:click="confirmAppInfo"
        attr:loading="submitting"
        attr:disabled="submitting"
      >
        <locale-text><span lang="cn">确认</span><span lang="en">Confirm</span></locale-text>
      </st-button>
    </div>
  </o-if>

  <!-- Step 3: 写入文件 -->
  <o-if :value="step === 3">
    <div class="section">
      <div class="selected-info">
        <div>
          <locale-text><span lang="cn">应用名称：</span><span lang="en">App name: </span></locale-text><strong>{{appName}}</strong>
        </div>
        <o-if :value="appDesc">
          <div style="margin-top: 4px"><locale-text><span lang="cn">描述：</span><span lang="en">Description: </span></locale-text>{{appDesc}}</div>
        </o-if>
        <o-if :value="source === 'local'">
          <div style="margin-top: 4px"><locale-text><span lang="cn">目标目录：</span><span lang="en">Target folder: </span></locale-text>{{selectedDirName}}</div>
        </o-if>
        <o-if :value="source === 'virtual'">
          <div style="margin-top: 4px"><locale-text><span lang="cn">目标：虚拟目录（浏览器内存储）</span><span lang="en">Target: virtual directory (stored in the browser)</span></locale-text></div>
        </o-if>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" :style.width="progress + '%'"></div>
        </div>
        <div class="progress-text">
          <span>{{progressText}}</span>
          <span>{{progress}}%</span>
        </div>

        <div class="file-list">
          <o-fill :value="fileLogs">
            <div class="file-item" attr:status="$data.status">
              <n-icon
                icon="mdi:check-circle"
                x-if="$data.status === 'done'"
              ></n-icon>
              <n-icon
                icon="mdi:progress-clock"
                x-if="$data.status === 'writing'"
              ></n-icon>
              <span>{{$data.path}}</span>
            </div>
          </o-fill>
        </div>
      </div>

      <o-if :value="finished">
        <div class="success-block">
          <n-icon icon="mdi:check-circle"></n-icon>
          <div style="margin-top: 8px; font-size: 14px"><locale-text><span lang="cn">应用创建完成！</span><span lang="en">App created!</span></locale-text></div>
        </div>
      </o-if>
    </div>

    <div class="footer">
      <st-button
        color="primary"
        on:click="closeDialog"
        attr:disabled="!finished"
      >
        <locale-text><span lang="cn">完成</span><span lang="en">Done</span></locale-text>
      </st-button>
    </div>
  </o-if>

  <script>
    import { open, get, init } from "/nos/fs/main.js";
    import { getStorage } from "/nos/storage/main.js";
    import toast from "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js";
    import alert from "/gh/ofajs/senti-ui@latest/packages/dialog/alert.js";
    import confirm from "/gh/ofajs/senti-ui@latest/packages/dialog/confirm.js";
    import { writeTemplateFiles, loadTemplates } from "./template-writer.js";
    import { generateAppId } from "/mz/share-mgr.js";
    import { getLocaleText } from "/nos/locale-text/get-locale-text.js";

    // 属性类文案（placeholder 等）翻译表；模板正文文案用 <locale-text> 组件
    const L10N = {
      namePlaceholder: { cn: "例如：my-app", en: "e.g. my-app" },
      descPlaceholder: { cn: "简单描述你的应用（可选）", en: "Briefly describe your app (optional)" },
    };

    const t = (key) => {
      const item = L10N[key];
      return item ? getLocaleText(item) : key;
    };

    const storage = getStorage("mazmot");

    export default async () => {
      return {
        data: {
          step: 1,
          source: "", // "local" | "virtual"
          supportLocalDir:
            typeof window !== "undefined" &&
            typeof window.showDirectoryPicker === "function",
          _selectedHandle: null, // 用户选择的目录句柄（本地或虚拟，_ 前缀避免响应式代理复杂对象）
          _virtualNamespace: "", // 虚拟目录使用的命名空间
          selectedDirName: "",
          appName: "",
          appDesc: "",
          nameError: "",
          templates: [],
          templatesLoading: true,
          templateId: "base",
          submitting: false,
          progress: 0,
          progressText: getLocaleText({ cn: "准备中...", en: "Preparing..." }),
          fileLogs: [],
          finished: false,
        },
        async ready() {
          await this.loadTemplatesData();
        },
        proto: {
          t(key) {
            return t(key);
          },

          // Step 1: 选择本地目录
          async chooseLocal() {
            try {
              const handle = await open();
              if (!handle) return;

              // 尝试探测目录是否已经是 Mazmot 应用（存在 client/app.json 或根 app.json）
              const existingManifest = await this.probeExistingApp(handle);

              if (existingManifest) {
                // 已经是项目：询问用户「直接导入」还是「作为模板信息填充」
                const displayName =
                  existingManifest.displayName ||
                  existingManifest.name ||
                  handle.name;
                const version = existingManifest.version
                  ? " v" + existingManifest.version
                  : "";
                const wantImport = await confirm({
                  title: getLocaleText({
                    cn: "检测到已有应用",
                    en: "Existing App Detected",
                  }),
                  message: getLocaleText(
                    {
                      cn: "所选目录已经包含 Mazmot 应用配置（{name}{version}）。是否直接导入到应用列表？\n\n选择「取消」将用已有配置填充表单，让你继续新建流程。",
                      en: "The selected folder already contains a Mazmot app config ({name}{version}). Import it into the app list directly?\n\nChoose \"Cancel\" to prefill the form with the existing config and continue creating a new app.",
                    },
                    { name: displayName, version },
                  ),
                  yes: getLocaleText({ cn: "直接导入", en: "Import" }),
                  cancel: getLocaleText({ cn: "取消", en: "Cancel" }),
                });

                if (wantImport) {
                  // 直接导入：走完记录写入，跳过 step2/step3 的模板初始化
                  await this.importExistingLocalApp(handle, existingManifest);
                  return;
                }

                // 用户选择「取消」→ 用已有配置预填 step2 表单
                this._selectedHandle = handle;
                this.selectedDirName =
                  handle.name ||
                  getLocaleText({ cn: "已选择的目录", en: "selected folder" });
                this.source = "local";
                this.appName = existingManifest.name || handle.name || "";
                this.appDesc = existingManifest.description || "";
                this.step = 2;
                return;
              }

              // 常规空/非应用目录：进入 step2 让用户填名称
              this._selectedHandle = handle;
              this.selectedDirName =
                handle.name ||
                getLocaleText({ cn: "已选择的目录", en: "selected folder" });
              this.source = "local";
              this.step = 2;
            } catch (err) {
              console.error(err);
              if (err && err.name !== "AbortError") {
                toast({
                  message: getLocaleText(
                    {
                      cn: "选择目录失败：{msg}",
                      en: "Failed to select folder: {msg}",
                    },
                    { msg: err.message || err },
                  ),
                  color: "error",
                });
              }
            }
          },

          // 探测本地目录是否已经是 Mazmot 应用（读取 app.json）。
          // 优先 client/app.json，回退根目录 app.json。找不到或解析失败 → null。
          async probeExistingApp(handle) {
            if (!handle) return null;
            const tryReadJson = async (dirHandle, fileName) => {
              try {
                const fh = await dirHandle.get(fileName);
                if (!fh || fh.kind !== "file") return null;
                return await fh.json();
              } catch (e) {
                return null;
              }
            };
            try {
              let clientDir = null;
              try {
                clientDir = await handle.get("client");
                if (clientDir && clientDir.kind !== "dir") clientDir = null;
              } catch (e) {
                clientDir = null;
              }
              if (clientDir) {
                const manifest = await tryReadJson(clientDir, "app.json");
                if (manifest) return manifest;
              }
              // 兼容老结构：根目录直接放 app.json
              const rootManifest = await tryReadJson(handle, "app.json");
              return rootManifest || null;
            } catch (err) {
              console.warn("探测本地应用配置失败：", err);
              return null;
            }
          },

          // 「直接导入」：把已有本地应用目录登记到 apps 列表并关闭弹窗
          async importExistingLocalApp(handle, manifest) {
            const rawName = (manifest && manifest.name) || handle.name || "";
            const cleanName = (rawName || "").trim().replace(/\s+/g, "-");
            if (!cleanName || !/^[A-Za-z0-9_-]+$/.test(cleanName)) {
              alert({
                content: getLocaleText(
                  {
                    cn: "应用配置中的名称不符合规则（只能包含字母、数字、下划线、连字符）：{name}",
                    en: "The name in the app config is invalid (only letters, digits, underscores and hyphens allowed): {name}",
                  },
                  { name: rawName },
                ),
              });
              return;
            }
            const apps = (await storage.getItem("apps")) || [];
            if (apps.some((a) => a.name === cleanName)) {
              alert({
                content: getLocaleText(
                  {
                    cn: "已存在同名应用「{name}」，无法重复导入。",
                    en: "An app named \"{name}\" already exists; cannot import again.",
                  },
                  { name: cleanName },
                ),
              });
              return;
            }
            try {
              const appId = await generateAppId(cleanName);
              const handleForStorage = handle._handle || handle;
              apps.push({
                name: cleanName,
                desc: (manifest && manifest.description) || "",
                handle: handleForStorage,
                dirName: handle.name || cleanName,
                source: "local",
                namespace: "",
                appId,
                createdAt: Date.now(),
              });
              await storage.setItem("apps", apps);
              toast({
                message: getLocaleText({ cn: "已导入应用", en: "App imported" }),
                color: "success",
              });
              // 通知外层 home.html 关闭弹窗并刷新列表
              this.emit("close-dialog", { bubbles: true, composed: true });
              this.resetState();
            } catch (err) {
              console.error(err);
              alert({
                content: getLocaleText(
                  { cn: "导入失败：{msg}", en: "Import failed: {msg}" },
                  { msg: err.message || err },
                ),
              });
            }
          },

          // Step 1: 选择虚拟目录（NoneOS 虚拟文件系统）
          async chooseVirtual() {
            // 虚拟目录不需要用户选择物理路径，直接进入下一步；
            // 命名空间/handle 在确认应用名称后再创建（避免中途放弃留下空目录）
            this._selectedHandle = null;
            this._virtualNamespace = "";
            this.selectedDirName = "";
            this.source = "virtual";
            this.step = 2;
          },

          // Step 2: 校验输入
          onNameInput() {
            this.appName = (this.appName || "").replace(/\s/g, "");
            if (this.nameError) {
              this.nameError = "";
            }
          },

          async validateName() {
            const name = (this.appName || "").trim();
            if (!name) {
              this.nameError = getLocaleText({
                cn: "应用名称不能为空",
                en: "App name cannot be empty",
              });
              return false;
            }
            if (/\s/.test(name)) {
              this.nameError = getLocaleText({
                cn: "应用名称不能包含空格",
                en: "App name cannot contain spaces",
              });
              return false;
            }
            if (!/^[A-Za-z0-9_-]+$/.test(name)) {
              this.nameError = getLocaleText({
                cn: "应用名称只能包含字母、数字、下划线和连字符",
                en: "App name may only contain letters, digits, underscores and hyphens",
              });
              return false;
            }
            // 检查重复
            const apps = (await storage.getItem("apps")) || [];
            if (apps.some((app) => app.name === name)) {
              this.nameError = getLocaleText({
                cn: "该应用名称已存在",
                en: "This app name already exists",
              });
              return false;
            }
            return true;
          },

          backToStep1() {
            this.step = 1;
            this.nameError = "";
          },

          openMarket() {
            this.emit("open-market", { bubbles: true, composed: true });
          },

          selectTemplate(id) {
            if (!id) return;
            this.templateId = id;
          },

          async loadTemplatesData() {
            this.templatesLoading = true;
            try {
              const templates = await loadTemplates();
              this.templates = templates;
              this.templateId =
                templates.length > 0 ? templates[0].id : "base";
            } catch (err) {
              console.warn("加载模板列表失败：", err);
            } finally {
              this.templatesLoading = false;
            }
          },

          async confirmAppInfo() {
            if (this.submitting) return;

            const ok = await this.validateName();
            if (!ok) return;

            this.submitting = true;
            try {
              const appName = this.appName.trim();

              // 若为虚拟目录，在共享命名空间 mazmot-apps 下建立应用子目录
              let handleForStorage;
              if (this.source === "virtual") {
                const namespace = "mazmot-apps";
                const rootDir = await init(namespace);
                const vHandle = await rootDir.get(appName, { create: "dir" });
                this._selectedHandle = vHandle;
                this._virtualNamespace = namespace;
                this.selectedDirName = `${namespace}/${appName}`;
                // 虚拟目录无原生 FileSystemHandle，靠 namespace + appName 重建
                handleForStorage = null;
              } else {
                // 本地目录：保存原生句柄以支持序列化存储
                handleForStorage =
                  this._selectedHandle._handle || this._selectedHandle;
              }

              // 保存到应用列表
              const apps = (await storage.getItem("apps")) || [];
              const appId = await generateAppId(appName);
              apps.push({
                name: appName,
                desc: (this.appDesc || "").trim(),
                handle: handleForStorage,
                dirName: this.selectedDirName,
                source: this.source || "local",
                namespace: this._virtualNamespace || "",
                appId,
                createdAt: Date.now(),
              });
              await storage.setItem("apps", apps);

              this.step = 3;
              // 进入 step3 后立即开始写文件
              this.startWriteFiles();
            } catch (err) {
              console.error(err);
              alert({
                content: getLocaleText(
                  { cn: "准备应用失败：{msg}", en: "Failed to prepare app: {msg}" },
                  { msg: err.message || err },
                ),
              });
            } finally {
              this.submitting = false;
            }
          },

          // Step 3: 写入文件
          async startWriteFiles() {
            this.progress = 0;
            this.progressText = getLocaleText({
              cn: "准备写入...",
              en: "Preparing to write...",
            });
            this.fileLogs.length = 0;
            this.finished = false;

            const name = this.appName.trim();
            const desc = (this.appDesc || "").trim();

            try {
              const files = await writeTemplateFiles({
                dirHandle: this._selectedHandle,
                name,
                desc,
                templateId: this.templateId,
                onProgress: ({ index, total, path, status, progress }) => {
                  // 首次遇到该文件时初始化日志
                  if (!this.fileLogs[index]) {
                    this.fileLogs.push({ path, status });
                  } else {
                    this.fileLogs[index].status = status;
                  }
                  this.progress = progress;
                  this.progressText = getLocaleText(
                    status === "writing"
                      ? { cn: "正在写入 {path} ...", en: "Writing {path} ..." }
                      : { cn: "已写入 {path}", en: "Written {path}" },
                    { path },
                  );
                },
              });

              this.progressText = getLocaleText({
                cn: "全部文件写入完成",
                en: "All files written",
              });
              this.finished = true;
              toast({
                message: getLocaleText({
                  cn: "应用创建成功",
                  en: "App created successfully",
                }),
                color: "success",
              });
            } catch (err) {
              console.error(err);
              this.progressText = getLocaleText(
                { cn: "写入失败：{msg}", en: "Write failed: {msg}" },
                { msg: err.message || err },
              );
              alert({
                content: getLocaleText(
                  { cn: "写入文件失败：{msg}", en: "Failed to write files: {msg}" },
                  { msg: err.message || err },
                ),
              });
            }
          },

          closeDialog() {
            // 触发自定义事件，由外层页面 (home.html) 关闭弹窗并刷新列表
            this.emit("close-dialog", { bubbles: true, composed: true });
            this.resetState();
          },

          resetState() {
            this.step = 1;
            this.source = "";
            this._selectedHandle = null;
            this._virtualNamespace = "";
            this.selectedDirName = "";
            this.appName = "";
            this.appDesc = "";
            this.nameError = "";
            this.templateId =
              this.templates.length > 0 ? this.templates[0].id : "base";
            this.submitting = false;
            this.progress = 0;
            this.progressText = getLocaleText({
              cn: "准备中...",
              en: "Preparing...",
            });
            this.fileLogs.length = 0;
            this.finished = false;
          },
        },
      };
    };
  </script>
</template>
