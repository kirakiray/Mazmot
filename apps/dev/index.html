<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mazmot - 开发者工具</title>
    <!-- 引导壳静态文案：本页可能在 Core SW 注册前渲染，不能引 /nos 资源，
         用 navigator.language 简单区分中英文 -->
    <script>
      if (!(navigator.language || "zh").toLowerCase().startsWith("zh")) {
        document.title = "Mazmot - Developer Tools";
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@4.7.1/dist/ofa.mjs#debug"
      type="module"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/libs/router/dist/router.min.mjs"
      type="module"
    ></script>
    <!-- senti-ui 主题引导：首帧注入 --md-sys-color-* M3 颜色体系 -->
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/boot/st-boot.js"></script>
    <style>
      html,
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          Microsoft Yahei,
          Helvetica,
          Arial,
          sans-serif,
          Apple Color Emoji,
          Segoe UI Emoji;
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
      }
    </style>
  </head>

  <body>
    <o-router fix-body>
      <o-app src="./app-config.js"></o-app>
    </o-router>
  </body>
</html>
