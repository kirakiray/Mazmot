<template page>
  <div>t4 ok</div>
  <script>
    export default async () => {
      let err = "";
      let ok = "";
      try {
        const load = lm(import.meta);
        const mod = await load("/nos/storage/main.js");
        ok = "keys:" + Object.keys(mod).join(",");
        const store = mod.getStorage("hello-world");
        const v = await store.getItem("visits");
        ok += " visits:" + String(v);
      } catch (e) {
        err = String((e && e.stack) || e);
      }
      window.__t4 = { ok, err };
      return { data: { msg: ok + " | " + err.slice(0, 200) } };
    };
  </script>
</template>
