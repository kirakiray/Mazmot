<template page>
  <style>
    :host { display: block; }
    .card { padding: 20px; }
  </style>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <div class="card">
    <div class="hello">{{greeting}}</div>
    <st-button color="primary" on:click="addHello">点我</st-button>
  </div>
  <script>
    export default async () => {
      return {
        data: { name: "", count: 0 },
        get greeting() {
          return this.name ? "Hello, " + this.name : "Hello, World!";
        },
        proto: { addHello() { this.count += 1; } },
      };
    };
  </script>
</template>
