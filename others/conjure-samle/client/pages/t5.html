<template page>
  <div>t5 {{msg}}</div>
  <script>
    export default async () => {
      let msg = "";
      try {
        const load = lm({ url: location.origin + "/" });
        const mod = await load("/nos/storage/main.js");
        const store = mod.getStorage("hello-world");
        const v = await store.getItem("visits");
        msg = "keys:" + Object.keys(mod).join(",") + " visits:" + String(v);
      } catch (e) {
        msg = "ERR " + String((e && e.message) || e);
      }
      return { data: { msg } };
    };
  </script>
</template>
