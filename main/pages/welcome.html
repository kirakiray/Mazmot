          uiReady: false,
          keyReady: plan.hasUsableKey(existingKeys),
          // 吉祥物形态：进场无灵魂，确认 AI Key 后苏醒为默认态（跳过则保持无灵魂）
          mascotState: "soulless",
          provider: "deepseek",
          keyInput: "",
          showPassword: false,
          keySaving: false,
          choice: "",
          purposeOptions: [],
          pickedApps: [],
          finishing: false,
        },

        ready() {
          // 已完成过引导：直接进入应用列表页
          if (welcomeDone) {
            this.replace("./apps.html");
            return;
          }
          this.flowReady = true;
          this.enterUnit(0);
        },

        detached() {
          clearTimeout(this._typeTimer);
        },

        proto: {
          t(key) {
            return t(key);
          },

          _sleep(ms) {
            return new Promise((r) => setTimeout(r, ms));
          },

          _nextFrame() {
            return new Promise((r) => requestAnimationFrame(() => r()));
          },

          // 点击屏幕：打字中 → 立即补全；对话单元完成 → 淡出并进入下一个
          handleScreenClick() {
            if (!this.flowReady || this.transitioning || this.finishing) return;
            if (this.typing) {
              this.finishTyping();
              return;
            }
            const unit = UNITS[this.unitIndex];
            if (unit && unit.type === "dialog" && this.clickReady) {
              this.enterUnit(this.unitIndex + 1);
            }
          },

          // 切换单元：旧气泡淡出 → 换文案 → 新气泡入场 → 打字机
          async enterUnit(index) {
            const unit = UNITS[index];
            if (!unit) return;
            this.transitioning = true;
            this.unitIndex = index;
            this.unitId = unit.id;
            // 走到 Key 步骤时已确认有可用 Key：吉祥物苏醒
            if (unit.id === "key" && this.keyReady) {
              this.mascotState = "";
            }
            this.showHint = false;
            this.uiReady = false;
            this.clickReady = false;
            clearTimeout(this._typeTimer);
            this.typing = false;
            if (this.currentMsg) {
              this.msgLeaving = true;
              this.msgEntered = false;
              await this._sleep(210);
            }
            this.msgLeaving = false;
            this.msgEntered = false;
            this.currentMsg = this._unitMsgText(unit);
            await this._nextFrame();
            this.msgEntered = true;
            this.transitioning = false;
            this._typeCurrent();
          },

          _unitMsgText(unit) {
            if (unit.id === "key") return t(this.keyReady ? "keyFound" : "keyNeed");
            if (unit.id === "purpose") return t(this._purposeMsgKey || "purposeAsk");
            return t(unit.msgKey);
          },

          _typeCurrent() {
            const full = this.currentMsg;
            this._fullMsg = full;
            if (!full) {
              this._onMsgDone();
              return;
            }
            this.typing = true;
            let len = 0;
            const tick = () => {
              if (!this.typing) return; // 已被单元切换打断
              len = Math.min(full.length, len + 2);
              this.currentMsg = full.slice(0, len);
              if (len >= full.length) {
                this.typing = false;
                this._onMsgDone();
                return;
              }
              this._typeTimer = setTimeout(tick, 24);
            };
            tick();
          },

          finishTyping() {
            if (!this.typing) return;
            clearTimeout(this._typeTimer);
            this.currentMsg = this._fullMsg;
            this.typing = false;
            this._onMsgDone();
          },

          _onMsgDone() {
            const unit = UNITS[this.unitIndex];
            if (!unit) return;
            if (unit.type === "dialog") {
              this.clickReady = true;
              this.showHint = true;
              return;
            }
            // 交互单元：文案说完后展示操作 UI
            this.uiReady = true;
            if (unit.id === "purpose") this.buildPurposeOptions();
            if (unit.id === "apps") this.buildPickedApps();
          },

          // ===== AI Key 步骤 =====

          togglePassword() {
            this.showPassword = !this.showPassword;
          },

          advanceAfterKey() {
            this._purposeMsgKey = "purposeAsk";
            this.enterUnit(UNIT_INDEX.purpose);
          },

          async skipKey() {
            if (this.keySaving) return;
            this.keyReady = false;
            this._purposeMsgKey = "keySkipped";
            this.enterUnit(UNIT_INDEX.purpose);
          },

          async saveKeyFlow() {
            const key = this.keyInput.trim();
            if (!key || this.keySaving) return;
            this.keySaving = true;
            try {
              const { valid, message } = await ai.testApiKey(
                key,
                this.provider,
              );
              if (!valid) {
                toast({ message, color: "error" });
                return;
              }
              // relay 邀请码：拉取服务器命名随 key 持久化（失败不阻塞保存）
              let extra = {};
              if (this.provider === "relay") {
                const invite = decodeInvite(key);
                if (invite) {
                  try {
                    const info = await fetchServerInfo(invite.baseUrl);
                    extra = { serverName: info.name };
                  } catch (e) {
                    // 无命名信息也允许保存
                  }
                }
              }
              ai.saveKey(key, this.provider, extra);
              this.keyInput = "";
              this.keyReady = true;
              this.mascotState = ""; // Key 填充确认，吉祥物苏醒
              toast({ message: t("keySavedToast"), color: "success" });
              this._purposeMsgKey = "keySaved";
              this.enterUnit(UNIT_INDEX.purpose);
            } catch (err) {
              console.error("保存 AI Key 失败：", err);
              toast({
                message: getLocaleText(
                  { cn: "保存失败：{msg}", en: "Save failed: {msg}" },
                  { msg: err.message || err },
                ),
                color: "error",
              });
            } finally {
              this.keySaving = false;
            }
          },

          // ===== 用途选择步骤 =====

          buildPurposeOptions() {
            this.purposeOptions = [
              {
                id: "ready-apps",
                num: 1,
                title: t("purpose1Title"),
                desc: t("purpose1Desc"),
                disabled: !plan.isPurposeEnabled("ready-apps", this.keyReady),
                disabledReason: "",
              },
              {
                id: "ai-dev",
                num: 2,
                title: t("purpose2Title"),
                desc: t("purpose2Desc"),
                disabled: !plan.isPurposeEnabled("ai-dev", this.keyReady),
                disabledReason: this.keyReady ? "" : t("noKeyReason"),
              },
              {
                id: "social",
                num: 3,
                title: t("purpose3Title"),
                desc: t("purpose3Desc"),
                disabled: true,
                disabledReason: t("comingSoon"),
              },
            ];
          },

          pickPurpose(id) {
            if (!plan.isPurposeEnabled(id, this.keyReady)) return;
            this.choice = id;
            // 从应用步骤「上一步」回来时重新发问
            this._purposeMsgKey = "purposeAsk";
            this.enterUnit(UNIT_INDEX.apps);
          },

          backToKey() {
            this.enterUnit(UNIT_INDEX.key);
          },

          backToPurpose() {
            this.enterUnit(UNIT_INDEX.purpose);
          },

          // ===== 应用方块步骤 =====

          async buildPickedApps() {
            const ids = plan.getAppIdsForPurpose(this.choice);
            const apps = (await storage.getItem("apps")) || [];
            const metas = await Promise.all(
              ids.map((id) => loadOfficialAppMeta(id).catch(() => null)),
            );
            this.pickedApps = ids.map((id, i) => {
              const meta = metas[i];
              return {
                id,
                icon: (meta && meta.icon) || "📦",
                name: (meta && meta.name) || id,
                desc: (meta && meta.desc) || "",
                installed: apps.some(
                  (a) => a.name === id || a.officialId === id,
                ),
              };
            });
          },

          async finish() {
            if (this.finishing) return;
            this.finishing = true;
            try {
              const ids = plan
                .getAppIdsForPurpose(this.choice)
                .filter((id) => {
                  const picked = this.pickedApps.find((a) => a.id === id);
                  return !picked || !picked.installed;
                });
              await storage.setItem("welcome-done", {
                purpose: this.choice,
                keyReady: this.keyReady,
                at: Date.now(),
              });
              await enqueueOfficialInstalls(ids);
              this.replace("./apps.html");
            } catch (err) {
              console.error("完成引导失败：", err);
              toast({ message: t("finishErrorToast"), color: "error" });
              this.finishing = false;
            }
          },
        },
      };
    };
  </script>
</template>
