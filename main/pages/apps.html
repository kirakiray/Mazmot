<template page>
  <style>
    :host {
      display: block;
      height: 100%;
    }
    .shell {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ===== 顶部品牌 ===== */
    .brand-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 16px 10px;
      user-select: none;
    }
    .brand-bar m-mascot {
      --mascot-size: 38px;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--md-sys-color-on-surface);
    }

    /* ===== 顶部横向导航（senti-ui st-nav-bar） ===== */
    .main-nav {
      flex-shrink: 0;
      align-self: center;
      width: fit-content;
      max-width: calc(100% - 32px);
      margin-bottom: 4px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 999px;
      background-color: var(--md-sys-color-surface-container-high);
      overflow: hidden;
      box-sizing: border-box;
    }

    .container {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }
    .panel.active {
      display: flex;
    }
    .panel > o-page {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    @media (max-width: 560px) {
      .brand-bar {
        padding-top: 14px;
      }
      .main-nav {
        width: calc(100% - 32px);
      }
    }
  </style>

  <!-- 三个功能区各自是独立页面模块：切换 tab 只做 CSS 显隐，
       三个 o-page 常驻以保留应用列表状态与对话记录 -->
  <div class="shell">
    <div class="brand-bar">
      <m-mascot aria-hidden="true"></m-mascot>
      <span class="brand-name">Mazmot</span>
    </div>

    <st-nav-bar class="main-nav">
      <st-nav-item
        parallel
        attr:active="activeTab === 'plan'"
        on:click="switchMainTab('plan')"
      >
        <n-icon slot="icon" icon="mdi:calendar-blank-outline"></n-icon>
        <locale-text><span lang="cn">计划</span><span lang="en">Plan</span></locale-text>
      </st-nav-item>
      <st-nav-item
        parallel
        attr:active="activeTab === 'chat'"
        on:click="switchMainTab('chat')"
      >
        <n-icon slot="icon" icon="mdi:chat-processing-outline"></n-icon>
        <locale-text><span lang="cn">对话</span><span lang="en">Chat</span></locale-text>
      </st-nav-item>
      <st-nav-item
        parallel
        attr:active="activeTab === 'apps'"
        on:click="switchMainTab('apps')"
      >
        <n-icon slot="icon" icon="mdi:apps"></n-icon>
        <locale-text><span lang="cn">应用</span><span lang="en">Apps</span></locale-text>
      </st-nav-item>
    </st-nav-bar>

    <div class="container">
      <div class="panel" class:active="activeTab === 'plan'">
        <o-page data-page="plan" src="./plan.html"></o-page>
      </div>
      <div class="panel" class:active="activeTab === 'chat'">
        <o-page data-page="chat" src="./chat.html"></o-page>
      </div>
      <div class="panel" class:active="activeTab === 'apps'">
        <o-page data-page="apps" src="./apps-list.html"></o-page>
      </div>
    </div>
  </div>

  <script>
    export default async ({ load }) => {
      await Promise.all([
        // 组件依赖（替代静态 <l-m>）
        load("/gh/ofajs/senti-ui@main/packages/navigation/nav-bar.html"),
        load("/mz/comps/mascot/mascot.html"),
        load("/nos/n-icon/n-icon.html"),
        load("/nos/locale-text/locale-text.html"),
      ]);

      return {
        data: {
          // 默认停在原应用列表，保持引导完成后的落点不变
          activeTab: "apps",
        },

        attached() {
          // 对话页请求配置 Key：先切到应用 tab，apps-list 自己会打开
          // 密钥管理器或应用市场
          this._onOpenKeyManager = () => {
            this.activeTab = "apps";
          };
          window.addEventListener(
            "mazmot:open-ai-key-manager",
            this._onOpenKeyManager,
          );
          // 应用列表页的「重跑引导」按钮（临时）交给真正持有路由的 shell 处理
          this._onReplayWelcome = () => this.replace("./welcome.html");
          window.addEventListener(
            "mazmot:replay-welcome",
            this._onReplayWelcome,
          );
        },

        detached() {
          window.removeEventListener(
            "mazmot:open-ai-key-manager",
            this._onOpenKeyManager,
          );
          window.removeEventListener(
            "mazmot:replay-welcome",
            this._onReplayWelcome,
          );
          this._onOpenKeyManager = null;
          this._onReplayWelcome = null;
        },

        proto: {
          switchMainTab(tab) {
            if (tab === this.activeTab) return;
            this.activeTab = tab;
            // 广播给子页面（聊天页在激活时刷新 Key 状态）
            window.dispatchEvent(
              new CustomEvent("mazmot:tab-changed", { detail: { tab } }),
            );
          },
        },
      };
    };
  </script>
</template>
