<template page>
  <style>
    :host {
      display: block;
      height: 100%;
    }
    /* 对话区域不再铺满整页：居中、略偏下，高度约为视口一半 */
    .chat-page {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 底部多留一点，让面板整体略高于正中，输入框落在中间偏下 */
      padding: 16px 16px 10vh;
      box-sizing: border-box;
    }
    .chat-panel {
      width: 100%;
      max-width: 760px;
      height: 46vh;
      min-height: 340px;
      max-height: 480px;
      display: flex;
      flex-direction: column;

    /* 开始对话后铺满可用高度，消息区才有真正的完整滚动范围 */

      padding: 8px 16px 16px;

    .chat-page.has-messages .chat-panel {
      height: 100%;
      min-height: 0;

    }
    .chat-toolbar {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      padding: 0 16px;
    }
    .chat-panel st-chat {
      flex: 1;
      min-height: 0;
      --st-chat-bg: transparent;
      --st-chat-border: transparent;
      --st-chat-radius: 0;
      --st-chat-shadow: none;
      --st-chat-backdrop-filter: none;
      --st-chat-padding: 8px 16px 4px;
      --st-chat-gap: 0.75em;
      --st-chat-header-padding: 0;
      --st-chat-footer-padding: 0;
      --st-chat-divider: transparent;
      --st-chat-empty-padding: 0;
      --st-chat-bubble-max-width: 82%;
    }
    .chat-footer {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .chat-empty {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: 560px;
      padding: 8px;

    .chat-empty m-mascot {
      --mascot-size: 64px;

    .chat-empty-title {
      margin: 0;
      font-size: 22px;

    .chat-empty-desc {
      margin: 0;

      color: var(--md-sys-color-on-surface-variant);
    }
    .chat-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;

    .chat-suggestions st-chip {
      font-size: 12px;

    .chat-key-hint {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 16px 8px;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12px;
      line-height: 1.5;
    }
    .chat-key-hint n-icon {
      flex-shrink: 0;
      font-size: 16px;
      color: var(--md-sys-color-primary);
    }
    .chat-key-hint button {
      margin-left: auto;
      flex-shrink: 0;
      padding: 0;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }
    .chat-composer {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 16px 16px;
      box-sizing: border-box;
    }
    .chat-composer st-textarea {
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 560px) {
      .chat-composer {
        padding-left: 16px;
        padding-right: 16px;
      }
      .chat-key-hint {
        margin-left: 16px;
        margin-right: 16px;
      }
    }
  </style>

  <div class="chat-page" class:has-messages="chatMessages.length > 0">
    <div class="chat-panel">
    <st-chat
      class="chat"
      attr:label="t('chatLogLabel')"
      auto-scroll="auto"
    >
      <div slot="header" class="chat-toolbar">
        <o-if :value="chatMessages.length > 0 && !chatStreaming">
          <st-button variant="text" style="font-size: 12px" on:click="clearChat">
            <n-icon icon="mdi:plus" slot="prefix"></n-icon>
            <locale-text><span lang="cn">新对话</span><span lang="en">New chat</span></locale-text>
          </st-button>
        </o-if>
      </div>

      <div slot="empty" class="chat-empty">
        <m-mascot aria-hidden="true"></m-mascot>
        <h3 class="chat-empty-title">
          <locale-text><span lang="cn">今天想做什么？</span><span lang="en">What would you like to do?</span></locale-text>
        </h3>
        <p class="chat-empty-desc">
          <locale-text><span lang="cn">告诉我你的目标，我可以帮你拆成计划、理清思路，或者推荐合适的应用。</span><span lang="en">Tell me your goal — I can turn it into a plan, help you think it through, or suggest a fitting app.</span></locale-text>
        </p>
        <div class="chat-suggestions">
          <st-chip on:click="sendSuggestion('chatSuggest1')">{{t('chatSuggest1')}}</st-chip>
          <st-chip on:click="sendSuggestion('chatSuggest2')">{{t('chatSuggest2')}}</st-chip>
          <st-chip on:click="sendSuggestion('chatSuggest3')">{{t('chatSuggest3')}}</st-chip>
        </div>
      </div>

      <o-fill :value="chatMessages" fill-key="id">
        <st-chat-message
          attr:from="$data.role"
          attr:streaming="$data.streaming ? '' : null"
          attr:error="$data.error ? '' : null"
        >{{$data.content}}</st-chat-message>
      </o-fill>

      <div slot="footer" class="chat-footer">
        <o-if :value="chatKeyReady === false">
          <div class="chat-key-hint">
            <n-icon icon="mdi:key-alert-outline"></n-icon>
            <span>
              <locale-text><span lang="cn">还没有可用的 AI Key，先在「AI 密钥管理器」里配置一个吧。</span><span lang="en">No usable AI Key yet. Configure one in the AI Key Manager first.</span></locale-text>
            </span>
            <button type="button" on:click="requestKeyManager">{{t('chatOpenKeyManager')}}</button>
          </div>
        </o-if>

        <div class="chat-composer">
          <st-textarea
            autosize
            rows="1"
            sync:value="chatInput"
            attr:placeholder="t('chatPlaceholder')"
            on:keydown="handleChatKeydown"
          ></st-textarea>
          <o-if :value="!chatStreaming">
            <st-icon-button
              variant="filled"
              style="font-size: 16px; flex-shrink: 0"
              attr:disabled="!chatInput.trim()"
              on:click="sendChatMessage()"
              attr:title="t('chatSendTitle')"
            >
              <n-icon icon="mdi:arrow-up"></n-icon>
            </st-icon-button>
          </o-if>
          <o-if :value="chatStreaming">
            <st-icon-button
              variant="tonal"
              color="error"
              style="font-size: 16px; flex-shrink: 0"
              on:click="stopChat"
              attr:title="t('chatStopTitle')"
            >
              <n-icon icon="mdi:stop"></n-icon>
            </st-icon-button>
          </o-if>
        </div>
      </div>
    </st-chat>
    </div>
  </div>

  <script>
    export default async ({ load }) => {
      const [{ getLocaleText, ensureLocaleTextJson }] = await Promise.all([
        load("/nos/locale-text/get-locale-text.js"),
        // 组件依赖（替代静态 <l-m>）
        load("/gh/ofajs/senti-ui@main/packages/button/button.html"),
        load("/gh/ofajs/senti-ui@main/packages/button/icon-button.html"),
        load("/gh/ofajs/senti-ui@main/packages/textarea/textarea.html"),
        load("/gh/ofajs/senti-ui@main/packages/chip/chip.html"),
        load("/gh/ofajs/senti-ui@main/packages/chat/chat.html"),
        load("/mz/comps/mascot/mascot.html"),
        load("/nos/n-icon/n-icon.html"),
        load("/nos/locale-text/locale-text.html"),
      ]);

      await ensureLocaleTextJson();

      const L10N = {
        chatPlaceholder: getLocaleText({ cn: "给 Mazmot 发消息…", en: "Message Mazmot…" }),
        chatSendTitle: getLocaleText({ cn: "发送", en: "Send" }),
        chatStopTitle: getLocaleText({ cn: "停止生成", en: "Stop generating" }),
        chatOpenKeyManager: getLocaleText({ cn: "去配置", en: "Configure" }),
        chatSuggest1: getLocaleText({ cn: "帮我制定一个三天计划", en: "Plan the next three days for me" }),
        chatSuggest2: getLocaleText({ cn: "帮我把目标拆成步骤", en: "Break my goal into steps" }),
        chatSuggest3: getLocaleText({ cn: "推荐一个能管理计划的应用", en: "Suggest an app for managing plans" }),
        chatLogLabel: getLocaleText({ cn: "Mazmot 对话内容", en: "Mazmot chat" }),
        chatNoKey: getLocaleText({
          cn: "还没有可用的 AI Key。请先在「AI 密钥管理器」中配置后再试。",
          en: "No usable AI Key yet. Configure one in the AI Key Manager and try again.",
        }),
        chatNoReply: getLocaleText({
          cn: "模型没有返回内容，请重试。",
          en: "The model returned no content. Please try again.",
        }),
      };
      const t = (key) => (L10N[key] === undefined ? key : L10N[key]);

      return {
        data: {
          // 对话内容只保留在当前页面会话中，不落盘
          chatMessages: [],
          chatInput: "",
          chatStreaming: false,
          chatKeyReady: null,
        },

        attached() {
          // 主界面切换 tab 时由 shell 广播，只刷新 Key 状态；滚动交给 st-chat
          this._onTabChange = (event) => {
            if (event?.detail?.tab !== "chat") return;
            this.refreshChatKeyState();
          };
          window.addEventListener("mazmot:tab-changed", this._onTabChange);
        },

        detached() {
          window.removeEventListener("mazmot:tab-changed", this._onTabChange);
          this._onTabChange = null;
          if (this._chatController) {
            this._chatController.abort();
            this._chatController = null;
          }
        },

        proto: {
          t(key) {
            return t(key);
          },

          async _ensureAiModules() {
            if (!this._aiModules) {
              this._aiModules = await load("/mz/ai/main.js");
            }
            return this._aiModules;
          },

          async refreshChatKeyState() {
            try {
              const ai = await this._ensureAiModules();
              this.chatKeyReady = ai
                .getApiKeys()
                .some((key) => !key.disabled);
            } catch (err) {
              console.warn("[chat] 读取 AI Key 失败：", err);
              this.chatKeyReady = false;
            }
          },

          _appendMessage(message) {
            this._chatSeq = (this._chatSeq || 0) + 1;
            const item = {
              id: `m${this._chatSeq}`,
              role: "assistant",
              content: "",
              error: false,
              streaming: false,
              ...message,
            };
            this.chatMessages = [...this.chatMessages, item];
            return item.id;
          },

          // 流式更新只替换数组中的同一条（id 不变），st-chat 会复用节点并自动跟随
          _updateMessage(id, patch) {
            this.chatMessages = this.chatMessages.map((message) =>
              message.id === id ? { ...message, ...patch } : message,
            );
          },

          _getMessage(id) {
            return this.chatMessages.find((message) => message.id === id);
          },

          _removeMessage(id) {
            this.chatMessages = this.chatMessages.filter(
              (message) => message.id !== id,
            );
          },

          async sendChatMessage(text) {
            if (this.chatStreaming) return;
            const content = (
              typeof text === "string" ? text : this.chatInput
            ).trim();
            if (!content) return;
            this.chatInput = "";
            this._appendMessage({ role: "user", content });

            let ai;
            try {
              ai = await this._ensureAiModules();
            } catch (err) {
              console.warn("[chat] 加载 AI 模块失败：", err);
              this._appendMessage({
                role: "assistant",
                content: t("chatNoKey"),
                error: true,
              });
              return;
            }

            const hasKey = ai.getApiKeys().some((key) => !key.disabled);
            this.chatKeyReady = hasKey;
            if (!hasKey) {
              this._appendMessage({
                role: "assistant",
                content: t("chatNoKey"),
                error: true,
              });
              return;
            }

            let assistant;
            try {
              assistant = ai.getAssistant();
            } catch (err) {
              this.chatKeyReady = false;
              this._appendMessage({
                role: "assistant",
                content: t("chatNoKey"),
                error: true,
              });
              return;
            }

            // 排除流式占位与错误消息；只保留最近 20 条上下文
            const history = this.chatMessages
              .filter((message) => !message.error && !message.streaming)
              .slice(-20)
              .map((message) => ({
                role: message.role,
                content: message.content,
              }));

            const placeholderId = this._appendMessage({
              role: "assistant",
              content: "",
              streaming: true,
            });
            this._streamingId = placeholderId;

            const controller = new AbortController();
            this._chatController = controller;
            this.chatStreaming = true;

            try {
              let streamed = "";
              const res = await assistant.chat({
                messages: history,
                stream: true,
                signal: controller.signal,
                onStream: (data) => {
                  if (!data) return;
                  if (typeof data.content === "string" && data.content) {
                    streamed = data.content;
                  } else if (typeof data.delta === "string" && data.delta) {
                    streamed += data.delta;
                  }
                  this._updateMessage(placeholderId, {
                    content: streamed,
                    streaming: true,
                  });
                },
              });
              const finalText = (res && res.content) || streamed;
              if (finalText.trim()) {
                this._updateMessage(placeholderId, {
                  content: finalText,
                  streaming: false,
                  error: false,
                });
              } else {
                this._updateMessage(placeholderId, {
                  content: t("chatNoReply"),
                  streaming: false,
                  error: true,
                });
              }
            } catch (err) {
              if (err && err.name === "AbortError") {
                const current = this._getMessage(placeholderId);
                if (current && current.content.trim()) {
                  this._updateMessage(placeholderId, { streaming: false });
                } else {
                  this._removeMessage(placeholderId);
                }
              } else {
                console.error("[chat] 对话失败：", err);
                this._updateMessage(placeholderId, {
                  content: getLocaleText(
                    { cn: "对话失败：{msg}", en: "Chat failed: {msg}" },
                    { msg: (err && err.message) || String(err) },
                  ),
                  streaming: false,
                  error: true,
                });
              }
            } finally {
              if (this._chatController === controller) {
                this._chatController = null;
              }
              this._streamingId = null;
              this.chatStreaming = false;
            }
          },

          stopChat() {
            if (this._chatController) this._chatController.abort();
          },

          clearChat() {
            if (this.chatStreaming) return;
            this.chatMessages = [];
            this.chatInput = "";
          },

          handleChatKeydown(event) {
            if (
              !event ||
              event.key !== "Enter" ||
              event.shiftKey ||
              event.isComposing
            ) {
              return;
            }
            event.preventDefault();
            this.sendChatMessage();
          },

          sendSuggestion(key) {
            this.sendChatMessage(t(key));
          },

          // 交给主界面 shell 切到「应用」并打开密钥管理器（或市场）
          requestKeyManager() {
            window.dispatchEvent(
              new CustomEvent("mazmot:open-ai-key-manager"),
            );
          },
        },
      };
    };
  </script>
</template>
