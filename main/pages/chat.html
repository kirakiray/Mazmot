<template page>
  <style>
    :host {
      display: block;
      height: 100%;
    }
    .chat-panel {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .chat-toolbar {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      padding: 0 16px;
    }
    .chat-thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 20px 8px;
      box-sizing: border-box;
    }
    /* 消息少时把内容压到底部；消息多时自动收缩为 0，保证可从顶部正常滚动 */
    .chat-spacer {
      flex: 1 1 0;
      min-height: 0;
    }
    .chat-empty {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 440px;
      padding: 24px 8px 48px;
      text-align: center;
    }
    .chat-empty m-mascot {
      --mascot-size: 78px;
      margin-bottom: 4px;
    }
    .chat-empty-title {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .chat-empty-desc {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface-variant);
    }
    .chat-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .chat-suggestions st-chip {
      font-size: 12px;
    }
    .msg-row {
      flex-shrink: 0;
      display: flex;
      width: 100%;
    }
    .msg-row[data-role="user"] {
      justify-content: flex-end;
    }
    .msg-bubble {
      max-width: min(78%, 560px);
      padding: 10px 14px;
      border-radius: 16px;
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      box-sizing: border-box;
    }
    .msg-row[data-role="user"] .msg-bubble {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-bottom-right-radius: 6px;
    }
    .msg-row[data-role="assistant"] .msg-bubble {
      border-bottom-left-radius: 6px;
    }
    .msg-bubble[data-error] {
      color: var(--md-sys-color-error);
      background-color: var(--md-sys-color-error-container);
    }
    .chat-typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }
    .chat-typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
      opacity: 0.3;
      animation: chat-blink 1.2s infinite ease-in-out;
    }
    .chat-typing span:nth-child(2) {
      animation-delay: 0.15s;
    }
    .chat-typing span:nth-child(3) {
      animation-delay: 0.3s;
    }
    @keyframes chat-blink {
      0%,
      80%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }
    .chat-key-hint {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 20px 8px;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      font-size: 12px;
      line-height: 1.5;
    }
    .chat-key-hint n-icon {
      flex-shrink: 0;
      font-size: 16px;
    }
    .chat-key-hint button {
      margin-left: auto;
      flex-shrink: 0;
      padding: 0;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }
    .chat-composer {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 20px 18px;
      box-sizing: border-box;
    }
    .chat-composer st-textarea {
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 560px) {
      .chat-thread,
      .chat-composer {
        padding-left: 16px;
        padding-right: 16px;
      }
      .chat-key-hint {
        margin-left: 16px;
        margin-right: 16px;
      }
    }
  </style>

  <div class="chat-panel">
    <o-if :value="chatMessages.length > 0 && !chatStreaming">
      <div class="chat-toolbar">
        <st-button variant="text" style="font-size: 12px" on:click="clearChat">
          <n-icon icon="mdi:plus" slot="prefix"></n-icon>
          <locale-text><span lang="cn">新对话</span><span lang="en">New chat</span></locale-text>
        </st-button>
      </div>
    </o-if>

    <div class="chat-thread">
      <o-if :value="chatMessages.length > 0">
        <div class="chat-spacer"></div>
      </o-if>
      <o-if :value="chatMessages.length === 0">
        <div class="chat-empty">
          <m-mascot aria-hidden="true"></m-mascot>
          <h3 class="chat-empty-title">
            <locale-text><span lang="cn">你好，我是 Mazmot</span><span lang="en">Hi, I'm Mazmot</span></locale-text>
          </h3>
          <p class="chat-empty-desc">
            <locale-text><span lang="cn">有什么可以帮你？可以聊聊你正在做的事，或者让我帮你理清思路。</span><span lang="en">How can I help? Talk about what you're working on, or let me help you think it through.</span></locale-text>
          </p>
          <div class="chat-suggestions">
            <st-chip on:click="sendSuggestion('chatSuggest1')">{{t('chatSuggest1')}}</st-chip>
            <st-chip on:click="sendSuggestion('chatSuggest2')">{{t('chatSuggest2')}}</st-chip>
            <st-chip on:click="sendSuggestion('chatSuggest3')">{{t('chatSuggest3')}}</st-chip>
          </div>
        </div>
      </o-if>
      <o-fill :value="chatMessages" fill-key="id">
        <div class="msg-row" attr:data-role="$data.role">
          <div class="msg-bubble" attr:data-error="$data.error">{{$data.content}}</div>
        </div>
      </o-fill>
      <o-if :value="chatStreaming">
        <div class="msg-row" data-role="assistant">
          <div class="msg-bubble">
            <o-if :value="chatLiveText">{{chatLiveText}}</o-if>
            <o-if :value="!chatLiveText">
              <span class="chat-typing"><span></span><span></span><span></span></span>
            </o-if>
          </div>
        </div>
      </o-if>
    </div>

    <o-if :value="chatKeyReady === false">
      <div class="chat-key-hint">
        <n-icon icon="mdi:key-alert-outline"></n-icon>
        <span>
          <locale-text><span lang="cn">还没有可用的 AI Key，先在「AI 密钥管理器」里配置一个吧。</span><span lang="en">No usable AI Key yet. Configure one in the AI Key Manager first.</span></locale-text>
        </span>
        <button type="button" on:click="requestKeyManager">{{t('chatOpenKeyManager')}}</button>
      </div>
    </o-if>

    <div class="chat-composer">
      <st-textarea
        autosize
        rows="1"
        sync:value="chatInput"
        attr:placeholder="t('chatPlaceholder')"
        on:keydown="handleChatKeydown"
      ></st-textarea>
      <o-if :value="!chatStreaming">
        <st-icon-button
          variant="filled"
          style="font-size: 16px; flex-shrink: 0"
          attr:disabled="!chatInput.trim()"
          on:click="sendChatMessage()"
          attr:title="t('chatSendTitle')"
        >
          <n-icon icon="mdi:arrow-up"></n-icon>
        </st-icon-button>
      </o-if>
      <o-if :value="chatStreaming">
        <st-icon-button
          variant="tonal"
          color="error"
          style="font-size: 16px; flex-shrink: 0"
          on:click="stopChat"
          attr:title="t('chatStopTitle')"
        >
          <n-icon icon="mdi:stop"></n-icon>
        </st-icon-button>
      </o-if>
    </div>
  </div>

  <script>
    export default async ({ load }) => {
      const [{ getLocaleText, ensureLocaleTextJson }] = await Promise.all([
        load("/nos/locale-text/get-locale-text.js"),
        // 组件依赖（替代静态 <l-m>）
        load("/gh/ofajs/senti-ui@main/packages/button/button.html"),
        load("/gh/ofajs/senti-ui@main/packages/button/icon-button.html"),
        load("/gh/ofajs/senti-ui@main/packages/textarea/textarea.html"),
        load("/gh/ofajs/senti-ui@main/packages/chip/chip.html"),
        load("/mz/comps/mascot/mascot.html"),
        load("/nos/n-icon/n-icon.html"),
        load("/nos/locale-text/locale-text.html"),
      ]);

      await ensureLocaleTextJson();

      const L10N = {
        chatPlaceholder: getLocaleText({ cn: "给 Mazmot 发消息…", en: "Message Mazmot…" }),
        chatSendTitle: getLocaleText({ cn: "发送", en: "Send" }),
        chatStopTitle: getLocaleText({ cn: "停止生成", en: "Stop generating" }),
        chatOpenKeyManager: getLocaleText({ cn: "去配置", en: "Configure" }),
        chatSuggest1: getLocaleText({ cn: "帮我做个今日计划", en: "Help me plan my day" }),
        chatSuggest2: getLocaleText({ cn: "Mazmot 都能做什么？", en: "What can Mazmot do?" }),
        chatSuggest3: getLocaleText({ cn: "帮我想一个应用创意", en: "Give me an app idea" }),
        chatNoKey: getLocaleText({
          cn: "还没有可用的 AI Key。请先在「AI 密钥管理器」中配置后再试。",
          en: "No usable AI Key yet. Configure one in the AI Key Manager and try again.",
        }),
      };
      const t = (key) => (L10N[key] === undefined ? key : L10N[key]);

      return {
        data: {
          // 对话内容只保留在当前页面会话中，不落盘
          chatMessages: [],
          chatInput: "",
          chatStreaming: false,
          chatLiveText: "",
          chatKeyReady: null,
        },

        attached() {
          // 主界面切换 tab 时由 shell 广播；只为聊天页刷新 Key 状态与滚动位置
          this._onTabChange = (event) => {
            if (event?.detail?.tab !== "chat") return;
            this.refreshChatKeyState();
            this._scrollChatBottom();
          };
          window.addEventListener("mazmot:tab-changed", this._onTabChange);
        },

        detached() {
          window.removeEventListener("mazmot:tab-changed", this._onTabChange);
          this._onTabChange = null;
          if (this._chatController) {
            this._chatController.abort();
            this._chatController = null;
          }
          if (this._chatScrollRaf) {
            cancelAnimationFrame(this._chatScrollRaf);
            this._chatScrollRaf = 0;
          }
        },

        proto: {
          t(key) {
            return t(key);
          },

          async _ensureAiModules() {
            if (!this._aiModules) {
              this._aiModules = await load("/mz/ai/main.js");
            }
            return this._aiModules;
          },

          async refreshChatKeyState() {
            try {
              const ai = await this._ensureAiModules();
              this.chatKeyReady = ai
                .getApiKeys()
                .some((key) => !key.disabled);
            } catch (err) {
              console.warn("[chat] 读取 AI Key 失败：", err);
              this.chatKeyReady = false;
            }
          },

          _pushChatMessage(role, content, error = false) {
            if (!content) return;
            this._chatSeq = (this._chatSeq || 0) + 1;
            this.chatMessages.push({
              id: this._chatSeq,
              role,
              content,
              error: !!error,
            });
          },

          // 发送消息：流式回调里只更新临时气泡，结束后再落成正式消息
          async sendChatMessage(text) {
            if (this.chatStreaming) return;
            const content = (
              typeof text === "string" ? text : this.chatInput
            ).trim();
            if (!content) return;
            this.chatInput = "";
            this._pushChatMessage("user", content);
            this._scrollChatBottom();

            let ai;
            try {
              ai = await this._ensureAiModules();
            } catch (err) {
              console.warn("[chat] 加载 AI 模块失败：", err);
              this._pushChatMessage("assistant", t("chatNoKey"), true);
              this._scrollChatBottom();
              return;
            }

            const hasKey = ai.getApiKeys().some((key) => !key.disabled);
            this.chatKeyReady = hasKey;
            if (!hasKey) {
              this._pushChatMessage("assistant", t("chatNoKey"), true);
              this._scrollChatBottom();
              return;
            }

            let assistant;
            try {
              assistant = ai.getAssistant();
            } catch (err) {
              this.chatKeyReady = false;
              this._pushChatMessage("assistant", t("chatNoKey"), true);
              this._scrollChatBottom();
              return;
            }

            const history = this.chatMessages
              .filter((message) => !message.error)
              .slice(-20)
              .map((message) => ({
                role: message.role,
                content: message.content,
              }));

            const controller = new AbortController();
            this._chatController = controller;
            this.chatStreaming = true;
            this.chatLiveText = "";
            this._scrollChatBottom();

            try {
              const res = await assistant.chat({
                messages: history,
                stream: true,
                signal: controller.signal,
                onStream: (data) => {
                  if (data && typeof data.content === "string" && data.content) {
                    this.chatLiveText = data.content;
                    this._scrollChatBottom();
                  }
                },
              });
              const finalText = (res && res.content) || this.chatLiveText;
              if (finalText) this._pushChatMessage("assistant", finalText);
            } catch (err) {
              if (err && err.name === "AbortError") {
                if (this.chatLiveText) {
                  this._pushChatMessage("assistant", this.chatLiveText);
                }
              } else {
                console.error("[chat] 对话失败：", err);
                this._pushChatMessage(
                  "assistant",
                  getLocaleText(
                    { cn: "对话失败：{msg}", en: "Chat failed: {msg}" },
                    { msg: (err && err.message) || String(err) },
                  ),
                  true,
                );
              }
            } finally {
              if (this._chatController === controller) {
                this._chatController = null;
              }
              this.chatStreaming = false;
              this.chatLiveText = "";
              this._scrollChatBottom();
            }
          },

          stopChat() {
            if (this._chatController) this._chatController.abort();
          },

          clearChat() {
            if (this.chatStreaming) return;
            this.chatMessages = [];
            this.chatLiveText = "";
          },

          handleChatKeydown(event) {
            if (
              !event ||
              event.key !== "Enter" ||
              event.shiftKey ||
              event.isComposing
            ) {
              return;
            }
            event.preventDefault();
            this.sendChatMessage();
          },

          sendSuggestion(key) {
            this.sendChatMessage(t(key));
          },

          // 交给主界面 shell 切到「应用」并打开密钥管理器（或市场）
          requestKeyManager() {
            window.dispatchEvent(
              new CustomEvent("mazmot:open-ai-key-manager"),
            );
          },

          _scrollChatBottom() {
            if (this._chatScrollRaf) return;
            this._chatScrollRaf = requestAnimationFrame(() => {
              this._chatScrollRaf = 0;
              const el = this.shadow?.$?.(".chat-thread")?.ele;
              if (el) el.scrollTop = el.scrollHeight;
            });
          },
        },
      };
    };
  </script>
</template>
