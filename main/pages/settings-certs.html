<template page>
  <style>
    :host {
      display: block;
      text-align: start;
    }
    .manager-card {
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 560px;
      padding: 14px 16px;
      border: 1px solid var(--md-sys-color-surface-variant);
      border-radius: 12px;
      background-color: var(--md-sys-color-surface);
    }
    .manager-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border-radius: 12px;
      background-color: var(--md-sys-color-surface-variant);
    }
    .manager-info {
      flex: 1;
      min-width: 0;
    }
    .manager-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 2px;
    }
    .manager-desc {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.4;
    }
    .manager-hint {
      max-width: 560px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.7;
      line-height: 1.5;
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <div class="settings-field-label">
    <locale-text>
      <span lang="cn">凭证管理</span>
      <span lang="en">Credentials</span>
    </locale-text>
  </div>
  <div class="manager-card">
    <div class="manager-icon">🔐</div>
    <div class="manager-info">
      <div class="manager-name">
        <locale-text><span lang="cn">凭证管理器</span><span lang="en">Credential Manager</span></locale-text>
        <o-if :value="installed">
          <span style="font-size: 11px; font-weight: 500; color: var(--md-sys-color-primary); margin-left: 6px">
            <locale-text><span lang="cn">已安装</span><span lang="en">Installed</span></locale-text>
          </span>
        </o-if>
      </div>
      <div class="manager-desc">
        <locale-text>
          <span lang="cn">管理你的全部凭证：用户卡片、带自定义字段与链式引用的证书、组织账户等。</span>
          <span lang="en">Manage all your credentials: user cards, certificates with custom fields and chains, organizations, and more.</span>
        </locale-text>
      </div>
    </div>
    <o-if :value="installed">
      <st-button color="primary" on:click="openManager">
        <n-icon icon="mdi:open-in-new" slot="prefix"></n-icon>
        <locale-text><span lang="cn">打开</span><span lang="en">Open</span></locale-text>
      </st-button>
    </o-if>
    <o-if :value="!installed">
      <st-button color="primary" on:click="installManager">
        <n-icon icon="mdi:download-outline" slot="prefix"></n-icon>
        <locale-text><span lang="cn">去市场安装</span><span lang="en">Install from Market</span></locale-text>
      </st-button>
    </o-if>
  </div>
  <div class="manager-hint">
    <locale-text>
      <span lang="cn">凭证（个人资料与证书）的查看、签发、互授等完整能力已移至独立的「凭证管理器」官方应用，请安装后使用。</span>
      <span lang="en">Full credential management (viewing, issuing, sharing profiles and certificates) has moved to the standalone "Credential Manager" official app. Install it to get started.</span>
    </locale-text>
  </div>

  <script>
    import { init } from "/nos/fs/main.js";
    import toast from "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js";
    import {
      officialAppState,
      syncOfficialAppState,
    } from "../lib/official-app-state.js";
    import { getRunUrl } from "/mz/app-runner.js";
    import { getLocaleText } from "/nos/locale-text/get-locale-text.js";

    const MANAGER_ID = "cred-manager";

    export default async () => {
      return {
        data: {
          installed: false,
        },
        async ready() {
          await syncOfficialAppState();
          this.updateState();
        },
        attached() {
          // detached 期间共享状态可能已变化，重新刷新安装状态
          this.updateState();
        },
        proto: {
          updateState() {
            this.installed = officialAppState.installedApps.some(
              (app) => app.officialId === MANAGER_ID,
            );
          },

          // 从已安装记录重建句柄并打开凭证管理器（与 market.html 的 _openInstalled 一致）
          async openManager() {
            const installed = officialAppState.installedApps.find(
              (app) => app.officialId === MANAGER_ID,
            );
            if (!installed) return;
            try {
              const namespace = installed.namespace || "mazmot-apps";
              const nsPrefix = namespace + "/";
              const virtualDirName = installed.dirName?.startsWith(nsPrefix)
                ? installed.dirName.slice(nsPrefix.length)
                : installed.dirName || installed.name;
              const rootDir = await init(namespace);
              const handle = await rootDir.get(virtualDirName, { create: "dir" });
              const url = await getRunUrl({
                source: "official",
                namespace,
                virtualDirName,
                dirName: installed.dirName,
                name: installed.name,
                _handle: handle,
              });
              window.open(url, `mazmot-app-${installed.name}`);
            } catch (err) {
              console.error("打开凭证管理器失败：", err);
              toast({
                message: getLocaleText(
                  { cn: "打开应用失败：{msg}", en: "Failed to open app: {msg}" },
                  { msg: err.message || err },
                ),
                color: "error",
              });
            }
          },

          // 未安装：通知外层（home.html）打开应用市场
          installManager() {
            this.emit("open-market", { bubbles: true, composed: true });
          },
        },
      };
    };
  </script>
</template>
