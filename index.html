<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <title>Mazmot</title>
    <script>
      // /gh/ 前缀动态决策：NoneOS Core SW 已接管本页（controller 存在）→
      // 资源走 /gh/ 本地前缀（SW 本地缓存、离线可用）；未接管（首访 / 未安装）
      // → jsdelivr 完整 URL。结果写入 window.__GH_BASE 供后续引入使用。
      window.__GH_BASE =
        navigator.serviceWorker && navigator.serviceWorker.controller
          ? "/gh/"
          : "https://cdn.jsdelivr.net/gh/";
      // 回头客（Core SW 已接管本页）：首帧就不渲染引导层，快速通道
      // 直接进应用，不闪一帧安装界面；探测失败或加载卡住时再恢复显示
      // （模块脚本探测分支 + body 尾部兜底定时器）
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        document.documentElement.classList.add("boot-fast");
      }
      // senti-ui 主题引导：解析期同步写出，保证首帧前注入 M3 颜色变量
      document.write(
        '<script src="' +
          window.__GH_BASE +
          'ofajs/senti-ui@latest/packages/boot/st-boot.js"><\/script>'
      );
      // 预取 ofa.js（最大依赖），动态 import 执行前即开始拉取
      document.write(
        '<link rel="modulepreload" href="' +
          window.__GH_BASE +
          'ofajs/ofa.js@4.7.1/dist/ofa.mjs#debug">'
      );
    </script>
    <style>
      html,
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          Microsoft Yahei,
          Helvetica,
          Arial,
          sans-serif,
          Apple Color Emoji,
          Segoe UI Emoji;
      }

      /* ===== Core 安装/升级引导层：吉祥物为主视觉 ===== */
      /* 快速通道（回头客）：引导层首帧即不渲染，只留 surface 色底 */
      html.boot-fast .mask {
        display: none;
      }
      html.boot-fast,
      html.boot-fast body {
        background-color: var(--md-sys-color-surface);
      }
      .mask {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: var(--md-sys-color-surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        transition: opacity 0.4s ease;
      }
      .mask.leaving {
        opacity: 0;
        pointer-events: none;
      }
      .brand {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: var(--md-sys-color-on-surface);
        user-select: none;
      }
      .boot-status {
        font-size: 13px;
        min-height: 18px;
        text-align: center;
        color: var(--md-sys-color-on-surface-variant);
      }
      .boot-bar {
        width: min(320px, 80vw);
        height: 6px;
        border-radius: 3px;
        background-color: var(--md-sys-color-surface-variant);
        overflow: hidden;
      }
      .boot-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background-color: var(--md-sys-color-primary);
        transition: width 0.25s ease;
      }
      .boot-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: min(420px, 86vw);
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
        word-break: break-word;
        color: var(--md-sys-color-error);
      }
      .boot-retry {
        font: inherit;
        font-size: 13px;
        padding: 8px 22px;
        border-radius: 999px;
        border: none;
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        cursor: pointer;
      }

      /* ===== 主应用首屏 loading 层 ===== */
      /* 快速通道（boot-fast）首帧即见，替代进入对话前的裸色底空白期；
         完整引导路径压在引导层（z-index 9999）之下不露出。首页模块把
         依赖全部加载完并渲染出首屏后派发 mazmot:app-ready 统一撤下 */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9990;
        background-color: var(--md-sys-color-surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        transition: opacity 0.4s ease;
      }
      #app-loading.leaving {
        opacity: 0;
        pointer-events: none;
      }
      .loading-ring {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 3px solid var(--md-sys-color-surface-variant);
        border-top-color: var(--md-sys-color-primary);
        animation: loading-spin 0.9s linear infinite;
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* nos-version 只做逻辑驱动，不显示 UI（进度由本页统一表现） */
      nos-version {
        display: none !important;
      }

      /* 作者样式会覆盖 UA 的 [hidden] { display: none }，这里显式兜底
         （如 .boot-error 设了 display:flex，不加这条 hidden 会失效） */
      [hidden] {
        display: none !important;
      }

      /* 主应用宿主：Core 就绪后注入 <o-router> + <o-app src="/main/app-config.js"> */
      #app-host {
        height: 100%;
      }
    </style>
    <!-- SW / Core 调试开关（见 sw/sw-config.js） -->
    <script src="/sw/sw-config.js"></script>
  </head>
  <body>
    <!-- Core 安装/升级引导层（不写静态 <l-m>：ofa 动态 import 时会在
         window.lm 赋值前升级静态 l-m 导致中断，组件统一由脚本加载） -->
    <div class="mask" id="boot-mask">
      <m-mascot id="boot-mascot" state="soulless" style="--mascot-size: 120px"></m-mascot>
      <div class="brand">Mazmot</div>
      <div class="boot-status" id="boot-status"></div>
      <div class="boot-bar">
        <div class="boot-bar-fill" id="boot-bar-fill"></div>
      </div>
      <div class="boot-error" id="boot-error" hidden>
        <span id="boot-error-text"></span>
        <button class="boot-retry" id="boot-retry">重试 / Retry</button>
      </div>

      <!-- 隐藏的 Core 版本管理组件：负责检测/自动安装 NoneOS Core -->
      <nos-version auto-install id="boot-nsv"></nos-version>
    </div>

    <!-- 主应用首屏 loading 层：快速通道（boot-fast 只隐藏引导层）首帧即见，
         替代挂载 <o-app> 到首页可交互之间的空白期；完整引导路径压在引导层
         之下不露出。首页模块（welcome / apps）加载齐全部依赖并渲染出首屏
         后派发 mazmot:app-ready，由根入口统一撤下 -->
    <div id="app-loading">
      <m-mascot style="--mascot-size: 104px"></m-mascot>
      <div class="brand">Mazmot</div>
      <div class="loading-ring"></div>
      <div class="boot-status" id="loading-status"></div>
    </div>

    <!-- 主应用宿主 -->
    <div id="app-host"></div>

    <script>
      // 快速通道兜底：模块脚本迟迟未就绪（网络异常、CDN 回退中）且仍未
      // 进入应用时，恢复显示引导层，避免长时间只有一块裸色底
      setTimeout(function () {
        if (!document.getElementById("app-host").childElementCount) {
          document.documentElement.classList.remove("boot-fast");
        }
      }, 1200);
    </script>

    <script type="module">
      // ofa / router 与全部引导逻辑必须在同一个模块里：依赖顶层 await
      // 阻塞后续模块脚本的模块排序在 WebKit 上不成立（后续模块不等 TLA），
      // 拆两个脚本会出现 $ 未定义的竞态
      const GH = window.__GH_BASE;
      const CDN = "https://cdn.jsdelivr.net/gh/";
      async function importFirst(...urls) {
        let lastErr;
        for (const url of urls) {
          try {
            return await import(url);
          } catch (err) {
            lastErr = err;
          }
        }
        throw lastErr;
      }
      // ofa.js + router：优先 /gh/；加载失败（SW 异常边缘）回退 jsdelivr
      await importFirst(
        GH + "ofajs/ofa.js@4.7.1/dist/ofa.mjs#debug",
        CDN + "ofajs/ofa.js@4.7.1/dist/ofa.mjs#debug",
      );
      await importFirst(
        GH + "ofajs/ofa.js/libs/router/dist/router.min.mjs",
        CDN + "ofajs/ofa.js/libs/router/dist/router.min.mjs",
      );

      // ---- 语言：Core 就绪前 /nos/locale-text 不可用（依赖 SW）----
      // 初值：localStorage 的 lang 偏好（设置页切换语言时写入），无则按
      // navigator 判定；随后异步拉取与正式应用同源的 getLang 校准
      // （直连 core.noneos.com，不依赖 SW），校准后已渲染文案整体重刷
      let lang =
        localStorage.getItem("lang") ||
        (/^zh/i.test(navigator.language || "") ? "cn" : "en");

      // 取双语词条：精确命中 → 繁体回退简体 → 英文 → 简体
      const langPick = (item) =>
        item[lang] || (lang === "tw" ? item.cn : null) || item.en || item.cn;

      const statusEl = document.getElementById("boot-status");
      const barFillEl = document.getElementById("boot-bar-fill");
      const maskEl = document.getElementById("boot-mask");
      const mascotEl = document.getElementById("boot-mascot");
      const errorEl = document.getElementById("boot-error");
      const errorTextEl = document.getElementById("boot-error-text");
      const retryBtn = document.getElementById("boot-retry");
      const loadingEl = document.getElementById("app-loading");
      // loading 层文案跟随语言偏好（本层生命周期短，语言校准后不重刷）
      document.getElementById("loading-status").textContent = langPick({
        cn: "加载中…",
        en: "Loading…",
      });

      // 状态文案保留词条引用，语言校准后整体重渲染
      let statusItem = null;
      const applyStatus = () => {
        statusEl.textContent = statusItem ? langPick(statusItem) : "";
      };

      // 快速通道已移除引导层时（后台静默升级的进度事件），不再驱动已卸载的 UI
      const setProgress = (p, item) => {
        if (!maskEl.isConnected) return;
        barFillEl.style.width = Math.min(100, Math.max(0, p)) + "%";
        if (item !== undefined) {
          statusItem = item;
          applyStatus();
        }
      };

      // ---- nos-version 事件绑定（先绑定后加载组件定义，同步触发的事件也能收到）----
      // $() 接收 CSS 选择器：取 id 必须带 #（$("boot-nsv") 匹配的是标签名）
      $("#boot-nsv").on("check-start", () => {
        setProgress(2, {
          cn: "正在检测 NoneOS Core...",
          en: "Detecting NoneOS Core...",
        });
      });
      $("#boot-nsv").on("uninstalled", () => {
        setProgress(5, {
          cn: "首次运行，正在安装 NoneOS Core...",
          en: "First run, installing NoneOS Core...",
        });
      });
      $("#boot-nsv").on("upgradable", (e) => {
        // ofa 的 emit({data}) 把负载放在 e.detail.data 上
        const d = (e && e.detail && e.detail.data) || {};
        const a = d.version || "?";
        const b = d.lastVersion || "?";
        setProgress(5, {
          cn: `NoneOS Core 升级中（${a} → ${b}）...`,
          en: `Upgrading NoneOS Core (${a} → ${b})...`,
        });
      });
      $("#boot-nsv").on("install-start", () => {
        setProgress(6, {
          cn: "NoneOS Core 安装准备中...",
          en: "Preparing NoneOS Core installation...",
        });
      });
      $("#boot-nsv").on("install-progress", (e) => {
        const d = (e && e.detail && e.detail.data) || {};
        const step = Number(d.step) || 0;
        const total = Number(d.total) || 0;
        const p = total > 0 ? 6 + Math.round((step / total) * 88) : 50;
        const desc = d.desc || "";
        setProgress(p, {
          cn: desc ? `NoneOS Core：${desc}` : "NoneOS Core 安装中...",
          en: desc ? `NoneOS Core: ${desc}` : "Installing NoneOS Core...",
        });
      });

      let entered = false;
      $("#boot-nsv").on("installed", () => {
        if (entered) return;
        entered = true;
        setProgress(100, {
          cn: "NoneOS Core 就绪，Mazmot 苏醒中...",
          en: "NoneOS Core ready, waking up...",
        });
        // 吉祥物苏醒：soulless → 默认形态
        mascotEl.removeAttribute("state");
        setTimeout(enterApp, 600);
      });
      $("#boot-nsv").on("error", (e) => {
        // 后台静默升级失败不打扰用户，下次启动的本地探测/检测会再触发
        if (!maskEl.isConnected) return;
        // ofa 的 emit({data}) 把负载放在 e.detail.data 上
        const d = (e && e.detail && e.detail.data) || {};
        const msg = d.message || "";
        errorTextEl.textContent = langPick({
          cn: `NoneOS Core ${d.phase || "初始化"}失败：${msg || "未知错误"}`,
          en: `NoneOS Core ${d.phase || "initialization"} failed: ${msg || "Unknown error"}`,
        });
        errorEl.hidden = false;
        statusItem = null;
        applyStatus();
      });
      retryBtn.addEventListener("click", () => {
        location.reload();
      });

      // ---- 进入主应用：优先 ?redirect=（兼容旧客户端升级链路），否则原地挂载 ----
      const mountApp = () => {
        const params = new URLSearchParams(location.search);
        const raw = params.get("redirect");
        if (raw) {
          try {
            const decoded = decodeURIComponent(raw);
            // 仅允许站内相对路径，避免 open redirect 风险
            if (decoded.startsWith("/") && !decoded.startsWith("//")) {
              location.replace(decoded);
              return;
            }
          } catch (e) {
            // 解码失败则忽略，走原地挂载
          }
        }

        // 原地挂载 /main 主应用（此时 Core SW 已就绪，/gh/、/nos/ 均可用）
        document.getElementById("app-host").innerHTML =
          '<o-router fix-body><o-app src="/main/app-config.js"></o-app></o-router>';
        // 兜底：首页模块加载异常（404 / 抛错）时 app-ready 不来，
        // 15s 后强制撤掉引导层 / loading 层，不永久挡屏
        setTimeout(finishEnter, 15000);
      };

      // ---- 首屏收口：首页内容就绪才撤 loading ----
      // 主应用首页（welcome 引导对话 / apps 列表）经页面工厂 load 并行加载
      // 全部依赖模块与组件、渲染出首屏后派发 mazmot:app-ready，此处统一
      // 撤下引导层与 loading 层——用户看到的第一帧内容即是完整首屏
      let appFinished = false;
      const finishEnter = () => {
        if (appFinished) return;
        appFinished = true;
        if (maskEl.isConnected) {
          maskEl.classList.add("leaving");
          setTimeout(() => maskEl.remove(), 450);
        }
        loadingEl.classList.add("leaving");
        setTimeout(() => loadingEl.remove(), 450);
      };
      window.addEventListener("mazmot:app-ready", finishEnter, { once: true });

      // 完整引导路径（首访 / 恢复装）：保留苏醒仪式；引导层带着「苏醒中」
      // 状态留在屏上，首页就绪后由 finishEnter 一并撤下
      const enterApp = () => {
        entered = true;
        mountApp();
      };

      // 快速通道（Core 已就绪的回头客）：跳过苏醒仪式立即挂载并撤下引导层
      //（boot-fast 首帧已隐藏），loading 层继续盖到首页就绪
      const enterFast = () => {
        entered = true;
        mountApp();
        if (maskEl.isConnected) {
          maskEl.classList.add("leaving");
          setTimeout(() => maskEl.remove(), 450);
        }
      };

      // ---- 组件加载（ofa 就绪后 lm 可用）----
      const load = lm(import.meta);

      // loading 层吉祥物组件预载：与后续 Core 探测 / 引导并行，不占关键
      // 路径；组件注册后 loading 屏的吉祥物即刻浮现
      load("/mz/comps/mascot/mascot.html").catch(() => {});

      // nos-version 组件源：仅当 sw/sw-config.js 的 coreDev:true 且运行在
      // localhost 时走本地 dev Core（3002），否则一律线上；本地加载失败回退线上
      const swConfig = globalThis.SW_CONFIG || {};
      const isLocalhost = ["localhost", "127.0.0.1", "[::1]"].includes(
        location.hostname,
      );
      const prodNosVersion =
        "https://core.noneos.com/nos-lib/nos-version/nos-version.html";
      const loadNosVersion = async () => {
        if (swConfig.coreDev && isLocalhost) {
          try {
            await load("http://localhost:3002/nos-lib/nos-version/nos-version.html");
            return;
          } catch (err) {
            // 本地 dev Core 未起，回退线上
          }
        }
        await load(prodNosVersion);
      };

      // ---- 引导分叉 ----
      // 快速通道：Core SW 已接管本页（controller 存在，head 脚本同步判定、
      // 引导层首帧即不渲染）且本地配置完整（/__config 由 SW 本地响应，不走
      // 网络）→ 立即进应用；在线升级检查挪到进应用之后后台跑，回头客不再
      // 见到任何安装界面。
      // 探测失败（装到一半 / SW 异常）或无 controller（首访）→ 完整引导流程。
      const controllerAlive = !!(
        navigator.serviceWorker && navigator.serviceWorker.controller
      );
      let coreReady = false;
      if (controllerAlive) {
        const configData = await fetch("/__config")
          .then((e) => e.json())
          .catch(() => null);
        coreReady = !!(
          configData &&
          configData.serviceWorkerVersion &&
          configData.systemConfig &&
          configData.systemConfig.version
        );
      }

      if (coreReady) {
        enterFast();
        // 后台升级检查：延迟触发，避免与应用首屏抢网络。隐藏的
        // <nos-version auto-install> 检到可升级会静默装好；Core SW 带
        // skipWaiting/claim，会话内后续懒加载可能拿到新版 /nos/* 模块
        // （已加载模块不受影响），整体切换下次启动生效
        setTimeout(() => {
          loadNosVersion().catch(() => {});
        }, 3000);
      } else {
        // 探测失败但首帧隐藏了引导层（半安装恢复），恢复显示
        document.documentElement.classList.remove("boot-fast");
        // 吉祥物组件：升级时机由这次 load 决定，规避静态 <l-m> 的注册时序问题
        await load("/mz/comps/mascot/mascot.html");
        // attached 即触发 check：uninstalled 自动安装 → installed 进应用
        await loadNosVersion();
      }
    </script>
  </body>
</html>
