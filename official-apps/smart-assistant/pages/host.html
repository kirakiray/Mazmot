  <script>
    export default async ({ load }) => {
      const SERVICE_ID = "smart-assistant";

      return {
        tag: "sa-host-page",

        data: {
          assistantName: "",
          welcomeMsg: "",
          systemPrompt: "",
          saving: false,
          shareUrl: "",
          generating: false,
          genStatus: "",
          copied: false,
          customers: [],
          expanded: {},
        },

        proto: {
          // ===== 处理访客发来的消息 =====
          handleIncoming(data, ctx) {
            if (!data || typeof data !== "object") return;
            const userId = ctx.fromUserId;
            const c = this.getOrCreateCustomer(userId, ctx.remoteUser);

            const { kind } = data;
            console.log(
              "[smart-assistant] 收到访客消息：",
              this.shortId(userId),
              "kind=" + kind,
            );

            if (kind === "hello") {
              // 访客刚连上，推送欢迎信息
              this.sendToCustomer(c, {
                kind: "welcome",
                name: this.assistantName || "智能助手",
                message: this.welcomeMsg || "你好，有什么可以帮你？",
              });
            } else if (kind === "chat") {
              const text = (data.text || "").trim();
              if (!text) return;
              // 异步调用 AI，不阻塞后续消息
              this.handleVisitorChat(c, text);
            }
          },

          // ===== 工具：生成短 ID 用于展示 =====
          shortId(id) {
            if (!id) return "????";
            return id.slice(-6);
          },

          // ===== 折叠/展开访客对话 =====
          toggleVisitor(userId) {
            this.expanded[userId] = !this.expanded[userId];
          },

          // ===== 复制链接到剪贴板 =====
          async copyLink() {
            if (!this.shareUrl) return;
            try {
              await navigator.clipboard.writeText(this.shareUrl);
            } catch (_) {
              // 回退：选中文本
              try {
                const inp = this.shadow.$(".link-input");
                if (inp && inp.ele) {
                  inp.ele.select();
                  document.execCommand("copy");
                }
              } catch (e) {}
            }
            this.copied = true;
            clearTimeout(this._copyTimer);
            this._copyTimer = setTimeout(() => {
              this.copied = false;
            }, 1500);
          },

          // ===== 选中链接输入框文本 =====
          selectLinkInput(event) {
            const el = event && event.target;
            if (el && typeof el.select === "function") {
              try {
                el.select();
              } catch (_) {}
            }
          },

          // ===== 保存配置到 ever-cache =====
          async saveConfig() {
            this.saving = true;
            try {
              const { storage } = await load(
                "https://cdn.jsdelivr.net/gh/kirakiray/ever-cache/src/main.min.js",
              );
              await storage.setItem("sa-config", {
                assistantName: this.assistantName,
                welcomeMsg: this.welcomeMsg,
                systemPrompt: this.systemPrompt,
              });
              this.genStatus = "配置已保存";
              console.log("[smart-assistant] 配置已保存", {
                assistantName: this.assistantName,
                welcomeMsg: this.welcomeMsg,
                promptLen: this.systemPrompt.length,
              });
            } catch (err) {
              console.error("[smart-assistant] 保存配置失败：", err);
              this.genStatus = "保存失败：" + (err.message || err);
            } finally {
              this.saving = false;
            }
          },

          // ===== 生成分享链接 =====
          async handleGenLink() {
            if (this.generating) return;
            this.generating = true;
            this.genStatus = "准备中...";
            try {
              const self = this.parseSelfIdentity();
              if (!self) {
                throw new Error("无法识别当前应用的目录路径");
              }
              console.log("[smart-assistant] 当前应用身份：", self);

              const [fsMod, cacheMod, shareMgr] = await Promise.all([
                load("/nos/fs/main.js"),
                load(
                  "https://cdn.jsdelivr.net/gh/kirakiray/ever-cache/src/main.min.js",
                ),
                load("/lib/share-mgr.js"),
              ]);
              const { init } = fsMod;
              const { storage } = cacheMod;
              const { publishApp, generateAppId } = shareMgr;

              const apps = (await storage.apps) || [];
              const { dirName } = self;
              const record =
                apps.find(
                  (a) => a.name === dirName || a.virtualDirName === dirName,
                ) ||
                apps.find((a) =>
                  a.dirName ? a.dirName.endsWith("/" + dirName) : false,
                ) ||
                null;
              console.log("[smart-assistant] 应用记录：", record);

              this.genStatus = "获取应用目录...";
              const rootDir = await init(self.namespace);
              const handle = await rootDir.get(dirName);

              let appId = (record && record.appId) || "";
              if (!appId) {
                appId = await generateAppId(dirName);
                if (record) {
                  record.appId = appId;
                  await storage.setItem("apps", apps);
                }
              }

              const app = {
                _handle: handle,
                _recordName: dirName,
                name: (record && record.name) || "smart-assistant",
                version: (record && record.version) || "0.1.0",
                desc: (record && record.desc) || "智能联络助手",
                icon: (record && record.icon) || "🤖",
                appId,
              };

              this.genStatus = "发布到分享网络...";
              const { shareUrl, payloadHash } = await publishApp(app, {
                appId,
                appParams: { host: this.myUserId },
                onProgress: ({ text }) => {
                  if (text) this.genStatus = text;
                },
              });

              if (record && payloadHash) {
                record.payloadHash = payloadHash;
                await storage.setItem("apps", apps);
              }

              this.shareUrl = shareUrl;
              this.genStatus = "链接已生成，点击输入框可全选复制";
              console.log("[smart-assistant] 分享链接已生成：", shareUrl);
            } catch (err) {
              console.error("[smart-assistant] 生成链接失败：", err);
              this.genStatus = "失败：" + (err.message || err);
            } finally {
              this.generating = false;
            }
          },

          parseSelfIdentity() {
            const m = location.pathname.match(
              /^\/\$(.+?)\/(.+?)\/client\/index\.html$/,
            );
            if (!m) return null;
            return { namespace: m[1], dirName: m[2] };
          },

          // ===== 访客消息处理 =====
          getOrCreateCustomer(userId, remoteUser) {
            let c = this.customers.find((x) => x.userId === userId);
            if (!c) {
              c = {
                userId,
                messages: [],
                thinking: false,
                online: true,
                _remote: remoteUser,
              };
              this.customers.push(c);
              console.log(
                "[smart-assistant] 新访客接入：",
                this.shortId(userId),
              );
            } else if (remoteUser) {
              c._remote = remoteUser;
              c.online = true;
            }
            return c;
          },

          async sendToCustomer(c, payload) {
            if (!c || !c._remote) {
              console.warn(
                "[smart-assistant] 无法发送：访客 remote 不可用",
                this.shortId(c && c.userId),
              );
              return;
            }
            try {
              const results = await c._remote.sendToService(SERVICE_ID, payload);
              const ok = Array.isArray(results) &&
                results.some((r) => r && r.status === "ok");
              if (!ok) {
                console.warn(
                  "[smart-assistant] 发送给访客未送达：",
                  this.shortId(c.userId),
                  results,
                );
                c.online = false;
              } else {
                c.online = true;
              }
            } catch (err) {
              console.error(
                "[smart-assistant] 发送给访客异常：",
                this.shortId(c.userId),
                err,
              );
              c.online = false;
            }
          },

          // ===== 调用 AI 并回复访客 =====
          async handleVisitorChat(c, userText) {
            // 追加访客消息
            c.messages.push({ role: "user", content: userText });

            // 标记思考中
            c.thinking = true;
            // 先发 typing 通知
            await this.sendToCustomer(c, { kind: "typing" });

            try {
              const { getAssistant } = await load("/ai/main.js");
              const assistant = getAssistant();
              console.log(
                "[smart-assistant] 调用 AI",
                assistant.providerName,
                "访客：",
                this.shortId(c.userId),
                "消息数：",
                c.messages.length,
              );

              const messages = [
                {
                  role: "system",
                  content:
                    this.systemPrompt ||
                    "你是一个友好的智能助手，请根据访客的问题给出有帮助的回答。",
                },
                ...c.messages.map((m) => ({
                  role: m.role,
                  content: m.content,
                })),
              ];

              const { content } = await assistant.chat({
                messages,
                model: "deepseek-v4-flash",
              });

              c.messages.push({ role: "assistant", content });
              c.thinking = false;
              console.log(
                "[smart-assistant] AI 回复访客",
                this.shortId(c.userId),
                "：",
                content.slice(0, 80) + (content.length > 80 ? "..." : ""),
              );

              await this.sendToCustomer(c, { kind: "reply", text: content });
            } catch (err) {
              c.thinking = false;
              console.error(
                "[smart-assistant] AI 调用失败：",
                this.shortId(c.userId),
                err,
              );
              const errMsg = err && err.message ? err.message : String(err);
              const tip = errMsg.includes("no api key available")
                ? "助手主人尚未配置 AI Key，暂时无法回复。"
                : "助手处理消息时出错：" + errMsg;
              await this.sendToCustomer(c, { kind: "error", text: tip });
            }
          },
        },

        async attached() {
          // 读取已保存的配置
          try {
            const { storage } = await load(
              "https://cdn.jsdelivr.net/gh/kirakiray/ever-cache/src/main.min.js",
            );
            const cfg = await storage.getItem("sa-config");
            if (cfg) {
              this.assistantName = cfg.assistantName || "";
              this.welcomeMsg = cfg.welcomeMsg || "";
              this.systemPrompt = cfg.systemPrompt || "";
              console.log("[smart-assistant] 已读取保存的配置");
            }
          } catch (err) {
            console.warn("[smart-assistant] 读取配置失败：", err);
          }

          // 注册 P2P 服务
          const parent = this.parentElement;
          // host-page 放在 home.html 内，通过 home 的 _user 获取
          // 但组件无法直接访问父页面，所以自行 getUser
          const { getUser } = await load("/nos/user/main.js");
          const user = await getUser("default");
          this._user = user;
          this.myUserId = user.userId;
          console.log("[smart-assistant] Host userId：", user.userId);

          const self = this;
          this._svc = user.registerService(SERVICE_ID, {
            onMessage(data, ctx) {
              self.handleIncoming(data, ctx);
            },
          });

          // 监听访客上下线
          this._unbindConn = user.bind("remote_user_connected", (event) => {
            const uid = event && event.detail && event.detail.userId;
            if (!uid) return;
            const c = self.customers.find((x) => x.userId === uid);
            if (c && !c.online) c.online = true;
          });
          this._unbindDisc = user.bind(
            "remote_user_disconnected",
            (event) => {
              const uid = event && event.detail && event.detail.userId;
              if (!uid) return;
              const c = self.customers.find((x) => x.userId === uid);
              if (c && c.online) c.online = false;
            },
          );

          console.log("[smart-assistant] Host 服务已注册：", SERVICE_ID);
        },

        detached() {
          [this._unbindConn, this._unbindDisc].forEach((fn) => {
            try {
              fn && fn();
            } catch (_) {}
          });
          if (this._svc) {
            try {
              this._svc.unregister();
            } catch (_) {}
          }
        },
      };
    };
  </script>
</template>
