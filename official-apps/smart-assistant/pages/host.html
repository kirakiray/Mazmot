    <div slot="bottom">
      <o-if :value="reqOutput && !reqGenerating">
        <p-button variant="text" on:click="closeReqHelper">关闭</p-button>
        <p-button color="primary" on:click="applyReqDoc">
          <span slot="prefix">
            <n-icon icon="mdi:check"></n-icon>
          </span>
          应用到功能需求文档
        </p-button>
      </o-if>
    </div>
  </p-dialog>

  <!-- ===== 访客总览弹窗（p-dialog）===== -->
  <p-dialog
    sync:open="overviewOpen"
    auto-to-mobile-width="540px"
    style="--dialog-width: min(680px, 92vw)"
    on:click-mask="closeOverview"
  >
    <span slot="title">
      <n-icon
        icon="mdi:note-text-outline"
        style="vertical-align: -2px; margin-right: 4px"
      ></n-icon>
      访客对话总览
    </span>

    <div class="overview-actions">
      <p-button
        color="primary"
        attr:disabled="overviewGenerating"
        on:click="generateOverview"
      >
        <span slot="prefix">
          <n-icon
            attr:icon="overviewGenerating ? 'mdi:loading' : 'mdi:auto-fix'"
          ></n-icon>
        </span>
        {{overviewOutput ? '重新生成' : '生成总览'}}
      </p-button>
    </div>

    <o-if :value="overviewError">
      <div class="modal-error">{{overviewError}}</div>
    </o-if>

    <o-if :value="overviewOutput || overviewGenerating">
      <div class="overview-body">
        <!-- 生成中：纯文本实时显示（o-md 不响应流式文本变化）-->
        <o-if :value="overviewGenerating">
          <pre class="overview-raw">
{{overviewOutput || '正在生成总览...'}}</pre
          >
        </o-if>
        <!-- 生成完成：o-md 只渲染一次，slotchange 正常触发 -->
        <o-if :value="!overviewGenerating && overviewOutput">
          <o-md>{{overviewOutput}}</o-md>
        </o-if>
      </div>
    </o-if>

    <div slot="bottom">
      <o-if :value="overviewOutput">
        <p-button variant="text" on:click="copyOverview">
          <span slot="prefix">
            <n-icon
              attr:icon="overviewCopied ? 'mdi:check' : 'mdi:content-copy'"
            ></n-icon>
          </span>
          {{overviewCopied ? '已复制' : '复制报告'}}
        </p-button>
      </o-if>
      <p-button variant="text" on:click="closeOverview">关闭</p-button>
    </div>
  </p-dialog>

  <script>
    export default async ({ load }) => {
      const SERVICE_ID = "smart-assistant";

      // 各 provider 支持的模型清单
      const MODELS_BY_PROVIDER = {
        deepseek: [
          { value: "deepseek-v4-flash", label: "DeepSeek V4 Flash" },
          { value: "deepseek-v4-pro", label: "DeepSeek V4 Pro" },
        ],
        kimi: [
          { value: "kimi-k3", label: "Kimi K3" },
          { value: "kimi-k2.7-code", label: "Kimi K2.7 Code" },
          { value: "kimi-k2.6", label: "Kimi K2.6" },
          { value: "kimi-k2.5", label: "Kimi K2.5" },
        ],
      };

      return {
        tag: "sa-host-page",

        data: {
          assistantName: "",
          welcomeMsg: "",
          systemPrompt: "",
          aiModel: "auto",
          modelOptions: [],
          saving: false,
          shareUrl: "",
          generating: false,
          genStatus: "",
          copied: false,
          customers: [],
          expanded: {},
          // AI 需求整理弹窗状态
          reqHelperOpen: false,
          reqInput: "",
          reqOutput: "",
          reqGenerating: false,
          reqError: "",
          // 访客总览弹窗状态
          overviewOpen: false,
          overviewGenerating: false,
          overviewOutput: "",
          overviewError: "",
          overviewCopied: false,
        },

        proto: {
          // ===== 处理访客发来的消息 =====
          handleIncoming(data, ctx) {
            if (!data || typeof data !== "object") return;
            const userId = ctx.fromUserId;
            const c = this.getOrCreateCustomer(userId, ctx.remoteUser);

            const { kind } = data;
            console.log(
              "[smart-assistant] 收到访客消息：",
              this.shortId(userId),
              "kind=" + kind,
            );

            if (kind === "hello") {
              // 只在访客首次连接（无历史消息）时推送欢迎信息，避免刷新重复
              if (c.messages.length === 0) {
                this.sendToCustomer(c, {
                  kind: "welcome",
                  name: this.assistantName || "智能助手",
                  message: this.welcomeMsg || "你好，有什么可以帮你？",
                });
              }
            } else if (kind === "chat") {
              const text = (data.text || "").trim();
              if (!text) return;
              // 异步调用 AI，不阻塞后续消息
              this.handleVisitorChat(c, text);
            }
          },

          // ===== 工具：生成短 ID 用于展示 =====
          shortId(id) {
            if (!id) return "????";
            return id.slice(-6);
          },

          // ===== 根据模型名推断 provider =====
          providerOfModel(model) {
            if (!model) return null;
            if (model.startsWith("deepseek-")) return "deepseek";
            if (model.startsWith("kimi-")) return "kimi";
            return null;
          },

          // ===== 根据已配置的 Key 刷新可选模型列表 =====
          refreshModelOptions() {
            const keys = this._apiKeys || [];
            const configuredProviders = new Set(keys.map((k) => k.provider));
            const options = [];
            for (const [provider, models] of Object.entries(
              MODELS_BY_PROVIDER,
            )) {
              for (const m of models) {
                options.push({
                  ...m,
                  disabled: !configuredProviders.has(provider),
                });
              }
            }
            this.modelOptions = options;
            console.log(
              "[smart-assistant] 可选模型：",
              options.map((o) => o.value + (o.disabled ? "(未配置Key)" : "")),
            );
          },

          // ===== 根据当前 aiModel 选择 assistant 与 model（共享逻辑）=====
          async _pickAssistant() {
            const { getAssistant, getApiKeys } = await load("/ai/main.js");
            if (this.aiModel && this.aiModel !== "auto") {
              const provider = this.providerOfModel(this.aiModel);
              const key = getApiKeys().find((k) => k.provider === provider);
              if (key) {
                return { assistant: getAssistant(key.id), model: this.aiModel };
              }
              console.warn(
                "[smart-assistant] 未配置",
                provider,
                "的 Key，回退到自动",
              );
            }
            return { assistant: getAssistant(), model: undefined };
          },

          // ===== 保存单个访客的对话历史 =====
          async saveVisitorHistory(c) {
            if (!this._storage || !c) return;
            try {
              const key = "sa-visitor-" + c.userId;
              await this._storage.setItem(
                key,
                JSON.parse(JSON.stringify(c.messages)),
              );
              // 更新访客索引
              const index =
                (await this._storage.getItem("sa-visitors-index")) || [];
              if (!index.includes(c.userId)) {
                index.push(c.userId);
                await this._storage.setItem("sa-visitors-index", index);
              }
            } catch (err) {
              console.warn(
                "[smart-assistant] 保存访客历史失败：",
                this.shortId(c.userId),
                err,
              );
            }
          },

          // ===== 恢复所有历史访客（标记为离线）=====
          async loadVisitorsHistory() {
            if (!this._storage) return;
            try {
              const index =
                (await this._storage.getItem("sa-visitors-index")) || [];
              for (const userId of index) {
                const messages = await this._storage.getItem(
                  "sa-visitor-" + userId,
                );
                if (Array.isArray(messages)) {
                  // 避免重复添加（已在线的访客不覆盖）
                  const existing = this.customers.find(
                    (x) => x.userId === userId,
                  );
                  if (!existing) {
                    this.customers.push({
                      userId,
                      messages,
                      thinking: false,
                      online: false,
                      _remote: null,
                    });
                  }
                }
              }
              if (index.length) {
                console.log(
                  "[smart-assistant] 恢复历史访客",
                  index.length,
                  "个",
                );
              }
            } catch (err) {
              console.warn("[smart-assistant] 恢复访客历史失败：", err);
            }
          },

          // ===== 折叠/展开访客对话 =====
          toggleVisitor(userId) {
            this.expanded[userId] = !this.expanded[userId];
          },

          // ===== 删除访客记录 =====
          async removeVisitor(userId, event) {
            // 阻止冒泡，避免触发折叠
            if (event && typeof event.stopPropagation === "function") {
              event.stopPropagation();
            }

            // 从内存列表移除
            const idx = this.customers.findIndex((c) => c.userId === userId);
            if (idx !== -1) {
              this.customers.splice(idx, 1);
            }

            // 清理展开状态
            if (this.expanded[userId]) {
              delete this.expanded[userId];
            }

            // 删除本地持久化
            if (this._storage) {
              try {
                await this._storage.removeItem("sa-visitor-" + userId);
                const index =
                  (await this._storage.getItem("sa-visitors-index")) || [];
                const newIndex = index.filter((id) => id !== userId);
                if (newIndex.length !== index.length) {
                  await this._storage.setItem("sa-visitors-index", newIndex);
                }
              } catch (err) {
                console.warn(
                  "[smart-assistant] 删除访客持久化记录失败：",
                  this.shortId(userId),
                  err,
                );
              }
            }

            console.log(
              "[smart-assistant] 已删除访客记录：",
              this.shortId(userId),
            );
          },

          // ===== 复制链接到剪贴板 =====
          async copyLink() {
            if (!this.shareUrl) return;
            try {
              await navigator.clipboard.writeText(this.shareUrl);
            } catch (_) {
              // 回退：选中文本
              try {
                const inp = this.shadow.$(".link-input");
                if (inp && inp.ele) {
                  inp.ele.select();
                  document.execCommand("copy");
                }
              } catch (e) {}
            }
            this.copied = true;
            clearTimeout(this._copyTimer);
            this._copyTimer = setTimeout(() => {
              this.copied = false;
            }, 1500);
          },

          // ===== 选中链接输入框文本 =====
          selectLinkInput(event) {
            const el = event && event.target;
            if (el && typeof el.select === "function") {
              try {
                el.select();
              } catch (_) {}
            }
          },

          // ===== 保存配置到 ever-cache =====
          async saveConfig() {
            this.saving = true;
            try {
              if (!this._storage) {
                const { storage } = await load(
                  "/gh/kirakiray/ever-cache/src/main.min.js",
                );
                this._storage = storage;
              }
              await this._storage.setItem("sa-config", {
                assistantName: this.assistantName,
                welcomeMsg: this.welcomeMsg,
                systemPrompt: this.systemPrompt,
                aiModel: this.aiModel,
              });
              this.genStatus = "配置已保存";
              console.log("[smart-assistant] 配置已保存", {
                assistantName: this.assistantName,
                welcomeMsg: this.welcomeMsg,
                promptLen: this.systemPrompt.length,
                aiModel: this.aiModel,
              });
            } catch (err) {
              console.error("[smart-assistant] 保存配置失败：", err);
              this.genStatus = "保存失败：" + (err.message || err);
            } finally {
              this.saving = false;
            }
          },

          // ===== 打开 AI 需求整理弹窗 =====
          openReqHelper() {
            this.reqHelperOpen = true;
            this.reqError = "";
          },

          // ===== 关闭弹窗（生成中则中止请求）=====
          closeReqHelper() {
            if (this._reqController) {
              try {
                this._reqController.abort();
              } catch (_) {}
              this._reqController = null;
            }
            this.reqGenerating = false;
            this.reqHelperOpen = false;
          },

          // ===== 调用 AI 整理需求（流式输出）=====
          async generateReqDoc() {
            const input = (this.reqInput || "").trim();
            if (!input) return;

            // 中止上一次未完成的请求
            if (this._reqController) {
              try {
                this._reqController.abort();
              } catch (_) {}
            }
            this._reqController = new AbortController();

            this.reqGenerating = true;
            this.reqOutput = "";
            this.reqError = "";

            try {
              const { assistant, model } = await this._pickAssistant();

              const systemMsg = {
                role: "system",
                content: `你是一位资深的 AI 助手需求分析师。用户会提供一些零散、混乱的想法，请你帮 ta 整理成一份结构清晰、可直接作为智能客服助手系统提示词的功能需求文档。

整理要求：
1. 提炼出助手的人设与职责定位
2. 明确语气风格、擅长领域、知识范围
3. 用条理清晰的分节/列表呈现
4. 补充用户未明确但合理的细节（如边界情况处理、兜底话术、安全与隐私注意事项）
5. 语言精炼实用，避免空话套话

请直接输出整理后的需求文档（可使用 Markdown），不要输出额外的解释或寒暄。`,
              };

              const chatOpts = {
                stream: true,
                messages: [systemMsg, { role: "user", content: input }],
                onStream: ({ content }) => {
                  this.reqOutput = content;
                },
                signal: this._reqController.signal,
              };
              if (model) chatOpts.model = model;

              await assistant.chat(chatOpts);
            } catch (err) {
              if (err && err.name === "AbortError") {
                // 用户主动取消，不视为错误
              } else {
                console.error("[smart-assistant] 需求整理失败：", err);
                const msg = err && err.message ? err.message : String(err);
                this.reqError = msg.includes("no api key available")
                  ? "尚未配置 AI Key，请先在 AI 密钥管理器中添加密钥。"
                  : "整理失败：" + msg;
              }
            } finally {
              this.reqGenerating = false;
              this._reqController = null;
            }
          },

          // ===== 把整理结果应用到功能需求文档 =====
          applyReqDoc() {
            const out = (this.reqOutput || "").trim();
            if (!out) return;
            this.systemPrompt = out;
            this.closeReqHelper();
          },

          // ===== 打开访客总览弹窗 =====
          openOverview() {
            this.overviewOpen = true;
            this.overviewError = "";
            // 若尚未生成过，自动触发一次
            if (!this.overviewOutput) {
              this.generateOverview();
            }
          },

          // ===== 关闭总览弹窗（生成中则中止）=====
          closeOverview() {
            if (this._overviewController) {
              try {
                this._overviewController.abort();
              } catch (_) {}
              this._overviewController = null;
            }
            this.overviewGenerating = false;
            this.overviewOpen = false;
          },

          // ===== 复制总览报告到剪贴板 =====
          async copyOverview() {
            const text = (this.overviewOutput || "").trim();
            if (!text) return;
            try {
              await navigator.clipboard.writeText(text);
            } catch (_) {
              // 回退：用 textarea 选中复制
              try {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
              } catch (e) {}
            }
            this.overviewCopied = true;
            clearTimeout(this._overviewCopyTimer);
            this._overviewCopyTimer = setTimeout(() => {
              this.overviewCopied = false;
            }, 1500);
          },

          // ===== 把所有访客对话格式化为文本喂给 AI =====
          _formatAllChats() {
            const customers = this.customers || [];
            return customers
              .map((c) => {
                const msgs = c.messages || [];
                if (msgs.length === 0) return null;
                const lines = msgs.map((m) => {
                  const role = m.role === "user" ? "访客" : "助手";
                  return `${role}: ${m.content}`;
                });
                return `【访客 ${this.shortId(c.userId)}】（共 ${msgs.length} 条消息）\n${lines.join("\n")}`;
              })
              .filter(Boolean)
              .join("\n\n---\n\n");
          },

          // ===== 调用 AI 生成全部访客对话总览（流式）=====
          async generateOverview() {
            const allChats = this._formatAllChats();
            if (!allChats) {
              this.overviewError = "暂无有效的访客对话记录可总结。";
              return;
            }

            // 中止上一次未完成的请求
            if (this._overviewController) {
              try {
                this._overviewController.abort();
              } catch (_) {}
            }
            this._overviewController = new AbortController();

            this.overviewGenerating = true;
            this.overviewOutput = "";
            this.overviewError = "";

            try {
              const { assistant, model } = await this._pickAssistant();

              const systemMsg = {
                role: "system",
                content: `你是一位专业的客服对话分析师。下面是多个访客与智能客服助手的完整对话记录。请你阅读后输出一份结构清晰的总结报告。

报告应包含以下板块（用 Markdown 标题/列表呈现）：
1. 总体概览（访客数量、总消息数、整体活跃度）
2. 每个访客的核心诉求与关注点（逐个列出）
3. 共性问题与高频话题（合并相似问题）
4. 未解决 / 需要人工跟进的事项（若有）
5. 客户情绪与满意度观察（整体倾向）

要求：
- 基于对话内容客观总结，不要编造不存在的信息
- 语言简洁、重点突出
- 访客标识使用提供的短 ID`,
              };

              const chatOpts = {
                stream: true,
                messages: [systemMsg, { role: "user", content: allChats }],
                onStream: ({ content }) => {
                  this.overviewOutput = content;
                },
                signal: this._overviewController.signal,
              };
              if (model) chatOpts.model = model;

              await assistant.chat(chatOpts);
            } catch (err) {
              if (err && err.name === "AbortError") {
                // 用户主动取消，不视为错误
              } else {
                console.error("[smart-assistant] 总览生成失败：", err);
                const msg = err && err.message ? err.message : String(err);
                this.overviewError = msg.includes("no api key available")
                  ? "尚未配置 AI Key，请先在 AI 密钥管理器中添加密钥。"
                  : "生成失败：" + msg;
              }
            } finally {
              this.overviewGenerating = false;
              this._overviewController = null;
            }
          },

          // ===== 生成分享链接 =====
          async handleGenLink() {
            if (this.generating) return;
            this.generating = true;
            this.genStatus = "准备中...";
            try {
              const self = this.parseSelfIdentity();
              if (!self) {
                throw new Error("无法识别当前应用的目录路径");
              }
              console.log("[smart-assistant] 当前应用身份：", self);

              const [fsMod, shareMgr] = await Promise.all([
                load("/nos/fs/main.js"),
                load("/lib/share-mgr.js"),
              ]);
              const { init } = fsMod;
              const { storage } = this._storage
                ? { storage: this._storage }
                : await load("/gh/kirakiray/ever-cache/src/main.min.js");
              this._storage = storage;
              const { publishApp, generateAppId } = shareMgr;

              const apps = (await storage.apps) || [];
              const { dirName } = self;
              const record =
                apps.find(
                  (a) => a.name === dirName || a.virtualDirName === dirName,
                ) ||
                apps.find((a) =>
                  a.dirName ? a.dirName.endsWith("/" + dirName) : false,
                ) ||
                null;
              console.log("[smart-assistant] 应用记录：", record);

              this.genStatus = "获取应用目录...";
              const rootDir = await init(self.namespace);
              const handle = await rootDir.get(dirName);

              let appId = (record && record.appId) || "";
              if (!appId) {
                appId = await generateAppId(dirName);
                if (record) {
                  record.appId = appId;
                  await storage.setItem("apps", apps);
                }
              }

              const app = {
                _handle: handle,
                _recordName: dirName,
                name: (record && record.name) || "smart-assistant",
                version: (record && record.version) || "0.1.0",
                desc: (record && record.desc) || "智能联络助手",
                icon: (record && record.icon) || "🤖",
                appId,
              };

              this.genStatus = "发布到分享网络...";
              const { shareUrl, payloadHash } = await publishApp(app, {
                appId,
                appParams: { host: this.myUserId },
                onProgress: ({ text }) => {
                  if (text) this.genStatus = text;
                },
              });

              if (record && payloadHash) {
                record.payloadHash = payloadHash;
                await storage.setItem("apps", apps);
              }

              this.shareUrl = shareUrl;
              this.genStatus = "链接已生成，点击输入框可全选复制";
              console.log("[smart-assistant] 分享链接已生成：", shareUrl);
            } catch (err) {
              console.error("[smart-assistant] 生成链接失败：", err);
              this.genStatus = "失败：" + (err.message || err);
            } finally {
              this.generating = false;
            }
          },

          parseSelfIdentity() {
            const m = location.pathname.match(
              /^\/\$(.+?)\/(.+?)\/client\/index\.html$/,
            );
            if (!m) return null;
            return { namespace: m[1], dirName: m[2] };
          },

          // ===== 访客消息处理 =====
          getOrCreateCustomer(userId, remoteUser) {
            let c = this.customers.find((x) => x.userId === userId);
            if (!c) {
              c = {
                userId,
                messages: [],
                thinking: false,
                online: true,
                _remote: remoteUser,
              };
              this.customers.push(c);
              console.log(
                "[smart-assistant] 新访客接入：",
                this.shortId(userId),
              );
            } else if (remoteUser) {
              c._remote = remoteUser;
              c.online = true;
            }
            return c;
          },

          async sendToCustomer(c, payload) {
            if (!c || !c._remote) {
              console.warn(
                "[smart-assistant] 无法发送：访客 remote 不可用",
                this.shortId(c && c.userId),
              );
              return;
            }
            try {
              const results = await c._remote.sendToService(
                SERVICE_ID,
                payload,
              );
              const ok =
                Array.isArray(results) &&
                results.some((r) => r && r.status === "ok");
              if (!ok) {
                console.warn(
                  "[smart-assistant] 发送给访客未送达：",
                  this.shortId(c.userId),
                  results,
                );
                c.online = false;
              } else {
                c.online = true;
              }
            } catch (err) {
              console.error(
                "[smart-assistant] 发送给访客异常：",
                this.shortId(c.userId),
                err,
              );
              c.online = false;
            }
          },

          // ===== 调用 AI 并回复访客 =====
          async handleVisitorChat(c, userText) {
            // 追加访客消息
            c.messages.push({ role: "user", content: userText });
            this.saveVisitorHistory(c);

            // 标记思考中
            c.thinking = true;
            // 先发 typing 通知
            await this.sendToCustomer(c, { kind: "typing" });

            try {
              const messages = [
                {
                  role: "system",
                  content:
                    this.systemPrompt ||
                    "你是一个友好的智能助手，请根据访客的问题给出有帮助的回答。",
                },
                ...c.messages.map((m) => ({
                  role: m.role,
                  content: m.content,
                })),
              ];

              const { assistant, model } = await this._pickAssistant();
              const chatOpts = { messages };
              if (model) chatOpts.model = model;

              console.log(
                "[smart-assistant] 调用 AI",
                assistant.providerName,
                this.aiModel === "auto" ? "(自动)" : this.aiModel,
                "访客：",
                this.shortId(c.userId),
                "消息数：",
                c.messages.length,
              );

              const { content } = await assistant.chat(chatOpts);

              c.messages.push({ role: "assistant", content });
              c.thinking = false;
              this.saveVisitorHistory(c);
              console.log(
                "[smart-assistant] AI 回复访客",
                this.shortId(c.userId),
                "：",
                content.slice(0, 80) + (content.length > 80 ? "..." : ""),
              );

              await this.sendToCustomer(c, { kind: "reply", text: content });
            } catch (err) {
              c.thinking = false;
              console.error(
                "[smart-assistant] AI 调用失败：",
                this.shortId(c.userId),
                err,
              );
              const errMsg = err && err.message ? err.message : String(err);
              const tip = errMsg.includes("no api key available")
                ? "助手主人尚未配置 AI Key，暂时无法回复。"
                : "助手处理消息时出错：" + errMsg;
              await this.sendToCustomer(c, { kind: "error", text: tip });
            }
          },
        },

        async attached() {
          // 加载存储、读取配置 + 恢复历史访客
          try {
            const { storage } = await load(
              "/gh/kirakiray/ever-cache/src/main.min.js",
            );
            this._storage = storage;

            // 先加载已配置的 AI Key 并填充可选模型列表
            // （必须在恢复 aiModel 之前，否则 select 找不到对应 option 会重置为"自动"）
            const aiMod = await load("/ai/main.js");
            this._apiKeys = aiMod.getApiKeys();
            this.refreshModelOptions();
            // 订阅 Key 变化，实时刷新可选模型
            this._unbindKeys = aiMod.onApiKeysChange((keys) => {
              this._apiKeys = keys;
              this.refreshModelOptions();
            });

            // 恢复配置（此时 modelOptions 已就绪，select 能正确选中）
            const cfg = await storage.getItem("sa-config");
            if (cfg) {
              this.assistantName = cfg.assistantName || "";
              this.welcomeMsg = cfg.welcomeMsg || "";
              this.systemPrompt = cfg.systemPrompt || "";
              this.aiModel = cfg.aiModel || "auto";
              console.log("[smart-assistant] 已读取保存的配置");
            }

            // 恢复历史访客列表
            await this.loadVisitorsHistory();
          } catch (err) {
            console.warn("[smart-assistant] 初始化存储失败：", err);
          }

          // 注册 P2P 服务
          const { getUser } = await load("/nos/user/main.js");
          const user = await getUser("default");
          this._user = user;
          this.myUserId = user.userId;
          console.log("[smart-assistant] Host userId：", user.userId);

          const self = this;
          this._svc = user.registerService(SERVICE_ID, {
            onMessage(data, ctx) {
              self.handleIncoming(data, ctx);
            },
          });

          // 监听访客上下线
          this._unbindConn = user.bind("remote_user_connected", (event) => {
            const uid = event && event.detail && event.detail.userId;
            if (!uid) return;
            const c = self.customers.find((x) => x.userId === uid);
            if (c && !c.online) c.online = true;
          });
          this._unbindDisc = user.bind("remote_user_disconnected", (event) => {
            const uid = event && event.detail && event.detail.userId;
            if (!uid) return;
            const c = self.customers.find((x) => x.userId === uid);
            if (c && c.online) c.online = false;
          });

          console.log("[smart-assistant] Host 服务已注册：", SERVICE_ID);
        },

        detached() {
          [this._unbindConn, this._unbindDisc, this._unbindKeys].forEach(
            (fn) => {
              try {
                fn && fn();
              } catch (_) {}
            },
          );
          if (this._svc) {
            try {
              this._svc.unregister();
            } catch (_) {}
          }
        },
      };
    };
  </script>
</template>
