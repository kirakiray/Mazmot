<template component>
  <style>
    :host {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      overflow: hidden;
    }

    /* ===== 顶部助手信息 ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--md-sys-color-surface-container);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        var(--md-sys-color-primary),
        var(--md-sys-color-tertiary)
      );
      color: var(--md-sys-color-on-primary);
      font-size: 18px;
      flex-shrink: 0;
    }
    .header-meta {
      flex: 1;
      min-width: 0;
    }
    .header-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-status {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--md-sys-color-outline);
    }
    .status-dot[type="online"] {
      background: #34a853;
    }
    .status-dot[type="connecting"] {
      background: #ea8a00;
    }
    .status-dot[type="offline"] {
      background: var(--md-sys-color-error);
    }

    /* ===== 消息列表 ===== */
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      animation: bubbleIn 0.2s ease-out;
    }
    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .msg-bubble[type="assistant"] {
      align-self: flex-start;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      border-bottom-left-radius: 4px;
    }
    .msg-bubble[type="user"] {
      align-self: flex-end;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-bottom-right-radius: 4px;
    }
    .msg-bubble[type="error"] {
      align-self: center;
      max-width: 90%;
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      font-size: 12px;
      text-align: center;
      border-radius: 10px;
      padding: 7px 12px;
    }

    .typing {
      align-self: flex-start;
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      background: var(--md-sys-color-surface-container);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--md-sys-color-on-surface-variant);
      animation: typingBounce 1.2s infinite;
    }
    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }
    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes typingBounce {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
    }
    .empty-state n-icon {
      font-size: 56px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* ===== 输入区 ===== */
    .composer {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container);
      flex-shrink: 0;
    }
    .composer textarea {
      flex: 1;
      min-height: 38px;
      max-height: 120px;
      padding: 9px 14px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 20px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
      line-height: 1.4;
      resize: none;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.15s ease;
    }
    .composer textarea:focus {
      border-color: var(--md-sys-color-primary);
    }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }
    .send-btn:hover:not(:disabled) {
      opacity: 0.9;
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .banner {
      padding: 8px 14px;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    /* 宽屏下居中收窄聊天列，避免气泡拉伸过宽 */
    @media (min-width: 768px) {
      :host {
        align-items: center;
      }
      .header,
      .messages,
      .composer,
      .banner {
        width: 100%;
        max-width: 720px;
      }
      .messages {
        border-left: 1px solid var(--md-sys-color-outline-variant);
        border-right: 1px solid var(--md-sys-color-outline-variant);
      }
    }
  </style>

  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/mz/comps/o-md/o-md.html"></l-m>

  <div class="header">
    <div class="avatar">
      <n-icon icon="mdi:robot-outline"></n-icon>
    </div>
    <div class="header-meta">
      <div class="header-name">{{assistantName}}</div>
      <div class="header-status">
        <span
          class="status-dot"
          attr:type="connected ? 'online' : (connecting ? 'connecting' : 'offline')"
        ></span>
        <span>
          {{connected ? '在线' : (connecting ? '连接中...' : '已断开')}}
          <o-if :value="thinking">· 助手思考中</o-if>
        </span>
      </div>
    </div>
  </div>

  <o-if :value="!connected && !connecting">
    <div class="banner">未能连接到助手，请稍后重试或联系分享者</div>
  </o-if>

  <div class="messages" id="msgBox">
    <o-if :value="messages.length === 0 && connected">
      <div class="empty-state">
        <n-icon icon="mdi:chat-question-outline"></n-icon>
        <div>发送消息开始与助手对话</div>
      </div>
    </o-if>

    <o-fill :value="messages">
      <o-if :value="$data.type === 'assistant'">
        <div class="msg-bubble" type="assistant">
          <o-md>{{$data.text}}</o-md>
        </div>
      </o-if>
      <o-if :value="$data.type !== 'assistant'">
        <div class="msg-bubble" attr:type="$data.type">
          {{$data.text}}
        </div>
      </o-if>
    </o-fill>

    <o-if :value="thinking">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </o-if>
  </div>

  <div class="composer">
    <textarea
      sync:value="inputText"
      attr:placeholder="connected ? '输入消息...' : '正在连接...'"
      attr:disabled="!connected"
      on:keydown="onComposerKey"
    ></textarea>
    <button
      class="send-btn"
      attr:disabled="!connected || !inputText.trim()"
      on:click="sendMessage"
    >
      <n-icon icon="mdi:send"></n-icon>
    </button>
  </div>

  <script>
    export default async ({ load }) => {
      const SERVICE_ID = "smart-assistant";

      return {
        tag: "sa-customer-page",

        data: {
          assistantName: "智能助手",
          inputText: "",
          messages: [],
          connected: false,
          connecting: true,
          thinking: false,
        },

        watch: {
          messages() {
            this.saveHistory();
          },
        },

        proto: {
          // ===== 发送消息 =====
          async sendMessage() {
            const text = (this.inputText || "").trim();
            if (!text || !this.connected) return;

            // 本地展示
            this.messages.push({ type: "user", text });
            this.inputText = "";
            this.thinking = true;
            this.scrollToBottom();

            try {
              const results = await this._remote.sendToService(SERVICE_ID, {
                kind: "chat",
                text,
              });
              const ok = Array.isArray(results) &&
                results.some((r) => r && r.status === "ok");
              if (!ok) {
                this.thinking = false;
                this.messages.push({
                  type: "error",
                  text: "消息未送达，助手可能已离线",
                });
                this.connected = false;
                this.scrollToBottom();
              }
            } catch (err) {
              console.error("[smart-assistant-customer] 发送失败：", err);
              this.thinking = false;
              this.messages.push({
                type: "error",
                text: "发送失败：" + (err.message || err),
              });
              this.scrollToBottom();
            }
          },

          // ===== 回车发送（Shift+Enter 换行）=====
          onComposerKey(event) {
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault();
              this.sendMessage();
            }
          },

          // ===== 接收 host 消息 =====
          handleIncoming(data) {
            if (!data || typeof data !== "object") return;
            const { kind } = data;
            console.log("[smart-assistant-customer] 收到消息 kind=" + kind);

            if (kind === "welcome") {
              if (data.name) this.assistantName = data.name;
              if (data.message) {
                this.messages.push({ type: "assistant", text: data.message });
                this.scrollToBottom();
              }
            } else if (kind === "typing") {
              this.thinking = true;
            } else if (kind === "reply") {
              this.thinking = false;
              this.messages.push({ type: "assistant", text: data.text || "" });
              this.scrollToBottom();
            } else if (kind === "error") {
              this.thinking = false;
              this.messages.push({
                type: "error",
                text: data.text || "助手出错",
              });
              this.scrollToBottom();
            }
          },

          scrollToBottom() {
            const box = this.shadow.$("#msgBox");
            if (box && box.ele) {
              setTimeout(() => {
                box.ele.scrollTop = box.ele.scrollHeight;
              }, 30);
            }
          },

          // ===== 保存对话历史到本地 =====
          async saveHistory() {
            if (!this._storage || !this._chatKey) return;
            try {
              await this._storage.setItem(
                this._chatKey,
                JSON.parse(JSON.stringify(this.messages)),
              );
            } catch (err) {
              console.warn("[smart-assistant-customer] 保存历史失败：", err);
            }
          },
        },

        async attached() {
          // 直接从 URL 读取 host 参数（比属性绑定更可靠，避免时序问题）
          const sp = new URLSearchParams(location.search);
          const hostUserId = sp.get("host") || "";
          console.log(
            "[smart-assistant-customer] 启动，目标 host：",
            hostUserId,
          );

          // 加载存储并恢复历史对话（即使连接失败也能看到历史）
          try {
            const { storage } = await load(
              "/gh/kirakiray/ever-cache/src/main.min.js",
            );
            this._storage = storage;
            this._chatKey = "sa-chat-" + hostUserId;
            const history = await storage.getItem(this._chatKey);
            if (Array.isArray(history) && history.length) {
              this.messages = history;
              console.log(
                "[smart-assistant-customer] 恢复历史消息",
                history.length,
                "条",
              );
              this.scrollToBottom();
            }
          } catch (err) {
            console.warn("[smart-assistant-customer] 加载历史失败：", err);
          }

          try {
            const { getUser } = await load("/nos/user/main.js");
            const user = await getUser("default");
            this._user = user;

            // 注册服务接收 host 回复
            const self = this;
            this._svc = user.registerService(SERVICE_ID, {
              onMessage(data) {
                self.handleIncoming(data);
              },
            });

            // 连接 host
            this.connecting = true;
            const remote = await user.connectUser(hostUserId);
            this._remote = remote;

            const online = await user.isRemoteUserOnline(hostUserId);
            if (!online) {
              console.warn("[smart-assistant-customer] host 不在线");
              this.connecting = false;
              this.connected = false;
              return;
            }

            this.connected = true;
            this.connecting = false;
            console.log("[smart-assistant-customer] 已连接 host");

            // 发 hello 让 host 感知并推送欢迎信息
            const results = await remote.sendToService(SERVICE_ID, {
              kind: "hello",
            });
            const ok = Array.isArray(results) &&
              results.some((r) => r && r.status === "ok");
            if (!ok) {
              console.warn(
                "[smart-assistant-customer] hello 未送达：",
                results,
              );
            }

            // 监听 host 断线
            this._unbindDisc = user.bind(
              "remote_user_disconnected",
              (event) => {
                const uid = event && event.detail && event.detail.userId;
                if (uid === hostUserId) {
                  console.warn("[smart-assistant-customer] host 已断开");
                  this.connected = false;
                }
              },
            );
          } catch (err) {
            console.error("[smart-assistant-customer] 连接失败：", err);
            this.connecting = false;
            this.connected = false;
          }
        },

        detached() {
          if (this._unbindDisc) {
            try {
              this._unbindDisc();
            } catch (_) {}
          }
          if (this._svc) {
            try {
              this._svc.unregister();
            } catch (_) {}
          }
        },
      };
    };
  </script>
</template>
