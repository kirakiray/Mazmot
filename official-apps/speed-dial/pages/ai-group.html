<template page>
  <style>
    :host {
      display: block;
    }

    .dialog-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
    }

    .analyzing {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px 0;
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .spin {
      font-size: 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .result-count {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .result-tip {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .suggestion-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    /* 固定高度原生输入框：多行建议内部滚动，不撑高弹窗 */
    .suggest-input {
      flex: 1;
      min-width: 0;
      height: 64px;
      box-sizing: border-box;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid
        rgb(from var(--md-sys-color-on-surface-variant) r g b / 0.4);
      background: none;
      color: var(--md-sys-color-on-surface);
      font: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    .suggest-input:focus {
      border-color: var(--md-sys-color-primary);
    }

    /* 分组列表固定高度内部滚动，不撑高弹窗 */
    .group-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .group-list o-fill {
      display: contents;
    }

    .group-block {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid
        rgb(from var(--md-sys-color-on-surface) r g b / 0.12);
      transition: opacity 0.15s ease;
    }

    .group-block.unchecked {
      opacity: 0.5;
    }

    .group-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .group-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }

    .group-count {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .group-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 8px;
    }

    .group-items o-fill {
      display: contents;
    }

    .group-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 0 3px 6px;
      min-width: 0;
    }

    .item-title {
      flex: 0 1 auto;
      min-width: 0;
      font-size: 13px;
      color: var(--md-sys-color-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-host {
      flex: 0 1 auto;
      min-width: 0;
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dlg-page::part(panel) {
      width: min(520px, 100%);
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/checkbox/checkbox.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/dialog/dialog.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <st-dialog class="dlg-page" sync:open="dialogOpen" auto-close>
    <h2 slot="headline"><locale-text><span lang="cn">AI 自动分组</span><span lang="en">AI Auto Grouping</span></locale-text></h2>

    <div class="dialog-body">
      <o-if :value="phase === 'analyzing'">
        <div class="analyzing">
          <n-icon icon="mdi:loading" class="spin"></n-icon>
          <x-if :value="suggestion"><locale-text><span lang="cn">AI 正在按你的建议重新分组…</span><span lang="en">AI is regrouping with your suggestion…</span></locale-text></x-if>
          <x-if :value="!suggestion">
            <locale-text attr:data-count="dialCount"><span lang="cn">AI 正在为 {count} 个网址划分分组…</span><span lang="en">AI is grouping {count} sites…</span></locale-text>
          </x-if>
        </div>
      </o-if>

      <o-if :value="phase === 'review'">
        <div class="result-head">
          <span class="result-count">
            <locale-text attr:data-groups="previewGroups.length" attr:data-selected="selectedGroupCount"><span lang="cn">分为 {groups} 组 · 已选 {selected} 组</span><span lang="en">{groups} groups · {selected} selected</span></locale-text>
          </span>
          <span class="result-tip">
            <x-if :value="totalCount > dialCount">
              <locale-text attr:data-count="dialCount" attr:data-total="totalCount"><span lang="cn">仅分析前 {count} 条（共 {total} 条）</span><span lang="en">Only the first {count} of {total} analyzed</span></locale-text>
            </x-if>
            <x-if :value="totalCount <= dialCount"><locale-text><span lang="cn">未勾选的分组保持原样</span><span lang="en">Unchecked groups stay unchanged</span></locale-text></x-if>
          </span>
        </div>
        <div class="group-list">
          <o-fill :value="previewGroups" fill-key="name">
            <div class="group-block" class:unchecked="!$data.checked">
              <div class="group-head">
                <st-checkbox attr:checked="$data.checked" on:change="$host.onGroupCheck($event, $data)"></st-checkbox>
                <span class="group-name">{{$data.name}}</span>
                <span class="group-count">
                  <locale-text attr:data-count="$data.items.length"><span lang="cn">{count} 个</span><span lang="en">{count}</span></locale-text>
                </span>
              </div>
              <div class="group-items">
                <o-fill :value="$data.items" fill-key="id">
                  <div class="group-item">
                    <span class="item-title">{{$data.title}}</span>
                    <span class="item-host">{{$data.host}}</span>
                  </div>
                </o-fill>
              </div>
            </div>
          </o-fill>
        </div>
        <div class="suggestion-row">
          <textarea
            class="suggest-input"
            sync:value="suggestion"
            attr:placeholder="t('suggestPh')"
          ></textarea>
          <st-button variant="outlined" style="font-size: 13px" on:click="reGroup">
            <n-icon icon="mdi:refresh" slot="prefix"></n-icon>
            <span><locale-text><span lang="cn">重新分组</span><span lang="en">Regroup</span></locale-text></span>
          </st-button>
        </div>
      </o-if>
    </div>

    <div slot="actions">
      <o-if :value="phase === 'analyzing'">
        <st-button variant="text" on:click="dialogOpen = false"><locale-text><span lang="cn">取消</span><span lang="en">Cancel</span></locale-text></st-button>
      </o-if>
      <o-if :value="phase === 'review'">
        <st-button variant="text" on:click="dialogOpen = false"><locale-text><span lang="cn">取消</span><span lang="en">Cancel</span></locale-text></st-button>
        <st-button on:click="applyGroups"><locale-text><span lang="cn">应用分组</span><span lang="en">Apply</span></locale-text></st-button>
      </o-if>
    </div>
  </st-dialog>

  <script>
    // 单次送入 AI 分类的网址上限，超出部分保持原分组
    const MAX_CLASSIFY = 200;

    const SYSTEM_PROMPT =
      "你是书签分类助手，负责帮用户把收藏的网址整理成简洁合理的分组。";

    const buildPrompt = (dials, suggestion = "") => {
      const lines = [
        "请把下面收藏的网址整理成若干分组，输出严格的 JSON 数组，每项格式：",
        '{"id":"原样返回的id","group":"分组名"}',
        "要求：",
        "1. 分组名用简短中文（2~6 个字），如「开发工具」「社交娱乐」「新闻资讯」「购物」「学习」等，能概括该组网址的共同主题；",
        "2. 分组数量控制在 2~8 个，把主题相近的网址归到同一组，不要几乎每个网址单独一组；",
        "3. 每个网址必须且只能归入一个分组，id 必须原样返回，不得修改或省略；",
        "4. 只输出 JSON 数组本身，不要输出任何其它文字或代码块标记。",
      ];
      if (suggestion) {
        // 用户填写的建议优先级最高，冲突时覆盖默认规则
        lines.splice(
          4,
          0,
          "用户对分组的额外要求（优先级最高，与上面规则冲突时以此为准）：",
          `<建议开始>`,
          suggestion,
          `<建议结束>`,
        );
      }
      lines.push(
        "",
        "<网址列表开始>",
        JSON.stringify(dials.map(({ id, title, url }) => ({ id, title, url }))),
        "<网址列表结束>",
      );
      return lines.join("\n");
    };

    // 解析 AI 回复：容错代码块包裹，校验 id 在传入列表内、分组名非空，按 id 去重
    const parseGroups = (reply, validIds) => {
      const map = new Map();
      const text = String(reply || "")
        .replace(/```(?:json)?/gi, "")
        .trim();
      const match = text.match(/\[[\s\S]*\]/);
      if (!match) return map;

      let list;
      try {
        list = JSON.parse(match[0]);
      } catch {
        return map;
      }
      if (!Array.isArray(list)) return map;

      for (const item of list) {
        const id = typeof item?.id === "string" ? item.id : "";
        const group =
          typeof item?.group === "string"
            ? item.group.trim().slice(0, 20)
            : "";
        if (!id || !group || !validIds.has(id) || map.has(id)) continue;
        map.set(id, group);
      }
      return map;
    };

    const hostOf = (url) => {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch {
        return url;
      }
    };

    export default async ({ load }) => {
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js",
      );
      const { getLocaleText } = await load(
        "/nos/locale-text/get-locale-text.js",
      );

      // 属性类文案（placeholder 等）翻译表；模板正文文案用 <locale-text> 组件
      const L10N = {
        suggestPh: {
          cn: "填写分组建议，如：分成工作、娱乐、学习三类",
          en: "Describe your grouping preference, e.g. work, fun, study",
        },
      };
      const t = (key) => {
        const item = L10N[key];
        return item ? getLocaleText(item) : key;
      };

      let getAssistant = null;
      const ensureAssistant = async () => {
        if (!getAssistant) {
          ({ getAssistant } = await load("/mz/ai/main.js"));
        }
        return getAssistant();
      };

      return {
        data: {
          dialogOpen: false,
          phase: "analyzing", // analyzing 分析中 / review 预览确认
          dialCount: 0, // 实际送分析的条数
          totalCount: 0, // 宿主传入的总条数
          dialList: [], // 送分析的原始列表（plainDials 截断后），供重新分组复用
          suggestion: "", // 用户填写的分组建议
          previewGroups: [], // [{ name, items: [{ id, title, host }], checked }]
        },

        proto: {
          t(key) {
            return t(key);
          },

          // st-checkbox 勾选后回写数据
          onGroupCheck(event, item) {
            item.checked = event.target.hasAttribute("checked");
          },

          get selectedGroupCount() {
            return this.previewGroups.filter((g) => g.checked).length;
          },

          // 由宿主页面调用：接收 plainDials，重置状态并立即开始分析
          openGroup(dials) {
            const list = Array.isArray(dials)
              ? dials.slice(0, MAX_CLASSIFY)
              : [];
            this.totalCount = Array.isArray(dials) ? dials.length : 0;
            this.phase = "analyzing";
            this.previewGroups = [];
            this.dialList = list;
            this.suggestion = "";
            this.dialCount = list.length;
            this.dialogOpen = true;
            this.analyze(list);
          },

          async analyze(list, suggestion = "") {
            try {
              const assistant = await ensureAssistant();
              const { content: reply } = await assistant.chat({
                thinking: false,
                messages: [
                  { role: "system", content: SYSTEM_PROMPT },
                  { role: "user", content: buildPrompt(list, suggestion) },
                ],
              });

              if (!this.dialogOpen) return; // 用户已关闭弹窗，丢弃结果
              const map = parseGroups(
                reply,
                new Set(list.map((d) => d.id)),
              );

              // 聚合成预览分组：AI 未覆盖的网址保持原分组
              const buckets = new Map();
              for (const dial of list) {
                const name = map.get(dial.id) || dial.group || "未分组";
                if (!buckets.has(name)) buckets.set(name, []);
                buckets.get(name).push({
                  id: dial.id,
                  title: dial.title,
                  host: hostOf(dial.url),
                });
              }
              this.previewGroups = [...buckets].map(([name, items]) => ({
                name,
                items,
                checked: true,
              }));
              this.phase = "review";
            } catch (err) {
              if (err?.message === "no api key available") {
                toast({
                  message: getLocaleText({
                    cn: "未配置 AI Key，请先在「AI 密钥管理器」应用中添加",
                    en: "No AI key configured. Add one in the \"AI Key Manager\" app first",
                  }),
                  color: "error",
                });
              } else {
                toast({
                  message: getLocaleText(
                    { cn: "分组失败：{msg}", en: "Grouping failed: {msg}" },
                    { msg: err?.message || err },
                  ),
                  color: "error",
                });
              }
              this.dialogOpen = false;
            }
          },

          // 按用户填写的建议重新分组（覆盖当前预览结果）
          reGroup() {
            const suggestion = this.suggestion.trim();
            if (!suggestion) {
              toast({
                message: getLocaleText({
                  cn: "请先填写分组建议",
                  en: "Please describe your grouping preference first",
                }),
                color: "error",
              });
              return;
            }
            this.phase = "analyzing";
            this.previewGroups = [];
            this.analyze(this.dialList, suggestion);
          },

          applyGroups() {
            const items = [];
            for (const group of this.previewGroups) {
              if (!group.checked) continue;
              for (const item of group.items) {
                items.push({ id: item.id, group: group.name });
              }
            }
            if (!items.length) {
              toast({
                message: getLocaleText({
                  cn: "请至少勾选一个分组",
                  en: "Please select at least one group",
                }),
                color: "error",
              });
              return;
            }
            this.emit("ai-group-apply", {
              data: { items },
              bubbles: true,
              composed: true, // 穿透 Shadow DOM，宿主才能监听
            });
            this.dialogOpen = false;
          },
        },
      };
    };
  </script>
</template>
