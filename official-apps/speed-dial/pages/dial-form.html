<template page>
  <style>
    :host {
      display: block;
    }

    .dialog-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .dialog-form st-input {
      width: 100%;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-label {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      margin-right: 4px;
    }

    .color-dot {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      cursor: pointer;
    }

    .color-dot.active {
      border-color: var(--md-sys-color-on-surface);
    }

    .icon-row st-switch {
      margin-left: auto;
    }

    .icon-preview.no-bg {
      color: var(--md-sys-color-on-surface-variant);
    }

    .icon-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .icon-preview {
      min-width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
    }

    .icon-preview n-icon {
      font-size: 22px;
    }

    .icon-search {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 36px;
      box-sizing: border-box;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid
        rgb(from var(--md-sys-color-on-surface-variant) r g b / 0.4);
      background: none;
      color: var(--md-sys-color-on-surface);
      font: inherit;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--md-sys-color-primary);
    }

    /* 图标结果网格固定高度内部滚动 */
    .icon-grid {
      max-height: 168px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      padding: 2px;
    }

    .icon-grid o-fill {
      display: contents;
    }

    .icon-option {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border-radius: 10px;
      border: 1px solid transparent;
      background-color: rgb(
        from var(--md-sys-color-surface-variant) r g b / 0.5
      );
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
    }

    .icon-option:hover {
      background-color: var(--md-sys-color-surface-variant);
    }

    .icon-option.active {
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-primary);
    }

    .tip {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.6;
    }
    .dlg-form::part(panel) {
      width: min(460px, 100%);
    }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
    .field-label:not(:first-child) {
      margin-top: 8px;
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/dialog/dialog.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/switch/switch.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <st-dialog class="dlg-form" sync:open="dialogOpen" auto-close>
    <h2 slot="headline">
      <x-if :value="editing"><locale-text><span lang="cn">编辑网址</span><span lang="en">Edit Site</span></locale-text></x-if>
      <x-if :value="!editing"><locale-text><span lang="cn">添加网址</span><span lang="en">Add Site</span></locale-text></x-if>
    </h2>
    <div class="dialog-form">
      <label class="field-label"><locale-text><span lang="cn">网址</span><span lang="en">URL</span></locale-text></label>
      <st-input sync:value="form.url" placeholder="example.com"></st-input>
      <label class="field-label"><locale-text><span lang="cn">标题</span><span lang="en">Title</span></locale-text></label>
      <st-input sync:value="form.title" attr:placeholder="t('titlePh')"></st-input>
      <label class="field-label"><locale-text><span lang="cn">分组</span><span lang="en">Group</span></locale-text></label>
      <st-input sync:value="form.group" attr:placeholder="t('groupPh')"></st-input>
      <div class="color-row">
        <span class="color-label"><locale-text><span lang="cn">图标颜色</span><span lang="en">Icon Color</span></locale-text></span>
        <x-if :value="noBg === 'off'">
          <o-fill :value="palette">
            <button
              class="color-dot"
              class:active="$host.form.color === $data"
              :style.background="$data"
              on:click="$host.form.color = $data"
            ></button>
          </o-fill>
        </x-if>
      </div>
      <div class="icon-row">
        <span class="color-label"><locale-text><span lang="cn">网址图标</span><span lang="en">Site Icon</span></locale-text></span>
        <div
          class="icon-preview"
          class:no-bg="noBg === 'on'"
          :style.background="noBg === 'on' ? 'transparent' : form.color"
        >
          <x-if :value="form.icon">
            <n-icon :icon="form.icon"></n-icon>
          </x-if>
          <x-if :value="!form.icon">{{previewInitial}}</x-if>
        </div>
        <o-if :value="!!form.icon">
          <st-button variant="text" style="font-size: 12px" on:click="form.icon = ''">
            <locale-text><span lang="cn">恢复默认</span><span lang="en">Reset</span></locale-text>
          </st-button>
        </o-if>
        <st-switch
          attr:checked="noBg === 'on'"
          on:change="toggleNoBg($event)"
        ><locale-text><span lang="cn">无底色</span><span lang="en">No Background</span></locale-text></st-switch>
      </div>
      <div class="icon-search">
        <input
          class="search-input"
          sync:value="iconQuery"
          attr:placeholder="t('iconSearchPh')"
          on:keydown="onIconKey($event)"
        />
        <st-button
          variant="outlined"
          style="font-size: 13px"
          attr:disabled="searching"
          on:click="searchIcons()"
        >
          <x-if :value="searching"><locale-text><span lang="cn">搜索中…</span><span lang="en">Searching…</span></locale-text></x-if>
          <x-if :value="!searching"><locale-text><span lang="cn">搜索图标</span><span lang="en">Search Icons</span></locale-text></x-if>
        </st-button>
      </div>
      <o-if :value="iconResults.length > 0">
        <div class="icon-grid">
          <o-fill :value="iconResults">
            <button
              class="icon-option"
              class:active="$host.form.icon === $data"
              attr:title="$data"
              on:click="$host.form.icon = $data"
            >
              <n-icon :icon="$data"></n-icon>
            </button>
          </o-fill>
        </div>
      </o-if>
      <p class="tip"><locale-text><span lang="cn">点击卡片即在新标签页打开，长按拖拽可调整顺序。</span><span lang="en">Click a card to open it in a new tab; drag to reorder.</span></locale-text></p>
    </div>
    <div slot="actions">
      <st-button variant="text" on:click="dialogOpen = false"><locale-text><span lang="cn">取消</span><span lang="en">Cancel</span></locale-text></st-button>
      <st-button on:click="save"><locale-text><span lang="cn">保存</span><span lang="en">Save</span></locale-text></st-button>
    </div>
  </st-dialog>

  <script>
    // 从 URL 提取图标搜索关键词（取主域名的倒数第二段，如 gist.github.com → github）
    const iconKeyword = (url) => {
      const value = (url || "").trim();
      if (!value) return "";
      try {
        const full = /^[a-z][a-z0-9+.-]*:\/\//i.test(value)
          ? value
          : `https://${value}`;
        const parts = new URL(full).hostname.replace(/^www\./, "").split(".");
        // 单段（如 localhost）直接用；多段取倒数第二段（主域名）
        return parts.length >= 2 ? parts[parts.length - 2] : parts[0];
      } catch {
        return "";
      }
    };

    export default async ({ load }) => {
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js",
      );
      const { getLocaleText } = await load(
        "/nos/locale-text/get-locale-text.js",
      );
      const { PALETTE } = await load("./palette.js");

      // 属性类文案（placeholder 等）翻译表；模板正文文案用 <locale-text> 组件
      const L10N = {
        titlePh: { cn: "留空则自动使用域名", en: "Leave blank to use the domain name" },
        groupPh: { cn: "留空为「未分组」", en: "Leave blank for \"Ungrouped\"" },
        iconSearchPh: { cn: "搜索图标，如 github、video、购物", en: "Search icons, e.g. github, video, shopping" },
      };
      const t = (key) => {
        const item = L10N[key];
        return item ? getLocaleText(item) : key;
      };

      return {
        data: {
          dialogOpen: false,
          editingId: "",
          palette: PALETTE,
          form: {
            url: "",
            title: "",
            group: "",
            color: PALETTE[0],
            icon: "",
          },
          iconQuery: "",
          iconResults: [], // iconify 图标名数组（如 "mdi:github"）
          searching: false,
          noBg: "off", // "on" = 无底色（color 落库空串）
        },

        proto: {
          t(key) {
            return t(key);
          },

          get editing() {
            return !!this.editingId;
          },

          // 图标为空时的预览首字母（标题优先，其次主域名）
          get previewInitial() {
            const title = this.form.title.trim();
            if (title) return title.slice(0, 1).toUpperCase();
            const keyword =
              iconKeyword(this.form.url) ||
              this.form.url.trim().slice(0, 1) ||
              "?";
            return keyword.slice(0, 1).toUpperCase();
          },

          // 由宿主页面调用：id 非空为编辑模式；新增模式按 count 轮换取默认色
          openForm({
            id = "",
            url = "",
            title = "",
            group = "",
            color,
            icon = "",
            count = 0,
          }) {
            this.editingId = id;
            this.form.url = url;
            this.form.title = title;
            this.form.group = group;
            this.form.color = color || PALETTE[count % PALETTE.length];
            this.noBg = color ? "off" : "on"; // 编辑无底色收藏时默认开启
            this.form.icon = icon;
            this.iconQuery = "";
            this.iconResults = [];
            this.dialogOpen = true;

            // 编辑已有网址时按主域名自动搜一次图标，方便直接选品牌标
            const keyword = iconKeyword(url);
            if (keyword) {
              this.iconQuery = keyword;
              this.searchIcons(true);
            }
          },

          toggleNoBg(event) {
            this.noBg = event.target.hasAttribute("checked") ? "on" : "off";
          },

          onIconKey(event) {
            if (event.key === "Enter") this.searchIcons();
          },

          // 搜索 iconify 图标；silent 为 true 时静默失败（自动搜索用）
          async searchIcons(silent = false) {
            const q = this.iconQuery.trim();
            if (!q) {
              if (!silent) {
                toast({
                  message: getLocaleText({
                    cn: "请输入图标关键词",
                    en: "Please enter an icon keyword",
                  }),
                  color: "error",
                });
              }
              return;
            }
            this.searching = true;
            try {
              const res = await fetch(
                `https://api.iconify.design/search?query=${encodeURIComponent(q)}&limit=32`,
              );
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const { icons = [] } = await res.json();
              this.iconResults = icons.slice(0, 32);
              if (!icons.length && !silent) {
                toast({
                  message: getLocaleText({
                    cn: "未找到相关图标",
                    en: "No matching icons found",
                  }),
                });
              }
            } catch (err) {
              if (!silent) {
                toast({
                  message: getLocaleText(
                    { cn: "图标搜索失败：{msg}", en: "Icon search failed: {msg}" },
                    { msg: err?.message || err },
                  ),
                  color: "error",
                });
              }
            } finally {
              this.searching = false;
            }
          },

          save() {
            if (!this.form.url.trim()) {
              toast({
                message: getLocaleText({
                  cn: "请输入网址",
                  en: "Please enter a URL",
                }),
                color: "error",
              });
              return;
            }
            this.emit("dial-save", {
              data: {
                id: this.editingId,
                url: this.form.url,
                title: this.form.title,
                group: this.form.group,
                color: this.noBg === "on" ? "" : this.form.color,
                icon: this.form.icon,
              },
              bubbles: true,
              composed: true,
            });
            this.dialogOpen = false;
          },
        },
      };
    };
  </script>
</template>
