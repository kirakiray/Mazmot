<template page>
  <style>
    :host {
      display: block;
    }

    .dialog-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }

    .drop-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 2px dashed transparent;
      transition:
        border-color 0.15s ease,
        background-color 0.15s ease;
    }

    .drop-area.drag-over {
      border-color: var(--md-sys-color-primary);
      background-color: rgb(
        from var(--md-sys-color-primary) r g b / 0.06
      );
    }

    .input-label {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* 固定高度原生输入框：超长内容在内部滚动，不撑高弹窗 */
    .plain-input {
      width: 100%;
      height: 240px;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid
        rgb(from var(--md-sys-color-on-surface-variant) r g b / 0.4);
      background: none;
      color: var(--md-sys-color-on-surface);
      font: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    .plain-input:focus {
      border-color: var(--md-sys-color-primary);
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .file-name {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px;
    }

    .tip {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.6;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .result-count {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 320px;
      overflow-y: auto;
    }

    .result-list o-fill {
      display: contents;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 12px;
    }

    .result-item:hover {
      background-color: rgb(
        from var(--md-sys-color-surface-variant) r g b / 0.5
      );
    }

    .result-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .result-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-url {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #file-input {
      display: none;
    }
    .dlg-page::part(panel) {
      width: min(560px, 100%);
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@1.0.7/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@1.0.7/packages/checkbox/checkbox.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@1.0.7/packages/dialog/dialog.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>

  <st-dialog class="dlg-page" sync:open="dialogOpen" auto-close>
    <h2 slot="headline">AI 导入网址</h2>

    <div class="dialog-body">
      <o-if :value="phase === 'input'">
        <div
          class="drop-area"
          class:drag-over="dragOver"
          on:dragover="onDragOver($event)"
          on:dragleave="dragOver = false"
          on:drop="onDrop($event)"
        >
          <span class="input-label">文本内容</span>
          <textarea
            class="plain-input"
            sync:value="inputText"
            placeholder="粘贴任意文本：笔记、聊天记录、网页内容、书签导出文件……AI 会自动找出其中值得收藏的网址"
          ></textarea>
          <div class="file-row">
            <st-button variant="outlined" style="font-size: 13px" on:click="pickFile">
              <n-icon icon="mdi:file-upload-outline" slot="prefix"></n-icon>
              <span>选择文件</span>
            </st-button>
            <span class="file-name" attr:title="fileName">{{fileName}}</span>
          </div>
          <p class="tip">
            支持粘贴文本、拖拽文件到此处，或选择任意文本类文件（.txt / .md /
            .html / .json 等）；文件内容仅在本地读取后交由 AI 识别。
          </p>
        </div>
      </o-if>

      <o-if :value="phase === 'review'">
        <div class="result-head">
          <span class="result-count"
            >识别到 {{candidates.length}} 个 · 已选 {{selectedCount}} 个</span
          >
          <st-button variant="text" style="font-size: 12px" on:click="toggleAll">
            {{allChecked ? '全不选' : '全选'}}
          </st-button>
        </div>
        <div class="result-list">
          <o-fill :value="candidates" fill-key="url">
            <div class="result-item">
              <st-checkbox attr:checked="$data.checked" on:change="$host.onUrlCheck($event, $data)"></st-checkbox>
              <div class="result-info">
                <div class="result-title">{{$data.title}}</div>
                <div class="result-url">{{$data.url}}</div>
              </div>
            </div>
          </o-fill>
        </div>
      </o-if>
    </div>

    <div slot="actions">
      <o-if :value="phase === 'input'">
        <st-button variant="text" on:click="dialogOpen = false">取消</st-button>
        <st-button style="font-size: 13px" attr:disabled="analyzing"
          on:click="analyze"
        >
          {{analyzing ? 'AI 识别中…' : 'AI 识别'}}
        </st-button>
      </o-if>
      <o-if :value="phase === 'review'">
        <st-button variant="text" on:click="back">返回</st-button>
        <st-button on:click="confirmImport">添加所选</st-button>
      </o-if>
    </div>
  </st-dialog>

  <input type="file" id="file-input" on:change="onFileChange" />

  <script>
    // 送入 AI 的内容上限（字符），防止超长文本拖垮请求
    const MAX_CONTENT_CHARS = 50000;

    const SYSTEM_PROMPT =
      "你是网址提取助手，负责从任意文本中找出用户可能想收藏的网页。";

    const buildPrompt = (content) =>
      [
        "请从下面的内容中提取用户可能想收藏到收藏夹的网页，输出严格的 JSON 数组，每项格式：",
        '{"url":"完整网址","title":"简短标题"}',
        "要求：",
        "1. url 必须是可访问的完整网址，缺少协议时补 https://；",
        "2. title 优先使用内容中的原始名称（保留原语言），没有合适名称时用网站名或域名；",
        "3. 同一网址只保留一条，按值得收藏的程度排序，最多 20 条；",
        "4. 内容中没有可收藏的网页时输出 []；",
        "5. 只输出 JSON 数组本身，不要输出任何其它文字或代码块标记。",
        "",
        "<内容开始>",
        content,
        "<内容结束>",
      ].join("\n");

    // 解析 AI 回复：容错代码块包裹，校验 url 可解析出带点的域名，按 url 去重
    const parseSites = (reply) => {
      const text = String(reply || "")
        .replace(/```(?:json)?/gi, "")
        .trim();
      const match = text.match(/\[[\s\S]*\]/);
      if (!match) return [];

      let list;
      try {
        list = JSON.parse(match[0]);
      } catch {
        return [];
      }
      if (!Array.isArray(list)) return [];

      const seen = new Set();
      const items = [];
      for (const item of list) {
        const url =
          typeof item?.url === "string" ? item.url.trim() : "";
        if (!url) continue;

        const full = /^[a-z][a-z0-9+.-]*:\/\//i.test(url)
          ? url
          : `https://${url}`;
        let host = "";
        try {
          host = new URL(full).hostname;
        } catch {
          continue;
        }
        if (!host || !host.includes(".")) continue;

        const key = full.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);

        const title =
          (typeof item.title === "string" ? item.title.trim() : "").slice(
            0,
            100,
          ) || host.replace(/^www\./, "");
        items.push({ url, title, checked: true });
      }
      return items;
    };

    export default async ({ load }) => {
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@1.0.7/packages/snackbar/toast.js",
      );

      let getAssistant = null;
      const ensureAssistant = async () => {
        if (!getAssistant) {
          ({ getAssistant } = await load("/ai/main.js"));
        }
        return getAssistant();
      };

      return {
        data: {
          dialogOpen: false,
          phase: "input", // input 输入阶段 / review 勾选阶段
          inputText: "",
          fileName: "",
          dragOver: false,
          candidates: [], // [{ url, title, checked }]
          analyzing: false,
        },

        proto: {
          // st-checkbox 勾选后回写数据（原 punch 的 sync:checked）
          onUrlCheck(event, item) {
            item.checked = event.target.hasAttribute("checked");
          },

          get selectedCount() {
            return this.candidates.filter((item) => item.checked).length;
          },

          get allChecked() {
            return (
              this.candidates.length > 0 &&
              this.selectedCount === this.candidates.length
            );
          },

          // 由宿主页面调用：重置状态并打开弹窗
          openImport() {
            this.phase = "input";
            this.inputText = "";
            this.fileName = "";
            this.candidates = [];
            this.analyzing = false;
            this.dialogOpen = true;
          },

          pickFile() {
            this.shadow.$("#file-input").ele.click();
          },

          onDragOver(event) {
            event.preventDefault(); // 允许 drop
            this.dragOver = true;
          },

          async onDrop(event) {
            event.preventDefault();
            this.dragOver = false;
            const file = event.dataTransfer?.files?.[0];
            if (file) await this.readFile(file);
          },

          async onFileChange() {
            const input = this.shadow.$("#file-input");
            const file = input.ele.files && input.ele.files[0];
            input.ele.value = ""; // 允许重复选择同一文件
            if (file) await this.readFile(file);
          },

          // 读取文本文件写入输入框（选择与拖拽共用）
          async readFile(file) {
            try {
              const text = await file.text();
              const truncated = text.length > MAX_CONTENT_CHARS;
              this.inputText = truncated
                ? text.slice(0, MAX_CONTENT_CHARS)
                : text;
              this.fileName = `${file.name} · ${(text.length / 1000).toFixed(1)}k 字符${
                truncated ? "（已截断）" : ""
              }`;
            } catch {
              toast({ message: "文件读取失败，请选择文本类文件", color: "error" });
            }
          },

          async analyze() {
            const content = this.inputText.trim();
            if (!content) {
              toast({ message: "请先输入文本或选择文件", color: "error" });
              return;
            }

            this.analyzing = true;
            try {
              const assistant = await ensureAssistant();
              const clipped =
                content.length > MAX_CONTENT_CHARS
                  ? content.slice(0, MAX_CONTENT_CHARS)
                  : content;
              const { content: reply } = await assistant.chat({
                thinking: false,
                messages: [
                  { role: "system", content: SYSTEM_PROMPT },
                  { role: "user", content: buildPrompt(clipped) },
                ],
              });

              if (!this.dialogOpen) return; // 用户已关闭弹窗，丢弃结果
              const items = parseSites(reply);
              if (!items.length) {
                toast({ message: "未识别到可收藏的网址", color: "error" });
                return;
              }
              this.candidates = items;
              this.phase = "review";
            } catch (err) {
              if (err?.message === "no api key available") {
                toast({
                  message: "未配置 AI Key，请先在「AI 密钥管理器」应用中添加",
                  color: "error",
                });
              } else {
                toast({
                  message: `识别失败：${err?.message || err}`,
                  color: "error",
                });
              }
            } finally {
              this.analyzing = false;
            }
          },

          toggleAll() {
            const next = !this.allChecked;
            this.candidates.forEach((item) => (item.checked = next));
          },

          // back 与 ofa.js proto 上的内置方法重名，故用 backToInput
          backToInput() {
            this.phase = "input";
          },

          confirmImport() {
            const selected = this.candidates.filter((item) => item.checked);
            if (!selected.length) {
              toast({ message: "请至少选择一个网址", color: "error" });
              return;
            }
            this.emit("ai-import-save", {
              data: {
                items: selected.map(({ url, title }) => ({ url, title })),
              },
              bubbles: true,
              composed: true, // 穿透 Shadow DOM，宿主才能监听
            });
            this.dialogOpen = false;
          },
        },
      };
    };
  </script>
</template>
