<template page>
  <style>
    :host {
      display: block;
      height: 100%;
      overflow-y: auto;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        var(--md-sys-color-primary),
        rgb(
          from var(--md-sys-color-primary) calc(r + 40) calc(g - 20)
            calc(b + 30)
        )
      );
      color: var(--md-sys-color-on-primary);
      font-size: 26px;
    }

    .search-bar {
      max-width: 560px;
      margin: 0 auto 20px;
    }

    .search-bar st-input {
      width: 100%;
    }

    .engine-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px 8px;
      border: none;
      border-radius: 8px;
      background: none;
      color: var(--md-sys-color-on-surface-variant);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }

    .engine-btn:hover {
      background-color: var(--md-sys-color-surface-variant);
    }

    .engine-btn n-icon {
      font-size: 16px;
    }

    .engine-active {
      color: var(--md-sys-color-primary);
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .group-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .group-bar o-fill {
      display: contents;
    }

    .group-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      background-color: rgb(
        from var(--md-sys-color-surface-variant) r g b / 0.5
      );
      color: var(--md-sys-color-on-surface-variant);
      transition: background-color 0.15s ease;
    }

    .group-chip:hover {
      background-color: var(--md-sys-color-surface-variant);
    }

    .group-chip.active {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-weight: 600;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .grid o-fill {
      display: contents;
    }

    .add-tile {
      width: 150px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      border: 2px dashed
        rgb(from var(--md-sys-color-on-surface-variant) r g b / 0.4);
      background: none;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 32px;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
    }

    .add-tile:hover {
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-primary);
      transform: translateY(-2px);
    }

    .tile {
      width: 150px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 12px 16px;
      border-radius: 20px;
      background-color: rgb(
        from var(--md-sys-color-surface-variant) r g b / 0.4
      );
      border: 1px solid rgb(from var(--md-sys-color-on-surface) r g b / 0.12);
      cursor: pointer;
      user-select: none;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
    }

    .tile[dragging="true"] {
      opacity: 0.4;
    }

    .tile[drop-target="true"] {
      outline: 2px dashed var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    .tile-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
    }

    .tile-logo.no-bg {
      color: var(--md-sys-color-on-surface-variant);
    }

    .tile-logo-icon {
      font-size: 28px;
    }

    .tile-title {
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      color: var(--md-sys-color-on-surface);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }

    .tile-host {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .tile:hover .tile-actions,
    .tile:focus-within .tile-actions {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .grid {
        gap: 12px;
      }

      .tile,
      .add-tile {
        width: 110px;
      }

      .add-tile {
        min-height: 120px;
      }
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/split-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/menu/menu.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>

  <main class="container">
    <header class="app-header">
      <div class="brand-icon">
        <n-icon icon="mdi:bookmark-multiple"></n-icon>
      </div>
    </header>

    <div class="search-bar">
      <st-input
        id="search-input"
        sync:value="searchText"
        placeholder="输入关键词，回车搜索"
        on:keydown="onSearchKey($event)"
      >
        <st-menu slot="prefix" align="left">
          <button class="engine-btn" slot="trigger">
            <span>{{currentEngine.name}}</span>
            <n-icon icon="mdi:chevron-down"></n-icon>
          </button>
          <o-fill :value="engines">
            <st-menu-item on:click="$host.setEngine($data.id)">
              <span
                class:engine-active="$host.engineId === $data.id"
                >{{$data.name}}</span
              >
            </st-menu-item>
          </o-fill>
        </st-menu>
        <st-icon-button slot="suffix" style="font-size: 13px" on:click="doSearch" title="搜索" aria-label="搜索">
          <n-icon icon="mdi:magnify"></n-icon>
        </st-icon-button>
      </st-input>
    </div>

    <div class="toolbar">
      <div class="group-bar">
        <button
          class="group-chip"
          class:active="activeGroup === ''"
          on:click="activeGroup = ''"
        >
          <n-icon icon="mdi:apps"></n-icon>
          <span>全部 {{dials.length}}</span>
        </button>
        <o-fill :value="groups" fill-key="name">
          <button
            class="group-chip"
            class:active="$host.activeGroup === $data.name"
            on:click="$host.activeGroup = $data.name"
          >
            <n-icon icon="mdi:folder-outline"></n-icon>
            <span>{{$data.name}} {{$data.count}}</span>
          </button>
        </o-fill>
      </div>
      <st-split-button variant="outlined" style="font-size: 13px" on:click="openGroup">
        <n-icon icon="mdi:folder-sync-outline" slot="prefix"></n-icon>
        <span>AI 分组</span>
        <st-menu-item slot="menu" on:click="openImport">
          <n-icon icon="mdi:sparkles" slot="prefix"></n-icon>
          <span>AI 导入</span>
        </st-menu-item>
      </st-split-button>
    </div>

    <div class="grid">
      <o-fill :value="visibleDials" fill-key="id">
        <div
          class="tile"
          draggable="true"
          attr:title="$data.url"
          attr:dragging="$host.draggingId === $data.id ? 'true' : 'false'"
          attr:drop-target="$host.dropTargetId === $data.id ? 'true' : 'false'"
          on:click="$host.openDial($data)"
          on:dragstart="$host.onDragStart($data.id)"
          on:dragover="$host.onDragOver($event, $data.id)"
          on:dragleave="$host.onDragLeave($data.id)"
          on:drop="$host.onDrop($event, $data.id)"
          on:dragend="$host.onDragEnd"
        >
          <div class="tile-actions">
            <st-icon-button
              style="font-size: 12px"
              title="编辑"
              on:click="$host.openEdit($event, $data)"
            >
              <n-icon icon="mdi:pencil-outline"></n-icon>
            </st-icon-button>
            <st-icon-button
              color="error"
              style="font-size: 12px"
              title="删除"
              on:click="$host.removeDial($event, $data)"
            >
              <n-icon icon="mdi:close"></n-icon>
            </st-icon-button>
          </div>
          <div
            class="tile-logo"
            class:no-bg="!$data.color"
            :style.background="$data.color || 'transparent'"
          >
            <x-if :value="$data.icon">
              <n-icon :icon="$data.icon" class="tile-logo-icon"></n-icon>
            </x-if>
            <x-if :value="!$data.icon">
              {{$host.initial($data)}}
            </x-if>
          </div>
          <div class="tile-title">{{$data.title}}</div>
          <div class="tile-host">{{$host.hostOf($data.url)}}</div>
        </div>
      </o-fill>
      <button class="add-tile" on:click="openAdd" aria-label="添加网址">
        <n-icon icon="mdi:plus"></n-icon>
      </button>
    </div>
  </main>

  <o-page
    id="dial-form"
    src="./dial-form.html"
    on:dial-save="onDialSave"
  ></o-page>

  <o-page
    id="ai-import"
    src="./ai-import.html"
    on:ai-import-save="onAiImportSave"
  ></o-page>

  <o-page
    id="ai-group"
    src="./ai-group.html"
    on:ai-group-apply="onAiGroupApply"
  ></o-page>

  <script>
    // 可选搜索引擎；当前选择持久化在 speed-dial 空间的 searchEngine 键（存引擎 id）
    const ENGINES = [
      { id: "google", name: "Google", url: "https://www.google.com/search?q=" },
      { id: "bing", name: "Bing", url: "https://www.bing.com/search?q=" },
      { id: "baidu", name: "百度", url: "https://www.baidu.com/s?wd=" },
      {
        id: "duckduckgo",
        name: "DuckDuckGo",
        url: "https://duckduckgo.com/?q=",
      },
    ];

    export default async ({ load }) => {
      const { getStorage } = await load("/nos/storage/main.js");
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js",
      );
      const { default: confirm } = await load(
        "/gh/ofajs/senti-ui@latest/packages/dialog/confirm.js",
      );
      const { PALETTE } = await load("./palette.js");
      const store = getStorage("speed-dial");

      return {
        data: {
          dials: [],
          activeGroup: "",
          draggingId: "",
          dropTargetId: "",
          searchText: "",
          engineId: "google",
          engines: ENGINES,
        },

        proto: {
          get visibleDials() {
            if (!this.activeGroup) return this.dials;
            return this.dials.filter((dial) => dial.group === this.activeGroup);
          },

          get groups() {
            const counter = new Map();
            for (const dial of this.dials) {
              const name = dial.group || "未分组";
              counter.set(name, (counter.get(name) || 0) + 1);
            }
            return [...counter].map(([name, count]) => ({ name, count }));
          },

          get currentEngine() {
            return (
              ENGINES.find((engine) => engine.id === this.engineId) ||
              ENGINES[0]
            );
          },

          onSearchKey(event) {
            if (event.key === "Enter") this.doSearch();
          },

          doSearch() {
            const query = this.searchText.trim();
            if (!query) return;
            // 应用在独立标签页整页运行，直接当前页跳转搜索引擎
            location.href = this.currentEngine.url + encodeURIComponent(query);
          },

          async setEngine(id) {
            if (!ENGINES.some((engine) => engine.id === id)) return;
            this.engineId = id;
            await store.setItem("searchEngine", id);
          },

          hostOf(url) {
            try {
              return new URL(url).hostname.replace(/^www\./, "");
            } catch {
              return url;
            }
          },

          initial(dial) {
            const source = this.hostOf(dial.url) || dial.title;
            return source.slice(0, 1);
          },

          normalizeUrl(input) {
            const value = input.trim();
            if (!value) return "";
            if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;
            return `https://${value}`;
          },

          openDial(dial) {
            if (this.draggingId) return;
            window.open(dial.url, "_blank", "noopener");
          },

          openAdd() {
            this.getDialForm()?.openForm({
              count: this.dials.length,
              group: this.activeGroup === "未分组" ? "" : this.activeGroup,
            });
          },

          openEdit(event, dial) {
            event.stopPropagation();
            this.getDialForm()?.openForm({
              id: dial.id,
              url: dial.url,
              title: dial.title,
              group: dial.group === "未分组" ? "" : dial.group,
              color: dial.color,
              icon: dial.icon || "",
            });
          },

          getDialForm() {
            const page = this.shadow.$("#dial-form");
            return page?.openForm ? page : null;
          },

          openImport() {
            this.getAiImport()?.openImport();
          },

          getAiImport() {
            const page = this.shadow.$("#ai-import");
            return page?.openImport ? page : null;
          },

          openGroup() {
            if (!this.dials.length) {
              toast({
                message: "还没有收藏的网址，先添加或导入一些吧",
                color: "error",
              });
              return;
            }
            this.getAiGroup()?.openGroup(this.plainDials());
          },

          getAiGroup() {
            const page = this.shadow.$("#ai-group");
            return page?.openGroup ? page : null;
          },

          async onAiGroupApply(event) {
            const items = Array.isArray(event.data?.items)
              ? event.data.items
              : [];
            const map = new Map(
              items.map(({ id, group }) => [id, group]),
            );
            let changed = 0;
            for (const dial of this.dials) {
              const group = map.get(dial.id);
              if (typeof group === "string" && group && group !== dial.group) {
                dial.group = group;
                changed++;
              }
            }
            await this.persist();
            if (changed) this.activeGroup = ""; // 原筛选组可能已被改名，回到全部
            toast({
              message: changed
                ? `已更新 ${changed} 个网址的分组`
                : "分组没有变化",
            });
          },

          async onAiImportSave(event) {
            const items = Array.isArray(event.data?.items)
              ? event.data.items
              : [];
            const group = this.activeGroup || "未分组";
            let added = 0;
            for (const item of items) {
              const finalUrl = this.normalizeUrl(item.url || "");
              if (!finalUrl) continue;
              if (this.dials.some((d) => d.url === finalUrl)) continue;
              this.dials.push({
                id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                url: finalUrl,
                title: (item.title || "").trim() || this.hostOf(finalUrl),
                group,
                color: PALETTE[this.dials.length % PALETTE.length],
                icon: "",
                createdAt: Date.now(),
              });
              added++;
            }
            await this.persist();
            toast({
              message: added
                ? `已添加 ${added} 个网址`
                : "没有可新增的网址（可能都已收藏）",
            });
          },

          async onDialSave(event) {
            const { id, url, title, group, color, icon } = event.data;
            const finalUrl = this.normalizeUrl(url);
            const finalTitle = title.trim() || this.hostOf(finalUrl);
            const finalGroup = group.trim() || "未分组";

            if (id) {
              const target = this.dials.find((d) => d.id === id);
              if (target) {
                target.url = finalUrl;
                target.title = finalTitle;
                target.group = finalGroup;
                target.color = color;
                target.icon = icon || "";
              }
            } else {
              this.dials.push({
                id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                url: finalUrl,
                title: finalTitle,
                group: finalGroup,
                color,
                icon: icon || "",
                createdAt: Date.now(),
              });
            }

            await this.persist();
          },

          async removeDial(event, dial) {
            event.stopPropagation();
            const ok = await confirm({
              title: "删除确认",
              content: `确定要删除「${dial.title}」吗？`,
              yes: "删除",
              cancel: "取消",
            });
            if (!ok) return;
            const index = this.dials.findIndex((d) => d.id === dial.id);
            if (index > -1) this.dials.splice(index, 1);
            await this.persist();
          },

          onDragStart(id) {
            this.draggingId = id;
          },

          onDragOver(event, id) {
            if (!this.draggingId || this.draggingId === id) return;
            event.preventDefault();
            this.dropTargetId = id;
          },

          onDragLeave(id) {
            if (this.dropTargetId === id) this.dropTargetId = "";
          },

          async onDrop(event, id) {
            event.preventDefault();
            const fromId = this.draggingId;
            this.draggingId = "";
            this.dropTargetId = "";
            if (!fromId || fromId === id) return;

            const list = this.plainDials();
            const fromIndex = list.findIndex((d) => d.id === fromId);
            const toIndex = list.findIndex((d) => d.id === id);
            if (fromIndex < 0 || toIndex < 0) return;

            const [moved] = list.splice(fromIndex, 1);
            list.splice(toIndex, 0, moved);
            this.dials = list;
            await this.persist();
          },

          onDragEnd() {
            this.draggingId = "";
            this.dropTargetId = "";
          },

          plainDials() {
            return this.dials.map((dial) => ({
              id: dial.id,
              url: dial.url,
              title: dial.title,
              group: dial.group,
              color: dial.color,
              icon: dial.icon || "",
              createdAt: dial.createdAt,
            }));
          },

          async persist() {
            await store.setItem("dials", this.plainDials());
          },
        },

        async attached() {
          const [saved, savedEngine] = await Promise.all([
            store.getItem("dials"),
            store.getItem("searchEngine"),
          ]);
          if (Array.isArray(saved)) {
            this.dials = saved;
          }
          if (
            typeof savedEngine === "string" &&
            ENGINES.some((engine) => engine.id === savedEngine)
          ) {
            this.engineId = savedEngine;
          }
          // 应用打开时聚焦搜索框
          this.shadow.$("#search-input")?.focus();
        },
      };
    };
  </script>
</template>
