<template page>
  <style>
    :host {
      display: block;
      height: 100%;
      overflow-y: auto;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        var(--md-sys-color-primary),
        rgb(
          from var(--md-sys-color-primary) calc(r + 40) calc(g - 20)
            calc(b + 30)
        )
      );
      color: var(--md-sys-color-on-primary);
      font-size: 26px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .group-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .group-bar o-fill {
      display: contents;
    }

    .group-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      background-color: rgb(
        from var(--md-sys-color-surface-variant) r g b / 0.5
      );
      color: var(--md-sys-color-on-surface-variant);
      transition: background-color 0.15s ease;
    }

    .group-chip:hover {
      background-color: var(--md-sys-color-surface-variant);
    }

    .group-chip.active {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-weight: 600;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .grid o-fill {
      display: contents;
    }

    .add-tile {
      width: 150px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      border: 2px dashed
        rgb(from var(--md-sys-color-on-surface-variant) r g b / 0.4);
      background: none;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 32px;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
    }

    .add-tile:hover {
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-primary);
      transform: translateY(-2px);
    }

    .tile {
      width: 150px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 12px 16px;
      border-radius: 20px;
      background-color: rgb(
        from var(--md-sys-color-surface-variant) r g b / 0.4
      );
      border: 1px solid rgb(from var(--md-sys-color-on-surface) r g b / 0.12);
      cursor: pointer;
      user-select: none;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
    }

    .tile[dragging="true"] {
      opacity: 0.4;
    }

    .tile[drop-target="true"] {
      outline: 2px dashed var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    .tile-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
    }

    .tile-title {
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      color: var(--md-sys-color-on-surface);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }

    .tile-host {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tile-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .tile:hover .tile-actions,
    .tile:focus-within .tile-actions {
      opacity: 1;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 16px;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
    }

    .empty-state n-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .dialog-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 16px;
    }

    .dialog-form p-input {
      width: 100%;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-label {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      margin-right: 4px;
    }

    .color-dot {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      cursor: pointer;
    }

    .color-dot.active {
      border-color: var(--md-sys-color-on-surface);
    }

    .tip {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .grid {
        gap: 12px;
      }

      .tile,
      .add-tile {
        width: 110px;
      }

      .add-tile {
        min-height: 120px;
      }
    }
  </style>

  <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
  <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
  <l-m src="https://punch-ui-v2.pages.dev/packages/dialog/dialog.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>

  <main class="container">
    <header class="app-header">
      <div class="brand-icon">
        <n-icon icon="mdi:bookmark-multiple"></n-icon>
      </div>
    </header>

    <div class="toolbar">
      <div class="group-bar">
        <button
          class="group-chip"
          class:active="activeGroup === ''"
          on:click="activeGroup = ''"
        >
          <n-icon icon="mdi:apps"></n-icon>
          <span>全部 {{dials.length}}</span>
        </button>
        <o-fill :value="groups" fill-key="name">
          <button
            class="group-chip"
            class:active="$host.activeGroup === $data.name"
            on:click="$host.activeGroup = $data.name"
          >
            <n-icon icon="mdi:folder-outline"></n-icon>
            <span>{{$data.name}} {{$data.count}}</span>
          </button>
        </o-fill>
      </div>
    </div>

    <o-if :value="dials.length === 0">
      <div class="empty-state">
        <n-icon icon="mdi:bookmark-outline"></n-icon>
        <p>还没有收藏任何网址</p>
        <p-button color="primary" size="s" on:click="openAdd">
          <n-icon icon="mdi:plus" slot="prefix"></n-icon>
          添加网址
        </p-button>
      </div>
    </o-if>

    <o-if :value="dials.length > 0">
      <div class="grid">
        <o-fill :value="visibleDials" fill-key="id">
          <div
            class="tile"
            draggable="true"
            attr:title="$data.url"
            attr:dragging="$host.draggingId === $data.id ? 'true' : 'false'"
            attr:drop-target="$host.dropTargetId === $data.id ? 'true' : 'false'"
            on:click="$host.openDial($data)"
            on:dragstart="$host.onDragStart($data.id)"
            on:dragover="$host.onDragOver($event, $data.id)"
            on:dragleave="$host.onDragLeave($data.id)"
            on:drop="$host.onDrop($event, $data.id)"
            on:dragend="$host.onDragEnd"
          >
            <div class="tile-actions">
              <p-button
                variant="text"
                icon
                size="xs"
                on:click="$host.openEdit($event, $data)"
              >
                <n-icon icon="mdi:pencil-outline"></n-icon>
              </p-button>
              <p-button
                variant="text"
                icon
                size="xs"
                color="error"
                on:click="$host.removeDial($event, $data)"
              >
                <n-icon icon="mdi:close"></n-icon>
              </p-button>
            </div>
            <div class="tile-logo" :style.background="$data.color">
              {{$host.initial($data)}}
            </div>
            <div class="tile-title">{{$data.title}}</div>
            <div class="tile-host">{{$host.hostOf($data.url)}}</div>
          </div>
        </o-fill>
        <button class="add-tile" on:click="openAdd" attr:aria-label="添加网址">
          <n-icon icon="mdi:plus"></n-icon>
        </button>
      </div>
    </o-if>

    <o-if :value="dials.length > 0 && visibleDials.length === 0">
      <div class="empty-state">
        <n-icon icon="mdi:folder-open-outline"></n-icon>
        <p>该分组下暂无收藏</p>
      </div>
    </o-if>
  </main>

  <p-dialog sync:open="dialogOpen" auto-close style="--dialog-max-width: 460px">
    <span slot="title">{{editingId ? '编辑网址' : '添加网址'}}</span>
    <div class="dialog-form">
      <p-input sync:value="form.url" placeholder="example.com">
        <span slot="label">网址</span>
      </p-input>
      <p-input sync:value="form.title" placeholder="留空则自动使用域名">
        <span slot="label">标题</span>
      </p-input>
      <p-input sync:value="form.group" placeholder="留空为「未分组」">
        <span slot="label">分组</span>
      </p-input>
      <div class="color-row">
        <span class="color-label">图标颜色</span>
        <o-fill :value="palette">
          <button
            class="color-dot"
            class:active="$host.form.color === $data"
            :style.background="$data"
            on:click="$host.form.color = $data"
          ></button>
        </o-fill>
      </div>
      <p class="tip">点击卡片即在新标签页打开，长按拖拽可调整顺序。</p>
    </div>
    <div slot="bottom">
      <p-button variant="text" on:click="dialogOpen = false">取消</p-button>
      <p-button color="primary" on:click="saveDial">保存</p-button>
    </div>
  </p-dialog>

  <script>
    const PALETTE = [
      "#4f6df5",
      "#e0573e",
      "#2fa36b",
      "#c9852b",
      "#8b5cf6",
      "#0d9488",
      "#d946a4",
      "#5b6570",
    ];

    export default async ({ load }) => {
      const { getStorage } = await load("/nos/storage/main.js");
      const { toast, confirm } = await load(
        "https://punch-ui-v2.pages.dev/packages/util.js",
      );
      const store = getStorage("speed-dial");

      return {
        data: {
          dials: [],
          activeGroup: "",
          dialogOpen: false,
          editingId: "",
          draggingId: "",
          dropTargetId: "",
          palette: PALETTE,
          form: { url: "", title: "", group: "", color: PALETTE[0] },
        },

        proto: {
          get visibleDials() {
            if (!this.activeGroup) return this.dials;
            return this.dials.filter((dial) => dial.group === this.activeGroup);
          },

          get groups() {
            const counter = new Map();
            for (const dial of this.dials) {
              const name = dial.group || "未分组";
              counter.set(name, (counter.get(name) || 0) + 1);
            }
            return [...counter].map(([name, count]) => ({ name, count }));
          },

          hostOf(url) {
            try {
              return new URL(url).hostname.replace(/^www\./, "");
            } catch {
              return url;
            }
          },

          initial(dial) {
            const source = this.hostOf(dial.url) || dial.title;
            return source.slice(0, 1);
          },

          normalizeUrl(input) {
            const value = input.trim();
            if (!value) return "";
            if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;
            return `https://${value}`;
          },

          openDial(dial) {
            if (this.draggingId) return;
            window.open(dial.url, "_blank", "noopener");
          },

          openAdd() {
            this.editingId = "";
            this.form.url = "";
            this.form.title = "";
            this.form.group =
              this.activeGroup === "未分组" ? "" : this.activeGroup;
            this.form.color = PALETTE[this.dials.length % PALETTE.length];
            this.dialogOpen = true;
          },

          openEdit(event, dial) {
            event.stopPropagation();
            this.editingId = dial.id;
            this.form.url = dial.url;
            this.form.title = dial.title;
            this.form.group = dial.group === "未分组" ? "" : dial.group;
            this.form.color = dial.color;
            this.dialogOpen = true;
          },

          async saveDial() {
            const url = this.normalizeUrl(this.form.url);
            if (!url) {
              toast({ content: "请输入网址", color: "error" });
              return;
            }

            const title = this.form.title.trim() || this.hostOf(url);
            const group = this.form.group.trim() || "未分组";

            if (this.editingId) {
              const target = this.dials.find((d) => d.id === this.editingId);
              if (target) {
                target.url = url;
                target.title = title;
                target.group = group;
                target.color = this.form.color;
              }
            } else {
              this.dials.push({
                id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                url,
                title,
                group,
                color: this.form.color,
                createdAt: Date.now(),
              });
            }

            this.dialogOpen = false;
            await this.persist();
          },

          async removeDial(event, dial) {
            event.stopPropagation();
            const ok = await confirm({
              title: "删除确认",
              content: `确定要删除「${dial.title}」吗？`,
              yes: "删除",
              cancel: "取消",
            });
            if (!ok) return;
            const index = this.dials.findIndex((d) => d.id === dial.id);
            if (index > -1) this.dials.splice(index, 1);
            await this.persist();
          },

          onDragStart(id) {
            this.draggingId = id;
          },

          onDragOver(event, id) {
            if (!this.draggingId || this.draggingId === id) return;
            event.preventDefault();
            this.dropTargetId = id;
          },

          onDragLeave(id) {
            if (this.dropTargetId === id) this.dropTargetId = "";
          },

          async onDrop(event, id) {
            event.preventDefault();
            const fromId = this.draggingId;
            this.draggingId = "";
            this.dropTargetId = "";
            if (!fromId || fromId === id) return;

            const list = this.plainDials();
            const fromIndex = list.findIndex((d) => d.id === fromId);
            const toIndex = list.findIndex((d) => d.id === id);
            if (fromIndex < 0 || toIndex < 0) return;

            const [moved] = list.splice(fromIndex, 1);
            list.splice(toIndex, 0, moved);
            this.dials = list;
            await this.persist();
          },

          onDragEnd() {
            this.draggingId = "";
            this.dropTargetId = "";
          },

          plainDials() {
            return this.dials.map((dial) => ({
              id: dial.id,
              url: dial.url,
              title: dial.title,
              group: dial.group,
              color: dial.color,
              createdAt: dial.createdAt,
            }));
          },

          async persist() {
            await store.setItem("dials", this.plainDials());
          },
        },

        async attached() {
          const saved = await store.getItem("dials");
          if (Array.isArray(saved)) {
            this.dials = saved;
          }
        },
      };
    };
  </script>
</template>
