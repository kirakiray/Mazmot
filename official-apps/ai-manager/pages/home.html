  <script>
    export default async ({ load }) => {
      const {
        saveKey,
        removeKey,
        getApiKeys,
        onApiKeysChange,
        testApiKey,
        getAssistant,
      } = await load("/mz/ai/main.js");
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js",
      );
      const { default: confirm } = await load(
        "/gh/ofajs/senti-ui@latest/packages/dialog/confirm.js",
      );
      const { getLocaleText } = await load(
        "/nos/locale-text/get-locale-text.js",
      );

      const L10N = {
        inputPlaceholder: { cn: "请输入 API Key", en: "Enter API Key" },
        toggleKeyVisibility: {
          cn: "显示/隐藏 API Key",
          en: "Show/hide API Key",
        },
        delete: { cn: "删除", en: "Delete" },
        expandToLoad: { cn: "点击展开后加载", en: "Load by expanding" },
      };
      const t = (key) => {
        const i = L10N[key];
        return i ? getLocaleText(i) : key;
      };

      return {
        data: {
          provider: "deepseek",
          apiKey: "",
          showPassword: false,
          apiKeys: [],
          submitting: false,
          loadingIds: {},
          detailMap: {},
          privacyDialogOpen: false,
        },

        proto: {
          t(key) {
            return t(key);
          },

          providerLabel(provider) {
            return provider === "kimi" ? "Kimi" : "DeepSeek";
          },

          providerIcon(provider) {
            return provider === "kimi"
              ? "simple-icons:moonshotai"
              : "simple-icons:deepseek";
          },

          togglePassword() {
            this.showPassword = !this.showPassword;
          },

          showPrivacyDetail() {
            this.privacyDialogOpen = true;
          },

          async handleValidate() {
            const key = this.apiKey.trim();
            if (!key) {
              toast({ message: getLocaleText({ cn: "请输入 API Key", en: "Please enter an API Key" }), color: "error" });
              return;
            }

            this.submitting = true;
            try {
              const { valid, message } = await testApiKey(key, this.provider);
              toast({ message, color: valid ? "success" : "error" });
            } catch (error) {
              toast({ message: getLocaleText({ cn: "验证失败：{msg}", en: "Validation failed: {msg}" }, { msg: error.message }), color: "error" });
            } finally {
              this.submitting = false;
            }
          },

          async handleSave() {
            const key = this.apiKey.trim();
            if (!key) {
              toast({ message: getLocaleText({ cn: "请输入 API Key", en: "Please enter an API Key" }), color: "error" });
              return;
            }

            this.submitting = true;
            try {
              const { valid, message } = await testApiKey(key, this.provider);
              if (!valid) {
                toast({ message, color: "error" });
                return;
              }

              saveKey(key, this.provider);
              this.apiKey = "";
              toast({ message: getLocaleText({ cn: "API Key 保存成功", en: "API Key saved" }), color: "success" });
            } catch (error) {
              toast({ message: getLocaleText({ cn: "保存失败：{msg}", en: "Save failed: {msg}" }, { msg: error.message }), color: "error" });
            } finally {
              this.submitting = false;
            }
          },

          handleExpand(id) {
            if (!this.detailMap[id]) {
              this.loadDetail(id);
            }
          },

          async loadDetail(id) {
            this.loadingIds[id] = true;
            this.detailMap[id] = { models: "", balance: "" };

            const assistant = getAssistant(id);

            await Promise.all([
              assistant
                .getModels()
                .then((models) => {
                  const names = models.map((m) => m.id || m.name);
                  this.detailMap[id].models = names.length
                    ? names.join("，")
                    : getLocaleText({ cn: "暂无数据", en: "No data" });
                })
                .catch((err) => {
                  this.detailMap[id].models = getLocaleText({ cn: "加载失败：{msg}", en: "Load failed: {msg}" }, { msg: err.message });
                }),
              assistant
                .getRemaining()
                .then((remaining) => {
                  const lines = remaining.balances
                    .map((b) => `${b.amount} ${b.currency ?? getLocaleText({ cn: "未知货币", en: "unknown currency" })}`)
                    .join("，");
                  this.detailMap[id].balance = lines
                    ? lines
                    : remaining.raw
                      ? JSON.stringify(remaining.raw)
                      : getLocaleText({ cn: "暂无数据", en: "No data" });
                })
                .catch((err) => {
                  this.detailMap[id].balance = getLocaleText({ cn: "加载失败：{msg}", en: "Load failed: {msg}" }, { msg: err.message });
                }),
            ]);

            sessionStorage.setItem(
              `ai-manager:${id}:detail`,
              JSON.stringify(this.detailMap[id]),
            );
            this.loadingIds[id] = false;
          },

          async handleDelete(id) {
            const key = this.apiKeys.find((k) => k.id === id);
            const ok = await confirm({
              title: getLocaleText({ cn: "删除确认", en: "Confirm Deletion" }),
              message: getLocaleText(
                { cn: "确定要删除 {key} API Key 吗？此操作无法撤销。", en: "Are you sure you want to delete the {key} API Key? This cannot be undone." },
                { key: key ? key.maskedKey : getLocaleText({ cn: "这条", en: "this" }) },
              ),
              yes: getLocaleText({ cn: "删除", en: "Delete" }),
              cancel: getLocaleText({ cn: "取消", en: "Cancel" }),
            });
            if (ok) {
              removeKey(id);
              delete this.detailMap[id];
              sessionStorage.removeItem(`ai-manager:${id}:detail`);
              toast({ message: getLocaleText({ cn: "已删除", en: "Deleted" }), color: "success" });
            }
          },
        },

        attached() {
          this.apiKeys = getApiKeys();
          // st-list-item 折叠点击只切换 expanded 属性、不派发事件，
          // 用 MutationObserver 监听展开，触发模型/余额懒加载
          this._expandObserver = new MutationObserver((muts) => {
            for (const m of muts) {
              if (m.attributeName === "expanded" && m.target.hasAttribute("expanded")) {
                const id = m.target.getAttribute("data-id");
                if (id) this.handleExpand(id);
              }
            }
          });
          const srRoot = this.shadow && (this.shadow.ele || this.shadow);
          if (srRoot) this._expandObserver.observe(srRoot, { subtree: true, attributes: true, attributeFilter: ["expanded"] });
          this._unsub = onApiKeysChange((keys) => {
            this.apiKeys = keys;
          });

          for (const key of this.apiKeys) {
            const cached = sessionStorage.getItem(
              `ai-manager:${key.id}:detail`,
            );
            if (cached) {
              try {
                this.detailMap[key.id] = JSON.parse(cached);
              } catch {
                sessionStorage.removeItem(`ai-manager:${key.id}:detail`);
              }
            }
          }
        },

        detached() {
          this._expandObserver?.disconnect();
          this._unsub?.();
          this.apiKeys = [];
          this.detailMap = {};
        },
      };
    };
  </script>
</template>
