<template page>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <style>
    :host {
      display: block;
      height: 100%;
      overflow-y: auto;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 48px 20px 60px;
    }
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .hero .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 4px;
    }
    .hero p {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      margin: 0;
    }
    .card {
      background: var(--md-sys-color-surface-container);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 4px;
    }
    .field st-input {
      width: 100%;
    }
    .connect-row {
      display: flex;
      gap: 8px;
    }
    .connect-row st-input {
      flex: 1;
    }
    .conn-state {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .conn-state n-icon {
      font-size: 14px;
    }
    .conn-ok {
      color: var(--md-sys-color-primary);
    }
    .login-btn {
      width: 100%;
      margin-top: 4px;
    }
    .resume-card {
      margin-top: 16px;
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .resume-card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .resume-card h3 n-icon {
      font-size: 18px;
    }
    .resume-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 6px 0;
      border-top: 1px solid rgb(from var(--md-sys-color-on-tertiary-container) r g b / 0.15);
    }
    .resume-item .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .error-text {
      font-size: 12px;
      color: var(--md-sys-color-error);
      min-height: 16px;
    }
  </style>

  <div class="wrap">
    <div class="hero">
      <div class="logo">📁</div>
      <h1>云盘客户端</h1>
      <p>连接云盘服务器，安全存取你的文件</p>
    </div>

    <div class="card">
      <div class="field">
        <label>第一步 · 连接服务器</label>
        <div class="connect-row">
          <st-input
            placeholder="粘贴服务器用户 ID"
            sync:value="serverId"
          ></st-input>
          <st-button
            on:click="connectServer()"
            attr:disabled="connecting || connected"
          >
            {{connected ? "已连接" : connecting ? "连接中…" : "连接"}}
          </st-button>
        </div>
        <div class="conn-state">
          <o-if :value="connected">
            <n-icon icon="mdi:check-circle" class="conn-ok"></n-icon>
            <span class="conn-ok">服务器已连接</span>
          </o-if>
          <o-if :value="!connected">
            <n-icon icon="mdi:cloud-off-outline"></n-icon>
            <span>未连接</span>
          </o-if>
        </div>
      </div>

      <o-if :value="connected">
        <div class="field">
          <label>第二步 · 登录账号</label>
          <st-input placeholder="用户名" sync:value="username"></st-input>
        </div>
        <div class="field">
          <st-input placeholder="密码" sync:value="password"></st-input>
        </div>
        <st-button class="login-btn" on:click="login()" attr:disabled="loggingIn">
          {{loggingIn ? "登录中…" : "登录云盘"}}
        </st-button>
        <p style="font-size: 11px; color: var(--md-sys-color-on-surface-variant); margin: 0">
          登录后，账号被授权的空间会以文件夹形式出现在根目录。
        </p>
      </o-if>

      <div class="error-text">{{errorText}}</div>
    </div>

    <o-if :value="transfers.length">
      <div class="resume-card">
        <h3>
          <n-icon icon="mdi:progress-upload"></n-icon>
          检测到未完成的传输任务
        </h3>
        <o-fill :value="transfers" fill-key="key">
          <div class="resume-item">
            <n-icon attr:icon="$data.icon"></n-icon>
            <span class="name">{{$data.name}}</span>
            <span>{{$data.progressText}}</span>
            <st-button variant="text" on:click="$host.resumeOne($data)">继续</st-button>
            <st-button variant="text" on:click="$host.cancelOne($data)">取消</st-button>
          </div>
        </o-fill>
        <p style="font-size: 11px; margin: 8px 0 0">
          连接服务器并登录后即可继续（未授权的空间不会出现在根目录）。
        </p>
      </div>
    </o-if>
  </div>

  <script>
    export default async ({ load }) => {
      const { getSharedClient } = await load("../lib/client-core.js");
      const { formatBytes } = await load("../lib/protocol.js");
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js"
      );

      return {
        data: {
          serverId: "",
          connecting: false,
          connected: false,
          username: "",
          password: "",
          loggingIn: false,
          errorText: "",
          transfers: [],
        },
        ready() {
          this._client = getSharedClient(() => {});
          this.init();
        },
        proto: {
          async init() {
            // 分享链接带来的服务器 ID（?server=xxx，经 run-app 安装后透传到入口）
            // 优先于上次连接记录，跳过手填这一步
            const shared = new URLSearchParams(location.search).get("server");
            const last = await this._client.getLastServer();
            this.serverId = (shared && shared.trim()) || last || "";
            await this.refreshTransfers();
            // 有持久化登录态（含刷新后恢复）直接回文件页
            if (this._client.loggedIn || (await this._client.tryRestoreSession())) {
              this.gotoFiles();
            }
          },

          async refreshTransfers() {
            const list = await this._client.listTransfers();
            this.transfers = list.map((r) => ({
              ...r,
              icon:
                r.dir === "up"
                  ? "mdi:upload-outline"
                  : "mdi:download-outline",
              progressText: `${r.received.length}/${r.chunkTotal} 块 · ${formatBytes(r.size)}`,
            }));
          },

          async connectServer() {
            const id = this.serverId.trim();
            if (!id) return (this.errorText = "请输入服务器用户 ID");
            this.errorText = "";
            this.connecting = true;
            try {
              await this._client.connect(id);
              this.connected = true;
            } catch (err) {
              this.connected = false;
              this.errorText = `连接失败：${err.message}`;
            }
            this.connecting = false;
          },

          async login() {
            if (!this.username.trim() || !this.password)
              return (this.errorText = "请输入用户名和密码");
            this.errorText = "";
            this.loggingIn = true;
            try {
              await this._client.login({
                username: this.username.trim(),
                password: this.password,
              });
              this.gotoFiles();
            } catch (err) {
              this.errorText = `登录失败：${err.message}`;
            }
            this.loggingIn = false;
          },

          async resumeOne(record) {
            try {
              await this._client.resumeTransfer(record);
              this.tip("续传完成");
              await this.refreshTransfers();
            } catch (err) {
              this.tip(err.message);
            }
          },

          async cancelOne(record) {
            await this._client.cancelTransfer(record.key);
            await this.refreshTransfers();
          },

          tip(text) {
            toast(text);
          },

          // 走 ofa 页面路由：goto 相对本页 src 解析（ofa@latest 实测，
          // resolvePath(src, this.src)），无需手工拼 hash；
          // 禁止 location.replace(应用根目录 + hash)：目录 URL（client/）
          // 在虚拟目录 SW（/$mazmot-apps/*）下没有 directory-index 解析，
          // 文档导航直接 NS_ERROR（/apps 静态部署由服务器兜底故未暴露）
          gotoFiles() {
            this.goto("./files.html");
          },
        },
      };
    };
  </script>
</template>
