  <div class="layout">
    <section class="list-col">
      <div class="list-head">

        <span class="list-sub">{{currentAppDisplay}} 删除的对话，仅本机保留</span>

            <st-button variant="text" on:click="restoreSelected()">还原</st-button>

              {{confirmingPurge ? '确认彻底删除' : '彻底删除'}}

  <script>
    export const parent = "./home.html"; // 嵌套路由：渲染进父页面（布局壳）的 slot

    export default async ({ load }) => {
      const { renderMarkdown } = await load("../lib/markdown.js");
      const { getBuilderStore } = await load("../lib/store-instance.js");
      // 共享仓库单例：正常路径 home 已建好（init 已完成）；刷新直落本页时
      // 这里完成自举（Core 装载 + init），后续 home 拿到同一份
      const store = await getBuilderStore();
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@main/packages/snackbar/toast.js",
      );

      // 选中项内容卸载：还原 / 彻底删除 / 清空（含其他标签同步）后当前
      // 选中项已不在列表，清掉选中与详情
      function clearSelection() {
        this.selectedSid = "";
        this.detail = null;
        this.confirmingPurge = false;
      }

      return {
        data: {
          currentAppName: "",
          currentAppDisplay: "",
          currentAppTrash: [], // 已删会话列表（仓库镜像，删除时间倒序）
          selectedSid: "", // 二级导航选中的回收站会话 id
          detail: null, // 选中项详情 { session, messages }（只读）
          confirmingPurge: false, // 彻底删除两步确认
          confirmingEmptyTrash: false, // 清空回收站两步确认
        },

        attached() {
          // home 常驻路由栈且同订一份仓库：本页只镜像自己声明的键
          this._unsub = store.subscribe((evt) => {
            if (evt.type !== "patch") return;
            for (const key of [
              "currentAppName",
              "currentAppDisplay",
              "currentAppTrash",
            ]) {
              if (key in evt.data) this[key] = evt.data[key];
            }
            // 列表变化（还原 / 删除 / 其他标签同步）后选中项可能已消失
            if (this.selectedSid && !this.currentAppTrash.some((t) => t.id === this.selectedSid)) {
              clearSelection.call(this);
            }
          });
          // 单例引导里 init 先于本页订阅完成：手动补一次初始镜像
          this.currentAppName = store.state.currentAppName;
          this.currentAppDisplay = store.state.currentAppDisplay;
          this.currentAppTrash = [...store.state.currentAppTrash];
        },

        detached() {
          this._unsub && this._unsub();
        },

        proto: {
          trashTime(ts) {
            if (!ts) return "";
            const d = new Date(ts);
            const p = (n) => String(n).padStart(2, "0");
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
          },

          trashItemMeta(t) {
            const parts = [`删除于 ${this.trashTime(t.deletedAt)}`];
            if (t.msgCount > 0) parts.push(`${t.msgCount} 条消息`);
            return parts.join(" · ");
          },

          detailTitle() {
            return this.detail?.session?.title || "";
          },

          detailMeta() {
            const d = this.detail;
            if (!d?.session) return "";
            const parts = [`删除于 ${this.trashTime(d.session.deletedAt)}`];
            if (d.messages.length) parts.push(`${d.messages.length} 条消息`);
            return parts.join(" · ");
          },

          // 图片附件的只读提示（复用 home 的消息图片结构判断）
          msgImages(m) {
            return Array.isArray(m?.images) ? m.images : [];
          },

          renderMd(text) {
            return renderMarkdown(String(text ?? ""));
          },

          async selectTrashItem(sid) {
            if (this.selectedSid === sid) return;
            const session = this.currentAppTrash.find((t) => t.id === sid);
            if (!session) return;
            this.confirmingPurge = false;
            this.selectedSid = sid;
            this.detail = { session, messages: [] };
            const messages = await store.readTrashedMessages(sid);
            // 读盘 await 期间可能已切换选中 / 列表变化：仍是当前选中才写入
            if (this.selectedSid === sid) {
              this.detail = { session, messages };
            }
          },

          // 还原回会话列表：仓库会刷新 home 视图数据，返回对话页即见
          async restoreSelected() {
            const sid = this.selectedSid;
            if (!sid) return;
            clearSelection.call(this);
            await store.restoreTrashedSession(sid);
            toast({ message: "已还原到会话列表", color: "success" });
          },

          async purgeSelected() {
            if (!this.confirmingPurge) {
              this.confirmingPurge = true;
              return;
            }
            this.confirmingPurge = false;
            const sid = this.selectedSid;
            if (!sid) return;
            clearSelection.call(this);
            await store.purgeTrashedSession(sid);
          },

          async emptyTrash() {
            if (!this.confirmingEmptyTrash) {
              this.confirmingEmptyTrash = true;
              return;
            }
            this.confirmingEmptyTrash = false;
            clearSelection.call(this);
            await store.emptyTrash();
          },
        },
      };
    };
  </script>
