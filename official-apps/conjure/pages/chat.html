          // 发送可用：有文本或有待发图片（纯图片消息可发）
          canSend() {
            return !!this.input.trim() || this.pendingImages.length > 0;
          },


          async handleSend() {
            if (this.sending) {
              // 状态行/停止按钮已限定回合视图：在这里发送说明用户在别的
              // 会话里触发，给出可读提示而不是静默吞掉
              if (!this.turnInView) {
                const { default: toast } = await load(
                  "/gh/ofajs/senti-ui@main/packages/snackbar/toast.js",
                );
                toast({
                  message: "另一个会话正在生成中，可回到该会话查看或停止",
                  color: "warning",
                });
              }
              return;
            }
            if (!this.canSend()) return;
            const text = this.input.trim();
            const images = this.pendingImages.map((p) => p.src);
            this.input = "";
            this.pendingImages = [];
            this.autoGrow();
            this.atBottom = true;
            this.followScroll(true);
            // 新回合：清零表单挂起的计时暂停累计
            this._formPauseMs = 0;
            this._formPauseStart = 0;
            await store.send(text, images);
          },


          autoGrow() {
            requestAnimationFrame(() => {
              const el = this.shadow.$("#inputer")?.ele;
              if (!el) return;
              el.style.height = "auto";
              el.style.height = `${Math.min(el.scrollHeight, 160)}px`;
            });
          },


          followScroll(force = false) {
            if (!force && !this.atBottom) return;
            requestAnimationFrame(() => {
              const el = this.shadow.$("#chatScroll")?.ele;
              if (el) el.scrollTop = el.scrollHeight;
            });
          },


          onChatScroll() {
            const el = this.shadow.$("#chatScroll")?.ele;
            if (!el) return;
            const dist = el.scrollHeight - el.scrollTop - el.clientHeight;
            this.atBottom = dist <= 24;
            // 反向瀑布流：滚近顶部且上方还有被省略的消息 → 补挂一批，并
            // 补偿 scrollTop 锚住原内容（头部插入会把视口内容往下推）。
            // 双 rAF 等 o-fill 渲染完成；补挂后仍贴顶（一批不满一屏）递归
            // 续挂，loadOlder 返回 0（全部挂完）自然终止
            if (el.scrollTop <= 80 && this.hiddenOldCount > 0 && !this._loadingOlder) {
              this._loadingOlder = true;
              const prevHeight = el.scrollHeight;
              const prevTop = el.scrollTop;
              const loaded = this._win.loadOlder();
              this.hiddenOldCount = this._win.hiddenCount;
              requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                  const el2 = this.shadow.$("#chatScroll")?.ele;
                  if (el2 && loaded > 0) {
                    el2.scrollTop = el2.scrollHeight - prevHeight + prevTop;
                  }
                  this._loadingOlder = false;
                  this.onChatScroll();
                });
              });
            }
          },


          toBottomNow() {
            this.atBottom = true;
            this.followScroll(true);
          },
          // ---- 仓库订阅 + 初始镜像（attached 装配；detached 退订）----
          setupStoreSync() {
            // 消息窗口兜底：attached 若先于 ready 触发（生命周期顺序差异），
            // 读盘消息投影前必须保证窗口就位
            if (!this._win) this._win = createMsgWindow(this.messages);
            this._unsub = store.subscribe((evt) => {
              if (evt.type === "patch") {
                for (const [key, value] of Object.entries(evt.data)) {
                  if (key === "nextId" || key === "messages") continue;
                  this[key] = value;
                }
                // Key 列表 / 选中项 / 可用模型清单变化：刷新选择器展示文案
                if (
                  "apiKeys" in evt.data ||
                  "activeKeyId" in evt.data ||
                  "modelOptions" in evt.data
                ) {
                  this.syncActiveKeyText();
                }
                // 底部统计胶囊与模型触发器文案跟随仓库状态（reasoning / Key 等）
                this.syncStats();
                // 生成中状态行/停止按钮只属于正在生成的会话：视图、回合归属
                // 或发送态任一变化都重算
                if (
                  ["turningKey", "currentAppName", "currentSessionId", "sending"].some(
                    (k) => k in evt.data,
                  )
                ) {
                  this.syncTurnInView();
                }
                return;
              }
              if (evt.type === "messages") {
                this.applyMessageEvent(evt);
                // 会话整体切换（replace）：窗口重建后直接回到底部看最新；
                // 流式增量同样跟随滚动（手动拉回底部后恢复自动跟随）
                if (evt.op === "replace") this.followScroll(true);
                else this.followScroll();
              }
            });
            // 单例引导里 init 先于订阅完成：手动补一次全量镜像 + 消息投影
            for (const [key, value] of Object.entries(store.state)) {
              if (key === "nextId" || key === "messages") continue;
              this[key] = value;
            }
            this.applyMessageEvent({ op: "replace", list: [...store.state.messages] });
            this.syncStats();
            this.syncActiveKeyText();
            this.syncTurnInView();
            this.syncInputPlaceholder();
            this.followScroll(true);
          },

        },
      };
    };
  </script>
</template>
