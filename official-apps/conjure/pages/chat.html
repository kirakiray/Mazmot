<template page>
  <!-- 对话子路由页（export const parent = "./home.html"）：会话消息流 / 输入区 /
       任务清单面板。父页面（home.html 布局壳）保留顶栏与会话栏，本页经嵌套
       路由渲染进其 slot；仓库经 lib/store-instance.js 单例与父页共享。样式复用
       home.css（类名作用域在各自 shadow 内，互不干扰） -->
  <link rel="stylesheet" href="./home.css?v=16" />
  <style>
    :host {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      /* 对话列宽变量：拖拽 / 偏好恢复由 applyChatWidth 设在本页 .main-col 上 */
      --chat-w: 768px;
    }
  </style>
  <l-m src="/gh/ofajs/senti-ui@main/packages/menu/menu.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/button/icon-button.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <!-- show-form 表单卡片的控件依赖（组件模板经 :html 生成，须全局预载） -->
  <l-m src="../lib/tools/show-form/form-card.html"></l-m>

      <div class="main-col">
    <div class="chat-wrap">
      <section class="chat-scroll" id="chatScroll" on:scroll="onChatScroll">
        <div class="column">
          <o-if :value="messages.length === 0 && !sending">
            <!-- 草稿态：引导描述要生成的应用 -->
            <o-if :value="currentAppName === ''">
              <div class="hero">
                <div class="hero-icon">🪄</div>
                <h2>描述你想要的应用</h2>
                <p class="hero-sub">
                  AI 会生成完整的 ofa.js 应用并写入文件系统，完成后可直接预览
                </p>
                <div class="chips">
                  <button class="chip" on:click="useChip('帮我生成一个番茄钟应用：25 分钟专注 + 5 分钟休息，可以自定义时长，记录今天完成的番茄数')">
                    🍅 番茄钟
                  </button>
                  <button class="chip" on:click="useChip('帮我生成一个记账应用：添加收入/支出记录，按分类汇总，数据保存到本地')">
                    💰 记账本
                  </button>
                  <button class="chip" on:click="useChip('帮我生成一个抽签点名应用：粘贴学生名单，随机抽取一人，避免重复')">
                    🎯 随机点名
                  </button>
                </div>
              </div>
            </o-if>
            <!-- 已在应用内：新会话给出贴合当前应用的迭代话题 -->
            <o-if :value="currentAppName !== ''">
              <div class="hero">
                <div class="hero-icon">{{currentAppIcon}}</div>
                <h2>{{currentAppDisplay || currentAppName}}</h2>
                <p class="hero-sub">继续迭代这个应用，可以试试下面的话题</p>
                <div class="chips">
                  <button class="chip" on:click="useChip('帮我检查当前应用还有哪些问题或可以优化的地方，发现后直接修复')">🔍 检查优化</button>
                  <button class="chip" on:click="useChip('在现有基础上帮我增加一个实用的新功能，先给出方案再实现')">✨ 新增功能</button>
                  <button class="chip" on:click="useChip('帮我优化应用的界面视觉与交互细节，让它更美观易用')">🎨 美化界面</button>
                </div>
              </div>
            </o-if>
          </o-if>

          <!-- 反向瀑布流：上方更早消息被省略的提示（上滑自动按批补挂） -->
          <o-if :value="hiddenOldCount > 0">
            <div class="history-hint">已省略上方 {{hiddenOldCount}} 条更早消息 · 上滑加载</div>
          </o-if>

          <o-fill :value="messages" fill-key="id">
            <div
              class="msg"
              class:new-group="$data.newGroup"
              attr:role="$data.role"
            >
              <!-- hover 显示的落盘时间（AI 消息的时间在 ai-foot 右侧展示） -->
              <o-if :value="$data.role !== 'assistant'">
                <span class="msg-ts" attr:data-role="$data.role">{{ $host.msgTs($data) }}</span>
              </o-if>
              <o-if :value="$data.role === 'user'">
                <!-- 编辑态：末条用户消息就地改写后重发（仅停止后可进入） -->
                <o-if :value="$host.editingMsgId === $data.id">
                  <div class="user-edit">
                    <!-- o-fill item 作用域内 sync 解析不到页面级 data：手动绑定
                         （:value 单向 + input 表达式回写 $host.editDraft） -->
                    <textarea
                      class="edit-area"
                      rows="3"
                      :value="$host.editDraft"
                      on:input="$host.editDraft = $event.target.value"
                    ></textarea>
                    <div class="edit-actions">
                      <button class="edit-btn" on:click="$host.cancelMsgEdit()">取消</button>
                      <button class="edit-btn primary" on:click="$host.saveMsgEdit()">重新发送</button>
                    </div>
                  </div>
                </o-if>
                <o-if :value="$host.editingMsgId !== $data.id">
                  <div class="user-row">
                    <div class="user-bubble">
                      <!-- 文本包一层单行 span：pre-wrap 在 span 上（保留用户手打
                           换行），气泡自身的模板缩进空隙按普通空白折叠，不再被
                           pre-wrap 渲染成撑高气泡的空行 -->
                      <span class="user-text"><o-if :value="$data.content !== ''">{{$data.content}}</o-if></span>
                      <!-- 多模态图片：缩略图展示，点击看大图（图片-only 消息文本留空） -->
                      <div class="user-imgs" class:show="$host.msgImages($data).length > 0">
                        <o-fill :value="$host.msgImages($data)">
                          <img
                            class="user-img"
                            attr:src="$data"
                            on:click="$host.openImage($data)"
                          />
                        </o-fill>
                      </div>
                    </div>
                    <!-- 编辑并重发：仅当前会话末条用户消息、且停止/完成后显示 -->
                    <o-if :value="$host.canEditMsg($data)">
                      <button
                        class="msg-edit-btn"
                        attr:title="'编辑并重发'"
                        on:click="$host.startMsgEdit($data.id)"
                      >
                        <n-icon icon="mdi:pencil-outline"></n-icon>
                      </button>
                    </o-if>
                  </div>
                </o-if>
              </o-if>

              <!-- 视觉交互表单卡片（show-form 包的组件，ready 预载） -->
              <o-if :value="$host.isFormMsg($data)">
                <show-form-card
                  :spec="$data.form"
                  on:form-submit="$host.onFormSubmit($event, $data.id)"
                ></show-form-card>
              </o-if>

              <o-if :value="$host.isAiMsg($data)">
                <div class="ai-block">
                  <div class="ai-head">
                    <o-if :value="$host.aiModel($data) !== ''">
                      <span class="ai-model" attr:title="'回答模型：' + $host.aiModel($data)">{{$host.aiModel($data)}}</span>
                    </o-if>
                    <o-if :value="$host.hasReasoning($data)">
                      <button
                        class="reasoning-toggle"
                        class:open="$data.reasoningOpen"
                        class:live="$host.reasoningLive($data)"
                        attr:title="$data.reasoningOpen ? '收起思考过程' : '展开思考过程'"
                        on:click="$host.toggleReasoning($data.id)"
                      >
                        <span class="tool-chev">
                          <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path d="M9 6l6 6-6 6" />
                          </svg>
                        </span>
                        <span class="reasoning-toggle-label">{{$host.reasoningLive($data) ? '正在思考' : '思考'}}</span>
                        <!-- 收起态：滚动展示思考的最后一行（流式中不停变化） -->
                        <span class="reasoning-tail" attr:hidden="$host.reasoningTailHidden($data)">{{$host.reasoningTail($data)}}</span>
                        <o-if :value="$host.reasoningTokens($data) !== ''">
                          <span class="reasoning-tok" attr:title="'本次思考消耗的输出 token'">{{$host.reasoningTokens($data)}}</span>
                        </o-if>
                      </button>
                    </o-if>
                  </div>
                  <o-if :value="$data.reasoning !== '' ? $data.reasoningOpen : false">
                    <div class="reasoning-body">{{$data.reasoning}}</div>
                  </o-if>
                  <div class="ai-text" :html="$host.renderMd($data.content)"></div>
                  <!-- 本回合变更卡：占满消息列宽；文件为网格芯片（每枚 ≥300px，
                       列数随宽度自适应），点击选中 → 下方共享 diff 面板切换内容
                       （VS Code 编辑器式：面板随选中开合动画，切文件只换内容） -->
                  <o-if :value="$host.turnChanges($data).length > 0">
                    <div class="turn-changes" class:open="$host.changesMsgId === $data.id">
                      <button class="tc-head" on:click="$host.toggleChanges($data.id)">
                        <n-icon class="tc-head-icon" icon="mdi:file-code-outline"></n-icon>
                        <span class="tc-title">本回合改动</span>
                        <span class="tc-count">{{$host.turnChanges($data).length}} 个文件</span>
                        <span class="tc-stat">
                          <span class="tc-adds">+{{$host.turnAdds($data)}}</span>
                          <span class="tc-dels">−{{$host.turnDels($data)}}</span>
                        </span>
                        <!-- 场景测试状态（仅最后一个带改动的回合展示）：
                             回合收尾自动跑 + 手动跑共用的上次全量结果 -->
                        <o-if :value="$host.showTestChip($data)">
                          <span
                            class="tc-test"
                            class:bad="!$host.testLastRun.ok"
                            attr:title="$host.testChipTitle()"
                          >测试 {{$host.testChipText()}}</span>
                        </o-if>
                        <n-icon class="tc-chev" icon="mdi:chevron-down"></n-icon>
                      </button>
                      <div class="tc-collapse">
                        <div class="tc-body">
                          <div class="tc-files">
                            <o-fill :value="$host.turnChanges($data)" fill-key="path">
                              <button
                                class="tc-file"
                                class:active="$host.fileDiffPath === $data.path"
                                attr:title="'查看 ' + $data.path + ' 的行级改动（快照 vs 当前）'"
                                on:click="$host.toggleFileDiff($data.path)"
                              >
                                <span class="tc-file-path">{{$data.path}}</span>
                                <span class="tc-file-stat">
                                  <span class="tc-adds">+{{$data.adds || 0}}</span>
                                  <span class="tc-dels">−{{$data.dels || 0}}</span>
                                </span>
                              </button>
                            </o-fill>
                          </div>
                          <div class="tc-diffzone" class:has="$host.fileDiffPath !== ''">
                            <div class="tc-collapse">
                              <div class="tc-diff-wrap">
                                <div class="tc-diff-head">
                                  <n-icon icon="mdi:file-code-outline"></n-icon>
                                  <span class="tc-diff-path">{{$host.fileDiffPath}}</span>
                                  <span class="tc-diff-note" attr:hidden="$host.diffNoteText() === ''">{{$host.diffNoteText()}}</span>
                                </div>
                                <div class="tc-diff">
                                  <o-if :value="$host.showDiffEmpty()">
                                    <div class="tc-diff-empty">{{$host.diffEmptyText($host.fileDiffPath)}}</div>
                                  </o-if>
                                  <o-fill :value="$host.diffHunks">
                                    <div class="diff-line" attr:type="$data.type">
                                      <span class="diff-ln">{{$data.type === 'gap' ? '' : ($data.type === 'add' ? $data.bLn : $data.aLn)}}</span>
                                      <span class="diff-txt">{{$data.text}}</span>
                                    </div>
                                  </o-fill>
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="tc-foot">
                            <o-if :value="$host.turnActionsAvailable($data) && $data.snapshotId">
                              <!-- 回滚：单按钮，点击原地展开语义选项（不满意负反馈 / 仅还原），
                                   选完即执行；回滚成功且当前内容等于该回合快照时进入「已回滚」禁用态 -->
                              <o-if :value="$host.rollbackOptionsOpen === $data.id">
                                <button
                                  class="tc-rollback danger"
                                  attr:title="'还原文件并告知 AI 你对该回合改动不满意（下次对话生效）'"
                                  on:click="$host.runRollback($data, 'dissatisfied')"
                                >
                                  <n-icon icon="mdi:thumb-down-outline"></n-icon>
                                  <span>不满意，撤销</span>
                                </button>
                                <button
                                  class="tc-rollback"
                                  attr:title="'仅把文件还原到本回合开始前（中性，AI 下次对话会感知回滚）'"
                                  on:click="$host.runRollback($data, 'neutral')"
                                >
                                  <n-icon icon="mdi:restore"></n-icon>
                                  <span>仅还原代码</span>
                                </button>
                              </o-if>
                              <button
                                class="tc-rollback"
                                attr:disabled="$host.turnReverted($data)"
                                attr:title="$host.turnReverted($data) ? '该回合改动已还原（当前内容与回合前快照一致）' : '还原该回合的文件改动：可选择是否告知 AI 不满意（对话记录不受影响）'"
                                on:click="$host.toggleRollbackOptions($data)"
                              >
                                <n-icon icon="mdi:restore"></n-icon>
                                <span>{{$host.rollbackBtnText($data)}}</span>
                              </button>
                            </o-if>
                            <o-if :value="$host.turnActionsAvailable($data) && $data.snapshotId">
                              <!-- 备份代码：相当于一次智能备份（打包 + AI 标题备注）；
                                   当前内容已有备份（backups 含 current 项）时禁用并显示已备份 -->
                              <button
                                class="tc-rollback save"
                                class:done="$host.curBackedUp()"
                                attr:disabled="$host.backupDisabled()"
                                attr:title="$host.curBackedUp() ? '当前内容已有备份（备份管理中标记为「与当前一致」）' : '智能备份当前代码：打包 + AI 生成标题与备注，可在备份管理查看'"
                                on:click="$host.backupTurnCode()"
                              >
                                <n-icon icon="mdi:content-save-check-outline"></n-icon>
                                <span>{{$host.backupBtnText()}}</span>
                              </button>
                            </o-if>
                            <o-if :value="$host.turnActionsAvailable($data) && !$data.snapshotId">
                              <span class="tc-foot-note">本回合没有快照，无法回滚</span>
                            </o-if>
                            <o-if :value="!$host.turnActionsAvailable($data)">
                              <span class="tc-foot-note">历史回合，仅可查看当时的改动</span>
                            </o-if>
                          </div>
                        </div>
                      </div>
                    </div>
                  </o-if>
                  <o-if :value="$host.hasUsage($data) || $host.turnStatsMissing($data) || $host.canFork() || $host.aiTime($data) !== '' || $data.stopped">
                    <div class="ai-foot">
                      <o-if :value="$data.stopped">
                        <span class="ai-stopped" attr:title="'本轮由用户手动停止，已生成内容保留'">
                          <n-icon icon="mdi:hand-back-right"></n-icon>
                          <span>已手动停止</span>
                        </span>
                      </o-if>
                      <o-if :value="$host.hasUsage($data) || $host.turnStatsMissing($data)">
                        <!-- 本轮用量：描边 Chip 显示紧凑总量，点击弹出明细面板
                             （缓存命中 / 未缓存输入 / 缓存读取 / 输出）；
                             回合已收尾但缺用量记录时降级显示「用量缺失」并说明原因 -->
                        <span class="stat-anchor">
                          <button
                            class="stat-pill sm"
                            class:open="$host.openUsageMsgId === $data.id"
                            attr:title="$host.turnUsageTitle($data)"
                            on:click="$host.toggleUsagePanel($data.id)"
                          >
                            <n-icon icon="mdi:coins"></n-icon>
                            <span>{{$host.turnUsagePillText($data)}}</span>
                          </button>
                          <!-- 对话区面板恒为左对齐（align-left 静态类）：居中
                               会溢出消息滚动层左缘被裁掉，滚动层宽度视口测量不到 -->
                          <span class="stat-panel align-left" class:open="$host.openUsageMsgId === $data.id">
                            <span class="stat-panel-head">
                              <n-icon icon="mdi:coins"></n-icon>
                              <span class="stat-panel-title">本轮用量</span>
                              <span class="stat-panel-value">{{$host.turnUsageHeadText($data)}}</span>
                            </span>
                            <span class="stat-rows">
                              <o-if :value="$data.model">
                                <span class="stat-row"
                                  ><span class="stat-dt">提供方 / 模型</span
                                  ><span class="stat-dd">{{$data.model}}</span></span
                                >
                              </o-if>
                              <o-if :value="$host.usageCacheHit($data) !== ''">
                                <span class="stat-row"
                                  ><span class="stat-dt">缓存命中</span
                                  ><span class="stat-dd">{{$host.usageCacheHit($data)}}%</span></span
                                >
                              </o-if>
                              <o-if :value="$host.hasUsage($data)">
                                <span class="stat-row"
                                  ><span class="stat-dt">未缓存输入</span
                                  ><span class="stat-dd">{{$host.fmtTokExact($host.usageUncachedOf($data))}} tok</span></span
                                >
                              </o-if>
                              <o-if :value="$host.usageCacheReadOf($data) > 0">
                                <span class="stat-row"
                                  ><span class="stat-dt">缓存读取</span
                                  ><span class="stat-dd">{{$host.fmtTokExact($host.usageCacheReadOf($data))}} tok</span></span
                                >
                              </o-if>
                              <o-if :value="$host.hasUsage($data)">
                                <span class="stat-row"
                                  ><span class="stat-dt">输出</span
                                  ><span class="stat-dd">{{$host.usageOutputText($data)}}</span></span
                                >
                              </o-if>
                              <o-if :value="$host.turnStatsMissing($data)">
                                <span class="stat-row"
                                  ><span class="stat-dt">数据缺失</span
                                  ><span class="stat-dd">本回合已收尾（耗时 {{$host.fmtDurCompact($data.turnMs)}}），但无用量记录——异常收场 / 早期会话，无法事后恢复</span></span
                                >
                              </o-if>
                            </span>
                          </span>
                        </span>
                      </o-if>
                      <o-if :value="$host.canFork()">
                        <button
                          class="fork-btn"
                          attr:title="'从这条回复处创建分支会话：复制此前全部聊天记录到新会话'"
                          on:click="$host.forkFrom($data.id)"
                        >
                          <n-icon icon="mdi:source-branch"></n-icon>
                          <span>fork</span>
                        </button>
                      </o-if>
                      <!-- 右侧：本条回复落盘时间 + 本轮耗时 -->
                      <span class="ai-time" attr:title="'回复时间与本轮耗时'">{{$host.aiTime($data)}}</span>
                    </div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'tool'">
                <div
                  class="tool-row"
                  class:open="$data.open"
                  class:pending="$data.pending"
                >
                  <button class="tool-head" on:click="$host.toggleTool($data.id)">
                    <span class="tool-chev">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </span>
                    <span class="tool-icon">
                      <n-icon attr:icon="$host.toolIcon($data.name)"></n-icon>
                    </span>
                    <span class="tool-title">{{$data.name}}</span>
                    <span class="tool-summary">{{$data.summary}}</span>
                    <span class="tool-status">
                      <span class="tool-status-badge run">
                        <n-icon icon="mdi:loading"></n-icon>
                        <span>运行中</span>
                      </span>
                      <span class="tool-status-badge done">
                        <n-icon icon="mdi:check"></n-icon>
                        <span>完成</span>
                      </span>
                    </span>
                  </button>
                  <o-if :value="$data.open">
                    <div class="tool-body">
                      <div class="tool-section">
                        <div class="tool-label">参数</div>
                        <pre class="tool-code">{{$data.args}}</pre>
                      </div>
                      <div class="tool-section">
                        <div class="tool-label">结果</div>
                        <pre class="tool-code">{{$data.result}}</pre>
                      </div>
                      <!-- 失败诊断（diag）：链路事件 / 窗口快照，dbg 类失败没有
                           错误卡，诊断只能从这里看（默认随工具卡折叠） -->
                      <o-if :value="$data.diag">
                        <div class="tool-section">
                          <div class="tool-label">
                            诊断 · {{$host.diagInfo($data).stage}}（链路事件 {{$host.diagRows($data).length}} 条）
                          </div>
                          <div class="diag-detail">
                            <div class="diag-meta">
                              <span>对端：{{$host.diagInfo($data).peer}}</span>
                              <span>时间：{{$host.diagInfo($data).at}}</span>
                            </div>
                            <o-if :value="$host.diagWindows($data).length > 0">
                              <div class="diag-label">预览窗口</div>
                              <div class="diag-wins">
                                <o-fill :value="$host.diagWindows($data)" fill-key="id">
                                  <div class="diag-win">
                                    <span class="diag-dot" attr:data-on="$data.online"></span>
                                    <span class="diag-win-app">{{$data.app || "?"}}</span>
                                    <span class="diag-win-id">{{$data.sid}}</span>
                                    <span class="diag-win-st">{{$data.online ? "在线" : "离线"}}</span>
                                  </div>
                                </o-fill>
                              </div>
                            </o-if>
                            <div class="diag-events">
                              <o-fill :value="$host.diagRows($data)" fill-key="eid">
                                <div class="diag-ev">
                                  <span class="diag-ev-t">{{$data.tt}}</span>
                                  <span class="diag-ev-p" attr:data-tone="$data.tone">{{$data.phase}}</span>
                                  <span class="diag-ev-x">{{$data.extra}}</span>
                                </div>
                              </o-fill>
                            </div>
                          </div>
                        </div>
                      </o-if>
                    </div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'compact'">
                <div class="compact-card" class:open="$data.open">
                  <button class="compact-head" on:click="$host.toggleTool($data.id)">
                    <span class="tool-chev">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </span>
                    <n-icon icon="mdi:archive-arrow-down-outline"></n-icon>
                    <span class="compact-title">已压缩 {{$data.count}} 条历史记忆</span>
                    <span class="compact-hint">点击查看摘要</span>
                  </button>
                  <o-if :value="$data.open">
                    <div class="compact-body">{{$data.summary}}</div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'image'">
                <div class="shot-card">
                  <div class="shot-head">
                    <n-icon icon="mdi:camera-outline"></n-icon>
                    <span>预览窗口截图</span>
                    <o-if :value="$data.w > 0">
                      <span class="shot-size">{{$data.w}} × {{$data.h}}</span>
                    </o-if>
                  </div>
                  <img class="shot-img" attr:src="$data.src" attr:alt="'预览窗口截图 ' + $data.w + 'x' + $data.h" />
                </div>
              </o-if>

              <o-if :value="$data.role === 'app'">
                <div class="app-card">
                  <div class="app-card-head">
                    <span class="app-card-icon">{{$data.icon}}</span>
                    <div class="app-card-title">
                      <div class="app-card-name">{{$data.displayName}}</div>
                      <div class="app-card-dir">{{$host.dirText($data)}}</div>
                    </div>
                  </div>
                  <o-if :value="$data.ready">
                    <div class="app-card-actions">
                      <st-button
                        on:click="$host.openAppRemote($data.appName, $data.mode)"
                      >
                        ▶ 预览应用
                      </st-button>
                    </div>
                  </o-if>
                  <o-if :value="$data.ready === false">
                    <div class="app-card-missing">
                      还缺文件：{{$data.missing.join('、')}}
                    </div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'error'">
                <!-- 宿主错误卡片：回合中发生的错误镜像进对话（仅展示，不传给 AI）。
                     携带 diag 诊断（链路事件 / 窗口快照等）时整卡可点开，供事后排查 -->
                <div class="local-error-card" class:diag-open="$data.diagOpen">
                  <div
                    class="local-error-main"
                    class:has-diag="$data.diag"
                    on:click="$host.toggleDiag($data)"
                  >
                    <n-icon icon="mdi:alert-outline"></n-icon>
                    <div class="local-error-text">{{$data.text}}</div>
                    <o-if :value="$data.diag">
                      <span class="diag-chip">
                        <span>诊断</span>
                        <n-icon icon="mdi:chevron-down"></n-icon>
                      </span>
                    </o-if>
                  </div>
                  <o-if :value="$data.diag && $data.diagOpen">
                    <div class="diag-detail">
                      <div class="diag-meta">
                        <span>阶段：{{$host.diagInfo($data).stage}}</span>
                        <span>对端：{{$host.diagInfo($data).peer}}</span>
                        <span>时间：{{$host.diagInfo($data).at}}</span>
                      </div>
                      <o-if :value="$host.diagWindows($data).length > 0">
                        <div class="diag-label">预览窗口</div>
                        <div class="diag-wins">
                          <o-fill :value="$host.diagWindows($data)" fill-key="id">
                            <div class="diag-win">
                              <span class="diag-dot" attr:data-on="$data.online"></span>
                              <span class="diag-win-app">{{$data.app || "?"}}</span>
                              <span class="diag-win-id">{{$data.sid}}</span>
                              <span class="diag-win-st">{{$data.online ? "在线" : "离线"}}</span>
                            </div>
                          </o-fill>
                        </div>
                      </o-if>
                      <div class="diag-label">链路事件（{{$host.diagRows($data).length}} 条）</div>
                      <div class="diag-events">
                        <o-fill :value="$host.diagRows($data)" fill-key="eid">
                          <div class="diag-ev">
                            <span class="diag-ev-t">{{$data.tt}}</span>
                            <span class="diag-ev-p" attr:data-tone="$data.tone">{{$data.phase}}</span>
                            <span class="diag-ev-x">{{$data.extra}}</span>
                          </div>
                        </o-fill>
                      </div>
                    </div>
                  </o-if>
                </div>
              </o-if>
            </div>
          </o-fill>

          <o-if :value="sending && turnInView">
            <!-- 生成中：右侧实时用时（clock 每秒心跳驱动刷新）；文案随回合
                 活动切换（思考中 / 正在执行 xx / 生成中），且只在回合视图显示 -->
            <div class="turn-status">{{ turnStatusText(clock) }}</div>
          </o-if>

          <o-if :value="interrupted && !sending && !interruptedDismissed">
            <!-- 上次回合被硬中断（刷新 / 崩溃）：对话末尾提醒，可从断点继续。
                 wire 记忆停在合法断点（mz/ai 落盘保证 tool_calls 不悬空），
                 补发一条「继续」即接着断点做；整卡可点，× 仅收起本次提醒 -->
            <div class="interrupt-card" on:click="continueInterrupted">
              <n-icon class="interrupt-ico" icon="mdi:restart-alert"></n-icon>
              <div class="interrupt-main">
                <div class="interrupt-title">上一轮对话被中断了</div>
                <div class="interrupt-desc">
                  页面刷新或意外关闭导致生成暂停，已完成的内容不会丢失。
                </div>
              </div>
              <span class="interrupt-go">继续对话</span>
              <button
                class="interrupt-x"
                title="暂不提醒"
                on:click="dismissInterrupted($event)"
              >
                <n-icon icon="mdi:close"></n-icon>
              </button>
            </div>
          </o-if>
        </div>
      </section>

      <!-- 拖动调整对话列宽（左右边界对称手柄，calc 贴 --chat-w 边界跟随；
           逻辑见 startChatResize，记忆到 sessionStorage） -->
      <div class="chat-resize left" on:pointerdown="startChatResize($event, -1)" title="拖动调整对话宽度"></div>
      <div class="chat-resize right" on:pointerdown="startChatResize($event, 1)" title="拖动调整对话宽度"></div>

      <o-if :value="!atBottom && messages.length > 0">
        <button class="to-bottom" title="回到底部" on:click="toBottomNow">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
      </o-if>
    </div>

    <footer class="composer-wrap">
      <o-if :value="keyError">
        <div class="key-error-row">
          <div class="key-error">{{keyError}}</div>
          <o-if :value="permGrantNeeded">
            <st-button class="perm-grant-btn" on:click="grantLocalPermission">
              🔑 授权目录
            </st-button>
          </o-if>
          <st-icon-button title="关闭（下次出错会再提示）" on:click="dismissKeyError">
            <n-icon icon="mdi:close"></n-icon>
          </st-icon-button>
        </div>
      </o-if>
      <div class="composer">
        <textarea
          id="inputer"
          sync:value="input"
          rows="1"
          attr:placeholder="inputPlaceholder"
          attr:disabled="sending && turnInView"
          on:keydown="handleKeydown($event)"
          on:paste="handlePaste($event)"
        ></textarea>
        <div class="composer-row">
          <!-- 待发送图片附件（粘贴 / 选择）：贴着动作条左侧，随下条消息一起发出 -->
          <o-if :value="pendingImages.length > 0">
            <div class="attach-row">
              <o-fill :value="pendingImages" fill-key="id">
                <div class="attach-chip">
                  <img attr:src="$data.src" on:click="$host.openImage($data.src)" />
                  <button
                    class="attach-x"
                    on:click="$host.removePendingImage($data.id)"
                    title="移除图片"
                  >×</button>
                </div>
              </o-fill>
              <span class="attach-hint">随下条消息发送</span>
            </div>
          </o-if>
          <!-- 写入目标只在「新应用」阶段可选；create_app 落地后随应用锁定 -->
          <o-if :value="currentAppName === ''">
            <div class="target-picker">
              <button
                class="target-opt"
                class:active="storageMode === 'vfs'"
                on:click="selectMode('vfs')"
                title="写入虚拟文件系统 /$ai-apps/"
              >
                📁 虚拟系统
              </button>
              <button
                class="target-opt"
                class:active="storageMode === 'local'"
                on:click="selectMode('local')"
                title="写入本地磁盘目录（仅 Chrome）"
              >
                📂 本地目录
              </button>
              <button
                class="target-dir"
                class:show="storageMode === 'local'"
                on:click="chooseLocalDir"
                title="重新选择本地目录"
              >
                {{ localDirLabel ? localDirLabel : '选择目录…' }}
              </button>
            </div>
          </o-if>
          <o-if :value="currentAppName !== ''">
            <span class="composer-meta">📂 {{dirText({ mode: currentAppMode, appName: currentAppName })}}</span>
          </o-if>
          <!-- 添加图片（多模态输入）：点击选文件；输入框内直接粘贴截图亦可 -->
          <button class="attach-btn" on:click="pickImages" title="添加图片（也可在输入框直接粘贴）">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
          </button>
          <!-- 模型 + 推理等级 + Key + 窗口 + 单轮步数：st-menu 钻入式选择菜单 -->
          <st-menu align="right">
            <button
              slot="trigger"
              class="model-trigger"
              attr:title="'模型与推理等级（当前：' + modelTriggerText + '）'"
            >
              <span class="model-trigger-label">{{modelTriggerText}}</span>
              <svg
                class="model-chev"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <st-menu-item>
              模型
              <span slot="suffix" class="menu-value">{{modelValueText}}</span>
              <st-menu slot="sub-menu">
                <st-menu-item on:click="pickModel('')">
                  <span slot="prefix" class="menu-check">{{activeModelId === '' ? '✓' : ''}}</span>
                  自动（供应商默认）
                </st-menu-item>
                <o-fill :value="modelOptions" fill-key="id">
                  <st-menu-item on:click="$host.pickModel($data.id)">
                    <span slot="prefix" class="menu-check">{{$host.modelCheck($data.id)}}</span>
                    {{$data.label}}
                  </st-menu-item>
                </o-fill>
                <o-if :value="modelOptions.length === 0">
                  <span class="menu-empty">当前 Key 未拉取到模型清单</span>
                </o-if>
              </st-menu>
            </st-menu-item>
            <st-menu-item>
              推理等级
              <span slot="suffix" class="menu-value">{{reasoningLabel()}}</span>
              <st-menu slot="sub-menu">
                <o-fill :value="effortOptions" fill-key="id">
                  <st-menu-item on:click="$host.pickReasoning($data.id)">
                    <span slot="prefix" class="menu-check">{{$host.reasoningCheck($data.id)}}</span>
                    {{$data.label}}
                  </st-menu-item>
                </o-fill>
                <o-if :value="effortOptions.length === 0">
                  <span class="menu-empty">当前模型思考不可调（模型内置）</span>
                </o-if>
              </st-menu>
            </st-menu-item>
            <st-menu-item>
              Key
              <span slot="suffix" class="menu-value">{{activeKeyText}}</span>
              <st-menu slot="sub-menu">
                <st-menu-item on:click="pickKey('')">
                  <span slot="prefix" class="menu-check">{{activeKeyId === '' ? '✓' : ''}}</span>
                  自动选择（负载均衡）
                </st-menu-item>
                <o-fill :value="apiKeys" fill-key="id">
                  <st-menu-item on:click="$host.pickKey($data.id)">
                    <span slot="prefix" class="menu-check">{{$host.keyCheck($data.id)}}</span>
                    {{$data.provider === 'relay' ? $data.serverName || 'Relay' : $data.provider}} · {{$data.maskedKey}}
                  </st-menu-item>
                </o-fill>
                <o-if :value="apiKeys.length === 0">
                  <span class="menu-empty">未配置 Key（去密钥管理器添加）</span>
                </o-if>
              </st-menu>
            </st-menu-item>
            <st-menu-item>
              窗口
              <span slot="suffix" class="menu-value">{{ctxWindowText}}</span>
              <st-menu slot="sub-menu">
                <o-fill :value="ctxOptions" fill-key="value">
                  <st-menu-item on:click="$host.pickWindow($data.value)">
                    <span slot="prefix" class="menu-check">{{$host.windowCheck($data.value)}}</span>
                    {{$data.label}}
                  </st-menu-item>
                </o-fill>
              </st-menu>
            </st-menu-item>
            <st-menu-item>
              单轮步数
              <span slot="suffix" class="menu-value">{{maxStepsText}}</span>
              <st-menu slot="sub-menu">
                <o-fill :value="maxStepsOptions" fill-key="value">
                  <st-menu-item on:click="$host.pickMaxSteps($data.value)">
                    <span slot="prefix" class="menu-check">{{$host.maxStepsCheck($data.value)}}</span>
                    {{$data.label}}
                  </st-menu-item>
                </o-fill>
              </st-menu>
            </st-menu-item>
          </st-menu>
          <o-if :value="!sending || !turnInView">
            <st-button
              class="send-btn"
              attr:disabled="sending || !canSend()"
              attr:title="sending ? '另一会话生成中' : '发送（Enter）'"
              on:click="handleSend"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 19V5" />
                <path d="M5 12l7-7 7 7" />
              </svg>
            </st-button>
          </o-if>
          <o-if :value="sending && turnInView">
            <st-button
              class="send-btn stop"
              color="error"
              attr:disabled="stopRequested"
              attr:title="stopRequested ? '正在停止…' : '停止生成'"
              on:click="handleStop"
            >
              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                stroke="currentColor"
                stroke-width="1"
              >
                <rect x="7" y="7" width="10" height="10" rx="1.5" />
              </svg>
            </st-button>
          </o-if>
        </div>
      </div>
      <!-- 图片选择器（attach-btn 触发；display:none 而非 hidden 属性，避免被布局样式顶开） -->
      <input id="imgPicker" type="file" accept="image/*" multiple style="display: none" on:change="onPickImages($event)" />
      <!-- 底部统计胶囊（点开明细面板）：会话统计 / Token 用量 / 上下文占用；
           数据缺失（异常收场 / 早期会话）时降级显示并说明缺了什么，
           只有完全无记录的空会话才不渲染 -->
      <div class="stats-dock">
        <o-if :value="statSteps > 0 || statTurns > 0">
          <span class="stat-anchor">
            <button
              class="stat-pill"
              class:open="openStat === 'time'"
              attr:title="timePillTitle()"
              on:click="toggleStat('time')"
            >
              <n-icon icon="mdi:timer-outline"></n-icon>
              <span class="stat-pill-label">{{timePillText()}}</span>
            </button>
            <span class="stat-panel" class:open="openStat === 'time'">
                <span class="stat-panel-head">
                  <n-icon icon="mdi:timer-outline"></n-icon>
                  <span class="stat-panel-title">会话统计</span>
                </span>
                <span class="stat-rows">
                  <o-if :value="statLlmMs > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">模型用时</span
                      ><span class="stat-dd">{{fmtDurCompact(statLlmMs)}}</span></span
                    >
                  </o-if>
                  <o-if :value="statToolMs > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">工具调用用时</span
                      ><span class="stat-dd">{{fmtDurCompact(statToolMs)}}</span></span
                    >
                  </o-if>
                  <o-if :value="statTtftAvg > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">首 token 平均（TTFT）</span
                      ><span class="stat-dd">{{fmtDurCompact(statTtftAvg)}}</span></span
                    >
                  </o-if>
                  <o-if :value="statTps > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">输出速度（TPS）</span
                      ><span class="stat-dd">{{statTps}} tok/s</span></span
                    >
                  </o-if>
                  <o-if :value="statSteps === 0">
                    <span class="stat-row"
                      ><span class="stat-dt">数据缺失</span
                      ><span class="stat-dd">本会话无步数与用时记录（异常收场 / 早期会话）</span></span
                    >
                  </o-if>
                </span>
              </span>
          </span>
        </o-if>
        <o-if :value="usageTotal > 0 || statMissingTurns > 0">
          <span class="stat-anchor">
            <button
              class="stat-pill"
              class:open="openStat === 'usage'"
              attr:title="usagePillTitle()"
              on:click="toggleStat('usage')"
            >
              <n-icon icon="mdi:coins"></n-icon>
              <span class="stat-pill-label">{{usagePillText()}}</span>
            </button>
            <span class="stat-panel" class:open="openStat === 'usage'">
                <span class="stat-panel-head">
                  <n-icon icon="mdi:coins"></n-icon>
                  <span class="stat-panel-title">Token 用量</span>
                  <span class="stat-panel-value">{{usageHeadText()}}</span>
                </span>
                <span class="stat-rows">
                  <o-if :value="usageCacheRead > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">缓存命中</span
                      ><span class="stat-dd">{{cacheHitPct()}}%</span></span
                    >
                  </o-if>
                  <o-if :value="usageTotal > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">未缓存输入</span
                      ><span class="stat-dd">{{fmtTokExact(usageUncached)}} tok</span></span
                    >
                  </o-if>
                  <o-if :value="usageCacheRead > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">缓存读取</span
                      ><span class="stat-dd">{{fmtTokExact(usageCacheRead)}} tok</span></span
                    >
                  </o-if>
                  <o-if :value="usageTotal > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">输出</span
                      ><span class="stat-dd">{{fmtTokExact(usageOutput)}} tok</span></span
                    >
                  </o-if>
                  <o-if :value="statMissingTurns > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">数据缺失</span
                      ><span class="stat-dd">{{statMissingTurns}} 个回合无用量记录（异常收场 / 早期会话，无法事后恢复）</span></span
                    >
                  </o-if>
                </span>
              </span>
          </span>
        </o-if>
        <o-if :value="ctxUsed > 0 || ctxUnknown">
          <span class="stat-anchor">
            <button
              class="stat-pill"
              class:open="openStat === 'ctx'"
              attr:title="ctxTitle"
              on:click="toggleStat('ctx')"
            >
              <span class="ctx-track">
                <span class="ctx-fill" class:warn="ctxPct >= 80" :style.width="ctxPct + '%'"></span>
              </span>
              <span class="stat-pill-label">{{ctxPillLabel()}}</span>
            </button>
            <span class="stat-panel" class:open="openStat === 'ctx'">
                <span class="stat-panel-head">
                  <span class="stat-panel-title">{{ctxHeadTitle()}}</span>
                  <span class="stat-panel-value">{{ctxHeadText()}}</span>
                </span>
                <span class="stat-bar">
                  <span class="stat-seg seg-sys" :style.width="ctxSegSys + '%'"></span>
                  <span class="stat-seg seg-tools" :style.width="ctxSegTools + '%'"></span>
                  <span class="stat-seg seg-msgs" :style.width="ctxSegMsgs + '%'"></span>
                </span>
                <span class="stat-rows">
                  <o-if :value="ctxUnknown">
                    <span class="stat-row"
                      ><span class="stat-dt">数据缺失</span
                      ><span class="stat-dd">会话没有可用的用量记录（异常收场 / 早期会话），占用无法估算</span></span
                    >
                  </o-if>
                  <o-fill :value="ctxBreakRows" fill-key="label">
                    <span class="stat-row">
                      <span class="stat-dt">
                        <span class="stat-swatch" attr:data-k="$data.k"></span>
                        {{$data.label}}
                      </span>
                      <span class="stat-dd">{{$data.text}}</span>
                    </span>
                  </o-fill>
                </span>
                <span class="stat-panel-foot">
                  <button
                    class="stat-compress"
                    attr:disabled="compacting || sending"
                    on:click="compressFromPanel"
                  >
                    {{compacting ? '压缩中…' : '压缩上下文'}}
                  </button>
                </span>
              </span>
          </span>
        </o-if>
      </div>
    </footer>
      <!-- 任务清单（右）：模型开发前拆解的任务 + 宿主自动登记的错误修复任务，
           随 task_list 调用实时勾选推进；按会话持久化，跨暂停 / 刷新续作。
           必须留在 .main-col 内（它是 absolute 定位锚）：挪到外面会落到根节点
           .app 锚上，top:12 从窗口顶算起，整卡盖住顶栏右侧按钮（实测翻过车） -->
      <o-if :value="sessionTasks.length > 0">
        <aside class="tasks-panel" class:collapsed="!tasksPanelOpen">
          <button
            class="tasks-head"
            on:click="toggleTasksPanel"
            attr:title="tasksPanelOpen ? '收起任务清单' : '展开任务清单'"
          >
            <n-icon class="tasks-head-ico" icon="mdi:format-list-checks"></n-icon>
            <span class="tasks-head-title">任务清单</span>
            <span class="tasks-progress">{{tasksDoneCount}}/{{sessionTasks.length}}</span>
            <n-icon class="tasks-chev" icon="mdi:chevron-right"></n-icon>
          </button>
          <!-- body 常驻挂载（不套 o-if）：展开 / 收起走 CSS 过渡——0fr 折叠 +
               淡入淡出 + 任务逐条错峰入场；o-if 卸载会让收起瞬间消失、做不出
               退出动画。tasksPanelOpen 只驱动面板的 collapsed 类 -->
          <div class="tasks-body-wrap">
            <div class="tasks-body">
              <!-- padding 必须在这一层（.tasks-body 是 0fr 的 grid item，
                   它自身的 padding 会漏进轨道尺寸，收起后残留一条高度） -->
              <div class="tasks-list">
              <o-fill :value="sessionTasks" fill-key="id">
                <div
                  class="task-item"
                  attr:data-status="$data.status"
                  class:running="$host.turnInView"
                >
                  <o-if :value="$data.source === 'error'">
                    <span class="task-badge">错误</span>
                  </o-if>
                  <n-icon class="task-ico" attr:icon="$host.taskIcon($data.status)"></n-icon>
                  <span class="task-text">{{$data.text}}</span>
                </div>
              </o-fill>
              </div>
            </div>
          </div>
        </aside>
      </o-if>
      </div>

  <script>
export const parent = "./home.html"; // 嵌套路由：渲染进父页面（布局壳）的 slot

    export default async ({ load }) => {
      const { renderMarkdown } = await load("../lib/markdown.js");
      const { createMsgWindow } = await load("../lib/msg-window.js");
      const { contextInfo } = await load("../lib/builder.js");
      // 共享仓库单例：与父页面（home）共享同一实例，Core 装载 + init 在
      // 引导内完成（本子页是应用启动首页，通常由它先完成引导）
      const { getBuilderStore, getSelfStore } = await load(
        "../lib/store-instance.js",
      );
      const store = await getBuilderStore();
      const selfStore = getSelfStore(); // 页面偏好读写（conjure 空间）

      /* ---- 图片附件（多模态输入）：粘贴 / 选择 → dataURL 规范化 ----
       * 超过 1280 长边或 400KB 的位图缩到 1280 长边 + JPEG 0.85 压缩
       * （请求体与 IndexedDB 持久化都省）；GIF（动图）与达标小图原样保留 */
      const IMG_MAX_EDGE = 1280;
      const IMG_MAX_KEEP_BYTES = 400 * 1024;
      const MAX_PENDING_IMAGES = 8;

      const readAsDataURL = (file) =>
        new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = () => reject(new Error("读取图片失败"));
          r.readAsDataURL(file);
        });

      const loadImage = (src) =>
        new Promise((resolve, reject) => {
          const el = new Image();
          el.onload = () => resolve(el);
          el.onerror = () => reject(new Error("图片解码失败"));
          el.src = src;
        });

      async function normalizeImage(file) {
        if (!/^image\//.test(file.type)) throw new Error("不是图片文件");
        const dataUrl = await readAsDataURL(file);
        if (file.type === "image/gif" || file.size <= IMG_MAX_KEEP_BYTES) {
          return dataUrl;
        }
        const img = await loadImage(dataUrl);
        const scale = Math.min(
          1,
          IMG_MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight),
        );
        if (scale >= 1) return dataUrl; // 尺寸本就不大，只是文件偏大——不再有损压缩
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.85);
      }


      // 面板展示用的工具清单（取每个插件描述的第一句）

      return {
        data: {
          messages: [],
          hiddenOldCount: 0,
          turningKey: "", // 进行中回合的 chatKey（仓库镜像）
          turnInView: false, // 当前视图就是正在生成的会话（状态行/停止按钮只在此时显示）
          editingMsgId: 0, // 就地编辑中的末条用户消息 id（0 = 无）；编辑仅限停止后
          editDraft: "", // 编辑态草稿文本
          input: "",
          pendingImages: [], // 待发送图片附件 [{ id, src }]，随下条消息一起发出
          sending: false,
          stopRequested: false, // 用户点了停止、回合尚未收尾（按钮禁用显示「停止中」）
          turnRetry: null, // 接口请求自动重试倒计时（仓库同步；null = 无重试进行）
          reasoning: "low", // 推理等级偏好（仓库 patch；off/low/medium/high）
          keyError: "",
          interrupted: false, // 上次回合被硬中断（仓库检测，随 patch 事件镜像）
          interruptedDismissed: false, // 提醒卡本次视图收起（切换会话重置）
          coreError: "",
          atBottom: true,
          chatWidth: 768, // 对话内容列宽度（左右手柄拖拽可调，480–1280，--chat-w 驱动）
          testLastRun: null, // 上次全量摘要 {at, ok, pass, fail}
          backups: [], // 当前应用已备份清单（backup/ 目录名，新的在前）
          backupBusy: false, // 正在打包备份
          smartBackupBusy: false, // 智能备份的 AI 分析阶段
          currentAppName: "", // "" = 新应用草稿
          currentAppDisplay: "",
          currentAppIcon: "📦",
          inputPlaceholder: "", // 输入框占位文案（草稿 = 生成应用；应用内 = 迭代修改）
          currentAppMode: "vfs",
          clock: 0, // 计时心跳：AI 回复进行中每秒更新，驱动「生成中」实时用时
          turnStartTs: 0, // 进行中回合开始时间戳（仓库同步）
          currentSessionId: "",
          currentSessionTitle: "",
          storageMode: "vfs",
          localDirLabel: "",
          permGrantNeeded: false,
          // 会话任务清单（task_list 工具维护，对话右侧面板展示；store 镜像）
          sessionTasks: [],
          tasksPanelOpen: true, // 面板折叠开关（页面级 UI 态，不持久化）
          // 上下文占用进度（applyMessageEvent 时由 contextInfo 重算；ctx Chip 用）
          ctxUsed: 0,
          ctxPct: 0,
          ctxTitle: "",
          ctxUnknown: false, // 会话有 AI 消息但拿不到 usage → 占用未知，胶囊降级显示
          // 底部统计胶囊（syncStats 随消息/状态事件重算）
          statTurns: 0, // 轮 = 会话内用户回合数
          statSteps: 0, // 步 = 模型调用次数（跨回合累计）
          statMissingTurns: 0, // 已收尾但缺用量记录的回合数（异常收场 / 早期会话）
          statLlmMs: 0,
          statToolMs: 0,
          statTtftAvg: 0,
          statTps: 0,
          usageTotal: 0,
          usagePrompt: 0,
          usageOutput: 0,
          usageCacheRead: 0,
          usageUncached: 0,
          ctxBreakRows: [], // 上下文分解行 [{k, label, text}]
          ctxSegSys: 0, // 分解色条宽度（百分比 × 各部分占比）
          ctxSegTools: 0,
          ctxSegMsgs: 0,
          openStat: "", // 打开中的统计面板："time" | "usage" | "ctx"（互斥，"" 全关）
          openUsageMsgId: 0, // 展开「本轮用量」明细的消息 id（0 = 全关，同时至多一条）
          // 变更卡状态：changesMsgId 展开中的消息 id（0 = 全关）；fileDiffPath
          // 展开中的文件路径（相对当前展开卡，"" = 无）；diffHunks / diffLoading
          // 行级 diff 与加载态；rollbackOptionsOpen 展开回滚语义选项的消息 id
          changesMsgId: 0,
          fileDiffPath: "",
          diffHunks: [],
          diffLoading: "",
          diffError: "",
          diffFromDisk: false, // true = 旧卡片兼容模式（对比当前盘，非冻结内容）
          rollbackOptionsOpen: 0, // 展开回滚语义选项的消息 id（0 = 收起）
          autoErrors: [], // 宿主自动检测的预览错误行（store patch 同步；走任务清单与提示词注入，无独立提示条）
          liveTurnStats: null, // 进行中回合的实时快照（仓库 patch，收尾清零）
          modelTriggerText: "自动 · 低", // 触发器文案：模型 · 推理等级
          modelValueText: "自动（供应商默认）",
          // 推理等级可选项（仓库按当前生效 key 供应商 + 选中模型动态生成——
          // 各家档位不同；空 = 模型思考不可调）与生效档位（夹取后；"" = 不可调）
          effectiveReasoning: "",
          effortOptions: [],
          // 会话最大上下文窗口（token 数，select 切换，偏好持久化；默认 768k）
          ctxWindow: "786432",
          ctxWindowText: "768k",
          // 单回合工具循环步数上限（「单轮步数」菜单切换，偏好持久化；
          // 默认 200，经 store.setMaxSteps 注入 createAgent，下回合生效）
          maxSteps: "200",
          maxStepsText: "200",
          maxStepsOptions: [
            { value: "80", label: "80" },
            { value: "200", label: "200" },
            { value: "400", label: "400" },
            { value: "800", label: "800" },
          ],
          // 上下文压缩进行中（压缩按钮转圈提示）
          compacting: false,
          // 对话用 API Key（镜像自仓库，activeKeyId 为 "" 表示自动）
          apiKeys: [],
          ctxOptions: [
            { value: "131072", label: "128k" },
            { value: "262144", label: "256k" },
            { value: "524288", label: "512k" },
            { value: "786432", label: "768k" },
            { value: "1048576", label: "1mb" },
          ],
          activeKeyId: "",
          activeKeyText: "自动选择",
          // 当前 Agent 模型标识（仓库 patch，悬停气泡展示）
          activeModel: "",
          // 手动选中的对话模型与可选项（跟随选中 Key 的供应商）
          activeModelId: "",
          modelOptions: [],
        },

        async ready() {
          // 恢复对话列宽度偏好（480–1280；窄视口由 width:100% 天然收缩，无需回写）。
          // 存 conjure 空间的 pref:chat-width（跨标签 / 重开持久）；旧值在
          // sessionStorage（标签页级）的存量标签回落读取一次
          try {
            let cw = parseInt(await selfStore?.getItem("pref:chat-width"), 10);
            if (!(cw >= 480 && cw <= 1280)) {
              cw = parseInt(sessionStorage.getItem("aib:chat-width"), 10);
            }
            if (cw >= 480 && cw <= 1280) this.applyChatWidth(cw);
          } catch {
            /* 忽略 */
          }
          // 恢复最大上下文窗口偏好
          try {
            const win = await selfStore?.getItem("pref:ctx-window");
            if (win) {
              this.ctxWindow = String(win);
              this.ctxWindowText =
                {
                  "131072": "128k",
                  "262144": "256k",
                  "524288": "512k",
                  "786432": "768k",
                  "1048576": "1mb",
                }[this.ctxWindow] || "768k";
            }
          } catch {
            /* 忽略 */
          }
          // 恢复单轮步数偏好
          try {
            const ms = parseInt(await selfStore?.getItem("pref:max-steps"), 10);
            if (ms > 0) {
              this.maxSteps = String(ms);
              this.maxStepsText = String(ms);
            }
          } catch {
            /* 忽略 */
          }
          store.setContextWindow(Number(this.ctxWindow));
          store.setMaxSteps(Number(this.maxSteps));
          this.syncActiveKeyText();
          // 反向瀑布流窗口：只渲染最近一段消息（长会话全量渲染 DOM 是卡顿
          // 主因），上滑到顶再按批次补挂更早消息。先于订阅就位（replace 事件走窗口）
          this._win = createMsgWindow(this.messages);
        },

        watch: {
          input() {
            this.autoGrow();
          },
          // 生成开始 / 会话切换：收起编辑态（编辑仅限停止后的末条消息）
          sending() {
            if (this.sending && this.editingMsgId) this.cancelMsgEdit();
          },
          currentSessionId() {
            if (this.editingMsgId) this.cancelMsgEdit();
          },
          // 输入框占位文案跟随项目态
          currentAppName() {
            this.syncInputPlaceholder();
          },
        },

        // ---- 生命周期（根级，proto 内的 attached 不会被调用）----
        attached() {
          // 仓库订阅只在首次装配（路由往返 detach/attach 后由这里重装，
          // setupStoreSync 内含初始全量镜像——单例引导里 init 先于订阅完成，
          // 初始状态不会以事件形式再来）
          if (!this._unsub) this._unsub = this.setupStoreSync();
          // AI 回复进行中每秒心跳，驱动「生成中」右侧实时用时
          this._durTimer = setInterval(() => {
            if (this.sending) this.clock = Date.now();
          }, 1000);
          // 统计面板的收口：点外部与 Esc 收起（st-menu 的开合/Esc/点外部由组件自理）
          this._docClose = (e) => {
            // 页面内容在 shadow DOM 内：document 层事件的 target 已被 retarget
            // 成宿主元素，closest 从宿主向上永远命中不了 shadow 里的 .stat-anchor
            // ——面板内任何按下都被误判成「点外部」（面板上选字即关；已开胶囊
            // 再点先被关、click 的 toggle 又打开，表现为重复弹起）。composed
            // 事件的内外判定必须走 composedPath（同 senti-ui menu 的坑 #21）
            if (
              e.composedPath().some((el) => el.classList?.contains?.("stat-anchor"))
            ) {
              return;
            }
            if (this.openStat) this.openStat = "";
            if (this.openUsageMsgId) this.openUsageMsgId = 0;
          };
          this._docKey = (e) => {
            if (e.key !== "Escape") return;
            if (this.openStat) this.openStat = "";
            if (this.openUsageMsgId) this.openUsageMsgId = 0;
          };
          document.addEventListener("mousedown", this._docClose);
          document.addEventListener("keydown", this._docKey);
          // 代码块复制：事件委托挂在聊天容器上，:html 重渲后依然有效
          this.shadow.$("#chatScroll")?.on("click", async (event) => {
            const btn = event.target?.closest?.(".md-copy");
            if (!btn) return;
            const label = btn.querySelector(".md-copy-label");
            try {
              await navigator.clipboard.writeText(btn.dataset.code || "");
              if (!label) return;
              btn.classList.add("copied");
              label.textContent = "已复制";
              clearTimeout(btn._copyTimer);
              btn._copyTimer = setTimeout(() => {
                btn.classList.remove("copied");
                label.textContent = "复制";
              }, 1500);
            } catch {
              if (label) label.textContent = "复制失败";
            }
          });
        },
        detached() {
          clearInterval(this._durTimer);
          document.removeEventListener("mousedown", this._docClose);
          document.removeEventListener("keydown", this._docKey);
          this._unsub?.();
          this._unsub = null;
        },

        proto: {
          // ---- 仓库事件 → 页面消息列表 ----

          applyMessageEvent(evt) {
            const op = evt?.op;
            // 会话整体切换（replace）：编辑态指向的消息可能已不存在，收起
            if (op === "replace" && this.editingMsgId) this.cancelMsgEdit();
            if (op === "replace") this.interruptedDismissed = false;
            // 窗口模块统一处理：全量（_win.all）与渲染窗口（this.messages）
            // 同步更新；push 只加尾不丢头，replace 重置为最近一段
            this._win.apply(evt);
            this.hiddenOldCount = this._win.hiddenCount;
            // usage 挂在回合末条 AI 消息上，done patch 时刷新进度条
            this.syncCtx();
            // 思考正文流式跟随：展开中的思考自动停在底部（rAF 节流）
            this.scrollReasoningToBottom();
          },


          // API Key 选择器的当前展示文案 + 模型清单合法性（清单由仓库经
          // getModels 动态拉取，随 patch 事件到达本页 modelOptions）
          syncActiveKeyText() {
            const hit = this.apiKeys.find((k) => k.id === this.activeKeyId);
            this.activeKeyText = hit
              ? `${hit.provider === "relay" ? hit.serverName || "Relay" : hit.provider} · ${hit.maskedKey}`
              : "自动选择";
            // 选中的模型不在当前可用清单里（key 已切换 / 清单已刷新）：重置为自动
            if (
              this.activeModelId &&
              !this.modelOptions.some((m) => m.id === this.activeModelId)
            ) {
              this.activeModelId = "";
              store.selectModel("");
            }
          },


          // 重算上下文占用进度（总量由窗口选择决定），并同步底部统计胶囊
          syncCtx() {
            // 上下文占用按全量会话算（渲染窗口只含最近一段）
            const info = contextInfo(this._win.all);
            // 进行中回合用 live 快照覆盖（消息上的终值要等 done/收尾才落）；
            // live 快照属于回合会话——视图不是回合会话时不覆盖（否则别的
            // 会话的上下文进度会显示成生成中那个会话的占用）
            const liveUsed =
              this.sending && this.turnInView && this.liveTurnStats
                ? this.liveTurnStats.usage?.context_tokens || 0
                : 0;
            this.ctxUsed = liveUsed > 0 ? liveUsed : info.used;
            if (this.ctxUsed <= 0) {
              // 会话有 AI 消息但拿不到任何 usage → 占用未知，胶囊降级显示
              // （点开面板说明缺数据）；完全空会话才隐藏
              this.ctxUnknown = this._win.all.some(
                (m) => m.role === "assistant",
              );
              this.ctxPct = 0;
              this.ctxTitle = this.ctxUnknown
                ? "上下文占用未知：会话没有可用的用量记录（异常收场 / 早期会话，无法事后恢复）"
                : "";
              this.syncStats();
              return;
            }
            this.ctxUnknown = false;
            const total = Number(this.ctxWindow) || 786432;
            this.ctxPct = Math.round(Math.min(100, (this.ctxUsed / total) * 100) * 10) / 10;
            const k = (v) => {
              if (v >= 1024) return (v / 1024).toFixed(1).replace(/\.0$/, "") + "k";
              return String(v);
            };
            this.ctxTitle =
              `当前会话上下文占用 ${k(this.ctxUsed)} / ${k(total)} tok` +
              (info.model ? `（模型 ${info.model}）` : "");
            this.syncStats();
          },


          // 底部统计胶囊聚合：遍历当前会话消息，累计各回合的 turnStats
          //（轮/步/模型用时/工具用时/TTFT/TPS）与 usage（token 分桶，缓存读取
          // 兼容 DeepSeek 与 OpenAI 两种字段）；上下文分解取最近一次带该字段的
          // 回合；同时刷新右侧模型触发器与菜单取值文案
          syncStats() {
            let turns = 0,
              steps = 0,
              llmMs = 0,
              toolMs = 0,
              ttftMs = 0,
              ttftSteps = 0,
              decodeMs = 0,
              decodeTokens = 0;
            let prompt = 0,
              output = 0,
              cacheRead = 0,
              lastBreakdown = null;
            // 已收尾（有 turnMs）但没有 usage 的回合：异常收场或早期会话，
            // 用量胶囊降级提示而不是隐藏
            let missing = 0;
            for (const m of this._win.all) {
              if (m.role === "user") turns++;
              if (
                m.role === "assistant" &&
                typeof m.turnMs === "number" &&
                !(m.usage?.total_tokens > 0)
              ) {
                missing++;
              }
              const ts = m.turnStats;
              if (ts) {
                steps += ts.steps || 0;
                llmMs += ts.llmMs || 0;
                toolMs += ts.toolMs || 0;
                ttftMs += ts.ttftMs || 0;
                ttftSteps += ts.ttftSteps || 0;
                decodeMs += ts.decodeMs || 0;
                decodeTokens += ts.decodeTokens || 0;
              }
              const u = m.usage;
              if (u && u.total_tokens > 0) {
                prompt += u.prompt_tokens || 0;
                output += u.completion_tokens || 0;
                cacheRead +=
                  u.prompt_cache_hit_tokens ??
                  u.prompt_tokens_details?.cached_tokens ??
                  0;
                if (m.contextBreakdown) lastBreakdown = m.contextBreakdown;
              }
            }
            // 进行中回合的实时快照：消息上的本回合终值要等 done / 收尾才落，

            const live = this.sending ? this.liveTurnStats : null;

                live.usage.prompt_cache_hit_tokens ??
                live.usage.prompt_tokens_details?.cached_tokens ??
                0;
              if (live.breakdown) lastBreakdown = live.breakdown;
            }
            if (live?.stats) {
              steps += live.stats.steps || 0;
              llmMs += live.stats.llmMs || 0;
              toolMs += live.stats.toolMs || 0;
              ttftMs += live.stats.ttftMs || 0;
              ttftSteps += live.stats.ttftSteps || 0;
              decodeMs += live.stats.decodeMs || 0;
              decodeTokens += live.stats.decodeTokens || 0;

            this.statSteps = steps;
            this.statMissingTurns = missing;
            this.statLlmMs = llmMs;

            this.statTps =
              decodeMs > 0 ? Math.round(decodeTokens / (decodeMs / 1000)) : 0;
            this.usagePrompt = prompt;
            this.usageOutput = output;
            this.usageCacheRead = cacheRead;
            this.usageUncached = Math.max(0, prompt - cacheRead);

            const bd = lastBreakdown;

              ? (bd.systemTokens || 0) +
                (bd.toolsTokens || 0) +
                (bd.messageTokens || 0)
              : 0;

              total > 0
                ? Math.round(((this.ctxPct * (n || 0)) / total) * 10) / 10
                : 0;

                    text: "~" + this.fmtTokCompact(bd.toolsTokens || 0),

                    text: "~" + this.fmtTokCompact(bd.messageTokens || 0),

            this.modelTriggerText =
              (this.activeModelId || "自动") + " · " + this.reasoningLabel();
          },


          // ---- 底部统计面板（点击开合，互斥收口见 attached） ----

          toggleStat(which) {

          // 面板对齐（仅底部统计胶囊）：默认居中于胶囊；居中会超出视口（窄

          // 面板不参与测量——它在消息滚动层内会被滚动层左缘裁剪，恒为左对
          // 齐（模板静态 align-left）。class:open 由 ofa 状态驱动，这里只补

          schedulePanelPlace() {
            setTimeout(() => {
              // this.shadow 是 ofa 包装对象，原生方法经 .ele 中转
              const root = this.shadow.ele || this.shadow;
              const panels = root.querySelectorAll(
                ".stats-dock .stat-panel.open",
              );
              const vw = window.innerWidth;
              const margin = 8;
              for (const el of panels) {
                const anchor = el.parentElement;
                if (!anchor) continue;
                const ar = anchor.getBoundingClientRect();
                const w = el.offsetWidth;
                const centeredLeft = ar.left + ar.width / 2 - w / 2;
                const overflow =
                  centeredLeft < margin || centeredLeft + w > vw - margin;
                el.classList.toggle("align-left", overflow);
              }
            }, 30);
          },


          compressFromPanel() {

          reasoningLabel() {

          // 切换单轮步数上限：立即注入仓库（agent 置失效，下回合生效）

          // ---- 数字 / 时长格式化（统计胶囊与明细面板） ----

          // 时间胶囊文案（含比较运算的拼串必须走方法：{{}} 文本插值里的

          timePillText() {

            if (!(this.statSteps > 0)) return `${this.statTurns} 轮 · 统计缺失`;
            return (

          },


          timePillTitle() {
            if (!(this.statSteps > 0)) {

            }
            return (
              `会话统计：${this.statTurns} 轮 ${this.statSteps} 步` +

          },


          // Token 用量胶囊文案
          usagePillText() {
            // 有已收尾回合但完全无用量记录：降级提示而非隐藏

          usageHeadText() {

          // 上下文胶囊（占用未知时降级，见 syncCtx 的 ctxUnknown）
          ctxPillLabel() {

          ctxHeadTitle() {
            return this.ctxUnknown

          ctxHeadText() {
            return this.ctxUnknown

                  this.fmtTokCompact(this.ctxUsed) +

          // 紧凑 token 数：517 / 12.2K / 1.2M
          fmtTokCompact(v) {
            const n = Number(v || 0);
            if (n < 1000) return String(n);
            if (n < 1000000) {
              const k = n / 1000;
              return (
                (k >= 100 ? String(Math.round(k)) : String(Math.round(k * 10) / 10)) +
                "K"
              );
            }
            const m = n / 1000000;
            return (
              (m >= 100 ? String(Math.round(m)) : String(Math.round(m * 10) / 10)) +
              "M"
            );
          },


          // 精确 token 数（千分位）
          fmtTokExact(v) {
            return String(Math.round(Number(v || 0))).replace(
              /\B(?=(\d{3})+(?!\d))/g,
              ",",
            );
          },


          // 紧凑时长：12.1秒 / 2分42秒
          fmtDurCompact(ms) {
            const s = Number(ms || 0) / 1000;
            if (s < 60) return Math.round(s * 10) / 10 + "秒";
            const w = Math.round(s);
            return Math.floor(w / 60) + "分" + (w % 60) + "秒";

          cacheHitPct() {

            return String(Math.round((this.usageCacheRead / denom) * 100));

          applyCtxWindow(value) {
            this.ctxWindow = value;

            if (selfStore) {

              } catch {

          toolIcon(name) {

              {

                write_file: "mdi:file-edit-outline",
                read_file: "mdi:file-document-outline",
                list_files: "mdi:file-tree-outline",
                read_skill: "mdi:book-open-variant",
                show_form: "mdi:card-text-outline",
                preview: "mdi:open-in-new",
              }[name] || "mdi:tools"
            );
          },


          // AI 消息的模型徽标 / 思考过程判定（历史消息可能缺字段）
          aiModel(m) {
            return m?.model || "";
          },


          hasReasoning(m) {
            return !!(m?.reasoning);
          },


          // ---- 思考展示（ZCode 式）：默认收起，头部滚动最后一行；展开限高
          // 自动滚底；推理 token 数随用量落位后显示 ----

          reasoningLive(m) {
            // 思考进行中：有思考内容、正文未开始、回合未收尾（工具循环里
            // turnMs 很晚才补，content 开始输出才是思考结束的标志）
            return !!m?.reasoning && !m?.content && !m?.turnMs;
          },


          // 思考最后一行非空行（收起态的滚动展示内容）
          reasoningTail(m) {
            const lines = String(m?.reasoning || "")
              .split("\n")
              .filter((l) => l.trim());
            const line = lines[lines.length - 1] || "";
            return line.length > 120 ? line.slice(0, 120) + "…" : line;
          },


          reasoningTailHidden(m) {
            return !!m?.reasoningOpen || this.reasoningTail(m) === "";
          },


          // 本次思考消耗的输出 token：气泡增量（store 在气泡关闭时落的
          // reasoningTokens）优先；旧数据回退 usage 平铺 / 供应商明细
          reasoningTokens(m) {
            const rt =
              m?.reasoningTokens ??
              m?.usage?.reasoning_tokens ??
              m?.usage?.completion_tokens_details?.reasoning_tokens;
            return rt > 0 ? this.fmtTokCompact(rt) + " tok" : "";
          },


          // 展开中的思考正文滚到底部（流式跟随；force 供手动展开时立即定位）
          scrollReasoningToBottom(force) {
            if (!force && !this.sending) return;
            if (this._rScrollRaf) return;
            this._rScrollRaf = requestAnimationFrame(() => {
              this._rScrollRaf = null;

                .querySelectorAll(".reasoning-body")
                .forEach((el) => {

                });

          hasUsage(m) {

          // 已收尾（有 turnMs）但缺用量记录的回合：胶囊降级显示而非隐藏
          turnStatsMissing(m) {

            );
          },


          // ---- 本轮用量明细面板（插值一律走方法，
          // {{}} 文本插值里不能出现比较符） ----

          // ---- 回合变更卡（changes / snapshotId 挂在回合末条 AI 消息上） ----

          turnChanges(msg) {

          turnAdds(msg) {
            return this.turnChanges(msg).reduce((n, c) => n + (c.adds || 0), 0);
          },


          turnDels(msg) {

          },


          toggleChanges(id) {

            this.diffHunks = [];

          async toggleFileDiff(path) {
            if (this.fileDiffPath === path) {
              // 再点同一枚：收起面板（grid 动画收尾）
              this.fileDiffPath = "";
              this.diffHunks = [];
              this.diffError = "";
              this.diffFromDisk = false;
              return;
            }
            const msg = this.messages.find((m) => m.id === this.changesMsgId);
            if (!msg) return;
            // 切换前量当前面板高度：新内容就位后再量目标高度，做一次显式
            // 高度过渡——不清空旧内容（保留展示 + 头部加载提示），消除
            // 「清空再填充」的高度跳变闪动
            const wrap = this.shadow.$(".turn-changes.open .tc-diff-wrap")?.ele;
            const fromH = wrap ? wrap.getBoundingClientRect().height : 0;
            this.fileDiffPath = path;
            this.diffError = "";
            const change = this.turnChanges(msg).find((c) => c.path === path);
            const token = (this._diffToken = (this._diffToken || 0) + 1);
            if (Array.isArray(change?.hunks)) {
              // 冻结在消息里的行级内容：永远显示该回合自己的改动
              this.diffFromDisk = false;
              this.diffHunks = change.hunks;
              this.diffLoading = "";
            } else if (msg.snapshotId) {
              // 旧卡片兼容（未记录行级内容的回合）：现场对比快照与当前盘，

                this.diffError = res.error || "";
              } finally {
                if (token === this._diffToken) this.diffLoading = "";
              }

              this.diffHunks = [];

            await new Promise((r) =>
              requestAnimationFrame(() => requestAnimationFrame(r)),
            );

              wrap &&
              fromH > 0 &&
              toH > 0 &&

              wrap.style.overflow = "hidden";

              wrap.style.height = toH + "px";
              setTimeout(() => {
                wrap.style.height = "";
                wrap.style.overflow = "";
                wrap.style.transition = "";
              }, 220);
            }
          },


          // 面板头部提示：加载中 / 旧卡片对比当前盘的兼容标注

            const all = this._win.all;

          diffEmpty(path) {

          diffNoteText() {

          toggleRollbackOptions(msg) {

          async runRollback(msg, kind = "neutral") {

              const turnUser = [...this._win.all]

                this.currentAppName,

            if (min < 60) return `${min}分${String(sec % 60).padStart(2, "0")}秒`;

          diagRows(m) {

                .filter(([k]) => k !== "t" && k !== "phase" && k !== "msgId")

                    `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`,

          // 输入框占位跟随场景：草稿引导生成，应用内引导迭代
          syncInputPlaceholder() {

          // ---- 对话列宽拖拽（480px–min(1280, 可视宽-32)，左右边界对称手柄，

          // 统计条 / 错误条一次同步；窄视口由各列 width:100% 天然收缩）
          applyChatWidth(px) {
            this.chatWidth = Math.round(Math.min(1280, Math.max(480, px)));

            this.shadow

          startChatResize(event, dir) {

            event.preventDefault();
            const el = event.target;
            el.setPointerCapture(event.pointerId);
            // 手势内基准冻结：取拖起时的**渲染宽度**而非存储偏好——窄视口下
            // 列已被 width:100% 收缩（偏好 768、渲染 560），从偏好起跳会跳变
            const originX = event.clientX;
            const rendered =
              this.shadow.$(".column")?.ele?.getBoundingClientRect().width;
            const base = Math.round(rendered || this.chatWidth);
            // 上限感知当前可视宽（列两侧各留 ≥16px），手势期间定死不再重算
            const avail =
              this.shadow.$(".chat-wrap")?.ele?.getBoundingClientRect().width ||
              1280;
            const maxW = Math.max(480, Math.min(1280, avail - 32));
            let latestDx = 0;
            let raf = null;
            const apply = () => {
              raf = null;
              this.applyChatWidth(Math.min(maxW, base + dir * latestDx));
            };
            const onMove = (ev) => {
              latestDx = ev.clientX - originX;
              if (raf === null) raf = requestAnimationFrame(apply);
            };
            const onUp = () => {
              el.removeEventListener("pointermove", onMove);
              el.removeEventListener("pointerup", onUp);
              el.removeEventListener("pointercancel", onUp);
              if (raf !== null) cancelAnimationFrame(raf);
              this.applyChatWidth(Math.min(maxW, base + dir * latestDx));

              Promise.resolve(
                selfStore?.setItem("pref:chat-width", String(this.chatWidth)),

            };

            document.body.style.userSelect = "none";
            el.addEventListener("pointermove", onMove);
            el.addEventListener("pointerup", onUp);
            el.addEventListener("pointercancel", onUp);
          },

            if (room <= 0) return;
            for (const file of files.slice(0, room)) {
              try {
                const src = await normalizeImage(file);
                this.pendingImages.push({
                  id: `img${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
                  src,
