<template page>
  <link rel="stylesheet" href="./home.css" />
  <l-m src="/gh/ofajs/senti-ui@latest/packages/tabs/tab-bar.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/dialog/dialog.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/textarea/textarea.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <!-- 视觉交互工具包的组件（show-form 包的表单卡片）；声明式依赖，先于页面渲染注册 -->
  <l-m src="../lib/tools/show-form/form-card.html"></l-m>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <!-- 已进入项目：Logo + 名称 + 项目下拉按钮；会话标题（小字）+ 编辑在其右侧 -->
        <o-if :value="currentAppName !== ''">
          <div class="brand-group">
            <div class="brand-mark">{{currentAppIcon}}</div>
            <div class="brand-app">
              <div class="brand-name">
                {{currentAppDisplay}}
                <span class="mode-badge" attr:mode="currentAppMode">{{modeText(currentAppMode)}}</span>
              </div>
            </div>
            <!-- 项目抽屉（左侧滑出）：项目清单，点击新标签打开（已开标签聚焦） -->
            <st-icon-button
              class="project-menu-btn"
              title="项目列表"
              on:click="openProjectDrawer"
            >
              <n-icon icon="mdi:chevron-down"></n-icon>
            </st-icon-button>
          </div>
          <div class="session-line">
            <o-if :value="currentSessionTitle !== ''">
              <span class="cur-session" attr:title="currentSessionTitle">{{currentSessionTitle}}</span>
            </o-if>
            <o-if :value="currentSessionTitle === ''">
              <span class="cur-app draft">无会话</span>
            </o-if>
            <st-icon-button
              class="session-edit-btn"
              attr:disabled="currentSessionId === ''"
              title="编辑会话名称"
              on:click="editSessionTitle"
            >
              <n-icon icon="mdi:pencil-outline"></n-icon>
            </st-icon-button>
          </div>
        </o-if>
        <!-- 草稿（新建项目）：保持生成器品牌；下拉按钮仍可直接切换项目 -->
        <o-if :value="currentAppName === ''">
          <div class="brand-group">
            <div class="brand-mark">🪄</div>
            <div class="brand-app">
              <div class="brand-name">妙造</div>
              <div class="brand-current">
                <span class="cur-app draft">新应用 · 未创建</span>
              </div>
            </div>
            <st-icon-button
              class="project-menu-btn"
              title="项目列表"
              on:click="openProjectDrawer"
            >
              <n-icon icon="mdi:chevron-down"></n-icon>
            </st-icon-button>
          </div>
        </o-if>
      </div>
      <div class="topbar-actions">
        <o-if :value="currentAppName !== ''">
          <st-icon-button title="预览应用" on:click="openApp(currentAppName, currentAppMode)">
            <n-icon icon="mdi:play-circle-outline"></n-icon>
          </st-icon-button>
          <st-icon-button title="备份管理" on:click="openBackupDrawer">
            <n-icon icon="mdi:backup-restore"></n-icon>
          </st-icon-button>
        </o-if>
        <st-icon-button title="工具 / 技能" on:click="openPanel">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
        </st-icon-button>
      </div>
    </header>

    <div class="body-row">
      <!-- 左侧：当前应用的历史对话（应用创建后常驻） -->
      <aside class="side" class:show="currentAppName !== ''" :style.width="sideWidth + 'px'">
        <div class="side-head">
          <span>对话</span>
          <st-icon-button
            title="新建对话"
            style="font-size: 12px"
            on:click="newSessionFor(currentAppName)"
          >
            ＋
          </st-icon-button>
        </div>
        <div class="side-body">
          <o-fill :value="currentAppSessions" fill-key="id">
            <div
              class="session-item"
              class:active="$data.id === $host.currentSessionId"
              class:removing="$host.removingSid === $data.id"
              class:drag-over="$host.dragOverSid === $data.id"
              attr:draggable="'true'"
              on:click="$host.loadSession($data.id)"
              on:dragstart="$host.sessionDragStart($event, $data.id)"
              on:dragover="$host.sessionDragOver($event, $data.id)"
              on:dragleave="$host.sessionDragLeave($event, $data.id)"
              on:drop="$host.sessionDrop($event, $data.id)"
              on:dragend="$host.sessionDragEnd()"
            >
              <span class="session-title">{{$data.title}}</span>
              <!-- 对话进行中：loading 替代删除按钮的位置；此时不允许删除 -->
              <o-if :value="$data.busy === true">
                <span class="session-busy" attr:title="'该会话正在对话中'">
                  <n-icon icon="mdi:loading"></n-icon>
                </span>
              </o-if>
              <!-- 圆形删除按钮：确认时形变为圆角方形；对话进行中不渲染 -->
              <o-if :value="$data.busy !== true">
                <button
                  class="session-del"
                  class:confirm="$host.confirmingDelSession === $data.id"
                  attr:title="$host.confirmingDelSession === $data.id ? '再点一次确认删除' : '删除对话'"
                  on:click="$host.deleteSession($event, $data.id)"
                >
                  <o-if :value="$host.confirmingDelSession === $data.id">
                    <span>确认</span>
                  </o-if>
                  <o-if :value="$host.confirmingDelSession !== $data.id">
                    <n-icon icon="mdi:close"></n-icon>
                  </o-if>
                </button>
              </o-if>
            </div>
          </o-fill>
        </div>
        <!-- 拖拽调整会话栏宽度（150–400px） -->
        <div class="side-resize" on:pointerdown="startSideResize($event)" title="拖动调整宽度"></div>
      </aside>

      <div class="main-col">
    <div class="chat-wrap">
      <section class="chat-scroll" id="chatScroll" on:scroll="onChatScroll">
        <div class="column">
          <o-if :value="messages.length === 0 && !sending">
            <!-- 草稿态：引导描述要生成的应用 -->
            <o-if :value="currentAppName === ''">
              <div class="hero">
                <div class="hero-icon">🪄</div>
                <h2>描述你想要的应用</h2>
                <p class="hero-sub">
                  AI 会生成完整的 ofa.js 应用并写入文件系统，完成后可直接预览
                </p>
                <div class="chips">
                  <button class="chip" on:click="useChip('帮我生成一个番茄钟应用：25 分钟专注 + 5 分钟休息，可以自定义时长，记录今天完成的番茄数')">
                    🍅 番茄钟
                  </button>
                  <button class="chip" on:click="useChip('帮我生成一个记账应用：添加收入/支出记录，按分类汇总，数据保存到本地')">
                    💰 记账本
                  </button>
                  <button class="chip" on:click="useChip('帮我生成一个抽签点名应用：粘贴学生名单，随机抽取一人，避免重复')">
                    🎯 随机点名
                  </button>
                </div>
              </div>
            </o-if>
            <!-- 已在应用内：新会话给出贴合当前应用的迭代话题 -->
            <o-if :value="currentAppName !== ''">
              <div class="hero">
                <div class="hero-icon">{{currentAppIcon}}</div>
                <h2>{{currentAppDisplay || currentAppName}}</h2>
                <p class="hero-sub">继续迭代这个应用，可以试试下面的话题</p>
                <div class="chips">
                  <button class="chip" on:click="useChip('帮我检查当前应用还有哪些问题或可以优化的地方，发现后直接修复')">🔍 检查优化</button>
                  <button class="chip" on:click="useChip('在现有基础上帮我增加一个实用的新功能，先给出方案再实现')">✨ 新增功能</button>
                  <button class="chip" on:click="useChip('帮我优化应用的界面视觉与交互细节，让它更美观易用')">🎨 美化界面</button>
                </div>
              </div>
            </o-if>
          </o-if>

          <o-fill :value="messages" fill-key="id">
            <div
              class="msg"
              class:new-group="$data.newGroup"
              attr:role="$data.role"
            >
              <!-- hover 显示的落盘时间（AI 消息的时间在 ai-foot 右侧展示） -->
              <o-if :value="$data.role !== 'assistant'">
                <span class="msg-ts" attr:data-role="$data.role">{{ $host.msgTs($data) }}</span>
              </o-if>
              <o-if :value="$data.role === 'user'">
                <div class="user-bubble">{{$data.content}}</div>
              </o-if>

              <!-- 视觉交互表单卡片（show-form 包的组件，ready 预载） -->
              <o-if :value="$host.isFormMsg($data)">
                <show-form-card
                  :spec="$data.form"
                  on:form-submit="$host.onFormSubmit($event, $data.id)"
                ></show-form-card>
              </o-if>

              <o-if :value="$host.isAiMsg($data)">
                <div class="ai-block">
                  <div class="ai-head">
                    <o-if :value="$host.aiModel($data) !== ''">
                      <span class="ai-model" attr:title="'回答模型：' + $host.aiModel($data)">{{$host.aiModel($data)}}</span>
                    </o-if>
                    <o-if :value="$host.hasReasoning($data)">
                      <button
                        class="reasoning-toggle"
                        class:open="$data.reasoningOpen"
                        on:click="$host.toggleReasoning($data.id)"
                      >
                        <span class="tool-chev">
                          <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path d="M9 6l6 6-6 6" />
                          </svg>
                        </span>
                        <span class="reasoning-toggle-label">思考过程</span>
                      </button>
                    </o-if>
                  </div>
                  <o-if :value="$data.reasoning !== '' ? $data.reasoningOpen : false">
                    <div class="reasoning-body">{{$data.reasoning}}</div>
                  </o-if>
                  <div class="ai-text" :html="$host.renderMd($data.content)"></div>
                  <o-if :value="$host.hasUsage($data) || $host.canFork() || $host.aiTime($data) !== ''">
                    <div class="ai-foot">
                      <o-if :value="$host.hasUsage($data)">
                        <div class="usage-row" attr:title="'本轮 token 用量（含工具循环的多次模型调用累计）'">
                          <n-icon icon="mdi:counter"></n-icon>
                          <span>{{$host.usageText($data)}}</span>
                        </div>
                      </o-if>
                      <o-if :value="$host.canFork()">
                        <button
                          class="fork-btn"
                          attr:title="'从这条回复处创建分支会话：复制此前全部聊天记录到新会话'"
                          on:click="$host.forkFrom($data.id)"
                        >
                          <n-icon icon="mdi:source-branch"></n-icon>
                          <span>fork</span>
                        </button>
                      </o-if>
                      <!-- 右侧：本条回复落盘时间 + 本轮耗时 -->
                      <span class="ai-time" attr:title="'回复时间与本轮耗时'">{{$host.aiTime($data)}}</span>
                    </div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'tool'">
                <div
                  class="tool-row"
                  class:open="$data.open"
                  class:pending="$data.pending"
                >
                  <button class="tool-head" on:click="$host.toggleTool($data.id)">
                    <span class="tool-chev">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </span>
                    <span class="tool-icon">
                      <n-icon attr:icon="$host.toolIcon($data.name)"></n-icon>
                    </span>
                    <span class="tool-title">{{$data.name}}</span>
                    <span class="tool-summary">{{$data.summary}}</span>
                    <span class="tool-status">
                      <span class="tool-status-badge run">
                        <n-icon icon="mdi:loading"></n-icon>
                        <span>运行中</span>
                      </span>
                      <span class="tool-status-badge done">
                        <n-icon icon="mdi:check"></n-icon>
                        <span>完成</span>
                      </span>
                    </span>
                  </button>
                  <o-if :value="$data.open">
                    <div class="tool-body">
                      <div class="tool-section">
                        <div class="tool-label">参数</div>
                        <pre class="tool-code">{{$data.args}}</pre>
                      </div>
                      <div class="tool-section">
                        <div class="tool-label">结果</div>
                        <pre class="tool-code">{{$data.result}}</pre>
                      </div>
                    </div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'compact'">
                <div class="compact-card" class:open="$data.open">
                  <button class="compact-head" on:click="$host.toggleTool($data.id)">
                    <span class="tool-chev">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </span>
                    <n-icon icon="mdi:archive-arrow-down-outline"></n-icon>
                    <span class="compact-title">已压缩 {{$data.count}} 条历史记忆</span>
                    <span class="compact-hint">点击查看摘要</span>
                  </button>
                  <o-if :value="$data.open">
                    <div class="compact-body">{{$data.summary}}</div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'app'">
                <div class="app-card">
                  <div class="app-card-head">
                    <span class="app-card-icon">{{$data.icon}}</span>
                    <div class="app-card-title">
                      <div class="app-card-name">{{$data.displayName}}</div>
                      <div class="app-card-dir">{{$host.dirText($data)}}</div>
                    </div>
                  </div>
                  <o-if :value="$data.ready">
                    <div class="app-card-actions">
                      <st-button
                        on:click="$host.openApp($data.appName, $data.mode)"
                      >
                        ▶ 预览应用
                      </st-button>
                    </div>
                  </o-if>
                  <o-if :value="$data.ready === false">
                    <div class="app-card-missing">
                      还缺文件：{{$data.missing.join('、')}}
                    </div>
                  </o-if>
                </div>
              </o-if>
            </div>
          </o-fill>

          <o-if :value="sending">
            <!-- 生成中：右侧实时用时（clock 每秒心跳驱动刷新） -->
            <div class="turn-status">生成中… {{ turnLiveText(clock) }}</div>
          </o-if>
        </div>
      </section>

      <o-if :value="!atBottom && messages.length > 0">
        <button class="to-bottom" title="回到底部" on:click="toBottomNow">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
      </o-if>
    </div>

    <footer class="composer-wrap">
      <o-if :value="keyError">
        <div class="key-error-row">
          <div class="key-error">{{keyError}}</div>
          <o-if :value="permGrantNeeded">
            <st-button class="perm-grant-btn" on:click="grantLocalPermission">
              🔑 授权目录
            </st-button>
          </o-if>
        </div>
      </o-if>
      <div class="composer">
        <textarea
          id="inputer"
          sync:value="input"
          rows="1"
          attr:placeholder="inputPlaceholder"
          attr:disabled="sending"
          on:keydown="handleKeydown($event)"
        ></textarea>
        <div class="composer-row">
          <div class="composer-left">
            <!-- 上下文占用：小圆圈进度 + 最大窗口选择（与思考模式并排） -->
            <o-if :value="ctxUsed > 0">
              <span class="ctx-anchor">
                <button
                  class="ctx-ring"
                  attr:disabled="compacting"
                  attr:title="compacting ? '正在压缩上下文…' : ctxTitle + '，点击立即压缩上下文'"
                  on:click="handleCompress"
                >
                  <svg class="ctx-ring-svg" viewBox="0 0 20 20">
                    <circle class="ctx-ring-bg" cx="10" cy="10" r="8"></circle>
                    <circle
                      class="ctx-ring-fill"
                      class:warn="ctxPct >= 80"
                      cx="10"
                      cy="10"
                      r="8"
                      stroke-dasharray="50.27"
                      attr:stroke-dashoffset="ctxDash"
                    ></circle>
                  </svg>
                  <span class="ctx-ring-label">{{compacting ? '压缩中…' : ctxPct + '%'}}</span>
                </button>
                <!-- 悬停气泡：当前模型 + API Key 切换 -->
                <span class="ctx-pop">
                  <span class="ctx-pop-row">
                    <span class="ctx-pop-label">模型</span>
                    <select
                      class="ctx-select key-select model-select"
                      attr:title="'对话使用的模型（当前：' + (activeModelId || '供应商默认') + '）'"
                      :value="activeModelId"
                      attr:disabled="modelOptions.length === 0"
                      on:change="selectModel($event)"
                    >
                      <option value="">自动（供应商默认）</option>
                      <o-fill :value="modelOptions" fill-key="id">
                        <option attr:value="$data.id">{{$data.label}}</option>
                      </o-fill>
                    </select>
                  </span>
                  <span class="ctx-pop-row">
                    <span class="ctx-pop-label">Key</span>
                    <o-if :value="apiKeys.length > 0">
                      <select
                        class="ctx-select key-select"
                        attr:title="'对话使用的 API Key（当前：' + activeKeyText + '）'"
                        :value="activeKeyId"
                        on:change="selectApiKey($event)"
                      >
                        <option value="">自动选择</option>
                        <o-fill :value="apiKeys" fill-key="id">
                          <option attr:value="$data.id">{{$data.provider}} · {{$data.maskedKey}}</option>
                        </o-fill>
                      </select>
                    </o-if>
                    <o-if :value="apiKeys.length === 0">
                      <span class="ctx-pop-value">未配置（去密钥管理器添加）</span>
                    </span>
                  </span>
                </span>
              </span>
            </o-if>
            <select
              class="ctx-select"
              attr:title="'会话最大上下文窗口（当前 ' + ctxWindowText + '）'"
              :value="ctxWindow"
              on:change="setCtxWindow($event)"
            >
              <option value="131072">128k</option>
              <option value="262144">256k</option>
              <option value="524288">512k</option>
              <option value="786432">768k</option>
              <option value="1048576">1mb</option>
            </select>
            <!-- 思考模式开关：开 = 回答前先推理（可见思考过程），关 = 直接快速回答 -->
            <button
              class="target-opt"
              class:active="thinking"
              attr:title="thinking ? '思考模式已开启：回答前先推理，速度较慢，点击关闭' : '思考模式已关闭：直接回答，点击开启推理'"
              on:click="toggleThinking()"
            >
              🧠 思考模式
            </button>
          </div>
          <!-- 写入目标只在「新应用」阶段可选；create_app 落地后随应用锁定 -->
          <o-if :value="currentAppName === ''">
            <div class="target-picker">
              <button
                class="target-opt"
                class:active="storageMode === 'vfs'"
                on:click="selectMode('vfs')"
                title="写入虚拟文件系统 /$ai-apps/"
              >
                📁 虚拟系统
              </button>
              <button
                class="target-opt"
                class:active="storageMode === 'local'"
                on:click="selectMode('local')"
                title="写入本地磁盘目录（仅 Chrome）"
              >
                📂 本地目录
              </button>
              <button
                class="target-dir"
                class:show="storageMode === 'local'"
                on:click="chooseLocalDir"
                title="重新选择本地目录"
              >
                {{ localDirLabel ? localDirLabel : '选择目录…' }}
              </button>
            </div>
          </o-if>
          <o-if :value="currentAppName !== ''">
            <span class="composer-meta">📂 {{dirText({ mode: currentAppMode, appName: currentAppName })}}</span>
          </o-if>
          <o-if :value="!sending">
            <button
              class="send-btn"
              attr:disabled="!input.trim()"
              on:click="handleSend"
              title="发送（Enter）"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 19V5" />
                <path d="M5 12l7-7 7 7" />
              </svg>
            </button>
          </o-if>
          <o-if :value="sending">
            <button class="send-btn stop" on:click="handleStop" title="停止生成">
              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                stroke="currentColor"
                stroke-width="1"
              >
                <rect x="7" y="7" width="10" height="10" rx="1.5" />
              </svg>
            </button>
          </o-if>
        </div>
      </div>
      <div class="disclaimer">内容由 AI 生成，请注意甄别</div>
    </footer>
      </div>
    </div>

    <!-- 项目抽屉（左）：点击项新标签打开项目；已开标签聚焦复用 -->
    <div class="panel-mask" class:show="projDrawerOpen" on:click="closeProjectDrawer"></div>
    <aside class="proj-drawer" class:show="projDrawerOpen">
      <div class="panel-head">

    <!-- 备份编辑对话框（名称 + 备注 一并保存；放在无 transform 的 .app 层，
         避免抽屉的 transform 让 fixed 遮罩相对抽屉定位） -->
    <st-dialog class="backup-edit" sync:open="backupEditOpen" auto-close>
      <div class="backup-edit-panel">

          <div class="backup-edit-label">备注</div>

            sync:value="editForm.note"
            rows="3"
            autosize
            placeholder="记录这份备份的内容或用途，留空则清除"
          ></st-textarea>
        </div>
        <div class="backup-edit-actions">
          <st-button variant="text" on:click="closeBackupEdit">取消</st-button>
          <st-button variant="filled" on:click="saveBackupEdit">保存</st-button>

  <script>
    // 页面只负责视觉与交互；AI 创作 / 运行的业务逻辑全部在
    // lib/builder-store.js 的可观察状态仓库中，页面订阅事件同步视图。
    export default async ({ load }) => {
      const { renderMarkdown } = await load("../lib/markdown.js");
      const { createBuilderStore } = await load("../lib/builder-store.js");
      const { TOOL_DEFS } = await load("../lib/tools/index.js");
      const { contextInfo, MODEL_OPTIONS } = await load("../lib/builder.js");

      // Core 依赖：页面模块内必须运行时加载，失败则降级为不可写模式；
      // 句柄等类实例由仓库闭包持有，不进入响应式数据
      let fs = null;
      let mazmotStore = null;
      let selfStore = null;
      try {
        fs = await load("/nos/fs/main.js");
        const { getStorage } = await load("/nos/storage/main.js");
        mazmotStore = getStorage("mazmot");
        selfStore = getStorage("conjure");
      } catch (err) {
        console.warn("NoneOS Core 不可用，生成功能受限：", err);
      }

      const store = createBuilderStore({ fs, mazmotStore, selfStore, load });

      // 面板展示用的工具清单（取每个插件描述的第一句）
      const toolDefs = TOOL_DEFS.map((d) => {
        let desc = (d.description || "").split(/。|；/)[0];
        if (desc.length > 42) desc = desc.slice(0, 42) + "…";
        return {
          name: d.name,
          desc: desc + "。",
          tags: d.tags || [],
        };
      });

      // ---- 跨标签感知：哪些项目标签正打开（BroadcastChannel 广播存活状态） ----
      // aliveTabs 含本标签自己的项目名；openTabs 是它的页面投影（列表项「已打开」徽标）
      const aliveTabs = new Set();
      let announcedName = null;
      let bc = null;
      let page = null;
      try {
        bc = new BroadcastChannel("ai-builder-tabs");
      } catch {
        /* 不支持则徽标退化为只显示本标签 */
      }
      const syncOpenTabs = () => {
        if (page) page.openTabs = [...aliveTabs];
      };
      // 重新探测：清空后广播 hello，各存活标签回 alive 重建集合
      const refreshAliveTabs = () => {
        aliveTabs.clear();
        if (announcedName) aliveTabs.add(announcedName);
        syncOpenTabs();
        bc?.postMessage({ type: "hello" });
      };
      const announce = (name) => {
        if (announcedName === name) return;
        if (announcedName) bc?.postMessage({ type: "bye", name: announcedName });
        announcedName = name || null;
        if (name) {
          aliveTabs.add(name);
          bc?.postMessage({ type: "alive", name });
        }
        syncOpenTabs();
      };
      if (bc) {
        bc.onmessage = (e) => {
          const { type, name } = e.data || {};
          if (type === "hello") {
            if (announcedName) {
              bc.postMessage({ type: "alive", name: announcedName });
            }
          } else if (type === "alive" && name) {
            aliveTabs.add(name);
            syncOpenTabs();
          } else if (type === "bye" && name) {
            aliveTabs.delete(name);
            syncOpenTabs();
          }
        };
      }
      window.addEventListener("beforeunload", () => {
        if (announcedName) bc?.postMessage({ type: "bye", name: announcedName });
      });

      return {
        data: {
          messages: [],
          input: "",
          sending: false,
          thinking: true,
          keyError: "",
          coreError: "",
          atBottom: true,
          sideWidth: 216, // 会话栏宽度（拖拽可调，150–400）
          panelOpen: false,
          panelTab: "tools", // 右侧面板 tab："tools" | "skills"
          projDrawerOpen: false, // 左侧项目抽屉
          backupDrawerOpen: false, // 右侧备份管理抽屉
          backups: [], // 当前应用已备份清单（backup/ 目录名，新的在前）
          backupBusy: false, // 正在打包备份
          smartBackupBusy: false, // 智能备份的 AI 分析阶段
          confirmingDelBackup: "", // 两步确认删除的备份 id
          backupEditOpen: false, // 备份编辑对话框（名称 + 备注）
          editingBackupId: "", // 正在编辑的备份 id
          editForm: { label: "", note: "" }, // 编辑对话框表单
          openTabs: [], // 正在打开中的项目标签（跨标签感知）
          confirmingDelApp: "",
          apps: [],
          currentAppName: "", // "" = 新应用草稿
          currentAppDisplay: "",
          currentAppIcon: "📦",
          inputPlaceholder: "", // 输入框占位文案（草稿 = 生成应用；应用内 = 迭代修改）
          currentAppMode: "vfs",
          currentAppSessions: [],
          clock: 0, // 计时心跳：AI 回复进行中每秒更新，驱动「生成中」实时用时
          turnStartTs: 0, // 进行中回合开始时间戳（仓库同步）
          currentSessionId: "",
          currentSessionTitle: "",
          storageMode: "vfs",
          localDirLabel: "",
          permGrantNeeded: false,
          confirmingDelSession: "",
          removingSid: "", // 正在播放折叠删除动画的会话 id
          dragSid: "", // 拖拽排序：被拖起的会话 id
          dragOverSid: "", // 拖拽排序：悬停目标会话 id（高亮）
          toolDefs,
          skills: [],
          // 上下文占用圆圈进度（applyMessageEvent 时由 contextInfo 重算）
          ctxUsed: 0,
          ctxPct: 0,
          ctxDash: "50.27",
          ctxTitle: "",
          // 会话最大上下文窗口（token 数，select 切换，偏好持久化）
          ctxWindow: "131072",
          ctxWindowText: "128k",
          // 上下文压缩进行中（压缩按钮转圈提示）
          compacting: false,
          // 对话用 API Key（镜像自仓库，activeKeyId 为 "" 表示自动）
          apiKeys: [],
          activeKeyId: "",
          activeKeyText: "自动选择",
          // 当前 Agent 模型标识（仓库 patch，悬停气泡展示）
          activeModel: "",
          // 手动选中的对话模型与可选项（跟随选中 Key 的供应商）
          activeModelId: "",
          modelOptions: [],
        },

        async ready() {
          page = this; // 供 BroadcastChannel 闭包回写 openTabs
          // 恢复会话栏宽度（150–400）
          try {
            const w = parseInt(sessionStorage.getItem("aib:side-width"), 10);
            if (w >= 150 && w <= 400) this.sideWidth = w;
          } catch {
            /* 忽略 */
          }
          // 恢复最大上下文窗口偏好
          try {
            const win = await selfStore?.getItem("pref:ctx-window");
            if (win) {
              this.ctxWindow = String(win);
              this.ctxWindowText =
                {
                  "131072": "128k",
                  "262144": "256k",
                  "524288": "512k",
                  "786432": "768k",
                  "1048576": "1mb",
                }[this.ctxWindow] || "128k";
            }
          } catch {
            /* 忽略 */
          }
          store.setContextWindow(Number(this.ctxWindow));
          this.syncActiveKeyText();
          // 订阅仓库事件，把状态同步到页面响应式数据
          store.subscribe((evt) => {
            if (evt.type === "patch") {
              for (const [key, value] of Object.entries(evt.data)) {
                if (key === "nextId") continue; // 内部计数，页面不需要
                this[key] = value;
              }
              // Key 列表 / 选中项变化：刷新选择器展示文案
              if ("apiKeys" in evt.data || "activeKeyId" in evt.data) {
                this.syncActiveKeyText();
              }
              // 当前项目变化时同步 URL 的 p 参数（刷新 / 分享可回到当前项目）
              // 并向其他标签广播本标签的新项目名
              if ("currentAppName" in evt.data) {
                this.syncUrlParam();
                this.syncTabName();
                announce(this.currentAppName);
              }
              return;
            }
            if (evt.type === "messages") {
              this.applyMessageEvent(evt);
              // 流式增量（patch）同样跟随滚动：生成中手动拉回底部后恢复自动跟随
              this.followScroll();
            }
          });
          // 项目标签标识 ?p=<name>：o-router 路由下页面模块的 query 参数来自
          // hash 路由串，location.search 上的 p 必须直接解析
          await store.init({
            initialApp: new URLSearchParams(location.search).get("p") || "",
          });
          this.syncUrlParam();
          this.syncTabName();
          this.syncDocTitle();
          this.syncInputPlaceholder();
          announce(this.currentAppName); // 本标签项目就位，向其他标签广播
          this.followScroll(true);
        },

        watch: {
          input() {
            this.autoGrow();
          },
          // 标签页标题跟随项目切换
          currentAppName() {
            this.syncDocTitle();
            this.syncInputPlaceholder();
          },
        },

        // ---- 生命周期（根级，proto 内的 attached 不会被调用）----
        attached() {
          // AI 回复进行中每秒心跳，驱动「生成中」右侧实时用时
          this._durTimer = setInterval(() => {
            if (this.sending) this.clock = Date.now();
          }, 1000);
          // 代码块复制：事件委托挂在聊天容器上，:html 重渲后依然有效
          this.shadow.$("#chatScroll")?.on("click", async (event) => {
            const btn = event.target?.closest?.(".md-copy");
            if (!btn) return;
            const label = btn.querySelector(".md-copy-label");
            try {
              await navigator.clipboard.writeText(btn.dataset.code || "");
              if (!label) return;
              btn.classList.add("copied");
              label.textContent = "已复制";
              clearTimeout(btn._copyTimer);
              btn._copyTimer = setTimeout(() => {
                btn.classList.remove("copied");
                label.textContent = "复制";
              }, 1500);
            } catch {
              if (label) label.textContent = "复制失败";
            }
          });
        },
        detached() {
          clearInterval(this._durTimer);
        },

        proto: {
          // ---- 仓库事件 → 页面消息列表 ----

          applyMessageEvent(evt) {
            const { op } = evt;
            if (op === "replace") {
              this.messages = evt.list.map((m) => ({ ...m }));
            } else if (op === "push") {
              this.messages.push({ ...evt.item });
            } else if (op === "patch") {
              const item = this.messages.find((m) => m.id === evt.id);
              if (item) Object.assign(item, evt.patch);
            } else if (op === "splice") {
              const idx = this.messages.findIndex((m) => m.id === evt.id);
              if (idx > -1) this.messages.splice(idx, 1);
            }
            // usage 挂在回合末条 AI 消息上，done patch 时刷新进度条
            this.syncCtx();
          },

          // API Key 选择器的当前展示文案 + 模型可选项（key 列表或选中项变化时刷新）
          syncActiveKeyText() {
            const hit = this.apiKeys.find((k) => k.id === this.activeKeyId);
            this.activeKeyText = hit ? `${hit.provider} · ${hit.maskedKey}` : "自动选择";
            // 模型选项跟随选中 Key 的供应商；自动 Key 不提供手动模型
            const list = hit ? MODEL_OPTIONS[hit.provider] || [] : [];
            this.modelOptions = list.map((m) => ({ id: m, label: m }));
            // 选中的模型不属于当前供应商：重置为自动
            if (this.activeModelId && !list.includes(this.activeModelId)) {
              this.activeModelId = "";
              store.selectModel("");

          },

          selectModel(event) {

            store.selectModel(this.activeModelId);

          // 重算上下文占用圆圈进度（总量由 select 选定的窗口决定）
          syncCtx() {
            const info = contextInfo(this.messages);
            this.ctxUsed = info.used;
            if (info.used <= 0) return;
            const total = Number(this.ctxWindow) || 131072;
            this.ctxPct = Math.round(Math.min(100, (info.used / total) * 100) * 10) / 10;
            // r=8 的圆周长 2πr ≈ 50.27，偏移量 = 周长 ×（1 - 进度）
            this.ctxDash = (50.27 * (1 - this.ctxPct / 100)).toFixed(2);
            const k = (v) => {
              if (v >= 1024) return (v / 1024).toFixed(1).replace(/\.0$/, "") + "k";
              return String(v);
            };
            this.ctxTitle =
              `当前会话上下文占用 ${k(info.used)} / ${k(total)} tok` +
              (info.model ? `（模型 ${info.model}）` : "");
          },

          // 切换最大上下文窗口：立即重算进度并持久化偏好
          setCtxWindow(event) {
            this.ctxWindow = event.target.value;
            const opt = event.target.selectedOptions?.[0];
            this.ctxWindowText = opt ? opt.textContent.trim() : "128k";
            this.syncCtx();
            store.setContextWindow(Number(this.ctxWindow));
          this.syncActiveKeyText();
            if (selfStore) {
              try {
                selfStore.setItem("pref:ctx-window", this.ctxWindow);
              } catch {
                /* 存储失败不影响本次会话 */
              }
            }
          },

              }[name] || "mdi:tools"
            );

          aiModel(m) {
            return m?.model || "";
          },

          hasReasoning(m) {
            return !!(m?.reasoning);
          },

          // 本轮 token 用量统计（挂在回合末条 AI 消息上，随消息持久化）
          hasUsage(m) {
            return !!(m?.usage?.total_tokens > 0);
          },

          usageText(m) {
            const u = m?.usage || {};
            // ≥1024 显示为 k（如 2.3k），否则千分位整数
            const n = (v) => {
              const num = Number(v || 0);
              if (num >= 1024) return (num / 1024).toFixed(1).replace(/\.0$/, "") + "k";
              return num.toLocaleString();
            };
            // 缓存命中字段：DeepSeek 风格 prompt_cache_hit_tokens，
            // OpenAI 风格 prompt_tokens_details.cached_tokens
            const hit =
              u.prompt_cache_hit_tokens ??
              u.prompt_tokens_details?.cached_tokens;
            const parts = [];
            parts.push(`输入 ${n(u.prompt_tokens)}`);
            if (hit !== undefined && hit !== null) {
              parts.push(`缓存命中 ${n(hit)}`);
            }
            parts.push(`输出 ${n(u.completion_tokens)}`);
            parts.push(`共 ${n(u.total_tokens)} tok`);
            return parts.join(" · ");
          },

          canFork() {

          fmtClock(ts) {
            const d = new Date(ts);
            const p = (n) => String(n).padStart(2, "0");
            return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
          },
          fmtDurMs(ms) {
            if (!(ms > 0)) return "";
            if (ms < 1000) return "<1秒";
            const sec = Math.floor(ms / 1000);
            if (sec < 60) return `${sec}秒`;
            const min = Math.floor(sec / 60);
            if (min < 60) return `${min}分${String(sec % 60).padStart(2, "0")}秒`;
            const hr = Math.floor(min / 60);
            return `${hr}时${String(min % 60).padStart(2, "0")}分`;
          },
          // hover 显示的消息落盘时间（AI 消息不用，时间在 ai-foot）
          msgTs(m) {

          aiTime(m) {
            if (!(m.ts > 0)) return "";
            let text = this.fmtClock(m.ts);
            if (m.turnMs > 0) {
              text += ` · ${this.fmtDurMs(m.turnMs)}`;
            }
            return text;

          // 「生成中…」右侧的实时用时；clock 参数仅用于建立模板响应式依赖

          projectUrl(name) {
            const u = new URL(location.href);
            if (name) u.searchParams.set("p", name);
            else u.searchParams.delete("p");
            return u.href;
          },

          // 仍会执行同 URL 导航（= 整页刷新）；先 window.open("") 拿引用——同名
          // 标签已存在时仅聚焦不导航；不存在时拿到的是空白新标签，再补导航
          focusOrOpenTab(url, name) {
            const w = window.open("", name);
            if (!w) {
              window.open(url, name); // 弹窗拦截等异常兜底
              return;

            try {

            const want = this.currentAppName !== "";
            if (want && u.searchParams.get("p") !== this.currentAppName) {
              u.searchParams.set("p", this.currentAppName);
              history.replaceState(null, "", u.href);

            if (!text || this.sending) return;
            this.input = "";
            this.autoGrow();
            this.atBottom = true;
            this.followScroll(true);
            await store.send(text);
          },

          autoGrow() {
            requestAnimationFrame(() => {
              const el = this.shadow.$("#inputer")?.ele;
              if (!el) return;
              el.style.height = "auto";
              el.style.height = `${Math.min(el.scrollHeight, 160)}px`;
            });
          },

          followScroll(force = false) {
            if (!force && !this.atBottom) return;
            requestAnimationFrame(() => {
              const el = this.shadow.$("#chatScroll")?.ele;
              if (el) el.scrollTop = el.scrollHeight;
            });
          },

          onChatScroll() {
            const el = this.shadow.$("#chatScroll")?.ele;
            if (!el) return;
            const dist = el.scrollHeight - el.scrollTop - el.clientHeight;
            this.atBottom = dist <= 24;
          },

          toBottomNow() {
            this.atBottom = true;
            this.followScroll(true);
          },
        },
      };
    };
  </script>
</template>
