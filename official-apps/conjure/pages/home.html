<template page>
  <link rel="stylesheet" href="./home.css?v=5" />
  <l-m src="/gh/ofajs/senti-ui@latest/packages/tabs/tab-bar.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/menu/menu.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/dialog/dialog.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/textarea/textarea.html"></l-m>
  <!-- show-form 表单卡片的控件依赖（组件模板经 :html 生成，须全局预载） -->
  <l-m src="/gh/ofajs/senti-ui@latest/packages/select/select.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/checkbox/checkbox.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/radio/radio.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/mz/comps/ercode/ercode.html"></l-m>
  <!-- 视觉交互工具包的组件（show-form 包的表单卡片）；声明式依赖，先于页面渲染注册 -->
  <l-m src="../lib/tools/show-form/form-card.html"></l-m>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <!-- 已进入项目：Logo + 名称 + 项目下拉按钮；会话标题（小字）+ 编辑在其右侧 -->
        <o-if :value="currentAppName !== ''">
          <div class="brand-group">
            <div class="brand-mark">{{currentAppIcon}}</div>
            <div class="brand-app">
              <div class="brand-name">
                {{currentAppDisplay}}
                <span class="mode-badge" attr:mode="currentAppMode">{{modeText(currentAppMode)}}</span>
              </div>
            </div>
            <!-- 项目抽屉（左侧滑出）：项目清单，点击新标签打开（已开标签聚焦） -->
            <st-icon-button
              class="project-menu-btn"
              title="项目列表"
              on:click="openProjectDrawer"
            >
              <n-icon icon="mdi:chevron-down"></n-icon>
            </st-icon-button>
          </div>
          <div class="session-line">
            <o-if :value="currentSessionTitle !== ''">
              <span class="cur-session" attr:title="currentSessionTitle">{{currentSessionTitle}}</span>
            </o-if>
            <o-if :value="currentSessionTitle === ''">
              <span class="cur-app draft">无会话</span>
            </o-if>
            <st-icon-button
              class="session-edit-btn"
              attr:disabled="currentSessionId === ''"
              title="编辑会话名称"
              on:click="editSessionTitle"
            >
              <n-icon icon="mdi:pencil-outline"></n-icon>
            </st-icon-button>
          </div>
        </o-if>
        <!-- 草稿（新建项目）：保持生成器品牌；下拉按钮仍可直接切换项目 -->
        <o-if :value="currentAppName === ''">
          <div class="brand-group">
            <div class="brand-mark">🪄</div>
            <div class="brand-app">
              <div class="brand-name">妙造</div>
              <div class="brand-current">
                <span class="cur-app draft">新应用 · 未创建</span>
              </div>
            </div>
            <st-icon-button
              class="project-menu-btn"
              title="项目列表"
              on:click="openProjectDrawer"
            >
              <n-icon icon="mdi:chevron-down"></n-icon>
            </st-icon-button>
          </div>
        </o-if>
      </div>
      <div class="topbar-actions">
        <o-if :value="currentAppName !== ''">
          <o-if :value="previewStatus">
            <span class="preview-status" attr:title="previewStatus">{{previewStatus}}</span>
          </o-if>
          <div class="preview-wrap">
            <st-icon-button
              class:preview-live="previewOnline"
              attr:title="previewOnline ? '预览窗口已打开 · 点击多窗口面板' : '预览应用（隔离域运行）'"
              attr:disabled="previewBusy"
              on:click="togglePreviewPop"
            >
              <n-icon
                attr:icon="previewOnline ? 'mdi:play-circle' : 'mdi:play-circle-outline'"
              ></n-icon>
            </st-icon-button>
            <o-if :value="previewPopOpen">
              <div class="preview-pop">
                <div class="pp-head">
                  <span class="pp-title">预览窗口</span>
                  <span class="pp-badge" class:live="previewOnline">{{previewOnlineText()}}</span>
                </div>
                <div class="pp-actions">
                  <st-button variant="outlined" attr:disabled="previewBusy" on:click="popUpdateAll">
                    <span slot="prefix"><n-icon icon="mdi:sync"></n-icon></span>
                    更新全部
                  </st-button>
                  <st-button variant="outlined" attr:disabled="previewBusy" on:click="popNewWindow">
                    <span slot="prefix"><n-icon icon="mdi:open-in-new"></n-icon></span>
                    新开窗口
                  </st-button>
                </div>
                <div class="pp-wins-grid">
                  <o-fill :value="previewWindows" fill-key="id">
                    <div class="pp-win-tile" class:offline="!$data.online">
                      <div class="pp-thumb">
                        <o-if :value="$host.thumbFor($data)">
                          <img
                            class="pp-thumb-img"
                            attr:src="$host.thumbFor($data)"
                            alt="预览缩略图"
                          />
                        </o-if>
                        <o-if :value="!$host.thumbFor($data)">
                          <div class="pp-thumb-empty">
                            <n-icon icon="mdi:monitor-screenshot"></n-icon>
                          </div>
                        </o-if>
                        <span class="pp-tile-dot"></span>
                      </div>
                      <div class="pp-tile-meta">
                        <span class="pp-tile-app">{{$data.app || "?"}}</span>
                        <span class="pp-tile-device">{{$host.winLabel($data)}}</span>
                      </div>
                    </div>
                  </o-fill>
                </div>
                <o-if :value="previewWindows.length === 0">
                  <div class="pp-empty">
                    还没有打开的预览窗口：点「新开窗口」或用下方二维码让手机加入
                  </div>
                </o-if>
                <div class="pp-sec">
                  <span class="pp-label">手机调试（扫码即收到当前应用，保持本页开启）</span>
                  <div class="pp-qr-row">
                    <o-if :value="previewShareUrl">
                      <m-ercode attr:content="previewShareUrl"></m-ercode>
                    </o-if>
                    <div class="pp-qr-side">
                      <span class="pp-url">{{shortUrl(previewShareUrl)}}</span>
                      <st-icon-button
                        class="pp-copy"
                        title="复制链接"
                        attr:disabled="!previewShareUrl"
                        on:click="copyText(previewShareUrl)"
                      >
                        <n-icon icon="mdi:content-copy"></n-icon>
                      </st-icon-button>
                    </div>
                  </div>
                </div>
              </div>
            </o-if>
          </div>
          <st-icon-button title="备份管理" on:click="openBackupDrawer">
            <n-icon icon="mdi:backup-restore"></n-icon>
          </st-icon-button>
        </o-if>
        <st-icon-button title="工具 / 技能" on:click="openPanel">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
        </st-icon-button>
      </div>
    </header>

    <div class="body-row">
      <!-- 左侧：当前应用的历史对话（应用创建后常驻） -->
      <aside class="side" class:show="currentAppName !== ''" :style.width="sideWidth + 'px'">
        <div class="side-head">
          <span>对话</span>
          <st-icon-button
            title="新建对话"
            style="font-size: 12px"
            on:click="newSessionFor(currentAppName)"
          >
            ＋
          </st-icon-button>
        </div>
        <div class="side-body">
          <o-fill :value="currentAppSessions" fill-key="id">
            <div
              class="session-item"
              class:active="$data.id === $host.currentSessionId"
              class:removing="$host.removingSid === $data.id"
              class:drag-over="$host.dragOverSid === $data.id"
              attr:draggable="'true'"
              on:click="$host.loadSession($data.id)"
              on:dragstart="$host.sessionDragStart($event, $data.id)"
              on:dragover="$host.sessionDragOver($event, $data.id)"
              on:dragleave="$host.sessionDragLeave($event, $data.id)"
              on:drop="$host.sessionDrop($event, $data.id)"
              on:dragend="$host.sessionDragEnd()"
            >
              <span class="session-title">{{$data.title}}</span>
              <!-- 对话进行中：loading 替代删除按钮的位置；此时不允许删除 -->
              <o-if :value="$data.busy === true">
                <span class="session-busy" attr:title="'该会话正在对话中'">
                  <n-icon icon="mdi:loading"></n-icon>
                </span>
              </o-if>
              <!-- 圆形删除按钮：确认时形变为圆角方形；对话进行中不渲染 -->
              <o-if :value="$data.busy !== true">
                <button
                  class="session-del"
                  class:confirm="$host.confirmingDelSession === $data.id"
                  attr:title="$host.confirmingDelSession === $data.id ? '再点一次确认删除' : '删除对话'"
                  on:click="$host.deleteSession($event, $data.id)"
                >
                  <o-if :value="$host.confirmingDelSession === $data.id">
                    <span>确认</span>
                  </o-if>
                  <o-if :value="$host.confirmingDelSession !== $data.id">
                    <n-icon icon="mdi:close"></n-icon>
                  </o-if>
                </button>
              </o-if>
            </div>
          </o-fill>
        </div>
        <!-- 拖拽调整会话栏宽度（150–400px） -->
        <div class="side-resize" on:pointerdown="startSideResize($event)" title="拖动调整宽度"></div>
      </aside>

      <div class="main-col">
    <div class="chat-wrap">
      <section class="chat-scroll" id="chatScroll" on:scroll="onChatScroll">
        <div class="column">
          <o-if :value="messages.length === 0 && !sending">
            <!-- 草稿态：引导描述要生成的应用 -->
            <o-if :value="currentAppName === ''">
              <div class="hero">
                <div class="hero-icon">🪄</div>
                <h2>描述你想要的应用</h2>
                <p class="hero-sub">
                  AI 会生成完整的 ofa.js 应用并写入文件系统，完成后可直接预览
                </p>
                <div class="chips">
                  <button class="chip" on:click="useChip('帮我生成一个番茄钟应用：25 分钟专注 + 5 分钟休息，可以自定义时长，记录今天完成的番茄数')">
                    🍅 番茄钟
                  </button>
                  <button class="chip" on:click="useChip('帮我生成一个记账应用：添加收入/支出记录，按分类汇总，数据保存到本地')">
                    💰 记账本
                  </button>
                  <button class="chip" on:click="useChip('帮我生成一个抽签点名应用：粘贴学生名单，随机抽取一人，避免重复')">
                    🎯 随机点名
                  </button>
                </div>
              </div>
            </o-if>
            <!-- 已在应用内：新会话给出贴合当前应用的迭代话题 -->
            <o-if :value="currentAppName !== ''">
              <div class="hero">
                <div class="hero-icon">{{currentAppIcon}}</div>
                <h2>{{currentAppDisplay || currentAppName}}</h2>
                <p class="hero-sub">继续迭代这个应用，可以试试下面的话题</p>
                <div class="chips">
                  <button class="chip" on:click="useChip('帮我检查当前应用还有哪些问题或可以优化的地方，发现后直接修复')">🔍 检查优化</button>
                  <button class="chip" on:click="useChip('在现有基础上帮我增加一个实用的新功能，先给出方案再实现')">✨ 新增功能</button>
                  <button class="chip" on:click="useChip('帮我优化应用的界面视觉与交互细节，让它更美观易用')">🎨 美化界面</button>
                </div>
              </div>
            </o-if>
          </o-if>

          <o-fill :value="messages" fill-key="id">
            <div
              class="msg"
              class:new-group="$data.newGroup"
              attr:role="$data.role"
            >
              <!-- hover 显示的落盘时间（AI 消息的时间在 ai-foot 右侧展示） -->
              <o-if :value="$data.role !== 'assistant'">
                <span class="msg-ts" attr:data-role="$data.role">{{ $host.msgTs($data) }}</span>
              </o-if>
              <o-if :value="$data.role === 'user'">
                <div class="user-bubble">
                  <!-- 文本包一层单行 span：pre-wrap 在 span 上（保留用户手打
                       换行），气泡自身的模板缩进空隙按普通空白折叠，不再被
                       pre-wrap 渲染成撑高气泡的空行 -->
                  <span class="user-text"><o-if :value="$data.content !== ''">{{$data.content}}</o-if></span>
                  <!-- 多模态图片：缩略图展示，点击看大图（图片-only 消息文本留空） -->
                  <div class="user-imgs" class:show="$host.msgImages($data).length > 0">
                    <o-fill :value="$host.msgImages($data)">
                      <img
                        class="user-img"
                        attr:src="$data"
                        on:click="$host.openImage($data)"
                      />
                    </o-fill>
                  </div>
                </div>
              </o-if>

              <!-- 视觉交互表单卡片（show-form 包的组件，ready 预载） -->
              <o-if :value="$host.isFormMsg($data)">
                <show-form-card
                  :spec="$data.form"
                  on:form-submit="$host.onFormSubmit($event, $data.id)"
                ></show-form-card>
              </o-if>

              <o-if :value="$host.isAiMsg($data)">
                <div class="ai-block">
                  <div class="ai-head">
                    <o-if :value="$host.aiModel($data) !== ''">
                      <span class="ai-model" attr:title="'回答模型：' + $host.aiModel($data)">{{$host.aiModel($data)}}</span>
                    </o-if>
                    <o-if :value="$host.hasReasoning($data)">
                      <button
                        class="reasoning-toggle"
                        class:open="$data.reasoningOpen"
                        class:live="$host.reasoningLive($data)"
                        attr:title="$data.reasoningOpen ? '收起思考过程' : '展开思考过程'"
                        on:click="$host.toggleReasoning($data.id)"
                      >
                        <span class="tool-chev">
                          <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path d="M9 6l6 6-6 6" />
                          </svg>
                        </span>
                        <span class="reasoning-toggle-label">{{$host.reasoningLive($data) ? '正在思考' : '思考'}}</span>
                        <!-- 收起态：滚动展示思考的最后一行（流式中不停变化） -->
                        <span class="reasoning-tail" attr:hidden="$host.reasoningTailHidden($data)">{{$host.reasoningTail($data)}}</span>
                        <o-if :value="$host.reasoningTokens($data) !== ''">
                          <span class="reasoning-tok" attr:title="'本次思考消耗的输出 token'">{{$host.reasoningTokens($data)}}</span>
                        </o-if>
                      </button>
                    </o-if>
                  </div>
                  <o-if :value="$data.reasoning !== '' ? $data.reasoningOpen : false">
                    <div class="reasoning-body">{{$data.reasoning}}</div>
                  </o-if>
                  <div class="ai-text" :html="$host.renderMd($data.content)"></div>
                  <!-- 本回合变更卡：占满消息列宽；文件为网格芯片（每枚 ≥300px，
                       列数随宽度自适应），点击选中 → 下方共享 diff 面板切换内容
                       （VS Code 编辑器式：面板随选中开合动画，切文件只换内容） -->
                  <o-if :value="$host.turnChanges($data).length > 0">
                    <div class="turn-changes" class:open="$host.changesMsgId === $data.id">
                      <button class="tc-head" on:click="$host.toggleChanges($data.id)">
                        <n-icon class="tc-head-icon" icon="mdi:file-code-outline"></n-icon>
                        <span class="tc-title">本回合改动</span>
                        <span class="tc-count">{{$host.turnChanges($data).length}} 个文件</span>
                        <span class="tc-stat">
                          <span class="tc-adds">+{{$host.turnAdds($data)}}</span>
                          <span class="tc-dels">−{{$host.turnDels($data)}}</span>
                        </span>
                        <n-icon class="tc-chev" icon="mdi:chevron-down"></n-icon>
                      </button>
                      <div class="tc-collapse">
                        <div class="tc-body">
                          <div class="tc-files">
                            <o-fill :value="$host.turnChanges($data)" fill-key="path">
                              <button
                                class="tc-file"
                                class:active="$host.fileDiffPath === $data.path"
                                attr:title="'查看 ' + $data.path + ' 的行级改动（快照 vs 当前）'"
                                on:click="$host.toggleFileDiff($data.path)"
                              >
                                <span class="tc-file-path">{{$data.path}}</span>
                                <span class="tc-file-stat">
                                  <span class="tc-adds">+{{$data.adds || 0}}</span>
                                  <span class="tc-dels">−{{$data.dels || 0}}</span>
                                </span>
                              </button>
                            </o-fill>
                          </div>
                          <div class="tc-diffzone" class:has="$host.fileDiffPath !== ''">
                            <div class="tc-collapse">
                              <div class="tc-diff-wrap">
                                <div class="tc-diff-head">
                                  <n-icon icon="mdi:file-code-outline"></n-icon>
                                  <span class="tc-diff-path">{{$host.fileDiffPath}}</span>
                                  <span class="tc-diff-note" attr:hidden="$host.diffNoteText() === ''">{{$host.diffNoteText()}}</span>
                                </div>
                                <div class="tc-diff">
                                  <o-if :value="$host.showDiffEmpty()">
                                    <div class="tc-diff-empty">{{$host.diffEmptyText($host.fileDiffPath)}}</div>
                                  </o-if>
                                  <o-fill :value="$host.diffHunks">
                                    <div class="diff-line" attr:type="$data.type">
                                      <span class="diff-ln">{{$data.type === 'gap' ? '' : ($data.type === 'add' ? $data.bLn : $data.aLn)}}</span>
                                      <span class="diff-txt">{{$data.text}}</span>
                                    </div>
                                  </o-fill>
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="tc-foot">
                            <o-if :value="$host.turnActionsAvailable($data) && $data.snapshotId">
                              <!-- 回滚：单按钮，点击原地展开语义选项（不满意负反馈 / 仅还原），
                                   选完即执行；回滚成功且当前内容等于该回合快照时进入「已回滚」禁用态 -->
                              <o-if :value="$host.rollbackOptionsOpen === $data.id">
                                <button
                                  class="tc-rollback danger"
                                  attr:title="'还原文件并告知 AI 你对该回合改动不满意（下次对话生效）'"
                                  on:click="$host.runRollback($data, 'dissatisfied')"
                                >
                                  <n-icon icon="mdi:thumb-down-outline"></n-icon>
                                  <span>不满意，撤销</span>
                                </button>
                                <button
                                  class="tc-rollback"
                                  attr:title="'仅把文件还原到本回合开始前（中性，AI 下次对话会感知回滚）'"
                                  on:click="$host.runRollback($data, 'neutral')"
                                >
                                  <n-icon icon="mdi:restore"></n-icon>
                                  <span>仅还原代码</span>
                                </button>
                              </o-if>
                              <button
                                class="tc-rollback"
                                attr:disabled="$host.turnReverted($data)"
                                attr:title="$host.turnReverted($data) ? '该回合改动已还原（当前内容与回合前快照一致）' : '还原该回合的文件改动：可选择是否告知 AI 不满意（对话记录不受影响）'"
                                on:click="$host.toggleRollbackOptions($data)"
                              >
                                <n-icon icon="mdi:restore"></n-icon>
                                <span>{{$host.rollbackBtnText($data)}}</span>
                              </button>
                            </o-if>
                            <o-if :value="$host.turnActionsAvailable($data) && $data.snapshotId">
                              <!-- 备份代码：相当于一次智能备份（打包 + AI 标题备注）；
                                   当前内容已有备份（backups 含 current 项）时禁用并显示已备份 -->
                              <button
                                class="tc-rollback save"
                                class:done="$host.curBackedUp()"
                                attr:disabled="$host.backupDisabled()"
                                attr:title="$host.curBackedUp() ? '当前内容已有备份（备份管理中标记为「与当前一致」）' : '智能备份当前代码：打包 + AI 生成标题与备注，可在备份管理查看'"
                                on:click="$host.backupTurnCode()"
                              >
                                <n-icon icon="mdi:content-save-check-outline"></n-icon>
                                <span>{{$host.backupBtnText()}}</span>
                              </button>
                            </o-if>
                            <o-if :value="$host.turnActionsAvailable($data) && !$data.snapshotId">
                              <span class="tc-foot-note">本回合没有快照，无法回滚</span>
                            </o-if>
                            <o-if :value="!$host.turnActionsAvailable($data)">
                              <span class="tc-foot-note">历史回合，仅可查看当时的改动</span>
                            </o-if>
                          </div>
                        </div>
                      </div>
                    </div>
                  </o-if>
                  <o-if :value="$host.hasUsage($data) || $host.turnStatsMissing($data) || $host.canFork() || $host.aiTime($data) !== '' || $data.stopped">
                    <div class="ai-foot">
                      <o-if :value="$data.stopped">
                        <span class="ai-stopped" attr:title="'本轮由用户手动停止，已生成内容保留'">
                          <n-icon icon="mdi:hand-back-right"></n-icon>
                          <span>已手动停止</span>
                        </span>
                      </o-if>
                      <o-if :value="$host.hasUsage($data) || $host.turnStatsMissing($data)">
                        <!-- 本轮用量：描边 Chip 显示紧凑总量，点击弹出明细面板
                             （缓存命中 / 未缓存输入 / 缓存读取 / 输出）；
                             回合已收尾但缺用量记录时降级显示「用量缺失」并说明原因 -->
                        <span class="stat-anchor">
                          <button
                            class="stat-pill sm"
                            class:open="$host.openUsageMsgId === $data.id"
                            attr:title="$host.turnUsageTitle($data)"
                            on:click="$host.toggleUsagePanel($data.id)"
                          >
                            <n-icon icon="mdi:coins"></n-icon>
                            <span>{{$host.turnUsagePillText($data)}}</span>
                          </button>
                          <!-- 对话区面板恒为左对齐（align-left 静态类）：居中
                               会溢出消息滚动层左缘被裁掉，滚动层宽度视口测量不到 -->
                          <span class="stat-panel align-left" class:open="$host.openUsageMsgId === $data.id">
                            <span class="stat-panel-head">
                              <n-icon icon="mdi:coins"></n-icon>
                              <span class="stat-panel-title">本轮用量</span>
                              <span class="stat-panel-value">{{$host.turnUsageHeadText($data)}}</span>
                            </span>
                            <span class="stat-rows">
                              <o-if :value="$data.model">
                                <span class="stat-row"
                                  ><span class="stat-dt">提供方 / 模型</span
                                  ><span class="stat-dd">{{$data.model}}</span></span
                                >
                              </o-if>
                              <o-if :value="$host.usageCacheHit($data) !== ''">
                                <span class="stat-row"
                                  ><span class="stat-dt">缓存命中</span
                                  ><span class="stat-dd">{{$host.usageCacheHit($data)}}%</span></span
                                >
                              </o-if>
                              <o-if :value="$host.hasUsage($data)">
                                <span class="stat-row"
                                  ><span class="stat-dt">未缓存输入</span
                                  ><span class="stat-dd">{{$host.fmtTokExact($host.usageUncachedOf($data))}} tok</span></span
                                >
                              </o-if>
                              <o-if :value="$host.usageCacheReadOf($data) > 0">
                                <span class="stat-row"
                                  ><span class="stat-dt">缓存读取</span
                                  ><span class="stat-dd">{{$host.fmtTokExact($host.usageCacheReadOf($data))}} tok</span></span
                                >
                              </o-if>
                              <o-if :value="$host.hasUsage($data)">
                                <span class="stat-row"
                                  ><span class="stat-dt">输出</span
                                  ><span class="stat-dd">{{$host.usageOutputText($data)}}</span></span
                                >
                              </o-if>
                              <o-if :value="$host.turnStatsMissing($data)">
                                <span class="stat-row"
                                  ><span class="stat-dt">数据缺失</span
                                  ><span class="stat-dd">本回合已收尾（耗时 {{$host.fmtDurCompact($data.turnMs)}}），但无用量记录——异常收场 / 早期会话，无法事后恢复</span></span
                                >
                              </o-if>
                            </span>
                          </span>
                        </span>
                      </o-if>
                      <o-if :value="$host.canFork()">
                        <button
                          class="fork-btn"
                          attr:title="'从这条回复处创建分支会话：复制此前全部聊天记录到新会话'"
                          on:click="$host.forkFrom($data.id)"
                        >
                          <n-icon icon="mdi:source-branch"></n-icon>
                          <span>fork</span>
                        </button>
                      </o-if>
                      <!-- 右侧：本条回复落盘时间 + 本轮耗时 -->
                      <span class="ai-time" attr:title="'回复时间与本轮耗时'">{{$host.aiTime($data)}}</span>
                    </div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'tool'">
                <div
                  class="tool-row"
                  class:open="$data.open"
                  class:pending="$data.pending"
                >
                  <button class="tool-head" on:click="$host.toggleTool($data.id)">
                    <span class="tool-chev">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </span>
                    <span class="tool-icon">
                      <n-icon attr:icon="$host.toolIcon($data.name)"></n-icon>
                    </span>
                    <span class="tool-title">{{$data.name}}</span>
                    <span class="tool-summary">{{$data.summary}}</span>
                    <span class="tool-status">
                      <span class="tool-status-badge run">
                        <n-icon icon="mdi:loading"></n-icon>
                        <span>运行中</span>
                      </span>
                      <span class="tool-status-badge done">
                        <n-icon icon="mdi:check"></n-icon>
                        <span>完成</span>
                      </span>
                    </span>
                  </button>
                  <o-if :value="$data.open">
                    <div class="tool-body">
                      <div class="tool-section">
                        <div class="tool-label">参数</div>
                        <pre class="tool-code">{{$data.args}}</pre>
                      </div>
                      <div class="tool-section">
                        <div class="tool-label">结果</div>
                        <pre class="tool-code">{{$data.result}}</pre>
                      </div>
                    </div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'compact'">
                <div class="compact-card" class:open="$data.open">
                  <button class="compact-head" on:click="$host.toggleTool($data.id)">
                    <span class="tool-chev">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </span>
                    <n-icon icon="mdi:archive-arrow-down-outline"></n-icon>
                    <span class="compact-title">已压缩 {{$data.count}} 条历史记忆</span>
                    <span class="compact-hint">点击查看摘要</span>
                  </button>
                  <o-if :value="$data.open">
                    <div class="compact-body">{{$data.summary}}</div>
                  </o-if>
                </div>
              </o-if>

              <o-if :value="$data.role === 'image'">
                <div class="shot-card">
                  <div class="shot-head">
                    <n-icon icon="mdi:camera-outline"></n-icon>
                    <span>预览窗口截图</span>
                    <o-if :value="$data.w > 0">
                      <span class="shot-size">{{$data.w}} × {{$data.h}}</span>
                    </o-if>
                  </div>
                  <img class="shot-img" attr:src="$data.src" attr:alt="'预览窗口截图 ' + $data.w + 'x' + $data.h" />
                </div>
              </o-if>

              <o-if :value="$data.role === 'app'">
                <div class="app-card">
                  <div class="app-card-head">
                    <span class="app-card-icon">{{$data.icon}}</span>
                    <div class="app-card-title">
                      <div class="app-card-name">{{$data.displayName}}</div>
                      <div class="app-card-dir">{{$host.dirText($data)}}</div>
                    </div>
                  </div>
                  <o-if :value="$data.ready">
                    <div class="app-card-actions">
                      <st-button
                        on:click="$host.openAppRemote($data.appName, $data.mode)"
                      >
                        ▶ 预览应用
                      </st-button>
                    </div>
                  </o-if>
                  <o-if :value="$data.ready === false">
                    <div class="app-card-missing">
                      还缺文件：{{$data.missing.join('、')}}
                    </div>
                  </o-if>
                </div>
              </o-if>
            </div>
          </o-fill>

          <o-if :value="sending">
            <!-- 生成中：右侧实时用时（clock 每秒心跳驱动刷新） -->
            <div class="turn-status">{{ turnStatusText(clock) }}</div>
          </o-if>
        </div>
      </section>

      <!-- 拖动调整对话列宽（左右边界对称手柄，calc 贴 --chat-w 边界跟随；
           逻辑见 startChatResize，记忆到 sessionStorage） -->
      <div class="chat-resize left" on:pointerdown="startChatResize($event, -1)" title="拖动调整对话宽度"></div>
      <div class="chat-resize right" on:pointerdown="startChatResize($event, 1)" title="拖动调整对话宽度"></div>

      <o-if :value="!atBottom && messages.length > 0">
        <button class="to-bottom" title="回到底部" on:click="toBottomNow">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
      </o-if>
    </div>

    <footer class="composer-wrap">
      <!-- 宿主自动检测到预览运行错误：提示条（下条消息自动附带给 AI 修复） -->
      <o-if :value="autoErrors.length > 0">
        <div class="auto-error-row" attr:title="autoErrors.join('\n')">
          <n-icon icon="mdi:alert-circle-outline"></n-icon>
          <span class="auto-error-text"
            >预览自动检测到 {{autoErrors.length}} 条运行错误，下条消息将自动附带给 AI 修复</span
          >
          <st-icon-button title="忽略（本次不带给 AI）" on:click="dismissAutoErrors">
            <n-icon icon="mdi:close"></n-icon>
          </st-icon-button>
        </div>
      </o-if>
      <o-if :value="keyError">
        <div class="key-error-row">
          <div class="key-error">{{keyError}}</div>
          <o-if :value="permGrantNeeded">
            <st-button class="perm-grant-btn" on:click="grantLocalPermission">
              🔑 授权目录
            </st-button>
          </o-if>
        </div>
      </o-if>
      <div class="composer">
        <textarea
          id="inputer"
          sync:value="input"
          rows="1"
          attr:placeholder="inputPlaceholder"
          attr:disabled="sending"
          on:keydown="handleKeydown($event)"
          on:paste="handlePaste($event)"
        ></textarea>
        <div class="composer-row">
          <!-- 待发送图片附件（粘贴 / 选择）：贴着动作条左侧，随下条消息一起发出 -->
          <o-if :value="pendingImages.length > 0">
            <div class="attach-row">
              <o-fill :value="pendingImages" fill-key="id">
                <div class="attach-chip">
                  <img attr:src="$data.src" on:click="$host.openImage($data.src)" />
                  <button
                    class="attach-x"
                    on:click="$host.removePendingImage($data.id)"
                    title="移除图片"
                  >×</button>
                </div>
              </o-fill>
              <span class="attach-hint">随下条消息发送</span>
            </div>
          </o-if>
          <!-- 写入目标只在「新应用」阶段可选；create_app 落地后随应用锁定 -->
          <o-if :value="currentAppName === ''">
            <div class="target-picker">
              <button
                class="target-opt"
                class:active="storageMode === 'vfs'"
                on:click="selectMode('vfs')"
                title="写入虚拟文件系统 /$ai-apps/"
              >
                📁 虚拟系统
              </button>
              <button
                class="target-opt"
                class:active="storageMode === 'local'"
                on:click="selectMode('local')"
                title="写入本地磁盘目录（仅 Chrome）"
              >
                📂 本地目录
              </button>
              <button
                class="target-dir"
                class:show="storageMode === 'local'"
                on:click="chooseLocalDir"
                title="重新选择本地目录"
              >
                {{ localDirLabel ? localDirLabel : '选择目录…' }}
              </button>
            </div>
          </o-if>
          <o-if :value="currentAppName !== ''">
            <span class="composer-meta">📂 {{dirText({ mode: currentAppMode, appName: currentAppName })}}</span>
          </o-if>
          <!-- 添加图片（多模态输入）：点击选文件；输入框内直接粘贴截图亦可 -->
          <button class="attach-btn" on:click="pickImages" title="添加图片（也可在输入框直接粘贴）">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
          </button>
          <!-- 模型 + 推理等级 + Key + 窗口：st-menu 钻入式选择菜单 -->
          <st-menu align="right">
            <button
              slot="trigger"
              class="model-trigger"
              attr:title="'模型与推理等级（当前：' + modelTriggerText + '）'"
            >
              <span class="model-trigger-label">{{modelTriggerText}}</span>
              <svg
                class="model-chev"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <st-menu-item>
              模型
              <span slot="suffix" class="menu-value">{{modelValueText}}</span>
              <st-menu slot="sub-menu">
                <st-menu-item on:click="pickModel('')">
                  <span slot="prefix" class="menu-check">{{activeModelId === '' ? '✓' : ''}}</span>
                  自动（供应商默认）
                </st-menu-item>
                <o-fill :value="modelOptions" fill-key="id">
                  <st-menu-item on:click="$host.pickModel($data.id)">
                    <span slot="prefix" class="menu-check">{{$host.modelCheck($data.id)}}</span>
                    {{$data.label}}
                  </st-menu-item>
                </o-fill>
                <o-if :value="modelOptions.length === 0">
                  <span class="menu-empty">当前 Key 未拉取到模型清单</span>
                </o-if>
              </st-menu>
            </st-menu-item>
            <st-menu-item>
              推理等级
              <span slot="suffix" class="menu-value">{{reasoningLabel()}}</span>
              <st-menu slot="sub-menu">
                <o-fill :value="effortOptions" fill-key="id">
                  <st-menu-item on:click="$host.pickReasoning($data.id)">
                    <span slot="prefix" class="menu-check">{{$host.reasoningCheck($data.id)}}</span>
                    {{$data.label}}
                  </st-menu-item>
                </o-fill>
              </st-menu>
            </st-menu-item>
            <st-menu-item>
              Key
              <span slot="suffix" class="menu-value">{{activeKeyText}}</span>
              <st-menu slot="sub-menu">
                <st-menu-item on:click="pickKey('')">
                  <span slot="prefix" class="menu-check">{{activeKeyId === '' ? '✓' : ''}}</span>
                  自动选择（负载均衡）
                </st-menu-item>
                <o-fill :value="apiKeys" fill-key="id">
                  <st-menu-item on:click="$host.pickKey($data.id)">
                    <span slot="prefix" class="menu-check">{{$host.keyCheck($data.id)}}</span>
                    {{$data.provider === 'relay' ? $data.serverName || 'Relay' : $data.provider}} · {{$data.maskedKey}}
                  </st-menu-item>
                </o-fill>
                <o-if :value="apiKeys.length === 0">
                  <span class="menu-empty">未配置 Key（去密钥管理器添加）</span>
                </o-if>
              </st-menu>
            </st-menu-item>
            <st-menu-item>
              窗口
              <span slot="suffix" class="menu-value">{{ctxWindowText}}</span>
              <st-menu slot="sub-menu">
                <o-fill :value="ctxOptions" fill-key="value">
                  <st-menu-item on:click="$host.pickWindow($data.value)">
                    <span slot="prefix" class="menu-check">{{$host.windowCheck($data.value)}}</span>
                    {{$data.label}}
                  </st-menu-item>
                </o-fill>
              </st-menu>
            </st-menu-item>
          </st-menu>
          <o-if :value="!sending">
            <st-button
              class="send-btn"
              attr:disabled="!canSend()"
              attr:title="'发送（Enter）'"
              on:click="handleSend"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 19V5" />
                <path d="M5 12l7-7 7 7" />
              </svg>
            </st-button>
          </o-if>
          <o-if :value="sending">
            <st-button
              class="send-btn stop"
              color="error"
              attr:disabled="stopRequested"
              attr:title="stopRequested ? '正在停止…' : '停止生成'"
              on:click="handleStop"
            >
              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                stroke="currentColor"
                stroke-width="1"
              >
                <rect x="7" y="7" width="10" height="10" rx="1.5" />
              </svg>
            </st-button>
          </o-if>
        </div>
      </div>
      <!-- 图片选择器（attach-btn 触发；display:none 而非 hidden 属性，避免被布局样式顶开） -->
      <input id="imgPicker" type="file" accept="image/*" multiple style="display: none" on:change="onPickImages($event)" />
      <!-- 底部统计胶囊（点开明细面板）：会话统计 / Token 用量 / 上下文占用；
           数据缺失（异常收场 / 早期会话）时降级显示并说明缺了什么，
           只有完全无记录的空会话才不渲染 -->
      <div class="stats-dock">
        <o-if :value="statSteps > 0 || statTurns > 0">
          <span class="stat-anchor">
            <button
              class="stat-pill"
              class:open="openStat === 'time'"
              attr:title="timePillTitle()"
              on:click="toggleStat('time')"
            >
              <n-icon icon="mdi:timer-outline"></n-icon>
              <span class="stat-pill-label">{{timePillText()}}</span>
            </button>
            <span class="stat-panel" class:open="openStat === 'time'">
                <span class="stat-panel-head">
                  <n-icon icon="mdi:timer-outline"></n-icon>
                  <span class="stat-panel-title">会话统计</span>
                </span>
                <span class="stat-rows">
                  <o-if :value="statLlmMs > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">模型用时</span
                      ><span class="stat-dd">{{fmtDurCompact(statLlmMs)}}</span></span
                    >
                  </o-if>
                  <o-if :value="statToolMs > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">工具调用用时</span
                      ><span class="stat-dd">{{fmtDurCompact(statToolMs)}}</span></span
                    >
                  </o-if>
                  <o-if :value="statTtftAvg > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">首 token 平均（TTFT）</span
                      ><span class="stat-dd">{{fmtDurCompact(statTtftAvg)}}</span></span
                    >
                  </o-if>
                  <o-if :value="statTps > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">输出速度（TPS）</span
                      ><span class="stat-dd">{{statTps}} tok/s</span></span
                    >
                  </o-if>
                  <o-if :value="statSteps === 0">
                    <span class="stat-row"
                      ><span class="stat-dt">数据缺失</span
                      ><span class="stat-dd">本会话无步数与用时记录（异常收场 / 早期会话）</span></span
                    >
                  </o-if>
                </span>
              </span>
          </span>
        </o-if>
        <o-if :value="usageTotal > 0 || statMissingTurns > 0">
          <span class="stat-anchor">
            <button
              class="stat-pill"
              class:open="openStat === 'usage'"
              attr:title="usagePillTitle()"
              on:click="toggleStat('usage')"
            >
              <n-icon icon="mdi:coins"></n-icon>
              <span class="stat-pill-label">{{usagePillText()}}</span>
            </button>
            <span class="stat-panel" class:open="openStat === 'usage'">
                <span class="stat-panel-head">
                  <n-icon icon="mdi:coins"></n-icon>
                  <span class="stat-panel-title">Token 用量</span>
                  <span class="stat-panel-value">{{usageHeadText()}}</span>
                </span>
                <span class="stat-rows">
                  <o-if :value="usageCacheRead > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">缓存命中</span
                      ><span class="stat-dd">{{cacheHitPct()}}%</span></span
                    >
                  </o-if>
                  <o-if :value="usageTotal > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">未缓存输入</span
                      ><span class="stat-dd">{{fmtTokExact(usageUncached)}} tok</span></span
                    >
                  </o-if>
                  <o-if :value="usageCacheRead > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">缓存读取</span
                      ><span class="stat-dd">{{fmtTokExact(usageCacheRead)}} tok</span></span
                    >
                  </o-if>
                  <o-if :value="usageTotal > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">输出</span
                      ><span class="stat-dd">{{fmtTokExact(usageOutput)}} tok</span></span
                    >
                  </o-if>
                  <o-if :value="statMissingTurns > 0">
                    <span class="stat-row"
                      ><span class="stat-dt">数据缺失</span
                      ><span class="stat-dd">{{statMissingTurns}} 个回合无用量记录（异常收场 / 早期会话，无法事后恢复）</span></span
                    >
                  </o-if>
                </span>
              </span>
          </span>
        </o-if>
        <o-if :value="ctxUsed > 0 || ctxUnknown">
          <span class="stat-anchor">
            <button
              class="stat-pill"
              class:open="openStat === 'ctx'"
              attr:title="ctxTitle"
              on:click="toggleStat('ctx')"
            >
              <span class="ctx-track">
                <span class="ctx-fill" class:warn="ctxPct >= 80" :style.width="ctxPct + '%'"></span>
              </span>
              <span class="stat-pill-label">{{ctxPillLabel()}}</span>
            </button>
            <span class="stat-panel" class:open="openStat === 'ctx'">
                <span class="stat-panel-head">
                  <span class="stat-panel-title">{{ctxHeadTitle()}}</span>
                  <span class="stat-panel-value">{{ctxHeadText()}}</span>
                </span>
                <span class="stat-bar">
                  <span class="stat-seg seg-sys" :style.width="ctxSegSys + '%'"></span>
                  <span class="stat-seg seg-tools" :style.width="ctxSegTools + '%'"></span>
                  <span class="stat-seg seg-msgs" :style.width="ctxSegMsgs + '%'"></span>
                </span>
                <span class="stat-rows">
                  <o-if :value="ctxUnknown">
                    <span class="stat-row"

  <script>
    // 页面只负责视觉与交互；AI 创作 / 运行的业务逻辑全部在
    // lib/builder-store.js 的可观察状态仓库中，页面订阅事件同步视图。
    export default async ({ load }) => {
      const { renderMarkdown } = await load("../lib/markdown.js");
      const { createBuilderStore } = await load("../lib/builder-store.js");
      const { TOOL_DEFS } = await load("../lib/tools/index.js");
      const { contextInfo } = await load("../lib/builder.js");

      // Core 依赖：页面模块内必须运行时加载，失败则降级为不可写模式；
      // 句柄等类实例由仓库闭包持有，不进入响应式数据
      let fs = null;
      let mazmotStore = null;
      let selfStore = null;
      try {
        fs = await load("/nos/fs/main.js");
        const { getStorage } = await load("/nos/storage/main.js");
        mazmotStore = getStorage("mazmot");
        selfStore = getStorage("conjure");
      } catch (err) {
        console.warn("NoneOS Core 不可用，生成功能受限：", err);
      }

      const store = createBuilderStore({ fs, mazmotStore, selfStore, load });

      /* ---- 图片附件（多模态输入）：粘贴 / 选择 → dataURL 规范化 ----
       * 超过 1280 长边或 400KB 的位图缩到 1280 长边 + JPEG 0.85 压缩
       * （请求体与 IndexedDB 持久化都省）；GIF（动图）与达标小图原样保留 */
      const IMG_MAX_EDGE = 1280;
      const IMG_MAX_KEEP_BYTES = 400 * 1024;
      const MAX_PENDING_IMAGES = 8;

      const readAsDataURL = (file) =>
        new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = () => reject(new Error("读取图片失败"));
          r.readAsDataURL(file);
        });

      const loadImage = (src) =>
        new Promise((resolve, reject) => {
          const el = new Image();
          el.onload = () => resolve(el);
          el.onerror = () => reject(new Error("图片解码失败"));
          el.src = src;
        });

      async function normalizeImage(file) {
        if (!/^image\//.test(file.type)) throw new Error("不是图片文件");
        const dataUrl = await readAsDataURL(file);
        if (file.type === "image/gif" || file.size <= IMG_MAX_KEEP_BYTES) {
          return dataUrl;
        }
        const img = await loadImage(dataUrl);
        const scale = Math.min(
          1,
          IMG_MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight),
        );
        if (scale >= 1) return dataUrl; // 尺寸本就不大，只是文件偏大——不再有损压缩
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.85);
      }


      // 面板展示用的工具清单（取每个插件描述的第一句）
      const toolDefs = TOOL_DEFS.map((d) => {
        let desc = (d.description || "").split(/。|；/)[0];
        if (desc.length > 42) desc = desc.slice(0, 42) + "…";
        return {
          name: d.name,
          desc: desc + "。",
          tags: d.tags || [],
        };
      });

      // 视觉工具 iframe 的 srcdoc 公共骨架：srcdoc 文档地址是 about:srcdoc，
      // 无法解析 / 开头路径 → base 指向站点根；l-m 的 src 会被 ofa 以文档地址
      // 为 base 解析，必须用完整绝对地址。script 标签首尾都拆开拼（字面量
      // script 开闭标签都会让模板解析器提前断开页面脚本），内嵌脚本为单行、
      // 注释只能用块注释（// 会吞掉行尾的闭合括号）
      const toolDocPre = (note) =>
        [
          '<!doctype html><html><head><meta charset="utf-8">',
          '<base href="' + location.origin + '/">',
          "<style>",
          "body{margin:0;padding:14px;color-scheme:light dark;",
          "font-family:system-ui,-apple-system,'Segoe UI',sans-serif;",
          "background:light-dark(#fdfcff,#111318);color:light-dark(#1b1b1f,#e3e2e6)}",
          ".bench-note{font-size:12px;color:light-dark(#5f5f66,#c8c5d0);margin-bottom:10px}",
          ".bench-note b{color:light-dark(#5256a1,#bac3ff)}",
          ".show-form-card,.form-card{max-width:100% !important}",
          "</style>",
          "<" + 'script type="module" src="/gh/ofajs/ofa.js@latest/dist/ofa.mjs#debug">' + "</scr" + "ipt>",
          "</head><body>",
          '<div class="bench-note"><b>' + note[0] + "</b> · " + note[1] + "</div>",

        const waitLoop = waitTags.length

        const onCase = visual

            "  } catch (err) {",

      // ---- 跨标签感知：哪些项目标签正打开（BroadcastChannel 广播存活状态） ----
      // aliveTabs 含本标签自己的项目名；openTabs 是它的页面投影（列表项「已打开」徽标）
      const aliveTabs = new Set();

      // 重新探测：清空后广播 hello，各存活标签回 alive 重建集合
      const refreshAliveTabs = () => {
        aliveTabs.clear();
        if (announcedName) aliveTabs.add(announcedName);
        syncOpenTabs();
        bc?.postMessage({ type: "hello" });
      };
      const announce = (name) => {
        if (announcedName === name) return;
        if (announcedName) bc?.postMessage({ type: "bye", name: announcedName });
        announcedName = name || null;
        if (name) {
          aliveTabs.add(name);
          bc?.postMessage({ type: "alive", name });
        }
        syncOpenTabs();
      };
      if (bc) {
        bc.onmessage = (e) => {
          const { type, name } = e.data || {};
          if (type === "hello") {
            if (announcedName) {
              bc.postMessage({ type: "alive", name: announcedName });
            }
          } else if (type === "alive" && name) {
            aliveTabs.add(name);
            syncOpenTabs();
          } else if (type === "bye" && name) {
            aliveTabs.delete(name);
            syncOpenTabs();
          }
        };

        async ready() {
          page = this; // 供 BroadcastChannel 闭包回写 openTabs
          // 测试 iframe → 左列 list 的断言进度（同源 srcdoc postMessage）
          window.addEventListener("message", (e) => {
            const d = e.data || {};
            const p = page;
            if (!p) return;
            if (d.type === "conjure-tool-test-case") {
              // 逐条打勾：按用例名回填状态（runSelfTest 完成一条回调一条）
              const idx = p.toolTestPlan.findIndex((i) => i.name === d.item.name);
              if (idx > -1) {
                const plan = [...p.toolTestPlan];
                plan[idx] = {
                  ...plan[idx],
                  status: d.item.pass ? "pass" : "fail",
                  info: d.item.info || "",
                };
                p.toolTestPlan = plan;
              }
            } else if (d.type === "conjure-tool-test-done") {
              p.toolTestAllPass = !!d.ok;
              p.toolTestRunning = false;
              p.toolTestDone = true;
            } else if (d.type === "conjure-tool-test-error") {
              p.toolTestPlan = [
                ...p.toolTestPlan,
                { name: "内置测试模组加载 / 运行失败", status: "fail", info: d.info || "" },
              ];
              p.toolTestAllPass = false;
              p.toolTestRunning = false;
              p.toolTestDone = true;
            }
          });

          window.addEventListener("resize", () => page?.syncToolDialogHeight?.());
          // 恢复会话栏宽度（150–400）
          try {

            /* 忽略 */
          }

          try {
            const cw = parseInt(sessionStorage.getItem("aib:chat-width"), 10);
            if (cw >= 480 && cw <= 1280) this.applyChatWidth(cw);

            /* 忽略 */

                  "524288": "512k",
                  "786432": "768k",
                  "1048576": "1mb",
                }[this.ctxWindow] || "128k";
            }

            /* 忽略 */
          }
          store.setContextWindow(Number(this.ctxWindow));
          this.syncActiveKeyText();
          // 订阅仓库事件，把状态同步到页面响应式数据
          store.subscribe((evt) => {
            if (evt.type === "patch") {
              for (const [key, value] of Object.entries(evt.data)) {
                if (key === "nextId") continue; // 内部计数，页面不需要
                this[key] = value;
              }
              // Key 列表 / 选中项 / 可用模型清单变化：刷新选择器展示文案
              if (
                "apiKeys" in evt.data ||
                "activeKeyId" in evt.data ||
                "modelOptions" in evt.data
              ) {
                this.syncActiveKeyText();
              }
              // 底部统计胶囊与模型触发器文案跟随仓库状态（reasoning / Key 等）
              this.syncStats();
              // 当前项目变化时同步 URL 的 p 参数（刷新 / 分享可回到当前项目）
              // 并向其他标签广播本标签的新项目名
              if ("currentAppName" in evt.data) {
                this.syncUrlParam();
                this.syncTabName();
                announce(this.currentAppName);
              }
              return;
            }
            if (evt.type === "messages") {
              this.applyMessageEvent(evt);
              // 流式增量（patch）同样跟随滚动：生成中手动拉回底部后恢复自动跟随
              this.followScroll();
            }
          });
          // 项目标签标识 ?p=<name>：o-router 路由下页面模块的 query 参数来自
          // hash 路由串，location.search 上的 p 必须直接解析
          await store.init({
            initialApp: new URLSearchParams(location.search).get("p") || "",
          });
          this.syncUrlParam();
          this.syncTabName();
          this.syncDocTitle();
          this.syncInputPlaceholder();
          announce(this.currentAppName); // 本标签项目就位，向其他标签广播
          this.followScroll(true);
        },

        watch: {
          input() {

          },
          // 标签页标题跟随项目切换
