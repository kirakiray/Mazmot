            this.syncInputPlaceholder();
          },
          // 项目元数据回填（模型覆写 app.json）后标题同步刷新
          currentAppDisplay() {
            this.syncDocTitle();
          },
        },

        // ---- 生命周期（根级，proto 内的 attached 不会被调用）----
        attached() {
          // AI 回复进行中每秒心跳，驱动「生成中」右侧实时用时
          this._durTimer = setInterval(() => {
            if (this.sending) this.clock = Date.now();
          }, 1000);
          // 统计面板的收口：点外部与 Esc 收起（st-menu 的开合/Esc/点外部由组件自理）
          this._docClose = (e) => {
            // 页面内容在 shadow DOM 内：document 层事件的 target 已被 retarget
            // 成宿主元素，closest 从宿主向上永远命中不了 shadow 里的 .stat-anchor
            // ——面板内任何按下都被误判成「点外部」（面板上选字即关；已开胶囊
            // 再点先被关、click 的 toggle 又打开，表现为重复弹起）。composed
            // 事件的内外判定必须走 composedPath（同 senti-ui menu 的坑 #21）
            if (
              e.composedPath().some((el) => el.classList?.contains?.("stat-anchor"))
            ) {
              return;
            }
            if (this.openStat) this.openStat = "";
            if (this.openUsageMsgId) this.openUsageMsgId = 0;
            // 预览下拉气泡：点击发生在气泡/按钮内不关（composedPath 穿 shadow 判定）
            if (
              !e
                .composedPath()
                .some((el) => el.classList?.contains?.("preview-wrap"))
            ) {
              this.previewPopOpen = false;
            }
          };
          this._docKey = (e) => {
            if (e.key !== "Escape") return;
            if (this.openStat) this.openStat = "";
            if (this.openUsageMsgId) this.openUsageMsgId = 0;
            if (this.previewPopOpen) this.previewPopOpen = false;
          };
          document.addEventListener("mousedown", this._docClose);
          document.addEventListener("keydown", this._docKey);
          // 代码块复制：事件委托挂在聊天容器上，:html 重渲后依然有效
          this.shadow.$("#chatScroll")?.on("click", async (event) => {
            const btn = event.target?.closest?.(".md-copy");
            if (!btn) return;
            const label = btn.querySelector(".md-copy-label");
            try {
              await navigator.clipboard.writeText(btn.dataset.code || "");
              if (!label) return;
              btn.classList.add("copied");
              label.textContent = "已复制";
              clearTimeout(btn._copyTimer);
              btn._copyTimer = setTimeout(() => {
                btn.classList.remove("copied");
                label.textContent = "复制";
              }, 1500);
            } catch {
              if (label) label.textContent = "复制失败";
            }
          });
        },
        detached() {
          clearInterval(this._durTimer);
          clearInterval(this._thumbTimer);
          store.releasePreviewThumbs?.();
          document.removeEventListener("mousedown", this._docClose);
          document.removeEventListener("keydown", this._docKey);
        },

        proto: {
          // ---- 仓库事件 → 页面消息列表 ----

          applyMessageEvent(evt) {
            const { op } = evt;
            if (op === "replace") {
              this.messages = evt.list.map((m) => ({ ...m }));
            } else if (op === "push") {
              this.messages.push({ ...evt.item });
            } else if (op === "patch") {
              const item = this.messages.find((m) => m.id === evt.id);
              if (item) Object.assign(item, evt.patch);
            } else if (op === "splice") {
              const idx = this.messages.findIndex((m) => m.id === evt.id);
              if (idx > -1) this.messages.splice(idx, 1);
            }
            // usage 挂在回合末条 AI 消息上，done patch 时刷新进度条
            this.syncCtx();
            // 思考正文流式跟随：展开中的思考自动停在底部（rAF 节流）
            this.scrollReasoningToBottom();
          },

          // API Key 选择器的当前展示文案 + 模型清单合法性（清单由仓库经
          // getModels 动态拉取，随 patch 事件到达本页 modelOptions）
          syncActiveKeyText() {
            const hit = this.apiKeys.find((k) => k.id === this.activeKeyId);
            this.activeKeyText = hit
              ? `${hit.provider === "relay" ? hit.serverName || "Relay" : hit.provider} · ${hit.maskedKey}`
              : "自动选择";
            // 选中的模型不在当前可用清单里（key 已切换 / 清单已刷新）：重置为自动
            if (
              this.activeModelId &&
              !this.modelOptions.some((m) => m.id === this.activeModelId)
            ) {
              this.activeModelId = "";
              store.selectModel("");
            }
          },

          // 重算上下文占用进度（总量由窗口选择决定），并同步底部统计胶囊
          syncCtx() {
            const info = contextInfo(this.messages);
            // 进行中回合用 live 快照覆盖（消息上的终值要等 done/收尾才落）
            const liveUsed =
              this.sending && this.liveTurnStats
                ? this.liveTurnStats.usage?.context_tokens || 0
                : 0;
            this.ctxUsed = liveUsed > 0 ? liveUsed : info.used;
            if (this.ctxUsed <= 0) {
              // 会话有 AI 消息但拿不到任何 usage → 占用未知，胶囊降级显示
              // （点开面板说明缺数据）；完全空会话才隐藏
              this.ctxUnknown = this.messages.some(
                (m) => m.role === "assistant",
              );
              this.ctxPct = 0;
              this.ctxTitle = this.ctxUnknown
                ? "上下文占用未知：会话没有可用的用量记录（异常收场 / 早期会话，无法事后恢复）"
                : "";
              this.syncStats();
              return;
            }
            this.ctxUnknown = false;
            const total = Number(this.ctxWindow) || 131072;
            this.ctxPct = Math.round(Math.min(100, (this.ctxUsed / total) * 100) * 10) / 10;
            const k = (v) => {
              if (v >= 1024) return (v / 1024).toFixed(1).replace(/\.0$/, "") + "k";
              return String(v);
            };
            this.ctxTitle =
              `当前会话上下文占用 ${k(this.ctxUsed)} / ${k(total)} tok` +
              (info.model ? `（模型 ${info.model}）` : "");
            this.syncStats();
          },

          // 底部统计胶囊聚合：遍历当前会话消息，累计各回合的 turnStats
          //（轮/步/模型用时/工具用时/TTFT/TPS）与 usage（token 分桶，缓存读取
          // 兼容 DeepSeek 与 OpenAI 两种字段）；上下文分解取最近一次带该字段的
          // 回合；同时刷新右侧模型触发器与菜单取值文案
          syncStats() {
            let turns = 0,
              steps = 0,
              llmMs = 0,
              toolMs = 0,
              ttftMs = 0,
              ttftSteps = 0,
              decodeMs = 0,
              decodeTokens = 0;
            let prompt = 0,
              output = 0,
              cacheRead = 0,
              lastBreakdown = null;
            // 已收尾（有 turnMs）但没有 usage 的回合：异常收场或早期会话，
            // 用量胶囊降级提示而不是隐藏
            let missing = 0;
            for (const m of this.messages) {
              if (m.role === "user") turns++;
              if (
                m.role === "assistant" &&
                typeof m.turnMs === "number" &&
                !(m.usage?.total_tokens > 0)
              ) {
                missing++;
              }
              const ts = m.turnStats;
              if (ts) {
                steps += ts.steps || 0;
                llmMs += ts.llmMs || 0;
                toolMs += ts.toolMs || 0;
                ttftMs += ts.ttftMs || 0;
                ttftSteps += ts.ttftSteps || 0;
                decodeMs += ts.decodeMs || 0;
                decodeTokens += ts.decodeTokens || 0;
              }
              const u = m.usage;
              if (u && u.total_tokens > 0) {
                prompt += u.prompt_tokens || 0;
                output += u.completion_tokens || 0;
                cacheRead +=
                  u.prompt_cache_hit_tokens ??
                  u.prompt_tokens_details?.cached_tokens ??
                  0;
                if (m.contextBreakdown) lastBreakdown = m.contextBreakdown;
              }
            }
            // 进行中回合的实时快照：消息上的本回合终值要等 done / 收尾才落，
            // 进行中由 live 增量补足（模型不说话直接调工具的步同样刷新胶囊）
            const live = this.sending ? this.liveTurnStats : null;
            if (live?.usage) {
              prompt += live.usage.prompt_tokens || 0;
              output += live.usage.completion_tokens || 0;
              cacheRead +=
                live.usage.prompt_cache_hit_tokens ??
                live.usage.prompt_tokens_details?.cached_tokens ??
                0;
              if (live.breakdown) lastBreakdown = live.breakdown;
            }
            if (live?.stats) {
              steps += live.stats.steps || 0;
              llmMs += live.stats.llmMs || 0;
              toolMs += live.stats.toolMs || 0;
              ttftMs += live.stats.ttftMs || 0;
              ttftSteps += live.stats.ttftSteps || 0;
              decodeMs += live.stats.decodeMs || 0;
              decodeTokens += live.stats.decodeTokens || 0;
            }
            this.statTurns = turns;
            this.statSteps = steps;
            this.statMissingTurns = missing;
            this.statLlmMs = llmMs;
            this.statToolMs = toolMs;
            this.statTtftAvg = ttftSteps > 0 ? ttftMs / ttftSteps : 0;
            this.statTps =
              decodeMs > 0 ? Math.round(decodeTokens / (decodeMs / 1000)) : 0;
            this.usagePrompt = prompt;
            this.usageOutput = output;
            this.usageCacheRead = cacheRead;
            this.usageUncached = Math.max(0, prompt - cacheRead);
            this.usageTotal = prompt + output;
            // 分解色条宽度 = 占用百分比 × 各部分占比
            const bd = lastBreakdown;
            const total = bd
              ? (bd.systemTokens || 0) +
                (bd.toolsTokens || 0) +
                (bd.messageTokens || 0)
              : 0;
            const w = (n) =>
              total > 0
                ? Math.round(((this.ctxPct * (n || 0)) / total) * 10) / 10
                : 0;
            this.ctxSegSys = w(bd?.systemTokens);
            this.ctxSegTools = w(bd?.toolsTokens);
            this.ctxSegMsgs = w(bd?.messageTokens);
            this.ctxBreakRows = bd
              ? [
                  {
                    k: "sys",
                    label: "系统提示词",
                    text: "~" + this.fmtTokCompact(bd.systemTokens || 0),
                  },
                  {
                    k: "tools",
                    label: "工具定义",
                    text: "~" + this.fmtTokCompact(bd.toolsTokens || 0),
                  },
                  {
                    k: "msgs",
                    label: "对话消息",
                    text: "~" + this.fmtTokCompact(bd.messageTokens || 0),
                  },
                ]
              : [];
            this.modelValueText = this.activeModelId || "自动（供应商默认）";
            this.modelTriggerText =
              (this.activeModelId || "自动") + " · " + this.reasoningLabel();
          },

          // ---- 底部统计面板（点击开合，互斥收口见 attached） ----

          toggleStat(which) {
            this.openStat = this.openStat === which ? "" : which;
            this.schedulePanelPlace();
          },

          // 面板对齐（仅底部统计胶囊）：默认居中于胶囊；居中会超出视口（窄
          // 窗口 / 视口边缘的胶囊）时改为贴锚点左对齐。对话区的「本轮用量」
          // 面板不参与测量——它在消息滚动层内会被滚动层左缘裁剪，恒为左对
          // 齐（模板静态 align-left）。class:open 由 ofa 状态驱动，这里只补
          // 一个手动 align-left 类（ofa 不管这个类名）
          schedulePanelPlace() {
            setTimeout(() => {
              // this.shadow 是 ofa 包装对象，原生方法经 .ele 中转
              const root = this.shadow.ele || this.shadow;
              const panels = root.querySelectorAll(
                ".stats-dock .stat-panel.open",
              );
              const vw = window.innerWidth;
              const margin = 8;
              for (const el of panels) {
                const anchor = el.parentElement;
                if (!anchor) continue;
                const ar = anchor.getBoundingClientRect();
                const w = el.offsetWidth;
                const centeredLeft = ar.left + ar.width / 2 - w / 2;
                const overflow =
                  centeredLeft < margin || centeredLeft + w > vw - margin;
                el.classList.toggle("align-left", overflow);
              }
            }, 30);
          },

          compressFromPanel() {
            if (this.compacting || this.sending) return;
            this.openStat = "";
            this.handleCompress();
          },

          reasoningLabel() {
            const hit = this.effortOptions.find((o) => o.id === this.reasoning);
            return hit ? hit.label : "低";
          },

          // 菜单项勾选标记（选中项 prefix 显示 ✓；抽方法避免模板插值带比较符）
          modelCheck(id) {
            return this.activeModelId === id ? "✓" : "";
          },

          reasoningCheck(id) {
            return this.reasoning === id ? "✓" : "";
          },

          keyCheck(id) {
            return this.activeKeyId === id ? "✓" : "";
          },

          windowCheck(value) {
            return this.ctxWindow === value ? "✓" : "";
          },

          pickModel(id) {
            this.activeModelId = id;
            store.selectModel(id);
            this.syncActiveKeyText();
          },

          pickReasoning(id) {
            store.setReasoning(id);
          },

          pickKey(id) {
            this.activeKeyId = id;
            store.selectApiKey(id);
            this.syncActiveKeyText();
          },

          pickWindow(value) {
            this.applyCtxWindow(value);
          },

          // ---- 数字 / 时长格式化（统计胶囊与明细面板） ----

          // 时间胶囊文案（含比较运算的拼串必须走方法：{{}} 文本插值里的
          // > 会被模板 expr 属性序列化成 &gt;，求值报 gt is not defined）
          timePillText() {
            // 有回合但无步数记录（异常收场 / 早期会话）：降级提示而非隐藏
            if (!(this.statSteps > 0)) return `${this.statTurns} 轮 · 统计缺失`;
            return (
              `${this.statTurns} 轮 ${this.statSteps} 步` +
              (this.statTps > 0 ? ` · ${this.statTps} tok/s` : "")
            );
          },

          timePillTitle() {
            if (!(this.statSteps > 0)) {
              return `会话统计：${this.statTurns} 轮，无步数与用时记录（异常收场 / 早期会话）`;
            }
            return (
              `会话统计：${this.statTurns} 轮 ${this.statSteps} 步` +
              (this.statTps > 0 ? ` · ${this.statTps} tok/s` : "")
            );
          },

          // Token 用量胶囊文案
          usagePillText() {
            // 有已收尾回合但完全无用量记录：降级提示而非隐藏
            if (!(this.usageTotal > 0)) return "用量缺失";
            return (
              this.fmtTokCompact(this.usageTotal) +
              " tok" +
              (this.usageCacheRead > 0
                ? ` · 缓存命中 ${this.cacheHitPct()}%`
                : "")
            );
          },

          usagePillTitle() {
            if (!(this.usageTotal > 0)) {
              return `Token 用量数据缺失：${this.statMissingTurns} 个回合无用量记录（异常收场 / 早期会话，无法事后恢复）`;
            }
            return (
              "Token 用量：共 " +
              this.fmtTokExact(this.usageTotal) +
              " tok" +
              (this.usageCacheRead > 0
                ? " · 缓存命中 " + this.cacheHitPct() + "%"
                : "")
            );
          },

          usageHeadText() {
            return this.usageTotal > 0
              ? this.fmtTokExact(this.usageTotal) + " tok"
              : "无数据";
          },

          // 上下文胶囊（占用未知时降级，见 syncCtx 的 ctxUnknown）
          ctxPillLabel() {
            return this.ctxUnknown ? "未知" : this.ctxPct + "%";
          },

          ctxHeadTitle() {
            return this.ctxUnknown
              ? "上下文占用未知"
              : "上下文已用 " + this.ctxPct + "%";
          },

          ctxHeadText() {
            return this.ctxUnknown
              ? "无数据"
              : "~" +
                  this.fmtTokCompact(this.ctxUsed) +
                  " / " +
                  this.ctxWindowText;
          },

          // 紧凑 token 数：517 / 12.2K / 1.2M
          fmtTokCompact(v) {
            const n = Number(v || 0);
            if (n < 1000) return String(n);
            if (n < 1000000) {
              const k = n / 1000;
              return (
                (k >= 100 ? String(Math.round(k)) : String(Math.round(k * 10) / 10)) +
                "K"
              );
            }
            const m = n / 1000000;
            return (
              (m >= 100 ? String(Math.round(m)) : String(Math.round(m * 10) / 10)) +
              "M"
            );
          },

          // 精确 token 数（千分位）
          fmtTokExact(v) {
            return String(Math.round(Number(v || 0))).replace(
              /\B(?=(\d{3})+(?!\d))/g,
              ",",
            );
          },

          // 紧凑时长：12.1秒 / 2分42秒
          fmtDurCompact(ms) {
            const s = Number(ms || 0) / 1000;
            if (s < 60) return Math.round(s * 10) / 10 + "秒";
            const w = Math.round(s);
            return Math.floor(w / 60) + "分" + (w % 60) + "秒";
          },

          // 缓存命中占比（分母 = 未缓存输入 + 缓存读取，即计费输入）
          cacheHitPct() {
            const denom = this.usageUncached + this.usageCacheRead;
            if (!(denom > 0)) return "";
            return String(Math.round((this.usageCacheRead / denom) * 100));
          },

          // 切换最大上下文窗口：立即重算进度并持久化偏好（select 与菜单共用）
          applyCtxWindow(value) {
            this.ctxWindow = value;
            const opt = this.ctxOptions.find((o) => o.value === value);
            this.ctxWindowText = opt ? opt.label : "128k";
            this.syncCtx();
            store.setContextWindow(Number(value));
            this.syncActiveKeyText();
            if (selfStore) {
              try {
                selfStore.setItem("pref:ctx-window", value);
              } catch {
                /* 存储失败不影响本次会话 */
              }
            }
          },

          setCtxWindow(event) {
            this.applyCtxWindow(event.target.value);
          },

          renderMd(text) {
            return renderMarkdown(text ?? "");
          },

          // 工具行的类型图标（按工具名映射，未登记的用通用齿轮）
          toolIcon(name) {
            return (
              {
                create_app: "mdi:cube-outline",
                write_file: "mdi:file-edit-outline",
                read_file: "mdi:file-document-outline",
                list_files: "mdi:file-tree-outline",
                read_skill: "mdi:book-open-variant",
                show_form: "mdi:card-text-outline",
                preview: "mdi:open-in-new",
              }[name] || "mdi:tools"
            );
          },

          // AI 消息的模型徽标 / 思考过程判定（历史消息可能缺字段）
          aiModel(m) {
            return m?.model || "";
          },

          hasReasoning(m) {
            return !!(m?.reasoning);
          },

          // ---- 思考展示（ZCode 式）：默认收起，头部滚动最后一行；展开限高
          // 自动滚底；推理 token 数随用量落位后显示 ----

          reasoningLive(m) {
            // 思考进行中：有思考内容、正文未开始、回合未收尾（工具循环里
            // turnMs 很晚才补，content 开始输出才是思考结束的标志）
            return !!m?.reasoning && !m?.content && !m?.turnMs;
          },

          // 思考最后一行非空行（收起态的滚动展示内容）
          reasoningTail(m) {
            const lines = String(m?.reasoning || "")
              .split("\n")
              .filter((l) => l.trim());
            const line = lines[lines.length - 1] || "";
            return line.length > 120 ? line.slice(0, 120) + "…" : line;
          },

          reasoningTailHidden(m) {
            return !!m?.reasoningOpen || this.reasoningTail(m) === "";
          },

          // 本次思考消耗的输出 token：气泡增量（store 在气泡关闭时落的
          // reasoningTokens）优先；旧数据回退 usage 平铺 / 供应商明细
          reasoningTokens(m) {
            const rt =
              m?.reasoningTokens ??
              m?.usage?.reasoning_tokens ??
              m?.usage?.completion_tokens_details?.reasoning_tokens;
            return rt > 0 ? this.fmtTokCompact(rt) + " tok" : "";
          },

          // 展开中的思考正文滚到底部（流式跟随；force 供手动展开时立即定位）
          scrollReasoningToBottom(force) {
            if (!force && !this.sending) return;
            if (this._rScrollRaf) return;
            this._rScrollRaf = requestAnimationFrame(() => {
              this._rScrollRaf = null;
              this.shadow.ele
                .querySelectorAll(".reasoning-body")
                .forEach((el) => {
                  el.scrollTop = el.scrollHeight;
                });
            });
          },

          // 本轮 token 用量统计（挂在回合末条 AI 消息上，随消息持久化）
          hasUsage(m) {
            return !!(m?.usage?.total_tokens > 0);
          },

          // 已收尾（有 turnMs）但缺用量记录的回合：胶囊降级显示而非隐藏
          turnStatsMissing(m) {
            return (
              typeof m?.turnMs === "number" && !(m?.usage?.total_tokens > 0)
            );
          },

          // ---- 本轮用量明细面板（插值一律走方法，
          // {{}} 文本插值里不能出现比较符） ----

          // ---- 回合变更卡（changes / snapshotId 挂在回合末条 AI 消息上） ----

          turnChanges(msg) {
            return Array.isArray(msg?.changes) ? msg.changes : [];
          },

          turnAdds(msg) {
            return this.turnChanges(msg).reduce((n, c) => n + (c.adds || 0), 0);
          },

          turnDels(msg) {
            return this.turnChanges(msg).reduce((n, c) => n + (c.dels || 0), 0);
          },

          toggleChanges(id) {
            this.changesMsgId = this.changesMsgId === id ? 0 : id;
            this.fileDiffPath = "";
            this.diffHunks = [];
            this.diffError = "";
            this.rollbackOptionsOpen = 0;
          },

          async toggleFileDiff(path) {
            if (this.fileDiffPath === path) {
              // 再点同一枚：收起面板（grid 动画收尾）
              this.fileDiffPath = "";
              this.diffHunks = [];
              this.diffError = "";
              this.diffFromDisk = false;
              return;
            }
            const msg = this.messages.find((m) => m.id === this.changesMsgId);
            if (!msg) return;
            // 切换前量当前面板高度：新内容就位后再量目标高度，做一次显式
            // 高度过渡——不清空旧内容（保留展示 + 头部加载提示），消除
            // 「清空再填充」的高度跳变闪动
            const wrap = this.shadow.$(".turn-changes.open .tc-diff-wrap")?.ele;
            const fromH = wrap ? wrap.getBoundingClientRect().height : 0;
            this.fileDiffPath = path;
            this.diffError = "";
            const change = this.turnChanges(msg).find((c) => c.path === path);
            const token = (this._diffToken = (this._diffToken || 0) + 1);
            if (Array.isArray(change?.hunks)) {
              // 冻结在消息里的行级内容：永远显示该回合自己的改动
              this.diffFromDisk = false;
              this.diffHunks = change.hunks;
              this.diffLoading = "";
            } else if (msg.snapshotId) {
              // 旧卡片兼容（未记录行级内容的回合）：现场对比快照与当前盘，
              // 结果可能含后续回合的改动，头部会标注
              this.diffFromDisk = true;
              this.diffLoading = path;
              try {
                const res = await store.getTurnDiff(
                  this.currentAppName,
                  msg.snapshotId,
                  path,
                );
                if (token !== this._diffToken) return;
                this.diffHunks = res.hunks || [];
                this.diffError = res.error || "";
              } finally {
                if (token === this._diffToken) this.diffLoading = "";
              }
            } else {
              this.diffFromDisk = false;
              this.diffHunks = [];
            }
            if (token !== this._diffToken) return;
            // 等新内容渲染完成后量目标高度，做一次显式高度过渡（尊重
            // reduced-motion）
            await new Promise((r) =>
              requestAnimationFrame(() => requestAnimationFrame(r)),
            );
            if (token !== this._diffToken) return;
            const toH = wrap ? wrap.getBoundingClientRect().height : 0;
            if (
              wrap &&
              fromH > 0 &&
              toH > 0 &&
              Math.abs(toH - fromH) > 1 &&
              !matchMedia("(prefers-reduced-motion: reduce)").matches
            ) {
              wrap.style.height = fromH + "px";
              wrap.style.overflow = "hidden";
              wrap.getBoundingClientRect(); // 强制 reflow 后再过渡
              wrap.style.transition = "height 200ms cubic-bezier(0.2, 0, 0, 1)";
              wrap.style.height = toH + "px";
              setTimeout(() => {
                wrap.style.height = "";
                wrap.style.overflow = "";
                wrap.style.transition = "";
              }, 220);
            }
          },

          // 面板头部提示：加载中 / 旧卡片对比当前盘的兼容标注
          diffNoteText() {
            if (this.diffLoading) return "正在加载…";
            if (this.diffFromDisk && this.fileDiffPath) {
              return "该回合未记录行级内容，正在对比当前盘";
            }
            return "";
          },

          // 仅当前会话内最后一个带改动的回合可操作；历史回合只读（diff 仍可看，
          // 冻结内容不受影响）
          turnActionsAvailable(msg) {
            for (let i = this.messages.length - 1; i >= 0; i--) {
              const m = this.messages[i];
              if (Array.isArray(m.changes) && m.changes.length) {
                return m.id === msg.id;
              }
            }
            return false;
          },

          diffEmpty(path) {
            return (
              this.fileDiffPath === path &&
              this.diffLoading !== path &&
              this.diffHunks.length === 0
            );
          },

          // 面板头部提示：加载中 / 旧卡片对比当前盘的兼容标注（根作用域不能
          // 引用 $host，&& 不进模板表达式——统一方法化）
          diffNoteText() {
            if (this.diffLoading) return "正在加载…";
            if (this.diffFromDisk && this.fileDiffPath) {
              return "该回合未记录行级内容，正在对比当前盘";
            }
            return "";
          },

          showDiffEmpty() {
            return (
              this.fileDiffPath !== "" &&
              this.diffLoading === "" &&
              this.diffHunks.length === 0

          },

          diffEmptyText(path) {
            if (this.diffError) {
              return `diff 加载失败：${this.diffError}`;
            }
            const msg = this.messages.find((m) => m.id === this.changesMsgId);
            const change =
              msg && this.turnChanges(msg).find((c) => c.path === path);
            if (change?.tooLarge) {
              return "该回合对该文件的改动过大，未保留行级内容（+增 −删 统计仍准确）";
            }
            if (this.diffFromDisk) {
              return "该文件当前内容与本回合开始前一致（后续回合可能已改回）";
            }
            return "该文件在本回合没有行级变化";
          },

          // 回滚（单按钮 + 语义选项）：点击主按钮原地展开「不满意，撤销 /
          // 仅还原代码」两个选项，选完即执行（选择本身就是确认）；回滚成功
          // 后当前内容与该回合快照一致 → turnReverted 派生「已回滚」禁用态
          toggleRollbackOptions(msg) {
            this.rollbackOptionsOpen =
              this.rollbackOptionsOpen === msg.id ? 0 : msg.id;
          },

          turnReverted(msg) {
            if (!msg?.snapshotId) return false;
            return this.backups.some(
              (b) => b.id === msg.snapshotId && b.current,
            );
          },

          rollbackBtnText(msg) {
            return this.turnReverted(msg) ? "已回滚" : "回滚";
          },

          async runRollback(msg, kind = "neutral") {
            if (!msg?.snapshotId) return;
            this.rollbackOptionsOpen = 0;
            const { default: alertDlg } = await load(
              "/gh/ofajs/senti-ui@latest/packages/dialog/alert.js",
            );
            try {
              // 该回合的用户请求摘要（不满意通知里带给 AI，让它知道否决的是哪次改动）
              const turnUser = [...this.messages]
                .reverse()
                .find((m) => m.role === "user" && m.newGroup && m.id < msg.id);
              const res = await store.rollbackTurn(
                this.currentAppName,
                msg.snapshotId,
                {
                  sentiment: kind,
                  requestText: String(turnUser?.content || "").slice(0, 120),
                },
              );
              const base = res?.restored
                ? `已回滚：写回 ${res.files} 个文件（本回合开始前的状态）`
                : "当前内容与快照一致，无需回滚";
              const tail =
                kind === "dissatisfied"
                  ? "下次对话 AI 会感知你对该回合改动不满意"
                  : "下次对话 AI 会感知此次回滚";
              await alertDlg({
                title: kind === "dissatisfied" ? "不满意并回滚" : "回滚代码",
                message: `${base}；${tail}`,
              });
            } catch (err) {
              await alertDlg({ title: "回滚失败", message: err.message });

          },

          // 忽略自动检测到的预览错误（本次不再带给 AI）
          dismissAutoErrors() {
            store.dismissAutoErrors?.();

          // ---- 变更卡「备份代码」：当前内容是否已有备份（backups 的 current
          // 标记由 store.refreshBackups 计算，应用切换 / 回合结束 / 备份操作后刷新）----

          curBackedUp() {
            return this.backups.some((b) => b.current);
          },

          // 禁用态（o-fill 项作用域禁裸字段名，条件统一收进方法）
          backupDisabled() {
            return (
              this.curBackedUp() || this.backupBusy || this.smartBackupBusy
            );
          },

          backupBtnText() {
            if (this.curBackedUp()) return "已备份";
            if (this.smartBackupBusy || this.backupBusy) return "备份中…";
            return "备份代码";
          },

          async backupTurnCode() {
            if (this.curBackedUp() || this.backupBusy || this.smartBackupBusy) return;
            const res = await store.smartBackup();
            if (res?.skipped) {
              const { default: toast } = await load(
                "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js",

              toast("内容未变化，已跳过重复备份");

          },

          toggleUsagePanel(id) {            // 同一时间至多展开一条（面板复用 .stat-panel 的开合动画）；
            // 对话区面板静态左对齐（见模板 align-left），无需测量
            this.openUsageMsgId = this.openUsageMsgId === id ? 0 : id;
          },

          usageTotalOf(m) {
            return m?.usage?.total_tokens || 0;
          },

          // 缓存读取：DeepSeek 风格 prompt_cache_hit_tokens，
          // OpenAI 风格 prompt_tokens_details.cached_tokens
          usageCacheReadOf(m) {
            const u = m?.usage || {};
            return (
              u.prompt_cache_hit_tokens ??
              u.prompt_tokens_details?.cached_tokens ??
              0
            );
          },

          usageUncachedOf(m) {
            return Math.max(
              0,
              (m?.usage?.prompt_tokens || 0) - this.usageCacheReadOf(m),
            );
          },

          // 缓存命中占比；部分命中四舍五入会到 100 时降位显示（99.9）保持诚实
          usageCacheHit(m) {
            const prompt = m?.usage?.prompt_tokens || 0;
            if (!(prompt > 0)) return "";
            const p = (this.usageCacheReadOf(m) / prompt) * 100;
            if (p >= 99.95 && p < 100) return p.toFixed(1);
            return String(Math.round(p));
          },

          // 输出及推理 token（chain 归一化的 reasoning_tokens 平铺字段，
          // 或供应商原生 completion_tokens_details）
          usageOutputText(m) {
            const u = m?.usage || {};
            const out = `${this.fmtTokExact(u.completion_tokens || 0)} tok`;
            const rt = u.reasoning_tokens ?? u.completion_tokens_details?.reasoning_tokens;
            if (rt > 0) return `${out}（其中推理 ${this.fmtTokExact(rt)} tok）`;
            return out;
          },

          turnUsagePillText(m) {
            if (!this.hasUsage(m)) return "用量缺失";
            return `用量 ${this.fmtTokCompact(this.usageTotalOf(m))} tok`;
          },

          turnUsageTitle(m) {
            if (!this.hasUsage(m)) {
              return "本回合已收尾，但没有落盘用量记录（异常收场 / 早期会话），无法事后恢复";
            }
            return "本轮 token 用量（含工具循环的多次模型调用累计），点击查看明细";
          },

          turnUsageHeadText(m) {
            return this.hasUsage(m)
              ? this.fmtTokExact(this.usageTotalOf(m)) + " tok"
              : "无数据";
          },

          toggleReasoning(id) {
            store.toggleReasoning(id);
            // 展开时定位到思考的底部（流式中跟随，历史消息停在末尾）
            setTimeout(() => this.scrollReasoningToBottom(true), 60);
          },

          // fork 按钮可见性：仅已落地的应用会话（草稿没有会话实体）且非发送中
          canFork() {
            return this.currentSessionId !== "" && !this.sending;
          },

          fmtClock(ts) {
            const d = new Date(ts);
            const p = (n) => String(n).padStart(2, "0");
            return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
          },
          fmtDurMs(ms) {
            if (!(ms > 0)) return "";
            if (ms < 1000) return "<1秒";
            const sec = Math.floor(ms / 1000);
            if (sec < 60) return `${sec}秒`;
            const min = Math.floor(sec / 60);
            if (min < 60) return `${min}分${String(sec % 60).padStart(2, "0")}秒`;
            const hr = Math.floor(min / 60);
            return `${hr}时${String(min % 60).padStart(2, "0")}分`;
          },
          // hover 显示的消息落盘时间（AI 消息不用，时间在 ai-foot）
          msgTs(m) {
            if (!(m.ts > 0)) return "";
            return this.fmtClock(m.ts);
          },
          // ai-foot 右侧：本条回复时间 + 本轮耗时（turnMs 由收尾 patch 到末条 AI 消息）
          aiTime(m) {
            if (!(m.ts > 0)) return "";
            let text = this.fmtClock(m.ts);
            if (m.turnMs > 0) {
              text += ` · ${this.fmtDurMs(m.turnMs)}`;
            }
            return text;
          },
          // 「生成中…」右侧的实时用时；clock 参数仅用于建立模板响应式依赖。
          // 表单挂起期间计时暂停：累计挂起时长并在恢复后扣除
          turnLiveText() {
            if (!(this.turnStartTs > 0)) return "";
            const now = Date.now();
            if (this.formWaiting()) {
              if (!this._formPauseStart) this._formPauseStart = now;
            } else if (this._formPauseStart) {
              this._formPauseMs =
                (this._formPauseMs || 0) + (now - this._formPauseStart);
              this._formPauseStart = 0;
            }
            const paused =
              (this._formPauseMs || 0) +
              (this._formPauseStart ? now - this._formPauseStart : 0);
            return (
              "· " + this.fmtDurMs(Math.max(0, now - this.turnStartTs - paused))
            );
          },

          // 本轮是否有挂起中的表单（等待用户提交）：是则状态栏不显示倒计时
          formWaiting() {
            return this.messages.some(
              (m) =>
                m.role === "assistant" &&
                m.type === "form" &&
                m.form?.status === "pending",
            );
          },

          // 回合状态文案：表单挂起 = 等待提交（倒计时暂停）；否则生成中 + 用时
          turnStatusText() {
            if (this.formWaiting()) {
              return "⏸ 已展示表单，等待你提交后继续（计时已暂停）";
            }
            return "生成中… " + this.turnLiveText();
          },

          // ---- 视觉交互表单卡片（show-form 包组件的宿主接线） ----

          isFormMsg(m) {
            return m.role === "assistant" && m.type === "form" && !!m.form;
          },
          isAiMsg(m) {
            return m.role === "assistant" && m.type !== "form";

          // 组件提交冒泡：ofa emit 的载荷在 event.data（即表单值），交回仓库
          // （落盘 + resolve 工具 Promise）
          onFormSubmit(event, mid) {
            store.submitForm(mid, event.data ?? {});

            store.forkSession(id);

          // 手动压缩当前会话上下文（上下文胶囊面板内按钮触发）
          async handleCompress() {
            if (this.compacting || this.ctxUsed <= 0) return;
            this.compacting = true;
            try {
              const r = await store.compress();
              if (!r.ok && r.reason) {
                const { default: alertDlg } = await load(
                  "/gh/ofajs/senti-ui@latest/packages/dialog/alert.js",
                );
                await alertDlg({ title: "压缩上下文", message: r.reason });
              }
            } catch (err) {
              const { default: alertDlg } = await load(
                "/gh/ofajs/senti-ui@latest/packages/dialog/alert.js",
              );
              await alertDlg({ title: "压缩失败", message: err.message });
            } finally {
              this.compacting = false;
            }

          modeText(mode) {

            const { default: promptDlg } = await load(

          openApp(appName, mode) {
            store.openApp(appName, mode);

          openAppRemote(appName, mode) {
            store.openAppRemote(appName, mode);

          // ---- 预览多窗口下拉气泡 ----

          // 开面板时顺带刷新窗口清单 / 入口地址 / 缩略图（缩略图首次会在预览
          // 窗口弹一次屏幕授权框，之后静默抽帧；打开期间每 10s 刷新一次）；
          // 关面板时释放预览窗口的捕获流，不让屏幕共享悄悄挂着
          togglePreviewPop() {
            const next = !this.previewPopOpen;

            clearInterval(this._thumbTimer);
            if (next) {
              store.refreshPreviewWindows();
              store.refreshPreviewInfo();
              store.refreshPreviewThumbs({ resetDenied: true });
              this._thumbTimer = setInterval(() => {
                if (!document.hidden) store.refreshPreviewThumbs();

          popUpdateAll() {

            store.openAppRemote(this.currentAppName, this.currentAppMode);
          },

          // 新开一个预览窗口（popup 槽位）；失败经 keyError 横幅提示，这里兜住拒绝
          async popNewWindow() {

          copyText(text) {

              async () => {

          shortUrl(url) {

            if (!s || s.length <= 46) return s || "—";
            return `${s.slice(0, 30)}…${s.slice(-14)}`;
          },

          thumbFor(w) {

          previewOnlineText() {
            const total = this.previewWindows.length;

          async deleteSession(event, sid) {

            this.confirmingDelSession = "";
            // 先播折叠动画（高度 + 透明度归零）再真正删除
            const el = event?.target?.closest?.(".session-item");
            if (el) {
              this.removingSid = sid;

              requestAnimationFrame(() => el.classList.add("removing"));
              await new Promise((r) => setTimeout(r, 240));

            this.removingSid = "";
            await store.deleteSession(sid);
          },

          // ---- 项目抽屉（左侧滑出）：点击新标签打开；window name 命中已开标签则聚焦不重复开 ----

          projectUrl(name) {
            const u = new URL(location.href);
            if (name) u.searchParams.set("p", name);
            else u.searchParams.delete("p");
            return u.href;
          },

          // 聚焦已开标签（不重载）：window.open(url, name) 命中已存在同名标签时
          // 仍会执行同 URL 导航（= 整页刷新）；先 window.open("") 拿引用——同名
          // 标签已存在时仅聚焦不导航；不存在时拿到的是空白新标签，再补导航
          focusOrOpenTab(url, name) {
            const w = window.open("", name);
            if (!w) {
              window.open(url, name); // 弹窗拦截等异常兜底
              return;

            try {
              if (w.location.href === "about:blank") w.location.href = url;

              /* 读不到 location 视为已存在标签，仅聚焦 */
            }
          },

          // URL 的 p 参数跟随 currentAppName（草稿移除），刷新后能回到当前项目
          syncUrlParam() {
            const u = new URL(location.href);
            const has = u.searchParams.has("p");
            const want = this.currentAppName !== "";
            if (want && u.searchParams.get("p") !== this.currentAppName) {
              u.searchParams.set("p", this.currentAppName);
              history.replaceState(null, "", u.href);
            } else if (!want && has) {
              u.searchParams.delete("p");
              history.replaceState(null, "", u.href);

          // 网页 title 跟随项目切换：草稿 =「新项目 - 妙造 Conjure」，

          syncDocTitle() {

          async handleSmartBackup() {

          backupTime(id) {
            // backup-20260908-153012-abcd1234 → 2026-09-08 15:30:12（尾部为内容 hash）
            const m = /^backup-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})(?:-[0-9a-f]{8})?$/.exec(

          // ---- 备份编辑对话框：名称 + 备注 一并保存（st-dialog 封装） ----

          openBackupEdit(backup) {
            this.editingBackupId = backup.id;
            this.editForm = {
              label: backup.label || "",
              note: backup.note || "",
            };
            this.backupEditOpen = true;
          },

          closeBackupEdit() {
            this.backupEditOpen = false;
          },

          async saveBackupEdit() {
            const id = this.editingBackupId;
            // 名称留空 = 恢复默认时间显示；备注留空 = 清除备注
            const label = this.editForm.label.trim();
            const note = this.editForm.note.trim();
            if (label) {
              const ok = await store.renameBackup(id, label);
              if (!ok) return; // 保存失败保持对话框打开，不丢输入
            }
            await store.setNote(id, note);
            this.backupEditOpen = false;
          },

          // ---- 工具详情对话框（视觉工具含「运行内置测试」） ----

          openToolDetail(name) {
            const def = TOOL_DEFS.find((d) => d.name === name);
            if (!def) return;
            // 描述按句拆行展示（工具描述是给模型看的连排长文本，直接渲染很乱）；
            // 先转义再包 div，内容里的 <字段key> 等不会被当标签解析
            const esc = (t) =>
              String(t).replace(/[&<>"]/g, (c) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
              })[c]);
            const descHtml = (def.description || "")
              // 先按句号分句，再在 "- " 条目边界处拆开（工具描述是连排文本，
              // 条目之间没有句号），最后逐条转义成圆点行
              .split(/。/)
              .flatMap((s) => s.split(/(?=- )|(?=注意：)/))
              .map((s) => s.trim().replace(/^- /, ""))
              .filter(Boolean)
              .map((s) => `<div class="tool-desc-line">• ${esc(s)}。</div>`)
              .join("");
            this.toolDetail = {
              name: def.name,
              descHtml,
              schemaText: JSON.stringify(def.schema || {}, null, 2),
              isVisual: !!def.visual,
              hasTabs: !!def.visual || !!def.selfTest,
            };
            this.toolTab = "info";
            this.toolDemoDoc = def.visual ? buildToolDemoDoc(def) : "";
            this.toolTestDoc = "";
            this.toolTestRunning = false; // 关闭对话框可能发生在运行中，重开时复位
            this.toolTestDone = false;
            this.toolTestPlan = [];
            this.toolDetailOpen = true;
            // 复位上个工具遗留的内容区高度（带 Tab 的工具会在 sync 里重新设置）
            const panelEle = this.shadow
              .$("st-dialog.tool-detail")
              ?.ele?.querySelector(".tool-detail-panel");
            if (panelEle) panelEle.style.height = "";
            this.syncToolDialogHeight();
            // 预载测试计划：进「内置测试」Tab 前就能看到待测清单
            if (def.selfTest) {
              import(def.selfTest)
                .then((m) => {
                  // 异步回填时可能已切到别的工具，校验一下
                  if (this.toolDetail?.name !== def.name) return;
                  this.toolTestPlan = (m.testPlan || []).map((n) => ({
                    name: n,
                    status: "pending",
                    info: "",
                  }));
                  this.syncToolDialogHeight();
                })
                .catch(() => {});
            }
          },

          closeToolDetail() {
            this.toolDetailOpen = false;
          },

          // st-dialog 的 body 包裹层不会自动伸展（flex: 0 1 auto），CSS 够不到
          // shadow 内部；带 Tab 的工具面板是定高的（90vh / max 1040），直接把内容区
          // 高度同步为「面板 clientHeight − 上下 padding」，让「关闭」固定在
          // 底部、中间区域撑满（超出滚动）。窄面板高度随内容，不处理
          syncToolDialogHeight() {
            if (!this.toolDetail?.hasTabs) return;
            requestAnimationFrame(() => {
              const dlg = this.shadow.$("st-dialog.tool-detail")?.ele;
              const mine = dlg?.querySelector(".tool-detail-panel");
              const panel = dlg?.shadowRoot?.querySelector('[part="panel"]');
              if (!dlg || !mine || !panel) return;
              const cs = getComputedStyle(panel);
              const avail =
                panel.clientHeight -
                (parseFloat(cs.paddingTop) || 0) -
                (parseFloat(cs.paddingBottom) || 0);
              if (avail > 100) mine.style.height = `${Math.floor(avail)}px`;
            });
          },

          setToolTab(tab) {
            // 测试 iframe 常驻不卸载，切 Tab 不影响进行中的运行；
            // 中途切走再回来，运行继续、结果照常同步
            this.toolTab = tab;
            this.syncToolDialogHeight();
          },

          // 运行工具包的内置测试模组（约定：包目录下 self-test.js 导出
          // runSelfTest）。仅在测试 Tab 点击「运行测试」时才执行：测试在右侧
          // iframe 里实际运行（视觉工具实时挂载被测组件，纯插件工具显示断言
          // 运行记录），断言经 postMessage 逐条同步回左列 list
          async runToolSelfTest() {
            if (this.toolTestRunning) return;
            const def = TOOL_DEFS.find((d) => d.name === this.toolDetail?.name);
            if (!def?.selfTest) return;
            this.toolTestRunning = true;
            // 全部回到待测态，运行中逐条打勾
            this.toolTestPlan = this.toolTestPlan.map((i) => ({
              ...i,
              status: "pending",
              info: "",
            }));
            this.toolTestDone = false;
            // 先归空再加载：两次运行的 srcdoc 内容相同，若上一次文档还挂着，
            // 同值属性不会触发 iframe 重新导航，测试会「点了没反应」
            this.toolTestDoc = "";
            await new Promise((r) => setTimeout(r, 60));
            this.toolTestDoc = buildToolTestDoc(def);
          },

          // ---- 会话拖拽排序（顺序持久化到 registry 的 sessionOrder） ----

          sessionDragStart(event, id) {
            this.dragSid = id;
            event.dataTransfer.effectAllowed = "move";
            try {
              event.dataTransfer.setData("text/plain", id);
            } catch {
              /* Firefox 需要 setData 才允许拖拽，隐私模式失败可忽略 */
            }
          },

          sessionDragOver(event, id) {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            if (this.dragSid && this.dragOverSid !== id) {
              this.dragOverSid = id;
            }
          },

          sessionDragLeave(event, id) {
            if (this.dragOverSid === id) this.dragOverSid = "";
          },

          async sessionDrop(event, id) {
            event.preventDefault();
            const from = this.dragSid;
            this.dragSid = "";
            this.dragOverSid = "";
            if (from && from !== id) await store.reorderSessions(from, id);
          },

          sessionDragEnd() {
            this.dragSid = "";
            this.dragOverSid = "";
          },

          async deleteBackupClick(event, id) {
            event?.stopPropagation?.();
            if (this.confirmingDelBackup !== id) {
              this.confirmingDelBackup = id;
              return;
            }
            this.confirmingDelBackup = "";
            await store.deleteBackup(id);
          },

          // 还原备份：先确认覆盖风险；当前内容与备份一致时提示无变动
          async restoreBackupClick(backup) {
            const { default: confirmDlg } = await load(
              "/gh/ofajs/senti-ui@latest/packages/dialog/confirm.js",
            );
            const { default: toast } = await load(
              "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js",
            );
            if (this.backups.length === 0) {
              const ok = await confirmDlg({
                title: "还没有备份",
                message: "当前项目还没有任何备份。建议先创建一份备份，否则还原后当前内容会消失且无法恢复。",
                yes: "立即备份",
                cancel: "取消",
              });
              if (ok) await store.createBackup();
              return;
            }
            if (backup.current) {
              toast("当前内容与该备份一致，没有变动，无需还原");
              return;
            }
            const ok = await confirmDlg({
              title: "还原备份",
              message:
                `将把应用内容还原为「${this.backupLabel(backup)}」时的状态，` +
                "还原后当前未备份的修改会消失。确定还原？",
              yes: "确定还原",
              cancel: "取消",
              color: "error",
            });
            if (!ok) return;
            const res = await store.restoreBackup(backup.id);
            if (!res) return; // 失败已提示
            if (res.reason === "unchanged") {
              toast("当前内容与该备份一致，没有变动，无需还原");
              return;
            }
            toast(`已还原 ${res.files} 个文件`);
          },

          // 点击项目：已进入项目则新标签/聚焦打开；空白草稿态在当前页内切换，
          // 但目标项目已在别的标签打开（「已打开」徽标）时聚焦那个标签，
          // 不在草稿标签里原地接管同一个项目
          async openProjectTab(name) {
            if (this.currentAppName === "" && !this.isTabOpen(name)) {
              await store.selectApp(name);
              this.projDrawerOpen = false;
              return;
            }
            this.focusOrOpenTab(this.projectUrl(name), `ai-builder-${name}`);
          },

          newProjectTab() {
            // 当前已是空白草稿：无需新开，直接收起抽屉留在本页
            if (this.currentAppName === "") {
              this.projDrawerOpen = false;
              return;
            }
            // 已有草稿标签（可能在生成中）：仅聚焦不刷新；没有才开新标签
            this.focusOrOpenTab(this.projectUrl(""), "ai-builder-draft");
          },

          async deleteProjectFrom(event, name) {
            event?.stopPropagation?.();
            if (this.confirmingDelApp !== name) {
              this.confirmingDelApp = name;
              return;
            }
            this.confirmingDelApp = "";
            aliveTabs.delete(name);
            syncOpenTabs();
            await store.deleteApp(name);
          },

          // ---- 会话栏宽度拖拽（150–400px，记忆到 sessionStorage） ----

          startSideResize(event) {
            event.preventDefault();
            const el = event.target;
            el.setPointerCapture(event.pointerId);
            const startX = event.clientX;
            const startW = this.sideWidth;
            const onMove = (ev) => {
              const w = startW + (ev.clientX - startX);
              this.sideWidth = Math.min(400, Math.max(150, w));
            };
            const onUp = () => {
              el.removeEventListener("pointermove", onMove);
              el.removeEventListener("pointerup", onUp);
              try {
                sessionStorage.setItem("aib:side-width", String(this.sideWidth));
              } catch {
                /* 隐私模式静默降级 */
              }
            };
            el.addEventListener("pointermove", onMove);
            el.addEventListener("pointerup", onUp);
          },

          // ---- 对话列宽拖拽（480px–min(1280, 可视宽-32)，左右边界对称手柄，
          //      记忆到 sessionStorage；列族经 --chat-w 同步变宽） ----

          // 钳制到契约范围后写 state 并改写根节点 --chat-w（消息列 / 输入区 /
          // 统计条 / 错误条一次同步；窄视口由各列 width:100% 天然收缩）
          applyChatWidth(px) {
            this.chatWidth = Math.round(Math.min(1280, Math.max(480, px)));
            this.shadow
              .$(".app")
              ?.ele?.style.setProperty("--chat-w", this.chatWidth + "px");
          },

          startChatResize(event, dir) {
            // dir：1 = 右手柄（右拖变宽），-1 = 左手柄（左拖变宽）
            event.preventDefault();
            const el = event.target;
            el.setPointerCapture(event.pointerId);
            // 手势内基准冻结：取拖起时的**渲染宽度**而非存储偏好——窄视口下
            // 列已被 width:100% 收缩（偏好 768、渲染 560），从偏好起跳会跳变
            const originX = event.clientX;
            const rendered =
              this.shadow.$(".column")?.ele?.getBoundingClientRect().width;
            const base = Math.round(rendered || this.chatWidth);
            // 上限感知当前可视宽（列两侧各留 ≥16px），手势期间定死不再重算
            const avail =
              this.shadow.$(".chat-wrap")?.ele?.getBoundingClientRect().width ||
              1280;
            const maxW = Math.max(480, Math.min(1280, avail - 32));
            let latestDx = 0;
            let raf = null;
            const apply = () => {
              raf = null;
              this.applyChatWidth(Math.min(maxW, base + dir * latestDx));
            };
            const onMove = (ev) => {
              latestDx = ev.clientX - originX;
              if (raf === null) raf = requestAnimationFrame(apply);
            };
            const onUp = () => {
              el.removeEventListener("pointermove", onMove);
              el.removeEventListener("pointerup", onUp);
              el.removeEventListener("pointercancel", onUp);
              if (raf !== null) cancelAnimationFrame(raf);
              this.applyChatWidth(Math.min(maxW, base + dir * latestDx));
              document.body.style.userSelect = "";
              try {
                sessionStorage.setItem("aib:chat-width", String(this.chatWidth));
              } catch {
                /* 隐私模式静默降级 */
              }
            };
            // 拖动期间禁页面选字（指针划过消息文字不得触发拖选）
            document.body.style.userSelect = "none";
            el.addEventListener("pointermove", onMove);
            el.addEventListener("pointerup", onUp);
            el.addEventListener("pointercancel", onUp);
          },

          openPanel() {
            this.panelOpen = true;
          },

          closePanel() {
            this.panelOpen = false;
          },

          setPanelTab(tab) {
            this.panelTab = tab;
          },

          // ---- 技能安装 / 更新（列表项 loading 占位由仓库维护） ----

          async addSkillByUrl() {
            const { default: promptDlg } = await load(
              "/gh/ofajs/senti-ui@latest/packages/dialog/prompt.js",
            );
            const val = await promptDlg({
              title: "添加技能",
              placeholder: "技能 zip 包或 SKILL.md 地址（https:// 或站内 / 路径）",
            });
            if (val === null) return; // 取消 / 遮罩 / Escape
            const url = String(val).trim();
            if (!url) return;
            await this.installSkill(url);
          },

          async updateSkill(url) {
            if (!url) return;
            await this.installSkill(url);
          },

          async installSkill(url) {
            try {
              await store.installSkillFromSource(url);
            } catch (err) {
              const { default: alertDlg } = await load(
                "/gh/ofajs/senti-ui@latest/packages/dialog/alert.js",
              );
              await alertDlg({ title: "技能安装失败", message: err.message });
            }
          },

          // ---- 聊天输入（纯 UI） ----

          useChip(text) {
            this.input = text;
            this.autoGrow();
            this.shadow.$("#inputer")?.ele.focus();
          },

          handleKeydown(event) {
            if (event.key === "Enter" && !event.shiftKey) {
              if (event.isComposing) return;
              event.preventDefault();
              this.handleSend();
            }
          },

          // ---- 图片附件（多模态输入） ----

          // 输入框粘贴：剪贴板里有图片（截图等）就收进待发列表；纯文本粘贴不受影响
          async handlePaste(event) {
            const files = [...(event.clipboardData?.items || [])]
              .filter((it) => it.kind === "file" && it.type.startsWith("image/"))
              .map((it) => it.getAsFile())
              .filter(Boolean);
            if (!files.length) return;
            event.preventDefault();
            await this.addImageFiles(files);
          },

          pickImages() {
            this.shadow.$("#imgPicker")?.ele.click();
          },

          async onPickImages(event) {
            const files = [...(event.target?.files || [])];
            event.target.value = ""; // 同一张图可再次选择
            await this.addImageFiles(files);
          },

          async addImageFiles(files) {
            if (this.sending || !files.length) return;
            const room = MAX_PENDING_IMAGES - this.pendingImages.length;
            if (room <= 0) return;
            for (const file of files.slice(0, room)) {
              try {
                const src = await normalizeImage(file);
                this.pendingImages.push({
                  id: `img${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
                  src,
                });
              } catch (err) {
                console.warn("图片处理失败：", err);
              }
            }
          },

          removePendingImage(id) {
            this.pendingImages = this.pendingImages.filter((p) => p.id !== id);
          },

          // 点击缩略图看大图：dataURL 顶层导航会被浏览器拦，转 blob URL 新开标签
          async openImage(src) {
            try {
              const blob = await (await fetch(src)).blob();
              const url = URL.createObjectURL(blob);
              window.open(url, "_blank");
              setTimeout(() => URL.revokeObjectURL(url), 60_000);
            } catch {
              window.open(src, "_blank");
            }
          },

          // 用户消息携带的图片清单（老消息无 images 字段 → 空数组）
          msgImages(msg) {
            return Array.isArray(msg?.images) ? msg.images : [];
          },

          // 发送可用：有文本或有待发图片（纯图片消息可发）
          canSend() {
            return !!this.input.trim() || this.pendingImages.length > 0;
          },

          async handleSend() {
            if (this.sending || !this.canSend()) return;
            const text = this.input.trim();
            const images = this.pendingImages.map((p) => p.src);
            this.input = "";
            this.pendingImages = [];
            this.autoGrow();
            this.atBottom = true;
            this.followScroll(true);
            // 新回合：清零表单挂起的计时暂停累计
            this._formPauseMs = 0;
            this._formPauseStart = 0;
            await store.send(text, images);
          },

          autoGrow() {
            requestAnimationFrame(() => {
              const el = this.shadow.$("#inputer")?.ele;
              if (!el) return;
              el.style.height = "auto";
              el.style.height = `${Math.min(el.scrollHeight, 160)}px`;
            });
          },

          followScroll(force = false) {
            if (!force && !this.atBottom) return;
            requestAnimationFrame(() => {
              const el = this.shadow.$("#chatScroll")?.ele;
              if (el) el.scrollTop = el.scrollHeight;
            });
          },

          onChatScroll() {
            const el = this.shadow.$("#chatScroll")?.ele;
            if (!el) return;
            const dist = el.scrollHeight - el.scrollTop - el.clientHeight;
            this.atBottom = dist <= 24;
          },

          toBottomNow() {
            this.atBottom = true;
            this.followScroll(true);
          },
        },
      };
    };
  </script>
</template>
