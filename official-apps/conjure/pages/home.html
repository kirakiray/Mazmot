<template page>
  <link rel="stylesheet" href="./home.css?v=17" />
  <l-m src="/gh/ofajs/senti-ui@main/packages/tabs/tab-bar.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/menu/menu.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/dialog/dialog.html"></l-m>
  <!-- 临时全量 @main（senti-ui 1.0.10 发版后全仓改回 @latest）：nav 药丸初入
       错位 + menu 对话框内 fixed 漂移两修复未发版；组件树共享注册表，只切
       单个组件会造成同 tag 双 URL 重复注册（st-ripple 已被注册），必须一致 -->
  <l-m src="/gh/ofajs/senti-ui@main/packages/navigation/nav-bar.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/textarea/textarea.html"></l-m>
  <!-- show-form 表单卡片的控件依赖（组件模板经 :html 生成，须全局预载） -->
  <l-m src="/gh/ofajs/senti-ui@main/packages/select/select.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/checkbox/checkbox.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/radio/radio.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/mz/comps/ercode/ercode.html"></l-m>
  <!-- 视觉交互工具包的组件（show-form 包的表单卡片）；声明式依赖，先于页面渲染注册 -->
  <l-m src="../lib/tools/show-form/form-card.html"></l-m>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <!-- 已进入项目：Logo + 名称 + 项目下拉按钮；会话标题（小字）+ 编辑在其右侧 -->
        <o-if :value="currentAppName !== ''">
          <div class="brand-group">
            <div class="brand-mark">{{currentAppIcon}}</div>
            <div class="brand-app">
              <div class="brand-name">
                {{currentAppDisplay}}
                <span class="mode-badge" attr:mode="currentAppMode">{{modeText(currentAppMode)}}</span>
                <!-- 应用信息编辑入口：写回 client/app.json 的 displayName / icon -->
                <st-icon-button
                  class="app-meta-edit-btn"
                  title="修改应用名称与图标"
                  on:click="openHub('appinfo')"
                >
                  <n-icon icon="mdi:pencil-outline"></n-icon>
                </st-icon-button>
              </div>
            </div>
            <!-- 项目抽屉（左侧滑出）：项目清单，点击新标签打开（已开标签聚焦） -->
            <st-icon-button
              class="project-menu-btn"
              title="项目列表"
              on:click="openProjectDrawer"
            >
              <n-icon icon="mdi:chevron-down"></n-icon>
            </st-icon-button>
          </div>
          <div class="session-line">
            <o-if :value="currentSessionTitle !== ''">
              <span class="cur-session" attr:title="currentSessionTitle">{{currentSessionTitle}}</span>
            </o-if>
            <o-if :value="currentSessionTitle === ''">
              <span class="cur-app draft">无会话</span>
            </o-if>
            <st-icon-button
              class="session-edit-btn"
              attr:disabled="currentSessionId === ''"
              title="编辑会话名称"
              on:click="editSessionTitle"
            >
              <n-icon icon="mdi:pencil-outline"></n-icon>
            </st-icon-button>
          </div>
        </o-if>
        <!-- 草稿（新建项目）：保持生成器品牌；下拉按钮仍可直接切换项目 -->
        <o-if :value="currentAppName === ''">
          <div class="brand-group">
            <div class="brand-mark">🪄</div>
            <div class="brand-app">
              <div class="brand-name">妙造</div>
              <div class="brand-current">
                <span class="cur-app draft">新应用 · 未创建</span>
              </div>
            </div>
            <st-icon-button
              class="project-menu-btn"
              title="项目列表"
              on:click="openProjectDrawer"
            >
              <n-icon icon="mdi:chevron-down"></n-icon>
            </st-icon-button>
          </div>
        </o-if>
      </div>
      <div class="topbar-actions">
        <o-if :value="currentAppName !== ''">
          <o-if :value="previewStatus">
            <div class="preview-status-box">
              <span class="preview-status" attr:title="previewStatus"
                >{{previewStatus}}</span
              >
              <o-if :value="previewProgress">
                <div class="preview-bar">
                  <div
                    class="preview-bar-fill"
                    :style.width="previewBarPct() + '%'"
                  ></div>
                </div>
              </o-if>
            </div>
          </o-if>
          <div class="preview-wrap">
            <st-icon-button
              class:preview-live="previewOnline"
              attr:title="previewOnline ? '预览窗口已打开 · 点击多窗口面板' : '预览应用（隔离域运行）'"
              attr:disabled="previewBusy"
              on:click="openHub('preview')"
            >
              <n-icon
                attr:icon="previewOnline ? 'mdi:play-circle' : 'mdi:play-circle-outline'"
              ></n-icon>
            </st-icon-button>
            
          </div>
          <div class="publish-wrap">
            <!-- 版本入口：发布与备份合并的「版本」页（发布条 + 版本历史） -->
            <st-icon-button
              class:published="publishedInfo"
              attr:title="publishedInfo ? '版本 · 已发布 v' + publishedInfo.version : '版本 · 发布与备份'"
              attr:disabled="publishBusy"
              on:click="openHub('version')"
            >
              <n-icon
                attr:icon="publishedInfo ? 'mdi:rocket-launch' : 'mdi:rocket-launch-outline'"
              ></n-icon>
            </st-icon-button>
          </div>
        </o-if>
        <st-icon-button title="工具 / 技能（Agent 工具与技能库）" on:click="openHub('resources')">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
        </st-icon-button>
        <st-icon-button title="开发工具" on:click="openHub('devtools')">
          <n-icon icon="mdi:tools"></n-icon>
        </st-icon-button>
      </div>
    </header>

    <div class="body-row">
      <!-- 左侧：当前应用的历史对话（应用创建后常驻） -->
      <aside class="side" class:show="currentAppName !== ''" :style.width="sideWidth + 'px'">
        <div class="side-head">
          <span>对话</span>
          <st-icon-button
            title="新建对话"
            style="font-size: 12px"
            on:click="newSessionFor(currentAppName)"
          >
            ＋
          </st-icon-button>
        </div>
        <div class="side-body">
          <o-fill :value="currentAppSessions" fill-key="id">
            <div
              class="session-item"
              class:active="$data.id === $host.currentSessionId"
              class:drag-over="$host.dragOverSid === $data.id"
              attr:draggable="'true'"
              on:click="$host.loadSession($data.id)"
              on:dragstart="$host.sessionDragStart($event, $data.id)"
              on:dragover="$host.sessionDragOver($event, $data.id)"
              on:dragleave="$host.sessionDragLeave($event, $data.id)"
              on:drop="$host.sessionDrop($event, $data.id)"
              on:dragend="$host.sessionDragEnd()"
            >
              <span class="session-title">{{$data.title}}</span>
              <!-- 对话进行中：loading 替代删除按钮的位置；此时不允许删除 -->
              <o-if :value="$data.busy === true">
                <span class="session-busy" attr:title="'该会话正在对话中'">
                  <n-icon icon="mdi:loading"></n-icon>
                </span>
              </o-if>
              <!-- 圆形删除按钮：确认时形变为圆角方形；对话进行中不渲染 -->
              <o-if :value="$data.busy !== true">
                <button
                  class="session-del"
                  class:confirm="$host.confirmingDelSession === $data.id"
                  attr:title="$host.confirmingDelSession === $data.id ? '再点一次确认删除' : '删除对话'"
                  on:click="$host.deleteSession($event, $data.id)"
                >
                  <o-if :value="$host.confirmingDelSession === $data.id">
                    <span>确认</span>
                  </o-if>
                  <o-if :value="$host.confirmingDelSession !== $data.id">
                    <n-icon icon="mdi:close"></n-icon>
                  </o-if>
                </button>
              </o-if>
            </div>
          </o-fill>
        </div>
        <!-- 底部回收站入口（子路由导航项）：删除的对话进这里，可查看 / 还原 / 彻底删除；
             处于回收站子路由时高亮激活态，点会话条目即切回对话 -->
        <div class="side-foot">
          <button
            class="trash-entry"
            class:active="trashRouteActive"
            on:click="openTrash()"
            attr:title="trashRouteActive ? '回收站（当前）' : '已删除的对话'"
          >
            <n-icon icon="mdi:trash-can-outline"></n-icon>
            <span>回收站</span>
            <span class="trash-count" class:zero="currentAppTrash.length === 0">
              {{currentAppTrash.length}}
            </span>
          </button>
        </div>
        <!-- 拖拽调整会话栏宽度（150–400px） -->
        <div class="side-resize" on:pointerdown="startSideResize($event)" title="拖动调整宽度"></div>
      </aside>

      <!-- 子路由出口：chat（对话）/ trash（回收站）子页面经嵌套路由渲染到
           此处；本页是父页面（布局壳）：顶栏 + 会话栏 + 抽屉/对话框常驻，
           会话列表点击/回收站入口驱动子路由切换。route-host 用 grid 把子页
           叠放进同一格：切页动画期间新旧两页重叠（ofa 会把旧页置 absolute
           平移淡出），并排布局会互相挤压导致测宽跳变、旧页盖住会话栏 -->
      <div class="route-host">
        <slot></slot>
      </div>
    </div>

    <!-- 项目抽屉（左）：点击项新标签打开项目；已开标签聚焦复用 -->
    <div class="panel-mask" class:show="projDrawerOpen" on:click="closeProjectDrawer"></div>
    <aside class="proj-drawer" class:show="projDrawerOpen">
      <div class="panel-head">
        <span>项目</span>
        <st-icon-button title="关闭" on:click="closeProjectDrawer">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </st-icon-button>
      </div>
      <div class="panel-body">
        <st-button
          class="panel-new"
          variant="outlined"
          style="width: 100%; margin: 4px 0 8px"
          on:click="newProjectTab"
        >
          ＋ 新建项目
        </st-button>

        <o-if :value="apps.length === 0">
          <div class="panel-empty">还没有生成过应用</div>
        </o-if>
        <o-fill :value="apps" fill-key="name">
          <div
            class="panel-item"
            class:active="$data.name === $host.currentAppName"
            on:click="$host.openProjectTab($data.name)"
          >
            <span class="panel-item-icon">{{$data.icon}}</span>
            <div class="panel-item-title">
              <div class="panel-item-name">
                {{$data.displayName || $data.name}}
                <o-if :value="$host.isTabOpen($data.name)">
                  <span class="open-tab-badge">已打开</span>
                </o-if>
              </div>
              <div class="panel-item-dir">
                <span class="mode-badge" attr:mode="$data.mode">{{$host.modeText($data.mode)}}</span>
                {{$data.name}}
              </div>
            </div>
            <st-button
              class="del-btn"
              variant="text"
              class:confirm="$host.confirmingDelApp === $data.name"
              attr:title="$host.confirmingDelApp === $data.name ? '再点一次确认删除（本地目录渠道不删盘上文件）' : '删除项目'"
              style="font-size: 11px"
              on:click="$host.deleteProjectFrom($event, $data.name)"
            >
              <o-if :value="$host.confirmingDelApp === $data.name">
                <span>确认</span>
              </o-if>
              <o-if :value="$host.confirmingDelApp !== $data.name">
                <n-icon icon="mdi:close"></n-icon>
              </o-if>
            </st-button>
          </div>
        </o-fill>
      </div>
    </aside>

    <!-- 备份管理抽屉（右，比普通面板宽）：把当前应用 client/ 打包到同层 backup/ 目录 -->
        

    <!-- 测试管理抽屉（右）：client/test/ 场景用例的清单与一键执行 -->
        

    <!-- 工具 / 技能面板（右） -->
        

    <!-- 备份编辑对话框（名称 + 备注 一并保存；放在无 transform 的 .app 层，
         避免抽屉的 transform 让 fixed 遮罩相对抽屉定位） -->
  <!-- 顶栏功能 Hub：应用设置 / 预览 / 发布 / 备份 / 测试 / 资源 收拢的居中大对话框
       （90vw × 90vh），底部横向 navigation 切换内容页；hub-layout 绝对定位
       撑满面板（st-dialog 内容槽在 shadow .body 里、高度随内容，height:100%
       解析不到面板高度），保证内容不满高时导航栏也固定在底部 -->
    <st-dialog class="hub-dialog" sync:open="hubOpen" auto-close>
      <div class="hub-layout">
        <div class="hub-pane">
          <o-if :value="hubTab === 'appinfo'">
            <div class="hub-pane-head">应用设置</div>
            <div class="hub-pane-body hub-narrow appinfo-body">
              <div class="backup-edit-id">{{currentAppName}}/client/app.json</div>
              <div class="backup-edit-field">
                <div class="backup-edit-label">应用名称</div>
                <st-input
                  sync:value="appMetaName"
                  maxlength="24"
                  placeholder="显示名称（≤24 字，留空回落目录名）"
                ></st-input>
              </div>
              <div class="backup-edit-field">
                <div class="backup-edit-label">图标（emoji）</div>
                <st-input
                  class="app-meta-icon-input"
                  sync:value="appMetaIcon"
                  maxlength="8"
                  placeholder="一个 emoji，如 📦"
                ></st-input>
                <div class="app-meta-presets">
                  <o-fill :value="metaIconPresets">
                    <button
                      class="app-meta-preset"
                      attr:data-on="$data === $host.appMetaIcon"
                      on:click="pickMetaIcon($data)"
                    >{{$data}}</button>
                  </o-fill>
                </div>
              </div>
              <div class="backup-edit-actions">
                <st-button variant="filled" attr:disabled="sending" on:click="saveAppMeta">保存</st-button>
              </div>
              <div class="pub-note">修改写回 client/app.json 并同步登记表 / 顶栏 / 项目抽屉；生成中不可修改</div>
            </div>
          </o-if>

          <o-if :value="hubTab === 'preview'">
            <div class="hub-pane-head">
              预览窗口
              <span class="pp-badge" class:live="previewOnline">{{previewOnlineText()}}</span>
            </div>
            <div class="hub-pane-body hub-wide">
                
                <div class="prev-layout">
            <div class="prev-main">
            <div class="pp-actions">
                  <st-button variant="outlined" attr:disabled="previewBusy" on:click="popUpdateAll">
                    <span slot="prefix"><n-icon icon="mdi:sync"></n-icon></span>
                    更新全部
                  </st-button>
                  <st-button variant="outlined" attr:disabled="previewBusy" on:click="popNewWindow">
                    <span slot="prefix"><n-icon icon="mdi:open-in-new"></n-icon></span>
                    新开窗口
                  </st-button>
                </div>
                <div class="pp-wins-grid">
                  <o-fill :value="previewWindows" fill-key="id">
                    <div class="pp-win-tile" class:offline="!$data.online">
                      <div class="pp-thumb">
                        <o-if :value="$host.thumbFor($data)">
                          <img
                            class="pp-thumb-img"
                            attr:src="$host.thumbFor($data)"
                            alt="预览缩略图"
                          />
                        </o-if>
                        <o-if :value="!$host.thumbFor($data)">
                          <div class="pp-thumb-empty">
                            <n-icon icon="mdi:monitor-screenshot"></n-icon>
                          </div>
                        </o-if>
                        <span class="pp-tile-dot"></span>
                      </div>
                      <div class="pp-tile-meta">
                        <span class="pp-tile-app">{{$data.app || "?"}}</span>
                        <span class="pp-tile-device">{{$host.winLabel($data)}}</span>
                      </div>
                    </div>
                  </o-fill>
                </div>
                <o-if :value="previewWindows.length === 0">
                  <div class="prev-empty">
                    <n-icon icon="mdi:monitor-screenshot"></n-icon>
                    <div class="prev-empty-title">还没有打开的预览窗口</div>
                    <div class="prev-empty-desc">点上方「新开窗口」把当前应用跑进隔离域预览，或用右侧二维码让手机加入调试</div>
                  </div>
                </o-if>
                </div>

            <aside class="prev-qr">
            <div class="pp-sec">
                  <span class="pp-label">手机调试（扫码即收到当前应用，保持本页开启）</span>
                  <div class="pp-qr-row">
                    <o-if :value="previewShareUrl">
                      <m-ercode attr:content="previewShareUrl"></m-ercode>
                    </o-if>
                    <div class="pp-qr-side">
                      <span class="pp-url">{{shortUrl(previewShareUrl)}}</span>
                      <st-icon-button
                        class="pp-copy"
                        title="复制链接"
                        attr:disabled="!previewShareUrl"
                        on:click="copyText(previewShareUrl)"
                      >
                        <n-icon icon="mdi:content-copy"></n-icon>
                      </st-icon-button>
                    </div>
                  </div>
                </div></div>
            </aside>
            </div>
          </o-if>
          <o-if :value="hubTab === 'version'">
            <div class="hub-pane-head">
              版本 · 发布与备份
              <o-if :value="publishedInfo">
                <span class="pp-badge live">已发布 v{{publishedInfo.version}}</span>
              </o-if>
              <o-if :value="!publishedInfo">
                <span class="pp-badge">未发布</span>
              </o-if>
            </div>
            <div class="hub-pane-body hub-wide">
              <!-- 发布条：版本号 / 代码一致性 / 分享链接在左，发布操作在右。
                   发布永远针对当前代码；发完下方历史立即出现带版本标注的存档 -->
              <div class="pub-strip">
                <div class="pub-strip-main">
                  <div class="pub-strip-ver">
                    <o-if :value="publishedInfo">v{{publishedInfo.version}}</o-if>
                    <o-if :value="!publishedInfo">未发布</o-if>
                  </div>
                  <div class="pub-strip-info">
                    <div class="pub-strip-line">
                      <o-if :value="!publishedInfo">
                        <span>发布后即可在首页应用列表打开</span>
                      </o-if>
                      <o-if :value="publishMatch === true">
                        <span class="pub-ok">发布内容就是当前代码</span>
                      </o-if>
                      <o-if :value="publishMatch === false">
                        <span class="pub-warn">有未发布的修改，发布将更新首页副本</span>
                      </o-if>
                    </div>
                    <o-if :value="publishedInfo">
                      <div class="pub-strip-line">
                        <o-if :value="publishShareUrl">
                          <span
                            class="pub-link"
                            attr:title="publishShareUrl"
                          >{{shortUrl(publishShareUrl)}}</span>
                          <st-icon-button
                            class="pub-copy"
                            title="复制分享链接"
                            on:click="copyText(publishShareUrl)"
                          >
                            <n-icon icon="mdi:content-copy"></n-icon>
                          </st-icon-button>
                        </o-if>
                        <o-if :value="!publishShareUrl">
                          <span>分享链接在打开首页应用列表后自动生成</span>
                        </o-if>
                      </div>
                    </o-if>
                  </div>
                </div>
                <div class="pub-actions">
                  <st-button
                    class="pub-main-btn"
                    variant="filled"
                    attr:disabled="publishBusy"
                    on:click="handlePublish()"
                  >
                    <o-if :value="!publishedInfo">🚀 发布</o-if>
                    <o-if :value="publishedInfo">🚀 更新发布</o-if>
                  </st-button>
                  <o-if :value="publishedInfo">
                    <!-- 版本类型菜单：默认更新发布 = 小版本（末段 +1）；菜单可选
                         中版本 / 大版本。大版本对应重大改版，handlePublish 内二次确认 -->
                    <st-menu align="right" class="pub-ver-menu">
                      <button
                        slot="trigger"
                        class="pub-menu-btn"
                        attr:disabled="publishBusy"
                        attr:title="'选择发布版本类型'"
                      >
                        <n-icon icon="mdi:chevron-down"></n-icon>
                      </button>
                      <st-menu-item on:click="handlePublish('minor')">
                        <span slot="prefix" class="menu-check"></span>
                        更新中版本（功能更新）
                        <span slot="suffix" class="menu-value">{{nextVersion('minor')}}</span>
                      </st-menu-item>
                      <st-menu-item on:click="handlePublish('major')">
                        <span slot="prefix" class="menu-check"></span>
                        更新大版本（重大改版）
                        <span slot="suffix" class="menu-value">{{nextVersion('major')}}</span>
                      </st-menu-item>
                    </st-menu>
                  </o-if>
                </div>
              </div>

          </o-if>
          <st-nav-item
            parallel
            attr:active="hubTab === 'preview'"
            on:click="setHubTab('preview')"
          >
            <span slot="icon"><n-icon icon="mdi:play-circle"></n-icon></span>预览
          </st-nav-item>
          <st-nav-item
            parallel
            attr:active="hubTab === 'version'"
            on:click="setHubTab('version')"
          >
            <span slot="icon"><n-icon icon="mdi:rocket-launch"></n-icon></span>版本
          </st-nav-item>
          <st-nav-item
            parallel
            attr:active="hubTab === 'resources'"
            on:click="setHubTab('resources')"
          >
            <span slot="icon"><n-icon icon="mdi:view-grid"></n-icon></span>资源
          </st-nav-item>
          <st-nav-item
            parallel
            attr:active="hubTab === 'devtools'"
            on:click="setHubTab('devtools')"
          >
            <span slot="icon"><n-icon icon="mdi:tools"></n-icon></span>开发工具
          </st-nav-item>
        </st-nav-bar>
      </div>
    </st-dialog>

    <st-dialog class="backup-edit" sync:open="backupEditOpen" auto-close>
      <div class="backup-edit-panel">
        <div class="backup-edit-title">编辑备份</div>
        <div class="backup-edit-id">{{editingBackupId}}/</div>
        <div class="backup-edit-field">
          <div class="backup-edit-label">名称</div>
          <st-input sync:value="editForm.label" placeholder="备份显示名称（留空恢复默认时间）"></st-input>
        </div>
        <div class="backup-edit-field">
          <div class="backup-edit-label">备注</div>
          <st-textarea
            sync:value="editForm.note"
            rows="3"
            autosize
            placeholder="记录这份备份的内容或用途，留空则清除"
          ></st-textarea>
        </div>
        <div class="backup-edit-actions">
          <st-button variant="text" on:click="closeBackupEdit">取消</st-button>
          <st-button variant="filled" on:click="saveBackupEdit">保存</st-button>
        </div>
      </div>
    </st-dialog>

    <!-- 多语种翻译已移入 Hub「工具」tab 的右侧工作区（主从布局，不再用对话框） -->


    <!-- 工具详情对话框：点工具列表项弹出；带内置测试的工具（视觉或纯插件）用
         「工具信息 / 内置测试」双 Tab，无内置测试的工具用窄面板、无 Tab。
         测试 Tab：左断言 list，右 iframe 实跑测试（视觉工具挂载被测组件，
         纯插件工具显示断言运行记录） -->
  </div>

  <script>
    // 父页面（布局壳）：顶栏 / 会话栏 / 项目抽屉 / 功能 Hub 对话框的视觉与
    // 交互；对话内容与回收站是嵌套路由子页（pages/chat.html、pages/trash.html），
    // 业务逻辑全部在 lib/builder-store.js 的可观察状态仓库（经
    // lib/store-instance.js 单例与子页共享），本页订阅事件同步视图。
    export default async ({ load }) => {
      const { TOOL_DEFS } = await load("../lib/tools/index.js");
      const { bumpVersion } = await load("../lib/builder.js");
      // 共享仓库单例：与 chat / trash 子页共享同一实例（Core 装载 + init
      // 在引导内完成，谁先引导都拿到同一份）
      const { getBuilderStore } = await load("../lib/store-instance.js");
      const store = await getBuilderStore();

      const toolDefs = TOOL_DEFS.map((d) => {
        let desc = (d.description || "").split(/。|；/)[0];
        if (desc.length > 42) desc = desc.slice(0, 42) + "…";
        return {
          name: d.name,
          desc: desc + "。",
          tags: d.tags || [],
        };
      });

      // 视觉工具 iframe 的 srcdoc 公共骨架：srcdoc 文档地址是 about:srcdoc，
      // 无法解析 / 开头路径 → base 指向站点根；l-m 的 src 会被 ofa 以文档地址
      // 为 base 解析，必须用完整绝对地址。script 标签首尾都拆开拼（字面量
      // script 开闭标签都会让模板解析器提前断开页面脚本），内嵌脚本为单行、
      // 注释只能用块注释（// 会吞掉行尾的闭合括号）

      const toolDocPre = (note) =>
        [
          '<!doctype html><html><head><meta charset="utf-8">',
          '<base href="' + location.origin + '/">',
          "<style>",
          "body{margin:0;padding:14px;color-scheme:light dark;",
          "font-family:system-ui,-apple-system,'Segoe UI',sans-serif;",
          "background:light-dark(#fdfcff,#111318);color:light-dark(#1b1b1f,#e3e2e6)}",
          ".bench-note{font-size:12px;color:light-dark(#5f5f66,#c8c5d0);margin-bottom:10px}",
          ".bench-note b{color:light-dark(#5256a1,#bac3ff)}",
          ".show-form-card,.form-card{max-width:100% !important}",
          "</style>",
          "<" + 'script type="module" src="/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs#debug">' + "</scr" + "ipt>",
          "</head><body>",
          '<div class="bench-note"><b>' + note[0] + "</b> · " + note[1] + "</div>",
          '<l-m src="' + location.origin + '/nos/n-icon/n-icon.html"></l-m>',
        ].join("");
      const toolDocSenti = () =>
        ["input", "textarea", "select", "checkbox", "radio"]
          .map(
            (n) =>
              '<l-m src="' + location.origin + '/gh/ofajs/senti-ui@main/packages/' + n + "/" + n + '.html"></l-m>',
          )
          .join("");

      // 工具信息 Tab 的演示 iframe：加载包内配套组件，渲染一张可交互的
      // 示例卡片，让用户直观看到工具在对话中的实际运行效果
      const buildToolDemoDoc = (def) => {
        const spec = {
          title: "示例表单：选择部署方案",
          description: "这张卡片就是该工具在对话中的实际渲染效果，可以填写体验。",
          status: "pending",
          data: null,
          fields: [
            { key: "appName", label: "应用名称", type: "text", placeholder: "todo-app", required: true },
            { key: "plan", label: "部署方案", type: "radio", options: ["本地目录", "虚拟系统"] },
            { key: "region", label: "区域", type: "select", options: ["华东", "华北", "海外"] },
            { key: "notes", label: "备注", type: "textarea", placeholder: "补充说明（选填）" },
            { key: "confirm", label: "我已确认以上配置", type: "checkbox", required: true },
          ],
        };
        return (
          toolDocPre(["演示", "源码 " + def.visual.split("/").slice(-2).join("/")]) +
          '<l-m src="' + def.visual + '"></l-m>' +
          toolDocSenti() +
          [
            '<div id="mount"></div>',
            "<" + "script>",
            "(async () => {",
            "  const wait = (ms) => new Promise((r) => setTimeout(r, ms));",
            "  const card = document.createElement('show-form-card');",
            "  document.getElementById('mount').appendChild(card);",
            "  await wait(300);",
            "  const p = window.$(card);",
            "  p.spec = " + JSON.stringify(spec) + ";",
            "  p.bodyHtml = p.renderFields(p.spec);",
            "})();",
            "</scr" + "ipt>",
            "</body></html>",
          ].join("")
        );
      };

      // 内置测试 Tab 的运行 iframe：视觉工具加载组件 + self-test 模组实际执行
      // 测试（被测组件实时挂载在画面上）；纯插件工具不预载组件，右侧逐条显示
      // 断言运行记录。断言经 postMessage 逐条同步回左列 list
      const buildToolTestDoc = (def) => {
        const visual = !!def.visual;
        const waitTags = def.testTags || [];
        const extra = visual
          ? toolDocSenti() + '<l-m src="' + def.visual + '"></l-m>' + '<div id="mount"></div>'
          : [
              "<style>",
              ".t-case{font:13px/1.8 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;",
              "padding:1px 0 1px 20px;position:relative;color:light-dark(#1b1b1f,#e3e2e6)}",
              ".t-case.pass{color:light-dark(#1b7f3b,#7fd894)}",
              ".t-case.fail{color:light-dark(#b3261e,#ffb4ab)}",
              ".t-case::before{position:absolute;left:2px}",
              ".t-case.pass::before{content:'✓'}.t-case.fail::before{content:'✗'}",
              "</style>",
            ].join("");
        const logFn = visual
          ? ""
          : "const log=(c)=>{const d=document.createElement('div');d.className='t-case '+(c.pass?'pass':'fail');" +
            "d.textContent=c.name+(c.info?' — '+c.info:'');document.body.appendChild(d);};";
        const waitLoop = waitTags.length
          ? "const t0 = Date.now();" +
            "while (Date.now() - t0 < 8000 && !(" +
            JSON.stringify(waitTags) +
            ".every((t) => customElements.get(t)))) await wait(100);"
          : "";
        const onCase = visual
          ? "(c) => parent.postMessage({ type: 'conjure-tool-test-case', item: c }, '*')"
          : "(c) => { log(c); parent.postMessage({ type: 'conjure-tool-test-case', item: c }, '*'); }";
        return (
          toolDocPre(
            visual
              ? ["内置测试", "右侧实时挂载被测组件"]
              : ["内置测试", "右侧为断言运行记录"],
          ) +
          extra +
          [
            "<" + "script>",
            "(async () => {",
            "  const wait = (ms) => new Promise((r) => setTimeout(r, ms));",
            ...(logFn ? ["  " + logFn] : []),
            ...(waitLoop
              ? ["  /* 等被测组件与依赖控件注册完成（l-m 异步加载） */", "  " + waitLoop]
              : []),
            "  try {",
            "    const mod = await import('" + def.selfTest + "');",
            "    const res = await mod.runSelfTest(" + onCase + ");",
            "    parent.postMessage({ type: 'conjure-tool-test-done', ok: res.ok }, '*');",
            "  } catch (err) {",
            "    parent.postMessage({ type: 'conjure-tool-test-error', info: String((err && err.message) || err) }, '*');",
            "  }",
            "})();",
            "</scr" + "ipt>",
            "</body></html>",
          ].join("\n")
        );
      };

      // ---- 跨标签感知：哪些项目标签正打开（BroadcastChannel 广播存活状态） ----
      // aliveTabs 含本标签自己的项目名；openTabs 是它的页面投影（列表项「已打开」徽标）
      const aliveTabs = new Set();
      let announcedName = null;
      let bc = null;
      let page = null;
      try {
        bc = new BroadcastChannel("ai-builder-tabs");
      } catch {
        /* 不支持则徽标退化为只显示本标签 */
      }
      const syncOpenTabs = () => {
        if (page) page.openTabs = [...aliveTabs];
      };
      // 重新探测：清空后广播 hello，各存活标签回 alive 重建集合
      const refreshAliveTabs = () => {
        aliveTabs.clear();
        if (announcedName) aliveTabs.add(announcedName);
        syncOpenTabs();
        bc?.postMessage({ type: "hello" });
      };
      const announce = (name) => {
        if (announcedName === name) return;
        if (announcedName) bc?.postMessage({ type: "bye", name: announcedName });
        announcedName = name || null;
        if (name) {
          aliveTabs.add(name);
          bc?.postMessage({ type: "alive", name });
        }
        syncOpenTabs();
      };
      if (bc) {
        bc.onmessage = (e) => {
          const { type, name } = e.data || {};
          if (type === "hello") {
            if (announcedName) {
              bc.postMessage({ type: "alive", name: announcedName });
            }
          } else if (type === "alive" && name) {
            aliveTabs.add(name);
            syncOpenTabs();
          } else if (type === "bye" && name) {
            aliveTabs.delete(name);
            syncOpenTabs();
          }
        };
      }
      window.addEventListener("beforeunload", () => {
        if (announcedName) bc?.postMessage({ type: "bye", name: announcedName });
      });
      // 回合进行中拦截刷新 / 关闭标签：浏览器原生确认弹窗（自定义文案现代
      // 浏览器不展示，措辞由浏览器统一）；回合收尾 sending 复位即自动放行
      window.addEventListener("beforeunload", (e) => {
        if (store.state.sending) {
          e.preventDefault();
          e.returnValue = ""; // Chrome 旧链路要求的置位触发
        }
      });

      return {
        data: {
          sideWidth: 216, // 会话栏宽度（拖拽可调，150–400）
          hubOpen: false, // 顶栏功能 Hub 大对话框（预览 / 发布 / 备份 / 测试 / 资源）
          hubTab: "preview", // Hub 当前内容页
          panelTab: "tools", // 右侧面板 tab："tools" | "skills"
          projDrawerOpen: false, // 左侧项目抽屉

          tests: [], // 场景用例清单（client/test/*.test.json）
          testResults: {}, // 每用例上次结果（file → {ok, ms, error, steps}）
          testLastRun: null, // 上次全量摘要 {at, ok, pass, fail}
          testRunning: null, // 执行进度 {done, total, current, file}（file = 正在跑的用例，spinner 高亮用）
          testBusy: false,
          backups: [], // 当前应用已备份清单（backup/ 目录名，新的在前）
          currentHash: "", // 当前 client/ 内容指纹（已回滚派生态用）
          backupBusy: false, // 正在打包备份
          smartBackupBusy: false, // 智能备份的 AI 分析阶段
          publishBusy: false, // 发布到首页应用列表进行中
          publishedInfo: null, // 当前应用发布态（null = 未发布；{ version, at } = 已发布）
          appMetaName: "", // 编辑中的显示名称草稿
          appMetaIcon: "", // 编辑中的图标草稿（emoji）
          metaIconPresets: ["📦", "⏰", "✅", "🎵", "💰", "📝", "🎮", "🌤️", "📷", "🔔", "📊", "🧩"],
          publishMatch: null, // 发布内容与当前代码一致性（true 一致 / false 有修改 / null 未知）
          publishShareUrl: "", // 已发布副本的 P2P 分享链接（空 = 尚未生成）
          previewBusy: false, // 隔离预览推送中
          previewStatus: "", // 隔离预览过程提示（顶栏预览按钮旁）
          previewProgress: null, // 隔离预览结构化进度 {done, total}（迷你进度条）
          previewOnline: false, // 预览窗口（应用页代理）在线 → 预览按钮亮标
          previewWindows: [], // 预览窗口注册表快照（多窗口下拉气泡）
          previewThumbs: {}, // 窗口缩略图缓存（winId → dataURL，空串 = 占位图）
          previewShareUrl: "", // 跨设备入口（bridge 引导页 ?u=&app=，手机扫码用）
          confirmingDelBackup: "", // 两步确认删除的备份 id
          backupEditOpen: false, // 备份编辑对话框（名称 + 备注）
          editingBackupId: "", // 正在编辑的备份 id
          editForm: { label: "", note: "" }, // 编辑对话框表单
          devTool: "", // 工具 tab 选中的开发工具（"locale" = 多语种翻译；"" = 未选）
          localeAppName: "", // 多语种翻译快照的应用名（扫描 / 保存都以此为准）
          localeScannedFor: "", // 最近一次扫描对应的应用名（≠ 当前项目时提示重扫）
          localeBusy: false, // 扫描进行中
          localeSaving: false, // 保存写入中
          localeStatus: "", // 扫描 / 保存状态行
          localeStatsText: "", // 扫描统计（N 文件 · 命中 M · 新增 X · 冗余 Y）
          localeEntries: [], // 可编辑条目 [{hash, baseText, status, sourceFile, rows: [{lang, text}]}]
          newLocaleLang: "ja", // 「添加语种」当前选中的候选语言
          toolDetail: null, // 当前查看的工具（name / desc / schemaText / isVisual / hasTabs）
          toolTab: "info", // 视觉工具对话框 Tab："info" | "test"
          toolDemoDoc: "", // 运行效果演示 iframe 的 srcdoc
          toolTestDoc: "", // 内置测试运行 iframe 的 srcdoc
          toolTestRunning: false, // 内置测试运行中
          toolTestDone: false, // 内置测试已出结果
          toolTestAllPass: false,
          toolTestPlan: [], // 测试计划 [{ name, status: "pending"|"pass"|"fail", info }]
          openTabs: [], // 正在打开中的项目标签（跨标签感知）
          confirmingDelApp: "",
          apps: [],
          currentAppName: "", // "" = 新应用草稿
          currentAppDisplay: "",
          currentAppIcon: "📦",
          currentAppMode: "vfs",
          currentAppSessions: [],
          currentSessionId: "",
          currentSessionTitle: "",
          storageMode: "vfs",
          localDirLabel: "",
          confirmingDelSession: "",
          currentAppTrash: [], // 当前应用回收站（store 镜像，驱动底部入口徽标）
          dragSid: "", // 拖拽排序：被拖起的会话 id
          dragOverSid: "", // 拖拽排序：悬停目标会话 id（高亮）
          toolDefs,
          skills: [],
          trashRouteActive: false, // 当前子路由是否为回收站（routerChange 维护）
        },

        async ready() {
          page = this; // 供 BroadcastChannel 闭包回写 openTabs
          // 测试 iframe → 左列 list 的断言进度（同源 srcdoc postMessage）
          window.addEventListener("message", (e) => {
            const d = e.data || {};
            const p = page;
            if (!p) return;
            if (d.type === "conjure-tool-test-case") {
              // 逐条打勾：按用例名回填状态（runSelfTest 完成一条回调一条）
              const idx = p.toolTestPlan.findIndex((i) => i.name === d.item.name);
              if (idx > -1) {
                const plan = [...p.toolTestPlan];
                plan[idx] = {
                  ...plan[idx],
                  status: d.item.pass ? "pass" : "fail",
                  info: d.item.info || "",
                };
                p.toolTestPlan = plan;
              }
            } else if (d.type === "conjure-tool-test-done") {
              p.toolTestAllPass = !!d.ok;
              p.toolTestRunning = false;
              p.toolTestDone = true;
            } else if (d.type === "conjure-tool-test-error") {
              p.toolTestPlan = [
                ...p.toolTestPlan,
                { name: "内置测试模组加载 / 运行失败", status: "fail", info: d.info || "" },
              ];
              p.toolTestAllPass = false;
              p.toolTestRunning = false;
              p.toolTestDone = true;
            }
          });
          // 窗口尺寸变化：重算工具对话框内容区高度
          window.addEventListener("resize", () => page?.syncToolDialogHeight?.());
          // 恢复会话栏宽度（150–400）
          try {
            const w = parseInt(sessionStorage.getItem("aib:side-width"), 10);
            if (w >= 150 && w <= 400) this.sideWidth = w;
          } catch {
            /* 忽略 */
          }
          // 订阅共享仓库：镜像全部状态键（页面各自声明自己需要的字段，
          // 多余键落为动态属性无碍）；本页是常驻布局壳，订阅不退订
          store.subscribe((evt) => {
            if (evt.type !== "patch") return;
            for (const [key, value] of Object.entries(evt.data)) {
              if (key === "nextId" || key === "messages") continue;
              this[key] = value;
            }
            // 当前项目变化时同步 URL 的 p 参数（刷新 / 分享可回到当前项目）
            // 并向其他标签广播本标签的新项目名
            if ("currentAppName" in evt.data) {
              this.syncUrlParam();
              this.syncTabName();
              announce(this.currentAppName);
            }
          });
          // 共享单例引导里 init 先于本页订阅完成：初始状态（恢复的项目 /
          // 会话列表）不会以事件形式再来，订阅后手动补一次全量镜像
          for (const [key, value] of Object.entries(store.state)) {
            if (key === "nextId" || key === "messages") continue;
            this[key] = value;
          }
          // 旧入口 hash 直落父页（无子路由）时补导航；正常经子页启动时
          // app.current 是子页面，跳过
          const curSrc = this.app.current?.src || "";
          if (!curSrc.includes("chat.html") && !curSrc.includes("trash.html")) {
            this.app.replace("./pages/chat.html");
          }
          this.syncRouteActive();
          this.syncUrlParam();
          this.syncTabName();
          this.syncDocTitle();
          announce(this.currentAppName); // 本标签项目就位，向其他标签广播
        },

        // 子路由切换生命周期（chat ↔ trash）：委托 proto 方法维护激活态
        //（根级钩子不是实例方法，ready 内不能直接 this.routerChange()）
        routerChange() {
          this.syncRouteActive();
        },

        watch: {
          // 标签页标题跟随项目切换
          currentAppName() {
            this.syncDocTitle();
          },
          // 项目元数据回填（模型覆写 app.json）后标题同步刷新
          currentAppDisplay() {
            this.syncDocTitle();
          },
        },

        // ---- 生命周期（根级，proto 内的 attached 不会被调用）----
        detached() {
          clearInterval(this._thumbTimer);
        },

        proto: {

          // 测试抽屉「有用例但没跑过」空态（模板表达式里禁 > / && / Object.*——

          async deleteSession(event, sid) {
            event?.stopPropagation?.();
            if (this.confirmingDelSession !== sid) {
              this.confirmingDelSession = sid;

            this.confirmingDelSession = "";
            // 折叠动画走纯 DOM：锁高度 → 强制回流（锁定值先完成一次样式
            // 计算，成为过渡起点）→ 加 removing 类过渡到 0。不走响应式
            // class 绑定——绑定由状态驱动，等待删除 IO 期间任何状态复位
            // 都会把 item 弹回展开态（表象即「塌缩→弹回→瞬删」），同帧
            // 加类还会吃掉过渡起点让塌缩变成瞬跳
            const el = event?.target?.closest?.(".session-item");
            if (el) {
              el.style.height = `${el.offsetHeight}px`; // 锁定当前高度让过渡有起点
              void el.offsetHeight; // 强制回流
              el.classList.add("removing");
              await new Promise((r) => setTimeout(r, 240)); // 与过渡时长 220ms 对应
            }
            let removed = false;
            try {
              await store.deleteSession(sid);
              removed = true;
            } finally {
              // 只在删除失败时复位弹回（会话还在列表里，不能留个塌缩空壳）；
              // 成功时保持塌缩态直到 o-fill 随数据移除元素——重渲染可能比
              // 这个 finally 晚一个微任务，按 isConnected 判断会闪一帧
              if (!removed && el && el.isConnected) {
                el.classList.remove("removing");
                el.style.removeProperty("height");
              }
            }

          // ---- 工具详情对话框（视觉工具含「运行内置测试」） ----

          openToolDetail(name) {
            const def = TOOL_DEFS.find((d) => d.name === name);
            if (!def) return;
            // 描述按句拆行展示（工具描述是给模型看的连排长文本，直接渲染很乱）；
            // 先转义再包 div，内容里的 <字段key> 等不会被当标签解析
            const esc = (t) =>
              String(t).replace(/[&<>"]/g, (c) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
              })[c]);
            const descHtml = (def.description || "")
              // 先按句号分句，再在 "- " 条目边界处拆开（工具描述是连排文本，
              // 条目之间没有句号），最后逐条转义成圆点行
              .split(/。/)
              .flatMap((s) => s.split(/(?=- )|(?=注意：)/))
              .map((s) => s.trim().replace(/^- /, ""))
              .filter(Boolean)
              .map((s) => `<div class="tool-desc-line">• ${esc(s)}。</div>`)
              .join("");
            this.toolDetail = {
              name: def.name,
              descHtml,
              schemaText: JSON.stringify(def.schema || {}, null, 2),
              isVisual: !!def.visual,
              hasTabs: !!def.visual || !!def.selfTest,
            };

            const panelEle = this.shadow
              .$("st-dialog.tool-detail")

            this.syncToolDialogHeight();
            // 预载测试计划：进「内置测试」Tab 前就能看到待测清单
            if (def.selfTest) {
              import(def.selfTest)
                .then((m) => {
                  // 异步回填时可能已切到别的工具，校验一下
                  if (this.toolDetail?.name !== def.name) return;
                  this.toolTestPlan = (m.testPlan || []).map((n) => ({
                    name: n,
                    status: "pending",
                    info: "",
                  }));
                  this.syncToolDialogHeight();
                })
                .catch(() => {});
            }
          },

          syncToolDialogHeight() {

          },


          // 运行工具包的内置测试模组（约定：包目录下 self-test.js 导出
          // runSelfTest）。仅在测试 Tab 点击「运行测试」时才执行：测试在右侧
          // iframe 里实际运行（视觉工具实时挂载被测组件，纯插件工具显示断言
          // 运行记录），断言经 postMessage 逐条同步回左列 list
          async runToolSelfTest() {
            if (this.toolTestRunning) return;
            const def = TOOL_DEFS.find((d) => d.name === this.toolDetail?.name);
            if (!def?.selfTest) return;
            this.toolTestRunning = true;
            // 全部回到待测态，运行中逐条打勾
            this.toolTestPlan = this.toolTestPlan.map((i) => ({
              ...i,
              status: "pending",
              info: "",
            }));
            this.toolTestDone = false;
            // 先归空再加载：两次运行的 srcdoc 内容相同，若上一次文档还挂着，
            // 同值属性不会触发 iframe 重新导航，测试会「点了没反应」
            this.toolTestDoc = "";
            await new Promise((r) => setTimeout(r, 60));
            this.toolTestDoc = buildToolTestDoc(def);
          },


          // ---- 会话拖拽排序（顺序持久化到 registry 的 sessionOrder） ----

          sessionDragStart(event, id) {
            this.dragSid = id;
            event.dataTransfer.effectAllowed = "move";
            try {
              event.dataTransfer.setData("text/plain", id);
            } catch {
              /* Firefox 需要 setData 才允许拖拽，隐私模式失败可忽略 */
            }
          },


          sessionDragOver(event, id) {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            if (this.dragSid && this.dragOverSid !== id) {
              this.dragOverSid = id;
            }
          },


          sessionDragLeave(event, id) {
            if (this.dragOverSid === id) this.dragOverSid = "";
          },


          async sessionDrop(event, id) {
            event.preventDefault();
            const from = this.dragSid;
            this.dragSid = "";
            this.dragOverSid = "";
            if (from && from !== id) await store.reorderSessions(from, id);
          },


          sessionDragEnd() {
            this.dragSid = "";
            this.dragOverSid = "";
          },


          async deleteBackupClick(event, id) {
            event?.stopPropagation?.();
            if (this.confirmingDelBackup !== id) {
              this.confirmingDelBackup = id;
              return;
            }
            this.confirmingDelBackup = "";
            await store.deleteBackup(id);
          },


          // 还原备份：先确认覆盖风险；当前内容与备份一致时提示无变动
          async restoreBackupClick(backup) {
            const { default: confirmDlg } = await load(
              "/gh/ofajs/senti-ui@main/packages/dialog/confirm.js",
            );
            const { default: toast } = await load(
              "/gh/ofajs/senti-ui@main/packages/snackbar/toast.js",
            );
            if (this.backups.length === 0) {
              const ok = await confirmDlg({
                title: "还没有备份",
                message: "当前项目还没有任何备份。建议先创建一份备份，否则还原后当前内容会消失且无法恢复。",
                yes: "立即备份",
                cancel: "取消",
              });
              if (ok) await store.createBackup();
              return;
            }
            if (backup.current) {
              toast("当前内容与该备份一致，没有变动，无需还原");
              return;
            }
            const ok = await confirmDlg({
              title: "还原版本",
              message:
                `将把应用内容还原为「${this.backupLabel(backup)}」时的状态，` +
                "还原后当前未备份的修改会消失。确定还原？",
              yes: "确定还原",
              cancel: "取消",
              color: "error",
            });
            if (!ok) return;
            const res = await store.restoreBackup(backup.id);
            if (!res) return; // 失败已提示
            if (res.reason === "unchanged") {
              toast("当前内容与该备份一致，没有变动，无需还原");
              return;
            }
            toast(`已还原 ${res.files} 个文件`);
          },


          // 点击项目：已进入项目则新标签/聚焦打开；空白草稿态在当前页内切换，
          // 但目标项目已在别的标签打开（「已打开」徽标）时聚焦那个标签，
          // 不在草稿标签里原地接管同一个项目
          async openProjectTab(name) {
            if (this.currentAppName === "" && !this.isTabOpen(name)) {
              await store.selectApp(name);
              this.projDrawerOpen = false;
              // 原地切换项目：窗口重建后回到底部（新标签路径由新页面 ready 自滚）
              this.followScroll(true);
              return;
            }
            this.focusOrOpenTab(this.projectUrl(name), `ai-builder-${name}`);
          },


          newProjectTab() {
            // 当前已是空白草稿：无需新开，直接收起抽屉留在本页
            if (this.currentAppName === "") {
              this.projDrawerOpen = false;
              return;
            }
            // 已有草稿标签（可能在生成中）：仅聚焦不刷新；没有才开新标签
            this.focusOrOpenTab(this.projectUrl(""), "ai-builder-draft");
          },


          async deleteProjectFrom(event, name) {
            event?.stopPropagation?.();
            if (this.confirmingDelApp !== name) {
              this.confirmingDelApp = name;
              return;
            }
            this.confirmingDelApp = "";
            aliveTabs.delete(name);
            syncOpenTabs();
            await store.deleteApp(name);
          },


          // ---- 会话栏宽度拖拽（150–400px，记忆到 sessionStorage） ----

          startSideResize(event) {
            event.preventDefault();
            const el = event.target;
            el.setPointerCapture(event.pointerId);
            const startX = event.clientX;
            const startW = this.sideWidth;
            const onMove = (ev) => {
              const w = startW + (ev.clientX - startX);
              this.sideWidth = Math.min(400, Math.max(150, w));
            };
            const onUp = () => {
              el.removeEventListener("pointermove", onMove);
              el.removeEventListener("pointerup", onUp);
              try {
                sessionStorage.setItem("aib:side-width", String(this.sideWidth));
              } catch {
                /* 隐私模式静默降级 */
              }
            };
            el.addEventListener("pointermove", onMove);
            el.addEventListener("pointerup", onUp);
          },


          setHubTab(tab) {
            this.hubTab = tab;
            clearInterval(this._thumbTimer);
            if (tab === "preview") {
              store.refreshPreviewWindows();
              store.refreshPreviewInfo();
              store.refreshPreviewThumbs();
              // 缩略图 = wire 线框数据本地重绘，免屏幕授权；仅在 Hub 停留在
              // 预览页期间每 5s 刷新（单张 ~8KB）
              this._thumbTimer = setInterval(() => {
                if (!document.hidden && this.hubOpen && this.hubTab === "preview") {
                  store.refreshPreviewThumbs();
                }
              }, 5000);
            } else if (tab === "version") {
              // 发布态（一致性 / 分享链接）与版本历史清单一并刷新
              this.confirmingDelBackup = "";
              store.refreshPublishState();
              store.refreshBackups();
            } else if (tab === "appinfo") {
              // 每次进设置页都按当前展示值预填（应用信息可能被模型或别处改过）
              this.appMetaName = this.currentAppDisplay;
              this.appMetaIcon = this.currentAppIcon;
            }
          },


          closeHub() {
            this.hubOpen = false;
            clearInterval(this._thumbTimer);
          },


          setPanelTab(tab) {
            this.panelTab = tab;
          },


          // ---- 工具 tab：开发工具主从布局（左侧清单选中，右侧工作区） ----

          setDevTool(name) {
            this.devTool = name;
            if (name === "locale") this.prepareLocale();
            else if (name === "tests") store.refreshTests?.();
          },

          // 进入多语种翻译：目标项目变化或尚未扫描过时自动扫一次
          async prepareLocale() {
            if (this.currentAppName === "" || this.localeBusy) return;
            if (this.localeScannedFor === this.currentAppName) return;
            await this.rescanLocale();
          },

          // 扫描当前项目：提取文案条目并与已有 locale-text.json 合并，生成
          // 可编辑条目列表（冗余条目一并带出，保存时按编辑结果统一写回）。
          // localeAppName 跟随扫描时刻的当前项目——展示与保存写目标始终一致
          async rescanLocale() {
            if (this.localeBusy || this.currentAppName === "") return;
            this.localeAppName = this.currentAppName;
            this.localeBusy = true;
            this.localeStatus = "扫描应用文件…";
            try {
              const r = await store.localeScan(this.localeAppName);
              // 展示行序：cn → en → 其他语种字母序；已有翻译带入，缺失语种给空行
              const rowsOf = (langs) => {
                const extra = Object.keys(langs)
                  .filter((l) => l !== "cn" && l !== "en")
                  .sort();
                return ["cn", "en", ...extra].map((lang) => ({
                  lang,
                  text: String(langs[lang] ?? ""),
                }));
              };
              const all = [
                ...r.records,
                ...r.orphaned.map((o) => ({
                  ...o,
                  status: "orphaned",
                  sourceFile: "",
                })),
              ];
              this.localeEntries = all.map((rec) => ({
                hash: rec.hash,
                baseText: rec.baseText,
                status: rec.status,
                sourceFile: rec.sourceFile || "",
                rows: rowsOf(r.finalMap[rec.hash] || {}),
              }));
              this.localeStatsText =
                `扫描 ${r.filesScanned} 个文件 · 命中 ${r.hitFiles} · ` +
                `条目 ${all.length}（新增 ${r.added} · 更新 ${r.updated} · 冗余 ${r.orphaned.length}）`;
              this.localeScannedFor = this.localeAppName;
              this.localeStatus =
                r.added > 0 ? `扫描完成，新增 ${r.added} 条` : "扫描完成，没有新条目";
            } catch (err) {
              this.localeStatus = "扫描失败：" + (err?.message || err);
            } finally {
              this.localeBusy = false;
            }
          },

          localeStatusText(status) {
            return (
              { added: "新增", updated: "更新", kept: "保留", orphaned: "冗余" }[
                status
              ] || status
            );
          },

          // 为尚无该语种字段的条目统一添加一行翻译输入
          addLocaleLang() {
            const lang = String(this.newLocaleLang || "").trim();
            if (!lang) return;
            const missing = this.localeEntries.filter(
              (e) => !e.rows.some((r) => r.lang === lang),
            );
            if (missing.length === 0) {
              this.localeStatus = `所有条目都已有 ${lang} 字段`;
              return;
            }
            missing.forEach((e) => {
              e.rows.push({ lang, text: "" });
              this.sortLangRows(e);
            });
            this.localeStatus = `已为 ${missing.length} 条条目添加 ${lang} 翻译列`;
          },

          // 语种行排序：cn → en → 其他字母序（rows 整组重赋值保持响应式）
          sortLangRows(entry) {
            const rank = (l) => (l === "cn" ? 0 : l === "en" ? 1 : 2);
            entry.rows = [...entry.rows].sort(
              (a, b) => rank(a.lang) - rank(b.lang) || (a.lang < b.lang ? -1 : 1),
            );
          },

          deleteLocaleEntry(hash) {
            this.localeEntries = this.localeEntries.filter((e) => e.hash !== hash);
          },

          // 收集编辑结果写回 client/locale-text.json（空文本字段不写入，
          // 全空的条目视为删除）
          async saveLocale() {
            if (this.localeSaving || this.localeBusy) return;
            this.localeSaving = true;
            try {
              const map = {};
              for (const e of this.localeEntries) {
                const langs = {};
                for (const r of e.rows) {
                  const t = String(r.text ?? "").trim();
                  if (t) langs[r.lang] = t;
                }
                if (Object.keys(langs).length > 0) {
                  map[e.hash] = langs;
                }
              }
              const r = await store.localeSave(this.localeAppName, map);
              this.localeStatus = `已写入 ${r.entries} 条到 client/locale-text.json`;
            } catch (err) {
              this.localeStatus = "保存失败：" + (err?.message || err);
            } finally {
              this.localeSaving = false;
            }
          },


          // ---- 技能安装 / 更新（列表项 loading 占位由仓库维护） ----

          async addSkillByUrl() {
            const { default: promptDlg } = await load(
              "/gh/ofajs/senti-ui@main/packages/dialog/prompt.js",
            );
            const val = await promptDlg({
              title: "添加技能",
              placeholder: "技能 zip 包或 SKILL.md 地址（https:// 或站内 / 路径）",
            });
            if (val === null) return; // 取消 / 遮罩 / Escape
            const url = String(val).trim();
            if (!url) return;
            await this.installSkill(url);
          },


          async updateSkill(url) {
            if (!url) return;
            await this.installSkill(url);
          },


          async installSkill(url) {
            try {
              await store.installSkillFromSource(url);
            } catch (err) {
              const { default: alertDlg } = await load(
                "/gh/ofajs/senti-ui@main/packages/dialog/alert.js",
              );
              await alertDlg({ title: "技能安装失败", message: err.message });
            }
          },

          // ---- 子路由切换（会话栏 ↔ 回收站）----

          // 从回收站路由回对话子路由：栈里回收站在上 → back（对话页状态保留）；
          // 刷新直落回收站的栈（只有回收站）→ replace 成对话，防空栈 back
          goChatRoute() {
            const app = this.app;
            if ((app.routers?.length || 0) > 1) {
              app.back();
            } else {
              app.replace("./pages/chat.html");
            }
          },

          // 当前子路由 → 会话栏回收站入口激活态（routerChange 与 ready 共用）
          syncRouteActive() {
            const src = this.app.current?.src || "";
            this.trashRouteActive = src.includes("trash.html");
          },
        },
      };
    };
  </script>
</template>
