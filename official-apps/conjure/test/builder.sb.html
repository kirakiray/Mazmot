    <sb-test name="pickAutoKey 自动选择 key（deepseek 优先 / 单台锁定）">
      <template>
        <script type="module">
          import { pickAutoKey } from "../lib/builder.js";
          {
            const relayA = { id: "r1", provider: "relay" };
            const relayB = { id: "r2", provider: "relay" };
            const glmKey = { id: "g1", provider: "glm" };
            const dsKey = { id: "d1", provider: "deepseek" };

            // 多轮统计随机分支的命中范围（不断言具体某一台）
            const randomHits = new Set();
            for (let i = 0; i < 200; i++) {
              randomHits.add(pickAutoKey([relayA, relayB, glmKey])?.id);
            }

            const checks = {
              empty: pickAutoKey([]) === null,
              deepseekFirst: pickAutoKey([relayA, dsKey, glmKey]) === dsKey,
              singleLocked: pickAutoKey([relayA]) === relayA,
              randomAmongAll:
                randomHits.size === 3 &&
                [...randomHits].every((id) => ["r1", "r2", "g1"].includes(id)),
            };
            return {
              assert: Object.values(checks).every(Boolean),
              content: { checks, randomHits: [...randomHits] },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="truncateThread 按回合截断 wire 记忆">
      <template>
        <script type="module">
          import { truncateThread, tailThread } from "../lib/builder.js";
          {
            const U = (c) => ({ role: "user", content: c });
            const A = (c, calls) => ({
              role: "assistant",
              content: c,
              ...(calls ? { tool_calls: calls } : {}),
            });
            const T = (id) => ({ role: "tool", tool_call_id: id, content: "r" });
            const call = (id) => [{ id, type: "function", function: { name: "x", arguments: "{}" } }];
            // 回合1：user→A(带call)→tool→A(闭合)；回合2：user→A(闭合)；回合3：user→A(带call，未闭合)
            const thread = [
              U("q1"), A("t1", call("c1")), T("c1"), A("done1"),
              U("q2"), A("done2"),
              U("q3"), A("t3", call("c3")),
            ];
            const checks = {
              // fork 在回合2末：保留回合1+2（回合2闭合）
              two: JSON.stringify(truncateThread(thread, 2)) === JSON.stringify([thread[0], thread[1], thread[2], thread[3], thread[4], thread[5]]),
              // fork 在回合3（未闭合）：悬空 tool_calls，回合3 整段丢弃，仍保留前两回合
              openTurn: JSON.stringify(truncateThread(thread, 3)) === JSON.stringify([thread[0], thread[1], thread[2], thread[3], thread[4], thread[5]]),
              // 截断到 0 回合
              zero: truncateThread(thread, 0).length === 0,
              // 空记忆
              empty: JSON.stringify(truncateThread([], 2)) === "[]",
              // 防御性：非 user 开头的记忆开头散段被跳过
              orphan: JSON.stringify(truncateThread([{ role: "assistant", content: "hi" }, U("q"), A("a")], 1)) === JSON.stringify([U("q"), A("a")]),
            };
            const complete = [thread[0], thread[1], thread[2], thread[3], thread[4], thread[5]];
            const tailChecks = {
              // 末尾 1 个完整回合（q3 未闭合被丢弃后只剩 q2 回合）
              tail1: JSON.stringify(tailThread(thread, 1)) === JSON.stringify([thread[4], thread[5]]),
              tail2: JSON.stringify(tailThread(thread, 2)) === JSON.stringify(complete),
              tail0: tailThread(thread, 0).length === 0,
            };
            return {
              assert: Object.values(checks).every(Boolean) && Object.values(tailChecks).every(Boolean),
              content: { checks, tailChecks },
            };
          }
        </script>
      </template>
    </sb-test>

          import { TOOL_DEFS, createTools, toolNames } from "../lib/tools/index.js";

          {
            const names = toolNames();

              allHaveSelfTest: TOOL_DEFS.every((d) => /self-test\.js$/.test(d.selfTest || "")),

      </template>

    <sb-test name="备份打包 / 列表 / 删除（统一虚拟空间）">
      <template>
        <script type="module">
          import {
            createAppDir,
            writeAppFile,
            createAppBackup,
            listAppBackups,
            deleteAppBackup,
            renameAppBackup,
            setBackupNote,
            restoreAppBackup,
            currentAppHash,
            currentAppFiles,
            readBackupFiles,
          } from "../lib/builder.js";
          import {
            createVirtualFs,
            readVirtualFile,
            listVirtualPaths,
          } from "../lib/test-space/virtual-space.js";
          {
            try {
              // 统一虚拟空间（内存版 /nos/fs，见 lib/test-space/README.md）
              const fsFake = createVirtualFs();
              const root = await fsFake.init("ai-apps");

              await createAppDir(fsFake, { name: "demo", displayName: "Demo" });
              await writeAppFile(fsFake, "demo", "index.html", "<html></html>");
              await writeAppFile(
                fsFake,
                "demo",
                "pages/home.html",
                "<template page></template>",
              );
              // client/ 内混入 node_modules：打包时应被忽略
              await writeAppFile(fsFake, "demo", "node_modules/pkg/x.js", "junk");

              const res = await createAppBackup(fsFake, "demo");
              const list = await listAppBackups(fsFake, "demo");
              const restored = await readVirtualFile(
                root,
                `demo/backup/${res.id}/pages/home.html`,
              );

              // 内容无变化再次备份：hash 相同 → 跳过，不产生重复备份
              const res2 = await createAppBackup(fsFake, "demo");
              const list2 = await listAppBackups(fsFake, "demo");
              // 内容变化后备份：hash 不同 → 新备份
              await writeAppFile(fsFake, "demo", "index.html", "<html>v2</html>");
              const res3 = await createAppBackup(fsFake, "demo");
              const list3 = await listAppBackups(fsFake, "demo");

              // 更名：label 写入备份目录 __meta.json，目录名不变
              await renameAppBackup(fsFake, "demo", res3.id, "稳定版");
              // 备注：写入同一 __meta.json（保留 label），空串清除
              await setBackupNote(fsFake, "demo", res3.id, "修复签到后的稳定版");
              const list4 = await listAppBackups(fsFake, "demo");
              const renamed = list4.find((b) => b.id === res3.id);
              // 去重按目录名 hash 命中，更名/备注不影响
              await writeAppFile(fsFake, "demo", "index.html", "<html></html>");
              const res5 = await createAppBackup(fsFake, "demo");
              // 清除备注：note 变空，label 保留
              await setBackupNote(fsFake, "demo", res3.id, "");
              const list5 = await listAppBackups(fsFake, "demo");
              const cleared = list5.find((b) => b.id === res3.id);

              await deleteAppBackup(fsFake, "demo", res.id);
              const list6 = await listAppBackups(fsFake, "demo");

              let idRejected = false;
              try {
                await deleteAppBackup(fsFake, "demo", "../evil");
              } catch {
                idRejected = true;
              }

              const checks = {
                backupId: /^backup-\d{8}-\d{6}-[0-9a-f]{8}$/.test(res.id),
                // createAppDir 预写 4 份文档骨架（AGENTS/CONTEXT/MEMORY/
                // pitfalls/README）+ app.json + __app.json 安装清单
                // + 本用例写的 2 个文件 = 8
                packed: res.files === 8 && res.bytes > 0,
                listed: list.length === 1 && list[0].id === res.id,
                noNodeModules: !(
                  await listVirtualPaths(await root.get("demo/backup"))
                ).some((p) => p.includes("node_modules")),
                contentCopied: restored === "<template page></template>",
                dedupeSkipped: res2.skipped && res2.id === res.id,
                stillOne: list2.length === 1,
                changedNewBackup: !res3.skipped && res3.id !== res.id,
                twoBackups: list3.length === 2,
                newestFirst: list3[0].id > list3[1].id,
                renamed: renamed && renamed.label === "稳定版",
                noted: renamed && renamed.note === "修复签到后的稳定版",
                noteCleared:
                  cleared &&
                  cleared.note === "" &&
                  cleared.label === "稳定版",
                dedupeAfterRename: res5.skipped && res5.id === res.id,
                deleted: list6.length === 1 && list6[0].id === res3.id,
                idRejected,
              };

              // 智能备份数据源：currentAppFiles 读当前 client/，readBackupFiles
              // 读指定备份（忽略 __meta.json）；非法 id 报错
              const curFiles = await currentAppFiles(fsFake, "demo");
              const bFiles = await readBackupFiles(fsFake, "demo", res3.id);
              let badIdRejected = false;
              try {
                await readBackupFiles(fsFake, "demo", "../evil");
              } catch {
                badIdRejected = true;
              }
              checks.curFiles =
                curFiles.length === res.files &&
                curFiles.some(
                  (f) => f.path === "index.html" && f.text === "<html></html>",
                );
              checks.curFilesSorted =
                // collectClientFiles 按纯字典序排序（备份指纹要稳定即可，
                // 无 app.json 优先规则）：大写开头的文档骨架（AGENTS/CONTEXT/
                // MEMORY）在前，"__app.json"（"_" > 大写字母、< 小写字母）
                // 排 app.json 之前，整体清单比对锁定
                curFiles.map((f) => f.path).join("\n") ===
                [
                  "AGENTS.md",
                  "CONTEXT.md",
                  "MEMORY.md",
                  "__app.json",
                  "app.json",
                  "index.html",
                  "pages/home.html",
                  "pitfalls/README.md",
                ].join("\n");
              checks.backupFiles =
                bFiles.length === res3.files &&
                bFiles.some(
                  (f) =>
                    f.path === "index.html" && f.text === "<html>v2</html>",
                );
              checks.backupNoMeta = !bFiles.some(
                (f) => f.path === "__meta.json",
              );
              checks.readBackupBadId = badIdRejected;

              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, res, list3, list6 },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="buildSystemPrompt 按上下文注入">

        <script type="module">
          import { buildSystemPrompt } from "../lib/builder.js";
          {
            const draft = buildSystemPrompt();
            const withApp = buildSystemPrompt({
              appName: "todo-app",
              displayName: "番茄钟",
              mode: "vfs",
            });
            const local = buildSystemPrompt({
              appName: "demo",

            });
            const checks = {
              draftPlain: !draft.includes("当前上下文"),
              appInjected: withApp.includes("todo-app") && withApp.includes("番茄钟"),
              appReadingOrder:
                withApp.includes("先 `read_file` 读 CONTEXT.md") &&
                withApp.includes("再读 MEMORY.md") &&
                withApp.includes("踩坑索引") &&
                withApp.includes("禁止凭猜测"),

              localNoVfsPath: !local.includes("/$ai-apps/demo"),

              storagePattern:
                draft.includes("export default async ({ load }) =>") &&
                draft.includes('load("/nos/storage/main.js")') &&
                !draft.includes("const load = lm(import.meta)"),
              // 页面加载失败 / shadow DOM 取证捷径进基础提示词
              shadowDomProbe: draft.includes("shadowRoot.textContent"),
              // 平台双层 API（Mazmot /mz/* + NoneOS Core /nos/*）与
              // 「联网请求必须用平台 fetch（CORS）」进基础提示词
              platformFetch:
                draft.includes("Mazmot 基于 NoneOS Core 开发") &&
                draft.includes('load("/mz/net/main.js")') &&
                draft.includes("net.fetch") &&
                draft.includes("CORS"),
              // 工作流程的文档体系：宿主预写四份骨架 → 模型填充、不留占位
              docsSystem:
                draft.includes(
                  "AGENTS.md / CONTEXT.md / MEMORY.md / pitfalls/README.md",
                ) &&
                draft.includes("踩坑索引") &&
                draft.includes("不要重写") &&
                draft.includes("不能留着占位交差"),
              // fresh 分支：告知整套骨架已预写、AGENTS.md 不重写
              freshSeededDocs: buildSystemPrompt({
                appName: "todo-app",
                freshProject: true,
              }).includes("已预写好整套文档骨架"),
              // 已存在应用：读到骨架占位 / 缺失文档时先补齐再干活
              appSkeletonBackfill:
                withApp.includes("骨架占位") && withApp.includes("补齐"),
              // 项目规则（AGENTS.md）自动注入：有则整节注入、无则不出现该节
              rulesInjected: buildSystemPrompt({
                appName: "todo-app",
                projectRules: "# 项目规范\n- 禁止使用 localStorage",
              }).includes("已自动加载，必须遵守"),
              rulesClipped: buildSystemPrompt({
                appName: "todo-app",
                projectRules: "x".repeat(8000),
              }).includes("已截断"),
              rulesAbsentWhenEmpty: !buildSystemPrompt({
                appName: "todo-app",
                projectRules: "",
              }).includes("已自动加载"),
              // fresh（空项目）分支不注入规则节（项目还没有 AGENTS.md 可读）
              freshNoRules: !buildSystemPrompt({
                appName: "todo-app",
                freshProject: true,
                projectRules: "# 规则",
              }).includes("已自动加载"),
              // 工作流程闭环要点进基础提示词
              loopChecklist:
                draft.includes("尽早首跑") &&
                draft.includes("先取证再改") &&
                draft.includes("卡住就求助") &&
                draft.includes("完成标准"),
              // 旧项目（没有 AGENTS.md）：提示词内嵌通用模板让模型一次性补建
              legacyTemplate:
                buildSystemPrompt({ appName: "old-app" }).includes(
                  "AGENTS.md 创建",
                ) &&
                buildSystemPrompt({ appName: "old-app" }).includes(
                  "# AGENTS.md — <项目名>",
                ),
              // 宿主自动检测的预览错误注入：有则整节带上（优先修复指引），
              // 无则不出现该节
              autoErrInjected: buildSystemPrompt({
                appName: "todo-app",
                autoErrors: ["[12:00:00.123] [error] Uncaught TypeError: x is not a function"],
              }).includes("预览自动检测报告"),
              autoErrGuides: buildSystemPrompt({
                appName: "todo-app",
                autoErrors: ["[error] boom"],
              }).includes("最高优先级"),
              autoErrAbsent: !buildSystemPrompt({ appName: "todo-app" }).includes(
                "预览自动检测报告",
              ),
              // 回滚通知注入：不满意（带被否决回合的请求摘要）与中性两种措辞；
              // 无 rollback 参数不出现该节
              rollbackDissatisfied:
                buildSystemPrompt({

                    appName: "todo-app",
                    sentiment: "dissatisfied",
                    requestText: "把按钮改成蓝色",

              }).includes("不含不满含义"),
              rollbackAbsent: !buildSystemPrompt({
                appName: "todo-app",
              }).includes("回滚通知"),
            };
            return {
              assert: Object.values(checks).every(Boolean),
              content: { checks },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="createAppDir 预写整套文档骨架（缺失才写，定制不被覆盖重建冲掉）">
      <template>
        <script type="module">
          import { createAppDir, writeAppFile } from "../lib/builder.js";
          import {
            createVirtualDir,
            readVirtualFile,
          } from "../lib/test-space/virtual-space.js";
          {
            try {
              const root = createVirtualDir();
              const fsFake = { init: async () => root };

              await createAppDir(fsFake, { name: "Demo App", displayName: "演示" });
              const seededAgents = await readVirtualFile(
                root,
                "demo-app/client/AGENTS.md",
              );
              const seededContext = await readVirtualFile(
                root,
                "demo-app/client/CONTEXT.md",
              );
              const seededMemory = await readVirtualFile(
                root,
                "demo-app/client/MEMORY.md",
              );
              const seededPitfalls = await readVirtualFile(
                root,
                "demo-app/client/pitfalls/README.md",
              );

              // 定制后同名覆盖重建：已有文档保留定制内容（app.json 照常覆盖）
              await writeAppFile(
                fsFake,

    <sb-test name="unzipText 解析 zip + stripCommonRoot 剥根目录">
      <template>
        <script type="module">
          import { unzipText } from "../lib/skill-sync.js";
          {
            try {
              // 构造一个最小 zip：单根目录 + 两个存储（未压缩）条目
              const enc = new TextEncoder();
              const files = [
                { name: "my-skill/", dir: true },
                { name: "my-skill/SKILL.md", text: "---\nname: my-skill\n---\nhello" },
                { name: "my-skill/references/a.md", text: "ref-a" },
              ];
              const chunks = [];
              const central = [];
              let offset = 0;
              const u16 = (v) => [v & 255, (v >> 8) & 255];
              const u32 = (v) => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >> 24) & 255];
              for (const f of files) {
                const nameBytes = enc.encode(f.name);
                const data = f.dir ? new Uint8Array(0) : enc.encode(f.text);
                const local = [
                  ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
                  ...u16(0), ...u16(0), ...u32(data.length), ...u32(data.length), ...u32(data.length),
                  ...u16(nameBytes.length), ...u16(0),
                  ...nameBytes, ...data,
                ];
                chunks.push(local);
                central.push({
                  name: nameBytes, size: data.length, offset,
                });
                offset += local.length;
              }
              const cdStart = offset;
              for (const c of central) {
                chunks.push([
                  ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
                  ...u16(0), ...u16(0), ...u32(0), ...u32(c.size), ...u32(c.size),
                  ...u16(c.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
                  ...u32(0), ...u32(c.offset), ...c.name,
                ]);
                offset += 46 + c.name.length;
              }
              chunks.push([
                ...u32(0x06054b50), ...u16(0), ...u16(0),
                ...u16(central.length), ...u16(central.length),
                ...u32(offset - cdStart), ...u32(cdStart), ...u16(0),
              ]);
              const buf = new Uint8Array(chunks.flat());
              const entries = await unzipText(buf.buffer);

              const stripped = entries
                .filter((e) => !e.dir)
                .map((e) => e.name.replace(/^my-skill\//, ""));
              const checks = {
                entryCount: entries.filter((e) => !e.dir).length === 2,
                skillMd: entries.some((e) => e.name === "my-skill/SKILL.md" && e.text.includes("hello")),
                nested: entries.some((e) => e.name === "my-skill/references/a.md"),
                stripped: stripped.includes("SKILL.md") && stripped.includes("references/a.md"),
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, names: entries.map((e) => e.name) },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="回合变更卡与自动快照：changes 统计 / snapshotId 落末条消息 / diff 与回滚">
      <template>
        <script type="module">
          import {
            listAppBackups,
            readAppFile,
          } from "../lib/builder.js";
          import { createBuilderStore } from "../lib/builder-store.js";
          import {
            createVirtualFs,
            createVirtualStorage,
          } from "../lib/test-space/virtual-space.js";
          {
            try {
              const fakeStore = createVirtualStorage({ "apps-registry": [] });
              const mazmotStore = createVirtualStorage();
              const fsFake = createVirtualFs();

              // 脚本化 chain：捕获 createAgent 收到的 tools 与 systemPrompt，
              // chat 内直接调 invoke 模拟模型写文件（真实走插件层）
              const agentPrompts = [];
              let agentTools = [];
              const toolOf = (name) => agentTools.find((t) => t.name === name);
              let callN = 0;
              const chat = async ({ onStream }) => {
                callN++;
                const app = store.state.currentAppName;
                if (callN === 1) {
                  await toolOf("write_file").invoke({
                    appName: app,
                    path: "index.html",
                    content: "<html>v1</html>",
                  });
                } else if (callN === 2) {
                  await toolOf("edit_file").invoke({
                    appName: app,
                    path: "index.html",
                    edits: [
                      { old_string: "v1", new_string: "v2" },
                    ],
                  });
                } else if (callN === 3) {
                  // 同回合两次写：冻结 diff 应为 首改前(v1) → 末改后(v1b)
                  await toolOf("write_file").invoke({
                    appName: app,
                    path: "index.html",
                    content: "<html>v1a</html>",
                  });
                  await toolOf("edit_file").invoke({
                    appName: app,
                    path: "index.html",
                    edits: [
                      { old_string: "v1a", new_string: "v1b" },
                    ],
                  });
                }
                // callN >= 4：纯文本回合（回滚通知流转验证，不动文件）
                onStream({ type: "text", delta: `第${callN}轮` });
                return {
                  content: `第${callN}轮`,
                  usage: { prompt_tokens: 10, completion_tokens: 2, total_tokens: 12, context_tokens: 12 },
                  toolCalls: [],
                };
              };
              const fakeChain = {
                tool: (exec, meta) => ({ ...meta, invoke: exec }),
                createAgent: (opts) => {
                  agentTools = opts.tools || [];
                  agentPrompts.push(opts.systemPrompt || "");
                  return { chat };
                },
              };
              const aiFake = {
                getApiKeys: () => [{ id: "k1", provider: "openai", maskedKey: "sk-***" }],
                getAssistant: () => ({ providerName: "Fake" }),
                onApiKeysChange: () => {},
              };
              const store = createBuilderStore({
                fs: fsFake,
                mazmotStore,
                selfStore: fakeStore,
                load: async (path) =>
                  String(path).includes("/mz/ai/chain/main.js") ? fakeChain : aiFake,
              });
              await store.init({});

              // 轮 1（fresh）：项目即建 → 回合快照（骨架态）→ 写 app.json 覆盖 + index.html 新增
              await store.send("做个演示应用");
              const st = store.state;
              const persisted1 =
                (await fakeStore.getItem(`chat:${st.currentAppName}:${st.currentSessionId}`)) || [];
              const ai1 = [...persisted1].reverse().find((m) => m.role === "assistant");
              const idx1 = (ai1?.changes || []).find((c) => c.path === "index.html");
              const appJsonChg = (ai1?.changes || []).find((c) => c.path === "app.json");
              const backups1 = await listAppBackups(fsFake, st.currentAppName);
              const autoBk1 = backups1.find((b) => b.auto);

              // 轮 2：edit_file 差量修改 index.html
              await store.send("把 v1 改成 v2");
              const persisted2 =
                (await fakeStore.getItem(`chat:${st.currentAppName}:${st.currentSessionId}`)) || [];
              const ai2 = [...persisted2]
                .reverse()
                .find((m) => m.role === "assistant" && Array.isArray(m.changes));
              const idx2 = ai2?.changes?.find((c) => c.path === "index.html");

              // diff 查询：轮 2 快照 vs 当前盘（v2）
              const diffRes = await store.getTurnDiff(
                st.currentAppName,
                ai2.snapshotId,
                "index.html",
              );

              // 回滚到轮 2 开始前快照（标记不满意 + 带该回合请求摘要）：
              // 轮 2 快照 = 轮 1 结束态（v1），回滚后 index.html 应回 v1
              const rb = await store.rollbackTurn(st.currentAppName, ai2.snapshotId, {
                sentiment: "dissatisfied",
                requestText: "把 v1 改成 v2",
              });
              const after = await readAppFile(fsFake, st.currentAppName, "index.html");

              // 回滚后的下一回合：提示词带「不满意」回滚通知（含请求摘要）；
              // 通知一次性消费，再下一回合不再出现
              await store.send("重新设计一下");
              const prompt3 = agentPrompts[2] || "";
              const persisted3 =
                (await fakeStore.getItem(
                  `chat:${st.currentAppName}:${st.currentSessionId}`,
                )) || [];
              const ai3 = [...persisted3]
                .reverse()
                .find(
                  (m) =>
                    m.role === "assistant" &&
                    Array.isArray(m.changes) &&
                    m.id > ai2.id,
                );
              const idx3 = ai3?.changes?.find((c) => c.path === "index.html");
              await store.send("再看看");
              const prompt4 = agentPrompts[3] || "";

              const checks = {
                turn1Changes:
                  !!idx1 && idx1.op === "write" && idx1.dels === 0 && idx1.adds > 0,
                // 宿主 createAppDir 预写的 app.json 不经 onFileWrite，不应计入变更
                hostSeededNotTracked: !appJsonChg,
                turn1Snapshot: typeof ai1?.snapshotId === "string" && ai1.snapshotId.length > 0,
                autoBackupMarked: !!autoBk1 && autoBk1.id === ai1.snapshotId,
                turn2Edit: idx2?.op === "edit" && idx2.adds === 1 && idx2.dels === 1,
                diffHunks:
                  !diffRes.same &&
                  diffRes.hunks.some((h) => h.type === "add") &&
                  diffRes.hunks.some((h) => h.type === "del"),
                rollbackRestored: rb.restored === true && after === "<html>v1</html>",
                notifyInjected:
                  prompt3.includes("回滚通知") &&
                  prompt3.includes("不满意") &&
                  prompt3.includes("把 v1 改成 v2"),
                notifyConsumed: !prompt4.includes("回滚通知"),
                // 冻结 diff = 该回合净变化（首改前 v1 → 末改后 v1b），且
                // 两次写的中间态 v1a 不出现
                turn3Frozen:
                  Array.isArray(idx3?.hunks) &&
                  idx3.hunks.some(
                    (h) => h.type === "add" && h.text === "<html>v1b</html>",
                  ) &&
                  idx3.hunks.some(
                    (h) => h.type === "del" && h.text === "<html>v1</html>",
                  ) &&
                  !idx3.hunks.some((h) => h.text.includes("v1a")),
                stateIdle: st.sending === false && st.autoErrors.length === 0,
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: {
                  checks,
                  changes1: ai1?.changes,
                  changes2: ai2?.changes,
                },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>

              };
              const aiFake = {
                getApiKeys: () => [
                  { id: "k1", provider: "openai", maskedKey: "sk-***" },
                ],
                getAssistant: () => ({ providerName: "Fake" }),
                onApiKeysChange: () => {},
              };
              const store = createBuilderStore({
                fs: fsFake,
                mazmotStore,
                selfStore: fakeStore,
                load: async (path) =>
                  String(path).includes("/mz/ai/chain/main.js") ? fakeChain : aiFake,
              });
              await store.init({});

              // 草稿态发送首条消息：项目应立即建立（不等回合结束）
              const sendP = store.send("做个番茄钟应用");
              let appName = "";
              for (let i = 0; i < 200 && !appName; i++) {
                await new Promise((r) => setTimeout(r, 20));
                appName = store.state.currentAppName;
              }

              const reg = (await fakeStore.getItem("apps-registry")) || [];
              const regHit = reg.find((a) => a.name === appName);
              const call1 = agentCalls[0] || { systemPrompt: "", tools: [] };
              const midChecks = {
                projectCreated: /^app-/.test(appName), // 中文取不出 slug，时间戳兜底
                displayFromText: store.state.currentAppDisplay === "做个番茄钟应用",
                registryWithSession:
                  !!regHit && regHit.sessions?.length === 1 && regHit.sessions[0].id === sid,
                mazmotRegistered: ((await mazmotStore.getItem("apps")) || []).some(
                  (a) => a.name === appName,
                ),
                freshPrompt: call1.systemPrompt.includes("空项目"),
                createAppFiltered: !call1.tools.includes("create_app"),
                maxStepsDefault: call1.maxSteps === 200, // 单轮步数默认 200
                viewFollowsProject: store.state.messages.length > 0, // 用户消息已进新会话视图
              };

              // 中断：项目与会话保留（这正是本次要修的场景）
              store.stop();
              await sendP;
              const persisted =
                (await fakeStore.getItem(`chat:${appName}:${sid}`)) || [];
              const card = persisted.find((m) => m.role === "app");
              const draftChat = await fakeStore.getItem("chat:draft");
              const draftThread = await fakeStore.getItem("thread:draft");
              const stopChecks = {
                projectKept: store.state.currentAppName === appName,
                cardPushed: !!card,
                draftChatGone: draftChat === null || draftChat?.length === 0,
                draftThreadGone: draftThread === null || draftThread?.length === 0,
              };

              // 同会话继续第二回合：fresh 标记已清、agent 重建为常规提示词、
              // 会话不重复。先往项目里写一份 AGENTS.md：第二回合的提示词应
              // 自动注入这份项目规则（不依赖模型自觉去读）
              await seedVirtualFiles(root, {
                [`${appName}/client/AGENTS.md`]:
                  "# 项目规范\n- 本项目禁止使用 localStorage",
              });
              const nAgents = agentCalls.length;
              // 调整单轮步数上限：下回合重建的 Agent 应带上新值
              store.setMaxSteps(400);
              await store.send("继续");
              const reg2 = (await fakeStore.getItem("apps-registry")) || [];
              const hit2 = reg2.find((a) => a.name === appName);
              const call2 = agentCalls[agentCalls.length - 1] || {
                systemPrompt: "",
                tools: [],
              };
              const contChecks = {
                sameSession: store.state.currentSessionId === sid,
                sessionNotDuplicated: hit2?.sessions?.length === 1,
                agentRebuilt: agentCalls.length === nAgents + 1,
                turn2NormalPrompt:
                  !call2.systemPrompt.includes("空项目") &&
                  call2.systemPrompt.includes("已存在的应用"),
                turn2HasCreateApp: call2.tools.includes("create_app"),
                turn2MaxStepsApplied: call2.maxSteps === 400, // setMaxSteps 下回合生效
                turn2RulesAutoLoaded:
                  call2.systemPrompt.includes("已自动加载，必须遵守") &&
                  call2.systemPrompt.includes("禁止使用 localStorage"),
                turn1NoRules: !call1.systemPrompt.includes("已自动加载"),
                idleAfterTurn2: store.state.sending === false,
              };
              const checks = { ...midChecks, ...stopChecks, ...contChecks };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, appName, agentCalls: agentCalls.length },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>

      <template>
        <script type="module">
          import {
            createAppDir,
            writeAppFile,

            publishAppToHome,
            bumpPatchVersion,
            createAppBackup,
            listAppBackups,
          } from "../lib/builder.js";
          import {

          {

              // 版本号纯函数：正常进位 / 缺失非法回退
              const bumpChecks = {
                patch: bumpPatchVersion("0.1.0") === "0.1.1",
                carry: bumpPatchVersion("1.2.9") === "1.2.10",
                fallback: bumpPatchVersion("") === "0.1.1" && bumpPatchVersion("abc") === "0.1.1",
              };

              await createAppDir(fsFake, { name: "Pub App", displayName: "发布演示" });
              await writeAppFile(fsFake, "pub-app", "index.html", "<html>v1</html>");

              // 首次发布：版本用 app.json 现值 0.1.0；产生两条记录——
              // 源登记（ai-builder，首页隐藏）+ 发布副本（普通虚拟应用，首页可见）
              const r1 = await publishAppToHome(fsFake, mazmotStore, "pub-app");
              const readRecs = async () => (await mazmotStore.getItem("apps")) || [];
              const recs1 = await readRecs();
              const src1 = recs1.find((a) => a.mazmot?.source === "ai-builder");
              const home1 = recs1.find(
                (a) => a.namespace === "mazmot-apps" && a.name === r1.publishName,
              );
              // 副本文件落位：mazmot-apps/<发布名>/client/
              const pubRoot = await fsFake.init("mazmot-apps");
              const destJson1 = JSON.parse(
                await (await pubRoot.get("pub-app/client/app.json")).text(),
              );
              const destIndex1 = await (
                await pubRoot.get("pub-app/client/index.html")
              ).text();

              // 内容未变的重复发布：幂等（不 bump、指纹表不增）。
              // 注意 getItem 返回存储内对象的活引用，立即把计数快照成数值
              const r2 = await publishAppToHome(fsFake, mazmotStore, "pub-app");
              const versionCountAfterRepublish = Object.keys(
                src1?.mazmot?.publishedVersions || {},
              ).length;

              // 内容变化后再发布：patch +1 写回源 app.json，副本全量重拷
              // （上一版残留文件被清空、副本 app.json 带新版本）
              const stale = await pubRoot.get("pub-app/client/stale.txt", {
                create: "file",
              });
              await stale.write("leftover");
              await writeAppFile(fsFake, "pub-app", "index.html", "<html>v2</html>");
              const r3 = await publishAppToHome(fsFake, mazmotStore, "pub-app");
              const recs3 = await readRecs();
              const src3 = recs3.find((a) => a.mazmot?.source === "ai-builder");
              const srcJson3 = JSON.parse(
                await readAppFile(fsFake, "pub-app", "app.json"),
              );
              const destJson3 = JSON.parse(
                await (await pubRoot.get("pub-app/client/app.json")).text(),
              );
              const destIndex3 = await (
                await pubRoot.get("pub-app/client/index.html")
              ).text();
              let staleLeft = false;
              try {
                staleLeft = !!(await pubRoot.get("pub-app/client/stale.txt"));
              } catch {
                staleLeft = false;
              }

              // 发布后立刻打的备份按内容指纹挂上版本号（备份 id 尾部 = hash8）
              const backup = await createAppBackup(fsFake, "pub-app");
              const backups = await listAppBackups(fsFake, "pub-app");
              const hitBackup = backups.find((b) => b.id === backup.id);

              const checks = {
                ...bumpChecks,
                firstPublishVersion: r1.version === "0.1.0" && r1.bumped === true,
                firstPublishRecord:
                  src1?.mazmot?.published === true &&
                  src1?.mazmot?.publishedVersion === "0.1.0" &&
                  src1?.mazmot?.publishedVersions?.[r1.hash] === "0.1.0" &&
                  src1?.mazmot?.publishedName === "pub-app",
                homeRecordVisible:
                  home1?.source === "virtual" &&
                  home1?.dirName === "mazmot-apps/pub-app" &&
                  home1?.mazmot?.source === "conjure-publish" &&
                  home1?.mazmot?.project === "pub-app" &&
                  home1?.mazmot?.source !== "ai-builder",
                copyFiles:
                  destJson1.version === "0.1.0" &&
                  destIndex1 === "<html>v1</html>",
                republishIdempotent:
                  r2.bumped === false && r2.version === "0.1.0" && r2.hash === r1.hash,
                republishNoExtraVersions: versionCountAfterRepublish === 1,
                changedPublishBumps:
                  r3.bumped === true && r3.version === "0.1.1",
                bumpWrittenBack: srcJson3.version === "0.1.1",
                copyRefreshed:
                  destJson3.version === "0.1.1" &&
                  destIndex3 === "<html>v2</html>" &&
                  !staleLeft,
                twoPublishedVersions:
                  Object.keys(src3?.mazmot?.publishedVersions || {}).length === 2 &&
                  src3?.mazmot?.publishedVersion === "0.1.1" &&
                  src3?.mazmot?.publishedHash === r3.hash,
                backupCarriesVersion:
                  !!hitBackup &&
                  hitBackup.id.endsWith(`-${r3.hash}`) &&
                  src3?.mazmot?.publishedVersions?.[hitBackup.id.slice(-8)] === "0.1.1",
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, r1, r2, r3, backupId: backup.id },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>

    <sb-test name="__app.json 安装清单：初始生成 / 增删 bump / 排除规则">
      <template>
        <script type="module">
          import {
            createAppDir,
            writeAppFile,
            syncAppManifest,
            readAppFile,
          } from "../lib/builder.js";
          import { createVirtualFs } from "../lib/test-space/virtual-space.js";
          {
            try {
              const mfFs = createVirtualFs();
              await createAppDir(mfFs, {
                name: "mf-app",
                displayName: "清单应用",
                description: "测试描述",
                icon: "🧪",
              });
              const raw1 = await readAppFile(mfFs, "mf-app", "__app.json");
              const mf1 = JSON.parse(raw1);
              const app1 = JSON.parse(await readAppFile(mfFs, "mf-app", "app.json"));
              const metaOk =
                mf1.name === "清单应用" &&
                mf1.icon === "🧪" &&
                mf1.desc === "测试描述";
              const firstFilesOk =
                mf1.files[0] === "app.json" &&
                mf1.files.includes("AGENTS.md") &&
                mf1.files.includes("CONTEXT.md") &&
                !mf1.files.includes("__app.json");
              const firstNoBump = app1.version === "0.1.0"; // 初始生成不 bump

              // 新增两个文件 → 追加进清单 + version bump
              await writeAppFile(mfFs, "mf-app", "pages/detail.html", "<template page></template>");
              await writeAppFile(mfFs, "mf-app", "lib/util.js", "export const x = 1;");
              const r2 = await syncAppManifest(mfFs, "mf-app");
              const mf2 = JSON.parse(await readAppFile(mfFs, "mf-app", "__app.json"));
              const app2 = JSON.parse(await readAppFile(mfFs, "mf-app", "app.json"));
              const addOk =
                r2.added.length === 2 &&
                mf2.files.includes("pages/detail.html") &&
                mf2.files.includes("lib/util.js");
              const bump1 = r2.version === "0.1.1" && app2.version === "0.1.1";

              // 纯内容修改 → 清单不变、不 bump
              await writeAppFile(mfFs, "mf-app", "lib/util.js", "export const x = 2;");
              const r3 = await syncAppManifest(mfFs, "mf-app");
              const app3 = JSON.parse(await readAppFile(mfFs, "mf-app", "app.json"));
              const contentOnlyOk = r3.changed === false && app3.version === "0.1.1";

              // 排除规则：dotfiles / node_modules / test / *.sb.html 不进清单
              await writeAppFile(mfFs, "mf-app", "node_modules/x.js", "x");
              await writeAppFile(mfFs, "mf-app", "test/x.sb.html", "x");
              await writeAppFile(mfFs, "mf-app", ".hidden.js", "x");
              const r4 = await syncAppManifest(mfFs, "mf-app");
              const mf4 = JSON.parse(await readAppFile(mfFs, "mf-app", "__app.json"));
              const excludeOk =
                !mf4.files.includes("node_modules/x.js") &&
                !mf4.files.includes("test/x.sb.html") &&
                !mf4.files.includes(".hidden.js") &&
                !r4.added.includes(".hidden.js");

              // 删除文件 → 清单移除 + 再 bump
              const dir = await mfFs.init("ai-apps");
              const appDir = await dir.get("mf-app");
              const clientDir = await appDir.get("client");
              const victim = await clientDir.get("lib/util.js");
              await victim.remove();
              const r5 = await syncAppManifest(mfFs, "mf-app");
              const mf5 = JSON.parse(await readAppFile(mfFs, "mf-app", "__app.json"));
              const app5 = JSON.parse(await readAppFile(mfFs, "mf-app", "app.json"));
              const removeOk =
                r5.removed.includes("lib/util.js") &&
                !mf5.files.includes("lib/util.js") &&
                r5.version === "0.1.2" &&
                app5.version === "0.1.2";

              const checks = {
                metaOk, firstFilesOk, firstNoBump, addOk, bump1, contentOnlyOk, excludeOk, removeOk,
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, files1: mf1.files, files5: mf5.files, r2, r5 },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message, stack: error.stack } };
            }
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="__app.json 清单：还原备份后重新对齐">
      <template>
        <script type="module">
          import {
            createAppDir,
            writeAppFile,
            createAppBackup,
            restoreAppBackup,
            syncAppManifest,
            readAppFile,
          } from "../lib/builder.js";
          import { createVirtualFs } from "../lib/test-space/virtual-space.js";
          {
            try {
              const rbFs = createVirtualFs();
              await createAppDir(rbFs, { name: "rb-app", displayName: "还原应用" });
              await writeAppFile(rbFs, "rb-app", "pages/a.html", "<p>a</p>");
              // 真实流程里清单在回合收尾同步；测试里手动收口
              await syncAppManifest(rbFs, "rb-app");
              // 备份时点：清单含 a.html
              const snap = JSON.parse(await readAppFile(rbFs, "rb-app", "__app.json"));
              const snapHasA = snap.files.includes("pages/a.html");
              const bk = await createAppBackup(rbFs, "rb-app");
              // 备份后再加一个文件（清单也跟进）
              await writeAppFile(rbFs, "rb-app", "pages/b.html", "<p>b</p>");
              await syncAppManifest(rbFs, "rb-app");
              const mid = JSON.parse(await readAppFile(rbFs, "rb-app", "__app.json"));
              const midHasB = mid.files.includes("pages/b.html");
              // 还原到备份时点：b.html 消失，清单重新对齐（不含 b）
              const res = await restoreAppBackup(rbFs, "rb-app", bk.id);
              const after = JSON.parse(await readAppFile(rbFs, "rb-app", "__app.json"));
              const appAfter = JSON.parse(await readAppFile(rbFs, "rb-app", "app.json"));
              const checks = {
                snapHasA,
                midHasB,
                restored: res.restored === true,
                afterNoB: !after.files.includes("pages/b.html"),
                afterHasA: after.files.includes("pages/a.html"),
                // 新增 b +1 → 0.1.2；还原删 b 再 +1 → 0.1.3
                versionBumped: appAfter.version === "0.1.3",
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, snapFiles: snap.files, afterFiles: after.files, version: appAfter.version },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message, stack: error.stack } };
            }
          }
        </script>
      </template>
    </sb-test>
    <sb-test name="对话快照目录化：index + 每会话文件 / 孤儿清理 / onlySid 增量 / 旧格式兼容">
      <template>
        <script type="module">
          import {
            saveProjectChats,
            loadProjectChats,
          } from "../lib/builder.js";
          import { createVirtualFs } from "../lib/test-space/virtual-space.js";
          {
            try {
              const fs = createVirtualFs();
              const root = await fs.init("chat-root");
              const mk = (id, title) => ({ id, title, createdAt: 1, updatedAt: 2, duration: 0 });
              const data = {
                version: 1,
                app: { name: "snap-app", displayName: "快照应用", icon: "🗂" },
                sessionOrder: null,
                sessions: [mk("s1", "会话一"), mk("s2", "会话二")],
                messages: {
                  s1: [{ id: 1, role: "user", content: "你好" }],
                  s2: [{ id: 2, role: "user", content: "第二条" }],
                },
                threads: { s1: [{ role: "user", content: "你好" }], s2: [] },
                savedAt: 123,
              };
              // 全量写：index + 每会话文件
              await saveProjectChats(root, data);
              const dir = await root.get("conjure-chats");
              const files = [];
              for await (const k of dir.keys()) files.push(k);
              files.sort();
              const layoutOk =
                files.join(",") === "index.json,s1.json,s2.json";

              // 聚合读回：结构与旧单文件同形
              const back = await loadProjectChats(root);
              const readOk =
                back.sessions.length === 2 &&
                back.messages.s1?.[0]?.content === "你好" &&
                back.threads.s2?.length === 0 &&
                back.app?.displayName === "快照应用";

              // onlySid 增量：只重写 s1，s2 文件内容保持；且不清理其他会话
              data.messages.s1 = [{ id: 3, role: "user", content: "改写后" }];
              await saveProjectChats(root, { ...data, onlySid: "s1" });
              const mid = await loadProjectChats(root);
              const onlyOk =
                mid.messages.s1?.[0]?.content === "改写后" &&
                mid.messages.s2?.[0]?.content === "第二条";

              // 全量写但会话列表只剩 s1：s2.json 孤儿被清理
              data.sessions = [mk("s1", "会话一")];
              delete data.messages.s2;
              delete data.threads.s2;
              await saveProjectChats(root, data);
              const files2 = [];
              for await (const k of dir.keys()) files2.push(k);
              files2.sort();
              const orphanOk = files2.join(",") === "index.json,s1.json";
              const after = await loadProjectChats(root);
              const afterOk = after.sessions.length === 1;

              // 旧格式兼容：无 index.json 时回退读 conjure-chats.json
              const root2 = await fs.init("chat-root-legacy");
              const legacy = await root2.get("conjure-chats.json", { create: "file" });
              await legacy.write(JSON.stringify({
                version: 1,
                sessions: [mk("old1", "旧会话")],
                messages: { old1: [{ id: 9, role: "user", content: "旧数据" }] },
                threads: {},
              }));
              const legacyBack = await loadProjectChats(root2);
              const legacyOk =
                legacyBack.sessions[0].id === "old1" &&
                legacyBack.messages.old1?.[0]?.content === "旧数据";

              const checks = {
                layoutOk, readOk, onlyOk, orphanOk, afterOk, legacyOk,
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, files, files2, back },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message, stack: error.stack } };
            }
          }
        </script>
      </template>
    </sb-test>
