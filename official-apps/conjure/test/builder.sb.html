    <sb-test name="truncateThread 按回合截断 wire 记忆">
      <template>
        <script type="module">
          import { truncateThread, tailThread } from "../lib/builder.js";
          {
            const U = (c) => ({ role: "user", content: c });
            const A = (c, calls) => ({
              role: "assistant",
              content: c,
              ...(calls ? { tool_calls: calls } : {}),
            });
            const T = (id) => ({ role: "tool", tool_call_id: id, content: "r" });
            const call = (id) => [{ id, type: "function", function: { name: "x", arguments: "{}" } }];
            // 回合1：user→A(带call)→tool→A(闭合)；回合2：user→A(闭合)；回合3：user→A(带call，未闭合)
            const thread = [
              U("q1"), A("t1", call("c1")), T("c1"), A("done1"),
              U("q2"), A("done2"),
              U("q3"), A("t3", call("c3")),
            ];
            const checks = {
              // fork 在回合2末：保留回合1+2（回合2闭合）
              two: JSON.stringify(truncateThread(thread, 2)) === JSON.stringify([thread[0], thread[1], thread[2], thread[3], thread[4], thread[5]]),
              // fork 在回合3（未闭合）：悬空 tool_calls，回合3 整段丢弃，仍保留前两回合
              openTurn: JSON.stringify(truncateThread(thread, 3)) === JSON.stringify([thread[0], thread[1], thread[2], thread[3], thread[4], thread[5]]),
              // 截断到 0 回合
              zero: truncateThread(thread, 0).length === 0,
              // 空记忆
              empty: JSON.stringify(truncateThread([], 2)) === "[]",
              // 防御性：非 user 开头的记忆开头散段被跳过
              orphan: JSON.stringify(truncateThread([{ role: "assistant", content: "hi" }, U("q"), A("a")], 1)) === JSON.stringify([U("q"), A("a")]),
            };
            const complete = [thread[0], thread[1], thread[2], thread[3], thread[4], thread[5]];
            const tailChecks = {
              // 末尾 1 个完整回合（q3 未闭合被丢弃后只剩 q2 回合）
              tail1: JSON.stringify(tailThread(thread, 1)) === JSON.stringify([thread[4], thread[5]]),
              tail2: JSON.stringify(tailThread(thread, 2)) === JSON.stringify(complete),
              tail0: tailThread(thread, 0).length === 0,
            };
            return {
              assert: Object.values(checks).every(Boolean) && Object.values(tailChecks).every(Boolean),
              content: { checks, tailChecks },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="write_file 跳过 create_app 时自动初始化">
      <template>
        <script type="module">
          import { createTools } from "../lib/tools/index.js";
          import { readAppFile } from "../lib/builder.js";
          {
            try {
              // 内存 fake fs：多级路径 get，文件内容存 Map；
              // 无 create 读取缺失文件返回 null（模拟真实 Core 行为）
              const fileTree = new Map();
              const makeDir = (prefix) => ({
                kind: "dir",
                async get(name, opts = {}) {
                  const segs = String(name).split("/").filter(Boolean);
                  for (let i = 0; i < segs.length; i++) {
                    prefix = prefix ? `${prefix}/${segs[i]}` : segs[i];
                    if (i < segs.length - 1) continue; // 中间目录隐式存在
                    if (!fileTree.has(prefix)) {
                      if (!opts.create) return null;
                      fileTree.set(prefix, "");
                    }
                    return {
                      kind: "file",
                      path: prefix,
                      text: async () => fileTree.get(prefix),
                      write: async (c) => fileTree.set(prefix, c),
                    };
                  }
                  return makeDir(prefix);
                },
              });
              const fsFake = { init: async () => makeDir("") };

              const seen = [];
              const tools = createTools({
                tool: (fn, cfg) => ({ fn, cfg }),
                fs: fsFake,
                onAppCreated: (info) => seen.push(info),
              });
              // 模型跳过 create_app，直接 write_file
              await tools.writeFile.fn({
                appName: "demo-app",
                path: "index.html",
                content: "<!doctype html>",
              });
              const appJson = await readAppFile(fsFake, "demo-app", "app.json");
              const meta = JSON.parse(appJson || "{}");
              // 已初始化后再次写入：不应重复触发 onAppCreated
              await tools.writeFile.fn({
                appName: "demo-app",
                path: "pages/home.html",
                content: "<template page></template>",
              });
              const checks = {
                appJsonWritten: !!appJson && meta.name === "demo-app",
                fired: seen.length === 1 && seen[0].appName === "demo-app",
                onceOnly: seen.length === 1,
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, meta, fired: seen },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="备份打包 / 列表 / 删除（fake fs）">
      <template>
        <script type="module">
          import {
            createAppDir,
            writeAppFile,
            createAppBackup,
            listAppBackups,
            deleteAppBackup,
            renameAppBackup,
            setBackupNote,
            restoreAppBackup,
          } from "../lib/builder.js";
          {
            try {
              // 内存 fake fs：目录树存 Map（父 → 子名集合），文件内容存 Map；
              // 缺失读取返回 null（模拟真实 Core），create: "file" 只作用于最后一段
              const fileTree = new Map(); // dir path -> Set(child name)
              const contents = new Map(); // file path -> text
              const ensureDir = (p) => {
                if (!fileTree.has(p)) fileTree.set(p, new Set());
              };
              const makeFile = (p) => ({
                kind: "file",
                path: p,
                text: async () => contents.get(p),
                write: async (c) => contents.set(p, c),
              });
              const makeDir = (prefix) => ({
                kind: "dir",
                path: prefix,
                async get(name, opts = {}) {
                  const segs = String(name).split("/").filter(Boolean);
                  let cur = prefix;
                  ensureDir(cur);
                  for (let i = 0; i < segs.length; i++) {
                    const last = i === segs.length - 1;
                    const next = cur ? `${cur}/${segs[i]}` : segs[i];
                    const exists = fileTree.has(next) || contents.has(next);
                    if (!exists) {
                      if (last && opts.create === "file") {
                        contents.set(next, "");
                        fileTree.get(cur).add(segs[i]);
                        return makeFile(next);
                      }
                      if (!opts.create) return null;
                      ensureDir(next);
                    }
                    if (!last || !contents.has(next)) {
                      fileTree.get(cur).add(segs[i]);
                    }
                    cur = next;
                  }
                  if (contents.has(cur)) return makeFile(cur);
                  return makeDir(cur);
                },
                async *keys() {
                  for (const name of fileTree.get(prefix) || []) yield name;
                },
                async remove() {
                  for (const k of [...fileTree.keys()]) {
                    if (k === prefix || k.startsWith(`${prefix}/`)) fileTree.delete(k);
                  }
                  for (const k of [...contents.keys()]) {
                    if (k.startsWith(`${prefix}/`)) contents.delete(k);
                  }
                },
              });
              const fsFake = { init: async () => makeDir("") };

              await createAppDir(fsFake, { name: "demo", displayName: "Demo" });
              await writeAppFile(fsFake, "demo", "index.html", "<html></html>");
              await writeAppFile(
                fsFake,
                "demo",
                "pages/home.html",
                "<template page></template>",
              );
              // client/ 内混入 node_modules：打包时应被忽略
              await writeAppFile(fsFake, "demo", "node_modules/pkg/x.js", "junk");

              const res = await createAppBackup(fsFake, "demo");
              const list = await listAppBackups(fsFake, "demo");
              const restored = contents.get(`demo/backup/${res.id}/pages/home.html`);

              // 内容无变化再次备份：hash 相同 → 跳过，不产生重复备份
              const res2 = await createAppBackup(fsFake, "demo");
              const list2 = await listAppBackups(fsFake, "demo");
              // 内容变化后备份：hash 不同 → 新备份
              await writeAppFile(fsFake, "demo", "index.html", "<html>v2</html>");
              const res3 = await createAppBackup(fsFake, "demo");
              const list3 = await listAppBackups(fsFake, "demo");

              // 更名：label 写入备份目录 __meta.json，目录名不变
              await renameAppBackup(fsFake, "demo", res3.id, "稳定版");
              // 备注：写入同一 __meta.json（保留 label），空串清除
              await setBackupNote(fsFake, "demo", res3.id, "修复签到后的稳定版");
              const list4 = await listAppBackups(fsFake, "demo");
              const renamed = list4.find((b) => b.id === res3.id);
              // 去重按目录名 hash 命中，更名/备注不影响
              await writeAppFile(fsFake, "demo", "index.html", "<html></html>");
              const res5 = await createAppBackup(fsFake, "demo");
              // 清除备注：note 变空，label 保留
              await setBackupNote(fsFake, "demo", res3.id, "");
              const list5 = await listAppBackups(fsFake, "demo");
              const cleared = list5.find((b) => b.id === res3.id);

              await deleteAppBackup(fsFake, "demo", res.id);
              const list6 = await listAppBackups(fsFake, "demo");

              let idRejected = false;
              try {
                await deleteAppBackup(fsFake, "demo", "../evil");
              } catch {
                idRejected = true;
              }

              const checks = {
                backupId: /^backup-\d{8}-\d{6}-[0-9a-f]{8}$/.test(res.id),
                packed: res.files === 3 && res.bytes > 0,
                listed: list.length === 1 && list[0].id === res.id,
                noNodeModules: ![...contents.keys()].some(
                  (k) => k.startsWith("demo/backup/") && k.includes("node_modules"),
                ),
                contentCopied: restored === "<template page></template>",
                dedupeSkipped: res2.skipped && res2.id === res.id,
                stillOne: list2.length === 1,
                changedNewBackup: !res3.skipped && res3.id !== res.id,
                twoBackups: list3.length === 2,
                newestFirst: list3[0].id > list3[1].id,
                renamed: renamed && renamed.label === "稳定版",
                noted: renamed && renamed.note === "修复签到后的稳定版",
                noteCleared:
                  cleared &&
                  cleared.note === "" &&
                  cleared.label === "稳定版",
                dedupeAfterRename: res5.skipped && res5.id === res.id,
                deleted: list6.length === 1 && list6[0].id === res3.id,
                idRejected,
              };              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, res, list3, list6 },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="unzipText 解析 zip + stripCommonRoot 剥根目录">
      <template>
        <script type="module">
          import { unzipText } from "../lib/skill-sync.js";
          {
            try {
              // 构造一个最小 zip：单根目录 + 两个存储（未压缩）条目
              const enc = new TextEncoder();
              const files = [
                { name: "my-skill/", dir: true },
                { name: "my-skill/SKILL.md", text: "---\nname: my-skill\n---\nhello" },
                { name: "my-skill/references/a.md", text: "ref-a" },
              ];
              const chunks = [];
              const central = [];
              let offset = 0;
              const u16 = (v) => [v & 255, (v >> 8) & 255];
              const u32 = (v) => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >> 24) & 255];
              for (const f of files) {
                const nameBytes = enc.encode(f.name);
                const data = f.dir ? new Uint8Array(0) : enc.encode(f.text);
                const local = [
                  ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
                  ...u16(0), ...u16(0), ...u32(data.length), ...u32(data.length), ...u32(data.length),
                  ...u16(nameBytes.length), ...u16(0),
                  ...nameBytes, ...data,
                ];
                chunks.push(local);
                central.push({
                  name: nameBytes, size: data.length, offset,
                });
                offset += local.length;
              }
              const cdStart = offset;
              for (const c of central) {
                chunks.push([
                  ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
                  ...u16(0), ...u16(0), ...u32(0), ...u32(c.size), ...u32(c.size),
                  ...u16(c.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
                  ...u32(0), ...u32(c.offset), ...c.name,
                ]);
                offset += 46 + c.name.length;
              }
              chunks.push([
                ...u32(0x06054b50), ...u16(0), ...u16(0),
                ...u16(central.length), ...u16(central.length),
                ...u32(offset - cdStart), ...u32(cdStart), ...u16(0),
              ]);
              const buf = new Uint8Array(chunks.flat());
              const entries = await unzipText(buf.buffer);

              const stripped = entries
                .filter((e) => !e.dir)
                .map((e) => e.name.replace(/^my-skill\//, ""));

    <sb-test name="备份还原：覆盖写回 / 无变动检测（fake fs）">
      <template>
        <script type="module">
          import {
            createAppDir,
            writeAppFile,
            readAppFile,
            createAppBackup,
            restoreAppBackup,
            listAppBackups,
          } from "../lib/builder.js";
          {
            try {
              // 与备份测试相同的内存 fake fs
              const fileTree = new Map();
              const contents = new Map();
              const ensureDir = (p) => {
                if (!fileTree.has(p)) fileTree.set(p, new Set());
              };
              const makeFile = (p) => ({
                kind: "file",
                path: p,
                text: async () => contents.get(p),
                write: async (c) => contents.set(p, c),
              });
              const makeDir = (prefix) => ({
                kind: "dir",
                path: prefix,
                async get(name, opts = {}) {
                  const segs = String(name).split("/").filter(Boolean);
                  let cur = prefix;
                  ensureDir(cur);
                  for (let i = 0; i < segs.length; i++) {
                    const last = i === segs.length - 1;
                    const next = cur ? `${cur}/${segs[i]}` : segs[i];
                    const exists = fileTree.has(next) || contents.has(next);
                    if (!exists) {
                      if (last && opts.create === "file") {
                        contents.set(next, "");
                        fileTree.get(cur).add(segs[i]);
                        return makeFile(next);
                      }
                      if (!opts.create) return null;
                      ensureDir(next);
                    }
                    if (!last || !contents.has(next)) {
                      fileTree.get(cur).add(segs[i]);
                    }
                    cur = next;
                  }
                  if (contents.has(cur)) return makeFile(cur);
                  return makeDir(cur);
                },
                async *keys() {
                  for (const name of fileTree.get(prefix) || []) yield name;
                },
                async remove() {
                  for (const k of [...fileTree.keys()]) {
                    if (k === prefix || k.startsWith(`${prefix}/`)) fileTree.delete(k);
                  }
                  for (const k of [...contents.keys()]) {
                    if (k.startsWith(`${prefix}/`)) contents.delete(k);
                  }
                },
              });
              const fsFake = { init: async () => makeDir("") };

              await createAppDir(fsFake, { name: "demo", displayName: "Demo" });
              await writeAppFile(fsFake, "demo", "index.html", "<html>v1</html>");
              await writeAppFile(
                fsFake,
                "demo",
                "pages/home.html",
                "<template page>v1</template>",
              );
              const backup = await createAppBackup(fsFake, "demo");

              // 之后改动：新增文件 + 修改文件
              await writeAppFile(fsFake, "demo", "index.html", "<html>v2</html>");
              await writeAppFile(fsFake, "demo", "pages/extra.html", "extra");

              const restored = await restoreAppBackup(fsFake, "demo", backup.id);
              const v1 = await readAppFile(fsFake, "demo", "index.html");
              const extraGone = await readAppFile(fsFake, "demo", "pages/extra.html");
              const page = await readAppFile(fsFake, "demo", "pages/home.html");
              // __meta.json 不应被还原进 client/
              const metaLeak = await readAppFile(fsFake, "demo", "__meta.json");

              // 无变动：还原成功后再还原一次应返回 unchanged
              const unchanged = await restoreAppBackup(fsFake, "demo", backup.id);

              // 非法 id
              let idRejected = false;
              try {
                await restoreAppBackup(fsFake, "demo", "../evil");
              } catch {
                idRejected = true;
              }

              const checks = {
                restored: restored.restored && restored.files === 3,
                reverted: v1 === "<html>v1</html>",
                extraRemoved: extraGone === null,
                pageBack: page === "<template page>v1</template>",
                noMetaLeak: metaLeak === null,
                unchangedDetected:
                  unchanged.restored === false &&
                  unchanged.reason === "unchanged",
                backupStillThere: (await listAppBackups(fsFake, "demo")).length === 1,
                idRejected,
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, restored, unchanged },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>
    <sb-test name="会话拖拽排序：reorderSessions 持久化与展示同步">
      <template>
        <script type="module">
          import { createBuilderStore } from "../lib/builder-store.js";
          {
            try {
              // 内存 fake 自存储：registry 初始为一个应用三条会话
              const kv = new Map();
              kv.set("apps-registry", [
                {
                  name: "demo",
                  displayName: "Demo",
                  mode: "vfs",
                  sessions: [
                    { id: "s1", title: "A", updatedAt: 1 },
                    { id: "s2", title: "B", updatedAt: 2 },
                    { id: "s3", title: "C", updatedAt: 3 },
                  ],
                },
              ]);
              const fakeStore = {
                getItem: async (k) => kv.get(k) ?? null,
                setItem: async (k, v) => kv.set(k, v),
                removeItem: async (k) => kv.delete(k),
              };
              const store = createBuilderStore({
                fs: null,
                mazmotStore: null,
                selfStore: fakeStore,
                // /mz/ai 等宿主模块用空实现顶替
                load: async () => ({ getApiKeys: () => [], onApiKeysChange: () => {} }),
              });
              await store.init({});
              await store.selectApp("demo");

              // 默认按 updatedAt 倒序：s3, s2, s1
              const defaultIds = store.state.currentAppSessions.map((s) => s.id);

              // 拖拽：把 s1 移到 s3 前面 → s1, s3, s2
              await store.reorderSessions("s1", "s3");
              const afterIds = store.state.currentAppSessions.map((s) => s.id);
              const persisted = (kv.get("apps-registry")[0].sessionOrder || []).join(",");

              // 新会话（不在 sessionOrder 里）应排最前（按最近更新）
              const reg = kv.get("apps-registry");
              reg[0].sessions.push({ id: "s4", title: "D", updatedAt: 9 });
              await kv.set("apps-registry", reg);
              await store.reloadApps();
              const withNewIds = store.state.currentAppSessions.map((s) => s.id);

              // 非法参数不产生变化
              await store.reorderSessions("s1", "s1");
              await store.reorderSessions("", "s1");
              const sameAfter = store.state.currentAppSessions.map((s) => s.id).join(",");

              const checks = {
                defaultOrder: defaultIds.join(",") === "s3,s2,s1",
                reordered: afterIds.join(",") === "s1,s3,s2",
                persisted: persisted === "s1,s3,s2",
                newSessionFirst: withNewIds[0] === "s4" && withNewIds.slice(1).join(",") === "s1,s3,s2",
                invalidNoop: sameAfter === withNewIds.join(","),
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, defaultIds, afterIds, withNewIds },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>
