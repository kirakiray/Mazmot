<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>tools/index.js createTools ctx 接线测试</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
  </head>
  <body>
    <!-- 纯逻辑测试：createTools 用桩 tool 工厂包装插件定义，
         经 preview 工具的实际 exec 探测 ctx 是否注入完整 -->
    <sb-test name="createTools - preview 工具 ctx 注入 listPreviewWindows / checkPopup / runTests">
      <template>
        <script type="module">
          import { createTools } from "../tools/index.js";
          {
            const UNAVAILABLE = "宿主未注入预览通道";
            // 桩通道：可辨认的返回值，能区分「ctx 已注入且被调用」与「不可用兜底」
            const stubs = {
              listPreviewWindows: async () => [
                { id: "u|s", app: "todo", device: "macOS", online: true, lastSeen: Date.now() },
              ],
              checkPopup: async () => ({ allowed: true }),
              runTests: async () => ({ noTests: true }),
              openPreview: async () => ({ url: "http://x", agentOnline: true }),
              previewDebug: async () => ({ result: "stub", meta: {} }),
            };
            const tools = createTools({
              tool: (exec, meta) => ({ exec, meta }),
              fs: {},
              ...stubs,
            });
            const preview = tools.preview;
            const windowsRes = await preview.exec({ action: "windows" });
            const popupRes = await preview.exec({ action: "check-popup" });
            // files 必传（缺省会拒跑引导），传了才会进 ctx.runTests 桩
            const testsRes = await preview.exec({
              action: "run-tests",
              files: ["test/smoke.test.json"],
            });
            const checks = {
              windows: windowsRes.includes("共 1 个预览窗口"),
              popup: popupRes.includes("弹窗探测通过"),
              tests: testsRes.includes("还没有测试用例"),
              noneUnavailable:
                !windowsRes.includes(UNAVAILABLE) &&
                !popupRes.includes(UNAVAILABLE) &&
                !testsRes.includes(UNAVAILABLE),
            };
            return {
              assert: Object.values(checks).every(Boolean),
              content: {
                checks,
                windowsRes: windowsRes.slice(0, 60),
                popupRes: popupRes.slice(0, 40),
                testsRes: testsRes.slice(0, 40),
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="preview run-tests - files 参数归一与缺省拒跑">
      <template>
        <script type="module">
          import { createTools } from "../tools/index.js";
          {
            // 记录每次 exec 转发给 ctx.runTests 的 files
            const received = [];
            const tools = createTools({
              tool: (exec, meta) => ({ exec, meta }),
              fs: {},
              openPreview: async () => ({ url: "http://x" }),
              previewDebug: async () => ({ result: "stub", meta: {} }),
              runTests: async (files) => {
                received.push(files);
                return { ok: true, summary: "1 通过 / 0 失败", results: [] };
              },
            });
            const preview = tools.preview;

            // 顶层 files（schema 声明的形态，曾因只读 args.files 被丢弃 → 全量跑）
            const topRes = await preview.exec({
              action: "run-tests",
              files: ["test/search-task.test.json"],
            });
            // 嵌套 args.files（操作专属参数对象形态）
            await preview.exec({
              action: "run-tests",
              args: { files: ["test/a.test.json", "test/b.test.json"] },
            });
            // 单个字符串归一成数组
            await preview.exec({ action: "run-tests", files: "test/one.test.json" });
            // 缺省（模型没传 files）：拒跑并引导，绝不全量
            const noneRes = await preview.exec({ action: "run-tests" });
            const emptyRes = await preview.exec({ action: "run-tests", files: [] });

            const checks = {
              topLevel: JSON.stringify(received[0]) === JSON.stringify(["test/search-task.test.json"]),
              nested:
                JSON.stringify(received[1]) ===
                JSON.stringify(["test/a.test.json", "test/b.test.json"]),
              stringNormalized:
                JSON.stringify(received[2]) === JSON.stringify(["test/one.test.json"]),
              noneRejected:
                received.length === 3 &&
                noneRes.includes("files") &&
                noneRes.includes("开发工具"),
              emptyRejected: emptyRes.includes("files"),
              summaryPassed: topRes.includes("1 通过 / 0 失败"),
            };
            return {
              assert: Object.values(checks).every(Boolean),
              content: { checks, received, noneRes: noneRes.slice(0, 80) },
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
