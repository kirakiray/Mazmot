<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>edit_file 工具包测试</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
  </head>
  <body>
    <sb-test name="editAppFile 差量编辑语义（唯一命中 / 多条链式 / 歧义 / replace_all / 新文件）">
      <template>
        <script type="module">
          import {
            createAppDir,
            writeAppFile,
            editAppFile,
            readAppFile,
          } from "../../../builder.js";
          import {
            createVirtualFs,
            seedVirtualFiles,
          } from "../../../test-space/virtual-space.js";
          {
            try {
              const fs = createVirtualFs();
              await createAppDir(fs, { name: "demo", displayName: "Demo" });
              const root = await fs.init("ai-apps");
              await seedVirtualFiles(root, {
                "demo/client/pages/home.html":
                  "line1\nline2 目标\nline3\nline2 目标\nline5",
              });

              // 唯一命中（带上下文消除歧义）+ 未提及内容保留
              const r1 = await editAppFile(fs, "demo", "pages/home.html", [
                {
                  old_string: "line2 目标\nline3",
                  new_string: "line2 改过\nline3",
                },
              ]);
              const t1 = await readAppFile(fs, "demo", "pages/home.html");

              // 多条链式：第二条引用第一条的产物
              const r2 = await editAppFile(fs, "demo", "pages/home.html", [
                { old_string: "line2 改过", new_string: "A" },
                { old_string: "A\nline3", new_string: "B\nline3" },
              ]);

              // 未命中
              let missed = false;
              try {
                await editAppFile(fs, "demo", "pages/home.html", [
                  { old_string: "不存在", new_string: "x" },
                ]);
              } catch (e) {
                missed = e.message.includes("read_file");
              }

              // 歧义：两处 "line2 目标" 剩余一处（第一次编辑改掉了一处）……
              // 重新构造：文件里两处相同片段且未带 replace_all
              await writeAppFile(fs, "demo", "dup.txt", "x\nx\nx");
              let amb = "";
              try {
                await editAppFile(fs, "demo", "dup.txt", [
                  { old_string: "x", new_string: "y" },
                ]);
              } catch (e) {
                amb = e.message;
              }

              // replace_all 全替换
              await editAppFile(fs, "demo", "dup.txt", [
                { old_string: "x", new_string: "y", replace_all: true },
              ]);
              const dup = await readAppFile(fs, "demo", "dup.txt");

              // 新文件引导 write_file
              let noFile = false;
              try {
                await editAppFile(fs, "demo", "no-such.js", [
                  { old_string: "a", new_string: "b" },
                ]);
              } catch (e) {
                noFile = e.message.includes("write_file");
              }

              const checks = {
                applied1: r1.applied === 1 && t1.includes("line2 改过") && t1.includes("line5"),
                prevNext: r1.prevText.includes("line2 目标") && r1.nextText.includes("line2 改过"),
                chained: r2.applied === 2 && (await readAppFile(fs, "demo", "pages/home.html")).includes("B\nline3"),
                missGuided: missed,
                ambiguousCount: amb.includes("3 处") && amb.includes("replace_all"),
                replaceAll: dup === "y\ny\ny",
                newFileGuided: noFile,
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, amb },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="diffLines / diffStat / compactHunks 行级 diff">
      <template>
        <script type="module">
          import {
            diffLines,
            diffStat,
            compactHunks,
          } from "../../../diff.js";
          {
            const a = "a\nb\nc\nd\ne";
            const b = "a\nX\nc\nd\nf\ne";
            const hunks = diffLines(a, b);
            const stat = diffStat(hunks);
            const compact = compactHunks(hunks, 1);
            const same = diffLines("x\ny", "x\ny");
            const empty = diffLines("", "");
            // 降级路径：超长文件不再走 LCS（结果仍是全量增删序列）
            const bigA = "p\n".repeat(3000);
            const bigB = "q\n".repeat(3000);
            const big = diffLines(bigA, bigB);
            const checks = {
              // LCS 对齐：b 删除、X/f 新增，e 仍是公共行（dels=1 而非 2）
              stat: stat.adds === 2 && stat.dels === 1,
              types: hunks.filter((h) => h.type === "del").map((h) => h.text).join("|") === "b",
              addTexts: hunks.filter((h) => h.type === "add").map((h) => h.text).join("|") === "X|f",
              lineNos: hunks.every((h) => h.type === "ctx" || (h.type === "add" ? h.bLn > 0 : h.aLn > 0)),
              orderFirst: hunks[0].type === "ctx" && hunks[0].text === "a",
              // context=1 时相邻变更（X@2、f@5）的上下文恰好覆盖全部中间行：
              // 无折叠；context=0 才出现 gap 折叠
              compactNoGapWhenCovered: compact.every((h) => h.type !== "gap"),
              compactGapsAtCtx0: compactHunks(hunks, 0).some((h) => h.type === "gap"),
              compactNoIsolated: compactHunks(same.map((h) => ({ ...h, type: "ctx" })), 2).length === 0,
              sameAllCtx: same.every((h) => h.type === "ctx") && same.length === 2,
              emptyOk: empty.length === 1 && empty[0].type === "ctx",
              // 降级：3000 行 "p\n" split 出 3001 行（含末尾空行）全删全增
              degrade: big.filter((h) => h.type === "del").length === 3001 && diffStat(big).adds === 3001,
            };
            return {
              assert: Object.values(checks).every(Boolean),
              content: { checks, stat, compactCount: compact.length },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="回合快照与备份分离：snaps/ 不进备份清单 + 遗留 auto 清扫 + prune">
      <template>
        <script type="module">
          import {
            createAppDir,
            writeAppFile,
            createAppBackup,
            listAppBackups,
            listAppSnaps,
            readBackupFiles,
            pruneAppSnaps,
            sweepLegacyAutoBackups,
          } from "../../../builder.js";
          import { createVirtualFs } from "../../../test-space/virtual-space.js";
          {
            try {
              const fs = createVirtualFs();
              await createAppDir(fs, { name: "demo", displayName: "Demo" });
              await writeAppFile(fs, "demo", "index.html", "<html></html>");

              // 回合快照：snap- id，落 snaps/，不进备份管理清单；diff 可读；
              // 内容相同再次快照与既有快照同 id 幂等跳过
              const snap = await createAppBackup(fs, "demo", undefined, {
                snapshot: true,
              });
              const snapDup = await createAppBackup(fs, "demo", undefined, {
                snapshot: true,
              });
              await writeAppFile(fs, "demo", "index.html", "<html>v2</html>");
              const manual = await createAppBackup(fs, "demo");

              const backups = await listAppBackups(fs, "demo");
              const snaps = await listAppSnaps(fs, "demo");
              // 快照含 createAppDir 预写的骨架文档，按路径取 index.html 断言
              const snapFiles = await readBackupFiles(fs, "demo", snap.id);
              const snapHtml = snapFiles.find((f) => f.path === "index.html");

              // 遗留清扫：历史版本混进 backup/ 的纯快照（auto 标记、无名称
              // 备注）被删除——给 manual 挂 auto meta 模拟遗留；被发布流程
              // 复用并标注过的（有 label）保留
              const root = await fs.init("ai-apps");
              const metaFile = await root.get(
                `demo/backup/${manual.id}/__meta.json`,
                { create: "file" },
              );
              await metaFile.write(JSON.stringify({ auto: true }));
              const removed = await sweepLegacyAutoBackups(fs, "demo");
              const afterSweep = await listAppBackups(fs, "demo");

              // 被发布流程复用标注过的 auto 备份（有 label）视为正式备份保留
              await writeAppFile(fs, "demo", "index.html", "<html>pub</html>");
              const pub = await createAppBackup(fs, "demo");
              const pubMeta = await root.get(
                `demo/backup/${pub.id}/__meta.json`,
                { create: "file" },
              );
              await pubMeta.write(JSON.stringify({ auto: true, label: "发布 v0.2.0" }));
              const removed2 = await sweepLegacyAutoBackups(fs, "demo");
              const afterSweep2 = await listAppBackups(fs, "demo");

              // prune：只保留最近 10 份快照（造 12 份不同内容，新的在前）。
              // case 开头的 snap 也在 snaps/ 里——成员断言按全期创建集合比对
              //（同秒创建的 id 只有 hash 尾可分先后，不赌被 prune 留下的是谁）
              const ids = new Set([snap.id]);
              for (let i = 0; i < 12; i++) {
                await writeAppFile(fs, "demo", "index.html", `<html>v${i}</html>`);
                const s = await createAppBackup(fs, "demo", undefined, {
                  snapshot: true,
                });
                ids.add(s.id);
              }
              await pruneAppSnaps(fs, "demo");
              const snapList = await listAppSnaps(fs, "demo");

              const checks = {
                snapIdFormat: snap.id.startsWith("snap-"),
                snapOutOfBackups:
                  !backups.some((b) => b.id === snap.id) &&
                  snaps.some((b) => b.id === snap.id),
                manualInBackups:
                  backups.some((b) => b.id === manual.id) &&
                  !snaps.some((b) => b.id === manual.id),
                snapReadable:
                  snapFiles.length > 1 &&
                  snapHtml?.path === "index.html" &&
                  snapHtml.text === "<html></html>",
                snapDedup: snapDup.skipped === true && snapDup.id === snap.id,
                legacySwept: removed === 1 && afterSweep.length === 0,
                labeledKept:
                  removed2 === 0 &&
                  afterSweep2.length === 1 &&
                  afterSweep2[0].label === "发布 v0.2.0",
                // 同秒创建的快照 id 只有 hash 尾可分先后，断言保留数量与
                // 成员（不赌同秒内的排序）
                prunedTo10: snapList.length === 10,
                keptFromCreated: snapList.every((b) => ids.has(b.id)),
              };
              return {
                assert: Object.values(checks).every(Boolean),
                content: { checks, afterSweep, snapListLen: snapList.length },
              };
            } catch (error) {
              return { assert: false, content: { error: error.message } };
            }
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
