<template component>
  <style>
    :host {

    }
    .form-card {

    .form-review {
      display: flex;

    }
    .form-review-row {
      display: flex;
      gap: 10px;

    }
    .form-review-label {
      flex: none;

    .form-review-value {
      color: var(--md-sys-color-on-surface);

      word-break: break-word;
      user-select: text;
    }
  </style>
  <!-- spec 就绪前不渲染：组件首渲染可能早于 data 默认值合并，
       直接读 spec.title 会抛表达式错误 -->
  <o-if :value="spec">
    <div class="form-card">
    <div class="form-card-title">
      <n-icon icon="mdi:form-select"></n-icon>
      <span>{{spec.title}}</span>
      <o-if :value="spec.status === 'pending'">
        <span class="form-badge form-badge-pending">等待填写</span>
      </o-if>
      <o-if :value="spec.status === 'submitted'">
        <span class="form-badge form-badge-done">已提交 · 只读</span>
      </o-if>
      <o-if :value="spec.status === 'cancelled'">
        <span class="form-badge">已取消</span>
      </o-if>
      <o-if :value="spec.status === 'expired'">
        <span class="form-badge">已过期 · 只读</span>
      </o-if>
    </div>
    <o-if :value="spec.description !== ''">
      <div class="form-card-desc">{{spec.description}}</div>
    </o-if>
    <div class="form-card-body" :html="bodyHtml"></div>
    <o-if :value="spec.status === 'pending'">
      <div class="form-card-actions">
        <button class="form-submit" on:click="submitClick">提交</button>
      </div>
    </o-if>
    </div>
  </o-if>
  <script>
    // show_form 视觉交互工具的表单卡片组件（show-form 包）。
    // data.spec 为表单规范 + 状态：{ title, description, fields[], status, data }。
    // pending 时渲染可编辑控件；submitted / cancelled / expired 只读回填。
    // 提交数据经 form-submit 事件（bubbles + composed）冒泡给宿主页面。
    export default async ({ load }) => {
      return {
        tag: "show-form-card",
        data: {
          // 默认值必须字段齐全：模板表达式在首次渲染就要能求值
          spec: {
            title: "",
            description: "",
            status: "",
            fields: [],
            data: null,
          },
          bodyHtml: "", // 表单主体 HTML（watch specJson 生成，含控件 / 只读清单）
        },
        watch: {
          spec() {
            this.bodyHtml = this.renderFields(this.spec || {});
          },
        },
        proto: {
          applySpecJson(json) {
            try {
              this.spec = JSON.parse(json || "{}");
            } catch {
              this.spec = {};
            }
            this.bodyHtml = this.renderFields(this.spec || {});
          },
          esc(text) {
            return String(text ?? "").replace(/[&<>"']/g, (c) => ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]);
          },
          // pending 生成可编辑控件；其余状态渲染「label：值」只读清单
          renderFields(form) {
            form = form || {};
            const fields = Array.isArray(form.fields) ? form.fields : [];
            const esc = (t) => this.esc(t);
            if (form.status !== "pending") {
              return (
                '<div class="form-review">' +
                fields
                  .map((f) => {
                    let v = form.data ? form.data[f.key] : "";
                    if (f.type === "checkbox") v = v ? "是" : "否";
                    const text =
                      v === undefined || v === null || v === ""
                        ? "（未填写）"
                        : String(v);
                    return (
                      '<div class="form-review-row">' +
                      `<span class="form-review-label">${esc(f.label)}</span>` +
                      `<span class="form-review-value">${esc(text)}</span>` +
                      "</div>"
                    );
                  })
                  .join("") +
                "</div>"
              );
            }
            return fields
              .map((f) => {
                const name = esc(f.key);
                const ph = f.placeholder
                  ? ` placeholder="${esc(f.placeholder)}"`
                  : "";
                const label = `<span class="form-label">${esc(f.label)}${
                  f.required ? '<i class="form-req">*</i>' : ""
                }</span>`;
                if (f.type === "textarea")
                  return `<label class="form-field">${label}<textarea name="${name}" rows="3"${ph}></textarea></label>`;
                if (f.type === "select")
                  return (
                    `<label class="form-field">${label}<select name="${name}">` +
                    (f.options || [])
                      .map(
                        (o) =>
                          `<option value="${esc(o)}">${esc(o)}</option>`,
                      )
                      .join("") +
                    "</select></label>"
                  );
                if (f.type === "radio")
                  return (
                    `<div class="form-field">${label}<div class="form-options">` +
                    (f.options || [])
                      .map(
                        (o) =>
                          `<label class="form-opt"><input type="radio" name="${name}" value="${esc(o)}">${esc(o)}</label>`,
                      )
                      .join("") +
                    "</div></div>"
                  );
                if (f.type === "checkbox")
                  return `<label class="form-field form-opt"><input type="checkbox" name="${name}"><span class="form-label">${esc(f.label)}</span></label>`;
                const type = f.type === "number" ? "number" : "text";
                return `<label class="form-field">${label}<input name="${name}" type="${type}"${ph}></label>`;
              })
              .join("");
          },
          // 「提交」：收集控件值 → required 校验 → form-submit 事件冒泡
          async submitClick() {
            const values = {};
            for (const el of this.shadow.querySelectorAll("[name]")) {
              if (el.type === "checkbox") values[el.name] = el.checked;
              else if (el.type === "radio") {
                if (el.checked) values[el.name] = el.value;
              } else values[el.name] = el.value.trim();
            }
            const missing = (this.spec?.fields || []).filter(
              (f) =>
                f.required &&
                (values[f.key] === undefined ||
                  values[f.key] === "" ||
                  values[f.key] === false),
            );
            if (missing.length) {
              const { default: toast } = await load(
                "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js",
              );
              toast(`请填写：${missing.map((f) => f.label).join("、")}`);
              return;
            }
            this.emit("form-submit", {
              data: values,
              bubbles: true,
              composed: true,
            });
          },
        },
      };
    };
  </script>
</template>
