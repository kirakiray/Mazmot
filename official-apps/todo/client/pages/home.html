<template page>
  <style>
    :host {
      display: block;
      /* 必须是滚动容器：o-router fix-body 给自身 shadow 写死了 overflow:hidden，
         若这里不自己滚动，长列表超出视口的部分会被裁掉且无法滚到 */
      height: 100%;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 28px 16px 56px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { margin: 0; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
    .add-row { display: flex; gap: 8px; align-items: center; }
    .add-row st-input { flex: 1; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--md-sys-color-surface-variant);
    }
    .item .body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .item .text { word-break: break-word; line-height: 1.4; }
    .item .meta {
      font-size: 12px;
      line-height: 1.3;
      color: var(--md-sys-color-on-surface-variant);
    }
    .item.done .text {
      text-decoration: line-through;
      color: var(--md-sys-color-on-surface-variant);
    }
    .empty {
      text-align: center;
      padding: 36px 0;
      color: var(--md-sys-color-on-surface-variant);
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding-top: 12px;
    }
    .count { font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button-group.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/checkbox/checkbox.html"></l-m>

  <div class="wrap">
    <div>
      <h1>✅ 待办清单</h1>
      <p class="sub">数据保存在本机，随时关掉再回来都还在。</p>
    </div>

    <div class="add-row">
      <st-input
        sync:value="draft"
        placeholder="想做点什么？回车即可添加"
        on:change="addTodo"
      ></st-input>
      <st-button on:click="addTodo" attr:disabled="!draft.trim()">添加</st-button>
    </div>

    <st-button-group>
      <st-button attr:variant="view === 'all' ? 'filled' : 'text'" on:click="setView('all')">全部</st-button>
      <st-button attr:variant="view === 'active' ? 'filled' : 'text'" on:click="setView('active')">未完成</st-button>
      <st-button attr:variant="view === 'done' ? 'filled' : 'text'" on:click="setView('done')">已完成</st-button>
    </st-button-group>

    <div class="list">
      <o-fill :value="visibleTodos" fill-key="id">
        <div class="item" class:done="$data.done">
          <st-checkbox attr:checked="$data.done" on:change="$host.toggleTodo($data.id)"></st-checkbox>
          <div class="body">
            <span class="text">{{$data.text}}</span>
            <span class="meta">{{$host.timeMeta($data)}}</span>
          </div>
          <st-icon-button title="删除" on:click="$host.deleteTodo($data.id)">✕</st-icon-button>
        </div>
      </o-fill>
    </div>

    <o-if :value="isListEmpty">
      <div class="empty">{{emptyText}}</div>
    </o-if>

    <div class="footer">
      <span class="count">{{remaining}} 项未完成 · 共 {{todos.length}} 项</span>
      <st-button
        variant="text"
        color="error"
        on:click="clearDone"
        attr:disabled="doneCount === 0"
      >清除已完成</st-button>
    </div>
  </div>

  <script>
    const STORE_ID = "conjure-todo-app";
    const STORE_KEY = "todos";

    export default async ({ load }) => {
      const { getStorage } = await load("/nos/storage/main.js");
      const store = getStorage(STORE_ID);
      window.__todoInitCount = (window.__todoInitCount || 0) + 1;
      console.log("[init] 待办页初始化 #" + window.__todoInitCount, "store=", STORE_ID);

      return {
        data: {
          draft: "",
          view: "all",
          todos: [],
          emptyText: "这里还什么都没有，添加第一件事吧 🎉",
        },

        ready() {
          this.loadTodos();
        },

        proto: {
          // 计算属性必须放在 proto 中（放模块顶层会导致页面模块加载失败）
          get visibleTodos() {
            if (this.view === "done") return this.todos.filter((t) => t.done);
            if (this.view === "active") return this.todos.filter((t) => !t.done);
            return this.todos;
          },

          get remaining() {
            return this.todos.filter((t) => !t.done).length;
          },

          get doneCount() {
            return this.todos.filter((t) => t.done).length;
          },

          get isListEmpty() {
            return this.visibleTodos.length === 0;
          },

          async loadTodos() {
            try {
              const saved = await store.getItem(STORE_KEY);
              if (Array.isArray(saved)) {
                this.todos = saved.map((t) => ({
                  id: String(t.id),
                  text: String(t.text || ""),
                  done: !!t.done,
                  // 旧数据没有时间字段，保留 null（界面显示“时间未知”），不伪造时间
                  createdAt: typeof t.createdAt === "number" ? t.createdAt : null,
                  statusChangedAt:
                    typeof t.statusChangedAt === "number" ? t.statusChangedAt : null,
                }));
              }
              console.log("[storage] 已读取待办，共", this.todos.length, "项");
            } catch (err) {
              console.error("[storage] 读取待办失败", err);
            }
          },

          async persistTodos() {
            try {
              await store.setItem(STORE_KEY, JSON.parse(JSON.stringify(this.todos)));
              console.log("[storage] 已保存待办，共", this.todos.length, "项");
            } catch (err) {
              console.error("[storage] 保存待办失败", err);
            }
          },

          addTodo() {
            const text = (this.draft || "").trim();
            if (!text) return;
            const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            this.todos = [
              { id, text, done: false, createdAt: Date.now(), statusChangedAt: null },
              ...this.todos,
            ];
            this.draft = "";
            console.log("[todo] 新增", id, text);
            this.persistTodos();
          },

          toggleTodo(id) {
            const now = Date.now();
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, done: !t.done, statusChangedAt: now } : t
            );
            const cur = this.todos.find((t) => t.id === id);
            console.log("[todo] 切换完成态", id, "→", cur ? cur.done : "已不存在");
            this.persistTodos();
          },

          // 时间戳格式化：今年内只显示 月-日 时:分，跨年补上年份
          formatTime(ts) {
            if (typeof ts !== "number") return "未知";
            const d = new Date(ts);
            if (Number.isNaN(d.getTime())) return "未知";
            const p = (n) => String(n).padStart(2, "0");
            const md = p(d.getMonth() + 1) + "-" + p(d.getDate());
            const hm = p(d.getHours()) + ":" + p(d.getMinutes());
            const date =
              d.getFullYear() === new Date().getFullYear()
                ? md
                : d.getFullYear() + "-" + md;
            return date + " " + hm;
          },

          // 列表项副标题：创建时间 + （若有）最近一次状态变更时间
          timeMeta(todo) {
            const parts = [
              todo.createdAt
                ? "创建于 " + this.formatTime(todo.createdAt)
                : "创建时间未知",
            ];
            if (todo.statusChangedAt) {
              parts.push(
                (todo.done ? "完成于 " : "恢复于 ") +
                  this.formatTime(todo.statusChangedAt)
              );
            }
            return parts.join(" · ");
          },

          deleteTodo(id) {
            this.todos = this.todos.filter((t) => t.id !== id);
            console.log("[todo] 删除", id);
            this.persistTodos();
          },

          clearDone() {
            const removed = this.doneCount;
            this.todos = this.todos.filter((t) => !t.done);
            console.log("[todo] 清除已完成，移除", removed, "项");
            this.persistTodos();
          },

          setView(value) {
            console.log("[todo] 切换筛选", value);
            this.view = value;
            this.emptyText =
              value === "done"
                ? "还没有完成的任务"
                : value === "active"
                ? "太棒了，没有未完成的任务 🎉"
                : "这里还什么都没有，添加第一件事吧 🎉";
          },
        },
      };
    };
  </script>
</template>
