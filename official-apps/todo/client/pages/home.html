<template page>
  <style>
    :host {
      display: block;
      /* 必须是滚动容器：o-router fix-body 给自身 shadow 写死了 overflow:hidden，
         若这里不自己滚动，长列表超出视口的部分会被裁掉且无法滚到 */

      box-sizing: border-box;
      padding: 28px 16px 56px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);

       左列宽取 auto，实际宽度由 .side 自身的行内 width（data.sideWidth）决定，
       这样拖拽手柄只需改一个 data 字段；任务区不再人为留左右空白（曾经为了让它在视口正中
       加过一列等宽留白，侧栏变宽后会浪费右侧大片区域，已去掉）。 */
    .shell {
      width: 100%;
      position: relative; /* 拖拽手柄的定位基准 */
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

      grid-column: 2;
      width: 100%;
      /* 行宽上限：避免超宽屏上单行文案拉得过长；比侧栏宽得多，因此侧栏拖宽后依然能把空间用满 */
      max-width: 1200px;
      margin: 0 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* 拖拽手柄：绝对定位在侧栏右边缘的间隙中间（不参与网格排版，也不受侧栏滚动裁剪影响） */
    .resizer {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: col-resize;
      touch-action: none; /* 触屏拖拽时不触发页面滚动 */
      z-index: 2;
    }
    .resizer::before {

      height: 44px;
      border-radius: 2px;
      background: var(--md-sys-color-outline-variant);
      transition: background 0.15s ease;

    .resizer:hover::before,
    .shell.resizing .resizer::before { background: var(--md-sys-color-primary); }

    .shell.resizing { user-select: none; }
    /* 侧栏：分组列表 + 新建 / 改名。固定在最左列，滚动时 sticky 保持在左上 */
    .side {
      grid-column: 1;
      width: 100%;
      position: sticky;
      top: 0;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .side-title { margin: 0; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
    /* 弹窗里的单行输入框：只给宽度，不要覆盖 st-input 的 display（见踩坑 004） */

    .glist { display: flex; flex-direction: column; gap: 4px; }
    /* 分组列表下方的「＋ 新建分组」：样式贴近分组行，不再占用侧栏顶部的常驻输入框 */
    .add-group-btn {
      justify-content: flex-start;
      color: var(--md-sys-color-primary);
    }
    .gitem {
      display: flex;
      align-items: center;
      gap: 4px;
      /* 垂直内边距统一交给 .gname：行内没有自己的垂直 padding，

    .gitem.active {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    /* 分组名区域承担「切换分组」的点击：右侧的编辑按钮在它之外，

    .gitem .gname {
      flex: 1;
      min-width: 0;
      /* 撑满行高（align-self: stretch）+ 与 ⋯ 按钮等高，
         这样文字上下方的留白也能点到，不再“中间能点、上下点不到” */
      align-self: stretch;
      min-height: 34px;
      display: flex;
      align-items: center;
      word-break: break-word;
      cursor: pointer;
      padding: 4px 0;
    }
    /* 计数也接受点击（它挨着行名，点数字也能切分组） */
    .gitem .gcount {
      flex: none;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
    }
    /* 「全部任务」是虚拟项没有 ⋯ 菜单，用一个同宽的占位撑出一样的位置，
       让它的计数与下面各行的计数右边缘对齐（否则会向右突出 38px） */
    .gitem .gmenu-ghost {
      flex: none;
      width: 34px;
      height: 34px;
    }
    .gitem.active .gcount { color: var(--md-sys-color-on-primary-container); }
    /* item 右侧的「⋯ 更多」菜单（st-menu 的 trigger）：改 font-size 等比缩到约 34px；
       平时隐藏，鼠标悬停 / 当前选中 / 键盘聚焦该行时淡入（触屏无 hover，始终可见）。
       n-icon 的颜色/尺寸跟着 st-icon-button 走（组件自带 ::slotted 规则：font-size 1.571em、
       color 继承 currentColor），不要再给 n-icon 写 width/height——会和 1.571em 叠加把图标撑出按钮 */
    .gitem st-menu { flex: none; }
    .gitem .gmenu { font-size: 12px; opacity: 0; transition: opacity 0.15s ease; }
    .gitem:hover .gmenu,
    .gitem.active .gmenu,
    .gitem:focus-within .gmenu { opacity: 1; }
    @media (hover: none) {
      .gitem .gmenu { opacity: 1; }
    }
    .manage-title { margin: 0; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

      padding-top: 12px;

      flex-direction: column;
      gap: 8px;

      align-items: center;
      gap: 6px;
      font-size: 13px;

    .ai-head n-icon { font-size: 1.1em; color: var(--md-sys-color-primary); }

    .ai-field { width: 100%; min-height: 4.5em; }
    .ai-actions { display: flex; justify-content: flex-end; }
    .ai-note { margin: 0; font-size: 12px; color: var(--md-sys-color-primary); }
    .ai-error { margin: 0; font-size: 12px; color: var(--md-sys-color-error); }
    /* ===== 图片附件（添加弹窗选图 / 粘贴，列表行缩略图，详情大图） ===== */
    .img-box { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    /* 选择图片区本身就是 label：点它即打开文件选择（file input 藏在里面） */
    .img-drop {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border: 1px dashed var(--md-sys-color-outline-variant);
      border-radius: 10px;

    /* 草稿缩略图：64px 方块 + 右上角「移除这张图片」 */
    .thumb { position: relative; }

      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
    }
    .thumb-del:hover { color: var(--md-sys-color-error); border-color: var(--md-sys-color-error); }

    .img-note { margin: 0; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

    /* 窄屏：侧栏转为顶部横向条，单列堆叠；拖拽手柄隐藏，侧栏宽度固定为通栏 */

      font-size: 26px;

    h1 n-icon { font-size: 1em; color: var(--md-sys-color-primary); }
    /* st-button 的 prefix 图标略缩一点，和 14px 文字视觉齐高 */
    st-button n-icon { font-size: 1.15em; }
    /* 下拉菜单项的前置图标：跟菜单项字号（0.857em 尺寸体系）同比例放大到 16px 左右 */
    st-menu-item n-icon { font-size: 1.15em; }

    /* 标题栏右侧的操作区：「归档已完成」+「添加任务」并排 */
    .top-actions {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* 「添加任务」「任务详情」两个弹窗放大：st-dialog 面板默认宽 min(34.29em, 100%)（≈480px），

    .dialog-lg::part(panel) { width: min(760px, 100%); }

    .dialog-field { width: 100%; min-height: 11em; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      position: relative; /* 落点指示线（伪元素）的定位基准 */
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--md-sys-color-surface-variant);
    }
    /* 拖拽手柄：列表行最左侧，按住上下拖动可调整顺序。平时半透明、悬停行时变亮；
       touch-action: none 是必须的——不然触屏上按住手柄移动会变成页面滚动 */
    .item .drag-handle {

      align-items: center;

      cursor: grab;
      touch-action: none;
      transition: opacity 0.15s ease;
    }
    .item:hover .drag-handle { opacity: 1; }
    @media (hover: none) {
      .item .drag-handle { opacity: 0.8; }
    }
    /* 被拖动的行：原地降明度做“源标记”（不移动位置，换位发生在松手时） */
    .item.dragging {

      box-shadow: inset 0 0 0 1px var(--md-sys-color-outline-variant);
    }

    /* 拖动中禁止选中文本 */
    .shell.dragging { user-select: none; }
    /* 落点指示：不按坐标画浮层，而是直接画在目标行的边缘上（几何上永远对齐）：

    .item.drop-before::after,

      left: 8px;
      right: 0;
      height: 2px;
      border-radius: 2px;
      background: var(--md-sys-color-primary);

      left: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--md-sys-color-primary);

    .item.drop-before::after { top: -5px; }
    .item.drop-before::before { top: -8.5px; }
    .item.drop-after::after { bottom: -5px; }
    .item.drop-after::before { bottom: -8.5px; }
    .item .body {

      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;

    .item .text { word-break: break-word; line-height: 1.4; }
    /* 列表里的描述摘要：最多两行，超出截断（详情弹窗里看全文） */
    .item .desc {
      font-size: 13px;
      line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant);
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item .meta {
      font-size: 12px;
      line-height: 1.3;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* 置顶项：左侧一条主题色竖条做区分（用 inset box-shadow 而不是伪元素——

    .item.pinned { box-shadow: inset 3px 0 0 0 var(--md-sys-color-primary); }

    .item .pin-btn { color: var(--md-sys-color-on-surface-variant); }
    .item.pinned .pin-btn { color: var(--md-sys-color-primary); }
    /* 行尾操作区：只剩删除一个图标按钮（尺寸缩到 34px，与侧栏分组行的 ⋯ 一致）。

    .item-actions {
      flex: none;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .item-actions st-icon-button { font-size: 12px; }
    .item.done .text {
      text-decoration: line-through;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* 倒计时待删：错误容器色提示"马上要被删掉了"，给撤销留出视觉空间 */
    .item.pending {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .item.pending .meta { color: var(--md-sys-color-on-error-container); }
    /* 倒计时（错误容器色）下操作按钮换成 on-error-container，图标在红底上才清晰；

       注意：必须直接命中 st-icon-button 宿主——它自带 color（on-surface-variant），

    .item.pending .desc { color: var(--md-sys-color-on-error-container); }
    .item.trash { background: var(--md-sys-color-surface); border: 1px dashed var(--md-sys-color-outline-variant); }
    /* 归档项：与垃圾桶区分开——用实线边框 + 表面色，不做删除线（它只是被收起来了） */

      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 0 2px;
      font-size: 13px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
    }
    .agroup-head .agroup-count { font-size: 12px; font-weight: 400; }

    .item .arch {
      flex: none;
      display: flex;
      align-items: center;
      font-size: 20px;
      color: var(--md-sys-color-on-surface-variant);
    }

      margin: 0;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* 归档视图说明行：一行短文案 + 末尾的「?」提示图标（完整说明在 st-tooltip 里） */
    .archive-tip {

      align-items: center;
      gap: 4px;
    }
    .archive-tip .help-btn {
      display: inline-flex;
      align-items: center;
      outline: none;
      color: var(--md-sys-color-on-surface-variant);
      cursor: help;

    /* st-tooltip 的气泡尺寸全用 em（字号 0.857em、max-width 20em），

       图标再用 em 折算回 15px 左右，与 12px 文案齐高 */
    .archive-tip st-tooltip { font-size: 14px; }
    .archive-tip .help-btn n-icon { font-size: 1.07em; }

    }

      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding-top: 12px;
    }
    .count { font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
    /* 列表项里的描述摘要按需隐藏 */
    .hidden { display: none !important; }
    /* 任务详情弹窗：查看与编辑合一——顶部是可直接修改的标题 / 描述，下面是只读元信息 */
    .detail {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 300px;
      /* 不再限 460px：弹窗面板已放大（.dialog-lg），内容跟着吃满面板宽度 */
      max-width: 100%;
    }
    .detail-row { display: flex; gap: 10px; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
    .detail-row .k { flex: none; width: 72px; }
    /* 完成时间编辑行：仅已完成（含已归档）的任务显示 */
    .done-at-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
    .done-at-row .k { flex: none; width: 72px; }
    .done-at-row input[type=datetime-local] {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      padding: 4px 8px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 8px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font: inherit;
      font-size: 13px;
    }
    .done-at-row input[type=datetime-local]:focus { outline: none; border-color: var(--md-sys-color-primary); }
    /* 行内说明：告诉用户留空不会改动原值（避免误以为“清空 = 清除”） */
    .done-at-row .done-at-hint { flex: none; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
    /* ===== 详情弹窗里的多行编辑区（.rt-*） =====
       框内每行是一个 .rt-line 块，行结构由页面自己管（回车拆行、粘贴只取纯文本）。
       ⚠️ 曾经给「第一个非空行」在框内加粗加大（.rt-line.rt-title）——判定时机与
       光标 / 输入法的边界情形太多、bug 不断，已整体去掉：现在所有行样式完全一致，
       编辑区里不做任何行级强调，不要再加回 .rt-title 那套。 */
    .rt-box {
      width: 100%;
      min-height: 11em;
      padding: 12px 14px;
      box-sizing: border-box;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 12px;
      background: var(--md-sys-color-surface);
      cursor: text;
      transition: border-color 0.15s ease;
    }
    .rt-box:focus-within { border-color: var(--md-sys-color-primary); }
    .rt-editor {
      position: relative;
      outline: none;
      min-height: 9em;
      font-size: 14px;
      line-height: 1.5;
      color: var(--md-sys-color-on-surface);
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* 每行一个块；空行靠 min-height 占住行高（否则光标没地方站） */
    .rt-editor .rt-line { min-height: 1.5em; }
    /* 编辑器为空时在上面叠一行占位提示（空行本身仍保留，不然光标无处可放、打不进字） */
    .rt-editor.is-empty::before {
      content: attr(data-placeholder);
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/textarea/textarea.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button-group.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/checkbox/checkbox.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/dialog/dialog.html"></l-m>
  <!-- NoneOS Core 的图标组件：走 Iconify，比 emoji 更统一、颜色自动继承 currentColor -->
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/menu/menu.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/tooltip/tooltip.html"></l-m>

  <div class="shell" class:resizing="resizing" class:dragging="!!draggingId">
    <!-- 左侧固定侧栏：选分组 / 新建分组 / 改名删除；宽度可拖拽（150–300px） -->
    <aside class="side" :style.width="sideWidth + 'px'">
      <p class="side-title">分组</p>

      <div class="glist">
        <!-- 根级绑定用裸方法名（$host 只在 o-fill 等子作用域里可用，见踩坑 006） -->
        <div class="gitem" class:active="isGroupActive('all')">
          <span class="gname" on:click="setGroup('all')">全部任务</span>
          <span class="gcount" on:click="setGroup('all')">{{allCountText}}</span>
          <span class="gmenu-ghost" aria-hidden="true"></span>
        </div>
        <o-fill :value="groups" fill-key="id">
          <div class="gitem" class:active="$host.isGroupActive($data.id)">
            <span class="gname" on:click="$host.setGroup($data.id)">{{$data.name}}</span>
            <span class="gcount" on:click="$host.setGroup($data.id)">{{$host.groupCountText($data.id)}}</span>
            <!-- 行右侧的「更多」菜单：重命名 / 删除（默认分组的删除置灰） -->
            <st-menu>
              <st-icon-button
                slot="trigger"
                class="gmenu"
                attr:title="$host.groupMenuTitle($data.name)"
              ><n-icon icon="mdi:dots-horizontal"></n-icon></st-icon-button>
              <st-menu-item on:click="$host.openRenameGroup($data.id)"
                ><n-icon slot="prefix" icon="mdi:pencil"></n-icon>重命名</st-menu-item
              >
              <st-menu-item
                attr:disabled="$host.isDefaultGroup($data.id)"
                on:click="$host.requestDeleteGroup($data.id)"
              ><n-icon slot="prefix" icon="mdi:delete-outline"></n-icon>删除</st-menu-item>
            </st-menu>
          </div>
        </o-fill>
      </div>

      <!-- 分组列表下方的新增入口：点击后在弹窗里输入（不再用常驻输入框） -->
      <st-button variant="text" class="add-group-btn" on:click="openAddGroup">
        <n-icon slot="prefix" icon="mdi:plus"></n-icon>新建分组
      </st-button>

    </aside>

    <!-- 拖拽手柄：左右拖动改变分组栏宽度（跟随侧栏右边缘） -->
    <div
      class="resizer"
      title="拖动调整分组栏宽度"
      :style.left="sideWidth + 10 + 'px'"
      on:pointerdown="startResize"
    ></div>

    <!-- 右侧任务区 -->
    <div class="main">
      <div class="top">
      <div>
        <h1><n-icon icon="mdi:check-circle-outline"></n-icon>待办清单</h1>
        <p class="sub">数据保存在本机，随时关掉再回来都还在。</p>
      </div>
      <div class="top-actions">
        <!-- 归档入口放在右上（原先在右下底栏）；作用范围是“当前分组范围”，与当前视图无关，
             所以不随视图切换隐藏，无可归档项时置灰 -->
        <st-button
          variant="text"
          title="把当前分组里已完成的任务收进归档（不会删除）"
          on:click="archiveDone"
          attr:disabled="doneCount === 0"
        ><n-icon slot="prefix" icon="mdi:archive-arrow-down"></n-icon>归档已完成</st-button>
        <st-button class="add-btn" on:click="openAdd">
          <n-icon slot="prefix" icon="mdi:plus"></n-icon>添加任务
        </st-button>
      </div>
    </div>

    <st-button-group>
      <st-button attr:variant="view === 'all' ? 'filled' : 'text'" on:click="setView('all')">全部</st-button>
      <st-button attr:variant="view === 'archived' ? 'filled' : 'text'" on:click="setView('archived')">
        <n-icon slot="prefix" icon="mdi:archive-arrow-down"></n-icon>已归档{{archiveBadge}}
      </st-button>
      <st-button attr:variant="view === 'trash' ? 'filled' : 'text'" on:click="setView('trash')">
        <n-icon slot="prefix" icon="mdi:delete-outline"></n-icon>垃圾桶{{trashBadge}}
      </st-button>
    </st-button-group>


    <!-- 列表视图（全部）：勾选 / 倒计时删除 -->
    <o-if :value="inListView">
      <div class="list">
        <o-fill :value="visibleTodos" fill-key="id">
          <div
            class="item"
            attr:data-id="$data.id"
            class:done="$data.done"
            class:pinned="$data.pinnedAt"
            class:pending="$host.isPending($data)"
            class:dragging="$host.isDragging($data.id)"
            class:drop-before="$host.isDropBefore($data.id)"
            class:drop-after="$host.isDropAfter($data.id)"
          >
            <span
              class="drag-handle"
              attr:title="$host.dragHandleTitle($data)"
              on:pointerdown="$host.startDrag($event, $data.id)"
            ><n-icon icon="mdi:drag-vertical"></n-icon></span>
            <st-checkbox attr:checked="$data.done" on:change="$host.toggleTodo($data.id)"></st-checkbox>
            <div class="body" on:click="$host.openDetail($data.id)">
              <span class="text">{{$data.text}}</span>
              <span class="desc" class:hidden="!$data.desc">{{$data.desc}}</span>
              <!-- 图片缩略图：整块在 .body 里，点它同样打开详情弹窗看大图 -->
              <div class="thumbs" class:hidden="!$data.images.length">
                <o-fill :value="$data.images" fill-key="id">
                  <img class="thumb-sm" attr:src="$data.dataUrl" attr:alt="'附件图片'" />
                </o-fill>
              </div>
              <span class="meta">{{$host.timeMeta($data)}}</span>
            </div>
            <div class="item-actions">
              <!-- 置顶 / 取消置顶（仅列表视图提供）：置顶后排在列表最前，且只能在置顶项之间拖拽排序 -->
              <st-icon-button
                class="pin-btn"
                attr:title="$host.pinButtonTitle($data)"
                on:click="$host.togglePin($data.id)"
              ><n-icon attr:icon="$host.pinButtonIconName($data)"></n-icon></st-icon-button>
              <st-icon-button
                attr:title="$host.deleteButtonTitle($data)"
                on:click="$host.handleDeleteClick($data.id)"
              ><n-icon attr:icon="$host.deleteButtonIconName($data)"></n-icon></st-icon-button>
            </div>
          </div>
        </o-fill>
      </div>
    </o-if>

    <!-- 已归档视图：取消归档 / 倒计时删除（归档项不被勾选，用归档图标代替勾选框位）。
         视图内可切「全部归档 / 按日期 / 按周」看归档（默认全部归档）；
         两者共用同一个 o-fill——「全部归档」时 archiveGroups 只有一组且 showHead=false（组头隐藏），
         按日期 / 按周时每组一条数据，这样不必维护两套一模一样的条目模板 -->
    <o-if :value="inArchiveView">
      <!-- 说明行保持一行短文案，细则收进「?」的悬浮提示里（长段落会占掉一大块版面） -->
      <p class="trash-tip archive-tip">
        归档的任务不计入统计，也不在列表里显示
        <st-tooltip
          content="归档的任务不计入统计，也不在列表里显示；可随时「取消归档」让它回到原分组，或删除（进垃圾桶）。左栏选中某个分组时，这里只显示该分组的归档（选「全部任务」即全部）。「按完成日 / 按完成周」按任务的完成时间划分（不是归档时间）；条目上显示的是完成时间，归档时间点开这条任务的详情可以查看。"
        ><span class="help-btn" tabindex="0" role="img" aria-label="归档说明"><n-icon icon="mdi:help-circle-outline"></n-icon></span></st-tooltip>
      </p>

      <st-button-group class="archive-tabs">
        <st-button
          attr:variant="archiveGroupMode === 'all' ? 'filled' : 'text'"
          on:click="setArchiveGroupMode('all')"
        >全部归档</st-button>
        <st-button
          attr:variant="archiveGroupMode === 'day' ? 'filled' : 'text'"
          on:click="setArchiveGroupMode('day')"
        >按完成日</st-button>
        <st-button
          attr:variant="archiveGroupMode === 'week' ? 'filled' : 'text'"
          on:click="setArchiveGroupMode('week')"
        >按完成周</st-button>
      </st-button-group>

      <div class="agroups">
        <o-fill :value="archiveGroups" fill-key="key">
          <div class="agroup">
            <div class="agroup-head" class:hidden="!$data.showHead">
              <span class="agroup-label">{{$data.label}}</span>
              <span class="agroup-count">{{$data.countText}}</span>
            </div>
            <div class="list">
              <o-fill :value="$data.todos" fill-key="id">
                <div class="item archived" attr:data-id="$data.id" class:pending="$host.isPending($data)">
                  <span class="arch"><n-icon icon="mdi:archive-arrow-down"></n-icon></span>
                  <div class="body" on:click="$host.openDetail($data.id)">
                    <span class="text">{{$data.text}}</span>
                    <span class="desc" class:hidden="!$data.desc">{{$data.desc}}</span>
                    <div class="thumbs" class:hidden="!$data.images.length">
                      <o-fill :value="$data.images" fill-key="id">
                        <img class="thumb-sm" attr:src="$data.dataUrl" attr:alt="'附件图片'" />
                      </o-fill>
                    </div>
                    <span class="meta">{{$host.timeMeta($data)}}</span>
                  </div>
                  <st-button variant="text" on:click="$host.unarchiveTodo($data.id)">取消归档</st-button>
                  <div class="item-actions">
                    <st-icon-button
                      attr:title="$host.deleteButtonTitle($data)"
                      on:click="$host.handleDeleteClick($data.id)"
                    ><n-icon attr:icon="$host.deleteButtonIconName($data)"></n-icon></st-icon-button>
                  </div>
                </div>
              </o-fill>
            </div>
          </div>
        </o-fill>
      </div>
    </o-if>

    <!-- 垃圾桶视图：还原 / 彻底删除 -->
    <o-if :value="inTrashView">
      <p class="trash-tip">垃圾桶里的条目不再计入统计；可随时「还原」，或彻底删除（彻底删除会二次确认）。左栏选中某个分组时，这里只显示该分组的条目（选「全部任务」即全部）。</p>
      <div class="list">
        <o-fill :value="scopedTrashTodos" fill-key="id">
          <div class="item trash">
            <div class="body" on:click="$host.openDetail($data.id)">
              <span class="text">{{$data.text}}</span>
              <span class="desc" class:hidden="!$data.desc">{{$data.desc}}</span>
              <!-- 图片缩略图：整块在 .body 里，点它同样打开详情弹窗看大图 -->
              <div class="thumbs" class:hidden="!$data.images.length">
                <o-fill :value="$data.images" fill-key="id">
                  <img class="thumb-sm" attr:src="$data.dataUrl" attr:alt="'附件图片'" />
                </o-fill>
              </div>
              <span class="meta">{{$host.timeMeta($data)}}</span>
            </div>
            <st-button variant="text" on:click="$host.restoreTodo($data.id)">还原</st-button>
            <st-icon-button
              attr:title="'彻底删除：' + $data.text"
              on:click="$host.purgeTodo($data.id)"
            ><n-icon icon="mdi:delete-outline"></n-icon></st-icon-button>
          </div>
        </o-fill>
      </div>
    </o-if>

    <o-if :value="isListEmpty">
      <div class="empty">{{emptyText}}</div>
    </o-if>

    <o-if :value="inTrashView">
      <div class="footer">
        <span class="count">垃圾桶 {{scopedTrashTodos.length}} 项</span>
        <st-button
          variant="text"
          color="error"
          on:click="emptyTrash"
          attr:disabled="scopedTrashTodos.length === 0"
        >清空垃圾桶</st-button>
      </div>
    </o-if>

    <o-if :value="inArchiveView">
      <div class="footer">
        <span class="count">已归档 {{scopedArchivedTodos.length}} 项</span>
      </div>
    </o-if>

    <o-if :value="inListView">
      <div class="footer">
        <span class="count">{{remaining}} 项未完成 · 共 {{scopedActiveTodos.length}} 项</span>
      </div>
    </o-if>

    <!-- 添加任务：弹窗内输入（.dialog-lg = 放大面板，让多行输入 / 图片 / AI 区都宽敞些） -->
    <st-dialog class="dialog-lg" sync:open="addOpen" auto-close>
      <span slot="headline">添加任务</span>
      <st-textarea
        class="dialog-field"
        rows="4"
        sync:value="draft"
        placeholder="第一行是标题，换行后写的都是描述…"
      ></st-textarea>

      <!-- 图片附件：点虚线区选图，或直接在弹窗里粘贴（Ctrl/⌘+V）；
           图片会跟着任务一起保存，也能交给下面的 AI 识别 -->
      <div class="img-box">
        <label class="img-drop">
          <input
            class="img-input"
            type="file"
            accept="image/*"
            multiple
            on:change="onPickImages"
          />
          <n-icon icon="mdi:image-plus"></n-icon>
          <span>点击选择图片，或直接粘贴（Ctrl/⌘ + V）</span>
        </label>
        <div class="img-grid">
          <o-fill :value="draftImages" fill-key="id">
            <div class="thumb">
              <img attr:src="$data.dataUrl" attr:alt="'附件图片'" />
              <button
                class="thumb-del"
                type="button"
                title="移除这张图片"
                on:click="$host.removeDraftImage($data.id)"
              ><n-icon icon="mdi:close"></n-icon></button>
            </div>
          </o-fill>
        </div>
        <p class="img-note" class:hidden="!imgNote">{{imgNote}}</p>
      </div>

      <p class="manage-title">{{addGroupHint}}</p>

      <!-- AI 添加：输入一句自然语言描述，AI 生成标题 + 描述回填到上面的输入框；
           上面粘了图片时，这个按钮会变成「AI 识别图片」，识别图里的文字提取任务 -->
      <div class="ai-box">
        <p class="ai-head"><n-icon icon="mdi:auto-fix"></n-icon>AI 添加：说说你要做什么；粘贴图片后可让 AI 识别图里的文字</p>
        <st-textarea
          class="ai-field"
          rows="2"
          sync:value="aiDraft"
          placeholder="例如：明天下午三点和客户开会；也可把清单 / 聊天截图粘进弹窗，再点「AI 识别图片」提取成任务"
        ></st-textarea>
        <div class="ai-actions">
          <st-button
            variant="text"
            on:click="generateWithAi"
            attr:disabled="aiDisabled"
          ><n-icon slot="prefix" attr:icon="aiButtonIcon"></n-icon>{{aiButtonLabel}}</st-button>
        </div>
        <p class="ai-note" class:hidden="!aiNote">{{aiNote}}</p>
        <p class="ai-error" class:hidden="!aiError">{{aiError}}</p>
      </div>

      <div slot="actions">
        <st-button variant="text" on:click="closeAdd">取消</st-button>
        <st-button on:click="submitAdd" attr:disabled="!draft.trim()">添加</st-button>
      </div>
    </st-dialog>

    <!-- 新建 / 改名分组：同一个弹窗，由 editingGroupId 决定标题与按钮文案 -->
    <st-dialog sync:open="groupDialogOpen" auto-close>
      <span slot="headline">{{groupDialogTitle}}</span>
      <st-input
        class="dialog-input"
        sync:value="groupDraft"
        placeholder="输入分组名，例如「公司」「私人」"
        on:change="submitGroup"
      ></st-input>
      <div slot="actions">
        <st-button variant="text" on:click="closeGroupDialog">取消</st-button>
        <st-button on:click="submitGroup" attr:disabled="!groupDraft.trim()">{{groupSubmitLabel}}</st-button>
      </div>
    </st-dialog>

    <!-- 任务详情：查看与编辑合并在同一个弹窗里——标题 / 描述直接可改，元信息只读展示，
         点「保存」写回并关闭弹窗（不再有「只读 ↔ 编辑」两个面孔来回切）。
         注意 st-dialog 内不能调 $host.xxx()（弹窗内部 $host 不指向页面），
         所以展示文案都在 openDetail 里预计算成 detail 快照 -->
    <st-dialog class="dialog-lg" sync:open="detailOpen" auto-close>
      <span slot="headline">任务详情</span>

      <div class="detail">
        <!-- 编辑区：与「添加任务」同口径（第一个非空行是标题，换行后是描述），
             但**不做行级样式**——所有行样式一致（首行加粗加大那套已因 bug 多而整体去掉）。
             行结构由页面自己管：回车拆行、粘贴只取纯文本 -->
        <div class="rt-box" on:click="onEditorBoxClick">
          <div
            class="rt-editor"
            contenteditable="true"
            spellcheck="false"
            data-placeholder="第一行是标题，换行后写的都是描述…"
            on:input="onEditorInput"
            on:keydown="onEditorKeydown"
            on:paste="onEditorPaste"
            on:compositionstart="onEditorCompositionStart"
            on:compositionend="onEditorCompositionEnd"
          ></div>
        </div>
        <!-- 任务图片：等比缩到弹窗宽度内，右上角可移除（立即落盘） -->
        <div class="detail-images" class:hidden="!detail.images.length">
          <o-fill :value="detail.images" fill-key="id">
            <div class="dimg">
              <img attr:src="$data.dataUrl" attr:alt="'任务图片'" />
              <button
                class="thumb-del"
                type="button"
                title="移除这张图片"
                on:click="$host.removeDetailImage($data.id)"
              ><n-icon icon="mdi:close"></n-icon></button>
            </div>
          </o-fill>
        </div>
        <div class="detail-row"><span class="k">分组</span><span>{{detail.groupText}}</span></div>
        <div class="detail-row"><span class="k">状态</span><span>{{detail.statusText}}</span></div>
        <!-- 完成时间：已完成（含已归档、且不在垃圾桶）的任务可在此修改。
             留空 / 清空一律不改数据（恢复原值），绝不会把原记录弄丢 -->
        <div class="done-at-row" class:hidden="!detail.doneEditable">
          <span class="k">完成时间</span>
          <input type="datetime-local" on:change="onDoneAtChange" />
          <span class="done-at-hint">{{detail.doneAtHint}}</span>
        </div>
        <div class="detail-row"><span class="k">创建时间</span><span>{{detail.createdText}}</span></div>
        <div class="detail-row"><span class="k">状态变更</span><span>{{detail.statusChangedText}}</span></div>
        <div class="detail-row"><span class="k">归档时间</span><span>{{detail.archivedText}}</span></div>
        <div class="detail-row"><span class="k">删除时间</span><span>{{detail.deletedText}}</span></div>
      </div>

      <div slot="actions">
        <st-button variant="text" on:click="closeDetail">关闭</st-button>
        <st-button on:click="submitEditDetail" attr:disabled="!editCanSave">保存</st-button>
      </div>
    </st-dialog>

    <!-- 彻底删除的二次确认 -->
    <st-dialog sync:open="confirmOpen" auto-close>
      <span slot="headline">{{confirmTitle}}</span>
      <div>{{confirmText}}</div>
      <div slot="actions">
        <st-button variant="text" on:click="closeConfirm">取消</st-button>
        <st-button color="error" on:click="confirmAction">确认</st-button>
      </div>
    </st-dialog>
    </div>
  </div>

  <script>
    // 数据空间 id。默认是正式空间；场景测试会在跑之前往 sessionStorage 写一个临时开关
    // （见 CONTEXT.md「场景测试」），把本次会话切到一个隔离空间里跑，
    // 这样测试永远不会碰到用户的真实数据。开关带 10 分钟有效期，
    // 万一测试中断也不会让应用一直指着隔离空间。
    const STORE_ID = (() => {
      try {
        const raw = sessionStorage.getItem("__todo_store_id");
        if (!raw) return "conjure-todo-app";
        const o = JSON.parse(raw);
        if (o && typeof o.id === "string" && o.exp > Date.now()) {
          console.log("[init] 使用隔离数据空间（测试模式）", o.id);
          return o.id;
        }
        sessionStorage.removeItem("__todo_store_id");
      } catch (err) {
        console.error("[init] 读取数据空间开关失败", err);
      }
      return "conjure-todo-app";
    })();
    const STORE_KEY = "todos";
    // 分组单独一个键存：Array<{ id, name }>（首项固定为默认分组）
    const GROUPS_KEY = "groups";
    const DEFAULT_GROUP_ID = "default";
    const DEFAULT_GROUP_NAME = "默认";
    // 界面偏好（目前只有侧栏宽度）单独一个键存
    const UI_KEY = "ui";
    // 会话状态（当前筛选 + 选中分组）存在 sessionStorage：刷新后保持，关标签页 / 新开窗口则回到默认。
    // 说明：项目约定数据一律进 /nos/storage，这里是经用户明确要求后的豁免（见 MEMORY.md 豁免记录）
    const SESSION_KEY = "todo-ui-state";
    // 侧栏（分组栏）宽度的拖拽范围
    const SIDE_MIN_W = 150;
    const SIDE_MAX_W = 300;
    const SIDE_DEFAULT_W = 190;
    // 删除后的倒计时时长：到点后条目才真正进入垃圾桶
    const TRASH_DELAY_MS = 5000;
    const TICK_MS = 200;
    // 每条待办的图片附件上限；粘贴 / 选图后统一压到最长边 IMAGE_MAX_SIDE、JPEG，
    // 避免把原图（动辄几 MB）直接塞进存储
    const MAX_IMAGES = 4;
    const IMAGE_MAX_SIDE = 1280;
    const IMAGE_QUALITY = 0.82;
    // AI 生成任务标题 / 描述时给模型的系统提示：只要求返回严格 JSON，便于程序解析
    const AI_SYSTEM_PROMPT =
      "你是一个待办事项整理助手。用户会用一句话描述要做的事，" +
      "请把它整理成任务标题与描述：title 是简明扼要的任务标题（不超过 20 个字，不要句末标点），" +
      "desc 是补充说明（1-3 句、需要分点时用换行符分隔），信息不足时 desc 留空字符串。" +
      "只输出一个 JSON 对象，不要任何解释、不要 markdown 代码块，格式：" +
      '{"title":"…","desc":"…"}';
    // 带图片时的提示：让模型自己判断「图里有可提取的文字 → 整理成任务」
    // 还是「图里没有文字 → 作为图片附件带入」（kind = image，标题用一句短语概括图片）
    const AI_IMAGE_SYSTEM_PROMPT =
      "你是一个会看图的待办事项整理助手。用户会给你一张或多张图片（可能是清单、聊天记录、" +
      "便条、文档截图、手写内容，也可能是风景 / 人物 / 实物照片），可能还附带一句文字描述。" +
      "请判断并只输出一个 JSON 对象，不要任何解释、不要 markdown 代码块，格式：" +
      '{"kind":"task","title":"…","desc":"…"}\n' +
      "判断规则：\n" +
      "1. 图片里有可提取的文字（清单、聊天记录、便条、文档、屏幕截图等）→ kind 取 \"task\"：" +
      "把其中的待办事项整理成 title（简洁，不超过 20 个字，不要句末标点）与 desc" +
      "（补充说明 1-3 句，需要分点时用换行符分隔，没有补充就留空字符串）；" +
      "图里有多件事时合并成一句 title 并在 desc 里逐条列出。\n" +
      "2. 图片里没有可提取的文字（风景、人物、实物照片等）→ kind 取 \"image\"：" +
      "title 用一句短语概括这张图（不超过 20 个字），desc 写它的用途或内容描述。";

    export default async ({ load }) => {
      const { getStorage } = await load("/nos/storage/main.js");
      const store = getStorage(STORE_ID);
      // 测试模式下额外提示一下，方便比对日志时确认跑的是隔离空间
      if (STORE_ID !== "conjure-todo-app") {
        console.warn("[init] 当前为测试数据空间：", STORE_ID);
      }
      window.__todoInitCount = (window.__todoInitCount || 0) + 1;
      console.log("[init] 待办页初始化 #" + window.__todoInitCount, "store=", STORE_ID);

      return {
        data: {
          draft: "",
          view: "all",
          todos: [],
          emptyText: "这里还什么都没有，添加第一件事吧 🎉",
          // 分组：groups 为分组表；groupFilter 为 "all" 或分组 id
          groups: [{ id: DEFAULT_GROUP_ID, name: DEFAULT_GROUP_NAME }],
          groupFilter: "all",
          groupDraft: "",
          editingGroupId: null,
          // 侧栏（分组栏）宽度：可拖拽，150–300px；写入存储记忆
          sideWidth: SIDE_DEFAULT_W,
          // 已归档视图的查看方式："all"（全部归档，默认） | "day"（按归档日期） | "week"（按周）
          archiveGroupMode: "all",
          // 是否正在拖拽（拖拽中禁止选中文本）
          resizing: false,
          // 正在拖拽的条目 id（null = 没有在拖）；驱动 .item.dragging 与 .shell.dragging
          draggingId: null,
          // 落点提示：插到该行之前（线画在该行上边）/ 插到该行之后（线画在该行下边）；至多一个非 null
          dropBeforeId: null,
          dropAfterId: null,
          // 新建 / 改名分组的弹窗
          groupDialogOpen: false,
          // 添加弹窗里提示“这条会加进哪个分组”
          addGroupHint: "",
          // AI 添加：自然语言描述草稿 / 是否正在请求 / 结果或错误提示
          //（弹窗内只能读 data 字段，不能调 $host.xxx()，见踩坑 005）
          aiDraft: "",
          aiLoading: false,
          aiNote: "",
          aiError: "",
          // 添加弹窗里的图片草稿：Array<{ id, dataUrl, w, h }>（粘贴 / 选图后压缩而来，
          // 点「添加」时原样写进任务的 images）
          draftImages: [],
          // 是否正在压缩图片 / 图片区提示文案
          imgBusy: false,
          imgNote: "",
          // 倒计时刷新用：每次 tick 写入当前时间，驱动界面重算剩余秒数
          nowTick: 0,
          // 彻底删除 / 删除分组的二次确认
          confirmOpen: false,
          confirmTitle: "",
          confirmText: "",
          // 待彻底删除的目标：条目 id 或 "ALL"（清空垃圾桶）
          purgeTarget: null,
          // 确认类型："purge"（彻底删除） | "deleteGroup"（删除分组）
          confirmKind: "purge",
          confirmGroupId: null,
          // 添加任务的弹窗
          addOpen: false,
          // 任务详情弹窗（查看 + 编辑合一）：打开时把只读元信息全部预计算好
          // （st-dialog 内不能调 $host.xxx()，只能读 data 字段，见模板注释）
          detailOpen: false,
          // 详情弹窗当前展示的任务 id（保存时据此定位条目）
          detailId: null,
          // 弹窗里「标题 + 描述」的多行草稿（与添加弹窗同口径：第一个非空行是标题、其后是描述）
          editDraft: "",
          detail: {
            // 详情弹窗里的图片快照：Array<{ id, dataUrl }>
            images: [],
            statusText: "",
            groupText: "",
            createdText: "",
            statusChangedText: "",
            archivedText: "",
            deletedText: "",
            doneEditable: false,
            doneAtValue: "",
            doneAtHint: "",
          },
        },

        async ready() {
          // 先读界面偏好（侧栏宽度）与分组（任务渲染时要靠它显示分组名），再读任务，
          // 最后恢复会话状态（选中分组的合法性校验依赖已读好的 groups）
          await this.loadUi();
          await this.loadGroups();
          await this.loadTodos();
          this.restoreSessionState();
          // 图片粘贴：监听挂 document（弹窗里 textarea 在页面 shadow 内，
          // 粘贴事件 composed 冒出来才收得到）；只在添加弹窗开着时接图
          document.addEventListener("paste", (ev) => this.handlePaste(ev));
          console.log("[init] 已监听图片粘贴");
        },

        proto: {
          // 计算属性必须放在 proto 中（放模块顶层会导致页面模块加载失败）
          get inTrashView() {
            return this.view === "trash";
          },

          get inArchiveView() {
            return this.view === "archived";
          },

          // 「全部」视图（列表）；归档与垃圾桶各自一套渲染
          get inListView() {
            return this.view === "all";
          },

          // 列表里的条目：不在垃圾桶、也没被归档（含倒计时中的，它们还没真正删除）
          get activeTodos() {
            return this.todos.filter((t) => !t.deletedAt && !t.archivedAt);
          },

          // 已归档的（不在列表也不算统计，但没删）
          get archivedTodos() {
            return this.todos.filter((t) => !t.deletedAt && !!t.archivedAt);
          },

          get trashTodos() {
            return this.todos.filter((t) => t.deletedAt);
          },

          // 按当前选中分组过滤（groupFilter === "all" 时原样返回）。
          // 归档 / 垃圾桶视图同样跟随左栏分组——三个视图口径一致，
          // 不再出现“左栏选了「个人」，右侧却列出所有分组的归档 / 垃圾桶条目”
          scopeByGroup(list) {
            if (this.groupFilter === "all") return list;
            return list.filter((t) => t.groupId === this.groupFilter);
          },

          get scopedArchivedTodos() {
            return this.scopeByGroup(this.archivedTodos);
          },

          get scopedTrashTodos() {
            return this.scopeByGroup(this.trashTodos);
          },

          // 视图标签上的数量跟着分组走，与视图里实际显示的条数保持一致
          get trashBadge() {
            return this.scopedTrashTodos.length
              ? " " + this.scopedTrashTodos.length
              : "";
          },

          get archiveBadge() {
            return this.scopedArchivedTodos.length
              ? " " + this.scopedArchivedTodos.length
              : "";
          },

          // 已归档视图的分组展示：「全部归档」（all）只有一组、组头隐藏（等价于原来的平铺列表）；
          // 「按日期」（day）/「按周」（week）按归档时刻分组，最新的一组排最前。
          // 两种模式共用同一个 o-fill，避免维护两套条目模板
          get archiveGroups() {
            if (this.archiveGroupMode === "all") {
              return [
                {
                  key: "all",
                  label: "",
                  showHead: false,
                  countText: "",
                  todos: this.scopedArchivedTodos,
                },
              ];
            }
            const buckets = new Map();
            for (const t of this.scopedArchivedTodos) {
              // 分组基准是「完成时刻」而不是归档时刻：归档可能在完成后过很久才做，
              // 按完成日 / 完成周归组才能对上「哪天做完的」这个直觉
              const b = this.archiveBucket(this.completedAt(t));
              let g = buckets.get(b.key);
              if (!g) {
                g = { key: b.key, label: b.label, showHead: true, countText: "", todos: [] };
                buckets.set(b.key, g);
              }
              g.todos.push(t);
            }
            // key 前缀 d / w 后面都是 YYYY-MM-DD，字典序即时间序；倒序 => 最新的组排最前
            const list = Array.from(buckets.values()).sort((a, b) =>
              a.key < b.key ? 1 : a.key > b.key ? -1 : 0
            );
            for (const g of list) g.countText = g.todos.length + " 项";
            return list;
          },

          // 当前分组范围内的列表条目（归档与垃圾桶都不计入）
          get scopedActiveTodos() {
            return this.scopeByGroup(this.activeTodos);
          },

          // 列表视图的显示序：**置顶项在前、普通项在后**，各自内部保持数组顺序（稳定排序）。
          // 注意：这只是「显示序」，todos 数组仍是存储顺序——拖拽换位时由 commitDragDrop
          // 把新的显示序写回槽位，两边不会互相打架
          get listTodos() {
            const list = this.scopedActiveTodos;
            const pinned = list.filter((t) => !!t.pinnedAt);
            if (!pinned.length) return list;
            return pinned.concat(list.filter((t) => !t.pinnedAt));
          },

          get visibleTodos() {
            // 三个视图都跟随左栏分组（选「全部任务」时即全部）
            if (this.inTrashView) return this.scopedTrashTodos;
            if (this.inArchiveView) return this.scopedArchivedTodos;
            return this.listTodos;
          },

          get remaining() {
            return this.scopedActiveTodos.filter((t) => !t.done).length;
          },

          get doneCount() {
            return this.scopedActiveTodos.filter((t) => t.done).length;
          },

          // 添加任务会归属的分组：正在浏览某分组 → 该分组；在「全部任务」→ 默认分组
          get draftGroupId() {
            return this.groupFilter === "all" ? DEFAULT_GROUP_ID : this.groupFilter;
          },

          // 侧栏「全部任务」的计数（不含垃圾桶）
          get allCountText() {
            return this.activeTodos.length + " 项";
          },

          // 弹窗标题：改名时带上原名，方便确认改的是哪一个
          get groupDialogTitle() {
            if (!this.editingGroupId) return "新建分组";
            return "改名分组：「" + this.groupName(this.editingGroupId) + "」";
          },

          get groupSubmitLabel() {
            return this.editingGroupId ? "保存" : "创建";
          },

          get isListEmpty() {
            return this.visibleTodos.length === 0;
          },

          // ===== 界面偏好（侧栏宽度） =====
          // 把任意输入拉回合法区间，避免外部改数据 / 旧值越界
          clampSideWidth(v) {
            const n = Math.round(Number(v));
            if (!Number.isFinite(n)) return SIDE_DEFAULT_W;
            return Math.min(SIDE_MAX_W, Math.max(SIDE_MIN_W, n));
          },

          async loadUi() {
            try {
              const saved = await store.getItem(UI_KEY);
              if (saved && typeof saved.sideWidth === "number") {
                this.sideWidth = this.clampSideWidth(saved.sideWidth);
              }
              console.log("[ui] 已读取界面偏好，分组栏宽度 =", this.sideWidth, "px");
            } catch (err) {
              console.error("[ui] 读取界面偏好失败", err);
            }
          },

          async saveUi() {
            try {
              await store.setItem(UI_KEY, { sideWidth: this.sideWidth });
              console.log("[ui] 已保存界面偏好，分组栏宽度 =", this.sideWidth, "px");
            } catch (err) {
              console.error("[ui] 保存界面偏好失败", err);
            }
          },

          // 拖拽调整侧栏宽度：从手柄 pointerdown 开始，移动与结束都挂在 window 上
          //（指针移出手柄甚至移出窗口也能继续跟随）
          startResize(ev) {
            if (ev && ev.button !== undefined && ev.button !== 0) return;
            if (ev && ev.preventDefault) ev.preventDefault();
            const startX = ev.clientX;
            const startW = this.sideWidth;
            this.resizing = true;
            console.log("[ui] 开始拖拽分组栏宽度，起始 =", startW, "px");

            const onMove = (e) => {
              this.sideWidth = this.clampSideWidth(startW + (e.clientX - startX));
            };
            const onEnd = () => {
              window.removeEventListener("pointermove", onMove);
              window.removeEventListener("pointerup", onEnd);
              window.removeEventListener("pointercancel", onEnd);
              this.resizing = false;
              console.log("[ui] 分组栏宽度调整为", this.sideWidth, "px");
              this.saveUi();
            };

            window.addEventListener("pointermove", onMove);
            window.addEventListener("pointerup", onEnd);
            window.addEventListener("pointercancel", onEnd);
          },

          // ===== 会话状态（刷新不丢当前筛选 / 选中分组） =====
          // 按用户要求存在 sessionStorage：F5 / 刷新后保持，关闭标签页或新开窗口回到默认
          sessionSnapshot() {
            return {
              view: this.view,
              groupFilter: this.groupFilter,
              // 归档视图的查看方式（全部归档 / 按日期 / 按周）也随会话记忆
              archiveGroup: this.archiveGroupMode,
            };
          },

          saveSessionState() {
            try {
              sessionStorage.setItem(
                SESSION_KEY,
                JSON.stringify(this.sessionSnapshot())
              );
              console.log("[ui] 已保存会话状态", this.sessionSnapshot());
            } catch (err) {
              console.error("[ui] 保存会话状态失败", err);
            }
          },

          restoreSessionState() {
            let saved = null;
            try {
              saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
            } catch (err) {
              console.error("[ui] 读取会话状态失败", err);
            }
            if (!saved || typeof saved !== "object") return;
            if (["all", "archived", "trash"].includes(saved.view)) {
              this.view = saved.view;
            }
            // 分组可能已被删除：只有仍然存在时才恢复，否则回「全部任务」
            if (
              saved.groupFilter === "all" ||
              this.groups.some((g) => g.id === saved.groupFilter)
            ) {
              this.groupFilter = saved.groupFilter;
            }
            if (["all", "day", "week"].includes(saved.archiveGroup)) {
              this.archiveGroupMode = saved.archiveGroup;
            }
            this.updateEmptyText();
            console.log(
              "[ui] 已恢复会话状态，筛选 =",
              this.view,
              "分组 =",
              this.groupFilter,
              "归档查看 =",
              this.archiveGroupMode
            );
          },

          async loadGroups() {
            try {
              const saved = await store.getItem(GROUPS_KEY);
              const list = Array.isArray(saved)
                ? saved
                    .filter((g) => g && typeof g.id === "string" && g.id)
                    .map((g) => ({ id: String(g.id), name: String(g.name || "未命名") }))
                : [];
              if (!list.some((g) => g.id === DEFAULT_GROUP_ID)) {
                list.unshift({ id: DEFAULT_GROUP_ID, name: DEFAULT_GROUP_NAME });
              }
              this.groups = list;
              console.log("[group] 已读取分组，共", this.groups.length, "个");
            } catch (err) {
              console.error("[group] 读取分组失败", err);
              this.groups = [{ id: DEFAULT_GROUP_ID, name: DEFAULT_GROUP_NAME }];
            }
          },

          async persistGroups() {
            try {
              await store.setItem(GROUPS_KEY, JSON.parse(JSON.stringify(this.groups)));
              console.log("[group] 已保存分组，共", this.groups.length, "个");
            } catch (err) {
              console.error("[group] 保存分组失败", err);
            }
          },

          async loadTodos() {
            try {
              const saved = await store.getItem(STORE_KEY);
              if (Array.isArray(saved)) {
                this.todos = saved.map((t) => ({
                  id: String(t.id),
                  text: String(t.text || ""),
                  // 描述：标题换行后的内容；旧数据没有，一律空字符串
                  desc: typeof t.desc === "string" ? t.desc : "",
                  // 分组：旧数据没有 groupId，一律归入默认分组
                  groupId:
                    typeof t.groupId === "string" && t.groupId
                      ? t.groupId
                      : DEFAULT_GROUP_ID,
                  done: !!t.done,
                  // 旧数据没有时间字段，保留 null（界面显示“时间未知”），不伪造时间
                  createdAt: typeof t.createdAt === "number" ? t.createdAt : null,
                  statusChangedAt:
                    typeof t.statusChangedAt === "number" ? t.statusChangedAt : null,
                  // 归档：archivedAt 非空 = 已归档（不在列表也不计统计，但未删除）
                  archivedAt: typeof t.archivedAt === "number" ? t.archivedAt : null,
                  // 置顶：pinnedAt 非空 = 已置顶（列表里排在普通项之前，且只能在置顶项之间拖拽排序）
                  pinnedAt: typeof t.pinnedAt === "number" ? t.pinnedAt : null,
                  // 删除相关：deletedAt 非空 = 已在垃圾桶；pendingDeleteAt 非空 = 正处于删除倒计时
                  deletedAt: typeof t.deletedAt === "number" ? t.deletedAt : null,
                  // 倒计时不跨刷新恢复：重新打开时把未完成的倒计时取消，避免“隔夜回来发现被删了”
                  pendingDeleteAt: null,
                  // 图片附件：只认 data:image/ 开头的 dataURL（旧数据没有该字段 → 空数组），
                  // 超上限的截断，保证模板里的缩略图渲染永远有值
                  images: Array.isArray(t.images)
                    ? t.images
                        .filter(
                          (im) =>
                            im &&
                            typeof im.dataUrl === "string" &&
                            im.dataUrl.indexOf("data:image/") === 0
                        )
                        .slice(0, MAX_IMAGES)
                        .map((im) => ({
                          id:
                            typeof im.id === "string" && im.id
                              ? im.id
                              : "i" + Math.random().toString(36).slice(2, 8),
                          dataUrl: im.dataUrl,
                        }))
                    : [],
                }));
              }
              console.log("[storage] 已读取待办，共", this.todos.length, "项");
            } catch (err) {
              console.error("[storage] 读取待办失败", err);
            }
          },

          async persistTodos() {
            try {
              await store.setItem(STORE_KEY, JSON.parse(JSON.stringify(this.todos)));
              console.log("[storage] 已保存待办，共", this.todos.length, "项");
            } catch (err) {
              console.error("[storage] 保存待办失败", err);
            }
          },

          // 打开添加弹窗：开一个新草稿，并提示会加进哪个分组
          openAdd() {
            this.draft = "";
            this.addGroupHint =
              "将加入分组：「" + this.groupName(this.draftGroupId) + "」";
            // AI 区与图片区每次都从干净状态开始
            this.aiDraft = "";
            this.aiNote = "";
            this.aiError = "";
            this.draftImages = [];
            this.imgNote = "";
            this.imgBusy = false;
            this.addOpen = true;
            console.log("[todo] 打开添加弹窗，目标分组 =", this.draftGroupId);
          },

          closeAdd() {
            this.addOpen = false;
            this.draft = "";
            this.aiDraft = "";
            this.aiNote = "";
            this.aiError = "";
            this.draftImages = [];
            this.imgNote = "";
            this.imgBusy = false;
            console.log("[todo] 关闭添加弹窗（未添加）");
          },

          // ===== 图片附件：选图 / 粘贴 / 压缩 / 移除 =====
          // 选图入口（label 里藏着的 file input 的 change）
          onPickImages(ev) {
            const input = ev && ev.target;
            const files = input && input.files ? Array.from(input.files) : [];
            // 清空 value 才能再次选同一张图
            if (input) input.value = "";
            if (files.length) {
              console.log("[img] 选择文件", files.length, "个");
              this.attachImages(files);
            }
          },

          // 粘贴入口（document 级监听，只在添加弹窗开着时接图）。
          // 剪贴板图片在 clipboardData.items 里（kind: "file"）；没找到图片就什么都不做，
          // 让浏览器自己处理普通文字粘贴（不 preventDefault）
          handlePaste(ev) {
            if (!this.addOpen) return;
            const dt = ev && ev.clipboardData;
            if (!dt || !dt.items) return;
            const files = [];
            for (const item of Array.from(dt.items)) {
              if (item.kind !== "file") continue;
              if (!item.type || item.type.indexOf("image/") !== 0) continue;
              const f = item.getAsFile ? item.getAsFile() : null;
              if (f) files.push(f);
            }
            if (!files.length) return;
            // 剪贴板里同时有文字时不要拦掉文字粘贴（否则用户从网页复制图文会丢文字）
            if (Array.from(dt.types || []).indexOf("text/plain") === -1) {
              ev.preventDefault();
            }
            console.log("[img] 粘贴到", files.length, "张图片");
            this.attachImages(files);
          },

          // 把文件列表压成 dataURL 并挂到草稿上；超上限 / 单张失败都只提示不抛错
          async attachImages(files) {
            const list = Array.from(files || []);
            if (!list.length) return;
            this.imgBusy = true;
            this.imgNote = "正在处理图片…";
            let skipped = 0;
            for (const f of list) {
              if (this.draftImages.length >= MAX_IMAGES) {
                skipped += 1;
                continue;
              }
              try {
                const img = await this.compressImage(f);
                this.draftImages = [
                  ...this.draftImages,
                  {
                    id:
                      "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    dataUrl: img.dataUrl,
                    w: img.w,
                    h: img.h,
                  },
                ];
                console.log(
                  "[img] 已加入图片",
                  img.w + "x" + img.h,
                  Math.round(img.dataUrl.length / 1024) + "KB"
                );
              } catch (err) {
                skipped += 1;
                console.error("[img] 处理图片失败", err);
              }
            }
            this.imgBusy = false;
            this.imgNote = this.draftImages.length
              ? "已添加 " +
                this.draftImages.length +
                " 张图片（最多 " +
                MAX_IMAGES +
                " 张）" +
                (skipped ? "，有 " + skipped + " 张未能加入" : "")
              : skipped
              ? "图片处理失败，换一张试试"
              : "";
          },

          // 压缩：等比缩到最长边 IMAGE_MAX_SIDE 以内并转 JPEG；先铺白底，
          // 透明 PNG 转 JPEG 后不会出现黑块
          compressImage(file) {
            return new Promise((resolve, reject) => {
              const url = URL.createObjectURL(file);
              const el = new Image();
              el.onload = () => {
                try {
                  const scale = Math.min(1, IMAGE_MAX_SIDE / Math.max(el.width, el.height));
                  const w = Math.max(1, Math.round(el.width * scale));
                  const h = Math.max(1, Math.round(el.height * scale));
                  const canvas = document.createElement("canvas");
                  canvas.width = w;
                  canvas.height = h;
                  const ctx = canvas.getContext("2d");
                  ctx.fillStyle = "#fff";
                  ctx.fillRect(0, 0, w, h);
                  ctx.drawImage(el, 0, 0, w, h);
                  resolve({ dataUrl: canvas.toDataURL("image/jpeg", IMAGE_QUALITY), w, h });
                } catch (err) {
                  reject(err);
                } finally {
                  URL.revokeObjectURL(url);
                }
              };
              el.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error("图片无法解码"));
              };
              el.src = url;
            });
          },

          // 草稿里移除一张（缩略图右上角按钮）
          removeDraftImage(id) {
            this.draftImages = this.draftImages.filter((im) => im.id !== id);
            this.imgNote = this.draftImages.length
              ? "已添加 " + this.draftImages.length + " 张图片（最多 " + MAX_IMAGES + " 张）"
              : "";
            console.log("[img] 已移除草稿图片", id, "剩余", this.draftImages.length);
          },

          // 已保存任务的图片移除（详情弹窗里点缩略图右上角）：立即落盘
          removeDetailImage(id) {
            const tid = this.detailId;
            if (!tid) return;
            this.todos = this.todos.map((t) =>
              t.id === tid
                ? { ...t, images: (t.images || []).filter((im) => im.id !== id) }
                : t
            );
            const updated = this.todos.find((t) => t.id === tid);
            if (updated) this.detail = this.buildDetail(updated);
            console.log("[img] 已移除任务图片", id);
            this.persistTodos();
          },

          // ===== AI 添加任务：一句话描述 / 图片 → 标题 + 描述 =====
          get aiDisabled() {
            const hasText = !!String(this.aiDraft || "").trim();
            // 正在压缩图片时也不允许发起识别（那会儿图片还没进草稿）
            return this.aiLoading || this.imgBusy || (!hasText && !this.draftImages.length);
          },

          get aiButtonLabel() {
            if (this.aiLoading) {
              return this.draftImages.length ? "AI 识别中…" : "AI 生成中…";
            }
            return this.draftImages.length ? "AI 识别图片" : "AI 生成";
          },

          get aiButtonIcon() {
            return this.draftImages.length ? "mdi:image-search" : "mdi:creation";
          },

          // AI 助手按需加载并缓存（预览环境里 /mz/ai/main.js 由能力桥替身接管）
          async getAssistant() {
            if (this._assistant) return this._assistant;
            const mod = await load("/mz/ai/main.js");
            this._assistant = mod.getAssistant();
            return this._assistant;
          },

          // 把模型回复解析成 { title, desc }：优先按 JSON 解，失败则按多行文本回退
          parseAiReply(content) {
            const text = String(content || "").trim();
            if (!text) return null;
            // 容忍模型自作主张加上的 ```json 代码块围栏
            const cleaned = text
              .replace(/^```[a-zA-Z]*\s*/, "")
              .replace(/```$/, "")
              .trim();
            const start = cleaned.indexOf("{");
            const end = cleaned.lastIndexOf("}");
            if (start !== -1 && end > start) {
              try {
                const obj = JSON.parse(cleaned.slice(start, end + 1));
                const title = String(obj.title || obj.name || "").trim();
                const desc = String(obj.desc || obj.description || "").trim();
                if (title || desc) {
                  return {
                    // kind = image：图里没有可提取的文字（模型判定），图片作为附件带入
                    kind: obj.kind === "image" ? "image" : "task",
                    title: title || desc.split("\n")[0],
                    desc,
                  };
                }
              } catch (err) {
                console.warn("[ai] 回复不是合法 JSON，回退到多行文本解析", err);
              }
            }
            // 回退：就当模型直接给了多行文本（首行标题、其余描述）
            return this.parseDraft(cleaned);
          },

          async generateWithAi() {
            const raw = String(this.aiDraft || "").trim();
            const imgs = this.draftImages;
            if (this.aiLoading) return;
            if (!raw && !imgs.length) return;
            this.aiLoading = true;
            this.aiError = "";
            this.aiNote = imgs.length ? "AI 正在识别图片里的文字…" : "AI 正在整理标题和描述…";
            console.log("[ai] 请求生成任务，文本长度", raw.length, "图片", imgs.length, "张");
            try {
              const assistant = await this.getAssistant();
              const messages = [
                { role: "system", content: imgs.length ? AI_IMAGE_SYSTEM_PROMPT : AI_SYSTEM_PROMPT },
              ];
              if (imgs.length) {
                // 有图片时走多模态：content 用 [文字, 图片…] 数组（OpenAI 兼容格式）
                const content = [
                  { type: "text", text: raw || "请识别图片里的内容，整理成待办任务。" },
                ];
                for (const im of imgs) {
                  content.push({ type: "image_url", image_url: { url: im.dataUrl } });
                }
                messages.push({ role: "user", content });
              } else {
                messages.push({ role: "user", content: raw });
              }
              const res = await assistant.chat({ messages });
              const parsed = this.parseAiReply(res && res.content);
              if (!parsed || !parsed.title) throw new Error("AI 返回内容无法解析");
              // 回填到上方输入框：保持“第一行标题、其余为描述”的既有格式，用户可再改
              this.draft = parsed.desc
                ? parsed.title + "\n" + parsed.desc
                : parsed.title;
              if (!imgs.length) {
                this.aiNote = "AI 已生成，确认或改一改再点「添加」";
              } else if (parsed.kind === "image") {
                this.aiNote = "图片里没有可提取的文字，已作为图片附件带入（点「添加」保存）";
              } else {
                this.aiNote = "已从图片文字里提取任务，确认或改一改再点「添加」（图片会一起附上）";
              }
              console.log(
                "[ai] 生成完成，kind =",
                parsed.kind || "task",
                "标题 =",
                parsed.title,
                "描述长度 =",
                (parsed.desc || "").length,
                "模型 =",
                res && res.model
              );
            } catch (err) {
              this.aiNote = "";
              this.aiError =
                "AI 生成失败：" + (err && err.message ? err.message : String(err));
              console.error("[ai] 生成失败", err);
            } finally {
              this.aiLoading = false;
            }
          },

          // 多行输入解析：第一个非空行 = 标题，其后所有行（含内部换行）= 描述
          parseDraft(raw) {
            const lines = String(raw || "").split(/\r?\n/);
            const firstIdx = lines.findIndex((l) => l.trim());
            if (firstIdx === -1) return null;
            const title = lines[firstIdx].trim();
            const desc = lines
              .slice(firstIdx + 1)
              .join("\n")
              .trim();
            return { title, desc };
          },

          // 多行输入提交：回车与「添加」按钮都走这里，成功后关闭弹窗
          submitAdd() {
            const ok = this.addTodo();
            if (ok) this.addOpen = false;
          },

          // 备注：输入框是多行（回车 = 换行），因此只能点「添加」按钮提交，不用 on:change(失焦提交)。
          // 归档 / 垃圾殲生命周期（同一条目上互斥）：列表 →（已完成 + 归档已完成）→ 归档
          //   →（取消归档）→ 列表；列表 / 归档 →（删除倒计时）→ 垃圾桶 →（还原）→ 列表。
          addTodo() {
            const parsed = this.parseDraft(this.draft);
            if (!parsed) return false;
            const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            this.todos = [
              {
                id,
                text: parsed.title,
                desc: parsed.desc,
                groupId: this.draftGroupId,
                done: false,
                createdAt: Date.now(),
                statusChangedAt: null,
                archivedAt: null,
                pinnedAt: null,
                deletedAt: null,
                pendingDeleteAt: null,
                // 图片附件：把弹窗里已压缩好的草稿原样带走
                images: this.draftImages.slice(),
              },
              ...this.todos,
            ];
            const imgCount = this.draftImages.length;
            this.draft = "";
            this.draftImages = [];
            this.imgNote = "";
            console.log(
              "[todo] 新增",
              id,
              parsed.title,
              parsed.desc ? "（含描述）" : "",
              imgCount ? "（含 " + imgCount + " 张图片）" : "",
              "分组 =",
              this.draftGroupId
            );
            this.persistTodos();
            return true;
          },

          // ===== 置顶 =====
          // 置顶项排在列表最前（listTodos），且拖拽时**只能在置顶项之间换位**
          //（普通项同理只能在普通项之间换位，由 dragDropPosition 把落点夹回同类区间保证）
          isPinned(todo) {
            return !!todo.pinnedAt;
          },

          pinButtonIconName(todo) {
            return todo.pinnedAt ? "mdi:pin" : "mdi:pin-outline";
          },

          pinButtonTitle(todo) {
            return todo.pinnedAt
              ? "取消置顶"
              : "置顶（置顶的排在列表最前，且只能在置顶项之间拖动排序）";
          },

          togglePin(id) {
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) return;
            if (todo.pinnedAt) {
              // 取消置顶：留在原位（pin 时它被挪到了数组头部，于是它成为普通区里的第一条）
              this.todos = this.todos.map((t) =>
                t.id === id ? { ...t, pinnedAt: null } : t
              );
              console.log("[pin] 取消置顶", id, todo.text);
            } else {
              // 置顶：挪到数组头部 → 它成为置顶区里的第一条（显示在列表最上方）
              const now = Date.now();
              this.todos = [
                { ...todo, pinnedAt: now },
                ...this.todos.filter((t) => t.id !== id),
              ];
              console.log("[pin] 已置顶", id, todo.text);
            }
            this.persistTodos();
          },

          // ===== 拖拽排序（仅「全部」列表视图）=====
          // 交互模型：拖动过程中**不改变数据**，只显示落点指示线 + 目标行描边；
          // 松手（pointerup）时才真正把条目插到落点并落盘——避免“边拖边跳”的突兀感。
          // 置顶约束：落点被夹回被拖项的同类区间，所以置顶项只会和置顶项换位、普通项只会和普通项换位
          isDragging(id) {
            return this.draggingId === id;
          },

          isDropBefore(id) {
            return !!this.draggingId && this.dropBeforeId === id;
          },

          isDropAfter(id) {
            return !!this.draggingId && this.dropAfterId === id;
          },

          dragHandleTitle(todo) {
            return "按住拖动调整顺序：" + (todo.text || "（无标题）");
          },

          // pointerdown 起手：拖动与结束都挂在 window（指针离开手柄也能继续跟）
          startDrag(ev, id) {
            if (ev && ev.button !== undefined && ev.button !== 0) return;
            if (ev && ev.preventDefault) ev.preventDefault();
            const source = this.todos.find((t) => t.id === id);
            if (!source) return;
            const handleEl = ev && ev.target;
            this.draggingId = id;
            let moved = false;
            // 落点（松手时用）：显示序里的插入下标（0..行数）
            let dropInsertIdx = null;
            console.log("[drag] 开始拖拽", id, source.text);

            const onMove = (e) => {
              const pos = this.dragDropPosition(e.clientY, handleEl);
              if (!pos) return;
              moved = true;
              this.dropBeforeId = pos.beforeId;
              this.dropAfterId = pos.afterId;
              dropInsertIdx = pos.insertIdx;
            };

            const onEnd = () => {
              window.removeEventListener("pointermove", onMove);
              window.removeEventListener("pointerup", onEnd);
              window.removeEventListener("pointercancel", onEnd);
              this.draggingId = null;
              this.dropBeforeId = null;
              this.dropAfterId = null;
              if (!moved) {
                console.log("[drag] 未移动，顺序不变", id);
                return;
              }
              this.commitDragDrop(id, dropInsertIdx);
            };

            window.addEventListener("pointermove", onMove);
            window.addEventListener("pointerup", onEnd);
            window.addEventListener("pointercancel", onEnd);
          },

          // 算出指针位置的落点：{ insertIdx, beforeId, afterId }。
          //   insertIdx = 显示序（listTodos）里的插入下标（0..行数），松手时用它真正换位
          //   beforeId / afterId = 只用于视觉指示（线画在该行上边 / 下边，由行自己的伪元素画）
          // **置顶约束在这里落地**：算出插入点后把它夹回被拖项的同类区间
          //（置顶项 only 置顶区、普通项 only 普通区），这样两类之间永远拖不进去。
          // 只比较行的几何位置，**不产生任何坐标**——所以不存在“坐标系不一致导致线跑偏”的问题。
          // 注意：不能用 elementFromPoint（从 document 出发穿不过页面 shadow），
          // 也不能用 itemEl.parentElement 当列表容器——.item 的直接父节点是 <o-fill>（display: contents，rect 全为 0）
          dragDropPosition(clientY, handleEl) {
            const src = handleEl && handleEl.closest ? handleEl.closest(".item") : null;
            const listEl = src && src.closest ? src.closest(".list") : null;
            if (!listEl) return null;
            const nodes = Array.prototype.slice.call(
              listEl.querySelectorAll(".item")
            );
            const rows = [];
            for (const node of nodes) {
              const rid = node.getAttribute("data-id");
              if (!rid) continue;
              const r = node.getBoundingClientRect();
              rows.push({
                id: rid,
                pinned: node.classList.contains("pinned"),
                bottom: r.bottom,
                mid: r.top + r.height / 2,
              });
            }
            if (!rows.length) return null;

            // 第一步：按指针所在行的上 / 下半区算出显示序里的插入下标
            //（上半区 → 插到这行之前；下半区 → 插到下一行之前；末尾下方 → 追加末尾）
            let at = rows.length;
            for (let i = 0; i < rows.length; i++) {
              const row = rows[i];
              if (clientY < row.mid) {
                at = i;
                break;
              }
              if (clientY <= row.bottom) {
                at = i + 1;
                break;
              }
            }

            // 第二步：夹回同类区间（置顶项只能在置顶项之间换位，普通项同理）
            const dragging = this.todos.find((t) => t.id === this.draggingId);
            const cls = !!(dragging && dragging.pinnedAt);
            let first = -1;
            let last = -1;
            for (let i = 0; i < rows.length; i++) {
              if (rows[i].pinned === cls) {
                if (first === -1) first = i;
                last = i;
              }
            }
            if (first === -1) return null;
            at = Math.min(Math.max(at, first), last + 1);

            // 第三步：落点线仍画在目标行的边缘上（同类区间内）
            if (at <= last) {
              return { insertIdx: at, beforeId: rows[at].id, afterId: null };
            }
            return { insertIdx: last + 1, beforeId: null, afterId: rows[last].id };
          },

          // 松手时提交：按「显示序」换位（index 是 listTodos 里的插入下标），
          // 再把新的显示序写回 todos 数组里“当前范围列表条目”所占的槽位——
          // 其它条目（其它分组 / 归档 / 垃圾桶）原地不动，也不会被重排。
          // 置顶约束已在 dragDropPosition 里夹好，这里只做同类区间内的插入
          commitDragDrop(id, insertIdx) {
            const list = this.listTodos;
            const from = list.findIndex((t) => t.id === id);
            if (from === -1) {
              console.error("[drag] 找不到被拖条目", id);
              return false;
            }
            if (typeof insertIdx !== "number") return false;
            const next = list.slice();
            const [moving] = next.splice(from, 1);
            // 抽出自身后，原插入下标 > from 的都要左移一位
            const at = insertIdx > from ? insertIdx - 1 : insertIdx;
            if (at === from) {
              console.log("[drag] 落点仍是原位，顺序不变", id);
              return false;
            }
            next.splice(at, 0, moving);

            // 槽位回写：把显示序依次填入这些条目原来在 todos 里的位置
            const ids = new Set(next.map((t) => t.id));
            const queue = next.slice();
            this.todos = this.todos.map((t) => (ids.has(t.id) ? queue.shift() : t));
            console.log(
              "[drag] 已放下，",
              id,
              "移到第",
              at + 1,
              "位",
              moving.pinnedAt ? "（置顶区）" : "（普通区）"
            );
            this.persistTodos();
            return true;
          },

          toggleTodo(id) {
            const now = Date.now();
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, done: !t.done, statusChangedAt: now } : t
            );
            const cur = this.todos.find((t) => t.id === id);
            console.log("[todo] 切换完成态", id, "→", cur ? cur.done : "已不存在");
            this.persistTodos();
          },

          // 时间戳格式化：今年内只显示 月-日 时:分，跨年补上年份
          formatTime(ts) {
            if (typeof ts !== "number") return "未知";
            const d = new Date(ts);
            if (Number.isNaN(d.getTime())) return "未知";
            const p = (n) => String(n).padStart(2, "0");
            const md = p(d.getMonth() + 1) + "-" + p(d.getDate());
            const hm = p(d.getHours()) + ":" + p(d.getMinutes());
            const date =
              d.getFullYear() === new Date().getFullYear()
                ? md
                : d.getFullYear() + "-" + md;
            return date + " " + hm;
          },

          // 列表项副标题：分组名 · [倒计时状态 > 垃圾桶状态 > 创建 / 状态变更时间]
          timeMeta(todo) {
            const g = this.groupName(todo.groupId);
            if (todo.pendingDeleteAt) {
              return (
                g +
                " · " +
                this.pendingSeconds(todo) +
                " 秒后移入垃圾桶（点撤销按钮可撤销）"
              );
            }
            if (todo.deletedAt) {
              return (
                g +
                " · 删除于 " +
                this.formatTime(todo.deletedAt) +
                " · " +
                (todo.createdAt
                  ? "创建于 " + this.formatTime(todo.createdAt)
                  : "创建时间未知")
              );
            }
            if (todo.archivedAt) {
              // 归档项只显示「完成于」与「创建于」：归档时刻不在这里露出（点开详情能看到），
              // 这样副标题更短；归档分组本就按完成时刻划分，条目上有完成时间就能对上
              const parts = [g];
              if (typeof todo.statusChangedAt === "number") {
                parts.push("完成于 " + this.formatTime(todo.statusChangedAt));
              }
              parts.push(
                todo.createdAt
                  ? "创建于 " + this.formatTime(todo.createdAt)
                  : "创建时间未知"
              );
              return parts.join(" · ");
            }
            const parts = [
              g,
              todo.createdAt
                ? "创建于 " + this.formatTime(todo.createdAt)
                : "创建时间未知",
            ];
            if (todo.statusChangedAt) {
              parts.push(
                (todo.done ? "完成于 " : "恢复于 ") +
                  this.formatTime(todo.statusChangedAt)
              );
            }
            return parts.join(" · ");
          },

          isPending(todo) {
            return !!todo.pendingDeleteAt;
          },

          pendingSeconds(todo) {
            if (!todo.pendingDeleteAt) return 0;
            const now = this.nowTick || Date.now();
            return Math.max(
              0,
              Math.ceil((TRASH_DELAY_MS - (now - todo.pendingDeleteAt)) / 1000)
            );
          },

          // 同一个删除按钮的图标名：倒计时中显示「撤销」图标，否则是关闭图标
          deleteButtonIconName(todo) {
            return todo.pendingDeleteAt ? "mdi:reply" : "mdi:close";
          },

          deleteButtonTitle(todo) {
            return todo.pendingDeleteAt ? "撤销删除" : "删除（5 秒后移入垃圾桶）";
          },

          // 同一个按钮两种语义：倒计时中再点一次 = 撤销
          handleDeleteClick(id) {
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) return;
            if (todo.pendingDeleteAt) this.cancelPendingDelete(id);
            else this.startPendingDelete(id);
          },

          startPendingDelete(id) {
            const now = Date.now();
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, pendingDeleteAt: now } : t
            );
            this.nowTick = now;
            console.log("[trash] 开始删除倒计时", id, TRASH_DELAY_MS + "ms");
            this.persistTodos();
            this.startTicker();
          },

          cancelPendingDelete(id) {
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, pendingDeleteAt: null } : t
            );
            console.log("[trash] 已撤销删除", id);
            this.persistTodos();
          },

          // 自终止的轮询：没有倒计时条目时不再调度，避免常驻定时器
          startTicker() {
            if (this._tickId) return;
            const step = () => {
              this._tickId = null;
              const pending = this.todos.filter((t) => t.pendingDeleteAt);
              if (!pending.length) return;
              const now = Date.now();
              this.nowTick = now;
              const due = new Set(
                pending
                  .filter((t) => now - t.pendingDeleteAt >= TRASH_DELAY_MS)
                  .map((t) => t.id)
              );
              if (due.size) {
                this.todos = this.todos.map((t) =>
                  due.has(t.id)
                    ? { ...t, pendingDeleteAt: null, deletedAt: Date.now() }
                    : t
                );
                console.log("[trash] 倒计时结束，移入垃圾桶", [...due]);
                this.persistTodos();
              }
              if (this.todos.some((t) => t.pendingDeleteAt)) {
                this._tickId = setTimeout(step, TICK_MS);
              }
            };
            this._tickId = setTimeout(step, TICK_MS);
          },

          // ===== 已归档视图的分组（全部归档 / 按日期 / 按周） =====
          // 一条归档项的「完成时刻」：done 时的 statusChangedAt（勾选完成就是最后一次状态变更）。
          // 旧数据没有状态变更时间时回退到归档时刻（当时归档的就是刚完成的那些），两者都缺则 null
          completedAt(todo) {
            if (typeof todo.statusChangedAt === "number") return todo.statusChangedAt;
            if (typeof todo.archivedAt === "number") return todo.archivedAt;
            return null;
          },

          setArchiveGroupMode(mode) {
            if (!["all", "day", "week"].includes(mode)) return;
            this.archiveGroupMode = mode;
            console.log(
              "[archive] 归档查看方式 →",
              mode,
              "（day/week 按任务完成时刻分组）"
            );
            this.saveSessionState();
          },

          // 本地日期 key：YYYY-MM-DD（按本机时区切分，不用 UTC，避免凌晨归档被算到前一天）
          dateKey(ts) {
            const d = new Date(ts);
            const p = (n) => String(n).padStart(2, "0");
            return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
          },

          monthDayText(d) {
            const p = (n) => String(n).padStart(2, "0");
            return p(d.getMonth() + 1) + "-" + p(d.getDate());
          },

          // 一个「完成时刻」（见 completedAt）属于哪个分组：返回 { key, label }
          //   day  → key = "dYYYY-MM-DD"，label 形如「10-09 周四」
          //   week → key = "wYYYY-MM-DD"（该周周一），label 形如「2026 年第 41 周 · 10-05 ~ 10-11」
          archiveBucket(ts) {
            if (typeof ts !== "number" || Number.isNaN(new Date(ts).getTime())) {
              // 完成时间未知（旧数据）：单独兜底一组，key 以 0 开头（字典序最小）所以排在最后
              return { key: "0-unknown", label: "完成时间未知" };
            }
            const d = new Date(ts);
            if (this.archiveGroupMode === "week") {
              const dow = (d.getDay() + 6) % 7; // 周一 = 0
              const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
              const end = new Date(
                start.getFullYear(),
                start.getMonth(),
                start.getDate() + 6
              );
              const iso = this.isoWeek(start.getTime());
              return {
                key: "w" + this.dateKey(start.getTime()),
                label:
                  iso.year +
                  " 年第 " +
                  iso.week +
                  " 周 · " +
                  this.monthDayText(start) +
                  " ~ " +
                  this.monthDayText(end),
              };
            }
            const weekday = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"][
              d.getDay() === 0 ? 6 : d.getDay() - 1
            ];
            const yearText =
              d.getFullYear() === new Date().getFullYear() ? "" : d.getFullYear() + "-";
            return {
              key: "d" + this.dateKey(ts),
              label: yearText + this.monthDayText(d) + " " + weekday,
            };
          },

          // ISO 周序号：取该周周四所在的年份 + 周数（跨年周不至于算错）
          isoWeek(ts) {
            const d = new Date(ts);
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            const week = Math.ceil(
              ((date.getTime() - yearStart.getTime()) / 86400000 + 1) / 7
            );
            return { year: date.getUTCFullYear(), week };
          },

          // 归档已完成：把当前分组范围内（「全部任务」下即整个列表）的已完成项收进归档；
          // 垃圾桶里的、倒计时中的、其它分组的、已归档的都不动
          archiveDone() {
            const scope = this.groupFilter;
            const now = Date.now();
            let n = 0;
            this.todos = this.todos.map((t) => {
              if (t.deletedAt || t.pendingDeleteAt || t.archivedAt || !t.done) return t;
              if (scope !== "all" && t.groupId !== scope) return t;
              n += 1;
              return { ...t, archivedAt: now };
            });
            console.log("[archive] 归档已完成，范围 =", scope, "，归档", n, "项");
            if (n) this.persistTodos();
          },

          // 取消归档：回到原分组 / 原完成状态（勾选状态保留）
          unarchiveTodo(id) {
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, archivedAt: null } : t
            );
            console.log("[archive] 已取消归档", id);
            this.persistTodos();
          },

          restoreTodo(id) {
            // 一并清掉 archivedAt：归档项被删进垃圾桶后还原，应当回到列表而不是回归档
            this.todos = this.todos.map((t) =>
              t.id === id
                ? { ...t, deletedAt: null, pendingDeleteAt: null, archivedAt: null }
                : t
            );
            console.log("[trash] 已还原", id);
            this.persistTodos();
          },

          // 彻底删除：一律先弹二次确认
          purgeTodo(id) {
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) return;
            this.purgeTarget = id;
            this.confirmKind = "purge";
            this.confirmTitle = "彻底删除这一条？";
            this.confirmText =
              "“" + todo.text + "”将被永久删除，无法还原。";
