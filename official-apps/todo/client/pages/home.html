<template page>
  <style>
    :host {
      display: block;
      /* 必须是滚动容器：o-router fix-body 给自身 shadow 写死了 overflow:hidden，
         若这里不自己滚动，长列表超出视口的部分会被裁掉且无法滚到 */
      height: 100%;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 28px 16px 56px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { margin: 0; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .top .add-btn { flex: none; }
    /* 注意：不要在这里覆盖 st-input / st-textarea 的 display（组件默认 inline-flex，内部原生控件靠 flex 撑满），
       只给宽度与最小高度即可，否则真实可输入区域会缩成组件默认宽度 */
    .dialog-field { width: 100%; min-height: 7.5em; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--md-sys-color-surface-variant);
    }
    .item .body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer; /* 点正文区打开详情弹窗 */
    }
    .item .text { word-break: break-word; line-height: 1.4; }
    /* 列表里的描述摘要：最多两行，超出截断（详情弹窗里看全文） */
    .item .desc {
      font-size: 13px;
      line-height: 1.4;
      color: var(--md-sys-color-on-surface-variant);
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item .meta {
      font-size: 12px;
      line-height: 1.3;
      color: var(--md-sys-color-on-surface-variant);
    }
    .item.done .text {
      text-decoration: line-through;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* 倒计时待删：错误容器色提示"马上要被删掉了"，给撤销留出视觉空间 */
    .item.pending {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .item.pending .meta { color: var(--md-sys-color-on-error-container); }
    .item.pending .desc { color: var(--md-sys-color-on-error-container); }
    .item.trash { background: var(--md-sys-color-surface); border: 1px dashed var(--md-sys-color-outline-variant); }
    .trash-tip {
      margin: 0;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .empty {
      text-align: center;
      padding: 36px 0;
      color: var(--md-sys-color-on-surface-variant);
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding-top: 12px;
    }
    .count { font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
    /* 条件隐藏：详情弹窗里按条目状态显隐不同操作按钮 */
    .hidden { display: none !important; }
    .detail {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 300px;
      max-width: 460px;
    }
    .detail-desc {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .detail-row { display: flex; gap: 10px; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
    .detail-row .k { flex: none; width: 72px; }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/textarea/textarea.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button-group.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/checkbox/checkbox.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/dialog/dialog.html"></l-m>

  <div class="wrap">
    <div class="top">
      <div>
        <h1>✅ 待办清单</h1>
        <p class="sub">数据保存在本机，随时关掉再回来都还在。</p>
      </div>
      <st-button class="add-btn" on:click="openAdd">＋ 添加任务</st-button>
    </div>

    <st-button-group>
      <st-button attr:variant="view === 'all' ? 'filled' : 'text'" on:click="setView('all')">全部</st-button>
      <st-button attr:variant="view === 'active' ? 'filled' : 'text'" on:click="setView('active')">未完成</st-button>
      <st-button attr:variant="view === 'done' ? 'filled' : 'text'" on:click="setView('done')">已完成</st-button>
      <st-button attr:variant="view === 'trash' ? 'filled' : 'text'" on:click="setView('trash')">🗑 垃圾桶{{trashBadge}}</st-button>
    </st-button-group>

    <!-- 正常视图：勾选 / 倒计时删除 -->
    <o-if :value="!inTrashView">
      <div class="list">
        <o-fill :value="visibleTodos" fill-key="id">
          <div class="item" class:done="$data.done" class:pending="$host.isPending($data)">
            <st-checkbox attr:checked="$data.done" on:change="$host.toggleTodo($data.id)"></st-checkbox>
            <div class="body" on:click="$host.openDetail($data.id)">
              <span class="text">{{$data.text}}</span>
              <span class="desc" class:hidden="!$data.desc">{{$data.desc}}</span>
              <span class="meta">{{$host.timeMeta($data)}}</span>
            </div>
            <st-icon-button
              attr:title="$host.deleteButtonTitle($data)"
              on:click="$host.handleDeleteClick($data.id)"
            >{{$host.deleteButtonIcon($data)}}</st-icon-button>
          </div>
        </o-fill>
      </div>
    </o-if>

    <!-- 垃圾桶视图：还原 / 彻底删除 -->
    <o-if :value="inTrashView">
      <p class="trash-tip">垃圾桶里的任务不再计入统计；可随时还原，或彻底删除（彻底删除会二次确认）。</p>
      <div class="list">
        <o-fill :value="trashTodos" fill-key="id">
          <div class="item trash">
            <div class="body" on:click="$host.openDetail($data.id)">
              <span class="text">{{$data.text}}</span>
              <span class="desc" class:hidden="!$data.desc">{{$data.desc}}</span>
              <span class="meta">{{$host.timeMeta($data)}}</span>
            </div>
            <st-button variant="text" on:click="$host.restoreTodo($data.id)">还原</st-button>
            <st-icon-button title="彻底删除" on:click="$host.purgeTodo($data.id)">🗑</st-icon-button>
          </div>
        </o-fill>
      </div>
    </o-if>

    <o-if :value="isListEmpty">
      <div class="empty">{{emptyText}}</div>
    </o-if>

    <o-if :value="inTrashView">
      <div class="footer">
        <span class="count">垃圾桶 {{trashTodos.length}} 项</span>
        <st-button
          variant="text"
          color="error"
          on:click="emptyTrash"
          attr:disabled="trashTodos.length === 0"
        >清空垃圾桶</st-button>
      </div>
    </o-if>

    <o-if :value="!inTrashView">
      <div class="footer">
        <span class="count">{{remaining}} 项未完成 · 共 {{activeTodos.length}} 项</span>
        <st-button
          variant="text"
          color="error"
          on:click="clearDone"
          attr:disabled="doneCount === 0"
        >清除已完成</st-button>
      </div>
    </o-if>

    <!-- 添加任务：弹窗内输入 -->
    <st-dialog sync:open="addOpen" auto-close>
      <span slot="headline">添加任务</span>
      <st-textarea
        class="dialog-field"
        rows="4"
        sync:value="draft"
        placeholder="第一行是标题，换行后写的都是描述…"
      ></st-textarea>
      <div slot="actions">
        <st-button variant="text" on:click="closeAdd">取消</st-button>
        <st-button on:click="submitAdd" attr:disabled="!draft.trim()">添加</st-button>
      </div>
    </st-dialog>

    <!-- 任务详情：注意 st-dialog 内不能调 $host.xxx()（弹窗内部 $host 不指向页面），
         所以展示用的文案与标志都在 openDetail 里预计算好，这里只读 detail 的字段 -->
    <st-dialog sync:open="detailOpen" auto-close>
      <span slot="headline">{{detail.title}}</span>
      <div class="detail">
        <p class="detail-desc" class:hidden="!detail.hasDesc">{{detail.desc}}</p>
        <div class="detail-row"><span class="k">状态</span><span>{{detail.statusText}}</span></div>
        <div class="detail-row"><span class="k">创建时间</span><span>{{detail.createdText}}</span></div>
        <div class="detail-row"><span class="k">状态变更</span><span>{{detail.statusChangedText}}</span></div>
        <div class="detail-row"><span class="k">删除时间</span><span>{{detail.deletedText}}</span></div>
      </div>
      <div slot="actions">
        <st-button variant="text" class:hidden="detail.inTrash" on:click="toggleDetailDone">{{detail.doneLabel}}</st-button>
        <st-button variant="text" color="error" class:hidden="detail.inTrash" on:click="deleteFromDetail">删除</st-button>
        <st-button variant="text" class:hidden="!detail.inTrash" on:click="restoreFromDetail">还原</st-button>
        <st-button variant="text" color="error" class:hidden="!detail.inTrash" on:click="purgeFromDetail">彻底删除</st-button>
        <st-button variant="text" on:click="closeDetail">关闭</st-button>
      </div>
    </st-dialog>

    <!-- 彻底删除的二次确认 -->
    <st-dialog sync:open="confirmOpen" auto-close>
      <span slot="headline">{{confirmTitle}}</span>
      <div>{{confirmText}}</div>
      <div slot="actions">
        <st-button variant="text" on:click="closeConfirm">取消</st-button>
        <st-button color="error" on:click="confirmPurge">彻底删除</st-button>
      </div>
    </st-dialog>
  </div>

  <script>
    const STORE_ID = "conjure-todo-app";
    const STORE_KEY = "todos";
    // 删除后的倒计时时长：到点后条目才真正进入垃圾桶
    const TRASH_DELAY_MS = 5000;
    const TICK_MS = 200;

    export default async ({ load }) => {
      const { getStorage } = await load("/nos/storage/main.js");
      const store = getStorage(STORE_ID);
      window.__todoInitCount = (window.__todoInitCount || 0) + 1;
      console.log("[init] 待办页初始化 #" + window.__todoInitCount, "store=", STORE_ID);

      return {
        data: {
          draft: "",
          view: "all",
          todos: [],
          emptyText: "这里还什么都没有，添加第一件事吧 🎉",
          // 倒计时刷新用：每次 tick 写入当前时间，驱动界面重算剩余秒数
          nowTick: 0,
          // 彻底删除的二次确认
          confirmOpen: false,
          confirmTitle: "",
          confirmText: "",
          // 待彻底删除的目标：条目 id 或 "ALL"（清空垃圾桶）
          purgeTarget: null,
          // 添加任务的弹窗
          addOpen: false,
          // 任务详情弹窗：打开时把展示文案与标志全部预计算好
          // （st-dialog 内不能调 $host.xxx()，只能读 data 字段，见模板注释）
          detailOpen: false,
          detail: {
            id: "",
            title: "",
            desc: "",
            hasDesc: false,
            done: false,
            inTrash: false,
            statusText: "",
            createdText: "",
            statusChangedText: "",
            deletedText: "",
            doneLabel: "",
          },
        },

        ready() {
          this.loadTodos();
        },

        proto: {
          // 计算属性必须放在 proto 中（放模块顶层会导致页面模块加载失败）
          get inTrashView() {
            return this.view === "trash";
          },

          // 不在垃圾桶里的（含倒计时中的，它们还没真正删除）
          get activeTodos() {
            return this.todos.filter((t) => !t.deletedAt);
          },

          get trashTodos() {
            return this.todos.filter((t) => t.deletedAt);
          },

          get trashBadge() {
            return this.trashTodos.length ? " " + this.trashTodos.length : "";
          },

          get visibleTodos() {
            if (this.inTrashView) return this.trashTodos;
            const list = this.activeTodos;
            if (this.view === "done") return list.filter((t) => t.done);
            if (this.view === "active") return list.filter((t) => !t.done);
            return list;
          },

          get remaining() {
            return this.activeTodos.filter((t) => !t.done).length;
          },

          get doneCount() {
            return this.activeTodos.filter((t) => t.done).length;
          },

          get isListEmpty() {
            return this.visibleTodos.length === 0;
          },

          async loadTodos() {
            try {
              const saved = await store.getItem(STORE_KEY);
              if (Array.isArray(saved)) {
                this.todos = saved.map((t) => ({
                  id: String(t.id),
                  text: String(t.text || ""),
                  // 描述：标题换行后的内容；旧数据没有，一律空字符串
                  desc: typeof t.desc === "string" ? t.desc : "",
                  done: !!t.done,
                  // 旧数据没有时间字段，保留 null（界面显示“时间未知”），不伪造时间
                  createdAt: typeof t.createdAt === "number" ? t.createdAt : null,
                  statusChangedAt:
                    typeof t.statusChangedAt === "number" ? t.statusChangedAt : null,
                  // 删除相关：deletedAt 非空 = 已在垃圾桶；pendingDeleteAt 非空 = 正处于删除倒计时
                  deletedAt: typeof t.deletedAt === "number" ? t.deletedAt : null,
                  // 倒计时不跨刷新恢复：重新打开时把未完成的倒计时取消，避免“隔夜回来发现被删了”
                  pendingDeleteAt: null,
                }));
              }
              console.log("[storage] 已读取待办，共", this.todos.length, "项");
            } catch (err) {
              console.error("[storage] 读取待办失败", err);
            }
          },

          async persistTodos() {
            try {
              await store.setItem(STORE_KEY, JSON.parse(JSON.stringify(this.todos)));
              console.log("[storage] 已保存待办，共", this.todos.length, "项");
            } catch (err) {
              console.error("[storage] 保存待办失败", err);
            }
          },

          // 打开添加弹窗：开一个新草稿
          openAdd() {
            this.draft = "";
            this.addOpen = true;
            console.log("[todo] 打开添加弹窗");
          },

          closeAdd() {
            this.addOpen = false;
            this.draft = "";
            console.log("[todo] 关闭添加弹窗（未添加）");
          },

          // 多行输入解析：第一个非空行 = 标题，其后所有行（含内部换行）= 描述
          parseDraft(raw) {
            const lines = String(raw || "").split(/\r?\n/);
            const firstIdx = lines.findIndex((l) => l.trim());
            if (firstIdx === -1) return null;
            const title = lines[firstIdx].trim();
            const desc = lines
              .slice(firstIdx + 1)
              .join("\n")
              .trim();
            return { title, desc };
          },

          // 多行输入提交：回车与「添加」按钮都走这里，成功后关闭弹窗
          submitAdd() {
            const ok = this.addTodo();
            if (ok) this.addOpen = false;
          },

          // 备注：输入框是多行（回车 = 换行），因此只能点「添加」按钮提交，不用 on:change(失焦提交)。
          addTodo() {
            const parsed = this.parseDraft(this.draft);
            if (!parsed) return false;
            const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            this.todos = [
              {
                id,
                text: parsed.title,
                desc: parsed.desc,
                done: false,
                createdAt: Date.now(),
                statusChangedAt: null,
                deletedAt: null,
                pendingDeleteAt: null,
              },
              ...this.todos,
            ];
            this.draft = "";
            console.log("[todo] 新增", id, parsed.title, parsed.desc ? "（含描述）" : "");
            this.persistTodos();
            return true;
          },

          toggleTodo(id) {
            const now = Date.now();
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, done: !t.done, statusChangedAt: now } : t
            );
            const cur = this.todos.find((t) => t.id === id);
            console.log("[todo] 切换完成态", id, "→", cur ? cur.done : "已不存在");
            this.persistTodos();
          },

          // 时间戳格式化：今年内只显示 月-日 时:分，跨年补上年份
          formatTime(ts) {
            if (typeof ts !== "number") return "未知";
            const d = new Date(ts);
            if (Number.isNaN(d.getTime())) return "未知";
            const p = (n) => String(n).padStart(2, "0");
            const md = p(d.getMonth() + 1) + "-" + p(d.getDate());
            const hm = p(d.getHours()) + ":" + p(d.getMinutes());
            const date =
              d.getFullYear() === new Date().getFullYear()
                ? md
                : d.getFullYear() + "-" + md;
            return date + " " + hm;
          },

          // 列表项副标题：倒计时状态 > 垃圾桶状态 > 创建 / 状态变更时间
          timeMeta(todo) {
            if (todo.pendingDeleteAt) {
              return (
                "🗑 " +
                this.pendingSeconds(todo) +
                " 秒后移入垃圾桶（点 ↩ 可撤销）"
              );
            }
            if (todo.deletedAt) {
              return (
                "删除于 " +
                this.formatTime(todo.deletedAt) +
                " · " +
                (todo.createdAt
                  ? "创建于 " + this.formatTime(todo.createdAt)
                  : "创建时间未知")
              );
            }
            const parts = [
              todo.createdAt
                ? "创建于 " + this.formatTime(todo.createdAt)
                : "创建时间未知",
            ];
            if (todo.statusChangedAt) {
              parts.push(
                (todo.done ? "完成于 " : "恢复于 ") +
                  this.formatTime(todo.statusChangedAt)
              );
            }
            return parts.join(" · ");
          },

          isPending(todo) {
            return !!todo.pendingDeleteAt;
          },

          pendingSeconds(todo) {
            if (!todo.pendingDeleteAt) return 0;
            const now = this.nowTick || Date.now();
            return Math.max(
              0,
              Math.ceil((TRASH_DELAY_MS - (now - todo.pendingDeleteAt)) / 1000)
            );
          },

          deleteButtonIcon(todo) {
            return todo.pendingDeleteAt ? "↩" : "✕";
          },

          deleteButtonTitle(todo) {
            return todo.pendingDeleteAt ? "撤销删除" : "删除（5 秒后移入垃圾桶）";
          },

          // 同一个按钮两种语义：倒计时中再点一次 = 撤销
          handleDeleteClick(id) {
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) return;
            if (todo.pendingDeleteAt) this.cancelPendingDelete(id);
            else this.startPendingDelete(id);
          },

          startPendingDelete(id) {
            const now = Date.now();
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, pendingDeleteAt: now } : t
            );
            this.nowTick = now;
            console.log("[trash] 开始删除倒计时", id, TRASH_DELAY_MS + "ms");
            this.persistTodos();
            this.startTicker();
          },

          cancelPendingDelete(id) {
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, pendingDeleteAt: null } : t
            );
            console.log("[trash] 已撤销删除", id);
            this.persistTodos();
          },

          // 自终止的轮询：没有倒计时条目时不再调度，避免常驻定时器
          startTicker() {
            if (this._tickId) return;
            const step = () => {
              this._tickId = null;
              const pending = this.todos.filter((t) => t.pendingDeleteAt);
              if (!pending.length) return;
              const now = Date.now();
              this.nowTick = now;
              const due = new Set(
                pending
                  .filter((t) => now - t.pendingDeleteAt >= TRASH_DELAY_MS)
                  .map((t) => t.id)
              );
              if (due.size) {
                this.todos = this.todos.map((t) =>
                  due.has(t.id)
                    ? { ...t, pendingDeleteAt: null, deletedAt: Date.now() }
                    : t
                );
                console.log("[trash] 倒计时结束，移入垃圾桶", [...due]);
                this.persistTodos();
              }
              if (this.todos.some((t) => t.pendingDeleteAt)) {
                this._tickId = setTimeout(step, TICK_MS);
              }
            };
            this._tickId = setTimeout(step, TICK_MS);
          },

          // 只作用于列表中的已完成项：垃圾桶里的和倒计时中的不动（前者等用户自己清，后者等倒计时走完）
          clearDone() {
            const removed = this.doneCount;
            this.todos = this.todos.filter(
              (t) => t.deletedAt || t.pendingDeleteAt || !t.done
            );
            console.log("[todo] 清除已完成，移除", removed, "项");
            this.persistTodos();
          },

          restoreTodo(id) {
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, deletedAt: null, pendingDeleteAt: null } : t
            );
            console.log("[trash] 已还原", id);
            this.persistTodos();
          },

          // 彻底删除：一律先弹二次确认
          purgeTodo(id) {
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) return;
            this.purgeTarget = id;
            this.confirmTitle = "彻底删除这一条？";
            this.confirmText =
              "“" + todo.text + "”将被永久删除，无法还原。";
            this.confirmOpen = true;
            console.log("[trash] 请求彻底删除（待确认）", id);
          },

          emptyTrash() {
            const n = this.trashTodos.length;
            if (!n) return;
            this.purgeTarget = "ALL";
            this.confirmTitle = "清空垃圾桶？";
            this.confirmText = "垃圾桶里的 " + n + " 项将被永久删除，无法还原。";
            this.confirmOpen = true;
            console.log("[trash] 请求清空垃圾桶（待确认），共", n, "项");
          },

          closeConfirm() {
            this.confirmOpen = false;
            this.purgeTarget = null;
          },

          confirmPurge() {
            const target = this.purgeTarget;
            this.confirmOpen = false;
            this.purgeTarget = null;
            if (!target) return;
            const before = this.todos.length;
            if (target === "ALL") {
              this.todos = this.todos.filter((t) => !t.deletedAt);
            } else {
              this.todos = this.todos.filter((t) => t.id !== target);
            }
            console.log("[trash] 彻底删除已确认，移除", before - this.todos.length, "项");
            this.persistTodos();
          },

          // ===== 任务详情 =====
          // 把一条待办转成详情弹窗的展示对象（文案全在这里算好，模板只读字段）
          buildDetail(todo) {
            const timeOr = (ts) =>
              typeof ts === "number" ? this.formatTime(ts) : "—";
            return {
              id: todo.id,
              title: todo.text || "（无标题）",
              desc: todo.desc || "",
              hasDesc: !!todo.desc,
              done: !!todo.done,
              inTrash: !!todo.deletedAt,
              statusText: todo.pendingDeleteAt
                ? "待删除（倒计时中）"
                : todo.deletedAt
                ? "已在垃圾桶"
                : todo.done
                ? "已完成"
                : "未完成",
              createdText: timeOr(todo.createdAt),
              statusChangedText: timeOr(todo.statusChangedAt),
              deletedText: timeOr(todo.deletedAt),
              doneLabel: todo.done ? "标记为未完成" : "标记为已完成",
            };
          },

          openDetail(id) {
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) return;
            this.detail = this.buildDetail(todo);
            this.detailOpen = true;
            console.log("[detail] 打开详情", id, todo.text);
          },

          closeDetail() {
            this.detailOpen = false;
            console.log("[detail] 关闭详情");
          },

          toggleDetailDone() {
            const id = this.detail.id;
            this.toggleTodo(id);
            const cur = this.todos.find((t) => t.id === id);
            // 同步刷新弹窗内容（保持弹窗开着，状态行与按钮文案跟着变）
            if (cur) this.detail = this.buildDetail(cur);
            console.log("[detail] 详情内切换完成态", id);
          },

          deleteFromDetail() {
            const id = this.detail.id;
            this.detailOpen = false;
            // 与列表上的 ✕ 同一语义：若已在倒计时中则撤销
            this.handleDeleteClick(id);
          },

          restoreFromDetail() {
            const id = this.detail.id;
            this.detailOpen = false;
            this.restoreTodo(id);
          },

          purgeFromDetail() {
            const id = this.detail.id;
            this.detailOpen = false;
            this.purgeTodo(id);
          },

          setView(value) {
            console.log("[todo] 切换筛选", value);
            this.view = value;
            this.emptyText =
              value === "trash"
                ? "垃圾桶是空的 🗑"
                : value === "done"
                ? "还没有完成的任务"
                : value === "active"
                ? "太棒了，没有未完成的任务 🎉"
                : "这里还什么都没有，添加第一件事吧 🎉";
          },
        },
      };
    };
  </script>
</template>
