            this.confirmOpen = true;
            console.log("[trash] 请求彻底删除（待确认）", id);
          },

          emptyTrash() {
            // 只清「当前分组范围」里看得见的那些：与底栏「垃圾桶 N 项」口径一致，
            // 不会出现“底栏说 0 项、按钮却清掉了别的分组条目”的意外
            const scope = this.groupFilter;
            const n = this.scopedTrashTodos.length;
            if (!n) return;
            this._purgeScope = scope;
            this.purgeTarget = "ALL";
            this.confirmKind = "purge";
            this.confirmTitle =
              scope === "all"
                ? "清空垃圾桶？"
                : "清空「" + this.groupName(scope) + "」的垃圾桶？";
            this.confirmText =
              (scope === "all"
                ? "垃圾桶里的 "
                : "「" + this.groupName(scope) + "」垃圾桶里的 ") +
              n +
              " 项将被永久删除，无法还原。";
            this.confirmOpen = true;
            console.log("[trash] 请求清空垃圾桶（待确认），范围 =", scope, "，共", n, "项");
          },

          closeConfirm() {
            this.confirmOpen = false;
            this.purgeTarget = null;
            this.confirmGroupId = null;
            this._purgeScope = null;
          },

          // 确认弹窗的统一入口：按 confirmKind 分发（彻底删除 / 删除分组）
          confirmAction() {
            const kind = this.confirmKind;
            const target = this.purgeTarget;
            const groupId = this.confirmGroupId;
            this.confirmOpen = false;
            this.purgeTarget = null;
            this.confirmGroupId = null;

            if (kind === "deleteGroup") {
              if (groupId) this.deleteGroup(groupId);
              return;
            }

            if (!target) return;
            const before = this.todos.length;
            if (target === "ALL") {
              // 范围在 emptyTrash() 打开确认框时就固定下来（用户可能在弹窗期间切分组）
              const scope = this._purgeScope || "all";
              this._purgeScope = null;
              this.todos = this.todos.filter(
                (t) => !(t.deletedAt && (scope === "all" || t.groupId === scope))
              );
            } else {
              this.todos = this.todos.filter((t) => t.id !== target);
            }
            console.log("[trash] 彻底删除已确认，移除", before - this.todos.length, "项");
            this.persistTodos();
          },

          // ===== 任务详情（查看 + 编辑合一：弹窗里直接改标题 / 描述，点「保存」写回） =====
          // 把一条待办转成详情弹窗的只读元信息（文案全在这里算好，模板只读字段）
          buildDetail(todo) {
            const timeOr = (ts) =>
              typeof ts === "number" ? this.formatTime(ts) : "—";
            // 完成时间可编辑的条件：已勾选完成，且不在垃圾桶（倒计时中也不给改，状态随时会变）
            const doneEditable =
              !!todo.done && !todo.deletedAt && !todo.pendingDeleteAt;
            return {
              // 详情弹窗里的图片快照（模板只读字段）
              images: (todo.images || []).map((im) => ({ id: im.id, dataUrl: im.dataUrl })),
              groupText: this.groupName(todo.groupId),
              statusText: todo.pendingDeleteAt
                ? "待删除（倒计时中）"
                : todo.deletedAt
                ? "已在垃圾桶"
                : todo.archivedAt
                ? "已归档（已完成）"
                : todo.done
                ? "已完成"
                : "未完成",
              createdText: timeOr(todo.createdAt),
              statusChangedText: timeOr(todo.statusChangedAt),
              archivedText: timeOr(todo.archivedAt),
              deletedText: timeOr(todo.deletedAt),
              // 完成时间编辑行：datetime-local 的 value（本地时区 YYYY-MM-DDTHH:mm）
              doneEditable,
              doneAtValue: this.toDatetimeLocal(todo.statusChangedAt),
              // 行内说明：旧数据可能根本没记过完成时间；有值时提醒“留空不改动”
              doneAtHint:
                typeof todo.statusChangedAt === "number"
                  ? "改动即时保存；留空不会删除原时间"
                  : "原数据未记录，可在此补填",
            };
          },

          // 时间戳 → datetime-local 控件的 value（本地时区）；非法值返回空串
          toDatetimeLocal(ts) {
            if (typeof ts !== "number" || Number.isNaN(new Date(ts).getTime())) return "";
            const d = new Date(ts);
            const p = (n) => String(n).padStart(2, "0");
            return (
              d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
              "T" + p(d.getHours()) + ":" + p(d.getMinutes())
            );
          },

          // 详情弹窗里修改完成时间：写回 statusChangedAt 并立即落盘。
          // 归档视图「按完成日 / 按完成周」的分组基准就是它，改完后分组会即时重算。
          // ⚠️ 留空 / 清空一律不做任何修改（不写 null）：编辑时按退格、误选删除都会触发 change，
          // 直接写 null 会把原来的完成时间静默弄丢且无法撤销；这里改成把输入框恢复成原值。
          onDoneAtChange(ev) {
            const id = this.detailId;
            if (!id) return;
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) return;
            const input = ev && ev.target;
            const raw = input ? String(input.value || "") : "";
            const prevTs =
              typeof todo.statusChangedAt === "number" ? todo.statusChangedAt : null;
            const restore = (reason) => {
              if (input) input.value = this.toDatetimeLocal(prevTs);
              this.detail = this.buildDetail(todo);
              console.log("[detail] 完成时间未修改（" + reason + "），保留原值", prevTs);
            };            if (!raw) {
              restore("输入为空");
              return;
            }
            const parsed = new Date(raw);
            if (Number.isNaN(parsed.getTime())) {
              restore("输入无法解析");
              return;
            }
            const ts = parsed.getTime();
            if (ts === prevTs) {
              restore("与原值相同");
              return;
            }
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, statusChangedAt: ts } : t
            );
            const updated = this.todos.find((t) => t.id === id);
            if (updated) this.detail = this.buildDetail(updated);
            console.log("[detail] 修改完成时间", id, raw, "→", ts);
            this.persistTodos();
          },

          // 打开详情：既填好只读元信息，也把多行编辑区预填成当前内容
          // （草稿取原始 text / desc 拼回“首行标题 + 其余描述”，与创建时同一套格式）
          openDetail(id) {
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) return;
            this.detail = this.buildDetail(todo);
            this.detailId = id;
            const draft = todo.desc ? todo.text + "\n" + todo.desc : todo.text || "";
            this.fillEditor(draft);
            // 完成时间输入框用 JS 填（见 syncDoneAtInput 的说明）
            this.syncDoneAtInput(this.detail.doneAtValue);
            this.detailOpen = true;
            console.log("[detail] 打开详情", id, todo.text);
          },

          closeDetail() {
            this.detailOpen = false;
            this.detailId = null;
            this.editDraft = "";
            this.renderEditor([""]);
            console.log("[detail] 关闭详情");
          },

          // ===== 多行编辑区（contenteditable） =====
          // 设计：每行一个 div.rt-line（行内只有文本，空行用 <br> 占位），**所有行样式一致**
          //（曾经的首行 .rt-title 加粗加大已因 bug 多整体去掉，不要再加回）。
          // 数据仍只走 editDraft（多行文本），保存时用 parseDraft 拆回 text / desc。
          editorEl() {
            const page = document.querySelector("o-page");
            const root = page && page.shadowRoot;
            return (root && root.querySelector(".rt-editor")) || null;
          },

          // 详情弹窗里「完成时间」输入框元素
          doneAtInputEl() {
            const page = document.querySelector("o-page");
            const root = page && page.shadowRoot;
            return (
              (root && root.querySelector(".done-at-row input[type=datetime-local]")) ||
              null
            );
          },

          // 把完成时间写进输入框。
          // ⚠️ 必须用 JS 设 property，不能靠 attr:value 绑定：input 的 value 一旦被 JS 改过，
          // attribute 变更就不再同步到 property（脏值标志），换一条任务打开时
          // 会残留上一条的值（老数据无时间时尤其明显），看起来就像“时间乱了 / 丢了”
          syncDoneAtInput(value, tries) {
            const el = this.doneAtInputEl();
            if (!el) {
              if ((tries || 0) < 3) {
                requestAnimationFrame(() =>
                  this.syncDoneAtInput(value, (tries || 0) + 1)
                );
              }
              return;
            }
            el.value = value || "";
          },

          // 视觉行（块级边界即换行）：从 innerText 读，不依赖 DOM 是否规范
          editorLines() {
            const el = this.editorEl();
            if (!el) return [""];
            const raw =
              typeof el.innerText === "string" ? el.innerText : el.textContent || "";
            return raw.replace(/\r/g, "").split("\n");
          },

          // 结构是否规整（只有 .rt-line 子元素，行内除 <br> 外没有元素）——
          // 不规整时才重建，保证普通打字不会动 DOM，光标不跳
          editorStructureOk() {
            const el = this.editorEl();
            if (!el) return true;
            for (const child of Array.from(el.children)) {
              if (child.tagName !== "DIV" || !child.classList.contains("rt-line")) {
                return false;
              }
              for (const n of Array.from(child.childNodes)) {
                if (n.nodeType === 3) continue;
                if (n.nodeType === 1 && n.tagName === "BR") continue;
                return false;
              }
            }
            return true;
          },

          // 重建行结构（行数组 → DOM），并同步空态
          renderEditor(lines) {
            const el = this.editorEl();
            if (!el) return false;
            const list = lines && lines.length ? lines : [""];
            el.textContent = "";
            for (const line of list) {
              const div = document.createElement("div");
              div.className = "rt-line";
              if (line === "") div.appendChild(document.createElement("br"));
              else div.textContent = line;
              el.appendChild(div);
            }
            this.applyEditorEmptyClass(list);
            return true;
          },

          // 空态类：所有行都空白时给编辑区加 is-empty（占位提示靠它显示）
          applyEditorEmptyClass(lines) {
            const el = this.editorEl();
            if (!el) return;
            el.classList.toggle(
              "is-empty",
              (lines && lines.length ? lines : [""]).every(
                (l) => !String(l).trim()
              )
            );
          },

          // 填充内容（打开弹窗 / 程序侧设置时用）；元素还没就绪就等一帧重试
          fillEditor(text, tries) {
            const lines = String(text == null ? "" : text)
              .replace(/\r/g, "")
              .split("\n");
            this.editDraft = lines.join("\n");
            const ok = this.renderEditor(lines);
            if (!ok && (tries || 0) < 3) {
              requestAnimationFrame(() => this.fillEditor(text, (tries || 0) + 1));
            }
            return ok;
          },

          // 把编辑器当前内容同步回 editDraft（普通输入只走这里，不重建 DOM、不改行样式）
          syncEditorDraft() {
            const el = this.editorEl();
            const lines = this.editorLines();
            this.editDraft = lines.join("\n");
            if (!el) return;
            el.classList.toggle("is-empty", lines.every((l) => !l.trim()));
            // 行被删光（剩 0 行）或结构被浏览器改乱时才重建，保住“一个 div = 一行”；
            // 重建前记下光标，重建后放回原处（普通打字不会走到这里）
            if (!el.children.length || !this.editorStructureOk()) {
              const info = this.caretInfo();
              const list = lines.length ? lines : [""];
              this.renderEditor(list);
              if (info && info.lineIndex >= 0) {
                this.focusEditor(info.lineIndex, info.offset);
              } else {
                this.focusEditor(list.length - 1, list[list.length - 1].length);
              }
            }
          },

          // 当前光标位置（第几行 / 行内第几个字符）；不在编辑器内返回 null
          caretInfo() {
            const el = this.editorEl();
            const sel = window.getSelection ? window.getSelection() : null;
            if (!el || !sel || !sel.rangeCount) return null;
            const range = sel.getRangeAt(0);
            if (!el.contains(range.startContainer)) return null;
            let node = range.startContainer;
            if (node.nodeType === 3) node = node.parentElement;
            let lineEl = node;
            while (lineEl && lineEl !== el && !lineEl.classList.contains("rt-line")) {
              lineEl = lineEl.parentElement;
            }
            const kids = Array.from(el.children);
            const lineIndex = lineEl && lineEl !== el ? kids.indexOf(lineEl) : -1;
            if (lineIndex < 0) return { lineIndex: -1, offset: 0 };
            let offset = 0;
            try {
              const pre = range.cloneRange();
              pre.selectNodeContents(lineEl);
              pre.setEnd(range.startContainer, range.startOffset);
              offset = pre.toString().replace(/\n/g, "").length;
            } catch (err) {
              console.warn("[editor] 计算光标偏移失败", err);
            }
            return { lineIndex, offset };
          },

          // 把光标放到第 lineIndex 行的第 offset 个字符处
          focusEditor(lineIndex, offset) {
            const el = this.editorEl();
            if (!el) return;
            const kids = Array.from(el.children);
            if (!kids.length) return;
            const idx = Math.min(Math.max(0, lineIndex || 0), kids.length - 1);
            const lineEl = kids[idx];
            const tn = Array.from(lineEl.childNodes).find((n) => n.nodeType === 3);
            const range = document.createRange();
            if (tn) {
              const off = Math.min(Math.max(0, offset || 0), tn.length);
              range.setStart(tn, off);
              range.setEnd(tn, off);
            } else {
              range.selectNodeContents(lineEl);
              range.collapse(false);
            }
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            if (typeof el.focus === "function") el.focus();
          },

          // 普通输入：只同步草稿与样式，不重建 DOM（光标稳定、不打断输入法）
          onEditorInput() {
            if (this._editorComposing) return;
            this.syncEditorDraft();
          },

          onEditorCompositionStart() {
            this._editorComposing = true;
          },

          onEditorCompositionEnd() {
            this._editorComposing = false;
            this.syncEditorDraft();
          },

          // 回车 = 新起一行（自己拆，不靠浏览器插 <div>/<br>，行结构才能始终可控）；
          // 输入法组合中的回车（确认候选）不拦
          onEditorKeydown(ev) {
            if (ev.isComposing || ev.keyCode === 229) return;
            if (ev.key !== "Enter") return;
            ev.preventDefault();
            const info = this.caretInfo();
            const lines = this.editorLines();
            const idx =
              info && info.lineIndex >= 0
                ? info.lineIndex
                : Math.max(0, lines.length - 1);
            const text = lines[idx] || "";
            const off = info && info.lineIndex >= 0 ? Math.min(info.offset, text.length) : text.length;
            const next = [
              ...lines.slice(0, idx),
              text.slice(0, off),
              text.slice(off),
              ...lines.slice(idx + 1),
            ];
            this.editDraft = next.join("\n");
            this.renderEditor(next);
            this.focusEditor(idx + 1, 0);
            console.log("[editor] 回车拆行，现共", next.length, "行");
          },

          // 粘贴：只要纯文本（不把外部 HTML 带进来），多行则拆成多行
          onEditorPaste(ev) {
            const dt = ev.clipboardData;
            const text = dt && dt.getData ? dt.getData("text/plain") : null;
            if (text == null) return;
            ev.preventDefault();
            const lines = this.editorLines();
            const info = this.caretInfo();
            const idx =
              info && info.lineIndex >= 0
                ? info.lineIndex
                : Math.max(0, lines.length - 1);
            const cur = lines[idx] || "";
            const off = info && info.lineIndex >= 0 ? Math.min(info.offset, cur.length) : cur.length;
            const merged = (cur.slice(0, off) + text + cur.slice(off))
              .replace(/\r/g, "")
              .split("\n");
            const next = [...lines.slice(0, idx), ...merged, ...lines.slice(idx + 1)];
            this.editDraft = next.join("\n");
            this.renderEditor(next);
            const endLine = idx + merged.length - 1;
            this.focusEditor(endLine, merged[merged.length - 1].length);
            console.log("[editor] 粘贴纯文本，现共", next.length, "行");
          },

          // 点盒子空白处（padding）也能把光标放回编辑区末尾
          onEditorBoxClick(ev) {
            const el = this.editorEl();
            if (!el || el.contains(ev.target)) return;
            const lines = this.editorLines();
            this.focusEditor(lines.length - 1, lines[lines.length - 1].length);
          },

          // 草稿的解析结果（第一个非空行 = 标题，其余 = 描述）；全空时返回 null
          get editParsed() {
            return this.parseDraft(this.editDraft);
          },

          // 有标题才能保存（与添加弹窗的「添加」禁用口径一致）
          get editCanSave() {
            return !!this.editParsed;
          },

          // 保存：把编辑器内容拆回 text / desc（不动分组、勾选状态与各时间戳），写回后关闭弹窗
          submitEditDetail() {
            const id = this.detailId;
            // 以编辑器真实内容为准（万一有没同步到草稿的变更）
            if (this.editorEl()) this.syncEditorDraft();
            const parsed = this.parseDraft(this.editDraft);
            if (!parsed) return;
            const todo = this.todos.find((t) => t.id === id);
            if (!todo) {
              console.error("[detail] 保存失败，任务已不存在", id);
              return;
            }
            this.todos = this.todos.map((t) =>
              t.id === id ? { ...t, text: parsed.title, desc: parsed.desc } : t
            );
            console.log(
              "[detail] 已保存编辑",
              id,
              "标题 =",
              parsed.title,
              "描述长度 =",
              parsed.desc.length
            );
            this.detailOpen = false;
            this.detailId = null;
            this.editDraft = "";
            this.renderEditor([""]);
            this.persistTodos();
          },

          // ===== 分组 =====
          groupName(id) {
            const g = this.groups.find((x) => x.id === id);
            return g ? g.name : DEFAULT_GROUP_NAME;
          },

          groupCountText(id) {
            // 只数列表里的任务（归档与垃圾桶都不计，与统计口径一致）
            const n = this.todos.filter(
              (t) => t.groupId === id && !t.deletedAt && !t.archivedAt
            ).length;
            return n + " 项";
          },

          isGroupActive(id) {
            return this.groupFilter === id;
          },

          setGroup(id) {
            this.groupFilter = id;
            console.log("[group] 切换分组过滤 →", id, this.groupName(id));
            this.updateEmptyText();
            this.saveSessionState();
          },

          // 打开「新建分组」弹窗
          openAddGroup() {
            this.editingGroupId = null;
            this.groupDraft = "";
            this.groupDialogOpen = true;
            console.log("[group] 打开新建分组弹窗");
          },

          // 分组行右侧「更多」按钮的 title（图标按钮无文字，必须给无障碍名称）
          groupMenuTitle(name) {
            return "分组操作：" + name;
          },

          // 默认分组不可删（行内菜单的「删除」据此置灰）
          isDefaultGroup(id) {
            return id === DEFAULT_GROUP_ID;
          },

          // 打开「改名」弹窗（预填原名）
          openRenameGroup(id) {
            const g = this.groups.find((x) => x.id === id);
            if (!g) return;
            this.editingGroupId = id;
            this.groupDraft = g.name;
            this.groupDialogOpen = true;
            console.log("[group] 打开改名弹窗", id, g.name);
          },

          closeGroupDialog() {
            this.groupDialogOpen = false;
            this.editingGroupId = null;
            this.groupDraft = "";
            console.log("[group] 关闭分组弹窗（未保存）");
          },

          // 新建 / 保存改名（同一个入口：编辑模式时是改名），成功后关闭弹窗
          submitGroup() {
            const raw = (this.groupDraft || "").trim();
            if (!raw) return;
            if (this.editingGroupId) {
              const id = this.editingGroupId;
              this.groups = this.groups.map((g) =>
                g.id === id ? { ...g, name: raw } : g
              );
              console.log("[group] 重命名分组", id, "→", raw);
              this.editingGroupId = null;
            } else {
              // 重名时自动加序号，避免列表里出现两个同名分组
              let name = raw;
              let i = 2;
              while (this.groups.some((g) => g.name === name)) {
                name = raw + " " + i;
                i += 1;
              }
              const id =
                "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
              this.groups = [...this.groups, { id, name }];
              console.log("[group] 新建分组", id, name);
            }
            this.groupDraft = "";
            this.editingGroupId = null;
            this.groupDialogOpen = false;
            this.persistGroups();
          },

          // 删除分组：默认分组不可删，其余先二次确认
          requestDeleteGroup(id) {
            const g = this.groups.find((x) => x.id === id);
            if (!g || id === DEFAULT_GROUP_ID) return;
            const n = this.todos.filter(
              (t) => t.groupId === id && !t.deletedAt && !t.archivedAt
            ).length;
            this.purgeTarget = null;
            this.confirmKind = "deleteGroup";
            this.confirmGroupId = id;
            this.confirmTitle = "删除分组「" + g.name + "」？";
            this.confirmText = n
              ? "该分组下的 " +
                n +
                " 项任务会移入「" +
                DEFAULT_GROUP_NAME +
                "」，分组本身被删除。"
              : "该分组下没有任务，删除后不可恢复。";
            this.confirmOpen = true;
            console.log("[group] 请求删除分组（待确认）", id, n, "项任务");
          },

          deleteGroup(id) {
            const g = this.groups.find((x) => x.id === id);
            if (!g || id === DEFAULT_GROUP_ID) return;
            const moved = this.todos.filter((t) => t.groupId === id).length;
            this.todos = this.todos.map((t) =>
              t.groupId === id ? { ...t, groupId: DEFAULT_GROUP_ID } : t
            );
            this.groups = this.groups.filter((x) => x.id !== id);
            if (this.groupFilter === id) this.groupFilter = "all";
            this.saveSessionState();
            if (this.editingGroupId === id) {
              this.editingGroupId = null;
              this.groupDraft = "";
              this.groupDialogOpen = false;
            }
            console.log("[group] 已删除分组", id, "，移入默认分组的任务", moved, "项");
            this.persistGroups();
            this.persistTodos();
            this.updateEmptyText();
          },

          // 空状态文案：按当前筛选 + 分组生成
          updateEmptyText() {
            // 归档 / 垃圾桶视图也跟随分组，空状态文案要带上分组名，
            // 否则用户会以为“归档全丢了”，其实是当前分组里没有
            const gName = this.groupFilter === "all" ? "" : "「" + this.groupName(this.groupFilter) + "」的";
            if (this.view === "trash") {
              this.emptyText =
                gName + "垃圾桶是空的 🗑" +
                (this.groupFilter === "all" ? "" : "，切到「全部任务」可以看到所有分组的条目");
              return;
            }
            if (this.view === "archived") {
              this.emptyText =
                gName +
                "归档箱是空的 📦 勾选已完成的任务，再点右上角「归档已完成」就会收进这里" +
                (this.groupFilter === "all" ? "" : "；左栏选「全部任务」可查看所有分组的归档");
              return;
            }
            if (this.groupFilter !== "all") {
              const name = this.groupName(this.groupFilter);
              this.emptyText = "「" + name + "」里还没有任务，点右上角添加吧";
              return;
            }
            this.emptyText = "左侧选个分组，或者在「全部任务」里查看所有事项 🎉";
          },

          setView(value) {
            console.log("[todo] 切换筛选", value);
            this.view = value;
            this.updateEmptyText();
            this.saveSessionState();
          },
        },
      };
    };
  </script>
</template>
