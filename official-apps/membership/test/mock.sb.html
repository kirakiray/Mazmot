<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>membership lib/mock.js 单元测试</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
  </head>
  <body>
    <sb-test name="邮箱 / 用户名校验">
      <template>
        <script type="module">
          import { isValidEmail, isValidUsername } from "../lib/mock.js";
          {
            const emailOk = ["a@b.co", "yao@mazmot.dev"].every(isValidEmail);
            const emailBad = ["", "abc", "a@b", "a @b.co"].some(isValidEmail);
            const nameOk = ["abc", "user_01", "a-b-c", "A1B2C3"].every(
              isValidUsername,
            );
            const nameBad = ["ab", "has space", "中文名", "a".repeat(21)].some(
              isValidUsername,
            );
            return {
              assert: emailOk && !emailBad && nameOk && !nameBad,
              content: { emailOk, emailBad, nameOk, nameBad },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="邮箱脱敏保留域名">
      <template>
        <script type="module">
          import { maskEmail } from "../lib/mock.js";
          {
            const masked = maskEmail("abcdef@gmail.com");
            const single = maskEmail("a@x.io");
            const invalid = maskEmail("no-at-sign");
            return {
              assert:
                masked === "ab***@gmail.com" &&
                single === "a***@x.io" &&
                invalid === "no-at-sign",
              content: { masked, single, invalid },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="演示验证码只认 111111（忽略首尾空白）">
      <template>
        <script type="module">
          import { checkVerifyCode, MOCK_VERIFY_CODE } from "../lib/mock.js";
          {
            const ok = checkVerifyCode(" 111111 ");
            const wrong = checkVerifyCode("123456");
            const empty = checkVerifyCode("");
            return {
              assert:
                MOCK_VERIFY_CODE === "111111" && ok && !wrong && !empty,
              content: { ok, wrong, empty },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="套餐：月度 $10 / 年度 $100，未知 id 回退月度">
      <template>
        <script type="module">
          import {
            MEMBER_PLANS,
            DEFAULT_PLAN_ID,
            getPlan,
          } from "../lib/mock.js";
          {
            const monthly = getPlan("monthly");
            const yearly = getPlan("yearly");
            const fallback = getPlan("no-such-plan");
            return {
              assert:
                MEMBER_PLANS.length === 2 &&
                DEFAULT_PLAN_ID === "monthly" &&
                monthly.priceUSD === 10 &&
                monthly.durationDays === 30 &&
                yearly.priceUSD === 100 &&
                yearly.durationDays === 365 &&
                fallback.id === "monthly",
              content: { monthly, yearly, fallbackId: fallback.id },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="Stripe 虚拟支付：测试卡通过，非法卡信息拒绝">
      <template>
        <script type="module">
          import { MOCK_PAYMENT, isValidMockCard } from "../lib/mock.js";
          {
            const testCard = MOCK_PAYMENT.testCard;
            const ok = isValidMockCard(testCard);
            const noSpace = isValidMockCard({
              number: "4242424242424242",
              expiry: "12/34",
              cvc: "123",
            });
            const badNumber = isValidMockCard({ ...testCard, number: "4242" });
            const badExpiry = isValidMockCard({ ...testCard, expiry: "12-34" });
            const badCvc = isValidMockCard({ ...testCard, cvc: "12" });
            return {
              assert:
                MOCK_PAYMENT.provider === "stripe" &&
                ok &&
                noSpace &&
                !badNumber &&
                !badExpiry &&
                !badCvc,
              content: { ok, noSpace, badNumber, badExpiry, badCvc },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="月度会员记录：30 天有效期 + 本地时间订单号">
      <template>
        <script type="module">
          import { createMockMembership, formatDate } from "../lib/mock.js";
          {
            const now = new Date(2026, 0, 1, 10, 0, 0).getTime();
            const record = createMockMembership({
              planId: "monthly",
              email: " yao@mazmot.dev ",
              username: " yao ",
              now,
            });
            const days = (record.expireAt - record.startAt) / (24 * 60 * 60 * 1000);
            return {
              assert:
                record.planId === "monthly" &&
                record.priceUSD === 10 &&
                days === 30 &&
                record.email === "yao@mazmot.dev" &&
                record.username === "yao" &&
                record.orderId === "MOCK-20260101100000" &&
                formatDate(record.expireAt) === "2026-01-31",
              content: { record, expireText: formatDate(record.expireAt) },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="年度会员记录：365 天有效期 + 价格 $100">
      <template>
        <script type="module">
          import { createMockMembership, formatDate } from "../lib/mock.js";
          {
            const now = new Date(2026, 0, 1, 10, 0, 0).getTime();
            const record = createMockMembership({
              planId: "yearly",
              email: "yao@mazmot.dev",
              username: "yao",
              now,
            });
            const oneYear = 365 * 24 * 60 * 60 * 1000;
            return {
              assert:
                record.planId === "yearly" &&
                record.priceUSD === 100 &&
                record.expireAt - record.startAt === oneYear &&
                record.planName.cn.includes("年度") &&
                record.planName.en.includes("Yearly") &&
                formatDate(record.expireAt) === "2027-01-01",
              content: { record, expireText: formatDate(record.expireAt) },
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
