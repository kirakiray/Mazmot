  <script>
    export default async ({ load }) => {
      const { getLocaleText } = await load("/nos/locale-text/get-locale-text.js");
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@main/packages/snackbar/toast.js",
      );
      const { getStorage } = await load("/nos/storage/main.js");
      const { getUser } = await load("/nos/user/main.js");
      const {
        MEMBER_PLAN,
        checkVerifyCode,
        createMockMembership,
        formatDate,
        isValidEmail,
        isValidUsername,
        maskEmail,
      } = await load("../lib/mock.js");

      const memberStore = getStorage("mazmot-membership");
      const MEMBERSHIP_KEY = "current";

      const L10N = {
        emailPlaceholder: { cn: "请输入邮箱地址", en: "Enter your email address" },
        usernamePlaceholder: {
          cn: "3-20 位字母、数字、下划线或短横线",
          en: "3-20 letters, digits, underscores or dashes",
        },
        emailHint: {
          cn: "验证码会发送到该邮箱；验证通过后，这个邮箱就与你的会员绑定。",
          en: "The code goes to this address — once verified, this email is bound to your membership.",
        },
        usernameHint: {
          cn: "验证通过后，会用它改写本地默认用户的用户名。",
          en: "After verification this becomes your local default user's username.",
        },
        emailInvalid: { cn: "请输入有效的邮箱地址", en: "Enter a valid email address" },
        usernameInvalid: {
          cn: "用户名需为 3-20 位字母、数字、下划线或短横线",
          en: "Username must be 3-20 letters, digits, underscores or dashes",
        },
        codePlaceholder: { cn: "请输入 6 位验证码", en: "Enter the 6-digit code" },
        mockCodeText: {
          cn: "演示验证码固定为 111111",
          en: "Demo verification code is always 111111",
        },
        wrongCode: {
          cn: "验证码不正确，演示验证码是 111111",
          en: "Wrong code. The demo code is 111111",
        },
        copyUserIdTitle: { cn: "复制用户 ID", en: "Copy user ID" },
        userIdCopied: { cn: "用户 ID 已复制", en: "User ID copied" },
        copyFailed: { cn: "复制失败，请手动复制", en: "Copy failed, please copy manually" },
      };
      const t = (key) => {
        const item = L10N[key];
        return item ? getLocaleText(item) : key;
      };

      const planPerks = getLocaleText({
        cn: MEMBER_PLAN.perks.cn.join(" · "),
        en: MEMBER_PLAN.perks.en.join(" · "),
      });

      return {
        data: {
          step: "form",
          planName: getLocaleText(MEMBER_PLAN.name),
          planPerks,
          planPrice: `¥${MEMBER_PLAN.priceCNY}`,
          perYearText: getLocaleText({ cn: "/ 年", en: "/ year" }),

          // 已有会员记录（来自本地存储，纯展示）
          hasMembership: false,
          currentMembershipText: "",

          // 步骤 1
          email: "",
          username: "",
          emailPlaceholder: t("emailPlaceholder"),
          usernamePlaceholder: t("usernamePlaceholder"),
          emailHint: t("emailHint"),
          usernameHint: t("usernameHint"),
          emailError: "",
          usernameError: "",
          formValid: false,

          // 步骤 2
          code: "",
          codePlaceholder: t("codePlaceholder"),
          codeError: "",
          codeSentText: "",
          mockCodeText: t("mockCodeText"),
          verifying: false,

          // 步骤 3
          donePlanName: "",
          doneEmail: "",
          doneExpireText: "",
          doneOrderId: "",
          doneUsername: "",
          doneUserId: "",
          copyUserIdTitle: t("copyUserIdTitle"),
        },

        async ready() {
          await this.loadCurrentMembership();
        },

        proto: {
          async loadCurrentMembership() {
            try {
              const record = await memberStore.getItem(MEMBERSHIP_KEY);
              if (!record || !record.expireAt) return;
              this.hasMembership = true;
              this.currentMembershipText = getLocaleText(
                {
                  cn: `当前会员有效期至 ${formatDate(record.expireAt)}`,
                  en: `Current membership valid until ${formatDate(record.expireAt)}`,
                },
              );
              // 预填上次绑定的邮箱与用户名，方便再次购买
              if (record.email) this.email = record.email;
              if (record.username) this.username = record.username;
              this.refreshFormValid();
            } catch (err) {
              console.warn("[membership] 读取本地会员记录失败：", err);
            }
          },

          refreshFormValid() {
            this.formValid =
              isValidEmail(this.email) && isValidUsername(this.username);
          },

          onEmailInput(event) {
            this.email = event.target.value;
            this.emailError = "";
            this.refreshFormValid();
          },

          onUsernameInput(event) {
            this.username = event.target.value;
            this.usernameError = "";
            this.refreshFormValid();
          },

          goVerify() {
            this.emailError = "";
            this.usernameError = "";

            let valid = true;
            if (!isValidEmail(this.email)) {
              this.emailError = t("emailInvalid");
              valid = false;
            }
            if (!isValidUsername(this.username)) {
              this.usernameError = t("usernameInvalid");
              valid = false;
            }
            if (!valid) {
              this.refreshFormValid();
              return;
            }

            this.code = "";
            this.codeError = "";
            this.codeSentText = getLocaleText({
              cn: `验证码已发送至 ${maskEmail(this.email.trim())}（演示环境不会真的发信）。`,
              en: `A code was sent to ${maskEmail(this.email.trim())} (nothing is really sent in this demo).`,
            });
            this.step = "code";
          },

          onCodeInput(event) {
            this.code = event.target.value;
            this.codeError = "";
          },

          backToForm() {
            this.codeError = "";
            this.step = "form";
          },

          async verifyCode() {
            if (this.verifying) return;
            if (!checkVerifyCode(this.code)) {
              this.codeError = t("wrongCode");
              return;
            }
            this.verifying = true;
            try {
              // 验证通过：拿默认用户，把用户名改成这里填写的值
              const user = await getUser("default");
              await user.updateInfo({ username: this.username.trim() });
              const info = await user.getInfo();

              const purchase = createMockMembership({
                email: this.email.trim(),
                username: this.username.trim(),
              });
              await memberStore.setItem(MEMBERSHIP_KEY, purchase);

              this.donePlanName = getLocaleText(purchase.planName);
              this.doneEmail = purchase.email;
              this.doneExpireText = formatDate(purchase.expireAt);
              this.doneOrderId = purchase.orderId;
              this.doneUsername = info.username || this.username.trim();
              this.doneUserId = info.subject || user.userId || "";
              this.hasMembership = true;
              this.currentMembershipText = getLocaleText({
                cn: `当前会员有效期至 ${formatDate(purchase.expireAt)}`,
                en: `Current membership valid until ${formatDate(purchase.expireAt)}`,
              });
              this.step = "done";

              this.emit("membership-purchased", {
                data: {
                  email: purchase.email,
                  username: this.doneUsername,
                  userId: this.doneUserId,
                  orderId: purchase.orderId,
                  expireAt: purchase.expireAt,
                },
                bubbles: true,
                composed: true,
              });
            } catch (err) {
              console.error("[membership] 开通会员失败：", err);
              toast({
                message: getLocaleText(
                  { cn: "开通失败：{msg}", en: "Purchase failed: {msg}" },
                  { msg: err.message || err },
                ),
                color: "error",
              });
            } finally {
              this.verifying = false;
            }
          },

          async copyUserId() {
            if (!this.doneUserId) return;
            try {
              await navigator.clipboard.writeText(this.doneUserId);
              toast({ message: t("userIdCopied"), color: "success" });
            } catch (err) {
              toast({ message: t("copyFailed"), color: "error" });
            }
          },

          finish() {
            this.emit("membership-close", { bubbles: true, composed: true });
          },
        },
      };
    };
  </script>
</template>
