    <!-- 已有会员（服务端 binding） -->
    <o-if :value="hasBinding">
      <div class="status-card">
        <n-icon icon="mdi:check-decagram-outline"></n-icon>
        <div class="status-body">
          <div class="status-title">{{boundPlanName}}</div>
          <div class="status-sub">{{boundStatusText}}</div>
          <div class="status-sub" class:error="!localKeyBound">
            <o-if :value="localKeyBound">
              <locale-text><span lang="cn">中转 key 已在本地 AI 配置中。</span><span lang="en">Relay key is already in your local AI config.</span></locale-text>
            </o-if>
            <o-if :value="!localKeyBound">
              <locale-text><span lang="cn">本机没有找到这个中转 key，可一键找回并重新绑定。</span><span lang="en">The relay key is missing on this device — restore it in one click.</span></locale-text>
            </o-if>
          </div>
        </div>
        <!-- 本机已有 key（登录/购买时已自动写入）就不需要手动找回，按钮仅在其缺失时出现 -->
        <o-if :value="!localKeyBound">
          <st-button
            variant="outlined"
            attr:disabled="rebinding"
            on:click="rebindKey"
          >
            <n-icon icon="mdi:key-plus" slot="prefix"></n-icon>
            <locale-text><span lang="cn">找回 key</span><span lang="en">Restore key</span></locale-text>
          </st-button>
        </o-if>
      </div>
    </o-if>

    <!-- 会员账号概览：直接读 /v1/usage、/v1/models（用邀请码里的 bearkey），
         安装成独立应用后也能看到当前账号的用量与可用模型 -->
    <o-if :value="hasBinding">
      <div class="usage-card" data-testid="member-usage">
        <div class="usage-head">
          <span>
            <locale-text><span lang="cn">会员账号概览</span><span lang="en">Membership account</span></locale-text>
          </span>
          <div class="usage-quota">
            <span>
              <locale-text><span lang="cn">额度 </span><span lang="en">Quota </span></locale-text>{{usageQuotaText}}
            </span>
            <st-button
              variant="text"
              attr:disabled="usageLoading"
              on:click="loadMemberUsage"
            >
              <locale-text><span lang="cn">刷新</span><span lang="en">Refresh</span></locale-text>
            </st-button>
          </div>
        </div>

        <o-if :value="usageLoading">
          <div class="usage-empty">
            <locale-text><span lang="cn">正在读取用量…</span><span lang="en">Loading usage…</span></locale-text>
          </div>
        </o-if>
        <o-if :value="usageError">
          <div class="usage-error" data-testid="member-usage-error">{{usageError}}</div>
        </o-if>

        <o-if :value="memberUsage">
          <div class="usage-grid">
            <div class="usage-stat">
              <b>{{usageUsedText}}</b>
              <span><locale-text><span lang="cn">已用 tokens</span><span lang="en">Tokens used</span></locale-text></span>
            </div>
            <div class="usage-stat">
              <b>{{usageRemainingText}}</b>
              <span><locale-text><span lang="cn">剩余 tokens</span><span lang="en">Tokens left</span></locale-text></span>
            </div>
            <div class="usage-stat">
              <b>{{usageRequestsText}}</b>
              <span><locale-text><span lang="cn">总请求</span><span lang="en">Requests</span></locale-text></span>
            </div>
          </div>
          <div class="usage-bar">
            <div :style.width="usagePercent + '%'"></div>
          </div>
          <div class="usage-models">
            <o-if :value="usageModels.length > 0">
              <o-fill :value="usageModels">
                <span class="model-chip">{{$data}}</span>
              </o-fill>
            </o-if>
            <o-if :value="usageModels.length === 0">
              <span class="usage-empty">
                <locale-text><span lang="cn">暂无可用模型</span><span lang="en">No models available</span></locale-text>
              </span>
            </o-if>
          </div>
        </o-if>
      </div>
    </o-if>

    <!-- 已安装应用打开（非引导购买流程）：只展示账号概览，续费需要用户主动展开流程 -->
    <o-if :value="hasBinding && !showPurchaseFlow">
      <div class="dashboard-actions">
        <st-button variant="outlined" on:click="startRenewal">
          <n-icon icon="mdi:refresh" slot="prefix"></n-icon>
          <locale-text><span lang="cn">续费 / 更换套餐</span><span lang="en">Renew / change plan</span></locale-text>
        </st-button>
      </div>
    </o-if>

    <o-if :value="showPurchaseFlow">
    <div class="steps">
      <div
        class="step-item"
        class:active="step === 'form'"
        class:done="step !== 'form'"
      >
        <span class="step-num">1</span>
        <span><locale-text><span lang="cn">邮箱</span><span lang="en">Email</span></locale-text></span>
      </div>
      <div
        class="step-item"
        class:active="step === 'code'"
        class:done="step === 'pay' || step === 'done'"
      >
        <span class="step-num">2</span>
        <span><locale-text><span lang="cn">验证邮箱</span><span lang="en">Verify</span></locale-text></span>
      </div>
      <div
        class="step-item"
        class:active="step === 'pay'"
        class:done="step === 'done'"
      >
        <span class="step-num">3</span>
        <span><locale-text><span lang="cn">支付</span><span lang="en">Pay</span></locale-text></span>
      </div>
      <div class="step-item" class:active="step === 'done'">
        <span class="step-num">4</span>
        <span><locale-text><span lang="cn">完成</span><span lang="en">Done</span></locale-text></span>
      </div>
    </div>

    <!-- ===== 步骤 1：邮箱 / 用户名 ===== -->
    <o-if :value="step === 'form'">
      <section class="benefits">
        <div class="benefits-title">
          <n-icon icon="mdi:diamond-stone"></n-icon>
          <locale-text><span lang="cn">购买会员后拥有</span><span lang="en">Included with membership</span></locale-text>
        </div>
        <o-fill :value="benefits" fill-key="title">
          <div class="benefit">
            <n-icon class="benefit-icon" attr:icon="$data.icon"></n-icon>
            <div>
              <div class="benefit-title">{{$data.title}}</div>
              <div class="benefit-desc">{{$data.desc}}</div>
            </div>
          </div>
        </o-fill>
      </section>
      <section class="card">
        <h2 class="card-title">
          <locale-text><span lang="cn">第 1 步 · 邮箱</span><span lang="en">Step 1 · Email</span></locale-text>
        </h2>
        <div class="field">
          <label class="field-label"><locale-text><span lang="cn">邮箱</span><span lang="en">Email</span></locale-text></label>
          <st-input
            sync:value="email"
            type="email"
            attr:placeholder="emailPlaceholder"
            on:input="onEmailInput"
          ></st-input>
          <div class="field-hint">{{emailHint}}</div>
          <o-if :value="emailError">
            <div class="field-error">{{emailError}}</div>
          </o-if>
        </div>
        <div class="field terms-field">
          <div class="agree-row">
            <input
              type="checkbox"
              id="agree-check"
              data-testid="agree-checkbox"
              on:change="onAgreeChange"
            />
            <label for="agree-check" class="agree-text">
              <locale-text>
                <span lang="cn">我已阅读并同意</span>
                <span lang="en">I have read and agree to the</span>
              </locale-text>
            </label>
            <a
              class="terms-link"
              data-testid="terms-link"
              on:click="openTermsDialog"
            ><locale-text><span lang="cn">《用户使用条款》</span><span lang="en">Terms of Use</span></locale-text></a>
          </div>
          <o-if :value="agreeError">
            <div class="field-error">{{agreeError}}</div>
          </o-if>
        </div>
        <div class="actions">
          <st-button color="primary" attr:disabled="!formValid || sending" on:click="goCode">
            <n-icon icon="mdi:email-fast-outline" slot="prefix"></n-icon>
            <o-if :value="!sending">
              <locale-text><span lang="cn">下一步，获取验证码</span><span lang="en">Next, send code</span></locale-text>
            </o-if>
            <o-if :value="sending">
              <locale-text><span lang="cn">发送中...</span><span lang="en">Sending...</span></locale-text>
            </o-if>
          </st-button>
        </div>
      </section>
    </o-if>

    <!-- ===== 步骤 2：验证码 ===== -->
    <o-if :value="step === 'code'">
      <section class="card">
        <h2 class="card-title">
          <locale-text><span lang="cn">第 2 步 · 验证邮箱</span><span lang="en">Step 2 · Verify email</span></locale-text>
        </h2>
        <o-if :value="rebindNotice">
          <div class="rebind-notice" data-testid="rebind-notice">{{rebindNotice}}</div>
        </o-if>
        <p class="card-desc">{{codeSentText}}</p>
        <o-if :value="mockCodeHint">
          <div class="mock-code">
            <n-icon icon="mdi:flask-outline"></n-icon>
            <span>{{mockCodeHint}}</span>
          </div>
        </o-if>
        <div class="resend-row">
          <o-if :value="resendLeft > 0">
            <span class="resend-wait"><locale-text><span lang="cn">{{resendLeft}} 秒后可重新发送</span><span lang="en">Resend available in {{resendLeft}}s</span></locale-text></span>
          </o-if>
          <o-if :value="!resendLeft">
            <st-button variant="text" attr:disabled="sending" on:click="resendCode">
              <locale-text><span lang="cn">重新发送验证码</span><span lang="en">Resend code</span></locale-text>
            </st-button>
          </o-if>
        </div>
        <div class="field">
          <label class="field-label"><locale-text><span lang="cn">验证码</span><span lang="en">Verification code</span></locale-text></label>
          <st-input
            sync:value="code"
            maxlength="6"
            inputmode="numeric"
            attr:placeholder="codePlaceholder"
            on:input="onCodeInput"
          ></st-input>
          <o-if :value="codeError">
            <div class="field-error">{{codeError}}</div>
          </o-if>
        </div>
        <div class="actions">
          <st-button variant="text" on:click="backToForm">
            <n-icon icon="mdi:arrow-left" slot="prefix"></n-icon>
            <locale-text><span lang="cn">上一步</span><span lang="en">Back</span></locale-text>
          </st-button>
          <st-button color="primary" attr:disabled="verifying || !code" on:click="verifyCode">
            <n-icon icon="mdi:arrow-right" slot="prefix"></n-icon>
            <o-if :value="!verifying">
              <locale-text><span lang="cn">验证并继续支付</span><span lang="en">Verify and continue</span></locale-text>
            </o-if>
            <o-if :value="verifying">
              <locale-text><span lang="cn">验证中...</span><span lang="en">Verifying...</span></locale-text>
            </o-if>
          </st-button>
        </div>
      </section>
    </o-if>

    <!-- ===== 步骤 3：套餐 + 支付 ===== -->
    <o-if :value="step === 'pay'">
      <section class="card">
        <h2 class="card-title">
          <locale-text><span lang="cn">第 3 步 · 支付</span><span lang="en">Step 3 · Payment</span></locale-text>
        </h2>
        <o-if :value="waitingPayment">
          <div class="rebind-notice" data-testid="pay-waiting">
            <locale-text>
              <span lang="cn">已打开 Stripe 支付页面，完成支付后本页会自动检测并进入下一步。若浏览器拦截了新窗口，请允许弹窗后重试。</span>
              <span lang="en">The Stripe checkout window has been opened. This page will detect your payment automatically. If the popup was blocked, allow popups and try again.</span>
            </locale-text>
          </div>
        </o-if>
        <div class="plans">
          <div class="plans-head">
            <span class="plans-title"><locale-text><span lang="cn">选择套餐</span><span lang="en">Choose a plan</span></locale-text></span>
            <span class="plan-perks">{{planPerks}}</span>
          </div>
          <div class="plan-options">
            <button
              class="plan-option"
              class:selected="planId === 'monthly'"
              on:click="pickPlan('monthly')"
            >
              <span class="plan-option-top">
                <span class="plan-option-name">{{monthlyName}}</span>
              </span>
              <span class="plan-option-price">
                <o-if :value="monthlyHasDiscount">
                  <s class="plan-option-original">{{monthlyPrice}}</s>
                </o-if>
                {{monthlyFinalPrice}}<span class="plan-option-per">{{monthlyPeriod}}</span>
              </span>
            </button>
            <button
              class="plan-option"
              class:selected="planId === 'annual'"
              on:click="pickPlan('annual')"
            >
              <span class="plan-option-top">
                <span class="plan-option-name">{{annualName}}</span>
                <span class="plan-badge">{{annualBadge}}</span>
              </span>
              <span class="plan-option-price">
                <o-if :value="annualHasDiscount">
                  <s class="plan-option-original">{{annualPrice}}</s>
                </o-if>
                {{annualFinalPrice}}<span class="plan-option-per">{{annualPeriod}}</span>
              </span>
            </button>
          </div>
        </div>
        <o-if :value="!discountFree">
        <div class="pay-method">
          <n-icon class="pay-method-icon" icon="mdi:credit-card-outline"></n-icon>
          <div class="pay-method-body">
            <div class="pay-method-name">
              <span>Stripe</span>
              <span class="pay-method-badge">
                <locale-text><span lang="cn">仅银行卡</span><span lang="en">Card only</span></locale-text>
              </span>
              <span class="pay-method-brands" aria-label="Visa, Mastercard">
                <span class="card-brand">VISA</span>
                <span class="card-brand">Mastercard</span>
              </span>
            </div>
            <div class="pay-method-desc">
              <locale-text>
                <span lang="cn">支持 Visa / Mastercard 等主流信用卡与借记卡；点击支付会打开 Stripe 托管收银台，支付成功后自动开通。</span>
                <span lang="en">Visa / Mastercard and other major credit or debit cards are supported. Paying opens the hosted Stripe checkout and activates membership automatically.</span>
              </locale-text>
            </div>
          </div>
        </div>
        </o-if>
        <o-if :value="!discountFree">
        <div class="pay-card-grid">
          <div class="field">
            <label class="field-label"><locale-text><span lang="cn">卡号</span><span lang="en">Card number</span></locale-text></label>
            <st-input
              sync:value="cardNumber"
              maxlength="19"
              inputmode="numeric"
              attr:placeholder="cardNumberPlaceholder"
              on:input="onCardInput"
            ></st-input>
          </div>
          <div class="field">
            <label class="field-label"><locale-text><span lang="cn">有效期</span><span lang="en">Expiry</span></locale-text></label>
            <st-input
              sync:value="cardExpiry"
              maxlength="5"
              inputmode="numeric"
              attr:placeholder="cardExpiryPlaceholder"
              on:input="onCardInput"
            ></st-input>
          </div>
          <div class="field">
            <label class="field-label">CVC</label>
            <st-input
              sync:value="cardCvc"
              maxlength="4"
              inputmode="numeric"
              attr:placeholder="cardCvcPlaceholder"
              on:input="onCardInput"
            ></st-input>
          </div>
        </div>
        <div class="mock-code">
          <n-icon icon="mdi:flask-outline"></n-icon>
          <span>{{payMockHint}}</span>
        </div>
        </o-if>
        <div class="discount-compact">
          <div class="discount-compact-row">
            <span class="discount-label">
              <locale-text><span lang="cn">优惠码</span><span lang="en">Discount code</span></locale-text>
            </span>
            <st-input
              data-testid="pay-discount-code"
              sync:value="discountCode"
              attr:placeholder="discountPlaceholder"
              on:input="onDiscountInput"
            ></st-input>
            <st-button
              variant="outlined"
              data-testid="pay-discount-apply"
              attr:disabled="discountLoading"
              on:click="applyDiscount"
            >
              {{discountLoading ? discountApplyingText : discountApplyText}}
            </st-button>
            <o-if :value="discountApplied">
              <span class="discount-applied" data-testid="pay-discount-applied">
                {{discountAppliedCode}} · {{discountFoldText}}
              </span>
              <st-button variant="text" data-testid="pay-discount-clear" on:click="clearDiscount">
                ×
              </st-button>
            </o-if>
          </div>
          <o-if :value="discountError">
            <p class="discount-error" data-testid="pay-discount-error">{{discountError}}</p>
          </o-if>
          <o-if :value="discountFree">
            <p class="discount-free" data-testid="pay-discount-free">
              <locale-text>
                <span lang="cn">0 折优惠码：本次免费领取，不需要填写支付信息。</span>
                <span lang="en">100% off: this membership is free — no payment details needed.</span>
              </locale-text>
            </p>
          </o-if>
        </div>
        <div class="actions">
          <span class="pay-total">
            <locale-text><span lang="cn">应付</span><span lang="en">Total</span></locale-text>
            <o-if :value="discountApplied">
              <s class="pay-original" data-testid="pay-original">{{payOriginalText}}</s>
            </o-if>
            <strong>{{payAmountText}}</strong>
            <o-if :value="discountApplied">
              <o-if :value="discountSaveText">
                <span class="discount-applied"> · {{discountSaveText}}</span>
              </o-if>
            </o-if>
          </span>
          <st-button variant="text" on:click="backToCode">
            <n-icon icon="mdi:arrow-left" slot="prefix"></n-icon>
            <locale-text><span lang="cn">上一步</span><span lang="en">Back</span></locale-text>
          </st-button>
          <st-button color="primary" attr:disabled="paying || (discountFree ? false : !payValid)" on:click="payNow">
            <n-icon icon="mdi:lock-outline" slot="prefix"></n-icon>
            <o-if :value="!paying">
              <span>{{payButtonText}}</span>
            </o-if>
            <o-if :value="paying">
              <locale-text><span lang="cn">支付处理中...</span><span lang="en">Processing...</span></locale-text>
            </o-if>
          </st-button>
        </div>
      </section>
    </o-if>

    <!-- ===== 步骤 4：完成 ===== -->
    <o-if :value="step === 'done'">
      <section class="card">
        <div class="success-head">
          <n-icon icon="mdi:check-decagram"></n-icon>
          <div>
            <h2 class="card-title">
              <span>{{doneTitle}}</span>
            </h2>
            <p class="card-desc">
              <locale-text><span lang="cn">会员已开通，中转 key 已写入本地 AI 配置。</span><span lang="en">Membership is active and the relay key is saved in your local AI config.</span></locale-text>
            </p>
          </div>
        </div>

        <div class="kv-list">
          <div class="kv"><span class="k"><locale-text><span lang="cn">会员方案</span><span lang="en">Plan</span></locale-text></span><span class="v">{{donePlanName}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">支付金额</span><span lang="en">Amount</span></locale-text></span><span class="v">{{doneAmountText}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">访问服务器</span><span lang="en">Server</span></locale-text></span><span class="v">{{doneServerText}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">绑定邮箱</span><span lang="en">Bound email</span></locale-text></span><span class="v">{{doneEmail}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">有效期至</span><span lang="en">Valid until</span></locale-text></span><span class="v">{{doneExpireText}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">订单号</span><span lang="en">Order ID</span></locale-text></span><span class="v">{{doneOrderId}}</span></div>
        </div>

        <div class="user-block">
          <div class="user-title">
            <n-icon icon="mdi:key-chain-variant"></n-icon>
            <locale-text><span lang="cn">中转 key（已保存到本地）</span><span lang="en">Relay key (saved locally)</span></locale-text>
          </div>
          <div class="invite-code">{{doneInviteCode}}</div>
        </div>

        <div class="user-block">
          <div class="user-title">
            <n-icon icon="mdi:account-circle-outline"></n-icon>
            <locale-text><span lang="cn">本地用户（default）</span><span lang="en">Local user (default)</span></locale-text>
          </div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">用户名</span><span lang="en">Username</span></locale-text></span><span class="v">{{doneUsername}}</span></div>
          <div class="kv">
            <span class="k"><locale-text><span lang="cn">用户 ID</span><span lang="en">User ID</span></locale-text></span>
            <span class="v id-value">{{doneUserId}}</span>
            <st-icon-button
              style="font-size: 12px"
              attr:disabled="!doneUserId"
              attr:title="copyUserIdTitle"
              on:click="copyUserId"
            >
              <n-icon icon="mdi:content-copy"></n-icon>
            </st-icon-button>
          </div>
        </div>

        <div class="actions">
          <st-button color="primary" on:click="finish">
            <n-icon icon="mdi:check" slot="prefix"></n-icon>
            <locale-text><span lang="cn">完成</span><span lang="en">Done</span></locale-text>
          </st-button>
        </div>
      </section>
    </o-if>
    </o-if>
  </main>

  <!-- 用户使用条款：勾选处下划线链接打开的详细条款 -->
  <st-dialog class="dlg-terms" sync:open="termsOpen">
    <div class="terms-body" data-testid="terms-dialog">
      <h2 class="terms-heading">
        <n-icon icon="mdi:file-document-outline"></n-icon>
        <locale-text><span lang="cn">用户使用条款</span><span lang="en">Terms of Use</span></locale-text>
      </h2>
      <p class="terms-updated">
        <locale-text>
          <span lang="cn">请在购买前仔细阅读本条款。勾选同意即表示您已理解并接受本条款的全部内容。</span>
          <span lang="en">Please read these Terms carefully before purchasing. Checking the box means you have understood and accepted all of them.</span>
        </locale-text>
      </p>

      <div class="terms-scroll">
      <section class="terms-sec">
        <h3><locale-text><span lang="cn">一、服务性质</span><span lang="en">1. Nature of the Service</span></locale-text></h3>

          if (query && query.pay === "return" && this.step === "form") {
            this.step = "pay";
            this.waitingPayment = true;
            try {
              const raw = sessionStorage.getItem("membership-pending-pay");
              if (raw) {
                const saved = JSON.parse(raw);
                if (saved.planId) this.planId = saved.planId;
                if (saved.amountText) {
                  this.pendingAmountText = saved.amountText;
                  this.payAmountText = saved.amountText;
                }
              }

              console.warn("[membership] 读取待支付金额失败：", err);
            }
            this.startPollBinding();
          }
          await this.loadPlans();
          await this.loadBinding();

        detached() {
          if (this._resendTimer) {
            clearInterval(this._resendTimer);
            this._resendTimer = null;
          }
          this.stopPollBinding();
        },

        proto: {
          applyPlans(list) {
            const plans = (list && list.length ? list : FALLBACK_PLANS).filter(
              (plan) => plan.id === "monthly" || plan.id === "annual",
            );
            this.plans = plans.length ? plans : FALLBACK_PLANS;
            const monthly = this.plans.find((plan) => plan.id === "monthly") || FALLBACK_PLANS[0];
            const annual = this.plans.find((plan) => plan.id === "annual") || FALLBACK_PLANS[1];

            this.annualPrice = priceText(annual.price_cents, "USD");

            this.annualPeriod = periodText(annual.billing_interval);

                  cn: `省 ${priceText(annual.savings_cents, "USD")}`,

              ? priceText(this.discountAmountCents, "USD")
              : monthlyOriginal;
            this.annualFinalPrice = this.annualHasDiscount
              ? priceText(this.discountAmountCents, "USD")
              : annualOriginal;
          },

          syncPayAmount() {
            this.syncPlanPrices();
            const plan = this.plans.find((item) => item.id === this.planId) || this.plans[0];
            const originalCents = Number(plan.price_cents) || 0;
            const amountCents = this.discountApplied
              ? Number(this.discountAmountCents) || 0
              : originalCents;

            this.payAmountText = priceText(amountCents, "USD");

              ? t("payFreeButton")
              : getLocaleText({
                  cn: `支付 ${priceText(amountCents, "USD")}`,
                  en: `Pay ${priceText(amountCents, "USD")}`,

              this.resetDiscount(false);
              this.discountError = t("discountPlanChanged");
            }
            this.syncPayAmount();
          },

          startRenewal() {
            this.stopPollBinding();
            this.showPurchaseFlow = true;
            this.step = "form";
            this.ticketId = "";
            this.code = "";
            this.codeError = "";
            this.emailError = "";
            this.sending = false;
            this.verifying = false;
            this.paying = false;
            this.waitingPayment = false;
            this.agreed = false;
            this.agreeError = "";
            this.refreshFormValid();
          },

          resetDiscount(clearInput) {
            this.discountApplied = false;
            this.discountAppliedCode = "";
            this.discountPercent = 100;
            this.discountFoldText = "";
            this.discountFree = false;
            this.discountAmountCents = 0;
            this.discountOriginalCents = 0;
            this.discountSaveText = "";
            this.discountError = "";
            if (clearInput) this.discountCode = "";
            this.payValid = isValidMockCard({
              number: this.cardNumber,
              expiry: this.cardExpiry,
              cvc: this.cardCvc,
            });
            this.syncPayAmount();
          },

          onDiscountInput(event) {
            this.discountCode = event.target.value;
            this.discountError = "";
            if (
              this.discountApplied &&
              this.discountCode.trim().toUpperCase() !== this.discountAppliedCode.toUpperCase()
            ) {
              this.resetDiscount(false);
            }
          },

          clearDiscount() {
            this.resetDiscount(true);
          },

          async applyDiscount() {
            if (this.discountLoading) return;
            const code = String(this.discountCode || "").trim();
            if (!code) {
              this.discountError = t("discountEmpty");
              return;
            }
            if (!this.ticketId) {
              this.discountError = t("discountInvalid");
              return;
            }
            this.discountLoading = true;
            this.discountError = "";
            try {
              const { status, data } = await api.previewDiscount(this.ticketId, this.planId, code);
              if (status === 200 && data && data.ok) {
                this.discountApplied = true;
                this.discountAppliedCode = data.code;
                this.discountCode = data.code;
                this.discountPercent = data.discountPercent;
                this.discountAmountCents = data.amountCents;
                this.discountOriginalCents = data.originalAmountCents;
                this.discountFree = Boolean(data.free);
                this.discountFoldText = data.free
                  ? t("discountFreeLabel")
                  : getLocaleText({
                      cn: `${data.fold} 折`,
                      en: `${100 - Math.round(data.discountPercent)}% off`,
                    });
                this.discountSaveText = data.discountCents
                  ? getLocaleText({
                      cn: `省 ${priceText(data.discountCents, data.currency || "USD")}`,
                      en: `Save ${priceText(data.discountCents, data.currency || "USD")}`,
                    })
                  : "";
                this.payValid = true;
                this.syncPayAmount();
                return;
              }
              console.error("[membership] 优惠码试算失败", {
                url: "POST /api/membership/discount/preview",
                status,
                data,
              });
              this.resetDiscount(false);
              this.discountError =
                (data && data.error && data.error.message) || t("discountInvalid");
            } catch (err) {
              console.error("[membership] 优惠码试算失败（网络层）", err);
              this.resetDiscount(false);
              this.discountError = t("networkError", { msg: err.message || err });
            } finally {
              this.discountLoading = false;
            }
          },

          async loadUser() {
            try {
              const user = await getUser("default");
              const info = await user.getInfo();
              this._user = user;
              this.userId = user.userId || info.subject || "";
              this._bindingAuth = null;
              if (info.username) this.doneUsername = info.username;
            } catch (err) {
              console.error("[membership] 读取本地用户失败：", err);
            }
          },

          // binding 会返回完整邀请码，服务端要求 X-Relay-Auth 证明私钥归属。
          // 60s 内复用同一签名（轮询每 3s 一次，不必每次都签）。
          async bindingAuthHeader() {
            if (!this._user || typeof this._user.sign !== "function") return "";
            const now = Date.now();
            if (this._bindingAuth && now - this._bindingAuth.at < 60_000) {
              return this._bindingAuth.header;
            }
            try {
              const header = await api.relayAuthHeader(
                this._user,
                "GET",
                "/api/membership/binding",
              );
              this._bindingAuth = { header, at: now };
              return header;
            } catch (err) {
              console.warn("[membership] 生成 binding 签名失败：", err);
              return "";
            }
          },

          async loadPlans() {
            try {
              const { status, data } = await api.plans();
              if (status === 200 && data && Array.isArray(data.plans)) {
                this.applyPlans(data.plans);
              }
            } catch (err) {
              console.warn("[membership] 读取套餐失败，使用兜底价格：", err);
            }
          },

          localKeyExists(code) {
            if (!code) return false;
            return ai
              .getApiKeys()
              .some((key) => key.provider === "relay" && key.apiKey === code);
          },

          async loadBinding() {
            if (!this.userId) {
              if (!this.isOnboarding) this.showPurchaseFlow = true;
              return;
            }
            try {
              const { status, data } = await api.binding(this.userId, await this.bindingAuthHeader());
              if (status !== 200 || !data || !data.bound) {
                this.hasBinding = false;
                this.memberUsage = null;
                this.usageModels = [];
                this.showPurchaseFlow = true;
                return;
              }
              this.hasBinding = true;
              if (!this.isOnboarding) this.showPurchaseFlow = false;
              this.boundPlanName = planName(data.member.planId, data.member.planName);
              this.boundStatusText = getLocaleText({
                cn: `绑定邮箱 ${data.member.email} · 有效期至 ${formatDate(data.member.expiresAt)}`,
                en: `Bound to ${data.member.email} · valid until ${formatDate(data.member.expiresAt)}`,
              });
              this.boundInviteCode = data.relay.inviteCode;
              this.localKeyBound = this.localKeyExists(this.boundInviteCode);
              if (!this.email) this.email = data.member.email;
              this.refreshFormValid();
              this.loadMemberUsage();
            } catch (err) {
              console.warn("[membership] 查询会员绑定失败（服务端未启动？）：", err);
              if (!this.isOnboarding) this.showPurchaseFlow = true;
            }
          },

          // 读当前会员的用量与可用模型（用邀请码里的 bearkey 直连 /v1/usage、/v1/models）。
          // 会员应用安装后独立打开也能看到这些信息。
          async loadMemberUsage() {
            const inviteCode = this.boundInviteCode;
            if (!inviteCode) {
              this.memberUsage = null;
              this.usageModels = [];
              this.usageQuotaText = "—";
              return;
            }
            this.usageLoading = true;
            this.usageError = "";
            try {
              const [usageRes, modelsRes] = await Promise.all([
                api.usage(inviteCode),
                api.models(inviteCode),
              ]);
              if (usageRes.status === 200 && usageRes.data) {
                const data = usageRes.data;
                const used = Number(data.usedTokens || 0);
                const quota = data.quotaTokens == null ? null : Number(data.quotaTokens);
                const remaining = data.remainingTokens == null ? null : Number(data.remainingTokens);
                this.memberUsage = data;
                this.usageUsedText = used.toLocaleString();
                this.usageQuotaText = quota == null ? getLocaleText({ cn: "不限量", en: "Unlimited" }) : quota.toLocaleString();
                this.usageRemainingText = remaining == null ? getLocaleText({ cn: "不限量", en: "Unlimited" }) : remaining.toLocaleString();
                this.usageRequestsText = Number(data.totalRequests || 0).toLocaleString();
                this.usagePercent = quota && quota > 0 ? Math.min(100, Math.round((used / quota) * 100)) : 0;
              } else {
                this.memberUsage = null;
                this.usageUsedText = "—";
                this.usageRemainingText = "—";
                this.usageRequestsText = "—";
                this.usageQuotaText = "—";
                this.usagePercent = 0;
                this.usageError =
                  usageRes.status === 403
                    ? getLocaleText({
                        cn: "会员已到期或中转 key 已失效，请续费后重试。",
                        en: "Membership expired or relay key disabled. Renew and try again.",
                      })
                    : usageRes.status === 401
                      ? getLocaleText({
                          cn: "中转 key 无效，请在本地重新配置邀请码。",
                          en: "Invalid relay key. Reconfigure the invite code locally.",
                        })
                      : getLocaleText({
                          cn: "读取会员用量失败，请稍后重试。",
                          en: "Failed to load usage. Try again later.",
                        });
              }
              if (modelsRes.status === 200 && modelsRes.data && Array.isArray(modelsRes.data.data)) {
                this.usageModels = [
                  ...new Set(
                    modelsRes.data.data
                      .map((item) => (item && item.id) || "")
                      .filter(Boolean),
                  ),
                ];
              } else {
                this.usageModels = [];
              }
            } catch (err) {
              console.warn("[membership] 读取会员用量失败：", err);
              this.memberUsage = null;
              this.usageModels = [];
              this.usageError = getLocaleText({
                cn: `读取会员用量失败：${(err && err.message) || err}`,
                en: `Failed to load usage: ${(err && err.message) || err}`,
              });
            } finally {
              this.usageLoading = false;
            }
          },

          async rebindKey() {
            if (this.rebinding) return;
            if (!this.userId) {
              toast({ message: t("networkError", { msg: "无本地用户" }), color: "error" });
              return;
            }
            this.rebinding = true;
            try {
              const { status, data } = await api.binding(this.userId, await this.bindingAuthHeader());
              if (status !== 200 || !data || !data.bound) {
                toast({
                  message: t("serverError", { msg: "服务端没有这个会员的绑定" }),
                  color: "error",
                });
                return;
              }
              this.boundInviteCode = data.relay.inviteCode;
              const saved = this.saveRelayKey(data.relay.inviteCode);
              this.localKeyBound = true;
              if (!this.isOnboarding) this.showPurchaseFlow = false;
              this.loadMemberUsage();
              toast({
                message: saved ? t("keyRestored") : t("keyAlready"),
                color: "success",
              });
            } catch (err) {
              toast({ message: t("networkError", { msg: err.message || err }), color: "error" });
            } finally {
              this.rebinding = false;
            }
          },

          saveRelayKey(inviteCode) {
            if (!inviteCode) return false;
            if (this.localKeyExists(inviteCode)) return false;
            const serverUrl = inviteServerUrl(inviteCode);
            ai.saveKey(inviteCode, "relay", {
              serverName: this.serverName,
              ...(serverUrl ? { serverUrl } : {}),
            });
            return true;
          },

          refreshFormValid() {
            this.formValid = isValidEmail(this.email);
          },

          onEmailInput(event) {
            this.email = event.target.value;
            this.emailError = "";
            this.refreshFormValid();
          },

          validateForm() {
            this.emailError = "";
            if (!isValidEmail(this.email)) this.emailError = t("emailInvalid");
            this.refreshFormValid();
            return !this.emailError;
          },

          onAgreeChange(event) {
            this.agreed = !!event.target.checked;
            if (this.agreed) this.agreeError = "";
          },

          openTermsDialog() {
            this.termsOpen = true;
          },

          closeTermsDialog() {
            this.termsOpen = false;
          },

          agreeTermsDialog() {
            this.termsOpen = false;
            this.agreed = true;
            this.agreeError = "";
            // 勾选框无双向绑定，弹窗内点「同意」时同步勾上
            const box = this.shadow.$("#agree-check");
            if (box) box.ele.checked = true;
          },

          async goCode() {
            if (this.sending) return;
            if (!this.validateForm()) return;
            if (!this.agreed) {
              this.agreeError = t("agreeRequired");
              return;
            }
            if (!this.userId) {
              await this.loadUser();
            }
            this.sending = true;
            try {
              const { status, data } = await api.sendCode({
                email: this.email.trim(),
                mazmotUserId: this.userId,
                planId: this.planId,
              });
              if (status === 200 && data && data.ok) {
                this.serviceUnavailable = "";
                this.applySendResult(data);
                this.step = "code";
              } else {
                console.error("[membership] 发送验证码失败", { url: "POST /api/membership/verify/send", status, data });
                // 502 = 服务端发码失败（邮件服务不可用 / 上游额度超限等），整页提示不可购买
                if (status === 502) {
                  this.serviceUnavailable = t("unavailableEmail");
                } else {
                  this.emailError =
                    (data && data.error && data.error.message) ||
                    t("serverError", { msg: `HTTP ${status}` });
                }
              }
            } catch (err) {
              console.error("[membership] 发送验证码失败（网络层，服务器可能未启动或不可达）", err);
              this.serviceUnavailable = t("unavailableNetwork");
              this.emailError = t("networkError", { msg: err.message || err });
            } finally {
              this.sending = false;
            }
          },

          // 发码成功后的共用收口（首次发送与重新发送共用）
          applySendResult(data) {
            this.ticketId = data.ticketId;
            // 新票据 = 新支付会话：清掉上一轮优惠码试算结果与待支付金额，避免拿旧价格下单。
            this.resetDiscount(true);
            try {
              sessionStorage.removeItem("membership-pending-pay");
            } catch {
              // 忽略
            }
            this.rebindNotice = data.rebind ? t("rebindNotice") : "";
            this.mockCode = data.mockCode || "";
            // 只有 mock 模式（服务端回传 mockEmail/mockCode）才展示演示码气泡
            this.mockCodeHint = this.mockCode
              ? getLocaleText({
                  cn: `服务端返回的演示验证码：${this.mockCode}`,
                  en: `Demo code returned by the server: ${this.mockCode}`,
                })
              : "";
            this.code = "";
            this.codeError = "";
            this.codeSentText = this.mockCode
              ? getLocaleText({
                  cn: `验证码已发送至 ${maskEmail(this.email)}，请查收邮件。`,
                  en: `A code has been sent to ${maskEmail(this.email)}; please check your inbox.`,
                })
              : getLocaleText({
                  cn: `验证码邮件已发送至 ${maskEmail(this.email)}，请查收（没收到可看看垃圾箱）。`,
                  en: `A verification email was sent to ${maskEmail(this.email)}. If you don't see it, check the spam folder.`,
                });
            this.startResendCountdown();
          },

          // 重发倒计时（服务端冷却 60s，前端同步展示）
          startResendCountdown() {
            if (this._resendTimer) clearInterval(this._resendTimer);
            this.resendLeft = 60;
            this._resendTimer = setInterval(() => {
              this.resendLeft = Math.max(0, this.resendLeft - 1);
              if (this.resendLeft === 0) {
                clearInterval(this._resendTimer);
                this._resendTimer = null;
              }
            }, 1000);
          },

          async resendCode() {
            if (this.resendLeft > 0 || this.sending) return;
            await this.goCode();
          },

          onCodeInput(event) {
            this.code = event.target.value;
            this.codeError = "";
          },

          backToForm() {
            this.codeError = "";
            this.step = "form";
          },

          async verifyCode() {
            if (this.verifying) return;
            this.verifying = true;
            try {
              const { status, data } = await api.confirmCode(this.ticketId, this.code.trim());
              if (status === 200 && data && data.ok) {
                this.codeError = "";
                if (data.rebound) {
                  // 改绑：确认即过户完成，无需支付，直达完成页
                  this.applyReboundDone(data);
                  return;
                }
                this.step = "pay";
              } else {
                console.error("[membership] 验证码校验失败", { url: "POST /api/membership/verify/confirm", status, data });
                this.codeError =
                  (data && data.error && data.error.message) ||
                  t("serverError", { msg: `HTTP ${status}` });
              }
            } catch (err) {
              console.error("[membership] 验证码校验失败（网络层，服务器可能不可达）", err);
              this.codeError = t("networkError", { msg: err.message || err });
            } finally {
              this.verifying = false;
            }
          },

          backToCode() {
            this.step = "code";
          },

          // 改绑确认完成：会员已过户到当前账户（无新订单），邀请码不变，
          // 写回本地 AI 配置后直达完成页。
          applyReboundDone(data) {
            const member = data.member || {};
            const relay = data.relay || {};
            this.doneTitle = getLocaleText({
              cn: "重新绑定成功",
              en: "Rebind complete",
            });
            this.donePlanName = planName(member.planId, "");
            this.doneAmountText = "—";
            this.doneServerText = relay.serverUrl || inviteServerUrl(relay.inviteCode);
            this.doneEmail = member.email;
            this.doneExpireText = formatDate(member.expiresAt);
            this.doneOrderId = "—";
            this.doneInviteCode = relay.inviteCode;
            this.hasBinding = true;
            this.boundPlanName = this.donePlanName;
            this.boundInviteCode = relay.inviteCode;
            this.localKeyBound = this.saveRelayKey(relay.inviteCode);
            this.boundStatusText = getLocaleText({
              cn: `绑定邮箱 ${member.email} · 有效期至 ${this.doneExpireText}`,
              en: `Bound to ${member.email} · valid until ${this.doneExpireText}`,
            });
            this.loadMemberUsage();
            if (!this.isOnboarding) this.showPurchaseFlow = false;
            this.step = "done";
            this.emit("membership-purchased", {
              data: {
                planId: member.planId,
                email: member.email,
                username: member.username || "",
                userId: this.userId,
                inviteCode: relay.inviteCode,
                serverName: this.serverName || "",
              },
              bubbles: true,
              composed: true,
            });
          },

          onCardInput() {
            if (this.discountFree) {
              this.payValid = true;
              return;
            }
            this.payValid = isValidMockCard({
              number: this.cardNumber,
              expiry: this.cardExpiry,
              cvc: this.cardCvc,
            });
          },

          // ===== Stripe 真实支付：轮询绑定等 webhook 发货 =====

          // 每 3s 查一次绑定状态；webhook 发货成功后 binding 即可查到会员。
          // 上限 100 次（约 5 分钟），超时提示未检测到支付。
          startPollBinding() {
            this.stopPollBinding();
            let ticks = 0;
            this._pollTimer = setInterval(async () => {
              ticks++;
              if (ticks > 100) {
                this.stopPollBinding();
                this.waitingPayment = false;
                toast({
                  message: getLocaleText({
                    cn: "暂未检测到支付成功，若已完成支付请稍后重进本页。",
                    en: "No successful payment detected yet. If you've paid, please reopen this page later.",
                  }),
                  color: "error",
                });
                return;
              }
              try {
                const { status, data } = await api.binding(this.userId, await this.bindingAuthHeader());
                if (status === 200 && data && data.bound) {
                  this.stopPollBinding();
                  this.waitingPayment = false;
                  this.applyStripeDone(data);
                }
              } catch (err) {
                // 轮询期间的瞬时网络错误忽略，下一轮再试
              }
            }, 3000);
          },

          stopPollBinding() {
            if (this._pollTimer) {
              clearInterval(this._pollTimer);
              this._pollTimer = null;
            }
          },

          // webhook 已发货：binding 拿到会员 + 邀请码，收口进完成页
          applyStripeDone(data) {
            const member = data.member || {};
            const relay = data.relay || {};
            const inviteCode = relay.inviteCode;
            const serverUrl = relay.serverUrl || inviteServerUrl(inviteCode);
            this.saveRelayKey(inviteCode);

            this.doneTitle = getLocaleText({ cn: "购买成功", en: "Purchase complete" });
            this.donePlanName = planName(member.planId, "");
            this.doneAmountText =
              this.pendingAmountText ||
              (this.planId === "annual" ? this.annualPrice : this.monthlyPrice);
            try {
              sessionStorage.removeItem("membership-pending-pay");
            } catch {
              // sessionStorage 不可用时忽略（只影响刷新后的金额展示）
            }
            this.doneServerText = serverUrl;
            this.doneEmail = member.email;
            this.doneExpireText = formatDate(member.expiresAt);
            this.doneOrderId = "—";
            this.doneInviteCode = inviteCode;
            this.doneUserId = this.userId;
            this.doneUsername = this.doneUsername || member.username;
            this.hasBinding = true;
            this.boundPlanName = this.donePlanName;
            this.boundInviteCode = inviteCode;
            this.localKeyBound = true;
            this.boundStatusText = getLocaleText({
              cn: `绑定邮箱 ${member.email} · 有效期至 ${this.doneExpireText}`,
              en: `Bound to ${member.email} · valid until ${this.doneExpireText}`,
            });
            this.loadMemberUsage();
            if (!this.isOnboarding) this.showPurchaseFlow = false;
            this.step = "done";

            this.emit("membership-purchased", {
              data: {
                planId: member.planId,
                email: member.email,
                username: this.doneUsername,
                userId: this.userId,
                inviteCode,
                serverName: this.serverName || "",
              },
              bubbles: true,
              composed: true,
            });
          },

          async payNow() {
            if (this.paying) return;
            if (!this.discountFree) {
              this.payValid = isValidMockCard({
                number: this.cardNumber,
                expiry: this.cardExpiry,
                cvc: this.cardCvc,
              });
              if (!this.payValid) return;
            }

            this.paying = true;
            try {
              const { status, data } = await api.checkout(
                this.ticketId,
                this.planId,
                this.discountApplied ? this.discountAppliedCode : "",
              );
              if (status !== 200 || !data || !data.ok) {
                console.error("[membership] 下单失败", { url: "POST /api/membership/checkout", status, data });
                // 502 = 创建支付会话失败（Stripe 不可用 / 配置缺失等），整页提示不可购买
                if (status === 502) {
                  this.serviceUnavailable = t("unavailablePay");
                }
                toast({
                  message:
                    (data && data.error && data.error.message) ||
                    t("serverError", { msg: `HTTP ${status}` }),
                  color: "error",
                });
                return;
              }

              // stripe 模式：checkout 只创建支付会话——打开 Stripe 收银台，
              // 支付结果由服务端 webhook 异步发货，本页轮询绑定状态等生效
              if (data.pending && data.checkoutUrl) {
                this.waitingPayment = true;
                try {
                  sessionStorage.setItem(
                    "membership-pending-pay",
                    JSON.stringify({
                      planId: this.planId,
                      amountText: this.payAmountText,
                    }),
                  );
                } catch {
                  // 存不了就退回按套餐原价展示完成页金额
                }
                this.startPollBinding();
                window.open(data.checkoutUrl, "_blank");
                return;
              }

              const inviteCode = data.relay.inviteCode;
              const serverUrl = data.relay.serverUrl || inviteServerUrl(inviteCode);
              const info = await api.serverInfo(serverUrl);
              if (info && info.name) this.serverName = info.name;
              this.saveRelayKey(inviteCode);

              this.doneUserId = this.userId;
              this.doneUsername = data.member.username;

              this.doneTitle = getLocaleText({
                cn: "购买成功",
                en: "Purchase complete",
              });
              this.donePlanName = planName(data.member.planId, data.member.planName);
              this.doneAmountText = data.free
                ? getLocaleText({ cn: "免费（0 折）", en: "Free (100% off)" })
                : priceText(data.order.amountCents, data.order.currency);
              try {
                sessionStorage.removeItem("membership-pending-pay");
              } catch {
                // 忽略
              }
              this.doneServerText = serverUrl;
              this.doneEmail = data.member.email;
              this.doneExpireText = formatDate(data.member.expiresAt);
              this.doneOrderId = data.order.id;
              this.doneInviteCode = inviteCode;
              this.hasBinding = true;
              this.boundPlanName = this.donePlanName;
              this.boundInviteCode = inviteCode;
              this.localKeyBound = true;
              this.boundStatusText = getLocaleText({
                cn: `绑定邮箱 ${data.member.email} · 有效期至 ${this.doneExpireText}`,
                en: `Bound to ${data.member.email} · valid until ${this.doneExpireText}`,
              });
              this.loadMemberUsage();
            if (!this.isOnboarding) this.showPurchaseFlow = false;
            this.step = "done";

              this.emit("membership-purchased", {
                data: {
                  planId: data.member.planId,
                  priceUSD: data.order.amountCents / 100,
                  email: data.member.email,
                  username: this.doneUsername,
                  userId: this.doneUserId,
                  orderId: data.order.id,
                  expireAt: data.member.expiresAt,
                  inviteCode,
                  serverName: this.serverName || "",
                },
                bubbles: true,
                composed: true,
              });
            } catch (err) {
              console.error("[membership] 下单失败（网络层，服务器可能不可达）", err);
              this.serviceUnavailable = t("unavailableNetwork");
              toast({ message: t("networkError", { msg: err.message || err }), color: "error" });
            } finally {
              this.paying = false;
            }
          },

          async copyUserId() {
            if (!this.doneUserId) return;
            try {
              await navigator.clipboard.writeText(this.doneUserId);
              toast({ message: t("userIdCopied"), color: "success" });
            } catch (err) {
              toast({ message: t("copyFailed"), color: "error" });
            }
          },

          finish() {
            this.emit("membership-close", { bubbles: true, composed: true });
          },
        },
      };
    };
  </script>
</template>
