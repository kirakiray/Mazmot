<template page>
  <style>
    :host {
      display: block;
      height: 100%;
      overflow-y: auto;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
    }

    /* ===== 头部 ===== */
    .head-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .brand-text h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .brand-text .sub {
      margin: 4px 0 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
    }
    .mock-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      white-space: nowrap;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    /* ===== 套餐选择 ===== */
    .plans {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .plans-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .plans-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
    }
    .plan-perks {
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.85;
    }
    .plan-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .plan-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 64px;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      font: inherit;
      text-align: start;
      cursor: pointer;
      box-sizing: border-box;
      transition:
        background-color 0.15s,
        border-color 0.15s;
    }
    .plan-option:hover {
      background-color: var(--md-sys-color-surface-container);
    }
    .plan-option.selected {
      border-color: var(--md-sys-color-primary);
      background: linear-gradient(
        135deg,
        var(--md-sys-color-primary-container),
        var(--md-sys-color-tertiary-container)
      );
      color: var(--md-sys-color-on-primary-container);
    }
    .plan-option-top {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .plan-option-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .plan-badge {
      padding: 0 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.6;
      white-space: nowrap;
      background-color: var(--md-sys-color-tertiary);
      color: var(--md-sys-color-on-tertiary);
    }
    .plan-option-price {
      flex-shrink: 0;
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .plan-option-per {
      margin-left: 4px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0.75;
    }

    /* ===== 会员权益（第 1 步） ===== */
    .benefits {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 12px 14px;
      border-radius: 16px;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .benefits-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
    }
    .benefit {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .benefit-icon {
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 16px;
      color: var(--md-sys-color-primary);
    }
    .benefit-body {
      min-width: 0;
    }
    .benefit-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .benefit-desc {
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ===== 支付（Stripe · 虚拟支付） ===== */
    .pay-method {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--md-sys-color-primary);
      background-color: var(--md-sys-color-surface-container);
    }
    .pay-method-icon {
      flex-shrink: 0;
      font-size: 22px;
      color: var(--md-sys-color-primary);
    }
    .pay-method-body {
      flex: 1;
      min-width: 0;
    }
    .pay-method-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .pay-method-badge {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .pay-method-desc {
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
    }
    /* 卡号 / 有效期 / CVC 同排，节省纵向空间（弹窗高度有限）。
       st-input 默认 min-width 190px，网格里必须显式 min-width: 0 才不会被撑破 */
    .pay-card-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 0.8fr);
      gap: 10px;
    }
    .pay-card-grid .field st-input {
      width: 100%;
      min-width: 0;
    }
    .pay-total {
      margin-right: auto;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .pay-total strong {
      font-size: 15px;
      color: var(--md-sys-color-on-surface);
      font-variant-numeric: tabular-nums;
    }

    /* ===== 步骤条 ===== */
    .steps {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .step-item + .step-item::before {
      content: "";
      width: 12px;
      height: 1px;
      flex-shrink: 0;
      background-color: var(--md-sys-color-outline-variant);
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 50%;
      font-size: 11px;
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
    }
    .step-item.active {
      color: var(--md-sys-color-primary);
      font-weight: 600;
    }
    .step-item.active .step-num {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }
    .step-item.done {
      color: var(--md-sys-color-primary);
    }
    .step-item.done .step-num {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    /* ===== 卡片 ===== */
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 14px;
      border-radius: 20px;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .card-desc {
      margin: 0;
      font-size: 12px;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface-variant);
    }
    .mock-code {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
    .field st-input {
      width: 100%;
    }
    .field-hint {
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.85;
    }
    .field-error {
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-error);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 窄屏：套餐与卡信息改为纵向排列，避免挤压 */
    @media (max-width: 480px) {
      .plan-options {
        grid-template-columns: minmax(0, 1fr);
      }
      .pay-card-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .pay-card-grid .field:first-child {
        grid-column: 1 / -1;
      }
    }

    /* ===== 成功页 ===== */
    .success-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .success-head n-icon {
      font-size: 28px;
      color: var(--md-sys-color-primary);
    }
    .kv-list,
    .user-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .user-block {
      padding: 14px 12px;
      border-radius: 14px;
      background-color: var(--md-sys-color-surface-container);
    }
    .user-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .kv {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1.6;
      min-width: 0;
    }
    .kv .k {
      flex-shrink: 0;
      color: var(--md-sys-color-on-surface-variant);
    }
    .kv .v {
      min-width: 0;
      word-break: break-all;
      color: var(--md-sys-color-on-surface);
    }
    .kv .v.id-value {
      font-family: monospace;
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@main/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/button/icon-button.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <main class="wrap">
    <header class="head">
      <div class="head-top">
        <div class="brand">
          <div class="brand-icon">
            <n-icon icon="mdi:crown-outline"></n-icon>
          </div>
          <div class="brand-text">
            <h1><locale-text><span lang="cn">会员中心</span><span lang="en">Membership</span></locale-text></h1>
            <p class="sub">
              <locale-text><span lang="cn">绑定邮箱、验证身份并支付后即可开通会员；套餐、验证码、支付与邮箱都是本地模拟数据，不会发起网络请求。</span><span lang="en">Bind an email, verify it and pay to unlock membership. Plan, code, payment and emails are local mock data — no network requests.</span></locale-text>
            </p>
          </div>
        </div>
        <span class="mock-badge">
          <n-icon icon="mdi:flask-outline"></n-icon>
          <locale-text><span lang="cn">演示模式</span><span lang="en">Demo</span></locale-text>
        </span>
      </div>
      <o-if :value="hasMembership">
        <div class="status-line">
          <n-icon icon="mdi:check-decagram-outline"></n-icon>
          <span>{{currentMembershipText}}</span>
        </div>
      </o-if>
    </header>

    <div class="steps">
      <div
        class="step-item"
        class:active="step === 'form'"
        class:done="step !== 'form'"
      >
        <span class="step-num">1</span>
        <span><locale-text><span lang="cn">邮箱与用户名</span><span lang="en">Email & name</span></locale-text></span>
      </div>
      <div
        class="step-item"
        class:active="step === 'code'"
        class:done="step === 'pay' || step === 'done'"
      >
        <span class="step-num">2</span>
        <span><locale-text><span lang="cn">验证邮箱</span><span lang="en">Verify</span></locale-text></span>
      </div>
      <div
        class="step-item"
        class:active="step === 'pay'"
        class:done="step === 'done'"
      >
        <span class="step-num">3</span>
        <span><locale-text><span lang="cn">支付</span><span lang="en">Pay</span></locale-text></span>
      </div>
      <div class="step-item" class:active="step === 'done'">
        <span class="step-num">4</span>
        <span><locale-text><span lang="cn">完成</span><span lang="en">Done</span></locale-text></span>
      </div>
    </div>

    <!-- ===== 步骤 1：会员权益 + 邮箱 / 用户名 ===== -->
    <o-if :value="step === 'form'">
      <section class="benefits">
        <div class="benefits-title">
          <n-icon icon="mdi:diamond-stone"></n-icon>
          <locale-text><span lang="cn">购买会员后拥有</span><span lang="en">Included with membership</span></locale-text>
        </div>
        <o-fill :value="benefits" fill-key="icon">
          <div class="benefit">
            <n-icon class="benefit-icon" attr:icon="$data.icon"></n-icon>
            <div class="benefit-body">
              <div class="benefit-title">{{$data.title}}</div>
              <div class="benefit-desc">{{$data.desc}}</div>
            </div>
          </div>
        </o-fill>
      </section>
      <section class="card">
        <h2 class="card-title">
          <locale-text><span lang="cn">第 1 步 · 邮箱与用户名</span><span lang="en">Step 1 · Email and username</span></locale-text>
        </h2>
        <div class="field">
          <label class="field-label"><locale-text><span lang="cn">邮箱</span><span lang="en">Email</span></locale-text></label>
          <st-input
            sync:value="email"
            type="email"
            attr:placeholder="emailPlaceholder"
            on:input="onEmailInput"
          ></st-input>
          <div class="field-hint">{{emailHint}}</div>
          <o-if :value="emailError">
            <div class="field-error">{{emailError}}</div>
          </o-if>
        </div>
        <div class="field">
          <label class="field-label"><locale-text><span lang="cn">用户名</span><span lang="en">Username</span></locale-text></label>
          <st-input
            sync:value="username"
            attr:placeholder="usernamePlaceholder"
            on:input="onUsernameInput"
          ></st-input>
          <div class="field-hint">{{usernameHint}}</div>
          <o-if :value="usernameError">
            <div class="field-error">{{usernameError}}</div>
          </o-if>
        </div>
        <div class="actions">
          <st-button color="primary" attr:disabled="!formValid" on:click="goVerify">
            <n-icon icon="mdi:email-fast-outline" slot="prefix"></n-icon>
            <locale-text><span lang="cn">下一步，获取验证码</span><span lang="en">Next, send code</span></locale-text>
          </st-button>
        </div>
      </section>
    </o-if>

    <!-- ===== 步骤 2：验证码 ===== -->
    <o-if :value="step === 'code'">
      <section class="card">
        <h2 class="card-title">
          <locale-text><span lang="cn">第 2 步 · 验证邮箱</span><span lang="en">Step 2 · Verify email</span></locale-text>
        </h2>
        <p class="card-desc">{{codeSentText}}</p>
        <div class="mock-code">
          <n-icon icon="mdi:flask-outline"></n-icon>
          <span>{{mockCodeText}}</span>
        </div>
        <div class="field">
          <label class="field-label"><locale-text><span lang="cn">验证码</span><span lang="en">Verification code</span></locale-text></label>
          <st-input
            sync:value="code"
            maxlength="6"
            inputmode="numeric"
            attr:placeholder="codePlaceholder"
            on:input="onCodeInput"
          ></st-input>
          <o-if :value="codeError">
            <div class="field-error">{{codeError}}</div>
          </o-if>
        </div>
        <div class="actions">
          <st-button variant="text" on:click="backToForm">
            <n-icon icon="mdi:arrow-left" slot="prefix"></n-icon>
            <locale-text><span lang="cn">上一步</span><span lang="en">Back</span></locale-text>
          </st-button>
          <st-button
            color="primary"
            attr:disabled="verifying || !code"
            on:click="verifyCode"
          >
            <n-icon icon="mdi:arrow-right" slot="prefix"></n-icon>
            <o-if :value="!verifying">
              <locale-text><span lang="cn">验证并继续支付</span><span lang="en">Verify and continue</span></locale-text>
            </o-if>
            <o-if :value="verifying">
              <locale-text><span lang="cn">验证中...</span><span lang="en">Verifying...</span></locale-text>
            </o-if>
          </st-button>
        </div>
      </section>
    </o-if>

    <!-- ===== 步骤 3：Stripe 模拟支付 ===== -->
    <o-if :value="step === 'pay'">
      <section class="card">
        <h2 class="card-title">
          <locale-text><span lang="cn">第 3 步 · 支付</span><span lang="en">Step 3 · Payment</span></locale-text>
        </h2>
        <div class="plans">
          <div class="plans-head">
            <span class="plans-title">
              <locale-text><span lang="cn">选择套餐</span><span lang="en">Choose a plan</span></locale-text>
            </span>
            <span class="plan-perks">{{planPerks}}</span>
          </div>
          <div class="plan-options">
            <button
              class="plan-option"
              class:selected="planId === 'monthly'"
              on:click="pickPlan('monthly')"
            >
              <span class="plan-option-top">
                <span class="plan-option-name">{{monthlyName}}</span>
              </span>
              <span class="plan-option-price">{{monthlyPrice}}<span class="plan-option-per">{{monthlyPeriod}}</span></span>
            </button>
            <button
              class="plan-option"
              class:selected="planId === 'yearly'"
              on:click="pickPlan('yearly')"
            >
              <span class="plan-option-top">
                <span class="plan-option-name">{{yearlyName}}</span>
                <span class="plan-badge">{{yearlyBadge}}</span>
              </span>
              <span class="plan-option-price">{{yearlyPrice}}<span class="plan-option-per">{{yearlyPeriod}}</span></span>
            </button>
          </div>
        </div>
        <div class="pay-method">
          <n-icon class="pay-method-icon" icon="mdi:credit-card-outline"></n-icon>
          <div class="pay-method-body">
            <div class="pay-method-name">
              <span>Stripe</span>
              <span class="pay-method-badge">
                <locale-text><span lang="cn">唯一方式</span><span lang="en">Only option</span></locale-text>
              </span>
            </div>
            <div class="pay-method-desc">
              <locale-text><span lang="cn">当前仅支持 Stripe 支付；其它支付方式暂未开放。</span><span lang="en">Stripe is the only payment method for now — others are not available yet.</span></locale-text>
            </div>
          </div>
        </div>
        <div class="pay-card-grid">
          <div class="field">
            <label class="field-label"><locale-text><span lang="cn">卡号</span><span lang="en">Card number</span></locale-text></label>
            <st-input
              sync:value="cardNumber"
              maxlength="19"
              inputmode="numeric"
              attr:placeholder="cardNumberPlaceholder"
              on:input="onCardInput"
            ></st-input>
          </div>
          <div class="field">
            <label class="field-label"><locale-text><span lang="cn">有效期</span><span lang="en">Expiry</span></locale-text></label>
            <st-input
              sync:value="cardExpiry"
              maxlength="5"
              inputmode="numeric"
              attr:placeholder="cardExpiryPlaceholder"
              on:input="onCardInput"
            ></st-input>
          </div>
          <div class="field">
            <label class="field-label">CVC</label>
            <st-input
              sync:value="cardCvc"
              maxlength="4"
              inputmode="numeric"
              attr:placeholder="cardCvcPlaceholder"
              on:input="onCardInput"
            ></st-input>
          </div>
        </div>
        <div class="mock-code">
          <n-icon icon="mdi:flask-outline"></n-icon>
          <span>{{payMockHint}}</span>
        </div>
        <div class="actions">
          <span class="pay-total">
            <locale-text><span lang="cn">应付</span><span lang="en">Total</span></locale-text>
            <strong>{{payAmountText}}</strong>
          </span>
          <st-button variant="text" on:click="backToCode">
            <n-icon icon="mdi:arrow-left" slot="prefix"></n-icon>
            <locale-text><span lang="cn">上一步</span><span lang="en">Back</span></locale-text>
          </st-button>
          <st-button
            color="primary"
            attr:disabled="paying || !payValid"
            on:click="payNow"
          >
            <n-icon icon="mdi:lock-outline" slot="prefix"></n-icon>
            <o-if :value="!paying">
              <span>{{payButtonText}}</span>
            </o-if>
            <o-if :value="paying">
              <locale-text><span lang="cn">支付处理中...</span><span lang="en">Processing...</span></locale-text>
            </o-if>
          </st-button>
        </div>
      </section>
    </o-if>

    <!-- ===== 步骤 4：购买成功 + 用户信息 ===== -->
    <o-if :value="step === 'done'">
      <section class="card">
        <div class="success-head">
          <n-icon icon="mdi:check-decagram"></n-icon>
          <div>
            <h2 class="card-title">
              <locale-text><span lang="cn">购买成功</span><span lang="en">Purchase complete</span></locale-text>
            </h2>
            <p class="card-desc">
              <locale-text><span lang="cn">会员已开通，本地默认用户的用户名已同步更新。</span><span lang="en">Membership is active and your local default user has been renamed.</span></locale-text>
            </p>
          </div>
        </div>

        <div class="kv-list">
          <div class="kv"><span class="k"><locale-text><span lang="cn">会员方案</span><span lang="en">Plan</span></locale-text></span><span class="v">{{donePlanName}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">支付金额</span><span lang="en">Amount</span></locale-text></span><span class="v">{{doneAmountText}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">绑定邮箱</span><span lang="en">Bound email</span></locale-text></span><span class="v">{{doneEmail}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">支付方式</span><span lang="en">Payment</span></locale-text></span><span class="v">{{donePaymentText}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">有效期至</span><span lang="en">Valid until</span></locale-text></span><span class="v">{{doneExpireText}}</span></div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">订单号</span><span lang="en">Order ID</span></locale-text></span><span class="v">{{doneOrderId}}</span></div>
        </div>

        <div class="user-block">
          <div class="user-title">
            <n-icon icon="mdi:account-circle-outline"></n-icon>
            <locale-text><span lang="cn">本地用户（default）</span><span lang="en">Local user (default)</span></locale-text>
          </div>
          <div class="kv"><span class="k"><locale-text><span lang="cn">用户名</span><span lang="en">Username</span></locale-text></span><span class="v">{{doneUsername}}</span></div>
          <div class="kv">
            <span class="k"><locale-text><span lang="cn">用户 ID</span><span lang="en">User ID</span></locale-text></span>
            <span class="v id-value">{{doneUserId}}</span>
            <st-icon-button
              style="font-size: 12px"
              attr:disabled="!doneUserId"
              attr:title="copyUserIdTitle"
              on:click="copyUserId"
            >
              <n-icon icon="mdi:content-copy"></n-icon>
            </st-icon-button>
          </div>
        </div>

        <div class="actions">
          <st-button color="primary" on:click="finish">
            <n-icon icon="mdi:check" slot="prefix"></n-icon>
            <locale-text><span lang="cn">完成</span><span lang="en">Done</span></locale-text>
          </st-button>
        </div>
      </section>
    </o-if>
  </main>

  <script>
    export default async ({ load }) => {
      const { getLocaleText } = await load("/nos/locale-text/get-locale-text.js");
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@main/packages/snackbar/toast.js",
      );
      const { getStorage } = await load("/nos/storage/main.js");
      const { getUser } = await load("/nos/user/main.js");
      const {
        DEFAULT_PLAN_ID,
        PLAN_PERKS,
        MEMBER_BENEFITS,
        getPlan,
        MOCK_PAYMENT,
        checkVerifyCode,
        createMockMembership,
        formatDate,
        isValidEmail,
        isValidUsername,
        isValidMockCard,
        maskEmail,
      } = await load("../lib/mock.js");

      const memberStore = getStorage("mazmot-membership");
      const MEMBERSHIP_KEY = "current";

      const L10N = {
        emailPlaceholder: { cn: "请输入邮箱地址", en: "Enter your email address" },
        usernamePlaceholder: {
          cn: "3-20 位字母、数字、下划线或短横线",
          en: "3-20 letters, digits, underscores or dashes",
        },
        emailHint: {
          cn: "验证码会发送到该邮箱；验证通过后，这个邮箱就与你的会员绑定。",
          en: "The code goes to this address — once verified, this email is bound to your membership.",
        },
        usernameHint: {
          cn: "验证通过后，会用它改写本地默认用户的用户名。",
          en: "After verification this becomes your local default user's username.",
        },
        emailInvalid: { cn: "请输入有效的邮箱地址", en: "Enter a valid email address" },
        usernameInvalid: {
          cn: "用户名需为 3-20 位字母、数字、下划线或短横线",
          en: "Username must be 3-20 letters, digits, underscores or dashes",
        },
        codePlaceholder: { cn: "请输入 6 位验证码", en: "Enter the 6-digit code" },
        mockCodeText: {
          cn: "演示验证码固定为 111111",
          en: "Demo verification code is always 111111",
        },
        wrongCode: {
          cn: "验证码不正确，演示验证码是 111111",
          en: "Wrong code. The demo code is 111111",
        },
        cardNumberPlaceholder: { cn: "4242 4242 4242 4242", en: "4242 4242 4242 4242" },
        cardExpiryPlaceholder: { cn: "MM/YY", en: "MM/YY" },
        cardCvcPlaceholder: { cn: "CVC", en: "CVC" },
        payMockHint: {
          cn: "演示环境：Stripe 为虚拟支付，不会真实扣款；测试卡已预填，可直接支付。",
          en: "Demo: Stripe payment is simulated — no real charge. The test card is prefilled, just pay.",
        },
        copyUserIdTitle: { cn: "复制用户 ID", en: "Copy user ID" },
        userIdCopied: { cn: "用户 ID 已复制", en: "User ID copied" },
        copyFailed: { cn: "复制失败，请手动复制", en: "Copy failed, please copy manually" },
      };
      const t = (key) => {
        const item = L10N[key];
        return item ? getLocaleText(item) : key;
      };

      const planPerks = getLocaleText({
        cn: PLAN_PERKS.cn.join(" · "),
        en: PLAN_PERKS.en.join(" · "),
      });

      // 会员权益（第 1 步展示「购买后拥有什么」）
      const benefits = MEMBER_BENEFITS.map((item) => ({
        icon: item.icon,
        title: getLocaleText(item.title),
        desc: getLocaleText(item.desc),
      }));

      // 套餐文案：两档套餐是固定选项（数量固定，直接展开成 data 字段）
      const monthlyPlan = getPlan("monthly");
      const yearlyPlan = getPlan("yearly");
      const planText = {
        monthlyName: getLocaleText(monthlyPlan.shortName),
        monthlyPrice: `$${monthlyPlan.priceUSD}`,
        monthlyPeriod: getLocaleText(monthlyPlan.period),
        yearlyName: getLocaleText(yearlyPlan.shortName),
        yearlyPrice: `$${yearlyPlan.priceUSD}`,
        yearlyPeriod: getLocaleText(yearlyPlan.period),
        yearlyBadge: yearlyPlan.badge ? getLocaleText(yearlyPlan.badge) : "",
      };

      return {
        data: {
          step: "form",
          planId: DEFAULT_PLAN_ID,
          planPerks,
          benefits,
          ...planText,

          // 已有会员记录（来自本地存储，纯展示）
          hasMembership: false,
          currentMembershipText: "",

          // 步骤 1
          email: "",
          username: "",
          emailPlaceholder: t("emailPlaceholder"),
          usernamePlaceholder: t("usernamePlaceholder"),
          emailHint: t("emailHint"),
          usernameHint: t("usernameHint"),
          emailError: "",
          usernameError: "",
          formValid: false,

          // 步骤 2
          code: "",
          codePlaceholder: t("codePlaceholder"),
          codeError: "",
          codeSentText: "",
          mockCodeText: t("mockCodeText"),
          verifying: false,

          // 步骤 3：支付（Stripe 虚拟支付）
          payAmountText: `$${getPlan(DEFAULT_PLAN_ID).priceUSD}`,
          payButtonText: getLocaleText({
            cn: `支付 $${getPlan(DEFAULT_PLAN_ID).priceUSD}（模拟）`,
            en: `Pay $${getPlan(DEFAULT_PLAN_ID).priceUSD} (mock)`,
          }),
          cardNumber: MOCK_PAYMENT.testCard.number,
          cardExpiry: MOCK_PAYMENT.testCard.expiry,
          cardCvc: MOCK_PAYMENT.testCard.cvc,
          cardNumberPlaceholder: t("cardNumberPlaceholder"),
          cardExpiryPlaceholder: t("cardExpiryPlaceholder"),
          cardCvcPlaceholder: t("cardCvcPlaceholder"),
          payMockHint: t("payMockHint"),
          payValid: true,
          paying: false,

          // 步骤 3
          donePlanName: "",
          doneAmountText: "",
          doneEmail: "",
          doneExpireText: "",
          doneOrderId: "",
          donePaymentText: "",
          doneUsername: "",
          doneUserId: "",
          copyUserIdTitle: t("copyUserIdTitle"),
        },

        async ready() {
          await this.loadCurrentMembership();
        },

        proto: {
          async loadCurrentMembership() {
            try {
              const record = await memberStore.getItem(MEMBERSHIP_KEY);
              if (!record || !record.expireAt) return;
              this.hasMembership = true;
              const planName = getLocaleText(getPlan(record.planId).name);
              this.currentMembershipText = getLocaleText(
                {
                  cn: `当前会员：${planName}，有效期至 ${formatDate(record.expireAt)}`,
                  en: `Current membership: ${planName}, valid until ${formatDate(record.expireAt)}`,
                },
              );
              // 预填上次绑定的邮箱与用户名，方便再次购买
              if (record.email) this.email = record.email;
              if (record.username) this.username = record.username;
              if (record.planId) {
                this.planId = getPlan(record.planId).id;
                this.syncPayAmount();
              }
              this.refreshFormValid();
            } catch (err) {
              console.warn("[membership] 读取本地会员记录失败：", err);
            }
          },

          pickPlan(planId) {
            this.planId = getPlan(planId).id;
            this.syncPayAmount();
          },

          // 应付金额 / 支付按钮文案跟随所选套餐
          syncPayAmount() {
            const amount = getPlan(this.planId).priceUSD;
            this.payAmountText = `$${amount}`;
            this.payButtonText = getLocaleText({
              cn: `支付 $${amount}（模拟）`,
              en: `Pay $${amount} (mock)`,
            });
          },

          refreshFormValid() {
            this.formValid =
              isValidEmail(this.email) && isValidUsername(this.username);
          },

          onEmailInput(event) {
            this.email = event.target.value;
            this.emailError = "";
            this.refreshFormValid();
          },

          onUsernameInput(event) {
            this.username = event.target.value;
            this.usernameError = "";
            this.refreshFormValid();
          },

          goVerify() {
            this.emailError = "";
            this.usernameError = "";

            let valid = true;
            if (!isValidEmail(this.email)) {
              this.emailError = t("emailInvalid");
              valid = false;
            }
            if (!isValidUsername(this.username)) {
              this.usernameError = t("usernameInvalid");
              valid = false;
            }
            if (!valid) {
              this.refreshFormValid();
              return;
            }

            this.code = "";
            this.codeError = "";
            this.codeSentText = getLocaleText({
              cn: `验证码已发送至 ${maskEmail(this.email.trim())}（演示环境不会真的发信）。`,
              en: `A code was sent to ${maskEmail(this.email.trim())} (nothing is really sent in this demo).`,
            });
            this.step = "code";
          },

          onCodeInput(event) {
            this.code = event.target.value;
            this.codeError = "";
          },

          backToForm() {
            this.codeError = "";
            this.step = "form";
          },

          async verifyCode() {
            if (this.verifying) return;
            if (!checkVerifyCode(this.code)) {
              this.codeError = t("wrongCode");
              return;
            }
            this.verifying = true;
            try {
              // 邮箱验证通过（模拟发信不会真的发码）：进入 Stripe 支付步骤
              this.paying = false;
              this.payValid = isValidMockCard({
                number: this.cardNumber,
                expiry: this.cardExpiry,
                cvc: this.cardCvc,
              });
              this.syncPayAmount();
              this.step = "pay";
            } catch (err) {
              console.error("[membership] 进入支付失败：", err);
            } finally {
              this.verifying = false;
            }
          },

          backToCode() {
            this.step = "code";
          },

          onCardInput() {
            this.payValid = isValidMockCard({
              number: this.cardNumber,
              expiry: this.cardExpiry,
              cvc: this.cardCvc,
            });
          },

          // 模拟 Stripe 扣款成功 → 更新本地默认用户 → 写入会员记录 → 成功页
          async payNow() {
            if (this.paying) return;
            this.payValid = isValidMockCard({
              number: this.cardNumber,
              expiry: this.cardExpiry,
              cvc: this.cardCvc,
            });
            if (!this.payValid) return;

            this.paying = true;
            try {
              // 虚拟支付：仅等待一小段时间模拟 Stripe 处理，不发网络请求
              await new Promise((resolve) => setTimeout(resolve, 900));

              // 支付成功：拿默认用户，把用户名改成这里填写的值
              const user = await getUser("default");
              await user.updateInfo({ username: this.username.trim() });
              const info = await user.getInfo();

              const purchase = createMockMembership({
                planId: this.planId,
                email: this.email.trim(),
                username: this.username.trim(),
              });
              await memberStore.setItem(MEMBERSHIP_KEY, purchase);

              this.donePlanName = getLocaleText(purchase.planName);
              this.doneAmountText = `$${purchase.priceUSD}`;
              this.doneEmail = purchase.email;
              this.doneExpireText = formatDate(purchase.expireAt);
              this.doneOrderId = purchase.orderId;
              this.donePaymentText = getLocaleText({
                cn: "Stripe（模拟）",
                en: "Stripe (mock)",
              });
              this.doneUsername = info.username || this.username.trim();
              this.doneUserId = info.subject || user.userId || "";
              this.hasMembership = true;
              this.currentMembershipText = getLocaleText({
                cn: `当前会员：${this.donePlanName}，有效期至 ${formatDate(purchase.expireAt)}`,
                en: `Current membership: ${this.donePlanName}, valid until ${formatDate(purchase.expireAt)}`,
              });
              this.step = "done";

              this.emit("membership-purchased", {
                data: {
                  planId: purchase.planId,
                  priceUSD: purchase.priceUSD,
                  email: purchase.email,
                  username: this.doneUsername,
                  userId: this.doneUserId,
                  orderId: purchase.orderId,
                  expireAt: purchase.expireAt,
                },
                bubbles: true,
                composed: true,
              });
            } catch (err) {
              console.error("[membership] 支付/开通失败：", err);
              toast({
                message: getLocaleText(
                  { cn: "支付失败：{msg}", en: "Payment failed: {msg}" },
                  { msg: err.message || err },
                ),
                color: "error",
              });
            } finally {
              this.paying = false;
            }
          },

          async copyUserId() {
            if (!this.doneUserId) return;
            try {
              await navigator.clipboard.writeText(this.doneUserId);
              toast({ message: t("userIdCopied"), color: "success" });
            } catch (err) {
              toast({ message: t("copyFailed"), color: "error" });
            }
          },

          finish() {
            this.emit("membership-close", { bubbles: true, composed: true });
          },
        },
      };
    };
  </script>
</template>
