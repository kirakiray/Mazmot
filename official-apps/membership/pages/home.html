<template page>
  <style>
    :host {
      display: block;
      height: 100%;
      overflow-y: auto;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
    }

    /* ===== 头部 ===== */
    .head-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .brand-text h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .brand-text .sub {
      margin: 4px 0 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
    }
    .mock-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      white-space: nowrap;
    }

    /* ===== 会员状态（来自服务端） ===== */
    .status-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 16px;
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .status-card n-icon {
      flex-shrink: 0;
      font-size: 22px;
    }
    .status-body {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      line-height: 1.6;
    }
    .status-title {
      font-weight: 600;
    }
    .status-sub {
      opacity: 0.85;
      word-break: break-all;
    }
    .status-sub.error {
      color: var(--md-sys-color-error);
      opacity: 1;
    }

    /* ===== 权益 ===== */
    .benefits {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 12px 14px;
      border-radius: 16px;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .benefits-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
    }
    .benefit {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .benefit-icon {
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 16px;
      color: var(--md-sys-color-primary);
    }
    .benefit-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .benefit-desc {
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ===== 步骤条 ===== */
    .steps {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    /* 末项不占弹性份额，避免右侧留空导致连线拉太长 */
    .step-item:last-child {
      flex: 0 0 auto;
    }
    /* 连线是夹在「上一步内容」与「本步圆圈」之间的弹性元素，天然不会压到圆圈 */
    .step-item + .step-item::before {
      content: "";
      height: 1px;
      flex: 1;
      min-width: 16px;
      background-color: var(--md-sys-color-outline-variant);
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 50%;
      font-size: 11px;
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
    }
    .step-item.active {
      color: var(--md-sys-color-primary);
      font-weight: 600;
    }
    .step-item.active .step-num {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }
    .step-item.done {
      color: var(--md-sys-color-primary);
    }
    .step-item.done .step-num {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    /* ===== 卡片 ===== */
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 14px;
      border-radius: 20px;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .card-desc {
      margin: 0;
      font-size: 12px;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface-variant);
    }
    .mock-code {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
    }

    .resend-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 28px;
      margin-top: -4px;
    }
    .resend-wait {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
    .field st-input {
      width: 100%;
    }
    .field-hint {
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.85;
    }
    .field-error {
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-error);
    }
    .rebind-notice {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      font-size: 12px;
      line-height: 1.6;
    }

    .terms-field {
      margin-top: 4px;
    }
    .agree-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface);
      user-select: none;
    }
    .agree-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: var(--md-sys-color-primary);
      flex-shrink: 0;
      cursor: pointer;
    }
    .agree-text {
      cursor: pointer;
    }
    .terms-link {
      color: var(--md-sys-color-primary);
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
    .terms-link:hover {
      opacity: 0.8;
    }

    .dlg-terms::part(panel) {
      /* 面板 shadow 内是 width: min(34.29em,100%)，必须用 width（非 max-width）覆盖 */
      width: min(800px, 94vw);
    }
    /* 弹窗体不滚动：标题固定 + 条文区滚动 + 底部按钮固定 */
    .terms-body {
      display: flex;
      flex-direction: column;
      max-height: min(78vh, 640px);
      font-size: 12px;
      line-height: 1.8;
      color: var(--md-sys-color-on-surface-variant);
    }
    .terms-heading {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 18px 20px 4px;
      font-size: 15px;
      color: var(--md-sys-color-on-surface);
      flex-shrink: 0;
    }
    .terms-updated {
      margin: 0 20px 10px;
      font-size: 11px;
      flex-shrink: 0;
    }
    .terms-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 20px;
    }
    .terms-sec h3 {
      margin: 14px 0 4px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface);
    }
    .terms-sec p {
      margin: 0;
    }
    .terms-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ===== 套餐 ===== */
    .plans {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .plans-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .plans-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
    }
    .plan-perks {
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.85;
    }
    .plan-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .plan-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 64px;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      font: inherit;
      text-align: start;
      cursor: pointer;
      box-sizing: border-box;
      transition:
        background-color 0.15s,
        border-color 0.15s;
    }
    .plan-option:hover {
      background-color: var(--md-sys-color-surface-container);
    }
    .plan-option.selected {
      border-color: var(--md-sys-color-primary);
      background: linear-gradient(
        135deg,
        var(--md-sys-color-primary-container),
        var(--md-sys-color-tertiary-container)
      );
      color: var(--md-sys-color-on-primary-container);
    }
    .plan-option-top {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .plan-option-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .plan-badge {
      padding: 0 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.6;
      white-space: nowrap;
      background-color: var(--md-sys-color-tertiary);
      color: var(--md-sys-color-on-tertiary);
    }
    .plan-option-price {
      flex-shrink: 0;
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .plan-option-per {
      margin-left: 4px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0.75;
    }

    /* ===== 支付 ===== */
    .pay-method {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--md-sys-color-primary);
      background-color: var(--md-sys-color-surface-container);
    }
    .pay-method-icon {
      flex-shrink: 0;
      font-size: 22px;
      color: var(--md-sys-color-primary);
    }
    .pay-method-body {
      flex: 1;
      min-width: 0;
    }
    .pay-method-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .pay-method-badge {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .pay-method-desc {
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
    }
    .pay-card-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 0.8fr);
      gap: 10px;
    }
    .pay-card-grid .field st-input {
      width: 100%;
      min-width: 0;
    }
    .pay-total {
      margin-right: auto;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .pay-total strong {
      font-size: 15px;
      color: var(--md-sys-color-on-surface);
      font-variant-numeric: tabular-nums;
    }

    /* ===== 成功页 ===== */
    .success-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .success-head n-icon {
      font-size: 28px;
      color: var(--md-sys-color-primary);
    }
    .kv-list,
    .user-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .user-block {
      padding: 14px 12px;
      border-radius: 14px;
      background-color: var(--md-sys-color-surface-container);
    }
    .user-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
    }
    .kv {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1.6;
      min-width: 0;
    }
    .kv .k {
      flex-shrink: 0;
      color: var(--md-sys-color-on-surface-variant);
    }
    .kv .v {
      min-width: 0;
      word-break: break-all;
      color: var(--md-sys-color-on-surface);
    }
    .kv .v.id-value {
      font-family: monospace;
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .invite-code {
      font-family: monospace;
      font-size: 10px;
      line-height: 1.5;
      word-break: break-all;
      color: var(--md-sys-color-on-surface-variant);
      background-color: var(--md-sys-color-surface-container-high);
      padding: 8px 10px;
      border-radius: 10px;
    }

    @media (max-width: 480px) {
      .plan-options {
        grid-template-columns: minmax(0, 1fr);
      }
      .pay-card-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .pay-card-grid .field:first-child {
        grid-column: 1 / -1;
      }
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@main/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@main/packages/dialog/dialog.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <main class="wrap">
    <header class="head">
      <div class="head-top">
        <div class="brand">
          <div class="brand-icon">
            <n-icon icon="mdi:crown-outline"></n-icon>
          </div>
          <div class="brand-text">
            <h1><locale-text><span lang="cn">会员中心</span><span lang="en">Membership</span></locale-text></h1>
            <p class="sub">
              <locale-text><span lang="cn">验证码与支付由 Synchratex 服务端处理，成功后自动配置中转 key。</span><span lang="en">Verification and payment are handled by the Synchratex server. Your relay key is configured automatically.</span></locale-text>
            </p>
          </div>
        </div>
        <o-if :value="isLocalDemo">
          <span class="mock-badge">
            <n-icon icon="mdi:flask-outline"></n-icon>
            <locale-text><span lang="cn">服务端演示</span><span lang="en">Server demo</span></locale-text>
          </span>
        </o-if>
      </div>
    </header>

    <!-- 已有会员（服务端 binding） -->
    <o-if :value="hasBinding">
      <div class="status-card">
        <n-icon icon="mdi:check-decagram-outline"></n-icon>
        <div class="status-body">
          <div class="status-title">{{boundPlanName}}</div>
          <div class="status-sub">{{boundStatusText}}</div>
          <div class="status-sub" class:error="!localKeyBound">
            <o-if :value="localKeyBound">
              <locale-text><span lang="cn">中转 key 已在本地 AI 配置中。</span><span lang="en">Relay key is already in your local AI config.</span></locale-text>
            </o-if>
            <o-if :value="!localKeyBound">
              <locale-text><span lang="cn">本机没有找到这个中转 key，可一键找回并重新绑定。</span><span lang="en">The relay key is missing on this device — restore it in one click.</span></locale-text>
            </o-if>
          </div>
        </div>
        <!-- 本机已有 key（登录/购买时已自动写入）就不需要手动找回，按钮仅在其缺失时出现 -->
        <o-if :value="!localKeyBound">
          <st-button
            variant="outlined"
            attr:disabled="rebinding"
            on:click="rebindKey"
          >
            <n-icon icon="mdi:key-plus" slot="prefix"></n-icon>
            <locale-text><span lang="cn">找回 key</span><span lang="en">Restore key</span></locale-text>
          </st-button>
        </o-if>
      </div>
    </o-if>

    <div class="steps">
      <div
        class="step-item"
        class:active="step === 'form'"
        class:done="step !== 'form'"
      >
        <span class="step-num">1</span>
        <span><locale-text><span lang="cn">邮箱</span><span lang="en">Email</span></locale-text></span>
      </div>
      <div
        class="step-item"
        class:active="step === 'code'"
        class:done="step === 'pay' || step === 'done'"
      >
        <span class="step-num">2</span>
        <span><locale-text><span lang="cn">验证邮箱</span><span lang="en">Verify</span></locale-text></span>
      </div>
      <div
        class="step-item"
        class:active="step === 'pay'"
        class:done="step === 'done'"
      >
        <span class="step-num">3</span>
        <span><locale-text><span lang="cn">支付</span><span lang="en">Pay</span></locale-text></span>
      </div>
      <div class="step-item" class:active="step === 'done'">
        <span class="step-num">4</span>
        <span><locale-text><span lang="cn">完成</span><span lang="en">Done</span></locale-text></span>
      </div>
    </div>

    <!-- ===== 步骤 1：邮箱 / 用户名 ===== -->
    <o-if :value="step === 'form'">
      <section class="benefits">
        <div class="benefits-title">
          <n-icon icon="mdi:diamond-stone"></n-icon>
          <locale-text><span lang="cn">购买会员后拥有</span><span lang="en">Included with membership</span></locale-text>
        </div>
        <o-fill :value="benefits" fill-key="title">
          <div class="benefit">
            <n-icon class="benefit-icon" attr:icon="$data.icon"></n-icon>
            <div>
              <div class="benefit-title">{{$data.title}}</div>
              <div class="benefit-desc">{{$data.desc}}</div>
            </div>
          </div>
        </o-fill>
      </section>
      <section class="card">
        <h2 class="card-title">
          <locale-text><span lang="cn">第 1 步 · 邮箱</span><span lang="en">Step 1 · Email</span></locale-text>
        </h2>
        <div class="field">
          <label class="field-label"><locale-text><span lang="cn">邮箱</span><span lang="en">Email</span></locale-text></label>
          <st-input
            sync:value="email"
            type="email"
            attr:placeholder="emailPlaceholder"
            on:input="onEmailInput"
          ></st-input>
          <div class="field-hint">{{emailHint}}</div>
          <o-if :value="emailError">
            <div class="field-error">{{emailError}}</div>
          </o-if>
        </div>
        <div class="field terms-field">
          <div class="agree-row">
            <input
              type="checkbox"
              id="agree-check"
              data-testid="agree-checkbox"
              on:change="onAgreeChange"
            />
            <label for="agree-check" class="agree-text">
              <locale-text>
                <span lang="cn">我已阅读并同意</span>
                <span lang="en">I have read and agree to the</span>
              </locale-text>
            </label>
            <a
              class="terms-link"
              data-testid="terms-link"
              on:click="openTermsDialog"
            ><locale-text><span lang="cn">《用户使用条款》</span><span lang="en">Terms of Use</span></locale-text></a>
          </div>
          <o-if :value="agreeError">
            <div class="field-error">{{agreeError}}</div>
          </o-if>
        </div>
        <div class="actions">

        cardCvcPlaceholder: { cn: "CVC", en: "CVC" },
        payMockHint: {
          cn: "服务端 mock 支付：测试卡已预填，不会真实扣款。",
          en: "Server-side mock payment: test card prefilled, no real charge.",
        },
        copyUserIdTitle: { cn: "复制用户 ID", en: "Copy user ID" },
        userIdCopied: { cn: "用户 ID 已复制", en: "User ID copied" },
        copyFailed: { cn: "复制失败，请手动复制", en: "Copy failed, please copy manually" },
        inviteCopied: { cn: "邀请码已复制", en: "Invite code copied" },
        keyRestored: { cn: "中转 key 已找回并保存", en: "Relay key restored and saved" },
        keyAlready: { cn: "中转 key 已保存在本地", en: "Relay key is already saved locally" },
        serverError: { cn: "服务端错误：{msg}", en: "Server error: {msg}" },
        networkError: {
          cn: "无法连接 Synchratex 服务端：{msg}",
          en: "Cannot reach the Synchratex server: {msg}",
        },
      };
      const t = (key, params) => {
        const item = L10N[key];
        if (!item) return key;
        let text = getLocaleText(item);
        if (params) {
          for (const [name, value] of Object.entries(params)) {
            text = text.replaceAll(`{${name}}`, String(value));
          }
        }
        return text;
      };

      const planName = (id, fallback) => {
        if (id === "monthly") {
          return getLocaleText({ cn: "Mazmot Pro 月度会员", en: "Mazmot Pro Monthly" });
        }
        if (id === "annual") {
          return getLocaleText({ cn: "Mazmot Pro 年度会员", en: "Mazmot Pro Yearly" });
        }
        return fallback || id;
      };

      const planPerks = getLocaleText({
        cn: "默认 AI 使用量 · 更大的转发流量 · 新功能优先使用",
        en: "Default AI quota · Larger relay traffic · Priority features",
      });

      const benefits = [
        {
          icon: "mdi:brain",
          title: getLocaleText({ cn: "默认额度的 AI 使用量", en: "Default AI usage quota" }),
          desc: getLocaleText({
            cn: "开通即分配可直接使用的 AI 调用额度，不用自己配 Key。",
            en: "A built-in AI quota you can use right away — no API key setup.",
          }),
        },
        {
          icon: "mdi:server-network",
          title: getLocaleText({ cn: "更大的服务器转发流量", en: "Larger relay traffic" }),
          desc: getLocaleText({
            cn: "更高的中转流量上限，长对话与批量任务不易触顶。",
            en: "A higher relay cap for long conversations and batch tasks.",
          }),
        },
        {
          icon: "mdi:rocket-launch-outline",
          title: getLocaleText({ cn: "优先使用 Mazmot 新功能", en: "Priority access to new features" }),
          desc: getLocaleText({
            cn: "例如点对点互联等能力，会员优先开放。",
            en: "Capabilities such as P2P interconnection open to members first.",
          }),
        },
      ];

      return {
        data: {
          step: "form",
          serverName: "Synchratex",
          userId: "",

          // 服务端绑定信息（找回）
          hasBinding: false,
          boundPlanName: "",
          boundStatusText: "",
          boundInviteCode: "",
          localKeyBound: false,
          rebinding: false,
          rebindNotice: "",

          // 套餐（价格来自 /api/plans）
          plans: FALLBACK_PLANS,
          planId: "monthly",
          planPerks,
          monthlyName: planName("monthly"),
          annualName: planName("annual"),
          monthlyPrice: "$10",
          annualPrice: "$100",
          monthlyPeriod: getLocaleText({ cn: "/ 月", en: "/ month" }),
          annualPeriod: getLocaleText({ cn: "/ 年", en: "/ year" }),
          annualBadge: "",
          payAmountText: "$10",
          payButtonText: getLocaleText({ cn: "支付 $10（模拟）", en: "Pay $10 (mock)" }),

          // 步骤 1
          email: "",
          emailPlaceholder: t("emailPlaceholder"),
          emailHint: t("emailHint"),
          emailError: "",
          formValid: false,
          agreed: false,
          agreeError: "",
          termsOpen: false,
          sending: false,

          // 步骤 2
          ticketId: "",
          mockCode: "",
          mockCodeHint: "",
          code: "",
          codePlaceholder: t("codePlaceholder"),
          codeError: "",
          codeSentText: "",
          verifying: false,

          // 步骤 3
          cardNumber: MOCK_CARD.number,
          cardExpiry: MOCK_CARD.expiry,
          cardCvc: MOCK_CARD.cvc,
          cardNumberPlaceholder: t("cardNumberPlaceholder"),
          cardExpiryPlaceholder: t("cardExpiryPlaceholder"),
          cardCvcPlaceholder: t("cardCvcPlaceholder"),
          payMockHint: t("payMockHint"),
          payValid: true,
          paying: false,

          // 步骤 4
          donePlanName: "",
          doneAmountText: "",
          doneServerText: "",
          doneEmail: "",
          doneExpireText: "",
          doneOrderId: "",
          doneTitle: "",
          doneInviteCode: "",
          doneUsername: "",
          doneUserId: "",
          copyUserIdTitle: t("copyUserIdTitle"),

          benefits,

          isLocalDemo,
          resendLeft: 0,
        },

        async ready() {
          await this.loadUser();
          await this.loadPlans();
          await this.loadBinding();
        },

        detached() {
          if (this._resendTimer) {
            clearInterval(this._resendTimer);
            this._resendTimer = null;
          }
        },

        proto: {
          applyPlans(list) {
            const plans = (list && list.length ? list : FALLBACK_PLANS).filter(
              (plan) => plan.id === "monthly" || plan.id === "annual",
            );
            this.plans = plans.length ? plans : FALLBACK_PLANS;
            const monthly = this.plans.find((plan) => plan.id === "monthly") || FALLBACK_PLANS[0];
            const annual = this.plans.find((plan) => plan.id === "annual") || FALLBACK_PLANS[1];
            this.monthlyPrice = priceText(monthly.price_cents, "USD");
            this.annualPrice = priceText(annual.price_cents, "USD");
            this.monthlyPeriod = periodText(monthly.billing_interval);
            this.annualPeriod = periodText(annual.billing_interval);
            this.annualBadge = annual.savings_cents
              ? getLocaleText({
                  cn: `省 ${priceText(annual.savings_cents, "USD")}`,
                  en: `Save ${priceText(annual.savings_cents, "USD")}`,
                })
              : "";
            this.syncPayAmount();
          },

          syncPayAmount() {
            const plan = this.plans.find((item) => item.id === this.planId) || this.plans[0];
            const amount = priceText(plan.price_cents, "USD");
            this.payAmountText = amount;
            this.payButtonText = getLocaleText({
              cn: `支付 ${amount}（模拟）`,
              en: `Pay ${amount} (mock)`,
            });
          },

          pickPlan(id) {
            if (id !== "monthly" && id !== "annual") return;
            this.planId = id;
            this.syncPayAmount();
          },

          async loadUser() {
            try {
              const user = await getUser("default");
              const info = await user.getInfo();
              this.userId = info.subject || user.userId || "";
              if (info.username) this.doneUsername = info.username;
            } catch (err) {
              console.error("[membership] 读取本地用户失败：", err);
            }
          },

          async loadPlans() {
            try {
              const { status, data } = await api.plans();
              if (status === 200 && data && Array.isArray(data.plans)) {
                this.applyPlans(data.plans);
              }
            } catch (err) {
              console.warn("[membership] 读取套餐失败，使用兜底价格：", err);
            }
          },

          localKeyExists(code) {
            if (!code) return false;
            return ai
              .getApiKeys()
              .some((key) => key.provider === "relay" && key.apiKey === code);
          },

          async loadBinding() {
            if (!this.userId) return;
            try {
              const { status, data } = await api.binding(this.userId);
              if (status !== 200 || !data || !data.bound) return;
              this.hasBinding = true;
              this.boundPlanName = planName(data.member.planId, data.member.planName);
              this.boundStatusText = getLocaleText({
                cn: `绑定邮箱 ${data.member.email} · 有效期至 ${formatDate(data.member.expiresAt)}`,
                en: `Bound to ${data.member.email} · valid until ${formatDate(data.member.expiresAt)}`,
              });
              this.boundInviteCode = data.relay.inviteCode;
              this.localKeyBound = this.localKeyExists(this.boundInviteCode);
              if (!this.email) this.email = data.member.email;
              this.refreshFormValid();
            } catch (err) {
              console.warn("[membership] 查询会员绑定失败（服务端未启动？）：", err);
            }
          },

          async rebindKey() {
            if (this.rebinding) return;
            if (!this.userId) {
              toast({ message: t("networkError", { msg: "无本地用户" }), color: "error" });
              return;
            }
            this.rebinding = true;
            try {
              const { status, data } = await api.binding(this.userId);
              if (status !== 200 || !data || !data.bound) {
                toast({
                  message: t("serverError", { msg: "服务端没有这个会员的绑定" }),
                  color: "error",
                });
                return;
              }
              this.boundInviteCode = data.relay.inviteCode;
              const saved = this.saveRelayKey(data.relay.inviteCode);
              this.localKeyBound = true;
              toast({
                message: saved ? t("keyRestored") : t("keyAlready"),
                color: "success",
              });
            } catch (err) {
              toast({ message: t("networkError", { msg: err.message || err }), color: "error" });
            } finally {
              this.rebinding = false;
            }
          },

          saveRelayKey(inviteCode) {
            if (!inviteCode) return false;
            if (this.localKeyExists(inviteCode)) return false;
            const serverUrl = inviteServerUrl(inviteCode);
            ai.saveKey(inviteCode, "relay", {
              serverName: this.serverName,
              ...(serverUrl ? { serverUrl } : {}),
            });
            return true;
          },

          refreshFormValid() {
            this.formValid = isValidEmail(this.email);
          },

          onEmailInput(event) {
            this.email = event.target.value;
            this.emailError = "";
            this.refreshFormValid();
          },

          validateForm() {
            this.emailError = "";
            if (!isValidEmail(this.email)) this.emailError = t("emailInvalid");
            this.refreshFormValid();
            return !this.emailError;
          },

          onAgreeChange(event) {
            this.agreed = !!event.target.checked;
            if (this.agreed) this.agreeError = "";
          },

          openTermsDialog() {
            this.termsOpen = true;
          },

          closeTermsDialog() {
            this.termsOpen = false;
          },

          agreeTermsDialog() {
            this.termsOpen = false;
            this.agreed = true;
            this.agreeError = "";
            // 勾选框无双向绑定，弹窗内点「同意」时同步勾上
            const box = this.shadow.$("#agree-check");
            if (box) box.ele.checked = true;
          },

          async goCode() {
            if (this.sending) return;
            if (!this.validateForm()) return;
            if (!this.agreed) {
              this.agreeError = t("agreeRequired");
              return;
            }
            if (!this.userId) {
              await this.loadUser();
            }
            this.sending = true;
            try {
              const { status, data } = await api.sendCode({
                email: this.email.trim(),
                mazmotUserId: this.userId,
                planId: this.planId,
              });
              if (status === 200 && data && data.ok) {
                this.applySendResult(data);
                this.step = "code";
              } else {
                this.emailError =
                  (data && data.error && data.error.message) ||
                  t("serverError", { msg: `HTTP ${status}` });
              }
            } catch (err) {
              this.emailError = t("networkError", { msg: err.message || err });
            } finally {
              this.sending = false;
            }
          },

          // 发码成功后的共用收口（首次发送与重新发送共用）
          applySendResult(data) {
            this.ticketId = data.ticketId;
            this.rebindNotice = data.rebind ? t("rebindNotice") : "";
            this.mockCode = data.mockCode || "";
            // 只有 mock 模式（服务端回传 mockEmail/mockCode）才展示演示码气泡
            this.mockCodeHint = this.mockCode
              ? getLocaleText({
                  cn: `服务端返回的演示验证码：${this.mockCode}`,
                  en: `Demo code returned by the server: ${this.mockCode}`,
                })
              : "";
            this.code = "";
            this.codeError = "";
            this.codeSentText = this.mockCode
              ? getLocaleText({
                  cn: `验证码已由服务端发送至 ${maskEmail(this.email)}（演示环境不会真的发信）。`,
                  en: `The server sent a code to ${maskEmail(this.email)} (nothing is really sent in this demo).`,
                })
              : getLocaleText({
                  cn: `验证码邮件已发送至 ${maskEmail(this.email)}，请查收（没收到可看看垃圾箱）。`,
                  en: `A verification email was sent to ${maskEmail(this.email)}. If you don't see it, check the spam folder.`,
                });
            this.startResendCountdown();
          },

          // 重发倒计时（服务端冷却 60s，前端同步展示）
          startResendCountdown() {
            if (this._resendTimer) clearInterval(this._resendTimer);
            this.resendLeft = 60;
            this._resendTimer = setInterval(() => {
              this.resendLeft = Math.max(0, this.resendLeft - 1);
              if (this.resendLeft === 0) {
                clearInterval(this._resendTimer);
                this._resendTimer = null;
              }
            }, 1000);
          },

          async resendCode() {
            if (this.resendLeft > 0 || this.sending) return;
            await this.goCode();
          },

          onCodeInput(event) {
            this.code = event.target.value;
            this.codeError = "";
          },

          backToForm() {
            this.codeError = "";
            this.step = "form";
          },

          async verifyCode() {
            if (this.verifying) return;
            this.verifying = true;
            try {
              const { status, data } = await api.confirmCode(this.ticketId, this.code.trim());
              if (status === 200 && data && data.ok) {
                this.codeError = "";
                if (data.rebound) {
                  // 改绑：确认即过户完成，无需支付，直达完成页
                  this.applyReboundDone(data);
                  return;
                }
                this.step = "pay";
              } else {
                this.codeError =
                  (data && data.error && data.error.message) ||
                  t("serverError", { msg: `HTTP ${status}` });
              }
            } catch (err) {
              this.codeError = t("networkError", { msg: err.message || err });
            } finally {
              this.verifying = false;
            }
          },

          backToCode() {
            this.step = "code";
          },

          // 改绑确认完成：会员已过户到当前账户（无新订单），邀请码不变，
          // 写回本地 AI 配置后直达完成页。
          applyReboundDone(data) {
            const member = data.member || {};
            const relay = data.relay || {};
            this.doneTitle = getLocaleText({
              cn: "重新绑定成功",
              en: "Rebind complete",
            });
            this.donePlanName = planName(member.planId, "");
            this.doneAmountText = "—";
            this.doneServerText = relay.serverUrl || inviteServerUrl(relay.inviteCode);
            this.doneEmail = member.email;
            this.doneExpireText = formatDate(member.expiresAt);
            this.doneOrderId = "—";
            this.doneInviteCode = relay.inviteCode;
            this.hasBinding = true;
            this.boundPlanName = this.donePlanName;
            this.boundInviteCode = relay.inviteCode;
            this.localKeyBound = this.saveRelayKey(relay.inviteCode);
            this.boundStatusText = getLocaleText({
              cn: `绑定邮箱 ${member.email} · 有效期至 ${this.doneExpireText}`,
              en: `Bound to ${member.email} · valid until ${this.doneExpireText}`,
            });
            this.step = "done";
            this.emit("membership-purchased", {
              data: {
                planId: member.planId,
                email: member.email,
                username: member.username || "",
                userId: this.userId,
                inviteCode: relay.inviteCode,
                serverName: this.serverName || "",
              },
              bubbles: true,
              composed: true,
            });
          },

          onCardInput() {
            this.payValid = isValidMockCard({
              number: this.cardNumber,
              expiry: this.cardExpiry,
              cvc: this.cardCvc,
            });
          },

          async payNow() {
            if (this.paying) return;
            this.payValid = isValidMockCard({
              number: this.cardNumber,
              expiry: this.cardExpiry,
              cvc: this.cardCvc,
            });
            if (!this.payValid) return;

            this.paying = true;
            try {
              const { status, data } = await api.checkout(this.ticketId, this.planId);
              if (status !== 200 || !data || !data.ok) {
                toast({
                  message:
                    (data && data.error && data.error.message) ||
                    t("serverError", { msg: `HTTP ${status}` }),
                  color: "error",
                });
                return;
              }

              const inviteCode = data.relay.inviteCode;
              const serverUrl = data.relay.serverUrl || inviteServerUrl(inviteCode);
              const info = await api.serverInfo(serverUrl);
              if (info && info.name) this.serverName = info.name;
              this.saveRelayKey(inviteCode);

              this.doneUserId = this.userId;
              this.doneUsername = data.member.username;

              this.doneTitle = getLocaleText({
                cn: "购买成功",
                en: "Purchase complete",
              });
              this.donePlanName = planName(data.member.planId, data.member.planName);
              this.doneAmountText = priceText(data.order.amountCents, data.order.currency);
              this.doneServerText = serverUrl;
              this.doneEmail = data.member.email;
              this.doneExpireText = formatDate(data.member.expiresAt);
              this.doneOrderId = data.order.id;
              this.doneInviteCode = inviteCode;
              this.hasBinding = true;
              this.boundPlanName = this.donePlanName;
              this.boundInviteCode = inviteCode;
              this.localKeyBound = true;
              this.boundStatusText = getLocaleText({
                cn: `绑定邮箱 ${data.member.email} · 有效期至 ${this.doneExpireText}`,
                en: `Bound to ${data.member.email} · valid until ${this.doneExpireText}`,
              });
              this.step = "done";

              this.emit("membership-purchased", {
                data: {
                  planId: data.member.planId,
                  priceUSD: data.order.amountCents / 100,
                  email: data.member.email,
                  username: this.doneUsername,
                  userId: this.doneUserId,
                  orderId: data.order.id,
                  expireAt: data.member.expiresAt,
                  inviteCode,
                  serverName: this.serverName || "",
                },
                bubbles: true,
                composed: true,
              });
            } catch (err) {
              toast({ message: t("networkError", { msg: err.message || err }), color: "error" });
            } finally {
              this.paying = false;
            }
          },

          async copyUserId() {
            if (!this.doneUserId) return;
            try {
              await navigator.clipboard.writeText(this.doneUserId);
              toast({ message: t("userIdCopied"), color: "success" });
            } catch (err) {
              toast({ message: t("copyFailed"), color: "error" });
            }
          },

          finish() {
            this.emit("membership-close", { bubbles: true, composed: true });
          },
        },
      };
    };
  </script>
</template>
