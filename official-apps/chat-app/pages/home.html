  <script>
    export default async ({ load }) => {
      // ===== 加载依赖 =====
      const p2p = await load("../lib/p2p.js");
      const storage = await load("../lib/storage.js");

      console.log("%c[chat-app host] 页面模块加载", "color:#6750a4;font-weight:600;");

      return {
        data: {
          // 本端身份
          myUserId: "",
          myName: "加载中...",
          // 联系人列表：[{ peerUserId, displayName, lastMessage, lastMessageAt, unread }]
          contacts: [],
          // 当前选中
          currentPeerId: "",
          currentPeerName: "",
          messages: [], // [{ id, role:"self"|"peer", text, timestamp }]
          inputText: "",
          // 在线状态：peerUserId -> { online, linkType }
          onlineMap: {},
          // 链接生成
          linkDialogOpen: false,
          generating: false,
          genStatus: "",
          shareUrl: "",
        },

        proto: {
          // ===== 时间格式化 =====
          formatTime(ts) {
            if (!ts) return "";
            const d = new Date(ts);
            const hh = String(d.getHours()).padStart(2, "0");
            const mm = String(d.getMinutes()).padStart(2, "0");
            return hh + ":" + mm;
          },

          // ===== 头像首字符 =====
          avatarChar(c) {
            const name = (c && c.displayName) || this.peerShortId(c && c.peerUserId);
            return (name || "?").slice(0, 1).toUpperCase();
          },

          // ===== userId 短显示 =====
          peerShortId(id) {
            if (!id) return "";
            return id.slice(0, 8);
          },

          // ===== 判断联系人是否在线（模板用）=====
          isContactOnline(peerUserId) {
            const st = this.onlineMap[peerUserId];
            return !!(st && st.online);
          },

          // ===== 当前会话徽章 =====
          get peerBadgeType() {
            const st = this.onlineMap[this.currentPeerId];
            if (!st || !st.online) return "offline";
            if (st.linkType === "rtc") return "rtc";
            if (st.linkType === "server") return "relay";
            return "online";
          },
          get peerBadgeText() {
            const st = this.onlineMap[this.currentPeerId];
            if (!st || !st.online) return "离线";
            if (st.linkType === "rtc") return "WebRTC 直连";
            if (st.linkType === "server") return "服务器中转";
            return "在线";
          },

          // ===== 打开/关闭链接对话框 =====
          async openLinkDialog() {
            this.linkDialogOpen = true;
            // 首次打开自动生成
            if (!this.shareUrl && !this.generating) {
              await this.generateLink();
            }
          },
          closeLinkDialog(event) {
            // 点击遮罩关闭（对话框内部 stop-prop 阻止冒泡）
            this.linkDialogOpen = false;
          },

          selectLinkInput(event) {
            const el = event && event.target;
            if (el && typeof el.select === "function") {
              try { el.select(); } catch (_) {}
            }
          },

          async handleCopyLink() {
            if (this.generating || !this.shareUrl) return;
            console.log("[chat-app host] 复制链接:", this.shareUrl);
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(this.shareUrl);
              } else {
                const ta = document.createElement("textarea");
                ta.value = this.shareUrl;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
              }
              this.genStatus = "已复制到剪贴板，发给对方即可";
            } catch (err) {
              console.error("[chat-app host] 复制失败:", err);
              this.genStatus = "复制失败，请手动选中链接复制";
            }
          },

          // ===== 生成分享链接（复用 ping-pong 模式）=====
          async generateLink() {
            this.generating = true;
            this.genStatus = "准备中...";
            console.log("[chat-app host] 开始生成链接...");

            try {
              const self = this.parseSelfIdentity();
              if (!self) {
                throw new Error("无法识别当前应用的目录路径：" + location.pathname);
              }
              console.log("[chat-app host] 身份:", self);

              this.genStatus = "加载依赖...";
              const [fsMod, cacheMod, shareMgr] = await Promise.all([
                load("/nos/fs/main.js"),
                load("/gh/kirakiray/ever-cache/src/main.min.js"),
                load("/lib/share-mgr.js"),
              ]);
              const { init } = fsMod;
              const { storage: mazmotStorage } = cacheMod;
              const { publishApp, generateAppId } = shareMgr;

              const apps = (await mazmotStorage.apps) || [];
              const { dirName } = self;
              const record =
                apps.find((a) => a.name === dirName || a.virtualDirName === dirName) ||
                apps.find((a) => (a.dirName ? a.dirName.endsWith("/" + dirName) : false)) ||
                null;
              console.log("[chat-app host] 应用记录:", record ? record.name : "(无)");

              this.genStatus = "获取应用目录...";
              const rootDir = await init(self.namespace);
              const handle = await rootDir.get(dirName);

              let appId = (record && record.appId) || "";
              if (!appId) {
                appId = await generateAppId(dirName);
                if (record) {
                  record.appId = appId;
                  await mazmotStorage.setItem("apps", apps);
                }
              }

              const app = {
                _handle: handle,
                _recordName: dirName,
                name: (record && record.name) || "chat-app",
                version: (record && record.version) || "0.1.0",
                desc: (record && record.desc) || "",
                icon: (record && record.icon) || "💬",
                appId,
              };

              this.genStatus = "发布到分享网络...";
              console.log("[chat-app host] publishApp, appParams.host =", this.myUserId);
              const { shareUrl, payloadHash } = await publishApp(app, {
                appId,
                appParams: { host: this.myUserId },
                onProgress: ({ text }) => {
                  if (text) this.genStatus = text;
                },
              });

              if (record && payloadHash) {
                record.payloadHash = payloadHash;
                await mazmotStorage.setItem("apps", apps);
              }

              this.shareUrl = shareUrl;
              this.genStatus = "链接已生成，点击复制按钮分享给好友";
              console.log("[chat-app host] 链接生成成功:", shareUrl);
            } catch (err) {
              console.error("[chat-app host] 生成链接失败:", err);
              this.genStatus = "失败：" + (err.message || err);
            } finally {
              this.generating = false;
            }
          },

          // ===== 解析自身身份（路径格式 /$<ns>/<dirName>/client/index.html）=====
          parseSelfIdentity() {
            const m = location.pathname.match(/^\/\$(.+?)\/(.+?)\/client\/index\.html$/);
            if (!m) return null;
            return { namespace: m[1], dirName: m[2] };
          },

          // ===== 选择联系人，加载聊天记录 =====
          async selectContact(peerUserId) {
            console.log("[chat-app host] 选中联系人:", peerUserId);
            this.currentPeerId = peerUserId;
            const c = this.contacts.find((x) => x.peerUserId === peerUserId);
            this.currentPeerName = (c && (c.displayName || this.peerShortId(peerUserId))) || this.peerShortId(peerUserId);
            this.messages = await storage.getMessages(peerUserId);
            // 清零未读
            await storage.clearUnread(peerUserId);
            await this.refreshContacts();
            // 补绑在线事件（防止该联系人是历史记录但尚未绑事件）
            await this.ensurePeerEvents(peerUserId);
            this.scrollToBottom();
          },

          // ===== 刷新联系人列表 =====
          async refreshContacts() {
            this.contacts = await storage.getContacts();
          },

          // ===== 处理入站消息（服务回调）=====
          async handleIncomingMessage(data, ctx) {
            try {
              console.log("[chat-app host] 收到消息:", { data, from: ctx && ctx.fromUserId });
              if (!data || data.type !== "chat") {
                console.warn("[chat-app host] 忽略非 chat 类型消息:", data);
                return;
              }
              const peerUserId = ctx.fromUserId;
              const text = (data && data.text) || "";
              const ts = (data && data.timestamp) || Date.now();

              // 为新出现/已存在的 peer 绑定在线事件（运行期新联系人也要绑）
              await this.ensurePeerEvents(peerUserId);

              // 拉取对方昵称（优先消息里的 username，其次名片）
              if (data.username) {
                await storage.upsertContact({ peerUserId, displayName: data.username });
                if (this.currentPeerId === peerUserId) {
                  this.currentPeerName = data.username;
                }
              } else {
                // 也尝试通过名片拉取（不阻塞主流程）
                p2p.getPeerInfo(peerUserId).then((info) => {
                  if (info && info.displayName) {
                    storage.upsertContact({ peerUserId, displayName: info.displayName }).then(() => {
                      if (this.currentPeerId === peerUserId) {
                        this.currentPeerName = info.displayName;
                      }
                      this.refreshContacts();
                    });
                  }
                });
              }

              // 标记在线
              this.setOnlineState(peerUserId, true);

              // 空文本（如 ready 信号）只更新在线状态与昵称，不写消息
              if (!text) {
                console.log("[chat-app host] 空文本消息，仅更新状态:", peerUserId);
                await this.refreshContacts();
                return;
              }

              // 存消息
              const msg = await storage.addMessage(peerUserId, { role: "peer", text, timestamp: ts });
              // 更新联系人
              const isCurrent = this.currentPeerId === peerUserId;
              const cur = this.contacts.find((x) => x.peerUserId === peerUserId);
              const c = await storage.upsertContact({
                peerUserId,
                lastMessage: text,
                lastMessageAt: ts,
                unread: isCurrent ? 0 : ((cur && cur.unread) || 0) + 1,
              });
              await this.refreshContacts();

              // 若是当前会话，追加到 messages
              if (isCurrent) {
                this.messages.push(msg);
                this.scrollToBottom();
              } else {
                // 非当前会话，触发桌面通知
                this.notifyNewMessage(c.displayName || this.peerShortId(peerUserId), text);
              }
            } catch (err) {
              console.error("[chat-app host] handleIncomingMessage 异常:", err);
            }
          },

          // ===== 发送消息 =====
          async sendMessage() {
            const text = (this.inputText || "").trim();
            const peerUserId = this.currentPeerId;
            if (!text || !peerUserId) {
              console.log("[chat-app host] sendMessage 跳过: text 或 peerUserId 为空");
              return;
            }
            console.log("[chat-app host] 发送消息 →", { peerUserId, text });
            const ts = Date.now();

            // 先加入本地消息列表（乐观更新）
            const msg = await storage.addMessage(peerUserId, { role: "self", text, timestamp: ts });
            this.messages.push(msg);
            this.inputText = "";
            this.scrollToBottom();

            // 更新联系人
            await storage.upsertContact({
              peerUserId,
              lastMessage: text,
              lastMessageAt: ts,
            });
            await this.refreshContacts();

            // 获取自己的用户名随消息发送
            let username = "";
            try {
              const info = await p2p.getCurrentUserInfo();
              username = info.displayName;
            } catch (err) {
              console.warn("[chat-app host] 获取自身用户名失败:", err);
            }

            // 发送
            try {
              const results = await p2p.sendToPeer(peerUserId, {
                type: "chat",
                text,
                timestamp: ts,
                username,
              });
              const parsed = p2p.parseSendResults(results);
              console.log("[chat-app host] 发送结果:", parsed);
              if (!parsed.delivered) {
                console.warn("[chat-app host] 消息未送达:", results);
              }
              if (parsed.via) {
                this.setOnlineState(peerUserId, true, parsed.via);
              }
            } catch (err) {
              console.error("[chat-app host] 发送失败:", err);
            }
          },

          handleKeydown(event) {
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault();
              this.sendMessage();
            }
          },

          // ===== 在线状态管理 =====
          setOnlineState(peerUserId, online, linkType) {
            const cur = this.onlineMap[peerUserId] || { online: false, linkType: "" };
            const next = {
              online: typeof online === "boolean" ? online : cur.online,
              linkType: linkType || cur.linkType,
            };
            if (next.online !== cur.online || next.linkType !== cur.linkType) {
              console.log("[chat-app host] 在线状态变更:", peerUserId, next);
              // 触发响应式更新
              this.onlineMap = Object.assign({}, this.onlineMap, { [peerUserId]: next });
            }
          },

          // ===== 桌面通知 =====
          async notifyNewMessage(title, body) {
            try {
              if (!("Notification" in window)) return;
              if (Notification.permission === "granted") {
                new Notification(title, { body: body.slice(0, 80) });
              } else if (Notification.permission !== "denied") {
                const perm = await Notification.requestPermission();
                if (perm === "granted") {
                  new Notification(title, { body: body.slice(0, 80) });
                }
              }
            } catch (err) {
              console.warn("[chat-app host] 通知失败:", err);
            }
          },

          // ===== 滚动到底部 =====
          scrollToBottom() {
            requestAnimationFrame(() => {
              const list = this.shadow.$("#msgList");
              if (list && list.ele) {
                list.ele.scrollTop = list.ele.scrollHeight;
              }
            });
          },

          // ===== 为某个 peer 绑定在线事件 =====
          async ensurePeerEvents(peerUserId) {
            if (this._peerEventsBound && this._peerEventsBound[peerUserId]) return;
            this._peerEventsBound = this._peerEventsBound || {};
            console.log("[chat-app host] 绑定对端事件:", peerUserId);
            const unbind = await p2p.bindPeerEvents(peerUserId, {
              onOnline: () => this.setOnlineState(peerUserId, true),
              onOffline: () => this.setOnlineState(peerUserId, false),
              onLinkType: (via) => this.setOnlineState(peerUserId, true, via === "rtc" ? "rtc" : "server"),
            });
            this._peerEventsBound[peerUserId] = unbind;
          },
        },

        // ===== 生命周期 =====
        async ready() {
          console.log("%c[chat-app host] ready 开始", "color:#6750a4;font-weight:600;");
          try {
            // 初始化存储
            await storage.initStorage();

            // 获取当前用户
            const info = await p2p.getCurrentUserInfo();
            this.myUserId = (await p2p.getCurrentUser()).userId;
            this.myName = info.displayName;
            console.log("[chat-app host] 当前用户:", { userId: this.myUserId, name: this.myName });

            // 加载历史联系人
            await this.refreshContacts();
            console.log("[chat-app host] 联系人:", this.contacts.length);

            // 请求通知权限（静默，不阻塞）
            if ("Notification" in window && Notification.permission === "default") {
              Notification.requestPermission().catch(() => {});
            }

            // 注册服务
            const unregister = await p2p.registerService((data, ctx) => {
              this.handleIncomingMessage(data, ctx);
            });
            this._unregister = unregister;

            // 对每个已有联系人：连接 + 绑定事件 + 检查在线
            for (const c of this.contacts) {
              try {
                // 主动连接（不阻塞流程，失败忽略）
                p2p.connectPeer(c.peerUserId).catch((err) => {
                  console.warn("[chat-app host] 连接已有联系人失败:", c.peerUserId, err);
                });
                await this.ensurePeerEvents(c.peerUserId);
                const online = await p2p.isPeerOnline(c.peerUserId);
                this.setOnlineState(c.peerUserId, online);
              } catch (err) {
                console.warn("[chat-app host] 初始化联系人状态失败:", c.peerUserId, err);
              }
            }

            console.log("[chat-app host] ready 完成 ✓");
          } catch (err) {
            console.error("[chat-app host] ready 失败:", err);
            this.myName = "初始化失败";
          }
        },

        detached() {
          console.log("[chat-app host] detached");
          try { this._unregister && this._unregister(); } catch (_) {}
          // 解绑所有对端事件
          if (this._peerEventsBound) {
            Object.values(this._peerEventsBound).forEach((fn) => {
              try { fn(); } catch (_) {}
            });
          }
        },
      };
    };
  </script>
</template>
