<template page>
  <style>
    :host {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      overflow: hidden;
    }

    /* ===== 顶部标题栏 ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--md-sys-color-surface-container);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      flex-shrink: 0;
    }
    .chat-header-name {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      flex-shrink: 0;
    }
    .link-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--md-sys-color-outline);
    }
    .link-badge[type="online"] { background: rgb(52 168 83 / 0.15); color: #1b7a33; }
    .link-badge[type="online"]::before { background: #34a853; }
    .link-badge[type="rtc"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .link-badge[type="rtc"]::before { background: #34a853; }
    .link-badge[type="relay"] { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
    .link-badge[type="relay"]::before { background: #ea8a00; }
    .link-badge[type="offline"]::before { background: var(--md-sys-color-error); }

    /* ===== 消息列表 ===== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-row {
      display: flex;
      max-width: 78%;
    }
    .msg-row.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.peer { align-self: flex-start; }
    .msg-bubble {
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-row.self .msg-bubble {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-bottom-right-radius: 4px;
    }
    .msg-row.peer .msg-bubble {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }

    /* ===== 输入区 ===== */
    .input-area {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--md-sys-color-outline-variant);
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 22px;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }
    .input-area input:focus { border-color: var(--md-sys-color-primary); }
    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.9; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== 加载 / 错误状态 ===== */
    .status-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }
    .status-screen n-icon {
      font-size: 48px;
      opacity: 0.4;
    }
    .status-screen h3 {
      margin: 0;
      font-size: 16px;
      color: var(--md-sys-color-on-surface);
    }
    .status-screen p {
      margin: 0;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 320px;
      line-height: 1.6;
    }
    .status-screen.error h3 { color: var(--md-sys-color-error); }
    .status-screen .retry-btn {
      margin-top: 8px;
      padding: 8px 22px;
      border: none;
      border-radius: 18px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-size: 13px;
      cursor: pointer;
    }
    .status-screen n-icon.spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <l-m src="/nos/n-icon/n-icon.html"></l-m>

  <!-- ===== 加载状态 ===== -->
  <o-if :value="phase === 'loading'">
    <div class="status-screen">
      <n-icon icon="mdi:loading" class="spin"></n-icon>
      <h3>正在连接</h3>
      <p>{{statusText}}</p>
    </div>
  </o-if>

  <!-- ===== 连接失败 ===== -->
  <o-if :value="phase === 'error'">
    <div class="status-screen error">
      <n-icon icon="mdi:alert-circle-outline"></n-icon>
      <h3>无法连接</h3>
      <p>{{statusText}}</p>
      <button class="retry-btn" on:click="retry">重试</button>
    </div>
  </o-if>

  <!-- ===== 正常聊天界面 ===== -->
  <o-if :value="phase === 'chat'">
    <div class="header">
      <span class="chat-header-name">{{peerName}}</span>
      <span class="link-badge" attr:type="badgeType">{{badgeText}}</span>
    </div>
    <div class="messages" id="msgList">
      <o-fill :value="messages">
        <div
          class="msg-row"
          class:self="$data.role === 'self'"
          class:peer="$data.role === 'peer'"
        >
          <div>
            <div class="msg-bubble">{{$data.text}}</div>
            <div class="msg-time">{{$host.formatTime($data.timestamp)}}</div>
          </div>
        </div>
      </o-fill>
    </div>
    <div class="input-area">
      <input
        type="text"
        sync:value="inputText"
        placeholder="输入消息..."
        on:keydown="handleKeydown($event)"
      />
      <button class="send-btn" on:click="sendMessage" attr:disabled="!inputText">
        <n-icon icon="mdi:send"></n-icon>
      </button>
    </div>
  </o-if>

  <script>
    export default async ({ load }) => {
      const p2p = await load("../lib/p2p.js");
      const storage = await load("../lib/storage.js");

      console.log("%c[chat-app customer] 页面模块加载", "color:#6750a4;font-weight:600;");

      // 从 URL 解析 host 参数（兼容 hash query）
      const params = new URLSearchParams(location.search);
      const hashQuery = location.hash.includes("?") ? location.hash.split("?")[1] : "";
      new URLSearchParams(hashQuery).forEach((value, key) => {
        if (!params.has(key)) params.set(key, value);
      });
      const hostUserId = params.get("host") || "";

      console.log("[chat-app customer] URL 参数:", { hostUserId, search: location.search, hash: location.hash });

      return {
        data: {
          phase: "loading", // loading | chat | error
          statusText: "初始化中...",
          hostUserId,
          myUserId: "",
          myName: "",
          peerName: "对方",
          messages: [], // [{ id, role:"self"|"peer", text, timestamp }]
          inputText: "",
          peerOnline: false,
          linkType: "", // "" | "rtc" | "server"
        },

        proto: {
          formatTime(ts) {
            if (!ts) return "";
            const d = new Date(ts);
            return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
          },

          get badgeType() {
            if (!this.peerOnline) return "offline";
            if (this.linkType === "rtc") return "rtc";
            if (this.linkType === "server") return "relay";
            return "online";
          },
          get badgeText() {
            if (!this.peerOnline) return "离线";
            if (this.linkType === "rtc") return "WebRTC 直连";
            if (this.linkType === "server") return "服务器中转";
            return "在线";
          },

          // ===== 初始化入口（支持重试）=====
          async init() {
            console.log("[chat-app customer] init 开始");
            this.phase = "loading";
            this.statusText = "初始化中...";

            try {
              if (!hostUserId) {
                throw new Error("链接缺少 host 参数，请确认是通过分享链接打开的");
              }

              // 初始化存储
              await storage.initStorage();

              // 获取当前用户信息
              const info = await p2p.getCurrentUserInfo();
              this.myUserId = (await p2p.getCurrentUser()).userId;
              this.myName = info.displayName;
              console.log("[chat-app customer] 当前用户:", { userId: this.myUserId, name: this.myName });

              // 加载历史消息
              this.messages = await storage.getMessages(hostUserId);
              console.log("[chat-app customer] 历史消息:", this.messages.length, "条");
              this.scrollToBottom();

              // 注册服务（接收 host 回复）
              if (this._unregister) {
                try { this._unregister(); } catch (_) {}
              }
              const unregister = await p2p.registerService((data, ctx) => {
                this.handleIncomingMessage(data, ctx);
              });
              this._unregister = unregister;

              // 连接 host
              this.statusText = "正在连接对方...";
              console.log("[chat-app customer] connectPeer:", hostUserId);
              await p2p.connectPeer(hostUserId);

              // 绑定对端事件
              if (this._unbindPeer) {
                try { this._unbindPeer(); } catch (_) {}
              }
              this._unbindPeer = await p2p.bindPeerEvents(hostUserId, {
                onOnline: () => {
                  console.log("[chat-app customer] 对方上线");
                  this.peerOnline = true;
                },
                onOffline: () => {
                  console.log("[chat-app customer] 对方下线");
                  this.peerOnline = false;
                },
                onLinkType: (via) => {
                  console.log("[chat-app customer] 连接方式:", via);
                  this.linkType = via === "rtc" ? "rtc" : "server";
                },
              });

              // 检查在线
              const online = await p2p.isPeerOnline(hostUserId);
              this.peerOnline = online;
              console.log("[chat-app customer] host 在线状态:", online);

              // 获取 host 的用户名（名片）
              const peerInfo = await p2p.getPeerInfo(hostUserId);
              if (peerInfo && peerInfo.displayName) {
                this.peerName = peerInfo.displayName;
                console.log("[chat-app customer] host 用户名:", this.peerName);
              }

              if (!online) {
                this.statusText = "对方当前不在线，发送的消息将在对方上线后送达";
              }

              this.phase = "chat";
              console.log("[chat-app customer] init 完成 ✓");

              // 发送一条同步消息，让 host 知道我连进来了（带上我的用户名）
              this.notifyHostReady();
            } catch (err) {
              console.error("[chat-app customer] init 失败:", err);
              this.phase = "error";
              this.statusText = err.message || String(err);
            }
          },

          // ===== 通知 host 我已就绪（顺便交换用户名）=====
          async notifyHostReady() {
            try {
              console.log("[chat-app customer] 发送就绪信号给 host");
              await p2p.sendToPeer(hostUserId, {
                type: "chat",
                text: "",
                timestamp: Date.now(),
                username: this.myName,
                ready: true,
              });
            } catch (err) {
              console.warn("[chat-app customer] 就绪信号发送失败:", err);
            }
          },

          retry() {
            this.init();
          },

          // ===== 处理入站消息 =====
          async handleIncomingMessage(data, ctx) {
            try {
              console.log("[chat-app customer] 收到消息:", data);
              if (!data || data.type !== "chat") return;
              // 忽略空文本（如 ready 信号）
              if (!data.text) {
                // 但仍更新对方用户名
                if (data.username) {
                  this.peerName = data.username;
                }
                this.peerOnline = true;
                return;
              }
              const ts = data.timestamp || Date.now();
              const msg = await storage.addMessage(hostUserId, {
                role: "peer",
                text: data.text,
                timestamp: ts,
              });
              this.messages.push(msg);
              this.peerOnline = true;
              if (data.username && data.username !== this.peerName) {
                this.peerName = data.username;
              }
              this.scrollToBottom();
            } catch (err) {
              console.error("[chat-app customer] handleIncomingMessage 异常:", err);
            }
          },

          // ===== 发送消息 =====
          async sendMessage() {
            const text = (this.inputText || "").trim();
            if (!text) return;
            console.log("[chat-app customer] 发送消息 →", text);
            const ts = Date.now();

            // 乐观更新
            const msg = await storage.addMessage(hostUserId, {
              role: "self",
              text,
              timestamp: ts,
            });
            this.messages.push(msg);
            this.inputText = "";
            this.scrollToBottom();

            try {
              const results = await p2p.sendToPeer(hostUserId, {
                type: "chat",
                text,
                timestamp: ts,
                username: this.myName,
              });
              const parsed = p2p.parseSendResults(results);
              console.log("[chat-app customer] 发送结果:", parsed);
              if (!parsed.delivered) {
                console.warn("[chat-app customer] 消息未送达:", results);
              }
              if (parsed.via) {
                this.linkType = parsed.via === "rtc" ? "rtc" : "server";
              }
              if (parsed.delivered) {
                this.peerOnline = true;
              } else if (parsed.offline) {
                this.peerOnline = false;
              }
            } catch (err) {
              console.error("[chat-app customer] 发送失败:", err);
            }
          },

          handleKeydown(event) {
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault();
              this.sendMessage();
            }
          },

          scrollToBottom() {
            requestAnimationFrame(() => {
              const list = this.shadow.$("#msgList");
              if (list && list.ele) {
                list.ele.scrollTop = list.ele.scrollHeight;
              }
            });
          },
        },

        ready() {
          console.log("[chat-app customer] ready");
          return this.init();
        },

        detached() {
          console.log("[chat-app customer] detached");
          try { this._unregister && this._unregister(); } catch (_) {}
          try { this._unbindPeer && this._unbindPeer(); } catch (_) {}
        },
      };
    };
  </script>
</template>
