<template page>
  <style>
    :host {
      display: block;
      height: 100%;
      text-align: start;
    }
    .layout {
      display: flex;
      height: 100%;
      overflow: hidden;
    }
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      padding: 16px 8px;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-low);
      overflow-y: auto;
    }
    .sidebar-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      padding: 8px 16px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar st-list-item {
      border-radius: 28px;
      margin-bottom: 2px;
    }
    .sidebar st-list-item[active] {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .content {
      flex: 1;
      overflow-y: auto;
      /* 作为路由切换时旧子页面 absolute 定位的锚点：
         ofa 的 resetOldPage 会把旧页面设为 position:absolute，
         若无定位祖先会锚到 o-app 左上角，导致旧内容“跳到左侧”再消失 */
      position: relative;
    }
    /* 修复路由切换时旧子页面宽度塌缩：ofa 的 resetOldPage 会把旧页面设为
       position:absolute，但其内联 width 因 width getter 缺失而无效，
       width:auto 的绝对定位元素会 shrink-to-fit；显式 100% 让它在
       绝对定位后仍解析为定位容器（.content）的宽度，原地淡出 */
    .content ::slotted(o-page) {
      width: 100%;
      height: 100%;
    }
    @media (max-width: 640px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        width: auto;
        border-right: none;
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
        padding: 8px;
      }
    }
  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/list/list.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">
        <n-icon icon="mdi:shield-lock-outline"></n-icon>
        <locale-text><span lang="cn">凭证管理器</span><span lang="en">Credential Manager</span></locale-text>
      </div>
      <st-list>
        <st-list-item
          button
          attr:active="activeQuery"
          on:click="navQuery()"
        >
          <n-icon icon="mdi:card-account-details-outline" slot="prefix"></n-icon>
          <locale-text><span lang="cn">查询用户</span><span lang="en">User Lookup</span></locale-text>
        </st-list-item>
        <st-list-item
          button
          attr:active="activeMe"
          on:click="navMe()"
        >
          <n-icon icon="mdi:account-circle-outline" slot="prefix"></n-icon>
          <locale-text><span lang="cn">我的信息</span><span lang="en">My Info</span></locale-text>
        </st-list-item>
        <st-list-item
          button
          attr:active="activeKnown"
          on:click="navKnown()"
        >
          <n-icon icon="mdi:account-group-outline" slot="prefix"></n-icon>
          <locale-text><span lang="cn">已知用户</span><span lang="en">Known Users</span></locale-text>
        </st-list-item>
        <st-list-item
          button
          attr:active="activeOrgs"
          on:click="navOrgs()"
        >
          <n-icon icon="mdi:domain" slot="prefix"></n-icon>
          <locale-text><span lang="cn">组织管理</span><span lang="en">Organizations</span></locale-text>
        </st-list-item>
        <st-list-item
          button
          attr:active="activeShare"
          on:click="navShare()"
        >
          <n-icon icon="mdi:swap-horizontal" slot="prefix"></n-icon>
          <locale-text><span lang="cn">互授</span><span lang="en">Live Share</span></locale-text>
        </st-list-item>
        <st-list-item
          button
          attr:active="activeCerts"
          on:click="navCerts()"
        >
          <n-icon icon="mdi:shield-account-outline" slot="prefix"></n-icon>
          <locale-text><span lang="cn">本地证书</span><span lang="en">Local Certificates</span></locale-text>
        </st-list-item>
      </st-list>
    </div>
    <div class="content">
      <slot></slot>
    </div>
  </div>

  <script>
    export default async () => {
      return {
        data: {
          activeQuery: true,
          activeMe: false,
          activeCerts: false,
          activeKnown: false,
          activeOrgs: false,
          activeShare: false,
        },
        routerChange() {
          this.refreshActive();
        },
        ready() {
          this.refreshActive();
        },
        proto: {
          refreshActive() {
            const { current } = this.app;
            const path = new URL(current.src).pathname;
            this.activeQuery = path.endsWith("query-user.html");
            this.activeMe = path.endsWith("my-info.html");
            // cert-detail 是本地证书的子页，进入详情时保持该项高亮
            this.activeCerts =
              path.endsWith("my-certs.html") || path.endsWith("cert-detail.html");
            this.activeKnown = path.endsWith("known-users.html");
            this.activeShare = path.endsWith("live-share.html");
            // org-detail 是组织管理的子页，进入详情时保持该项高亮
            this.activeOrgs =
              path.endsWith("orgs.html") || path.endsWith("org-detail.html");
          },
          navQuery() {
            // goto 的相对路径以 app-config 所在的应用根目录为基准
            this.app.goto("./pages/query-user.html");
          },
          navMe() {
            this.app.goto("./pages/my-info.html");
          },
          navCerts() {
            this.app.goto("./pages/my-certs.html");
          },
          navKnown() {
            this.app.goto("./pages/known-users.html");
          },
          navOrgs() {
            this.app.goto("./pages/orgs.html");
          },
          navShare() {
            this.app.goto("./pages/live-share.html");
          },
        },
      };
    };
  </script>
</template>
