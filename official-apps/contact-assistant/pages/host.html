<template page>
  <style>
    :host {
      display: block;
      height: 100%;
      overflow: hidden;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgb(from var(--md-sys-color-outline) r g b / 0.15);
      background-color: var(--md-sys-color-surface-variant);
      flex-shrink: 0;
    }

    .header n-icon {
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
    }

    .header-title {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    .summary-panel {
      flex-shrink: 0;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      padding: 12px 16px;
      border-bottom: 1px solid rgb(from var(--md-sys-color-outline) r g b / 0.1);
    }

    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .summary-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-body {
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0.95;
    }

    .summary-placeholder {
      font-size: 13px;
      opacity: 0.7;
      font-style: italic;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid rgb(from var(--md-sys-color-outline) r g b / 0.15);
      background-color: var(--md-sys-color-surface-variant);
      display: flex;
      flex-direction: column;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 600;
      padding: 12px 16px;
      color: var(--md-sys-color-on-surface-variant);
      border-bottom: 1px solid rgb(from var(--md-sys-color-outline) r g b / 0.1);
    }

    .contact-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background-color 0.15s;
    }

    .contact-item:hover {
      background-color: rgb(from var(--md-sys-color-on-surface) r g b / 0.05);
    }

    .contact-item.active {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .contact-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contact-meta {
      font-size: 11px;
      opacity: 0.7;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-contacts {
      padding: 32px 16px;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13px;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background-color: var(--md-sys-color-surface);
    }

    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid rgb(from var(--md-sys-color-outline) r g b / 0.1);
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      max-width: 80%;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .message.visitor {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.assistant .message-bubble {
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface-variant);
      border-bottom-left-radius: 4px;
    }

    .message.visitor .message-bubble {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-bottom-right-radius: 4px;
    }

    .message-time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }

    .typing {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      padding: 0 16px;
      height: 20px;
      flex-shrink: 0;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid rgb(from var(--md-sys-color-outline) r g b / 0.15);
      background-color: var(--md-sys-color-surface-variant);
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 20px;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
      box-sizing: border-box;
    }

    .input-area input:focus {
      outline: none;
      border-color: var(--md-sys-color-primary);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface-variant);
      text-align: center;
      padding: 24px;
    }

    .btn-small {
      padding: 5px 10px;
      border-radius: 8px;
      border: none;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-size: 12px;
      cursor: pointer;
    }

    .btn-small:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .sidebar {
        width: 200px;
      }
    }
  </style>

  <l-m src="/nos/n-icon/n-icon.html"></l-m>

  <div class="container">
    <div class="header">
      <n-icon icon="mdi:arrow-left" on:click="backHome"></n-icon>
      <span class="header-title">{{space?.name || '工作台'}}</span>
      <span class="status-badge">{{serviceStatus}}</span>
    </div>

    <div class="summary-panel">
      <div class="summary-header">
        <span class="summary-title">
          <n-icon icon="mdi:sparkles"></n-icon>
          AI 联系总结
        </span>
        <button
          class="btn-small"
          on:click="summarizeCurrent"
          attr:disabled="!currentVisitorId || summarizing"
        >
          {{summarizing ? '总结中...' : '重新总结'}}
        </button>
      </div>
      <o-if :value="currentSummary">
        <div class="summary-body">{{currentSummary}}</div>
      </o-if>
      <o-if :value="!currentSummary">
        <div class="summary-placeholder">选择一个联系人后点击「重新总结」生成 AI 摘要。</div>
      </o-if>
    </div>

    <div class="main">
      <div class="sidebar">
        <div class="sidebar-title">联系过我的用户</div>
        <div class="contact-list">
          <o-if :value="contacts.length === 0">
            <div class="empty-contacts">
              <n-icon icon="mdi:account-outline" style="font-size: 32px; opacity: 0.5;"></n-icon>
              <p>还没有人联系你</p>
            </div>
          </o-if>
          <o-if :value="contacts.length > 0">
            <div>
              <o-fill :value="contacts">
                <div
                  class="contact-item"
                  class:active="$data.visitorId === $host.currentVisitorId"
                  on:click="$host.selectContact($data.visitorId)"
                >
                  <div class="contact-avatar">{{$host.avatarText($data)}}</div>
                  <div class="contact-info">
                    <div class="contact-name">{{$host.contactName($data)}}</div>
                    <div class="contact-meta">{{$host.contactMeta($data)}}</div>
                  </div>
                </div>
              </o-fill>
            </div>
          </o-if>
        </div>
      </div>

      <div class="chat-area">
        <o-if :value="!currentVisitorId">
          <div class="empty-chat">
            <n-icon icon="mdi:chat-outline" style="font-size: 48px; opacity: 0.4;"></n-icon>
            <p>从左侧选择一个联系人查看对话</p>
          </div>
        </o-if>

        <o-if :value="currentVisitorId">
          <div class="chat-header">{{currentContactName}}</div>
          <div class="messages">
            <o-fill :value="messages">
              <div
                class="message"
                class:assistant="$data.role === 'assistant'"
                class:visitor="$data.role === 'visitor'"
              >
                <div>
                  <div class="message-bubble">{{$data.content}}</div>
                  <div class="message-time">{{$host.formatTime($data.timestamp)}}</div>
                </div>
              </div>
            </o-fill>
          </div>
          <div class="typing">{{typingText}}</div>
          <div class="input-area">
            <input
              type="text"
              sync:value="inputText"
              placeholder="以主人身份回复..."
              on:keydown="handleKeydown($event)"
            />
            <button
              class="send-btn"
              on:click="sendManualReply"
              attr:disabled="!inputText || aiReplying"
            >
              <n-icon icon="mdi:send"></n-icon>
            </button>
          </div>
        </o-if>
      </div>
    </div>
  </div>

  <script>
    export default async ({ query, load }) => {
      const storageMod = await load("../lib/storage.js");
      const p2pMod = await load("../lib/p2p.js");
      const aiMod = await load("../lib/ai-service.js");
      const aiMain = await load("/ai/main.js");

      const {
        getSpace,
        getContacts,
        updateContact,
        getMessages,
        addMessage,
      } = storageMod;
      const { registerService, replyToVisitor } = p2pMod;
      const { replyAndSave, summarize } = aiMod;
      const { getAssistant } = aiMain;

      const spaceId = query.spaceId || "";

      const formatTime = (ts) => {
        if (!ts) return "";
        const d = new Date(ts);
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      };

      const contactName = (c) =>
        c?.visitorName || c?.visitorId?.slice(0, 8) || "未知访客";

      const avatarText = (c) => {
        const name = contactName(c);
        return name.slice(0, 1).toUpperCase();
      };

      const contactMeta = (c) => {
        if (c.summary) return c.summary.slice(0, 18) + (c.summary.length > 18 ? "..." : "");
        const t = c.lastMessageAt;
        if (!t) return "暂无消息";
        return formatTime(t);
      };

      return {
        data: {
          space: null,
          contacts: [],
          currentVisitorId: "",
          messages: [],
          inputText: "",
          currentSummary: "",
          summarizing: false,
          aiReplying: false,
          serviceStatus: "启动中",
          typingText: "",
        },
        proto: {
          formatTime,
          contactName,
          avatarText,
          contactMeta,

          get currentContactName() {
            const c = this.contacts.find(
              (x) => x.visitorId === this.currentVisitorId,
            );
            return contactName(c);
          },

          backHome() {
            this.back();
          },

          async loadSpace() {
            this.space = (await getSpace(spaceId)) || null;
          },

          async loadContacts() {
            this.contacts = await getContacts(spaceId);
          },

          async selectContact(visitorId) {
            this.currentVisitorId = visitorId;
            this.messages = await getMessages(spaceId, visitorId);
            this.currentSummary = "";
            const c = this.contacts.find((x) => x.visitorId === visitorId);
            if (c && c.summary) {
              this.currentSummary = c.summary;
            }
            this.scrollToBottom();
          },

          scrollToBottom() {
            requestAnimationFrame(() => {
              const msgs = this.shadow.$(".messages");
              if (msgs && msgs.ele) {
                msgs.ele.scrollTop = msgs.ele.scrollHeight;
              }
            });
          },

          async handleIncomingMessage(data, ctx) {
            if (!data || data.spaceId !== spaceId) return;

            if (data.type === "chat") {
              const now = data.timestamp || Date.now();
              const visitorMsg = {
                id: `v-${now}`,
                role: "visitor",
                content: data.message || "",
                timestamp: now,
              };
              await addMessage(spaceId, data.visitorId, visitorMsg);
              await updateContact(spaceId, {
                visitorId: data.visitorId,
                lastMessageAt: now,
              });

              // 刷新联系人列表
              await this.loadContacts();

              // 如果是当前选中的联系人，刷新消息列表
              if (this.currentVisitorId === data.visitorId) {
                this.messages.push(visitorMsg);
                this.scrollToBottom();
              } else {
                // 自动切换到新联系人
                await this.selectContact(data.visitorId);
              }

              // AI 自动生成回复
              this.typingText = "助手正在输入...";
              this.aiReplying = true;
              try {
                const content = await replyAndSave(
                  getAssistant,
                  spaceId,
                  data.visitorId,
                );
                if (content && ctx) {
                  await replyToVisitor(ctx, {
                    type: "reply",
                    spaceId,
                    visitorId: data.visitorId,
                    message: content,
                    timestamp: Date.now(),
                  });

                  if (this.currentVisitorId === data.visitorId) {
                    this.messages = await getMessages(spaceId, data.visitorId);
                    this.scrollToBottom();
                  }
                }
              } catch (err) {
                console.error("AI 回复失败:", err);
              } finally {
                this.aiReplying = false;
                this.typingText = "";
              }
            } else if (data.type === "profile") {
              await updateContact(spaceId, {
                visitorId: data.visitorId,
                visitorName: data.name,
                contact: data.contact,
              });
              await this.loadContacts();
            }
          },

          async sendManualReply() {
            const text = this.inputText.trim();
            const visitorId = this.currentVisitorId;
            if (!text || !visitorId) return;

            const now = Date.now();
            const msg = {
              id: `m-${now}`,
              role: "assistant",
              content: text,
              timestamp: now,
            };
            await addMessage(spaceId, visitorId, msg);
            await updateContact(spaceId, { visitorId, lastMessageAt: now });
            this.messages.push(msg);
            this.inputText = "";
            this.scrollToBottom();

            // 如果知道对方 session 上下文，可尝试发送；MVP 仅本地保存
            await this.loadContacts();
          },

          handleKeydown(event) {
            if (event.key === "Enter" && !event.shiftKey) {
              this.sendManualReply();
            }
          },

          async summarizeCurrent() {
            const visitorId = this.currentVisitorId;
            if (!visitorId) return;
            this.summarizing = true;
            try {
              const summary = await summarize(getAssistant, spaceId, visitorId);
              this.currentSummary = summary;
              await this.loadContacts();
            } catch (err) {
              console.error("总结失败:", err);
              this.currentSummary = `总结失败：${err.message}`;
            } finally {
              this.summarizing = false;
            }
          },
        },
        async attached() {
          try {
            await this.loadSpace();
            await this.loadContacts();

            const unregister = await registerService((data, ctx) => {
              this.handleIncomingMessage(data, ctx);
            });
            this._unregisterService = unregister;
            this.serviceStatus = "已上线";

            if (this.contacts.length > 0 && !this.currentVisitorId) {
              await this.selectContact(this.contacts[0].visitorId);
            }
          } catch (err) {
            console.error("host attached error:", err);
            this.serviceStatus = "启动失败";
          }
        },
        async detached() {
          try {
            this._unregisterService?.();
          } catch (_) {}
        },
      };
    };
  </script>
</template>
