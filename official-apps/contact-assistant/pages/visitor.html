<template page>
  <style>
    :host {
      display: block;
      height: 100%;
      overflow: hidden;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }

    .container {
      display: flex;

      height: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgb(from var(--md-sys-color-outline) r g b / 0.15);
      background-color: var(--md-sys-color-surface-variant);
      flex-shrink: 0;
    }

    .header-title {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
    }

    .status-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    .welcome {
      padding: 16px;
      background: linear-gradient(
        135deg,
        var(--md-sys-color-primary-container),
        rgb(from var(--md-sys-color-tertiary-container) r g b / 0.6)
      );
      color: var(--md-sys-color-on-primary-container);
      flex-shrink: 0;
    }

    .welcome h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .welcome p {
      margin: 0;
      font-size: 13px;

    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      max-width: 85%;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .message.visitor {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-bubble {
      padding: 10px 14px;

      word-break: break-word;
    }

    .message.assistant .message-bubble {
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface-variant);
      border-bottom-left-radius: 4px;
    }

    .message.visitor .message-bubble {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-bottom-right-radius: 4px;
    }

    .message-time {
      font-size: 10px;

    .typing {
      font-size: 12px;

    }

    .input-area {
      display: flex;
      gap: 10px;

      border-top: 1px solid rgb(from var(--md-sys-color-outline) r g b / 0.15);

    .input-area input {
      flex: 1;

      border: 1px solid var(--md-sys-color-outline);

    .input-area input:focus {
      outline: none;

    .send-btn {
      width: 44px;

      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;

    }

    .send-btn:disabled {
      opacity: 0.5;

    }

    .empty-chat {
      flex: 1;
      display: flex;
      flex-direction: column;

      text-align: center;

    }

    .error-bar {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      padding: 10px 16px;
      font-size: 13px;
      flex-shrink: 0;
    }
  </style>

  <l-m src="/nos/n-icon/n-icon.html"></l-m>

  <div class="container">
    <div class="header">
      <span class="header-title">联络助手</span>
      <span class="status-badge">{{statusText}}</span>
    </div>

    <div class="welcome">
      <h2>你好，欢迎联系我 👋</h2>
      <p>
        我是主人的 AI 联络助手。你可以直接发送消息，我会根据主人提供的资料回复你，
        并帮你把需求转达给主人。
      </p>
    </div>

    <o-if :value="errorText">
      <div class="error-bar">{{errorText}}</div>
    </o-if>

    <o-if :value="messages.length === 0">
      <div class="empty-chat">
        <n-icon icon="mdi:message-text-outline" style="font-size: 48px; opacity: 0.4;"></n-icon>
        <p>开始和助手聊天吧</p>
      </div>
    </o-if>

    <o-if :value="messages.length > 0">
      <div class="messages">
        <o-fill :value="messages">
          <div
            class="message"
            class:assistant="$data.role === 'assistant'"
            class:visitor="$data.role === 'visitor'"
          >
            <div>
              <div class="message-bubble">{{$data.content}}</div>
              <div class="message-time">{{$host.formatTime($data.timestamp)}}</div>
            </div>
          </div>
        </o-fill>
      </div>
    </o-if>

    <div class="typing">{{typingText}}</div>

    <div class="input-area">
      <input
        type="text"
        sync:value="inputText"
        placeholder="输入消息..."
        on:keydown="handleKeydown($event)"
      />
      <button
        class="send-btn"
        on:click="sendMessage"
        attr:disabled="!inputText || sending"
      >
        <n-icon icon="mdi:send"></n-icon>
      </button>
    </div>
  </div>

  <script>
    export default async ({ load }) => {
      const storageMod = await load("../lib/storage.js");
      const p2pMod = await load("../lib/p2p.js");
      const {
        saveVisitorSpace,
        getVisitorSpace,
        getVisitorMessages,
        addVisitorMessage,
      } = storageMod;
      const {
        getCurrentUserId,
        connectHost,
        sendToHost,
        registerService,
      } = p2pMod;

      const spaceId = query.spaceId || "";
      const hostUserId = query.hostUserId || "";

      console.log("[contact-assistant visitor] page query:", {
        rawQuery: query,
        spaceId,
        hostUserId,
        currentUrl: location.href,
      });

      const formatTime = (ts) => {
        if (!ts) return "";
        const d = new Date(ts);
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      };

      return {
        data: {
          messages: [],
          inputText: "",
          sending: false,
          statusText: "连接中",
          typingText: "",
          errorText: "",
        },
        proto: {
          formatTime,

          scrollToBottom() {
            requestAnimationFrame(() => {
              const msgs = this.shadow.$(".messages");
              if (msgs && msgs.ele) {
                msgs.ele.scrollTop = msgs.ele.scrollHeight;
              }
            });
          },

          async initConnection() {
            if (!spaceId || !hostUserId) {
              const missing = [
                !spaceId && "spaceId",
                !hostUserId && "hostUserId",
              ].filter(Boolean);
              const detail = `缺少参数: ${missing.join(", ")}。当前 spaceId="${spaceId}", hostUserId="${hostUserId}", 完整 URL="${location.href}"`;
              console.error("[contact-assistant visitor] initConnection aborted:", detail);
              this.errorText = `链接缺少必要参数，无法打开聊天。${detail}`;
              this.statusText = "参数错误";
              return;
            }

            console.log("[contact-assistant visitor] initConnection start:", {
              spaceId,
              hostUserId,
            });

            try {
              console.log("[contact-assistant visitor] saving visitor space...");
              await saveVisitorSpace(spaceId, { spaceId, hostUserId });
              console.log("[contact-assistant visitor] connecting host...", hostUserId);
              await connectHost(hostUserId);

              console.log("[contact-assistant visitor] registering service...");
              const unregister = await registerService((data, ctx) => {
                console.log("[contact-assistant visitor] service message:", data, ctx);
                this.handleIncomingReply(data);
              });
              this._unregisterService = unregister;
              console.log("[contact-assistant visitor] service registered");

              this.statusText = "已连接";
            } catch (err) {
              console.error("[contact-assistant visitor] initConnection error:", err);
              this.statusText = "连接失败";
              this.errorText =
                (err && err.message) || "连接助手失败，请确认链接有效。";
            }
          },

          handleIncomingReply(data) {
            console.log("[contact-assistant visitor] handleIncomingReply:", data);
            if (!data || data.spaceId !== spaceId) {
              console.warn("[contact-assistant visitor] reply ignored, spaceId mismatch:", {
                expected: spaceId,
                got: data && data.spaceId,
              });
              return;
            }
            if (data.type === "reply") {
              const msg = {
                id: `a-${data.timestamp || Date.now()}`,
                role: "assistant",
                content: data.message || "",
                timestamp: data.timestamp || Date.now(),
              };
              addVisitorMessage(spaceId, msg).catch(() => {});
              this.messages.push(msg);
              this.typingText = "";
              this.scrollToBottom();
            }
          },

          async sendMessage() {
            const text = this.inputText.trim();
            if (!text || !hostUserId) {
              console.warn("[contact-assistant visitor] sendMessage skipped:", { text, hostUserId });
              return;
            }

            const now = Date.now();
            const msg = {
              id: `v-${now}`,
              role: "visitor",
              content: text,
              timestamp: now,
            };

            this.inputText = "";
            await addVisitorMessage(spaceId, msg);
            this.messages.push(msg);
            this.typingText = "等待助手回复...";
            this.scrollToBottom();

            this.sending = true;
            try {
              const visitorId = await getCurrentUserId();
              console.log("[contact-assistant visitor] sending message to host:", {
                hostUserId,
                visitorId,
                spaceId,
              });
              const results = await sendToHost(hostUserId, {
                type: "chat",
                spaceId,
                visitorId,
                message: text,
                timestamp: now,
              });
              console.log("[contact-assistant visitor] sendToHost results:", results);
              const delivered = Array.isArray(results)
                ? results.some((r) => r.status === "ok")
                : false;
              if (!delivered) {
                this.typingText = "消息已保存，但对方当前不在线。";
              }
            } catch (err) {
              console.error("[contact-assistant visitor] sendMessage error:", err);
              this.typingText = "发送失败，请稍后重试。";
            } finally {
              this.sending = false;
            }
          },

          handleKeydown(event) {
            if (event.key === "Enter" && !event.shiftKey) {
              this.sendMessage();
            }
          },
        },
        async attached() {
          try {
            this.messages = await getVisitorMessages(spaceId);
            await this.initConnection();
          } catch (err) {
            console.error("visitor attached error:", err);
            this.errorText = (err && err.message) || "初始化失败";
          }
        },
        async detached() {
          try {
            this._unregisterService?.();
          } catch (_) {}
        },
      };
    };
  </script>
</template>
