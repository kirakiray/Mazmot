  </style>

  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/list/list.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/card/card.html"></l-m>
  <l-m src="/ncomp/user-name/user-name.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>

  <div class="page">
    <div class="page-title">
      <n-icon icon="mdi:shield-account-outline"></n-icon>
      <locale-text><span lang="cn">我的证书</span><span lang="en">My Certificates</span></locale-text>
      <st-icon-button on:click="loadCerts()" attr:title="refreshTitle">
        <n-icon icon="mdi:refresh"></n-icon>
      </st-icon-button>
    </div>

    <st-card>
      <st-list>
        <o-fill :value="certList" fill-key="id">
          <st-list-item collapsible>
            <div class="cert-title">
              <span class="cert-role">{{$data.role}}</span>
              <o-if :value="$data.fromMe">
                <span class="cert-badge" data-kind="mine">
                  <n-icon icon="mdi:pencil-outline"></n-icon>
                  <locale-text><span lang="cn">我签发</span><span lang="en">Issued by me</span></locale-text>
                </span>
              </o-if>
              <o-if :value="$data.expired">
                <span class="cert-badge" data-kind="expired">
                  <n-icon icon="mdi:clock-alert-outline"></n-icon>
                  <locale-text><span lang="cn">已过期</span><span lang="en">Expired</span></locale-text>
                </span>
              </o-if>
            </div>
            <div secondary><n-user-name attr:user-id="$data.subject"></n-user-name></div>
            <st-list slot="sublist">
              <st-list-item>
                <div class="cert-info">
                  <div class="info-row">
                    <span class="info-label"><n-icon icon="mdi:pen"></n-icon><locale-text><span lang="cn">签发者：</span><span lang="en">Issuer:</span></locale-text></span>
                    <span class="info-value" attr:title="$data.issuer"><n-user-name attr:user-id="$data.issuer"></n-user-name></span>
                  </div>
                  <div class="info-row">
                    <span class="info-label"><n-icon icon="mdi:account-arrow-right-outline"></n-icon><locale-text><span lang="cn">主体：</span><span lang="en">Subject:</span></locale-text></span>
                    <span class="info-value" attr:title="$data.subject"><n-user-name attr:user-id="$data.subject"></n-user-name></span>
                  </div>
                  <div class="info-row">
                    <span class="info-label"><n-icon icon="mdi:clock-edit-outline"></n-icon><locale-text><span lang="cn">签发时间：</span><span lang="en">Issued at:</span></locale-text></span>
                    <span class="info-value">{{$data.signTimeText}}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label"><n-icon icon="mdi:calendar-remove-outline"></n-icon><locale-text><span lang="cn">过期时间：</span><span lang="en">Expires:</span></locale-text></span>
                    <span class="info-value">{{$data.expireText}}</span>
                  </div>
                  <o-fill :value="$data.extras">
                    <div class="info-row">
                      <span class="info-label">{{$data.key}}:</span>
                      <span class="info-value">{{$data.value}}</span>
                    </div>
                  </o-fill>
                  <div style="display:flex; justify-content:flex-end; padding-top:4px;">
                    <st-icon-button color="error" on:click="$host.deleteCert($host.certList[$index].id)" attr:title="$host.deleteTitle">
                      <n-icon icon="mdi:delete-outline"></n-icon>
                    </st-icon-button>
                  </div>
                </div>
              </st-list-item>
            </st-list>
          </st-list-item>
        </o-fill>
      </st-list>
      <o-if :value="certList.length === 0">
        <div class="empty">
          <locale-text>
            <span lang="cn">暂无证书（签发的或领取的都会显示在这里）</span>
            <span lang="en">No certificates yet (issued or claimed ones will appear here)</span>
          </locale-text>
        </div>
      </o-if>
    </st-card>
  </div>

  <script>
    import toast from "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js";
    import { ensureUser } from "/mz/share-mgr.js";
    import { getLocaleText } from "/nos/locale-text/get-locale-text.js";

    const formatTime = (ts) => {
      if (!ts) return "";
      try {
        return new Date(ts).toLocaleString();
      } catch (err) {
        return String(ts);
      }
    };

    const BUILTIN_KEYS = [
      "id", "role", "issuer", "subject", "signTime",
      "expire", "signature", "publicKey",
    ];

    export const parent = "./home.html";

    export default async () => {
      return {
        data: {
          certList: [],
          refreshTitle: getLocaleText({ cn: "刷新", en: "Refresh" }),
          deleteTitle: getLocaleText({ cn: "删除", en: "Delete" }),
        },
        async attached() {
          await this.loadCerts();
        },
        proto: {
          // 遍历本地凭证库中持有的全部授权证书（排除 profile），
          // 含自己签发的与领取到的，自定义字段逐条展示
          async loadCerts() {
            try {
              const user = await ensureUser();
              const now = Date.now();
              const list = [];
              for await (const cert of user.cred.values(
                {},
                { includeExpired: true },
              )) {
                if (cert.role === "profile") continue;
                const extras = Object.entries(cert)
                  .filter(([k]) => !BUILTIN_KEYS.includes(k))
                  .map(([k, v]) => ({
                    key: k,
                    value: typeof v === "object" ? JSON.stringify(v) : String(v),
                  }));
                list.push({
                  id: cert.id || "",
                  role: cert.role || "",
                  issuer: cert.issuer || "",
                  subject: cert.subject || "",
                  fromMe: cert.issuer === user.userId,
                  signTimeText: formatTime(cert.signTime),
                  expireText: cert.expire
                    ? formatTime(cert.expire)
                    : getLocaleText({ cn: "永不过期", en: "Never" }),
                  expired: !!cert.expire && cert.expire < now,
                  extras,
                });
              }
              this.certList = list;
            } catch (err) {
              console.error("读取证书失败：", err);
              toast({
                message: getLocaleText(
                  { cn: "读取证书失败：{msg}", en: "Failed to load certificates: {msg}" },
                  { msg: err.message || err },
                ),
                color: "error",
              });
            }
          },
          async deleteCert(id) {
            try {
              const user = await ensureUser();
              await user.cred.delete(id);
              await this.loadCerts();
              toast({
                message: getLocaleText({ cn: "已删除", en: "Deleted" }),
              });
            } catch (err) {
              console.error("删除证书失败：", err);
              toast({
                message: getLocaleText(
                  { cn: "删除失败：{msg}", en: "Delete failed: {msg}" },
                  { msg: err.message || err },
                ),
                color: "error",
              });
            }
          },
        },
      };
    };
  </script>
</template>
