<template page>
  <style>
    :host {
      display: none;
    }
  </style>
  <script>
    // 本页面是 client.html 的子路由，自身不渲染任何内容（display:none）。
    // 它的唯一职责是承载路径参数（?path=xxx），让文件夹导航通过应用路由
    // 产生历史记录，从而使浏览器后退键能在文件夹之间回退。
    // 父页面 client.html 通过 routerChange / applyRoute 响应路径变化。
    export const parent = "./client.html";

    export default async ({ query }) => {
      const routePath = query.path || "/";
      const routeHost = query.host || "";
      return {
        data: {
          routePath,
          routeHost,
        },
        async attached() {
          // 主动同步路径到父页面（双保险：父页面 routerChange 也会读取）
          const p = this.parent;
          if (p && typeof p.applyRoute === "function") {
            p.applyRoute(routePath, routeHost);
          }
        },
      };
    };
  </script>
</template>
