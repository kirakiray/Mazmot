<template page>
  <style>
    :host {
      display: block;
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* ===== 模式选择 ===== */
    .mode-select {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      padding: 24px;
    }

    .mode-brand {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 48px;
    }
    .mode-brand-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        var(--md-sys-color-primary),
        var(--md-sys-color-tertiary)
      );
      color: var(--md-sys-color-on-primary);
      font-size: 28px;
      flex-shrink: 0;
    }
    .mode-brand-title {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .mode-brand-sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .mode-cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 640px;
      width: 100%;
    }
    .mode-card {
      flex: 1 1 260px;
      max-width: 300px;
      padding: 28px 24px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 20px;
      background: var(--md-sys-color-surface-container);
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        transform 0.1s ease,
        box-shadow 0.15s ease;
      text-align: center;
    }
    .mode-card:hover {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    .mode-card:active {
      transform: scale(0.98);
    }
    .mode-card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .mode-card-icon[type="server"] {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .mode-card-icon[type="client"] {
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }
    .mode-card-icon n-icon {
      font-size: 26px;
    }
    .mode-card-title {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 600;
    }
    .mode-card-desc {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>

  <l-m src="/nos/n-icon/n-icon.html"></l-m>

  <o-if :value="role === 'loading'">
    <div
      style="display:flex;height:100%;align-items:center;justify-content:center;color:var(--md-sys-color-on-surface-variant);"
    >
      正在初始化...
    </div>
  </o-if>

  <o-if :value="role === 'select'">
    <div class="mode-select">
      <div class="mode-brand">
        <div class="mode-brand-icon">
          <n-icon icon="mdi:cloud-outline"></n-icon>
        </div>
        <div>
          <h1 class="mode-brand-title">云盘</h1>
          <p class="mode-brand-sub">选择运行模式开始使用</p>
        </div>
      </div>

      <div class="mode-cards">
        <div class="mode-card" on:click="selectServer">
          <div class="mode-card-icon" type="server">
            <n-icon icon="mdi:server-network"></n-icon>
          </div>
          <h2 class="mode-card-title">作为服务端</h2>
          <p class="mode-card-desc">
            选择存储空间，创建用户凭证，生成分享链接供客户端连接
          </p>
        </div>

        <div class="mode-card" on:click="selectClient">
          <div class="mode-card-icon" type="client">
            <n-icon icon="mdi:cloud-sync-outline"></n-icon>
          </div>
          <h2 class="mode-card-title">作为用户端</h2>
          <p class="mode-card-desc">
            输入服务端 ID 和用户名密码，连接后上传下载管理文件
          </p>
        </div>
      </div>
    </div>
  </o-if>

  <script>
    export default async ({ load }) => {
      const sp = new URLSearchParams(location.search);
      const hostUserId = sp.get("host") || "";

      return {
        data: {
          role: "loading",
        },

        async ready() {
          // 通过分享链接打开 -> 直接跳转客户端页面
          if (hostUserId) {
            console.log("[cloud-drive] 检测到 host 参数，跳转客户端模式");
            this.goto(
              "./client.html?host=" + encodeURIComponent(hostUserId),
            );
            return;
          }

          try {
            // 检测 Core 是否就绪
            const { getUser } = await load("/nos/user/main.js");
            await getUser("default");
            console.log("[cloud-drive] Core 已就绪，显示模式选择");
            this.role = "select";
          } catch (err) {
            console.error("[cloud-drive] 初始化失败：", err);
            this.role = "select";
          }
        },

        proto: {
          selectServer() {
            this.goto("./server.html");
          },

          selectClient() {
            this.goto("./client.html");
          },
        },
      };
    };
  </script>
</template>
