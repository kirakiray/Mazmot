  <script>
    const SERVICE_ID = "cloud-drive";
    const STORAGE_NAMESPACE = "cloud-drive-storage";
    const CHUNK_SIZE = 245760; // 240KB（服务端中转上限 256KB，留余量给协议头）

    async function calcHash(buffer) {
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function packBinary(transferId, chunkIndex, totalChunks, payload) {
      const headerJson = JSON.stringify({
        transferId,
        chunkIndex,
        totalChunks,
      });
      const headerBytes = new TextEncoder().encode(headerJson);
      const buf = new ArrayBuffer(4 + headerBytes.length + payload.byteLength);
      const view = new DataView(buf);
      view.setUint32(0, headerBytes.length, false); // big-endian
      new Uint8Array(buf, 4, headerBytes.length).set(headerBytes);
      new Uint8Array(buf, 4 + headerBytes.length).set(new Uint8Array(payload));
      return buf;
    }

    async function unpackBinary(raw) {
      // 统一为 ArrayBuffer
      let buf;
      if (raw instanceof Blob) {
        buf = await raw.arrayBuffer();
      } else if (raw instanceof ArrayBuffer) {
        buf = raw;
      } else if (ArrayBuffer.isView(raw)) {
        // Uint8Array 等 TypedArray — 取底层 buffer 的有效部分
        buf = raw.buffer.slice(
          raw.byteOffset,
          raw.byteOffset + raw.byteLength,
        );
      } else {
        throw new Error("unpackBinary: 不支持的数据类型 " + typeof raw);
      }
      const view = new DataView(buf);
      const headerLen = view.getUint32(0, false);
      const headerJson = new TextDecoder().decode(
        new Uint8Array(buf, 4, headerLen),
      );
      const header = JSON.parse(headerJson);
      const payload = buf.slice(4 + headerLen);
      return { header, payload };
    }

    export default async ({ load }) => {
      return {
          data: {
          serverUserId: "",
          mounts: [],
          users: [],
          clients: [],
          shareUrl: "",
          generating: false,
          genStatus: "",
          copied: false,
          newUsername: "",
          newPassword: "",
          supportLocalDir:
            typeof window.showDirectoryPicker === "function",
        },

        proto: {
          // ===== 返回模式选择 =====
          goBack() {
            this.goto("./home.html");
          },

          shortId(id) {
            if (!id) return "????";
            return id.slice(-6);
          },

          // =====================================================
          //  存储管理
          // =====================================================

          async addLocalMount() {
            try {
              const { open } = await load("/nos/fs/main.js");
              const handle = await open();
              if (!handle) return;

              const baseName = handle.name || "外部磁盘";
              let uniqueName = baseName;
              let counter = 1;
              while (this.mounts.some((m) => m.name === uniqueName)) {
                uniqueName = baseName + " " + counter;
                counter++;
              }

              this.mounts.push({
                id: "mount-" + Date.now(),
                name: uniqueName,
                type: "local",
                nativeHandle: handle._handle || handle,
                _handle: handle,
                needsAuth: false,
              });

              await this.persistMounts();
              console.log("[cloud-drive-server] 添加本地挂载:", uniqueName);
            } catch (err) {
              console.error("[cloud-drive-server] 添加本地目录失败:", err);
            }
          },

          async removeMount(mountId, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            const idx = this.mounts.findIndex((m) => m.id === mountId);
            if (idx === -1) return;
            if (this.mounts[idx].isDefault) {
              console.warn("[cloud-drive-server] 不能删除默认主目录");
              return;
            }
            this.mounts.splice(idx, 1);
            await this.persistMounts();
            console.log("[cloud-drive-server] 已移除挂载:", mountId);
          },

          async persistMounts() {
            const serializable = this.mounts.map((m) => ({
              id: m.id,
              name: m.name,
              type: m.type,
              isDefault: m.isDefault || false,
              nativeHandle: m.nativeHandle || null,
            }));
            await this._storage.setItem("cd-mounts", serializable);
          },

          async loadMounts() {
            const data = await this._storage.getItem("cd-mounts");
            const restored = [];

            if (Array.isArray(data)) {
              for (const m of data) {
                if (m.type === "virtual" && m.isDefault) {
                  // 默认虚拟目录稍后统一创建
                  continue;
                }
                if (m.type === "local" && m.nativeHandle) {
                  try {
                    const { DirHandle } = await load(
                      "/nos/fs/handle/dir.js",
                    );
                    const handle = new DirHandle(m.nativeHandle);
                    restored.push({
                      ...m,
                      _handle: handle,
                      needsAuth: false,
                    });
                  } catch (err) {
                    console.warn(
                      "[cloud-drive-server] 恢复本地挂载失败:",
                      m.name,
                      err,
                    );
                    restored.push({
                      ...m,
                      _handle: null,
                      needsAuth: true,
                    });
                  }
                }
              }
            }

            // 确保默认虚拟目录存在
            const { init } = await load("/nos/fs/main.js");
            const rootDir = await init(STORAGE_NAMESPACE);
            restored.unshift({
              id: "default",
              name: "主目录",
              type: "virtual",
              isDefault: true,
              _handle: rootDir,
              needsAuth: false,
            });

            this.mounts = restored;
            console.log(
              "[cloud-drive-server] 已加载挂载点:",
              restored.map((m) => m.name),
            );
          },

          async getMountDir(mount) {
            if (mount._handle) return mount._handle;
            if (mount.type === "virtual") {
              const { init } = await load("/nos/fs/main.js");
              const rootDir = await init(STORAGE_NAMESPACE);
              mount._handle = rootDir;
              return rootDir;
            }
            if (mount.type === "local" && mount.nativeHandle) {
              const { DirHandle } = await load("/nos/fs/handle/dir.js");
              const handle = new DirHandle(mount.nativeHandle);
              mount._handle = handle;
              mount.needsAuth = false;
              return handle;
            }
            throw new Error("挂载点不可用: " + mount.name);
          },

          // =====================================================
          //  路径解析
          // =====================================================

          parsePath(path) {
            const parts = (path || "").split("/").filter(Boolean);
            if (parts.length === 0) return { mount: null, subPath: [] };
            const mountName = decodeURIComponent(parts[0]);
            const mount = this.mounts.find((m) => m.name === mountName);
            return {
              mount,
              subPath: parts.slice(1).map((p) => decodeURIComponent(p)),
            };
          },

          async resolveDir(path) {
            const { mount, subPath } = this.parsePath(path);
            if (!mount) throw new Error("挂载点不存在");
            let dir = await this.getMountDir(mount);
            for (const name of subPath) {
              dir = await dir.get(name);
              if (!dir) throw new Error("路径不存在: " + name);
              if (dir.kind !== "dir") throw new Error("不是目录: " + name);
            }
            return dir;
          },

          async resolveFile(path) {
            const parts = (path || "").split("/").filter(Boolean);
            if (parts.length < 2) throw new Error("路径无效");
            const dirPath = parts.slice(0, -1).join("/");
            const fileName = decodeURIComponent(parts[parts.length - 1]);
            const dir = await this.resolveDir(dirPath);
            const file = await dir.get(fileName);
            if (!file) throw new Error("文件不存在: " + fileName);
            if (file.kind !== "file") throw new Error("不是文件: " + fileName);
            return file;
          },

          // =====================================================
          //  凭证管理
          // =====================================================

          async addUser() {
            const username = (this.newUsername || "").trim();
            const password = (this.newPassword || "").trim();
            if (!username || !password) return;
            if (this.users.some((u) => u.username === username)) {
              console.warn("[cloud-drive-server] 用户名已存在:", username);
              return;
            }
            this.users.push({ username, password });
            this.newUsername = "";
            this.newPassword = "";
            await this.persistUsers();
            console.log("[cloud-drive-server] 添加用户:", username);
          },

          async removeUser(username, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            const idx = this.users.findIndex((u) => u.username === username);
            if (idx === -1) return;
            this.users.splice(idx, 1);
            await this.persistUsers();
            console.log("[cloud-drive-server] 已删除用户:", username);
          },

          async persistUsers() {
            await this._storage.setItem(
              "cd-users",
              JSON.parse(JSON.stringify(this.users)),
            );
          },

          async loadUsers() {
            const data = await this._storage.getItem("cd-users");
            if (Array.isArray(data)) {
              this.users = data;
              console.log(
                "[cloud-drive-server] 已加载用户:",
                data.map((u) => u.username),
              );
            }
          },

          // =====================================================
          //  分享链接
          // =====================================================

          parseSelfIdentity() {
            const m = location.pathname.match(
              /^\/\$(.+?)\/(.+?)\/client\/index\.html$/,
            );
            if (!m) return null;
            return { namespace: m[1], dirName: m[2] };
          },

          async generateLink() {
            if (this.generating) return;
            this.generating = true;
            this.genStatus = "准备中...";
            try {
              const self = this.parseSelfIdentity();
              if (!self) {
                throw new Error("无法识别当前应用的目录路径");
              }
              console.log("[cloud-drive-server] 当前应用身份:", self);

              const [fsMod, shareMgr] = await Promise.all([
                load("/nos/fs/main.js"),
                load("/lib/share-mgr.js"),
              ]);
              const { init } = fsMod;
              const { publishApp, generateAppId } = shareMgr;

              const apps = (await this._storage.apps) || [];
              const { dirName } = self;
              const record =
                apps.find(
                  (a) => a.name === dirName || a.virtualDirName === dirName,
                ) ||
                apps.find((a) =>
                  (a.dirName || "").endsWith("/" + dirName),
                ) ||
                null;

              this.genStatus = "获取应用目录...";
              const rootDir = await init(self.namespace);
              const handle = await rootDir.get(dirName);

              let appId = (record && record.appId) || "";
              if (!appId) {
                appId = await generateAppId(dirName);
                if (record) {
                  record.appId = appId;
                  await this._storage.setItem("apps", apps);
                }
              }

              const app = {
                _handle: handle,
                _recordName: dirName,
                name: (record && record.name) || "cloud-drive",
                version: (record && record.version) || "1.0.0",
                desc: (record && record.desc) || "云盘",
                icon: (record && record.icon) || "☁️",
                appId,
              };

              this.genStatus = "发布到分享网络...";
              const { shareUrl, payloadHash } = await publishApp(app, {
                appId,
                appParams: { host: this.serverUserId },
                onProgress: ({ text }) => {
                  if (text) this.genStatus = text;
                },
              });

              if (record && payloadHash) {
                record.payloadHash = payloadHash;
                await this._storage.setItem("apps", apps);
              }

              this.shareUrl = shareUrl;
              this.genStatus = "链接已生成，可复制分享给他人";
              console.log("[cloud-drive-server] 分享链接已生成:", shareUrl);
            } catch (err) {
              console.error("[cloud-drive-server] 生成链接失败:", err);
              this.genStatus = "失败:" + (err.message || err);
            } finally {
              this.generating = false;
            }
          },

          selectLinkInput(event) {
            const el = event && event.target;
            if (el && typeof el.select === "function") {
              try {
                el.select();
              } catch (_) {}
            }
          },

          async copyLink() {
            if (!this.shareUrl) return;
            try {
              await navigator.clipboard.writeText(this.shareUrl);
            } catch (_) {}
            this.copied = true;
            clearTimeout(this._copyTimer);
            this._copyTimer = setTimeout(() => {
              this.copied = false;
            }, 1500);
          },

          async copyUserId() {
            if (!this.serverUserId) return;
            try {
              await navigator.clipboard.writeText(this.serverUserId);
            } catch (_) {}
            console.log("[cloud-drive-server] 已复制 userId");
          },

          // =====================================================
          //  P2P 消息处理
          // =====================================================

          handleIncoming(data, ctx) {
            if (!data || typeof data !== "object") return;
            const { kind } = data;
            const userId = ctx.fromUserId;

            console.log(
              "[cloud-drive-server] 收到消息:",
              kind,
              "from:",
              this.shortId(userId),
            );

            // 关键修复：包装 sendToService，确保所有回复定向到消息来源的 session
            // 解决客户端刷新重连后，serviceSessionCache 缓存旧 session 导致回复发送到死 session 的问题
            const realRemote = ctx.remoteUser;
            const fromSessionId = ctx.fromSessionId;
            ctx.remoteUser = new Proxy(realRemote, {
              get(target, prop) {
                if (prop === "sendToService") {
                  return (appId, msg, opts) =>
                    target.sendToService(appId, msg, {
                      ...(opts || {}),
                      sessionId: fromSessionId,
                    });
                }
                const val = target[prop];
                return typeof val === "function" ? val.bind(target) : val;
              },
            });

            // auth 不需要认证
            if (kind === "auth") {
              this.handleAuth(data, ctx);
              return;
            }

            // 其他操作需要认证
            if (!this._authClients.has(userId)) {
              ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "error",
                error: "未认证，请先登录",
              });
              return;
            }

            const handlers = {
              list: () => this.handleList(data, ctx),
              mkdir: () => this.handleMkdir(data, ctx),
              delete: () => this.handleDelete(data, ctx),
              rename: () => this.handleRename(data, ctx),
              upload_start: () => this.handleUploadStart(data, ctx),
              upload_complete: () => this.handleUploadComplete(data, ctx),
              download_request: () => this.handleDownloadRequest(data, ctx),
            };

            const handler = handlers[kind];
            if (handler) {
              handler().catch((err) => {
                console.error(
                  "[cloud-drive-server] 处理消息失败:",
                  kind,
                  err,
                );
              });
            } else {
              console.warn("[cloud-drive-server] 未知消息类型:", kind);
            }
          },

          handleAuth(data, ctx) {
            const { username, password } = data;
            const userId = ctx.fromUserId;

            const user = this.users.find(
              (u) => u.username === username && u.password === password,
            );

            if (user) {
              this._authClients.add(userId);

              let client = this.clients.find((c) => c.userId === userId);
              if (!client) {
                this.clients.push({
                  userId,
                  username,
                  online: true,
                });
              } else {
                client.online = true;
                client.username = username;
              }

              ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "auth_result",
                success: true,
              });
              console.log(
                "[cloud-drive-server] 客户端认证成功:",
                this.shortId(userId),
                username,
              );
            } else {
              ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "auth_result",
                success: false,
                error: "用户名或密码错误",
              });
              console.log(
                "[cloud-drive-server] 客户端认证失败:",
                this.shortId(userId),
              );
            }
          },

          async handleList(data, ctx) {
            const { path } = data;
            try {
              let items = [];
              if (!path || path === "/") {
                items = this.mounts.map((m) => ({
                  name: m.name,
                  kind: "dir",
                  size: 0,
                  lastModified: 0,
                }));
              } else {
                const dir = await this.resolveDir(path);
                for await (const [name, handle] of dir.entries()) {
                  const item = {
                    name,
                    kind: handle.kind,
                    size: 0,
                    lastModified: 0,
                  };
                  if (handle.kind === "file") {
                    try {
                      item.size = await handle.size();
                      item.lastModified = await handle.lastModified();
                    } catch (_) {}
                  }
                  items.push(item);
                }
              }

              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "list_result",
                path,
                items,
              });
              console.log(
                "[cloud-drive-server] 列出目录:",
                path,
                "共",
                items.length,
                "项",
              );
            } catch (err) {
              console.error("[cloud-drive-server] 列出目录失败:", err);
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "list_result",
                path,
                error: err.message,
              });
            }
          },

          async handleMkdir(data, ctx) {
            const { path, name } = data;
            try {
              const dir = await this.resolveDir(path);
              await dir.get(name, { create: "dir" });
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "mkdir_result",
                success: true,
              });
              console.log("[cloud-drive-server] 创建目录:", path + "/" + name);
            } catch (err) {
              console.error("[cloud-drive-server] 创建目录失败:", err);
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "mkdir_result",
                success: false,
                error: err.message,
              });
            }
          },

          async handleDelete(data, ctx) {
            const { path } = data;
            try {
              const parts = path.split("/").filter(Boolean);
              const dirPath = parts.slice(0, -1).join("/");
              const fileName = decodeURIComponent(parts[parts.length - 1]);
              const dir = await this.resolveDir(dirPath);
              const item = await dir.get(fileName);
              if (!item) throw new Error("文件或目录不存在");
              await item.remove();
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "delete_result",
                success: true,
              });
              console.log("[cloud-drive-server] 删除:", path);
            } catch (err) {
              console.error("[cloud-drive-server] 删除失败:", err);
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "delete_result",
                success: false,
                error: err.message,
              });
            }
          },

          async handleRename(data, ctx) {
            const { path, newName } = data;
            try {
              const parts = path.split("/").filter(Boolean);
              const dirPath = parts.slice(0, -1).join("/");
              const oldName = decodeURIComponent(parts[parts.length - 1]);
              const dir = await this.resolveDir(dirPath);
              const item = await dir.get(oldName);
              if (!item) throw new Error("文件或目录不存在");
              await item.moveTo(dir, newName);
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "rename_result",
                success: true,
              });
              console.log("[cloud-drive-server] 重命名:", oldName, "->", newName);
            } catch (err) {
              console.error("[cloud-drive-server] 重命名失败:", err);
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "rename_result",
                success: false,
                error: err.message,
              });
            }
          },

          // =====================================================
          //  文件上传（客户端 -> 服务端）
          // =====================================================

          async handleUploadStart(data, ctx) {
            const { transferId, path, fileName, fileSize, chunkCount, chunkHashes } = data;

            try {
              // 验证目标目录存在
              await this.resolveDir(path);

              this._uploads.set(transferId, {
                path,
                fileName,
                fileSize,
                chunkCount,
                chunkHashes,
                chunks: new Map(),
                clientUserId: ctx.fromUserId,
              });

              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "upload_ready",
                transferId,
                accepted: true,
              });
              console.log(
                "[cloud-drive-server] 上传开始:",
                fileName,
                "分块数:",
                chunkCount,
                "transferId:",
                transferId,
              );
            } catch (err) {
              console.error("[cloud-drive-server] 上传准备失败:", err);
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "upload_ready",
                transferId,
                accepted: false,
                error: err.message,
              });
            }
          },

          async handleBinaryMessage(event) {
            const raw = event.detail.data;
            // 只处理真正的二进制数据，跳过 JSON/文本消息
            if (
              typeof raw === "string" ||
              raw === null ||
              raw === undefined ||
              (!(raw instanceof ArrayBuffer) &&
                !ArrayBuffer.isView(raw) &&
                !(raw instanceof Blob))
            ) {
              return;
            }

            const fromUserId = event.detail.fromUserId;
            if (!this._authClients.has(fromUserId)) {
              console.warn("[cloud-drive-server] 未认证的二进制消息:", this.shortId(fromUserId));
              return;
            }

            try {
              const { header, payload } = await unpackBinary(raw);
              const { transferId, chunkIndex, totalChunks } = header;

              const transfer = this._uploads.get(transferId);
              if (!transfer || transfer.assembled) {
                console.warn("[cloud-drive-server] 未知或已完成的 transferId:", transferId);
                return;
              }

              transfer.chunks.set(chunkIndex, payload);
              console.log(
                "[cloud-drive-server] 收到分块",
                chunkIndex + 1,
                "/",
                totalChunks,
                "transferId:",
                transferId,
              );

              // 所有分块到齐时自动组装（不依赖 upload_complete，避免 RTC 竞态）
              if (transfer.chunks.size === transfer.chunkCount) {
                console.log("[cloud-drive-server] 所有分块已到齐，开始组装");
                // 使用 upload_complete 存储的 ctx（可能先于分块到达）
                const ctx = transfer._ctx || this._getRemoteCtx(fromUserId);
                this._assembleUpload(transferId, ctx);
              }
            } catch (err) {
              console.error("[cloud-drive-server] 处理二进制消息失败:", err);
            }
          },

          _getRemoteCtx(fromUserId) {
            // 为二进制处理路径构造 ctx（二进制消息不经过 handleIncoming 的 Proxy 包装）
            const remoteUser = (this._user.remoteUsers || []).find(
              (r) => r.userId === fromUserId,
            );
            if (!remoteUser) return null;
            return {
              fromUserId,
              fromSessionId: null,
              remoteUser: new Proxy(remoteUser, {
                get(target, prop) {
                  const val = target[prop];
                  return typeof val === "function" ? val.bind(target) : val;
                },
              }),
            };
          },

          async _assembleUpload(transferId, ctx) {
            const transfer = this._uploads.get(transferId);
            if (!transfer || transfer.assembled) return;

            try {
              transfer.assembled = true;

              const chunks = [];
              for (let i = 0; i < transfer.chunkCount; i++) {
                chunks.push(transfer.chunks.get(i));
              }
              const blob = new Blob(chunks);
              const file = new File([blob], transfer.fileName);

              // 写入存储
              const dir = await this.resolveDir(transfer.path);
              const fileHandle = await dir.get(transfer.fileName, {
                create: "file",
              });
              await fileHandle.write(file);

              this._uploads.delete(transferId);

              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "upload_done",
                transferId,
                success: true,
              });
              console.log(
                "[cloud-drive-server] 文件上传完成:",
                transfer.fileName,
                "(",
                transfer.fileSize,
                "bytes)",
              );
            } catch (err) {
              console.error("[cloud-drive-server] 文件组装失败:", err);
              this._uploads.delete(transferId);
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "upload_done",
                transferId,
                success: false,
                error: err.message,
              });
            }
          },

          async handleUploadComplete(data, ctx) {
            const { transferId } = data;
            const transfer = this._uploads.get(transferId);
            if (!transfer) {
              await ctx.remoteUser.sendToService(SERVICE_ID, {
                kind: "upload_done",
                transferId,
                success: false,
                error: "未知传输ID",
              });
              return;
            }

            // 已通过自动组装完成
            if (transfer.assembled) return;

            if (transfer.chunks.size === transfer.chunkCount) {
              // 分块刚好到齐，组装
              await this._assembleUpload(transferId, ctx);
            } else {
              // 竞态：upload_complete 比二进制分块先处理完
              // 标记等待，_assembleUpload 会在分块到齐后自动调用
              transfer.completeRequested = true;
              transfer._ctx = ctx;
              console.log(
                "[cloud-drive-server] upload_complete 先到，等待分块:",
                transfer.chunks.size,
                "/",
                transfer.chunkCount,
              );
            }
          },

          // =====================================================
          //  文件下载（服务端 -> 客户端）
          // =====================================================

          async handleDownloadRequest(data, ctx) {
            const { path } = data;
            const clientSessionId = ctx.fromSessionId;
            const remoteUser = ctx.remoteUser;

            try {
              const file = await this.resolveFile(path);
              const buffer = await file.buffer();
              const fileName = file.name;
              const fileSize = buffer.byteLength;

              // 分块
              const chunks = [];
              for (let i = 0; i < buffer.byteLength; i += CHUNK_SIZE) {
                chunks.push(
                  buffer.slice(i, Math.min(i + CHUNK_SIZE, buffer.byteLength)),
                );
              }

              // 计算哈希
              const chunkHashes = [];
              for (const chunk of chunks) {
                chunkHashes.push(await calcHash(chunk));
              }

              const transferId =
                "dl-" + Date.now() + "-" + Math.random().toString(36).slice(2);

              // 发送 download_start
              await remoteUser.sendToService(SERVICE_ID, {
                kind: "download_start",
                transferId,
                fileName,
                fileSize,
                chunkCount: chunks.length,
                chunkHashes,
                path,
              });

              console.log(
                "[cloud-drive-server] 开始下载:",
                fileName,
                "分块数:",
                chunks.length,
                "transferId:",
                transferId,
              );

              // 逐个发送二进制分块
              for (let i = 0; i < chunks.length; i++) {
                const binary = packBinary(
                  transferId,
                  i,
                  chunks.length,
                  chunks[i],
                );
                await remoteUser.send(clientSessionId, binary);
                console.log(
                  "[cloud-drive-server] 发送分块",
                  i + 1,
                  "/",
                  chunks.length,
                );
              }

              // 发送 download_complete
              await remoteUser.sendToService(SERVICE_ID, {
                kind: "download_complete",
                transferId,
              });

              console.log("[cloud-drive-server] 下载完成:", fileName);
            } catch (err) {
              console.error("[cloud-drive-server] 下载失败:", err);
              await remoteUser.sendToService(SERVICE_ID, {
                kind: "download_start",
                error: err.message,
              });
            }
          },
        },

        async attached() {
          // 初始化存储
          try {
            const { storage } = await load(
              "/gh/kirakiray/ever-cache/src/main.min.js",
            );
            this._storage = storage;
          } catch (err) {
            console.error("[cloud-drive-server] 初始化存储失败:", err);
            return;
          }

          // 非响应式状态
          this._uploads = new Map();
          this._authClients = new Set();
          this._remoteBinaryBindings = new Map();

          // 加载持久化数据
          await this.loadMounts();
          await this.loadUsers();

          // 获取用户
          const { getUser } = await load("/nos/user/main.js");
          const user = await getUser("default");
          this._user = user;
          this.serverUserId = user.userId;
          console.log("[cloud-drive-server] Server userId:", user.userId);

          // 注册 P2P 服务
          const self = this;
          this._svc = user.registerService(SERVICE_ID, {
            onMessage(data, ctx) {
              self.handleIncoming(data, ctx);
            },
          });

          // 监听二进制消息（文件分块）— 已移至每个 remoteUser（见 remote_user_connected）
          // user.bind("message") 仅覆盖 WebSocket 中转路径，不覆盖 RTC DataChannel

          // 监听客户端上下线
          this._unbindConn = user.bind("remote_user_connected", (event) => {
            const uid = event && event.detail && event.detail.userId;
            const remoteUser = event && event.detail && event.detail.remoteUser;
            if (!uid) return;

            // 在 remoteUser 上绑定二进制消息（RTC 路径必须如此）
            if (remoteUser) {
              const unbind = remoteUser.bind("message", (ev) => {
                self.handleBinaryMessage(ev);
              });
              self._remoteBinaryBindings.set(uid, unbind);
              console.log("[cloud-drive-server] 已绑定二进制监听:", self.shortId(uid));
            }

            const client = self.clients.find((c) => c.userId === uid);
            if (client && !client.online) client.online = true;
          });
          this._unbindDisc = user.bind("remote_user_disconnected", (event) => {
            const uid = event && event.detail && event.detail.userId;
            if (!uid) return;

            // 解绑二进制监听
            const unbind = self._remoteBinaryBindings.get(uid);
            if (unbind) {
              try { unbind(); } catch (_) {}
              self._remoteBinaryBindings.delete(uid);
            }

            const client = self.clients.find((c) => c.userId === uid);
            if (client && client.online) client.online = false;
            self._authClients.delete(uid);
            console.log(
              "[cloud-drive-server] 客户端断开:",
              self.shortId(uid),
            );
          });

          console.log("[cloud-drive-server] 服务已注册:", SERVICE_ID);
        },

        detached() {
          // 解绑所有 remoteUser 的二进制监听
          if (this._remoteBinaryBindings) {
            for (const [, unbind] of this._remoteBinaryBindings) {
              try { unbind && unbind(); } catch (_) {}
            }
            this._remoteBinaryBindings.clear();
          }
          [
            this._unbindConn,
            this._unbindDisc,
          ].forEach((fn) => {
            try {
              fn && fn();
            } catch (_) {}
          });
          if (this._svc) {
            try {
              this._svc.unregister();
            } catch (_) {}
          }
        },
      };
    };
  </script>
</template>
