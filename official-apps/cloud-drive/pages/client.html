  <script>
    const SERVICE_ID = "cloud-drive";
    const CHUNK_SIZE = 245760; // 240KB（服务端中转上限 256KB，留余量给协议头）
    const SESSION_KEY = "cloud-drive-session";

    async function calcHash(buffer) {
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function packBinary(transferId, chunkIndex, totalChunks, payload) {
      const headerJson = JSON.stringify({
        transferId,
        chunkIndex,
        totalChunks,
      });
      const headerBytes = new TextEncoder().encode(headerJson);
      const buf = new ArrayBuffer(4 + headerBytes.length + payload.byteLength);
      const view = new DataView(buf);
      view.setUint32(0, headerBytes.length, false);
      new Uint8Array(buf, 4, headerBytes.length).set(headerBytes);
      new Uint8Array(buf, 4 + headerBytes.length).set(new Uint8Array(payload));
      return buf;
    }

    async function unpackBinary(data) {
      const buf =
        data instanceof Blob
          ? await data.arrayBuffer()
          : ArrayBuffer.isView(data)
            ? data.buffer.slice(
                data.byteOffset,
                data.byteOffset + data.byteLength,
              )
            : data;
      const view = new DataView(buf);
      const headerLen = view.getUint32(0, false);
      const headerJson = new TextDecoder().decode(
        new Uint8Array(buf, 4, headerLen),
      );
      const header = JSON.parse(headerJson);
      const payload = buf.slice(4 + headerLen);
      return { header, payload };
    }

    export default async ({ load, query }) => {
      const hostFromQuery = query.host || "";
      return {
        data: {
          serverUserId: "",
          username: "",
          password: "",
          connected: false,
          connecting: false,
          authError: "",
          currentPath: "/",
          fileList: [],
          loading: false,
          transfers: [],
        },

        proto: {
          // ===== 返回 =====
          goBack() {
            this._clearSession();
            if (this.connected && this._user && this.serverUserId) {
              try {
                this._user.disconnectUser(this.serverUserId);
              } catch (_) {}
            }
            this.goto("./home.html");
          },

          // ===== 会话持久化 =====
          _saveSession() {
            try {
              sessionStorage.setItem(
                SESSION_KEY,
                JSON.stringify({
                  serverUserId: this.serverUserId,
                  username: this.username,
                  password: this.password,
                  currentPath: this.currentPath || "/",
                }),
              );
              console.log("[cloud-drive-client] 会话已保存");
            } catch (_) {}
          },

          _updateSessionPath() {
            try {
              const raw = sessionStorage.getItem(SESSION_KEY);
              if (!raw) return;
              const sess = JSON.parse(raw);
              sess.currentPath = this.currentPath || "/";
              sessionStorage.setItem(SESSION_KEY, JSON.stringify(sess));
            } catch (_) {}
          },

          _loadSession() {
            try {
              const raw = sessionStorage.getItem(SESSION_KEY);
              if (!raw) return null;
              return JSON.parse(raw);
            } catch (_) {
              return null;
            }
          },

          _clearSession() {
            try {
              sessionStorage.removeItem(SESSION_KEY);
              console.log("[cloud-drive-client] 会话已清除");
            } catch (_) {}
          },

          // ===== 工具函数 =====
          formatSize(bytes) {
            if (!bytes || bytes === 0) return "-";
            const k = 1024;
            const sizes = ["B", "KB", "MB", "GB", "TB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (
              parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i]
            );
          },

          formatDate(timestamp) {
            if (!timestamp) return "-";
            const d = new Date(timestamp);
            return (
              d.toLocaleDateString() +
              " " +
              d.toLocaleTimeString().slice(0, 5)
            );
          },

          buildPath(basePath, name) {
            const encodedName = encodeURIComponent(name);
            if (!basePath || basePath === "/") {
              return "/" + encodedName;
            }
            return basePath + "/" + encodedName;
          },

          get breadcrumbs() {
            const crumbs = [{ name: "全部文件", path: "/" }];
            if (!this.currentPath || this.currentPath === "/") return crumbs;
            const parts = this.currentPath.split("/").filter(Boolean);
            let path = "";
            for (const part of parts) {
              path += "/" + part;
              crumbs.push({ name: decodeURIComponent(part), path });
            }
            return crumbs;
          },

          // =====================================================
          //  连接与认证
          // =====================================================

          async connect() {
            const serverUserId = (this.serverUserId || "").trim();
            const username = (this.username || "").trim();
            const password = (this.password || "").trim();

            if (!serverUserId || !username || !password) {
              this.authError = "请填写所有字段";
              return;
            }

            this.connecting = true;
            this._connecting = true; // 防止 disconnect 处理器在连接过程中干扰
            this.authError = "";

            try {
              // 清理可能存在的旧连接（刷新重连场景）
              // 不调用 disconnectUser — 它会触发 remote_user_disconnected 干扰新连接
              // connectUser 内部会处理旧 session 的清理
              console.log(
                "[cloud-drive-client] 正在连接服务端:",
                serverUserId,
              );

              const remote = await this._user.connectUser(serverUserId);
              this._remoteUser = remote;

              // 二进制消息必须绑定在 remoteUser 上（RTC DataChannel 路径）
              const self = this;
              if (this._unbindRemoteMessage) {
                try { this._unbindRemoteMessage(); } catch (_) {}
              }
              this._unbindRemoteMessage = remote.bind("message", (event) => {
                self.handleBinaryMessage(event);
              });

              const online = await this._user.isRemoteUserOnline(
                serverUserId,
              );
              if (!online) {
                this.connecting = false;
                this._connecting = false;
                this.authError = "服务端不在线";
                console.warn("[cloud-drive-client] 服务端不在线");
                return;
              }

              // 创建认证 Promise
              this._authPromise = new Promise((resolve, reject) => {
                this._authResolve = resolve;
                this._authReject = reject;
                setTimeout(() => {
                  if (this._authReject) {
                    this._authReject(new Error("认证超时"));
                    this._authResolve = null;
                    this._authReject = null;
                  }
                }, 15000);
              });

              // 发送认证消息
              const results = await this._remoteUser.sendToService(
                SERVICE_ID,
                {
                  kind: "auth",
                  username,
                  password,
                },
              );

              const ok =
                Array.isArray(results) &&
                results.some((r) => r && r.status === "ok");
              if (!ok) {
                this.connecting = false;
                this._connecting = false;
                this.authError = "无法连接到服务端";
                return;
              }

              // 保存服务端 sessionId 用于二进制传输
              const okResult = results.find((r) => r && r.status === "ok");
              if (okResult && okResult.sessionId) {
                this._serverSessionId = okResult.sessionId;
                console.log(
                  "[cloud-drive-client] 服务端 sessionId:",
                  okResult.sessionId,
                );
              }

              // 等待认证结果
              const authResult = await this._authPromise;
              if (authResult.success) {
                this.connected = true;
                this.connecting = false;
                this._connecting = false;
                this._saveSession();
                console.log("[cloud-drive-client] 认证成功，进入文件浏览器");
                this.refreshList();
              } else {
                this.connecting = false;
                this._connecting = false;
                this.authError = authResult.error || "认证失败";
                console.warn(
                  "[cloud-drive-client] 认证失败:",
                  this.authError,
                );
              }
            } catch (err) {
              console.error("[cloud-drive-client] 连接失败:", err);
              this.connecting = false;
              this._connecting = false;
              this.authError = err.message || "连接失败";
            }
          },

          handleAuthResult(data) {
            console.log("[cloud-drive-client] 收到认证结果:", data.success);
            if (this._authResolve) {
              this._authResolve(data);
              this._authResolve = null;
              this._authReject = null;
            }
          },

          // =====================================================
          //  文件列表与导航
          // =====================================================

          navigateTo(path) {
            this.currentPath = path;
            this._updateSessionPath();
            this.refreshList();
          },

          async refreshList() {
            this.loading = true;
            try {
              const results = await this._remoteUser.sendToService(
                SERVICE_ID,
                {
                  kind: "list",
                  path: this.currentPath,
                },
              );
              const ok =
                Array.isArray(results) &&
                results.some((r) => r && r.status === "ok");
              if (!ok) {
                this.loading = false;
                console.warn("[cloud-drive-client] 获取列表失败: 服务端不可达");
              }
            } catch (err) {
              console.error("[cloud-drive-client] 获取文件列表失败:", err);
              this.loading = false;
            }
          },

          handleListResult(data) {
            const { path, items, error } = data;
            if (error) {
              console.error("[cloud-drive-client] 列出目录失败:", error);
              this.loading = false;
              return;
            }
            // 只处理当前路径的响应（避免快速导航时的竞态）
            if (path === this.currentPath && Array.isArray(items)) {
              // 排序：文件夹优先，再按名称
              items.sort((a, b) => {
                if (a.kind !== b.kind) return a.kind === "dir" ? -1 : 1;
                return a.name.localeCompare(b.name);
              });
              this.fileList = items;
              console.log(
                "[cloud-drive-client] 列出目录:",
                path,
                "共",
                items.length,
                "项",
              );
            }
            this.loading = false;
          },

          handleItemClick(item) {
            if (item.kind === "dir") {
              const newPath = this.buildPath(this.currentPath, item.name);
              this.navigateTo(newPath);
            }
          },

          // =====================================================
          //  文件操作
          // =====================================================

          async createFolder() {
            const name = prompt("请输入文件夹名称");
            if (!name || !name.trim()) return;
            try {
              await this._remoteUser.sendToService(SERVICE_ID, {
                kind: "mkdir",
                path: this.currentPath,
                name: name.trim(),
              });
            } catch (err) {
              console.error("[cloud-drive-client] 创建文件夹失败:", err);
            }
          },

          handleMkdirResult(data) {
            if (data.success) {
              console.log("[cloud-drive-client] 文件夹创建成功");
              this.refreshList();
            } else {
              console.error("[cloud-drive-client] 创建文件夹失败:", data.error);
              alert("创建文件夹失败: " + (data.error || "未知错误"));
            }
          },

          async deleteItem(item, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            if (!confirm("确定删除 \"" + item.name + "\" 吗？")) return;

            const filePath = this.buildPath(this.currentPath, item.name);
            try {
              await this._remoteUser.sendToService(SERVICE_ID, {
                kind: "delete",
                path: filePath,
              });
            } catch (err) {
              console.error("[cloud-drive-client] 删除失败:", err);
            }
          },

          handleDeleteResult(data) {
            if (data.success) {
              console.log("[cloud-drive-client] 删除成功");
              this.refreshList();
            } else {
              console.error("[cloud-drive-client] 删除失败:", data.error);
              alert("删除失败: " + (data.error || "未知错误"));
            }
          },

          async renameItem(item, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            const newName = prompt("请输入新名称", item.name);
            if (!newName || newName === item.name) return;

            const filePath = this.buildPath(this.currentPath, item.name);
            try {
              await this._remoteUser.sendToService(SERVICE_ID, {
                kind: "rename",
                path: filePath,
                newName,
              });
            } catch (err) {
              console.error("[cloud-drive-client] 重命名失败:", err);
            }
          },

          handleRenameResult(data) {
            if (data.success) {
              console.log("[cloud-drive-client] 重命名成功");
              this.refreshList();
            } else {
              console.error("[cloud-drive-client] 重命名失败:", data.error);
              alert("重命名失败: " + (data.error || "未知错误"));
            }
          },

          // =====================================================
          //  文件上传
          // =====================================================

          triggerUpload() {
            const input = this.shadow.$("#fileInput");
            if (input) {
              const el = input.ele || input;
              el.value = "";
              el.click();
            }
          },

          async handleFileSelect(event) {
            const target = event.target;
            const el = target.ele || target;
            const files = el.files;
            if (!files || files.length === 0) return;

            console.log("[cloud-drive-client] 选择文件:", files.length, "个");
            for (const file of files) {
              await this.uploadFile(file);
            }

            // 刷新列表
            await this.refreshList();
          },

          async uploadFile(file) {
            const transferId =
              "up-" + Date.now() + "-" + Math.random().toString(36).slice(2);

            // 添加到 UI 传输列表
            this.transfers.push({
              id: transferId,
              type: "upload",
              fileName: file.name,
              progress: 0,
              status: "transferring",
            });

            // 创建 upload_ready Promise
            const readyPromise = new Promise((resolve, reject) => {
              this._uploads.set(transferId, {
                readyResolve: resolve,
                readyReject: reject,
              });
              setTimeout(() => {
                const t = this._uploads.get(transferId);
                if (t && t.readyReject) {
                  t.readyReject(new Error("上传准备超时"));
                }
              }, 30000);
            });

            try {
              // 读取文件并分块
              const buffer = await file.arrayBuffer();
              const chunks = [];
              for (let i = 0; i < buffer.byteLength; i += CHUNK_SIZE) {
                chunks.push(
                  buffer.slice(
                    i,
                    Math.min(i + CHUNK_SIZE, buffer.byteLength),
                  ),
                );
              }

              // 计算每块哈希
              console.log(
                "[cloud-drive-client] 文件分块:",
                file.name,
                "共",
                chunks.length,
                "块",
              );
              const chunkHashes = [];
              for (const chunk of chunks) {
                chunkHashes.push(await calcHash(chunk));
              }

              // 发送 upload_start
              const results = await this._remoteUser.sendToService(
                SERVICE_ID,
                {
                  kind: "upload_start",
                  transferId,
                  path: this.currentPath,
                  fileName: file.name,
                  fileSize: file.size,
                  chunkCount: chunks.length,
                  chunkHashes,
                },
              );

              const ok = results.find((r) => r && r.status === "ok");
              if (!ok) {
                throw new Error("服务端不可达");
              }

              // 保存服务端 sessionId
              if (ok.sessionId) {
                this._serverSessionId = ok.sessionId;
              }

              // 等待 upload_ready
              const readyResponse = await readyPromise;
              if (!readyResponse.accepted) {
                throw new Error(
                  readyResponse.error || "服务端拒绝上传",
                );
              }

              console.log(
                "[cloud-drive-client] 开始发送分块, transferId:",
                transferId,
              );

              // 逐块发送二进制数据
              for (let i = 0; i < chunks.length; i++) {
                const binary = packBinary(
                  transferId,
                  i,
                  chunks.length,
                  chunks[i],
                );
                await this._remoteUser.send(
                  this._serverSessionId,
                  binary,
                );

                // 更新进度
                const progress = Math.round(
                  ((i + 1) / chunks.length) * 100,
                );
                const uiTransfer = this.transfers.find(
                  (t) => t.id === transferId,
                );
                if (uiTransfer) {
                  uiTransfer.progress = progress;
                }
              }

              console.log(
                "[cloud-drive-client] 分块发送完成, 等待服务端确认",
              );

              // 创建 upload_done Promise
              const donePromise = new Promise((resolve, reject) => {
                const transfer = this._uploads.get(transferId);
                if (transfer) {
                  transfer.doneResolve = resolve;
                  transfer.doneReject = reject;
                }
                setTimeout(() => {
                  const t = this._uploads.get(transferId);
                  if (t && t.doneReject) {
                    t.doneReject(new Error("上传完成超时"));
                  }
                }, 60000);
              });

              // 发送 upload_complete
              await this._remoteUser.sendToService(SERVICE_ID, {
                kind: "upload_complete",
                transferId,
              });

              // 等待 upload_done
              const doneResponse = await donePromise;
              if (!doneResponse.success) {
                throw new Error(doneResponse.error || "上传失败");
              }

              // 更新 UI
              const uiTransfer = this.transfers.find(
                (t) => t.id === transferId,
              );
              if (uiTransfer) {
                uiTransfer.status = "done";
                uiTransfer.progress = 100;
              }

              console.log(
                "[cloud-drive-client] 上传完成:",
                file.name,
              );
            } catch (err) {
              console.error(
                "[cloud-drive-client] 上传失败:",
                file.name,
                err,
              );
              const uiTransfer = this.transfers.find(
                (t) => t.id === transferId,
              );
              if (uiTransfer) {
                uiTransfer.status = "error";
              }
            } finally {
              this._uploads.delete(transferId);
            }
          },

          handleUploadReady(data) {
            const { transferId, accepted, error } = data;
            const transfer = this._uploads.get(transferId);
            if (!transfer) return;
            if (accepted) {
              if (transfer.readyResolve)
                transfer.readyResolve(data);
            } else {
              if (transfer.readyReject)
                transfer.readyReject(
                  new Error(error || "上传被拒绝"),
                );
            }
          },

          handleUploadDone(data) {
            const { transferId, success, error } = data;
            const transfer = this._uploads.get(transferId);
            if (!transfer) return;
            if (success) {
              if (transfer.doneResolve) transfer.doneResolve(data);
            } else {
              if (transfer.doneReject)
                transfer.doneReject(new Error(error || "上传失败"));
            }
          },

          // =====================================================
          //  文件下载
          // =====================================================

          downloadFile(item, event) {
            if (event && event.stopPropagation) event.stopPropagation();
            const filePath = this.buildPath(this.currentPath, item.name);

            console.log("[cloud-drive-client] 请求下载:", item.name);

            this._remoteUser
              .sendToService(SERVICE_ID, {
                kind: "download_request",
                path: filePath,
              })
              .catch((err) => {
                console.error("[cloud-drive-client] 下载请求失败:", err);
              });
          },

          handleDownloadStart(data) {
            if (data.error) {
              console.error("[cloud-drive-client] 下载失败:", data.error);
              alert("下载失败: " + data.error);
              return;
            }

            const {
              transferId,
              fileName,
              fileSize,
              chunkCount,
              chunkHashes,
            } = data;

            this._downloads.set(transferId, {
              fileName,
              fileSize,
              chunkCount,
              chunkHashes,
              chunks: new Map(),
            });

            this.transfers.push({
              id: transferId,
              type: "download",
              fileName,
              progress: 0,
              status: "transferring",
            });

            console.log(
              "[cloud-drive-client] 下载开始:",
              fileName,
              "分块数:",
              chunkCount,
            );

            // 回放提前到达的分块（解决二进制比 download_start 先到的竞态）
            const pending = this._pendingChunks.get(transferId) || [];
            for (const p of pending) {
              this._storeDownloadChunk(
                transferId,
                p.chunkIndex,
                p.totalChunks,
                p.payload,
              );
            }
            this._pendingChunks.delete(transferId);
            if (pending.length) {
              console.log(
                "[cloud-drive-client] 已回放缓冲分块:",
                pending.length,
              );
            }
          },

          async handleBinaryMessage(event) {
            const raw = event.detail.data;
            // 只处理真正的二进制数据，跳过 JSON/文本消息（remoteUser.bind 会收到所有消息）
            if (
              typeof raw === "string" ||
              raw === null ||
              raw === undefined ||
              (!(raw instanceof ArrayBuffer) &&
                !ArrayBuffer.isView(raw) &&
                !(raw instanceof Blob))
            ) {
              return;
            }

            try {
              const { header, payload } = await unpackBinary(raw);
              const { transferId, chunkIndex, totalChunks } = header;

              const transfer = this._downloads.get(transferId);
              if (!transfer) {
                // 竞态：二进制比 download_start 先到达，缓冲起来
                console.log(
                  "[cloud-drive-client] 分块先于元数据到达，缓冲:",
                  transferId,
                  chunkIndex,
                );
                if (!this._pendingChunks.has(transferId)) {
                  this._pendingChunks.set(transferId, []);
                }
                this._pendingChunks
                  .get(transferId)
                  .push({ chunkIndex, totalChunks, payload });
                return;
              }

              this._storeDownloadChunk(
                transferId,
                chunkIndex,
                totalChunks,
                payload,
              );
            } catch (err) {
              console.error(
                "[cloud-drive-client] 处理二进制消息失败:",
                err,
              );
            }
          },

          _storeDownloadChunk(transferId, chunkIndex, totalChunks, payload) {
            const transfer = this._downloads.get(transferId);
            if (!transfer || transfer.assembled) return;

            transfer.chunks.set(chunkIndex, payload);

            const progress = Math.round(
              (transfer.chunks.size / totalChunks) * 100,
            );
            const uiTransfer = this.transfers.find(
              (t) => t.id === transferId,
            );
            if (uiTransfer) {
              uiTransfer.progress = progress;
            }

            console.log(
              "[cloud-drive-client] 收到分块",
              chunkIndex + 1,
              "/",
              totalChunks,
            );

            // 所有分块到齐，自动组装（不依赖 download_complete 消息，避免竞态）
            if (transfer.chunks.size === transfer.chunkCount) {
              console.log("[cloud-drive-client] 所有分块已到齐，开始组装");
              this._assembleDownload(transferId);
            }
          },

          _assembleDownload(transferId) {
            const transfer = this._downloads.get(transferId);
            if (!transfer || transfer.assembled) return;

            try {
              if (transfer.chunks.size !== transfer.chunkCount) {
                throw new Error(
                  "分块不完整: " +
                    transfer.chunks.size +
                    "/" +
                    transfer.chunkCount,
                );
              }

              transfer.assembled = true;

              const chunks = [];
              for (let i = 0; i < transfer.chunkCount; i++) {
                chunks.push(transfer.chunks.get(i));
              }
              const blob = new Blob(chunks);

              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = transfer.fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);

              const uiTransfer = this.transfers.find(
                (t) => t.id === transferId,
              );
              if (uiTransfer) {
                uiTransfer.status = "done";
                uiTransfer.progress = 100;
              }

              console.log(
                "[cloud-drive-client] 下载完成:",
                transfer.fileName,
              );
            } catch (err) {
              console.error("[cloud-drive-client] 下载组装失败:", err);
              const uiTransfer = this.transfers.find(
                (t) => t.id === transferId,
              );
              if (uiTransfer) {
                uiTransfer.status = "error";
              }
            } finally {
              this._downloads.delete(transferId);
            }
          },

          handleDownloadComplete(data) {
            const { transferId } = data;
            const transfer = this._downloads.get(transferId);
            // 分块已通过 _storeDownloadChunk 自动组装完毕，或仍在等待分块
            if (!transfer || transfer.assembled) return;

            if (transfer.chunks.size === transfer.chunkCount) {
              // 分块刚好到齐，组装
              this._assembleDownload(transferId);
            } else {
              // 竞态：download_complete 比二进制分块先处理完（noneos-core Blob→ArrayBuffer 异步延迟）
              // 标记等待，_storeDownloadChunk 收齐后会自动组装
              transfer.completeRequested = true;
              console.log(
                "[cloud-drive-client] download_complete 先到，等待分块:",
                transfer.chunks.size,
                "/",
                transfer.chunkCount,
              );
            }
          },

          // =====================================================
          //  传输列表管理
          // =====================================================

          clearCompletedTransfers() {
            this.transfers = this.transfers.filter(
              (t) => t.status === "transferring",
            );
          },

          // =====================================================
          //  消息分发
          // =====================================================

          handleIncoming(data) {
            if (!data || typeof data !== "object") return;
            const { kind } = data;

            console.log(
              "[cloud-drive-client] 收到消息:",
              kind,
            );

            switch (kind) {
              case "auth_result":
                this.handleAuthResult(data);
                break;
              case "list_result":
                this.handleListResult(data);
                break;
              case "mkdir_result":
                this.handleMkdirResult(data);
                break;
              case "delete_result":
                this.handleDeleteResult(data);
                break;
              case "rename_result":
                this.handleRenameResult(data);
                break;
              case "upload_ready":
                this.handleUploadReady(data);
                break;
              case "upload_done":
                this.handleUploadDone(data);
                break;
              case "download_start":
                this.handleDownloadStart(data);
                break;
              case "download_complete":
                this.handleDownloadComplete(data);
                break;
              case "error":
                console.error(
                  "[cloud-drive-client] 服务端错误:",
                  data.error,
                );
                break;
              default:
                console.warn(
                  "[cloud-drive-client] 未知消息类型:",
                  kind,
                );
            }
          },
        },

        async attached() {
          // 从路由 query 读取 host 参数（分享链接场景）
          if (hostFromQuery) {
            this.serverUserId = hostFromQuery;
            console.log(
              "[cloud-drive-client] 从链接获取服务端 ID:",
              hostFromQuery,
            );
          }

          // 非响应式状态
          this._uploads = new Map();
          this._downloads = new Map();
          this._pendingChunks = new Map();

          // 获取用户
          try {
            const { getUser } = await load("/nos/user/main.js");
            const user = await getUser("default");
            this._user = user;
            console.log("[cloud-drive-client] 当前用户 userId:", user.userId);

            // 注册 P2P 服务
            const self = this;
            this._svc = user.registerService(SERVICE_ID, {
              onMessage(data) {
                self.handleIncoming(data);
              },
            });

            // 监听二进制消息（下载分块）— 已移至 remoteUser.bind（见 connect()）
            // user.bind("message") 仅覆盖 WebSocket 中转路径，不覆盖 RTC DataChannel

            // 监听服务端断线
            this._unbindDisc = user.bind(
              "remote_user_disconnected",
              (event) => {
                const uid =
                  event && event.detail && event.detail.userId;
                if (uid === self.serverUserId) {
                  // 连接过程中忽略断开事件（旧 session 清理会触发此事件）
                  if (self._connecting) {
                    console.log("[cloud-drive-client] 连接过程中的断开事件，忽略");
                    return;
                  }
                  console.warn("[cloud-drive-client] 服务端已断开");
                  self.connected = false;
                  self.authError = "服务端已断开连接";
                  self._clearSession();
                }
              },
            );

            console.log("[cloud-drive-client] 服务已注册:", SERVICE_ID);

            // 检查 sessionStorage 恢复上次会话（刷新重连场景）
            const saved = this._loadSession();
            if (saved && saved.serverUserId) {
              console.log(
                "[cloud-drive-client] 发现已保存会话，自动重连:",
                saved.serverUserId,
                "path:",
                saved.currentPath,
              );
              this.serverUserId = saved.serverUserId;
              this.username = saved.username || "";
              this.password = saved.password || "";
              this.currentPath = saved.currentPath || "/";
              // 自动触发连接
              this.connect();
            }
          } catch (err) {
            console.error("[cloud-drive-client] 初始化失败:", err);
          }
        },

        detached() {
          // 主动断开与服务端的 P2P 连接，避免刷新后旧连接残留
          if (this._user && this.serverUserId) {
            try {
              this._user.disconnectUser(this.serverUserId);
              console.log("[cloud-drive-client] 已断开服务端连接");
            } catch (_) {}
          }
          [
            this._unbindRemoteMessage,
            this._unbindDisc,
          ].forEach((fn) => {
            try {
              fn && fn();
            } catch (_) {}
          });
          if (this._svc) {
            try {
              this._svc.unregister();
            } catch (_) {}
          }
          if (this._uploads) this._uploads.clear();
          if (this._downloads) this._downloads.clear();
          if (this._pendingChunks) this._pendingChunks.clear();
        },
      };
    };
  </script>
</template>
