<!doctype html>
<html lang="cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Mazmot</title>
    <!--
      顶层 404.html 的存在本身就是开关：Cloudflare Pages 检测到它会关闭 SPA 回退
      （不再把所有未命中路径回退成 index.html + 200），改为以 404 状态返回本页。
      注意：本页可能在 NoneOS Core SW 就绪前由源站直接返回（正是 SW 未命中透传的
      场景），禁止引用 /gh/ /nos/ /mz/ 等依赖 SW 的资源，保持零依赖内联样式。
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #141218;
        color: #e6e0e9;
        font-family:
          system-ui,
          -apple-system,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 56px;
        font-weight: 500;
        color: #d0bcff;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #cac4d0;
      }
      a {
        margin-top: 8px;
        padding: 10px 24px;
        border-radius: 9999px;
        background: #d0bcff;
        color: #381e72;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Page not found</p>
    <a href="/">Back to Mazmot</a>
  </body>
</html>
