  <sb-test name="DeepSeek: 普通对话 (deepseek-v4-flash, 非思考)">
    <template>
      <script type="module">
        return (async () => {
          const { DeepseekAssistant } = await import("../supplier/deepseek.js");
          const { deepseek: apiKey } = await fetch("/ai/test-api-keys.json").then(r => r.json());

          if (!apiKey || apiKey.startsWith("sk-your-")) {
            return {
              assert: false,
              content: { error: "请先在 ai/test-api-keys.json 填入真实的 DeepSeek API Key" }
            };
          }

          try {
            const assistant = new DeepseekAssistant("test-ds", apiKey);
            const result = await assistant.chat({
              model: "deepseek-v4-flash",
              thinking: false,
              messages: [{ role: "user", content: "请只回复两个字：你好" }],
            });

            const hasContent = typeof result.content === "string" && result.content.length > 0;
            const hasModel = !!result.model;
            const hasUsage = !!result.usage;

            return {
              assert: hasContent && hasModel,
              content: {
                content: result.content,
                model: result.model,
                usage: result.usage,
                checks: { hasContent, hasModel, hasUsage },
              },
            };
          } catch (error) {
            return {
              assert: false,
              content: { error: error.message, stack: error.stack },
            };
          }
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="DeepSeek: 流式输出">
    <template>
      <script type="module">
        return (async () => {
          const { DeepseekAssistant } = await import("../supplier/deepseek.js");
          const { deepseek: apiKey } = await fetch("/ai/test-api-keys.json").then(r => r.json());

          if (!apiKey || apiKey.startsWith("sk-your-")) {
            return {
              assert: false,
              content: { error: "请先在 ai/test-api-keys.json 填入真实的 DeepSeek API Key" }
            };
          }

          try {
            const assistant = new DeepseekAssistant("test-ds-stream", apiKey);
            const chunks = [];
            const result = await assistant.chat({
              model: "deepseek-v4-flash",
              thinking: false,
              stream: true,
              messages: [{ role: "user", content: "从 1 数到 5" }],
              onStream: (data) => {
                if (data.delta) chunks.push(data.delta);
              },
            });

            const streamedText = chunks.join("");
            const hasStreamedContent = streamedText.length > 0;
            const matchesFinal = result.content === streamedText;

            return {
              assert: hasStreamedContent && matchesFinal,
              content: {
                finalContent: result.content,
                streamedLength: streamedText.length,
                chunkCount: chunks.length,
                checks: { hasStreamedContent, matchesFinal },
              },
            };
          } catch (error) {
            return {
              assert: false,
              content: { error: error.message, stack: error.stack },
            };
          }
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="Kimi: 思考参数按模型分支构建">
    <template>
      <script type="module">
        return (async () => {
          const { KimiAssistant } = await import("../supplier/kimi.js");
          const { kimi: apiKey } = await fetch("/ai/test-api-keys.json").then(r => r.json());

          if (!apiKey || apiKey.startsWith("sk-your-")) {
            return {
              assert: false,
              content: { error: "请先在 ai/test-api-keys.json 填入真实的 Kimi API Key" }
            };
          }

          // 通过拦截 fetch 验证最终请求体（不真正发请求）
          const capturedBodies = [];
          const originalFetch = globalThis.fetch;
          globalThis.fetch = async (url, opts) => {
            if (opts?.body) {
              capturedBodies.push({ url, body: JSON.parse(opts.body) });
            }
            return new Response(JSON.stringify({
              choices: [{ message: { content: "ok", reasoning_content: "thinking" } }],
              model: "test",
              usage: {},
            }), { status: 200, headers: { "Content-Type": "application/json" } });
          };

          try {
            const a = new KimiAssistant("test-branch", apiKey);
            await a.chat({ model: "kimi-k3", reasoningEffort: "low", messages: [{ role: "user", content: "hi" }] });
            await a.chat({ model: "kimi-k2.7-code", thinking: false, messages: [{ role: "user", content: "hi" }] });
            await a.chat({ model: "kimi-k2.6", thinking: true, thinkingKeep: "all", messages: [{ role: "user", content: "hi" }] });
            await a.chat({ model: "kimi-k2.6", thinking: false, messages: [{ role: "user", content: "hi" }] });
          } finally {
            globalThis.fetch = originalFetch;
          }

          const [k3, k27, k26On, k26Off] = capturedBodies.map(c => c.body);

          const checks = {
            k3_hasReasoningEffort: k3.reasoning_effort === "low",
            k3_noThinking: k3.thinking === undefined,
            k27_noThinking: k27.thinking === undefined,
            k26On_type: k26On.thinking?.type === "enabled",
            k26On_keep: k26On.thinking?.keep === "all",
            k26Off_type: k26Off.thinking?.type === "disabled",
            k26Off_noKeep: k26Off.thinking?.keep === undefined,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { capturedBodies, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="main.js: onApiKeysChange 在 saveKey 时被触发">
    <template>
      <script type="module">
        return (async () => {
          const { saveKey, onApiKeysChange, getApiKeys, removeKey } = await import("../main.js");

          let receivedKeys = null;
          let callCount = 0;
          const unsub = onApiKeysChange((keys) => {
            receivedKeys = keys;
            callCount++;
          });

          await saveKey("sk-test-watch-on-abcdef", "deepseek");
          const added = getApiKeys().find((k) => k.apiKey === "sk-test-watch-on-abcdef");

          const checks = {
            callbackFired: callCount > 0,
            receivedArrayIncludesNewKey:
              !!receivedKeys && receivedKeys.some((k) => k.id === added?.id),
          };

          unsub();
          if (added) removeKey(added.id);

          return {
            assert: Object.values(checks).every(Boolean),
            content: { callCount, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="main.js: onApiKeysChange 取消订阅后不再触发">
    <template>
      <script type="module">
        return (async () => {
          const { saveKey, onApiKeysChange, getApiKeys, removeKey } = await import("../main.js");

          let callCount = 0;
          const unsub = onApiKeysChange(() => {
            callCount++;
          });

          unsub();

          await saveKey("sk-test-watch-off-abcdef", "deepseek");
          const added = getApiKeys().find((k) => k.apiKey === "sk-test-watch-off-abcdef");

          if (added) removeKey(added.id);

          return {
            assert: callCount === 0,
            content: { callCount },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="main.js: getApiKeys() 返回快照不可影响内部状态">
    <template>
      <script type="module">
        return (async () => {
          const { saveKey, getApiKeys, removeKey } = await import("../main.js");

          await saveKey("sk-test-snapshot-abcdef", "deepseek");
          const keys1 = getApiKeys();
          const targetIdx = keys1.findIndex((k) => k.apiKey === "sk-test-snapshot-abcdef");

          // 篡改快照
          if (targetIdx !== -1) {
            keys1[targetIdx].provider = "tampered";
            keys1.push({ id: "fake", provider: "fake" });
          }

          // 再次获取，内部应不受影响
          const keys2 = getApiKeys();
          const internalTarget = keys2.find((k) => k.apiKey === "sk-test-snapshot-abcdef");

          const checks = {
            providerUntampered: internalTarget?.provider === "deepseek",
            noFakeKey: !keys2.some((k) => k.id === "fake"),
            lengthConsistent: keys2.length === keys1.length - 1, // 减掉我们 push 的假数据
          };

          if (internalTarget) removeKey(internalTarget.id);

          return {
            assert: Object.values(checks).every(Boolean),
            content: { checks },
          };
        })();
      </script>
    </template>
  </sb-test>
