  <sb-test name="messages: 普通对象归一化为消息类实例">
    <template>
      <script type="module">
        return (async () => {
          const { SystemMessage, HumanMessage, AIMessage, ToolMessage, toMessages } =
            await import("../chain/messages.js");

          const normalized = toMessages([
            { role: "system", content: "你是助手" },
            { role: "user", content: "你好" },
            { role: "assistant", content: "你好呀", tool_calls: [
              { id: "c1", function: { name: "calc", arguments: '{"a":1}' } },
            ] },
            { role: "tool", content: "42", tool_call_id: "c1", name: "calc" },
          ]);

          const checks = {
            types: normalized.map((m) => m.getType()).join(",") === "system,human,ai,tool",
            classInstances:
              normalized[0] instanceof SystemMessage &&
              normalized[1] instanceof HumanMessage &&
              normalized[2] instanceof AIMessage &&
              normalized[3] instanceof ToolMessage,
            toolCallsNormalized:
              normalized[2].toolCalls.length === 1 &&
              normalized[2].toolCalls[0].name === "calc" &&
              normalized[2].toolCalls[0].args === '{"a":1}',
            toolCallId: normalized[3].toolCallId === "c1",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { types: normalized.map((m) => m.getType()), checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="messages: toWireMessages 生成 OpenAI wire 格式（含 tool_calls 往返）">
    <template>
      <script type="module">
        return (async () => {
          const { HumanMessage, AIMessage, ToolMessage, toWireMessages } =
            await import("../chain/messages.js");

          const wire = toWireMessages([
            new HumanMessage("计算 1+1"),
            new AIMessage("", { toolCalls: [{ id: "c1", name: "calc", args: '{"a":1}' }] }),
            new ToolMessage("2", { toolCallId: "c1", name: "calc" }),
            new AIMessage("结果是 2"),
          ]);

          const checks = {
            roles: wire.map((m) => m.role).join(",") === "user,assistant,tool,assistant",
            toolCallWire:
              wire[1].tool_calls?.[0]?.function?.name === "calc" &&
              wire[1].tool_calls?.[0]?.function?.arguments === '{"a":1}' &&
              wire[1].tool_calls?.[0]?.id === "c1",
            toolMsg: wire[2].tool_call_id === "c1" && wire[2].content === "2",
            noEmptyToolCalls: wire[3].tool_calls === undefined,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { wire, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="messages: textOf 处理字符串/内容块/null + aiMessageFromResponse 字段映射">
    <template>
      <script type="module">
        return (async () => {
          const { textOf, aiMessageFromResponse } = await import("../chain/messages.js");

          const msg = aiMessageFromResponse({
            content: "回答",
            reasoningContent: "思考",
            model: "mock-model",
            toolCalls: [{ id: "c1", function: { name: "calc", arguments: "{}" } }],
            usage: { prompt_tokens: 3, completion_tokens: 5, total_tokens: 8 },
          });

          const checks = {
            str: textOf("abc") === "abc",
            blocks: textOf([{ text: "a" }, { text: "b" }]) === "ab",
            mixedBlocks: textOf(["x", { text: "y" }]) === "xy",
            nullSafe: textOf(null) === "" && textOf(undefined) === "",
            aiContent: msg.content === "回答",
            aiToolCalls: msg.toolCalls.length === 1 && msg.toolCalls[0].name === "calc",
            usageMap:
              msg.usageMetadata.inputTokens === 3 &&
              msg.usageMetadata.outputTokens === 5 &&
              msg.usageMetadata.totalTokens === 8,
            emptyToolCalls: aiMessageFromResponse({ content: "x" }).toolCalls.length === 0,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { checks, usageMetadata: msg.usageMetadata },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="tools: toWire 生成 JSON Schema（optional 不进 required）">
    <template>
      <script type="module">
        return (async () => {
          const { tool } = await import("../chain/tools.js");

          const echoTool = tool(async (args) => JSON.stringify(args), {
            name: "echo",
            description: "回显参数",
            schema: {
              topic: { type: "string", description: "主题" },
              limit: { type: "number", optional: true },
            },
          });

          const wire = echoTool.toWire();
          const params = wire.function.parameters;

          const checks = {
            wireType: wire.type === "function",
            name: wire.function.name === "echo",
            requiredOnly: params.required.length === 1 && params.required[0] === "topic",
            optionalStripped: params.properties.limit.optional === undefined,
            descKept: params.properties.topic.description === "主题",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { wire, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="tools: invoke 校验与容错（缺参/类型错/JSON 非法/执行抛错）">
    <template>
      <script type="module">
        return (async () => {
          const { tool } = await import("../chain/tools.js");

          const calc = tool(async ({ a, b }) => String(a + b), {
            name: "add",
            schema: {
              a: { type: "number" },
              b: { type: "number" },
            },
          });

          const boom = tool(async () => { throw new Error("炸了"); }, { name: "boom", schema: {} });

          const results = {
            ok: await calc.invoke('{"a":1,"b":2}'),
            missing: await calc.invoke('{"a":1}'),
            wrongType: await calc.invoke('{"a":"1","b":2}'),
            badJson: await calc.invoke("not-json"),
            thrown: await boom.invoke("{}"),
            nullOutput: await tool(async () => {}, { name: "noop", schema: {} }).invoke("{}"),
          };

          const checks = {
            okValue: results.ok === "3",
            missingReadable: results.missing.includes("缺少必填参数") && results.missing.includes("b"),
            wrongTypeReadable: results.wrongType.includes("number"),
            badJsonReadable: results.badJson.includes("合法 JSON"),
            thrownReadable: results.thrown.includes("炸了"),
            nullToEmpty: results.nullOutput === "",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { results, checks },
          };
        })();
      </script>
    </template>

  <sb-test name="agent: invoke 工具循环（human→ai(toolCalls)→tool→ai）">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent } = await import("../chain/agent.js");
          const { AIMessage, textOf } = await import("../chain/messages.js");
          const { tool } = await import("../chain/tools.js");

          // mock model：第一轮发起 tool call，第二轮给出最终回答
          const receivedArgs = [];
          const mockModel = {
            async invoke(messages, opts) {
              receivedArgs.push(opts);
              if (messages.every((m) => m.getType() !== "tool")) {
                return new AIMessage("", {
                  toolCalls: [{ id: "call_1", name: "add", args: '{"a":40,"b":2}' }],
                });
              }
              return new AIMessage("答案是 42");
            },
            async *stream(messages, opts) {
              yield { delta: "", deltaReasoning: "", content: "", done: false };
              yield { done: true, message: await this.invoke(messages, opts) };
            },
          };

          const addTool = tool(async ({ a, b }) => String(a + b), {
            name: "add",
            description: "加法",
            schema: { a: { type: "number" }, b: { type: "number" } },
          });

          const agent = createAgent({
            model: mockModel,
            tools: [addTool],
            systemPrompt: "你是计算助手",
          });

          const result = await agent.invoke({
            messages: [{ role: "user", content: "40 + 2 等于多少？" }],
          });

          const types = result.messages.map((m) => m.getType()).join(",");
          const toolMsg = result.messages.find((m) => m.getType() === "tool");
          const aiToolCallMsg = result.messages.find((m) => m.getType() === "ai" && m.toolCalls.length);

          const checks = {
            trajectory: types === "system,human,ai,tool,ai",
            systemFirst: result.messages[0].getType() === "system",
            toolResult: toolMsg?.content === "42" && toolMsg?.toolCallId === "call_1",
            toolCallRecorded: aiToolCallMsg?.toolCalls[0]?.name === "add",
            finalAnswer: textOf(result.messages.at(-1).content) === "答案是 42",
            toolsPassedToModel: receivedArgs[0]?.tools?.[0]?.function?.name === "add",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { types, toolMsg, checks, opts: receivedArgs[0] },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="agent: stream updates 模式按节点推送（model→tools→model）">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent } = await import("../chain/agent.js");
          const { AIMessage } = await import("../chain/messages.js");
          const { tool } = await import("../chain/tools.js");

          const mockModel = {
            async invoke(messages) {
              if (messages.every((m) => m.getType() !== "tool")) {
                return new AIMessage("", {
                  toolCalls: [{ id: "c1", name: "echo", args: '{"v":"hi"}' }],
                });
              }
              return new AIMessage("收到 hi");
            },
            async *stream(messages) {
              yield { done: true, message: await this.invoke(messages) };
            },
          };

          const echoTool = tool(async ({ v }) => `echo:${v}`, {
            name: "echo",
            schema: { v: { type: "string" } },
          });

          const agent = createAgent({ model: mockModel, tools: [echoTool] });

          const chunks = [];
          for await (const chunk of agent.stream(
            { messages: [{ role: "user", content: "echo hi" }] },
            { streamMode: "updates" }
          )) {
            chunks.push(chunk);
          }

          const nodeOrder = chunks.map((c) => Object.keys(c)[0]).join(",");
          const checks = {
            nodeOrder: nodeOrder === "model,tools,model",
            firstModelHasToolCalls: chunks[0].model.messages[0].toolCalls.length === 1,
            toolsNode: chunks[1].tools.messages[0].content === "echo:hi",
            lastModelIsFinal: chunks[2].model.messages[0].content === "收到 hi",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { nodeOrder, chunks, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="agent: stream messages 模式逐 token 推送 + ToolMessage">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent } = await import("../chain/agent.js");
          const { AIMessage, textOf } = await import("../chain/messages.js");
          const { tool } = await import("../chain/tools.js");

          const mockModel = {
            // 第一轮（发起工具）：无文本 token；第二轮（最终回答）：分两个 token 推送
            async *stream(messages) {
              const hasToolResult = messages.some((m) => m.getType() === "tool");
              if (!hasToolResult) {
                yield { done: true, message: new AIMessage("", {
                  toolCalls: [{ id: "c1", name: "echo", args: '{"v":"hi"}' }],
                }) };
                return;
              }
              yield { delta: "收到 ", deltaReasoning: "", content: "收到 ", done: false };
              yield { delta: "hi", deltaReasoning: "", content: "收到 hi", done: false };
              yield { done: true, message: new AIMessage("收到 hi") };
            },
            async invoke() { throw new Error("messages 模式不应调用 invoke"); },
          };

          const echoTool = tool(async ({ v }) => `echo:${v}`, {
            name: "echo",
            schema: { v: { type: "string" } },
          });

          const agent = createAgent({ model: mockModel, tools: [echoTool] });

          const yielded = [];
          for await (const message of agent.stream(
            { messages: [{ role: "user", content: "echo hi" }] },
            { streamMode: "messages" }
          )) {
            yielded.push(message);
          }

          const types = yielded.map((m) => m.getType()).join(",");
          const aiText = yielded
            .filter((m) => m.getType() === "ai")
            .map((m) => textOf(m.content))
            .join("");

          const checks = {
            sequence: types === "tool,ai,ai",
            typewriter: aiText === "收到 hi",
            toolMsgContent: yielded[0].content === "echo:hi",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { types, aiText, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="agent: checkpointer 跨轮记忆（thread_id 隔离 + 不写入 systemPrompt）">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent } = await import("../chain/agent.js");
          const { AIMessage, textOf } = await import("../chain/messages.js");
          const { MemorySaver } = await import("../chain/memory.js");

          // 记录每轮收到的完整消息列表（快照，避免 agent 后续 push 污染记录）
          const rounds = [];
          const mockModel = {
            async invoke(messages) {
              rounds.push([...messages]);
              return new AIMessage(`第${rounds.length}轮回复`);
            },
            async *stream(messages) {
              yield { done: true, message: await this.invoke(messages) };
            },
          };

          const saver = new MemorySaver();
          const agent = createAgent({
            model: mockModel,
            systemPrompt: "你是导师",
            checkpointer: saver,
          });

          const config = { configurable: { thread_id: "learner-001" } };
          await agent.invoke({ messages: [{ role: "user", content: "我叫小林" }] }, config);

          // 换一个 thread_id：不应带上第一轮历史
          await agent.invoke(
            { messages: [{ role: "user", content: "我叫什么？" }] },
            { configurable: { thread_id: "other-thread" } }
          );

          // 同一个 thread_id：应带上第一轮历史
          const third = await agent.invoke(
            { messages: [{ role: "user", content: "我叫什么？" }] },
            config
          );

          const secondRoundTypes = rounds[1].map((m) => m.getType()).join(",");
          const thirdRoundTypes = rounds[2].map((m) => m.getType()).join(",");
          const thirdRoundContents = rounds[2].map((m) => textOf(m.content));
          const saved = await saver.get("learner-001");

          const checks = {
            systemAlwaysInjected:
              rounds.every((msgs) => msgs[0].getType() === "system" && textOf(msgs[0].content) === "你是导师"),
            secondIsolated: secondRoundTypes === "system,human",
            thirdWithHistory: thirdRoundTypes === "system,human,ai,human",
            historyContents: thirdRoundContents[1] === "我叫小林" && thirdRoundContents[2] === "第1轮回复",
            savedNoSystem: saved.every((m) => m.getType() !== "system"),
            savedLength: saved.length === 4, // human,ai,human,ai
            finalAnswer: textOf(third.messages.at(-1).content) === "第3轮回复",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { thirdRoundTypes, thirdRoundContents, savedTypes: saved.map((m) => m.getType()), checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="agent: 未知工具与 maxSteps 保护">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent } = await import("../chain/agent.js");
          const { AIMessage } = await import("../chain/messages.js");

          // 场景一：模型调用了不存在的工具 → 错误信息以 ToolMessage 回给模型
          const unknownToolModel = {
            async invoke(messages) {
              if (messages.every((m) => m.getType() !== "tool")) {
                return new AIMessage("", { toolCalls: [{ id: "x", name: "not_exist", args: "{}" }] });
              }
              return new AIMessage("知道了");
            },
            async *stream(messages) {
              yield { done: true, message: await this.invoke(messages) };
            },
          };

          const agentA = createAgent({ model: unknownToolModel });
          const resultA = await agentA.invoke({ messages: [{ role: "user", content: "hi" }] });
          const toolMsgA = resultA.messages.find((m) => m.getType() === "tool");

          // 场景二：模型永远发起 tool call → 超过 maxSteps 抛错
          const loopModel = {
            async invoke() {
              return new AIMessage("", { toolCalls: [{ id: "l", name: "t", args: "{}" }] });
            },
            async *stream(messages) {
              yield { done: true, message: await this.invoke(messages) };
            },
          };

          let loopError = null;
          try {
            await createAgent({ model: loopModel, maxSteps: 3 }).invoke({
              messages: [{ role: "user", content: "hi" }],
            });
          } catch (e) {
            loopError = e;
          }

          const checks = {
            unknownToolReadable: toolMsgA?.content.includes("没有找到工具") && toolMsgA.content.includes("not_exist"),
            unknownToolRecover: resultA.messages.at(-1).content === "知道了",
            maxStepsThrows: !!loopError && loopError.message.includes("最大步数"),
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { toolMsgContent: toolMsgA?.content, loopError: loopError?.message, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="chat-model: stream 桥接 onStream 回调为异步迭代器">
    <template>
      <script type="module">
        return (async () => {
          const { createChatModel } = await import("../chain/chat-model.js");
          const { textOf } = await import("../chain/messages.js");

          // 模拟供应商流式协议：两个文本 token + 一个带 toolCalls 的 done
          const fakeAssistant = {
            async chat({ onStream }) {
              onStream({ content: "你", delta: "你", deltaReasoning: "", toolCalls: [], model: "mock", usage: null, done: false });
              onStream({ content: "你好", delta: "好", deltaReasoning: "", toolCalls: [], model: "mock", usage: null, done: false });
              onStream({
                content: "你好", delta: "", deltaReasoning: "",
                toolCalls: [{ id: "c1", function: { name: "calc", arguments: "{}" } }],
                model: "mock", usage: { prompt_tokens: 1, completion_tokens: 2, total_tokens: 3 },
                done: true,
              });
              return { content: "你好", toolCalls: [{ id: "c1", function: { name: "calc", arguments: "{}" } }], model: "mock" };
            },
          };

          const model = createChatModel({ assistant: fakeAssistant });
          const chunks = [];
          for await (const chunk of model.stream([{ role: "user", content: "打招呼" }])) {
            chunks.push(chunk);
          }

          const last = chunks.at(-1);
          const checks = {
            chunkCount: chunks.length === 3,
            deltas: chunks.slice(0, 2).map((c) => c.delta).join("") === "你好",
            doneFlags: chunks.map((c) => c.done).join(",") === "false,false,true",
            finalMessage: last.message.getType() === "ai" && textOf(last.message.content) === "你好",
            finalToolCalls: last.message.toolCalls[0]?.name === "calc",
            finalUsage: last.message.usageMetadata.totalTokens === 3,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { checks, chunks: chunks.map((c) => ({ delta: c.delta, done: c.done })) },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="chat-model: stream 中 chat 抛错时异步迭代器转发错误">
    <template>
      <script type="module">
        return (async () => {
          const { createChatModel } = await import("../chain/chat-model.js");

          const fakeAssistant = {
            async chat() { throw new Error("no api key available"); },
          };

          const model = createChatModel({ assistant: fakeAssistant });

          let thrown = null;
          const yielded = [];
          try {
            for await (const chunk of model.stream([{ role: "user", content: "hi" }])) {
              yielded.push(chunk);
            }
          } catch (e) {
            thrown = e;
          }

          const checks = {
            errorForwarded: thrown?.message === "no api key available",
            noChunksBeforeError: yielded.length === 0,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { checks, error: thrown?.message, yieldedCount: yielded.length },
          };
        })();
      </script>
    </template>
  </sb-test>

  <!-- supplier 层：流式 tool_calls 累积  -->
  <!-- ============================== -->

  <sb-test name="supplier: 流式 tool_calls 分片累积拼接（assistant 基类）">
    <template>
      <script type="module">
        return (async () => {
          const { Assistant } = await import("../supplier/assistant.js");

          const enc = new TextEncoder();
          const sse = (obj) => enc.encode(`data: ${JSON.stringify(obj)}\n`);

          // OpenAI 风格分片：id/name 只出现一次，arguments 跨 chunk 拼接
          const stream = new ReadableStream({
            start(c) {
              c.enqueue(sse({ choices: [{ delta: { tool_calls: [
                { index: 0, id: "call_1", function: { name: "calc", arguments: '{"expr' } },
              ] } }] }));
              c.enqueue(sse({ choices: [{ delta: { tool_calls: [
                { index: 0, function: { arguments: 'ession":"1+1"}' } },
              ] } }] }));
              c.enqueue(sse({ choices: [{ delta: { tool_calls: [
                { index: 1, id: "call_2", function: { name: "echo", arguments: '{"v":"hi"}' } },
              ] } }] }));
              c.enqueue(enc.encode("data: [DONE]\n"));
              c.close();
            },
          });

          const a = new Assistant(null, "fake");
          a.providerName = "Test";

          const donePayloads = [];
          const result = await a.handleStreamResponse({ body: stream }, (d) => {
            if (d.done) donePayloads.push(d);
          });

          const checks = {
            count: result.toolCalls.length === 2,
            firstIdName: result.toolCalls[0].id === "call_1" && result.toolCalls[0].function.name === "calc",
            argsJoined: result.toolCalls[0].function.arguments === '{"expression":"1+1"}',
            secondCall: result.toolCalls[1].function.name === "echo" && result.toolCalls[1].function.arguments === '{"v":"hi"}',
            donePayloadHasToolCalls: donePayloads[0]?.toolCalls?.length === 2,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { toolCalls: result.toolCalls, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="supplier: 非流式 toolCalls 透传与请求体构建（Kimi mock fetch）">
    <template>
      <script type="module">
        return (async () => {
          const { KimiAssistant } = await import("../supplier/kimi.js");

          const capturedBodies = [];
          const originalFetch = globalThis.fetch;
          globalThis.fetch = async (url, opts) => {
            if (opts?.body) capturedBodies.push(JSON.parse(opts.body));
            return new Response(JSON.stringify({
              choices: [{ message: { content: "", tool_calls: [
                { id: "c1", type: "function", function: { name: "calc", arguments: "{}" } },
              ] } }],
              model: "kimi-k2.6",
              usage: {},
            }), { status: 200, headers: { "Content-Type": "application/json" } });
          };

          let firstResult = null;
          try {
            const a = new KimiAssistant("test-tools", "fake-key");
            firstResult = await a.chat({
              model: "kimi-k2.6",
              messages: [{ role: "user", content: "hi" }],
              tools: [{ type: "function", function: { name: "calc", parameters: { type: "object" } } }],
            });
            await a.chat({ model: "kimi-k2.6", messages: [{ role: "user", content: "hi" }] });
          } finally {
            globalThis.fetch = originalFetch;
          }

          const checks = {
            toolsInBody: capturedBodies[0].tools?.[0]?.function?.name === "calc",
            toolChoiceAuto: capturedBodies[0].tool_choice === "auto",
            noToolsWhenAbsent: capturedBodies[1].tools === undefined && capturedBodies[1].tool_choice === undefined,
            toolCallsReturned: firstResult?.toolCalls?.[0]?.function?.name === "calc",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { capturedBodies, toolCalls: firstResult?.toolCalls, checks },
          };
        })();
      </script>
    </template>
  </sb-test>
