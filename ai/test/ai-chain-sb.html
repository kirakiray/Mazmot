  <sb-test name="tool: toWire() 生成 JSON Schema（required / properties）">
    <template>
      <script type="module">
        return (async () => {
          const { tool } = await import("../chain/tools.js");

          const calcTool = tool(
            async ({ expr }) => expr,
            {
              name: "calc",
              description: "计算表达式",
              schema: {
                expr: { type: "string", description: "表达式" },
                digits: { type: "number", optional: true },
              },
            },
          );

          const wire = calcTool.toWire();
          const checks = {
            type: wire.type === "function",
            name: wire.function.name === "calc",
            description: wire.function.description === "计算表达式",
            parametersType: wire.function.parameters.type === "object",
            required: JSON.stringify(wire.function.parameters.required) === '["expr"]',
            properties: wire.function.parameters.properties.expr.type === "string" &&
              wire.function.parameters.properties.digits.type === "number",
            optionalStripped: !("optional" in wire.function.parameters.properties.digits),
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { wire, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="tool: invoke 容错（非法 JSON / 缺必填 / 类型错 / 抛异常均返回文本）">
    <template>
      <script type="module">
        return (async () => {
          const { tool } = await import("../chain/tools.js");

          const echoTool = tool(
            async ({ text }) => `ok:${text}`,
            { name: "echo", schema: { text: { type: "string" } } },
          );
          const boomTool = tool(
            async () => { throw new Error("boom"); },
            { name: "boom", schema: {} },
          );

          const results = {
            badJson: await echoTool.invoke("not json"),
            missing: await echoTool.invoke("{}"),
            nullArgs: await echoTool.invoke(null),
            wrongType: await echoTool.invoke('{"text": 123}'),
            ok: await echoTool.invoke('{"text": "hi"}'),
            throwFn: await boomTool.invoke("{}"),
          };

          const checks = {
            badJson: results.badJson.includes("工具参数不是合法 JSON"),
            missing: results.missing === "缺少必填参数：text",
            nullArgs: results.nullArgs === "缺少必填参数：text",
            wrongType: results.wrongType.includes("需要 string 类型"),
            ok: results.ok === "ok:hi",
            throwFn: results.throwFn === "工具执行出错：boom",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { results, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="chat: 无工具单轮 — 返回 content / usage / 轨迹">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent } = await import("../chain/agent.js");

          // fake assistant：按调用序号返回预设响应
          const fakeCalls = [];
          const fakeAssistant = {
            providerName: "fake",
            async chat(opts) {
              fakeCalls.push(opts);
              return {
                content: "你好呀",
                reasoningContent: "思考中",
                toolCalls: [],
                model: "fake-model",
                usage: { prompt_tokens: 10, completion_tokens: 5, total_tokens: 15 },
              };
            },
          };

          const agent = createAgent({ assistant: fakeAssistant });
          const result = await agent.chat({
            messages: [{ role: "user", content: "你好" }],
          });

          const checks = {
            content: result.content === "你好呀",
            reasoning: result.reasoningContent === "思考中",
            model: result.model === "fake-model",
            usage: result.usage.total_tokens === 15,
            noToolCalls: Array.isArray(result.toolCalls) && result.toolCalls.length === 0,
            traceRoles: result.messages.map((m) => m.role).join(",") === "user,assistant",
            traceContent: result.messages[1].content === "你好呀",
            noEmptyToolCallsField: result.messages[1].tool_calls === undefined,
            singleCall: fakeCalls.length === 1,
            noToolsSent: fakeCalls[0].tools === null,
            noSystemByDefault: !fakeCalls[0].messages.some((m) => m.role === "system"),
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="chat: model / thinking / signal / tools 直传给 assistant.chat">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent, tool } = await import("../chain/main.js");

          const passthruCalls = [];
          const passthruAssistant = {
            providerName: "fake",
            async chat(opts) {
              passthruCalls.push(opts);
              return { content: "ok", reasoningContent: "", toolCalls: [], model: opts.model, usage: null };
            },
          };

          const echoTool = tool(async ({ text }) => text, { name: "echo", schema: { text: { type: "string" } } });
          const agent = createAgent({
            assistant: passthruAssistant,
            model: "m1",
            thinking: true,
            reasoningEffort: "max",
            tools: [echoTool],
          });

          const passthruSignal = new AbortController().signal;
          await agent.chat({
            messages: [{ role: "user", content: "hi" }],
            signal: passthruSignal,
          });

          const sent = passthruCalls[0];
          const checks = {
            model: sent.model === "m1",
            thinking: sent.thinking === true,
            reasoningEffort: sent.reasoningEffort === "max",
            signal: sent.signal === passthruSignal,
            stream: sent.stream === false,
            onStream: sent.onStream === null,
            toolsWire: Array.isArray(sent.tools) &&
              sent.tools[0].type === "function" &&
              sent.tools[0].function.name === "echo",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            // 不放含 AbortSignal 的原始对象（postMessage 无法克隆）
            content: { checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="chat: 工具循环 — 轨迹 user/assistant(tool_calls)/tool/assistant，工具收到解析后的参数">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent, tool } = await import("../chain/main.js");

          const loopCalls = [];
          const loopAssistant = {
            providerName: "fake",
            async chat(opts) {
              loopCalls.push(opts);
              if (loopCalls.length === 1) {
                return {
                  content: "",
                  reasoningContent: "",
                  toolCalls: [{ id: "c1", type: "function", function: { name: "echo", arguments: '{"x":"hello"}' } }],
                  model: "fake-model",
                  usage: { prompt_tokens: 10, completion_tokens: 5, total_tokens: 15 },
                };
              }
              return {
                content: "工具说: hello",
                reasoningContent: "",
                toolCalls: [],
                model: "fake-model",
                usage: { prompt_tokens: 20, completion_tokens: 7, total_tokens: 27 },
              };
            },
          };

          const received = [];
          const echoTool = tool(
            async (args) => { received.push(args); return `echo:${args.x}`; },
            { name: "echo", schema: { x: { type: "string" } } },
          );

          const agent = createAgent({ assistant: loopAssistant, tools: [echoTool] });
          const result = await agent.chat({
            messages: [{ role: "user", content: "调用工具" }],
          });

          const roles = result.messages.map((m) => m.role).join(",");
          const toolMsg = result.messages[2];
          const checks = {
            finalContent: result.content === "工具说: hello",
            roles: roles === "user,assistant,tool,assistant",
            toolCallsInTrace: result.messages[1].tool_calls?.[0]?.function?.name === "echo",
            toolMessage: toolMsg.role === "tool" &&
              toolMsg.content === "echo:hello" &&
              toolMsg.tool_call_id === "c1" &&
              toolMsg.name === "echo",
            toolGotParsedArgs: JSON.stringify(received[0]) === '{"x":"hello"}',
            // agent 传快照：第二次调用收到 3 条（最终回答在此调用返回后才 push）
            secondCallSawToolResult: loopCalls[1].messages.length === 3 &&
              loopCalls[1].messages[2].content === "echo:hello",
            usageAccumulated:
              result.usage.prompt_tokens === 30 &&
              result.usage.completion_tokens === 12 &&
              result.usage.total_tokens === 42,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { roles, received, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="chat: maxSteps 超限抛错（模型持续发起工具调用）">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent, tool } = await import("../chain/main.js");

          const loop2Calls = [];
          const loop2Assistant = {
            providerName: "fake",
            async chat(opts) {
              loop2Calls.push(opts);
              return {
                content: "",
                reasoningContent: "",
                toolCalls: [{ id: `c${loop2Calls.length}`, type: "function", function: { name: "echo", arguments: "{}" } }],
                model: "fake-model",
                usage: null,
              };
            },
          };

          const echoTool = tool(async () => "x", { name: "echo", schema: {} });
          const agent = createAgent({ assistant: loop2Assistant, tools: [echoTool], maxSteps: 3 });

          try {
            await agent.chat({ messages: [{ role: "user", content: "hi" }] });
            return { assert: false, content: { error: "未抛错" } };
          } catch (e) {
            const checks = {
              message: e.message.includes("3"),
              calledMaxTimes: loop2Calls.length === 3,
            };
            return {
              assert: Object.values(checks).every(Boolean),
              content: { error: e.message, calls: loop2Calls.length, checks },
            };
          }
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="chat: stream 事件顺序 text → toolCalls → toolResult → text → done">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent, tool } = await import("../chain/main.js");

          const streamCalls = [];
          const streamAssistant = {
            providerName: "fake",
            async chat(opts) {
              streamCalls.push(opts);
              const res = streamCalls.length === 1
                ? {
                    deltas: ["你", "好"],
                    content: "",
                    toolCalls: [{ id: "c1", type: "function", function: { name: "echo", arguments: '{"x":"1"}' } }],
                  }
                : { deltas: ["完", "成"], content: "完成", toolCalls: [] };
              // 模拟 supplier 流式：先逐段回调，再返回累积结果
              if (opts.onStream && res.deltas) {
                let acc = "";
                for (const d of res.deltas) {
                  acc += d;
                  opts.onStream({ content: acc, delta: d, reasoningContent: "", deltaReasoning: "", done: false });
                }
              }
              return {
                content: res.content ?? "",
                reasoningContent: "",
                toolCalls: res.toolCalls ?? [],
                model: "fake-model",
                usage: { prompt_tokens: 1, completion_tokens: 1, total_tokens: 2 },
              };
            },
          };

          const echoTool = tool(async ({ x }) => `r:${x}`, { name: "echo", schema: { x: { type: "string" } } });
          const agent = createAgent({ assistant: streamAssistant, tools: [echoTool] });

          const events = [];
          const result = await agent.chat({
            messages: [{ role: "user", content: "hi" }],
            stream: true,
            onStream: (ev) => events.push(ev.type === "text" ? { type: "text", delta: ev.delta } : ev),
          });

          const types = events.map((ev) => ev.type).join(",");
          const textDeltas = events.filter((ev) => ev.type === "text").map((ev) => ev.delta).join("|");
          const doneEv = events.at(-1);
          const checks = {
            order: types === "text,text,toolCalls,toolResult,text,text,done",
            textDeltas: textDeltas === "你|好|完|成",
            toolResultEvent: events[3].type === "toolResult" &&
              events[3].name === "echo" &&
              events[3].result === "r:1",
            doneEvent: doneEv.done === true &&
              doneEv.content === "完成" &&
              doneEv.usage.total_tokens === 4 &&
              doneEv.messages.length === 4,
            resultMatchesDone: result.content === doneEv.content,
            streamPassedToAssistant: streamCalls[0].stream === true && typeof streamCalls[0].onStream === "function",
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { types, textDeltas, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="memory: 同 threadId 第二轮带历史，systemPrompt 不入库">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent, MemorySaver } = await import("../chain/main.js");

          const memCalls = [];
          const memAssistant = {
            providerName: "fake",
            async chat(opts) {
              memCalls.push(opts);
              return {
                content: memCalls.length === 1 ? "第一轮回答" : "第二轮回答",
                reasoningContent: "",
                toolCalls: [],
                model: "fake-model",
                usage: null,
              };
            },
          };

          const saver = new MemorySaver();
          const agent = createAgent({
            assistant: memAssistant,
            systemPrompt: "你是导师",
            checkpointer: saver,
          });

          await agent.chat({ messages: [{ role: "user", content: "我叫小林" }], threadId: "t1" });
          await agent.chat({ messages: [{ role: "user", content: "我叫什么？" }], threadId: "t1" });

          const stored = await saver.get("t1");
          const secondMessages = memCalls[1].messages;
          const checks = {
            firstCallHasSystem: memCalls[0].messages[0].role === "system" &&
              memCalls[0].messages[0].content === "你是导师",
            secondCallRoles: secondMessages.map((m) => m.role).join(",") === "system,user,assistant,user",
            secondCallHistory: secondMessages[1].content === "我叫小林" &&
              secondMessages[2].content === "第一轮回答",
            storedExcludesSystem: stored[0].role === "user",
            storedLength: stored.length === 4,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { stored, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="memory: 不同 threadId 隔离；delete / clear 生效">
    <template>
      <script type="module">
        return (async () => {
          const { createAgent, MemorySaver } = await import("../chain/main.js");

          const isoCalls = [];
          const isoAssistant = {
            providerName: "fake",
            async chat(opts) {
              isoCalls.push(opts);
              return { content: `第${isoCalls.length}轮`, reasoningContent: "", toolCalls: [], model: "fake-model", usage: null };
            },
          };

          const isoSaver = new MemorySaver();
          const agent = createAgent({ assistant: isoAssistant, checkpointer: isoSaver });

          await agent.chat({ messages: [{ role: "user", content: "A" }], threadId: "t1" });
          await agent.chat({ messages: [{ role: "user", content: "B" }], threadId: "t2" });

          const checks = {
            isolated: isoCalls[1].messages.length === 1 && isoCalls[1].messages[0].content === "B",
            t1Kept: (await isoSaver.get("t1")).length === 2,
            deleteExisting: (await isoSaver.delete("t1")) === true,
            deleteMissing: (await isoSaver.delete("t1")) === false,
            deletedEmpty: (await isoSaver.get("t1")).length === 0,
          };

          await agent.chat({ messages: [{ role: "user", content: "C" }], threadId: "t2" });
          isoSaver.clear();
          checks.cleared = (await isoSaver.get("t2")).length === 0;

          return {
            assert: Object.values(checks).every(Boolean),
            content: { checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="MemorySaver: get 返回副本，外部修改不污染内部">
    <template>
      <script type="module">
        return (async () => {
          const { MemorySaver } = await import("../chain/memory.js");

          const cpSaver = new MemorySaver();
          await cpSaver.set("t1", [{ role: "user", content: "hi" }]);

          const cpGot = await cpSaver.get("t1");
          cpGot.push({ role: "assistant", content: "hack" });
          cpGot[0].content = "mutated";

          const cpAgain = await cpSaver.get("t1");
          const cpUnknown = await cpSaver.get("nope");

          const checks = {
            copyOnRead: cpAgain.length === 1 && cpAgain[0].content === "hi",
            unknownThread: Array.isArray(cpUnknown) && cpUnknown.length === 0,
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { cpAgain, checks },
          };
        })();
      </script>
    </template>
  </sb-test>

  <sb-test name="导出: chain/main.js 暴露 createAgent / tool / toolsToWire / findTool / MemorySaver">
    <template>
      <script type="module">
        return (async () => {
          const chain = await import("../chain/main.js");
          const names = ["createAgent", "tool", "toolsToWire", "findTool", "MemorySaver"];

          const demoTool = chain.tool(async () => "x", { name: "demo", schema: {} });
          const checks = {
            allExported: names.every((n) => typeof chain[n] === "function" || (n === "MemorySaver" && typeof chain[n] === "function")),
            findToolHit: chain.findTool([demoTool], "demo") === demoTool,
            findToolMiss: chain.findTool([demoTool], "other") === null,
            toolsToWire: chain.toolsToWire([demoTool])[0].function.name === "demo",
            pureLayer: true, // chain 模块不 import /nos/*，见 main.js 顶部说明
          };

          return {
            assert: Object.values(checks).every(Boolean),
            content: { checks, exported: names.filter((n) => n in chain) },
          };
        })();
      </script>
    </template>
  </sb-test>
