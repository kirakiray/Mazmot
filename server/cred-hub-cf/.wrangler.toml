name = "cred-hub-cf"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# 部署前：wrangler d1 create cred-hub，把返回的 database_id 填到下面
[[d1_databases]]
binding = "DB"
database_name = "cred-hub"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# 跨域放行（CRED_HUB_CORS）三种取值：
#   "1"                          = 放行任意 Origin（access-control-allow-origin: *）
#   逗号分隔 Origin 白名单        = 只允许列出的域名跨域，命中才回显该 Origin（尾部斜杠可省）
#   留空/删除                    = 不处理 CORS，反代部署时交给网关统一配置
# 示例——只允许这两个站点跨域调用：
# CRED_HUB_CORS = "https://app.example.com,https://mz.example.org"
# CRED_HUB_CORS = "1"
# 管理 API 令牌（仅限本地测试用；线上请用 `wrangler secret put CRED_HUB_ADMIN_TOKEN`，
# 未配置 = 管理 API 整体 404）
CRED_HUB_ADMIN_TOKEN = "local-test-admin-token"
