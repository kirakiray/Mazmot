[package]
name = "ai-relay"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
redb = "4.2.0"
base64 = "0.22"
rand = "0.9"
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
# rustls：纯 Rust TLS，交叉编译 x86 Linux（cargo zigbuild / musl 静态包）无需 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
