[package]
name = "cred-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = { version = "1", features = ["preserve_order"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
base64 = "0.22"
sha2 = "0.10"
redb = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors"] }
